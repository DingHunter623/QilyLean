<script>
(function(){
  var grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty');
  var cards=[];
  function clean(node){
    node.querySelectorAll('script,style,form,button,input,textarea,select,iframe').forEach(function(n){n.remove()});
    node.querySelectorAll('*').forEach(function(el){Array.from(el.attributes||[]).forEach(function(a){if(/^on/i.test(a.name))el.removeAttribute(a.name)});});
    node.querySelectorAll('a').forEach(function(a){var span=document.createElement('span');span.innerHTML=a.innerHTML;a.replaceWith(span)});
    return node;
  }
  function render(q){q=(q||'').trim().toLowerCase();var shown=0;cards.forEach(function(c){var ok=!q||c.text.toLowerCase().indexOf(q)>-1;c.el.hidden=!ok;if(ok)shown++});count.textContent='当前显示 '+shown+' / '+cards.length+' 项术语';empty.style.display=shown?'none':'block';}
  fetch('/knowledge/terminology.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('source');return r.text()}).then(function(html){
    var doc=new DOMParser().parseFromString(html,'text/html');var source=Array.from(doc.querySelectorAll('[data-term-card]'));
    source.forEach(function(item){var clone=clean(item.cloneNode(true));clone.removeAttribute('id');clone.removeAttribute('data-term-card');grid.appendChild(clone);cards.push({el:clone,text:clone.textContent||''});});
    var params=new URLSearchParams(location.search);var q=params.get('opl')||params.get('term')||params.get('q')||'';search.value=q;render(q);
  }).catch(function(){count.textContent='术语数据暂时无法读取，请稍后重试。';});
  search.addEventListener('input',function(){render(search.value)});
})();
</script>
