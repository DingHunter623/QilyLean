<script>
(function(){
var params=new URLSearchParams(location.search),date=params.get('date'),initialQ=params.get('q')||'',items=[],grid=document.getElementById('grid'),search=document.getElementById('search'),meta=document.getElementById('meta');
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function render(q){q=(q||'').trim().toLowerCase();grid.innerHTML='';var filtered=items.filter(function(x){return !q||(x.title+' '+x.summary+' '+x.theme+' '+x.date).toLowerCase().indexOf(q)>-1});filtered.forEach(function(x){var a=document.createElement('a');a.className='brief';a.href='/global-knowledge/briefs/?date='+encodeURIComponent(x.date);a.innerHTML='<small>'+esc(x.date)+'｜'+esc(x.theme)+'</small><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p>';grid.appendChild(a)});meta.textContent='当前显示 '+filtered.length+' / '+items.length+' 篇精选简报';}
function sanitize(root){
root.querySelectorAll('script,style,header,footer,nav,form,button,input,textarea,select,iframe').forEach(function(n){n.remove()});
root.querySelectorAll('a').forEach(function(a){var href=a.getAttribute('href')||'';if(/^#/.test(href))return;var m=href.match(/\/knowledge\/terminology\.html\?(?:[^#]*&)?(?:opl|term)=([^&#]+)/i);if(m){a.href='/global-knowledge/terminology/?opl='+m[1];return;}var d=href.match(/\/qilylean\/daily\/(\d{4}-\d{2}-\d{2})\.html/i);if(d){a.href='/global-knowledge/briefs/?date='+d[1];return;}var span=document.createElement('span');span.innerHTML=a.innerHTML;a.replaceWith(span)});
root.querySelectorAll('.module-actions,.actions,.card-actions,.hero-actions').forEach(function(n){if(!(n.textContent||'').trim())n.remove()});
/* Presentation firewall: imported briefs contribute knowledge content, never their source-page visual skin. */
root.querySelectorAll('*').forEach(function(el){Array.from(el.attributes||[]).forEach(function(a){if(/^on/i.test(a.name)||a.name==='class'||a.name==='style')el.removeAttribute(a.name)});});
return root;}
function loadReader(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return;fetch('/qilylean/daily/'+d+'.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('brief');return r.text()}).then(function(html){var doc=new DOMParser().parseFromString(html,'text/html');var src=doc.querySelector('article.knowledge-brief-article,article.post');if(!src)throw new Error('article');var clone=sanitize(src.cloneNode(true));var title=src.getAttribute('data-brief-title')||doc.querySelector('h1')&&doc.querySelector('h1').textContent||d;var summary=src.getAttribute('data-brief-summary')||doc.querySelector('meta[name="description"]')&&doc.querySelector('meta[name="description"]').content||'';var theme=src.getAttribute('data-brief-theme')||'';document.getElementById('readerHead').innerHTML='<small>'+esc(d)+(theme?'｜'+esc(theme):'')+'</small><h1>'+esc(title)+'</h1><p>'+esc(summary)+'</p>';var article=document.getElementById('article');article.innerHTML='';while(clone.firstChild)article.appendChild(clone.firstChild);document.getElementById('reader').classList.add('active');document.title=title+'｜QilyLean Global Knowledge';}).catch(function(){document.getElementById('reader').classList.add('active');document.getElementById('readerHead').innerHTML='<h1>简报暂时无法读取</h1><p>请返回目录后稍后重试。</p>';});}
fetch('/qilylean/daily/index.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){items=Array.isArray(data)?data:[];search.value=initialQ;render(initialQ);if(date)loadReader(date)}).catch(function(){meta.textContent='精选简报目录暂时无法读取。'});search.addEventListener('input',function(){render(search.value)});
})();
</script>
