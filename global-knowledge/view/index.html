<script>
(function(){
var ALLOWED=[
'/qilylean/lean-tools.html','/qilylean/gbt2828.html','/qilylean/execution-loop.html','/qilylean/lean-knowledge.html','/knowledge/pdca-gantt-milestone-opl.html','/%E7%8E%B0%E5%9C%BA%E7%AE%A1%E7%90%86.pdf','/现场管理.pdf','/qilylean/production-operations-organization.html','/knowledge/smed-injection-mold-change.html','/qilylean/reference-materials.html','/knowledge/seat-switch-one-piece-flow.html','/qilylean/reference-one-piece-flow.html','/knowledge/customer-audit-document-control.html','/qilylean/reference-audit-documents.html','/knowledge/iatf16949-core-tools.html','/qilylean/reference-iatf16949-core-tools.html'
];
var params=new URLSearchParams(location.search),raw=params.get('src')||'',hash='';try{raw=decodeURIComponent(raw)}catch(e){}if(raw.indexOf('#')>-1){hash=raw.slice(raw.indexOf('#'));raw=raw.slice(0,raw.indexOf('#'));}
function normalized(p){try{return decodeURI(p)}catch(e){return p}}
function allowed(p){var n=normalized(p);return ALLOWED.some(function(x){return normalized(x)===n})}
function viewerHref(href){try{var u=new URL(href,location.origin);if(u.origin!==location.origin)return null;var p=u.pathname;if(!allowed(p))return null;return '/global-knowledge/view/?src='+encodeURIComponent(p+(u.hash||''));}catch(e){return null}}
function sanitize(root){
root.querySelectorAll('script,style,header,footer,nav,form,button,input,textarea,select,iframe,object,embed,[data-qily-dock],[id="floatDock"],.qily-float-dock,.site-header,.qily-site-header,.topbar').forEach(function(n){n.remove()});
root.querySelectorAll('a').forEach(function(a){var href=a.getAttribute('href')||'';if(/^#/.test(href))return;var tm=href.match(/\/knowledge\/terminology\.html\?(?:[^#]*&)?(?:opl|term)=([^&#]+)/i);if(tm){a.href='/global-knowledge/terminology/?opl='+tm[1];return;}var dm=href.match(/\/qilylean\/daily\/(\d{4}-\d{2}-\d{2})\.html/i);if(dm){a.href='/global-knowledge/briefs/?date='+dm[1];return;}var safe=viewerHref(href);if(safe){a.href=safe;return;}if(/\/(cooperation|links|projects|contact|trust|capabilities|experience|improvements|lean-production)\/?/i.test(href)){a.remove();return;}var span=document.createElement('span');span.innerHTML=a.innerHTML;a.replaceWith(span);});
root.querySelectorAll('.module-actions,.actions,.card-actions,.hero-actions').forEach(function(n){if(!(n.textContent||'').trim())n.remove()});
/* Presentation firewall: white-listed documents contribute content, never source-page visual skin. */
root.querySelectorAll('*').forEach(function(el){Array.from(el.attributes||[]).forEach(function(a){if(/^on/i.test(a.name)||a.name==='class'||a.name==='style')el.removeAttribute(a.name)});});
return root;
}
var content=document.getElementById('content'),title=document.getElementById('title');
if(!allowed(raw)){title.textContent='该资料不在知识白名单';content.innerHTML='<div class="error">为保持知识与经营功能物理隔离，本阅读器只允许访问经过审核的知识资料。</div>';return;}
if(/\.pdf$/i.test(raw)){title.textContent='培训资料在线阅读';content.innerHTML='<iframe class="pdf" title="培训资料" src="'+raw.replace(/"/g,'&quot;')+'"></iframe>';return;}
fetch(raw,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('source');return r.text()}).then(function(html){var doc=new DOMParser().parseFromString(html,'text/html');var t=(doc.querySelector('h1')&&doc.querySelector('h1').textContent)||doc.title||'知识资料';title.textContent=t.replace(/\s*[｜|].*$/,'');document.title=title.textContent+'｜QilyLean Global Knowledge';var src=doc.querySelector('main')||doc.body;var clone=sanitize(src.cloneNode(true));content.innerHTML='';while(clone.firstChild)content.appendChild(clone.firstChild);if(hash){setTimeout(function(){var el=content.querySelector(hash);if(el)el.scrollIntoView({block:'start'})},60);}}).catch(function(){title.textContent='知识资料暂时无法读取';content.innerHTML='<div class="error">请返回资料目录后稍后重试。</div>';});
})();
</script>
