<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">制造改善项目佐证资料概览</title>
<desc id="desc">三份公开脱敏PDF、十七页资料、八项改善课题及第三季度可量化年度贡献三百五十七点九一万元。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6f4"/><stop offset="1" stop-color="#dcebea"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f4b5a" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="70" y="64" width="1060" height="632" rx="30" fill="#fff" stroke="#c5d8d6" stroke-width="3" filter="url(#shadow)"/>
<rect x="70" y="64" width="1060" height="22" rx="11" fill="#caa15f"/>
<text x="120" y="150" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#8d6a32">PROJECT EVIDENCE / PUBLIC REDACTION</text>
<text x="120" y="215" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="54" font-weight="800" fill="#0f4b5a">制造改善项目佐证</text>
<text x="120" y="265" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" fill="#5f7474">立项 · 评审 · 核算 · 激励 · 现场兑现</text>
<g transform="translate(120 330)">
  <g><rect width="210" height="170" rx="22" fill="#f7fbfa" stroke="#d5e4e3" stroke-width="2"/><text x="105" y="72" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="52" font-weight="800" fill="#0f4b5a">3份</text><text x="105" y="120" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#5f7474">公开脱敏PDF</text></g>
  <g transform="translate(240 0)"><rect width="210" height="170" rx="22" fill="#f7fbfa" stroke="#d5e4e3" stroke-width="2"/><text x="105" y="72" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="52" font-weight="800" fill="#0f4b5a">17页</text><text x="105" y="120" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#5f7474">评审与照片资料</text></g>
  <g transform="translate(480 0)"><rect width="210" height="170" rx="22" fill="#f7fbfa" stroke="#d5e4e3" stroke-width="2"/><text x="105" y="72" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="52" font-weight="800" fill="#0f4b5a">8项</text><text x="105" y="120" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#5f7474">第三季度课题</text></g>
  <g transform="translate(720 0)"><rect width="220" height="170" rx="22" fill="#0f4b5a"/><text x="110" y="68" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="40" font-weight="800" fill="#fff">357.91万</text><text x="110" y="120" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" fill="#dcebea">可量化年度贡献</text></g>
</g>
<g transform="translate(120 565)"><circle cx="24" cy="24" r="24" fill="#caa15f"/><path d="M14 24l7 7 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="33" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" fill="#496565">企业内部评审文件、财务贡献核算、风险评价及奖励发放记录</text></g>
</svg>
