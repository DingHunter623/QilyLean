# QilyLean China production Nginx configuration
# Personal manufacturing knowledge site; no commercial routing.

# Canonical HTTP entry: always move to HTTPS root domain.
server {
    listen 80;
    listen [::]:80;
    server_name qilylean.cn www.qilylean.cn;
    server_tokens off;

    return 301 https://qilylean.cn$request_uri;
}

# Canonicalize www over HTTPS to the root domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qilylean.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/qilylean.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qilylean.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://qilylean.cn$request_uri;
}

# Canonical production site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qilylean.cn;

    root /var/www/qilylean-cn/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/qilylean.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qilylean.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
