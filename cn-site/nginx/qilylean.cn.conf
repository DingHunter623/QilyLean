# QilyLean China production Nginx baseline
# Activate only after the mainland server, domain DNS and ICP prerequisites are satisfied.

server {
    listen 80;
    listen [::]:80;
    server_name qilylean.cn www.qilylean.cn;

    root /var/www/qilylean-cn/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Keep HTTP available for certificate/filing validation as required by the chosen provider.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

