# QilyLean China production Nginx configuration
# Personal manufacturing knowledge site; no commercial routing.
#
# Full-quality media mirror cache:
# browsers stay on qilylean.cn; the Tencent server fetches the exact original
# bytes from qilylean.com on first request and reuses the cached copy.
proxy_cache_path /var/cache/nginx/qilylean-media levels=1:2 keys_zone=qily_media:20m max_size=2g inactive=90d use_temp_path=off;

# Canonical HTTP entry: always move to HTTPS root domain.
server {
    listen 80;
    listen [::]:80;
    server_name qilylean.cn www.qilylean.cn;
    server_tokens off;

    return 301 https://qilylean.cn$request_uri;
}

# Canonicalize www over HTTPS to the root domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qilylean.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/qilylean.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qilylean.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://qilylean.cn$request_uri;
}

# Canonical production site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qilylean.cn;

    root /var/www/qilylean-cn/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/qilylean.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qilylean.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # The mainland server calls Youdao directly; browsers use only this origin.
    location = /translate {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8081/translate;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /mirror-media/ {
        rewrite ^/mirror-media/(.*)$ /$1 break;
        proxy_set_header Host qilylean.com;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name qilylean.com;
        proxy_pass https://qilylean.com;
        proxy_cache qily_media;
        proxy_cache_key "$scheme://qilylean.com$uri";
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;
        add_header X-QilyLean-Media-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # This shared VI entry is updated in place; revalidate it instead of
    # keeping an obsolete visual authority in existing browser caches.
    location = /assets/qilylean-vi-v2.css {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
