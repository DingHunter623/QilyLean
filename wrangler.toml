name = "qilylean-ai"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-5.6-terra"
MAX_OUTPUT_TOKENS = "1400"
DAILY_IP_LIMIT = "20"
CONSULTATION_DAILY_IP_LIMIT = "5"

[observability]
enabled = true
