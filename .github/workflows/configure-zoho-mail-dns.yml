name: Configure Zoho mail DNS

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == '[ops] Configure Zoho mail DNS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NAMESILO_API_KEY: ${{ secrets.NAMESILO_API_KEY }}
      DOMAIN: qilylean.com
      DKIM_HOST: zmail._domainkey
      SPF_VALUE: v=spf1 include:zohomail.com.cn ~all
      DKIM_VALUE: v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCavOSWmc5ijAfkGNNIjc+BpLUXwQOL4w3mBmpOQJos1ULQXFrXKowmafcJWs94bdpuP1fuhxDoU4GpuUKLapdbAtpplvVmpUwVSOeP3ndaQp4mS/n8Y/QaXfphbxSKAsFe92/c6wBaOzFzfihlC6EQni9wskji1pBEa1IIG3zMOQIDAQAB
    steps:
      - name: Require NameSilo API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAMESILO_API_KEY" || { echo 'Missing NAMESILO_API_KEY'; exit 2; }

      - name: Read current NameSilo DNS records
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -G 'https://www.namesilo.com/api/dnsListRecords' \
            --data-urlencode 'version=1' \
            --data-urlencode 'type=json' \
            --data-urlencode "key=$NAMESILO_API_KEY" \
            --data-urlencode "domain=$DOMAIN")
          code=$(jq -r '.reply.code // empty' <<<"$response")
          detail=$(jq -r '.reply.detail // empty' <<<"$response")
          echo "NameSilo list response: code=$code detail=$detail"
          test "$code" = "300" || { jq '.reply' <<<"$response"; exit 1; }
          records=$(jq -c '(.reply.resource_record // []) | if type=="array" then . else [.] end' <<<"$response")
          printf '%s' "$records" > /tmp/records.json
          echo 'Current mail-related records:'
          jq -r '.[] | select(.type=="MX" or .type=="TXT") | "type=\(.type) host=\(.host) value=\(.value) priority=\(.distance) ttl=\(.ttl)"' /tmp/records.json

      - name: Validate SPF configuration
        shell: bash
        run: |
          set -euo pipefail
          spf_count=$(jq --arg v "$SPF_VALUE" '[.[] | select(.type=="TXT" and .value==$v)] | length' /tmp/records.json)
          all_spf_count=$(jq '[.[] | select(.type=="TXT" and (.value | startswith("v=spf1")))] | length' /tmp/records.json)
          echo "Matching Zoho SPF records: $spf_count"
          echo "Total SPF records: $all_spf_count"
          test "$spf_count" -eq 1 || { echo 'Zoho SPF is missing or duplicated.'; exit 1; }
          test "$all_spf_count" -eq 1 || { echo 'Multiple SPF records detected; merge required.'; exit 1; }

      - name: Add or update DKIM TXT record
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$DKIM_HOST.$DOMAIN"
          record=$(jq -c --arg host "$DKIM_HOST" --arg fqdn "$fqdn" '.[] | select(.type=="TXT" and (.host==$host or .host==$fqdn))' /tmp/records.json | head -n1 || true)
          if [ -n "$record" ]; then
            current_value=$(jq -r '.value' <<<"$record")
            rrid=$(jq -r '.record_id' <<<"$record")
            if [ "$current_value" = "$DKIM_VALUE" ]; then
              echo 'DKIM record already exists with the required value.'
              exit 0
            fi
            echo 'Updating existing DKIM record.'
            response=$(curl -fsS -G 'https://www.namesilo.com/api/dnsUpdateRecord' \
              --data-urlencode 'version=1' \
              --data-urlencode 'type=json' \
              --data-urlencode "key=$NAMESILO_API_KEY" \
              --data-urlencode "domain=$DOMAIN" \
              --data-urlencode "rrid=$rrid" \
              --data-urlencode "rrhost=$DKIM_HOST" \
              --data-urlencode "rrvalue=$DKIM_VALUE" \
              --data-urlencode 'rrttl=3600')
          else
            echo 'Adding DKIM TXT record.'
            response=$(curl -fsS -G 'https://www.namesilo.com/api/dnsAddRecord' \
              --data-urlencode 'version=1' \
              --data-urlencode 'type=json' \
              --data-urlencode "key=$NAMESILO_API_KEY" \
              --data-urlencode "domain=$DOMAIN" \
              --data-urlencode 'rrtype=TXT' \
              --data-urlencode "rrhost=$DKIM_HOST" \
              --data-urlencode "rrvalue=$DKIM_VALUE" \
              --data-urlencode 'rrttl=3600')
          fi
          code=$(jq -r '.reply.code // empty' <<<"$response")
          detail=$(jq -r '.reply.detail // empty' <<<"$response")
          echo "NameSilo write response: code=$code detail=$detail"
          test "$code" = "300" || { jq '.reply' <<<"$response"; exit 1; }

      - name: Verify public DNS propagation
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$DKIM_HOST.$DOMAIN"
          for attempt in $(seq 1 18); do
            dkim=$(dig +short TXT "$fqdn" @1.1.1.1 | tr -d '"\n')
            spf=$(dig +short TXT "$DOMAIN" @1.1.1.1 | tr -d '"\n')
            echo "Attempt $attempt: DKIM length=${#dkim}; SPF present=$([[ "$spf" == *'include:zohomail.com.cn'* ]] && echo yes || echo no)"
            if [ "$dkim" = "$DKIM_VALUE" ] && [[ "$spf" == *'include:zohomail.com.cn'* ]]; then
              echo 'Public DNS verification passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'DNS write succeeded, but public propagation is still pending.'
          exit 3
