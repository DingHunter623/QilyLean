name: Guard Pure DDZ Canonical Aircraft Asset

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-pure-ddz-v110.yml'
      - 'tools/pure-ddz/game/js/card-theme.js'
      - 'assets/aircraft/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-pure-ddz-canonical-aircraft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate single-path aircraft asset contract
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL='assets/aircraft/aircraft-international-20261019-912.webp'
          EXPECTED_BLOB='d02a9bc9a76ec439fd63c30008802c773870cb4e'

          test -f "$CANONICAL"
          test "$(git hash-object "$CANONICAL")" = "$EXPECTED_BLOB"
          test "$(head -c 4 "$CANONICAL")" = 'RIFF'
          test "$(dd if="$CANONICAL" bs=1 skip=8 count=4 2>/dev/null)" = 'WEBP'
          test ! -e 'assets/qilylean-aircraft-hero-approved-20260826.png'

          node --check tools/pure-ddz/game/js/card-theme.js
          grep -Fq "siteAssetUrl('aircraft/aircraft-international-20261019-912.webp')" tools/pure-ddz/game/js/card-theme.js

          test ! -e tools/pure-ddz/game/assets/pure-ddz/airplane-joker.png
          test ! -e qilylean/c919-strategy-hero-v14.png
          test ! -e '官网首图.png'

          ! grep -Fq "assetUrl('airplane-joker.png')" tools/pure-ddz/game/js/card-theme.js
          git diff --check
