name: Guard Pure DDZ Canonical Aircraft Asset

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-pure-ddz-v110.yml'
      - 'tools/pure-ddz/game/js/card-theme.js'
      - 'assets/qilylean-aircraft-hero-approved-20260826.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-pure-ddz-canonical-aircraft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate single-path aircraft asset contract
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL='assets/qilylean-aircraft-hero-approved-20260826.png'
          EXPECTED_BLOB='9792c9a07a0304ebb925d4518b8e01fdb3d982b4'

          test -f "$CANONICAL"
          test "$(git hash-object "$CANONICAL")" = "$EXPECTED_BLOB"
          test "$(xxd -p -l 8 "$CANONICAL")" = '89504e470d0a1a0a'

          node --check tools/pure-ddz/game/js/card-theme.js
          grep -Fq "siteAssetUrl('qilylean-aircraft-hero-approved-20260826.png')" tools/pure-ddz/game/js/card-theme.js

          test ! -e tools/pure-ddz/game/assets/pure-ddz/airplane-joker.png
          test ! -e qilylean/c919-strategy-hero-v14.png
          test ! -e '官网首图.png'

          ! grep -Fq "assetUrl('airplane-joker.png')" tools/pure-ddz/game/js/card-theme.js
          git diff --check
