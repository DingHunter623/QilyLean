name: Verify Pure DDZ Capability Showcase

on:
  pull_request:
    paths:
      - 'capabilities/index.html'
      - 'pure-ddz-capability-visual-v2.css'
      - 'capability-digital-tools-layout-v1.css'
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - '.github/workflows/verify-pure-ddz-capability-showcase.yml'
  push:
    branches: [main]
    paths:
      - 'capabilities/index.html'
      - 'pure-ddz-capability-visual-v2.css'
      - 'capability-digital-tools-layout-v1.css'
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - '.github/workflows/verify-pure-ddz-capability-showcase.yml'
  workflow_dispatch:

jobs:
  verify-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify V158 capability and knowledge-card identity
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check scripts/materialize-ddz-public-ui-20260824.js
          grep -Fq 'qily-rank-suit-line' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'ruleRankText(card))}${escapeHtml(card.suit)}' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "version:'1.5.5-knowledge-52'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "3:{code:'IE 7 Tools',title:'IE七大手法'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "4:{code:'ECRS',title:'改善四原则'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq '取消·合并·重排·简化' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "5:{code:'VSM',title:'价值流图分析'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "3:{code:'Kaizen',title:'持续改善'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "4:{code:'PDCA',title:'改善闭环'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "5:{code:'5M2E',title:'要因分析'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq '人·机·料·法·测·能·环' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "8:{code:'FMEA',title:'失效模式与影响分析'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "10:{code:'CPK',title:'过程能力指数'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "3:{code:'6S',title:'现场6S管理'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq '整理·整顿·清扫｜清洁·素养·安全' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "4:{code:'TPS',title:'丰田生产方式'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "3:{code:'ERP',title:'企业资源计划'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "4:{code:'MES',title:'制造执行系统'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "5:{code:'APS',title:'高级计划与排程'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "15:{code:'Smart Factory',title:'数智工厂'" tools/pure-ddz/game/js/card-theme.js
          node scripts/materialize-ddz-public-ui-20260824.js
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-core="v158"' tools/pure-ddz/index.html
          grep -Fq 'window.__PURE_DDZ_STYLE_READY__=Promise.resolve();' tools/pure-ddz/index.html
          ! grep -Fq "loadStyle('css/ddz-core-v155.css')" tools/pure-ddz/index.html
          grep -Fq "const chain=['js/ddz-core-v155.js'];" tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-fast-shell="v155"' tools/pure-ddz/index.html
          grep -Fq 'color:#0f4b5a!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'color:#173c45!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq 'width:80vw' tools/pure-ddz/game/js/card-theme.js
          ! grep -Fq '#floatDock' tools/pure-ddz/game/js/card-theme.js
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/card-comfort-v122.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/mobile-landscape-v153.css
          test -f tools/pure-ddz/game/css/mobile-landscape-v153.css
          test -f tools/pure-ddz/game/css/card-knowledge-v155.css
          test -f tools/pure-ddz/game/css/visual-tuning-v158.css
          test -f tools/pure-ddz/game/css/ddz-core-v155.css
          test -f tools/pure-ddz/game/js/ddz-core-v155.js
          test -f pure-ddz-capability-visual-v2.css
          grep -Fq 'capability-ddz-card' capabilities/index.html
          ! grep -Fq 'Android版暂未开放' tools/pure-ddz/index.html
          ! grep -Fq 'Android版待网页版验证确认后开放' tools/pure-ddz/index.html
          ! grep -Fq 'Android 可离线使用' tools/pure-ddz/index.html
          git diff --check
