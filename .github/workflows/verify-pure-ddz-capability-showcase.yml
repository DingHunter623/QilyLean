name: Verify Pure DDZ Capability Showcase

on:
  pull_request:
    paths:
      - 'capabilities/index.html'
      - 'pure-ddz-capability-visual-v2.css'
      - 'capability-digital-tools-layout-v1.css'
      - 'tools/pure-ddz/**'
      - '.github/workflows/verify-pure-ddz-capability-showcase.yml'
  push:
    branches: [main]
    paths:
      - 'capabilities/index.html'
      - 'pure-ddz-capability-visual-v2.css'
      - 'capability-digital-tools-layout-v1.css'
      - 'tools/pure-ddz/**'
      - '.github/workflows/verify-pure-ddz-capability-showcase.yml'
  workflow_dispatch:

jobs:
  verify-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify capability and card identity
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'qily-rank-suit-line' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "ruleRankText(card))}${escapeHtml(card.suit)}" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "3:{code:'现场'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "5:{code:'精益'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "7:{code:'数智'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "9:{code:'IE'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "10:{code:'ECRS'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "11:{code:'SMED'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "12:{code:'VSM'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "13:{code:'TPM'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "14:{code:'OEE'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "15:{code:'FLOW'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq '20260902-ddz-integrated-v150' tools/pure-ddz/index.html
          ! grep -Fq 'width:80vw' tools/pure-ddz/game/js/card-theme.js
          ! grep -Fq '#floatDock' tools/pure-ddz/game/js/card-theme.js
          test -f pure-ddz-capability-visual-v2.css
          grep -Fq 'capability-ddz-card' capabilities/index.html