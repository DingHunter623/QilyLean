name: Verify Pure DDZ Capability Showcase

on:
  pull_request:
    paths:
      - 'capabilities/index.html'
      - 'pure-ddz-capability-visual-v2.css'
      - 'capability-digital-tools-layout-v1.css'
      - 'app-download-share-v1.js'
      - 'scripts/fix-capabilities-visuals-20260824.js'
      - 'scripts/publish-qilylean-home-v2.py'
      - 'site-certificate-facts-v2.js'
      - 'site-ui-consistency-v1.js'
      - 'tools/pure-ddz/**'
      - '.github/workflows/verify-pure-ddz-capability-showcase.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize capability source-of-truth fixes
        run: |
          set -euo pipefail
          node --check scripts/fix-capabilities-visuals-20260824.js
          node --check app-download-share-v1.js
          node --check site-certificate-facts-v2.js
          python3 -m py_compile scripts/publish-qilylean-home-v2.py
          node scripts/fix-capabilities-visuals-20260824.js
      - name: Verify repository contract
        run: |
          set -euo pipefail
          node --check site-ui-consistency-v1.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          ! grep -q 'section.id=.qilyPureDdzStableEntry' site-ui-consistency-v1.js
          grep -q 'removeLegacyPureDdzHomeEntry' site-ui-consistency-v1.js
          grep -q 'pure-ddz-digital-tool' capabilities/index.html
          grep -q 'ding-qili-ai-avatar-560.webp' capabilities/index.html
          grep -q 'c919-strategy-hero-v14.png' capabilities/index.html
          grep -q 'qilyPureDdzCapabilityVisualV2' capabilities/index.html
          grep -q '/pure-ddz-capability-visual-v2.css?v=20260824-heart-a-v7' capabilities/index.html
          grep -q 'flex-direction:column-reverse!important' pure-ddz-capability-visual-v2.css
          grep -q '\-webkit-text-fill-color:#fff!important' pure-ddz-capability-visual-v2.css
          grep -q '\-webkit-text-fill-color:#ffe39b!important' pure-ddz-capability-visual-v2.css
          grep -q 'linear-gradient(145deg,#dff3ed,#eef8f6)' pure-ddz-capability-visual-v2.css
          grep -q 'linear-gradient(150deg,#137a71,#187784 58%,#146b77)' pure-ddz-capability-visual-v2.css
          grep -q 'object-fit:contain!important' pure-ddz-capability-visual-v2.css
          grep -q 'data-qily-home-actions="20260824-v2"' capabilities/index.html
          grep -q 'data-app-share-qr="qilyleanHome"' capabilities/index.html
          grep -q 'data-app-share-link="qilyleanHome"' capabilities/index.html
          grep -q '/app-download-share-v1.js?v=20260824-capability-home-actions-v2' capabilities/index.html
          grep -q "homeResult.textContent='当前版本：v2.3.3" app-download-share-v1.js
          for label in '下载 Android APK' '下载说明' '扫码下载' '分享下载页' '隐私政策' '用户协议' '技术支持'; do
            grep -q "$label" scripts/publish-qilylean-home-v2.py
          done
          grep -q 'A♥' capabilities/index.html
          ! grep -q '<strong>A♠</strong>' capabilities/index.html
          grep -q 'K♣' capabilities/index.html
          grep -q 'Q♥' capabilities/index.html
          grep -q "player === 1 ? '左家' : '右家'" tools/pure-ddz/game/js/game.js
          ! grep -q '左家电脑' tools/pure-ddz/game/js/game.js
          ! grep -q '右家电脑' tools/pure-ddz/game/js/game.js
          grep -q "positionClass(player)" tools/pure-ddz/game/js/visual-v120.js
          grep -q 'v120-reset-stats' tools/pure-ddz/game/js/visual-v120.js
          grep -q 'fitHand' tools/pure-ddz/game/js/visual-v120.js
          grep -q '查看更多' tools/pure-ddz/game/js/visual-v120.js
          grep -q '官网邮箱' tools/pure-ddz/index.html
          ! grep -q '<span>企业邮箱</span>' tools/pure-ddz/index.html
          ! grep -q '待验证后发布' tools/pure-ddz/index.html
          grep -q '20260824-rankline-scroll-v2' tools/pure-ddz/index.html
          grep -q "loadStyle('css/card-layout-v3.css')" tools/pure-ddz/index.html
          grep -q 'flex-direction:row!important' tools/pure-ddz/game/css/card-layout-v3.css
          grep -q 'v120-scroll-cue' tools/pure-ddz/game/css/card-layout-v3.css
          grep -q 'musicMode' tools/pure-ddz/game/js/game.js
          grep -q 'exciting' tools/pure-ddz/game/js/game.js
          grep -q 'playMusicSting' tools/pure-ddz/game/js/game.js
          grep -q "'win'" tools/pure-ddz/game/js/game.js
          grep -q "'lose'" tools/pure-ddz/game/js/game.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 4173 >/tmp/qily-ddz-showcase.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/tools/pure-ddz/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/qily-ddz-showcase.log || true
          exit 1
      - name: Verify capability actions, card grammar, mobile cue, readable showcase, and visible hands
        run: |
          cat > verify-showcase.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:4173';
          async function check(viewport){
            const touch=viewport.width<=900;
            const page=await browser.newPage({viewport,hasTouch:touch});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base+'/tools/pure-ddz/',{waitUntil:'networkidle'});
            const official=await page.locator('.official-info').textContent();
            if(!official.includes('官网邮箱')||official.includes('企业邮箱')) throw new Error('Official email label is not standardized: '+official);
            if((await page.locator('body').textContent()).includes('待验证后发布')) throw new Error('Internal validation wording leaked to public DDZ UI');
            await page.locator('#welcome-start').click();
            await page.waitForFunction(()=>window.PureDDZTest?.getState().hands[0].length===17,{timeout:6000});
            await page.waitForTimeout(600);
            const data=await page.evaluate(()=>{
              window.QilyLeanV120?.fitHand?.();
              const hand=document.querySelector('#hand');const cards=[...document.querySelectorAll('#hand .card')];
              const hr=hand.getBoundingClientRect();const rects=cards.map(c=>c.getBoundingClientRect());
              const normal=cards.find(c=>c.querySelector('.qily-card--normal'));
              const corner=normal?.querySelector('.qily-card-corner');
              const rank=corner?.querySelector('b')?.getBoundingClientRect();
              const suit=corner?.querySelector('i')?.getBoundingClientRect();
              const cue=document.querySelector('#v120-scroll-cue');
              return {
                count:cards.length,first:rects[0],last:rects.at(-1),hand:hr,
                reset:Boolean(document.querySelector('#v120-reset-stats')),
                leftName:document.querySelector('#left-panel .player-name')?.textContent.trim(),
                rightName:document.querySelector('#right-panel .player-name')?.textContent.trim(),
                ready:document.documentElement.classList.contains('ddz-ready'),
                cornerFlex:corner?getComputedStyle(corner).flexDirection:'',
                rank:rank?{top:rank.top,bottom:rank.bottom}:null,
                suit:suit?{top:suit.top,bottom:suit.bottom}:null,
                cueText:cue?.textContent.replace(/\s+/g,'').trim()||'',
                cueDisplay:cue?getComputedStyle(cue).display:''
              };
            });
            if(data.count!==17) throw new Error('Expected 17 visible cards, got '+data.count);
            if(!data.reset) throw new Error('Stats reset button missing');
            if(data.first.left < data.hand.left-2 || data.last.right > data.hand.right+2) throw new Error('Hand cards overflow visible hand area');
            if(data.leftName!=='左家'||data.rightName!=='右家') throw new Error('Player labels not simplified');
            if(!data.ready) throw new Error('First-paint ready class missing');
            if(data.cornerFlex!=='row') throw new Error('Rank/suit corner is not one row: '+data.cornerFlex);
            if(!data.rank||!data.suit||Math.min(data.rank.bottom,data.suit.bottom)<=Math.max(data.rank.top,data.suit.top)) throw new Error('Rank and suit do not visually share one line: '+JSON.stringify(data));
            if(touch&&(!data.cueText.includes('上下滑动')||!data.cueText.includes('查看更多'))) throw new Error('Mobile scroll cue copy is not explicit: '+data.cueText);
            if(touch&&data.cueDisplay==='none') throw new Error('Mobile scroll cue is not visible on scrollable landscape viewport');
            if(errors.length) throw new Error('pageerror: '+errors.join('\n'));
            await page.close();
          }
          const home=await browser.newPage({viewport:{width:1440,height:900}});
          await home.goto(base+'/',{waitUntil:'networkidle'});
          if(await home.locator('#qilyPureDdzStableEntry').count()) throw new Error('Legacy home DDZ section still exists');
          await home.close();
          const cap=await browser.newPage({viewport:{width:1440,height:900}});
          const capErrors=[];cap.on('pageerror',e=>capErrors.push(String(e)));
          await cap.goto(base+'/capabilities/',{waitUntil:'networkidle'});
          if(await cap.locator('#pure-ddz-digital-tool').count()!==1) throw new Error('Capability DDZ digital tool missing');
          if(await cap.locator('#qilyPureDdzCapabilityVisualV2').count()!==1) throw new Error('Capability visual override not mounted');
          if(await cap.locator('.capability-ddz-joker').count()!==2) throw new Error('Joker showcase incomplete');
          if(await cap.locator('.capability-ddz-card').count()!==3) throw new Error('Representative card showcase incomplete');
          const jokerFit=await cap.locator('.capability-ddz-joker.big img').evaluate(el=>getComputedStyle(el).objectFit);
          if(jokerFit!=='contain') throw new Error('Big joker avatar is still cropped');
          for(const joker of await cap.locator('.capability-ddz-joker').all()){
            const pos=await joker.evaluate(el=>{const label=el.querySelector('b').getBoundingClientRect();const img=el.querySelector('img').getBoundingClientRect();return {labelBottom:label.bottom,imgTop:img.top};});
            if(pos.labelBottom>pos.imgTop+2) throw new Error('Joker label is not above image: '+JSON.stringify(pos));
          }
          const ace=cap.locator('.capability-ddz-card').first();
          if((await ace.locator('strong').textContent()).trim()!=='A♥') throw new Error('Representative Ace is not heart Ace');
          if(!(await ace.evaluate(el=>el.classList.contains('red')))) throw new Error('Heart Ace is not using red-card styling');
          const expected=['下载 Android APK','下载说明','扫码下载','分享下载页','隐私政策','用户协议','技术支持'];
          const actions=await cap.locator('#qilylean-home .module-actions > a').allTextContents();
          if(JSON.stringify(actions.map(v=>v.trim()))!==JSON.stringify(expected)) throw new Error('QilyLean Home actions incomplete or out of order: '+JSON.stringify(actions));
          if(await cap.locator('#qilylean-home [data-app-share-qr="qilyleanHome"]').count()!==1) throw new Error('QilyLean Home QR action missing');
          if(await cap.locator('#qilylean-home [data-app-share-link="qilyleanHome"]').count()!==1) throw new Error('QilyLean Home share action missing');
          await cap.locator('#qilylean-home [data-app-share-qr="qilyleanHome"]').click();
          await cap.waitForSelector('#qilyAppShareDialog[open]',{timeout:3000});
          const qrSrc=await cap.locator('#qilyAppShareQr').getAttribute('src');
          if(!qrSrc?.includes('qr-qilylean-home-download.svg')) throw new Error('QilyLean Home QR source incorrect: '+qrSrc);
          await cap.locator('.app-share-close').click();
          const contrast=await cap.evaluate(()=>{
            const title=getComputedStyle(document.querySelector('.capability-ddz-title'));
            const sub=getComputedStyle(document.querySelector('.capability-ddz-sub'));
            const visual=getComputedStyle(document.querySelector('#pure-ddz-digital-tool .capability-ddz-visual'));
            const board=getComputedStyle(document.querySelector('#pure-ddz-digital-tool .capability-ddz-board'));
            return {titleColor:title.color,titleFill:title.webkitTextFillColor,subColor:sub.color,subFill:sub.webkitTextFillColor,visualBg:visual.backgroundImage,boardBg:board.backgroundImage};
          });
          if(contrast.titleColor!=='rgb(255, 255, 255)'||contrast.titleFill!=='rgb(255, 255, 255)') throw new Error('DDZ title is not forced white: '+JSON.stringify(contrast));
          if(contrast.subColor!=='rgb(255, 227, 155)'||contrast.subFill!=='rgb(255, 227, 155)') throw new Error('DDZ subtitle is not forced gold: '+JSON.stringify(contrast));
          if(!contrast.visualBg.includes('rgb(223, 243, 237)')||!contrast.boardBg.includes('rgb(19, 122, 113)')) throw new Error('DDZ background was not lightened to approved palette: '+JSON.stringify(contrast));
          if(capErrors.length) throw new Error('capability pageerror: '+capErrors.join('\n'));
          await cap.close();
          await check({width:1440,height:900});
          await check({width:844,height:390});
          await browser.close();
          console.log('QHOME_ACTIONS_DDZ_CARD_GRAMMAR_MOBILE_CUE_AND_VISIBILITY_OK');
          EOF
          node verify-showcase.mjs
          rm -f verify-showcase.mjs
