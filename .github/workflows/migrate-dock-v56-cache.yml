name: Maintain Dock V5.8 Compact Cache

on:
  push:
    branches: [main]
    paths:
      - 'site-dock-share-runtime-v1.js'
      - 'scripts/migrate-dock-v56-cache.js'
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/materialize-public-shell-first-paint-v1.js'
      - 'scripts/validate-dock-flow-navigation-v56.js'
      - '.github/workflows/migrate-dock-v56-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintain-dock-v58-compact-cache-main
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Maintain compact fixed-bottom cache contract
        run: |
          set -euo pipefail
          node --check scripts/migrate-dock-v56-cache.js
          node scripts/migrate-dock-v56-cache.js
          node scripts/migrate-dock-v56-cache.js --check
          node scripts/validate-dock-flow-navigation-v56.js
          git diff --check

      - name: Commit cache normalization if needed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Dock V5.8 compact cache contract already current.'
            exit 0
          fi
          git commit -m 'build(dock): normalize copy-first share cache'
          git pull --rebase origin main
          git push origin HEAD:main
