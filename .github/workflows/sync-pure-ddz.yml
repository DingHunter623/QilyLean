name: Sync Pure DDZ Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-pure-ddz.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Vendor playable web assets
        run: |
          rm -rf /tmp/Pure-DDZ-Classic
          git clone --depth 1 https://github.com/DingHunter623/Pure-DDZ-Classic.git /tmp/Pure-DDZ-Classic
          rm -rf tools/pure-ddz/game
          mkdir -p tools/pure-ddz/game
          cp -R /tmp/Pure-DDZ-Classic/web/. tools/pure-ddz/game/
          test -s tools/pure-ddz/game/index.html
          test -s tools/pure-ddz/game/css/style.css
          test -s tools/pure-ddz/game/js/game.js
          grep -q '纯净斗地主' tools/pure-ddz/game/index.html
      - name: Commit synchronized game files
        run: |
          if git diff --quiet -- tools/pure-ddz/game; then
            echo 'Pure DDZ web assets already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pure-ddz/game
          git commit -m 'build: vendor Pure DDZ web assets for same-origin play'
          git push origin HEAD:main
