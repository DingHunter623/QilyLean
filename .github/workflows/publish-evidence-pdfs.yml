name: Publish evidence PDFs

on:
  push:
    paths:
      - '.github/workflows/publish-evidence-pdfs.yml'
      - 'assets/projects/lean-improvement-evidence/data/**'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message != 'chore: publish evidence PDFs [skip evidence fetch]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download public evidence files
        shell: bash
        run: |
          set -euo pipefail
          target='assets/projects/lean-improvement-evidence'
          mkdir -p "$target"
          curl --fail --location --retry 3 --retry-delay 2 -o "$target/q3-public.pdf" 'https://at.adobe.com/nJ6LZTo8nuMosIdxuHMjwmfjeRSe'
          curl --fail --location --retry 3 --retry-delay 2 -o "$target/q4-public.pdf" 'https://at.adobe.com/Rv8Uu2DxKod6u2Effj9HKQZQliwH'
          curl --fail --location --retry 3 --retry-delay 2 -o "$target/award-public.pdf" 'https://at.adobe.com/GU8A7bIVCy8TTjYT88V4zPLTb6Aw'
          for file in "$target"/*.pdf; do
            test "$(head -c 4 "$file")" = '%PDF' || { echo "Invalid PDF: $file"; exit 1; }
          done

      - name: Commit PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects/lean-improvement-evidence/*.pdf
          if git diff --cached --quiet; then
            echo 'PDF files are already current.'
            exit 0
          fi
          git commit -m 'chore: publish evidence PDFs [skip evidence fetch]'
          git push origin HEAD:main
