name: Validate QilyLean three-core pricing architecture

on:
  push:
    paths:
      - '.github/workflows/normalize-six-capability-pricing-20260809.yml'
      - 'scripts/normalize-six-capability-pricing-20260809.py'
      - 'site-navigation-legacy-20260802.js'
      - 'cooperation/index.html'
      - 'scripts/hide-public-pricing.js'
      - 'scripts/enforce-six-core-static-source.js'
      - 'docs/QilyLean全站业务口径规范_20260809.md'
  pull_request:
    paths:
      - '.github/workflows/normalize-six-capability-pricing-20260809.yml'
      - 'scripts/normalize-six-capability-pricing-20260809.py'
      - 'site-navigation-legacy-20260802.js'
      - 'cooperation/index.html'
      - 'scripts/hide-public-pricing.js'
      - 'scripts/enforce-six-core-static-source.js'
      - 'docs/QilyLean全站业务口径规范_20260809.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax checks
        run: |
          node --check site-navigation-legacy-20260802.js
          node --check scripts/enforce-six-core-static-source.js
          python3 -m py_compile scripts/normalize-six-capability-pricing-20260809.py

      - name: Validate three-core pricing architecture
        run: |
          python3 scripts/normalize-six-capability-pricing-20260809.py
          node scripts/enforce-six-core-static-source.js

      - name: Enforce pricing scope and non-public boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '三大核心业务报价参考' site-navigation-legacy-20260802.js
          grep -q '三大核心业务报价方案' site-navigation-legacy-20260802.js
          grep -q '本模块只覆盖三大核心业务' site-navigation-legacy-20260802.js
          grep -q 'QILY-PRICING-PUBLIC-DISABLED' cooperation/index.html
          grep -q 'QILY-PRICING-POLICY' cooperation/index.html
          ! grep -Eq 'var (digitalPricing|appPricing|websitePricing) = ' site-navigation-legacy-20260802.js
          ! grep -Eq '<h3>0[456]｜' site-navigation-legacy-20260802.js
          ! grep -q '六类项目合作能力报价' site-navigation-legacy-20260802.js
