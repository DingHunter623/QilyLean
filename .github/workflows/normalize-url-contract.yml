name: Normalize QilyLean public URL contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-url-contract-v1
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Apply authorized cooperation 05 VI fix when staged
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/fix-cooperation-axis-current-r10.py ]; then
            python3 scripts/fix-cooperation-axis-current-r10.py --apply
          fi

      - name: Normalize directory-backed public URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize-url-contract.py --apply
          python3 scripts/normalize-url-contract.py
          git diff --check

      - name: Show normalization summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'QilyLean URL contract:'
          echo '  root URL                 -> https://qilylean.com/'
          echo '  directory */index.html   -> trailing slash'
          echo '  real file URLs           -> keep extension, no added slash'
          echo
          git status --short
          echo
          git diff --stat || true

      - name: Commit normalized public URL references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: normalize canonical directory URLs [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'URL contract already normalized.'
          fi

      - name: Verify cooperation 05 production VI
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/qily-r10-verify about:blank >/tmp/qily-r10-chrome.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:9222/json/version >/dev/null
          node scripts/verify-cooperation-axis-current-r10.mjs
