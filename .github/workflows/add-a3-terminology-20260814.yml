name: Publish A3 terminology 2026-08-14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-a3-terminology-20260814.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a3-terminology-20260814-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add A3 terminology and OPL source
        run: node scripts/add-a3-terminology-20260814.js
      - name: Validate terminology source
        shell: bash
        run: |
          node --check scripts/add-a3-terminology-20260814.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('knowledge/terminology.html','utf8');
          const cardCount=(html.match(/<article class="term-card"/g)||[]).length;
          if(cardCount!==190)throw new Error('terminology card count='+cardCount);
          if(!html.includes('<div class="term-code">A3</div>'))throw new Error('A3 missing');
          if(!html.includes('A3 Problem Solving / A3 Report'))throw new Error('A3 English name missing');
          console.log('A3 terminology exact QA passed: 190 main cards + standalone source = 191 unified terms.');
          NODE
      - name: Commit terminology update
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add knowledge/terminology.html
          if git diff --cached --quiet; then
            echo 'No terminology change to commit.'
            exit 0
          fi
          git commit -m 'content: add A3 problem-solving terminology and OPL source [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
