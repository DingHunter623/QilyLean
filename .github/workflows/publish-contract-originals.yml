name: Publish contract originals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-contract-originals.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and encode contract PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qilylean/private
          curl --fail --location --retry 3 --retry-delay 3 \
            --output /tmp/factory-contract.pdf \
            'https://at.adobe.com/IJTJmHdWJcbEDJ4XFTYIo9Rcp0pt'
          curl --fail --location --retry 3 --retry-delay 3 \
            --output /tmp/visual-contract.pdf \
            'https://at.adobe.com/bPuLxCApzrpNE5Vv0q8LqQ7a8KEw'
          test "$(head -c 4 /tmp/factory-contract.pdf)" = '%PDF'
          test "$(head -c 4 /tmp/visual-contract.pdf)" = '%PDF'
          base64 -w 0 /tmp/factory-contract.pdf > qilylean/private/factory-planning-contract.pdf.b64
          base64 -w 0 /tmp/visual-contract.pdf > qilylean/private/5s-visual-contract.pdf.b64
          test -s qilylean/private/factory-planning-contract.pdf.b64
          test -s qilylean/private/5s-visual-contract.pdf.b64

      - name: Commit published originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qilylean/private/factory-planning-contract.pdf.b64 qilylean/private/5s-visual-contract.pdf.b64
          git rm .github/workflows/publish-contract-originals.yml
          git commit -m 'feat: publish native contract originals [skip ci]'
          git push
