name: Validate QilyLean CN personal-site boundary

on:
  pull_request:
    paths:
      - 'cn-site/**'
      - '.github/workflows/validate-cn-personal-content.yml'
      - 'scripts/cn-typography-v23.spec.js'
  push:
    branches:
      - main
    paths:
      - 'cn-site/**'
      - '.github/workflows/validate-cn-personal-content.yml'
      - 'scripts/cn-typography-v23.spec.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cn-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize approved CN practice evidence assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/materialize-practice-assets.sh
          cn-site/scripts/materialize-practice-assets.sh

      - name: Validate China personal-site structure and compliance
        shell: bash
        run: |
          set -euo pipefail
          test -f cn-site/index.html
          test -f cn-site/notes/index.html
          test -f cn-site/assets/qilylean-vi-v2.css
          test -f cn-site/assets/cn-nav-rail-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.css
          ! grep -Fq 'data-qily-translation-provider' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'qily-cn-nav-shell' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq -- '--qily-cn-primary-nav-font-size:20px' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'grid-template-areas:"brand nav translate"' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'grid-template-areas:"brand translate" "nav nav"' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QilyLean CN In-Page Translation V7' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'API_BASES' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'target_language:target' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq "data-qily-translation-engine','baidu'" cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'concurrency=1' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'QilyLean CN In-Page Translation UI V3' cn-site/assets/cn-translate-baidu-v1.css
          test -f cn-site/assets/practice.css
          test -f cn-site/assets/practice/smed-300t.svg
          test -f cn-site/assets/practice/mold-warehouse.svg
          test -f cn-site/assets/practice/fuse-process.svg
          test -f cn-site/assets/practice/lean-improvement-evidence.svg
          test -f cn-site/assets/practice/automotive-lean.svg
          test -f cn-site/assets/practice/factory-layout.svg
          test -f cn-site/assets/practice/digital-factory.svg
          test -f cn-site/assets/practice/visual-management.svg
          test -s cn-site/assets/practice/award-6s-page-01.jpg
          chmod +x cn-site/scripts/validate-personal-content.sh
          cn-site/scripts/validate-personal-content.sh cn-site

      - name: Verify practice archive public-facing semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '实践与成果：把改善结果还原成可复用的工程方法' cn-site/notes/index.html
          grep -Fq '知识之外，更重要的是方法如何在现场落地' cn-site/index.html
          grep -Fq '精选 8 项制造实践' cn-site/index.html
          grep -Fq '从实践中提炼可复用方法' cn-site/index.html
          grep -Fq 'PRACTICE & EVIDENCE｜实践与成果' cn-site/index.html
          grep -Fq '/assets/qilylean-vi-v2.css?v=20260926-cn-vi-v26-unified-axis-header' cn-site/index.html
          grep -Fq '/assets/cn-nav-rail-v1.js?v=20260926-nav-rail-v10-about-us' cn-site/index.html
          grep -Fq '/assets/cn-translate-baidu-v1.css?v=20260922-translate-v6-baidu' cn-site/index.html
          grep -Fq '/assets/cn-translate-baidu-v1.js?v=20260922-translate-v6-baidu' cn-site/index.html
          grep -Fq 'QILY-CN-NAV-RAIL-V7' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-CURRENT-MODULE-V1' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-CURRENT-MODULE-RUNTIME-V1' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'QILY-CN-STICKY-HEADER-V1' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-HEADER-SHELL-PARITY-V3' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'min-height:83.4px!important' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-TYPE-HIERARCHY-V5' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h2:clamp(20px,1.25vw,22px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h3:clamp(17px,1vw,19px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'position:sticky!important' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'qily-primary-nav-scroll-thumb' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'mousedown' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq -- '--qily-cn-h1:clamp(27px,7.2vw,33px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h2:clamp(19px,5vw,21px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h3:clamp(17px,4.5vw,19px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq '从现场问题，到可复用的方法' cn-site/notes/index.html
          grep -Fq '8项制造实践，从现场问题走向标准化沉淀' cn-site/notes/index.html
          grep -Fq '6S改善机制：从稽核到激励的运行记录' cn-site/notes/index.html
          grep -Fq '机制说明：' cn-site/notes/index.html
          ! grep -Fq '357.91万' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq '可量化年度贡献' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq 'PUBLIC REDACTION' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq '公开脱敏' cn-site/assets/practice/lean-improvement-evidence.svg
          grep -Fq '/assets/practice/award-6s-page-01.jpg?v=20260918-practice-award-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/fuse-process.svg?v=20260918-fuse-finished-v2' cn-site/notes/index.html
          grep -Fq '玻璃管保险丝切口与烧口工艺改善后的成品照片' cn-site/notes/index.html
          grep -Fq '玻璃管保险丝改善后成品照片' cn-site/assets/practice/fuse-process.svg
          grep -Fq '/assets/practice.css?v=20260923-practice-visual-v4-reading' cn-site/notes/index.html
          grep -Fq '6S改善运行机制摘要' cn-site/notes/index.html
          grep -Fq '/assets/practice/automotive-lean.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/factory-layout.svg?v=20260923-practice-map-v4-system' cn-site/notes/index.html
          grep -Fq 'data-public-visual-scope="factory-layout-system-v4"' cn-site/assets/practice/factory-layout.svg
          ! grep -Fq 'qily-warehouse-label-sequence-v1' cn-site/assets/practice/factory-layout.svg
          grep -Fq 'qily-factory-layout-system-v4' cn-site/assets/practice/factory-layout.svg
          grep -Fq 'viewBox="0 0 1400 788"' cn-site/assets/practice/factory-layout.svg
          grep -Fq '/assets/practice/digital-factory.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/visual-management.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '汽车电子精益体系、VSM、单件流与SMED标准化' cn-site/notes/index.html
          grep -Fq 'Factory Layout、精益物流与扩展边界规划' cn-site/notes/index.html
          grep -Fq '制造数据治理、IT/OT分层与系统验收' cn-site/notes/index.html
          grep -Fq '制造现场目视化系统设计与运行闭环' cn-site/notes/index.html
          grep -Fq 'award-metrics-grid' cn-site/notes/index.html
          grep -Fq 'award-flow' cn-site/notes/index.html
          grep -Fq 'QILY-CN-AWARD-MECHANISM-V2' cn-site/assets/practice.css
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr));' cn-site/assets/practice.css
          ! grep -Fq 'evidence-strip' cn-site/notes/index.html
          ! grep -Fq 'raw.githubusercontent.com' cn-site/notes/index.html

      - name: Install Chromium typography audit dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local CN production-root server
        run: |
          python3 -m http.server 4174 --directory cn-site >/tmp/qily-cn-type-v23-http.log 2>&1 &
          echo $! >/tmp/qily-cn-type-v23-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4174/factory/ >/dev/null

      - name: Browser-computed typography audit across all CN public pages
        env:
          QILY_CN_BASE: http://127.0.0.1:4174
        run: npx playwright test scripts/cn-typography-v23.spec.js --reporter=line --workers=1

      - name: Upload CN typography visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qily-cn-typography-v23-${{ github.run_id }}
          path: visual-cn-typography-v23
          if-no-files-found: warn
          retention-days: 30

      - name: Verify clean patch formatting
        run: git diff --check
