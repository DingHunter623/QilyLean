name: Validate QilyLean CN personal-site boundary

on:
  pull_request:
    paths:
      - 'cn-site/**'
      - 'links/index.html'
      # International knowledge is the VI source: changes must revalidate the China clone.
      - 'knowledge/index.html'
      - 'site-shell.css'
      - 'site-visual-readability-v5.css'
      - 'site-visual-authority-r8.css'
      - 'site-vi-standard-v4.css'
      - 'services/cn-translation/**'
      - '.github/workflows/validate-cn-personal-content.yml'
      - 'scripts/cn-typography-v23.spec.js'
      - 'scripts/cn-nonbrief-hero-contrast.spec.js'
      - 'scripts/cn-public-interactions.spec.js'
      - 'scripts/brief-international-corpus-visual.spec.js'
      - 'scripts/test-cn-translation-gateway.js'
      - 'scripts/test-cn-translation-state.js'
      - 'index.html'
      - 'experience/**'
      - 'capabilities/**'
      - 'improvements/**'
      - 'lean-production/**'
      - 'projects/**'
      - 'trust/**'
      - 'moments/**'
      - 'knowledge/**'
      - 'global-knowledge/**'
      - 'AI-Knowledge/**'
      - 'certificates/**'
      - 'tools/times26001/**'
      - 'qilylean/**'
      - 'assets/**'
      - 'styles/**'
      - 'fonts/**'
      - '*.css'
      - 'ai.html'
      - 'gbt2828.html'
      - 'papers.html'
      - 'standards.html'
      - 'knowledge.html'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.pdf'
      - '**/*.qly'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
  push:
    branches:
      - main
    paths:
      - 'cn-site/**'
      - 'links/index.html'
      # International knowledge is the VI source: changes must revalidate the China clone.
      - 'knowledge/index.html'
      - 'site-shell.css'
      - 'site-visual-readability-v5.css'
      - 'site-visual-authority-r8.css'
      - 'site-vi-standard-v4.css'
      - 'services/cn-translation/**'
      - '.github/workflows/validate-cn-personal-content.yml'
      - 'scripts/cn-typography-v23.spec.js'
      - 'scripts/cn-nonbrief-hero-contrast.spec.js'
      - 'scripts/cn-public-interactions.spec.js'
      - 'scripts/brief-international-corpus-visual.spec.js'
      - 'scripts/test-cn-translation-gateway.js'
      - 'scripts/test-cn-translation-state.js'
      - 'index.html'
      - 'experience/**'
      - 'capabilities/**'
      - 'improvements/**'
      - 'lean-production/**'
      - 'projects/**'
      - 'trust/**'
      - 'moments/**'
      - 'knowledge/**'
      - 'global-knowledge/**'
      - 'AI-Knowledge/**'
      - 'certificates/**'
      - 'tools/times26001/**'
      - 'qilylean/**'
      - 'assets/**'
      - 'styles/**'
      - 'fonts/**'
      - '*.css'
      - 'ai.html'
      - 'gbt2828.html'
      - 'papers.html'
      - 'standards.html'
      - 'knowledge.html'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.pdf'
      - '**/*.qly'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cn-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test direct Youdao adapter
        run: python3 services/cn-translation/test_server.py

      - name: Test same-origin translation transport
        run: |
          node scripts/test-cn-translation-gateway.js
          node scripts/test-cn-translation-state.js

      - name: Materialize approved CN practice evidence assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/materialize-practice-assets.sh
          cn-site/scripts/materialize-practice-assets.sh

      - name: Detect source-content clone contract
        id: source-parity
        shell: bash
        run: |
          set -euo pipefail
          if test -f cn-site/scripts/materialize-source-content-parity.py; then
            test -s cn-site/archive/source-content-parity.json
            grep -Fq 'data-cn-source-parity="v1"' cn-site/index.html
            test -f cn-site/scripts/validate-source-content-parity.py
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate China personal-site structure and compliance
        shell: bash
        run: |
          set -euo pipefail
          test -f cn-site/index.html
          test -f cn-site/notes/index.html
          test -f cn-site/assets/qilylean-vi-v2.css
          test -f cn-site/assets/cn-nav-rail-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.css
          ! grep -Fq 'data-qily-translation-provider' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'qily-cn-nav-shell' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq -- '--qily-cn-primary-nav-font-size:20px' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'grid-template-areas:"brand nav translate"' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'grid-template-areas:"brand translate" "nav nav"' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QilyLean CN In-Page Translation V7' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'API_BASES' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'target_language:target' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq "data-qily-translation-engine','youdao'" cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'concurrency=1' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'QilyLean CN In-Page Translation UI V3' cn-site/assets/cn-translate-baidu-v1.css
          test -f cn-site/assets/practice.css
          test -f cn-site/assets/practice/smed-300t.svg
          test -f cn-site/assets/practice/mold-warehouse.svg
          test -f cn-site/assets/practice/fuse-process.svg
          test -f cn-site/assets/practice/lean-improvement-evidence.svg
          test -f cn-site/assets/practice/automotive-lean.svg
          test -f cn-site/assets/practice/factory-layout.svg
          test -f cn-site/assets/practice/digital-factory.svg
          test -f cn-site/assets/practice/visual-management.svg
          test -s cn-site/assets/practice/award-6s-page-01.jpg
          if test "${{ steps.source-parity.outputs.enabled }}" = true; then
            python3 cn-site/scripts/validate-source-content-parity.py
          else
            chmod +x cn-site/scripts/validate-personal-content.sh
            cn-site/scripts/validate-personal-content.sh cn-site
          fi

      - name: Verify legacy practice archive public-facing semantics
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '实践与成果：把改善结果还原成可复用的工程方法' cn-site/notes/index.html
          grep -Fq '知识之外，更重要的是方法如何在现场落地' cn-site/index.html
          grep -Fq '精选 8 项制造实践' cn-site/index.html
          grep -Fq '从实践中提炼可复用方法' cn-site/index.html
          grep -Fq 'PRACTICE & EVIDENCE｜实践与成果' cn-site/index.html
          grep -Fq '/assets/qilylean-vi-v2.css?v=20261008-cn-vi-v50-cache-revalidation' cn-site/index.html
          grep -Fq '/assets/cn-nav-rail-v1.js?v=20261018-nav-rail-v21-public-clone' cn-site/index.html
          grep -Fq '/assets/cn-translate-baidu-v1.css?v=20261017-cn-mainland-nmt-v2' cn-site/index.html
          grep -Fq '/assets/cn-translate-baidu-v1.js?v=20261017-cn-mainland-nmt-v2' cn-site/index.html
          grep -Fq 'QILY-CN-NAV-RAIL-V7' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-CURRENT-MODULE-V1' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-CURRENT-MODULE-RUNTIME-V1' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'QILY-CN-STICKY-HEADER-V1' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-HEADER-SHELL-PARITY-V3' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'min-height:83.4px!important' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-TYPE-HIERARCHY-V5' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-ALL-SMALL-COPY-FLOOR-V46' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-small:20px' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-section-kicker:21px' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-label-gold:#b88b45' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h2:clamp(20px,1.25vw,22px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h3:clamp(17px,1vw,19px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'position:sticky!important' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'qily-primary-nav-scroll-thumb' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'mousedown' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq -- '--qily-cn-h1:clamp(27px,7.2vw,33px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h2:clamp(19px,5vw,21px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h3:clamp(17px,4.5vw,19px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq '从现场问题，到可复用的方法' cn-site/notes/index.html
          grep -Fq '8项制造实践，从现场问题走向标准化沉淀' cn-site/notes/index.html
          grep -Fq '6S改善机制：从稽核到激励的运行记录' cn-site/notes/index.html
          grep -Fq '机制说明：' cn-site/notes/index.html
          ! grep -Fq '357.91万' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq '可量化年度贡献' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq 'PUBLIC REDACTION' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq '公开脱敏' cn-site/assets/practice/lean-improvement-evidence.svg
          grep -Fq '/assets/practice/award-6s-page-01.jpg?v=20260918-practice-award-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/fuse-process.svg?v=20260918-fuse-finished-v2' cn-site/notes/index.html
          grep -Fq '玻璃管保险丝切口与烧口工艺改善后的成品照片' cn-site/notes/index.html
          grep -Fq '玻璃管保险丝改善后成品照片' cn-site/assets/practice/fuse-process.svg
          grep -Fq '/assets/practice.css?v=20261014-single-column-v1' cn-site/notes/index.html
          grep -Fq '6S改善运行机制摘要' cn-site/notes/index.html
          grep -Fq '/assets/practice/automotive-lean.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/factory-layout.svg?v=20260923-practice-map-v4-system' cn-site/notes/index.html
          grep -Fq 'data-public-visual-scope="factory-layout-system-v4"' cn-site/assets/practice/factory-layout.svg
          ! grep -Fq 'qily-warehouse-label-sequence-v1' cn-site/assets/practice/factory-layout.svg
          grep -Fq 'qily-factory-layout-system-v4' cn-site/assets/practice/factory-layout.svg
          grep -Fq 'viewBox="0 0 1400 788"' cn-site/assets/practice/factory-layout.svg
          grep -Fq '/assets/practice/digital-factory.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/visual-management.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '汽车电子精益体系、VSM、单件流与SMED标准化' cn-site/notes/index.html
          grep -Fq 'Factory Layout、精益物流与扩展边界规划' cn-site/notes/index.html
          grep -Fq '制造数据治理、IT/OT分层与系统验收' cn-site/notes/index.html
          grep -Fq '制造现场目视化系统设计与运行闭环' cn-site/notes/index.html
          grep -Fq 'award-metrics-grid' cn-site/notes/index.html
          grep -Fq 'award-flow' cn-site/notes/index.html
          grep -Fq 'QILY-CN-AWARD-MECHANISM-V2' cn-site/assets/practice.css
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr));' cn-site/assets/practice.css
          ! grep -Fq 'evidence-strip' cn-site/notes/index.html
          ! grep -Fq 'raw.githubusercontent.com' cn-site/notes/index.html

      - name: Syntax-check CN visual regression scripts
        run: |
          node --check cn-site/assets/cn-nav-rail-v1.js
          node --check scripts/cn-public-interactions.spec.js
          node --check scripts/cn-typography-v23.spec.js

      - name: Install Chromium typography audit dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local CN production-root server
        run: |
          python3 -m http.server 4174 --directory cn-site >/tmp/qily-cn-type-v23-http.log 2>&1 &
          echo $! >/tmp/qily-cn-type-v23-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4174/factory/ >/dev/null
          # The same checkout is the international source of truth (381 issues).
          python3 -m http.server 4175 --directory . >/tmp/qily-global-brief-http.log 2>&1 &
          echo $! >/tmp/qily-global-brief-http.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:4175/qilylean/daily/2026-09-13.html >/dev/null

      - name: Browser-verified local public-content interactions
        if: steps.source-parity.outputs.enabled != 'true'
        env:
          QILY_CN_BASE: http://127.0.0.1:4174
        run: npx playwright test scripts/cn-public-interactions.spec.js --reporter=line --workers=1

      - name: Browser-computed nonbrief knowledge hero contrast audit
        if: steps.source-parity.outputs.enabled != 'true'
        env:
          QILY_CN_BASE: http://127.0.0.1:4174
        run: npx playwright test scripts/cn-nonbrief-hero-contrast.spec.js --reporter=line --workers=1

      - name: Browser-computed typography audit across all CN public pages
        if: steps.source-parity.outputs.enabled != 'true'
        env:
          QILY_CN_BASE: http://127.0.0.1:4174
        run: |
          npx playwright test scripts/cn-typography-v23.spec.js --reporter=line --workers=1
          QILY_GLOBAL_BASE=http://127.0.0.1:4175 npx playwright test scripts/brief-international-corpus-visual.spec.js --reporter=line --workers=1

      - name: Browser-verify source-content clone and preserved China controls
        if: steps.source-parity.outputs.enabled == 'true'
        env:
          QILY_CN_BASE: http://127.0.0.1:4174
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {chromium}=require('@playwright/test');
          const base=process.env.QILY_CN_BASE,origin=new URL(base).origin;
          const root=fs.realpathSync(process.cwd());
          const evidence='visual-cn-source-content';
          const mime={'.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.gif':'image/gif','.svg':'image/svg+xml','.qly':'application/octet-stream','.mp4':'video/mp4','.webm':'video/webm','.pdf':'application/pdf','.woff':'font/woff','.woff2':'font/woff2','.ttf':'font/ttf'};
          (async()=>{
            fs.mkdirSync(evidence,{recursive:true});
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [1440,1024,820,390]){
                const context=await browser.newContext({viewport:{width,height:900},serviceWorkers:'block',permissions:['clipboard-read','clipboard-write']});
                const missing=[];
                await context.route('**/*',async route=>{
                  const url=new URL(route.request().url());
                  if(url.origin!==origin)return route.abort('blockedbyclient');
                  if(!url.pathname.startsWith('/mirror-media/'))return route.continue();
                  try{
                    const relative=decodeURIComponent(url.pathname.slice('/mirror-media/'.length));
                    assert(relative&&!relative.split('/').includes('..')&&!relative.includes('\0'));
                    const asset=fs.realpathSync(path.resolve(root,relative));
                    assert(asset.startsWith(root+path.sep)&&fs.statSync(asset).isFile());
                    await route.fulfill({status:200,contentType:mime[path.extname(asset).toLowerCase()]||'application/octet-stream',body:fs.readFileSync(asset)});
                  }catch(error){missing.push(String(error));await route.abort('failed');}
                });
                const page=await context.newPage();
                try{
                  for(const route of ['/','/notes/','/trust/','/knowledge/','/briefs/','/briefs/archive/2026-10-18/','/archive/practice/mold-warehouse/','/archive/records/work/','/about/#contact']){
                    const response=await page.goto(base+route,{waitUntil:'networkidle'});
                    assert(response&&response.ok(),route+' must load');
                    await page.locator('#qilyCnTranslateV3').waitFor({state:'visible'});
                    assert(await page.locator('h1').first().isVisible(),route+' heading must be visible');
                    assert.equal(await page.locator('[data-qily-header-utility="translation"]').count(),1);
                    const nav=page.locator('header nav[aria-label="主导航"]');
                    assert.equal(await nav.locator('a[data-qily-nav-key]').count(),10);
                    assert.equal(await nav.locator('a[data-qily-nav-key="contact"]').getAttribute('href'),'/about/#contact');
                    const state=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,
                      badImages:[...document.images].filter(img=>img.getBoundingClientRect().height&&img.loading!=='lazy'&&!img.naturalWidth).map(img=>img.getAttribute('src'))}));
                    assert(!state.overflow,route+' overflows at '+width);
                    assert.deepEqual(state.badImages,[],route+' visible media must load');
                    const footer=page.locator('footer.footer');
                    assert.equal(await footer.locator('a[href^="https://beian.miit.gov.cn/"]').count(),1);
                    assert.equal(await footer.locator('a[href^="https://beian.mps.gov.cn/"]').count(),1);
                    if(route.startsWith('/about/')){
                      assert.deepEqual(await page.locator('a[href^="tel:"]').evaluateAll(nodes=>nodes.map(node=>node.getAttribute('href')).sort()),['tel:13450014003','tel:15168120722','tel:17681788259']);
                      assert.equal(await page.locator('[data-qily-copy="admin@qilylean.com"]').count(),1);
                      assert.equal(await page.locator('[data-qily-copy="Qily259"]').count(),1);
                      for(const value of ['admin@qilylean.com','Qily259']){
                        await page.locator('[data-qily-copy="'+value+'"]').click();
                        await page.waitForFunction(async value=>(await navigator.clipboard.readText())===value,value,{timeout:10000});
                      }
                    }else assert.equal(await page.locator('body[data-cn-source-parity="v1"] main[data-cn-source-content]').count(),1);
                    if(route==='/briefs/'){
                      await page.locator('#briefSearch').fill('SMED');
                      assert(await page.locator('.brief-index-card:visible').count()>0);
                      assert(await page.locator('.brief-index-card:visible').count()<await page.locator('.brief-index-card').count());
                      await page.locator('#briefSearch').fill('');
                    }
                    if(route==='/archive/records/work/'){
                      assert.equal(await page.locator('main img').count(),8);
                      for(const image of await page.locator('main img').all()){
                        await image.scrollIntoViewIfNeeded();
                        await image.evaluate(img=>img.complete&&img.naturalWidth?true:new Promise((resolve,reject)=>{img.onload=()=>resolve(true);img.onerror=()=>reject(new Error('Photo failed: '+img.src));}));
                      }
                    }
                    if(route==='/archive/practice/mold-warehouse/'){
                      const video=page.locator('main video');
                      assert.equal(await video.count(),1);
                      await video.scrollIntoViewIfNeeded();
                      await video.evaluate(async el=>{el.muted=true;await el.play();});
                      await page.waitForFunction(()=>{const v=document.querySelector('main video');return v.currentTime>0&&!v.paused;});
                      await video.evaluate(el=>el.pause());
                    }
                    await page.screenshot({path:path.join(evidence,(route==='/'?'home':route.replace(/[^a-zA-Z0-9]+/g,'-'))+'-'+width+'.png')});
                  }
                  assert.deepEqual(missing,[],'All mirror media must exist');
                }finally{await context.close();}
              }
            }finally{await browser.close();}
            console.log('PASS: source-content browser parity, ten local navigation entries, translator, contact and filings across four viewports.');
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Upload source-content clone verification evidence
        if: always() && steps.source-parity.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cn-source-content-parity-${{ github.run_id }}
          path: |
            cn-site/archive/source-content-parity.json
            visual-cn-source-content
          if-no-files-found: error
          retention-days: 30

      - name: Upload CN nonbrief contrast screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qily-cn-knowledge-contrast-${{ github.run_id }}
          path: visual-cn-knowledge-contrast
          if-no-files-found: warn
          retention-days: 30

      - name: Upload CN typography visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qily-cn-typography-v23-${{ github.run_id }}
          path: visual-cn-typography-v23
          if-no-files-found: warn
          retention-days: 30

      - name: Verify clean patch formatting
        run: git diff --check
