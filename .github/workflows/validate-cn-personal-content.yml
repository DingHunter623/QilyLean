name: Validate QilyLean CN personal-site boundary

on:
  pull_request:
    paths:
      - 'cn-site/**'
      - '.github/workflows/validate-cn-personal-content.yml'
  push:
    branches:
      - main
    paths:
      - 'cn-site/**'
      - '.github/workflows/validate-cn-personal-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cn-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize approved CN practice evidence assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/materialize-practice-assets.sh
          cn-site/scripts/materialize-practice-assets.sh

      - name: Validate China personal-site structure and compliance
        shell: bash
        run: |
          set -euo pipefail
          test -f cn-site/index.html
          test -f cn-site/notes/index.html
          test -f cn-site/assets/practice.css
          test -f cn-site/assets/practice/smed-300t.svg
          test -f cn-site/assets/practice/mold-warehouse.svg
          test -f cn-site/assets/practice/fuse-process.svg
          test -f cn-site/assets/practice/lean-improvement-evidence.svg
          test -f cn-site/assets/practice/automotive-lean.svg
          test -f cn-site/assets/practice/factory-layout.svg
          test -f cn-site/assets/practice/digital-factory.svg
          test -f cn-site/assets/practice/visual-management.svg
          test -s cn-site/assets/practice/award-6s-page-01.jpg
          chmod +x cn-site/scripts/validate-personal-content.sh
          cn-site/scripts/validate-personal-content.sh cn-site

      - name: Verify practice archive public-facing semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '实践与成果：把改善结果还原成可复用的工程方法' cn-site/notes/index.html
          grep -Fq '知识之外，更重要的是方法如何在现场落地' cn-site/index.html
          grep -Fq '精选 8 项制造实践' cn-site/index.html
          grep -Fq '从实践中提炼可复用方法' cn-site/index.html
          grep -Fq 'PRACTICE & EVIDENCE｜实践与成果' cn-site/index.html
          grep -Fq '从现场问题，到可复用的方法' cn-site/notes/index.html
          grep -Fq '8项制造实践，从现场问题走向标准化沉淀' cn-site/notes/index.html
          grep -Fq '6S改善机制：从稽核到激励的运行记录' cn-site/notes/index.html
          grep -Fq '机制说明：' cn-site/notes/index.html
          ! grep -Fq '357.91万' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq '可量化年度贡献' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq 'PUBLIC REDACTION' cn-site/assets/practice/lean-improvement-evidence.svg
          ! grep -Fq '公开脱敏' cn-site/assets/practice/lean-improvement-evidence.svg
          grep -Fq '/assets/practice/award-6s-page-01.jpg?v=20260918-practice-award-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/fuse-process.svg?v=20260918-fuse-finished-v2' cn-site/notes/index.html
          grep -Fq '玻璃管保险丝切口与烧口工艺改善后的成品照片' cn-site/notes/index.html
          grep -Fq '玻璃管保险丝改善后成品照片' cn-site/assets/practice/fuse-process.svg
          grep -Fq '/assets/practice.css?v=20260918-practice-visual-v2' cn-site/notes/index.html
          grep -Fq '6S改善运行机制摘要' cn-site/notes/index.html
          grep -Fq '/assets/practice/automotive-lean.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/factory-layout.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/digital-factory.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '/assets/practice/visual-management.svg?v=20260918-practice-map-v1' cn-site/notes/index.html
          grep -Fq '汽车电子精益体系、VSM、单件流与SMED标准化' cn-site/notes/index.html
          grep -Fq 'Factory Layout、精益物流与扩展边界规划' cn-site/notes/index.html
          grep -Fq '制造数据治理、IT/OT分层与系统验收' cn-site/notes/index.html
          grep -Fq '制造现场目视化系统设计与运行闭环' cn-site/notes/index.html
          grep -Fq 'award-metrics-grid' cn-site/notes/index.html
          grep -Fq 'award-flow' cn-site/notes/index.html
          grep -Fq 'QILY-CN-AWARD-MECHANISM-V2' cn-site/assets/practice.css
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr));' cn-site/assets/practice.css
          ! grep -Fq 'evidence-strip' cn-site/notes/index.html
          ! grep -Fq 'raw.githubusercontent.com' cn-site/notes/index.html

      - name: Verify clean patch formatting
        run: git diff --check
