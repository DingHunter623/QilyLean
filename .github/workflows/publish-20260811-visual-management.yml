name: Publish 2026-08-11 visual management brief

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20260811-visual-management.yml"
      - "scripts/publish-20260811-visual-management.js"
      - "scripts/patch-20260811-visual-loop-readability.js"
      - "scripts/patch-20260811-sitemap.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-publication-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Publish visual management brief and rebuild site metadata
        run: |
          node --check scripts/publish-20260811-visual-management.js
          node scripts/publish-20260811-visual-management.js
          node --check scripts/patch-20260811-visual-loop-readability.js
          node scripts/patch-20260811-visual-loop-readability.js
          node --check scripts/patch-20260811-sitemap.js
          node scripts/patch-20260811-sitemap.js
          QILY_BUILD_DATE=2026-08-11 node scripts/build-site-metadata.js
          node --check scripts/build-trust-search-sync.js
          QILY_BUILD_DATE=2026-08-11 node scripts/build-trust-search-sync.js
          test -s qilylean/daily/2026-08-11.html
          test -s qilylean/daily/assets/2026-08-11-01-visual-loop.svg
          grep -F '目视化不是把信息贴上墙：让状态可见、异常可判、责任可追、行动可闭环' qilylean/daily/2026-08-11.html
          grep -F '5W2H｜问题与行动结构化' qilylean/daily/2026-08-11.html
          grep -F 'PDCA｜计划-执行-检查-改进' qilylean/daily/2026-08-11.html
          grep -F '20260811-readability-v2' qilylean/daily/2026-08-11.html
          grep -F 'width="1280" height="540"' qilylean/daily/2026-08-11.html
          grep -F 'stroke="#74aca4" stroke-width="3"' qilylean/daily/assets/2026-08-11-01-visual-loop.svg
          grep -F 'data-brief-date="2026-08-11"' qilylean/daily-insights.html
          grep -F '<span>2026年8月</span><b>11期</b>' qilylean/daily-insights.html
          grep -F '"latestDate": "2026-08-11"' qilylean/site-data.json
          grep -F '<strong>2026-08-11</strong><span>最新简报日期</span>' trust/index.html
          grep -F 'daily/2026-08-11.html' sitemap.xml
          grep -F '下一期 →' qilylean/daily/2026-08-10.html
          grep -F "date:'2026-08-11'" qilylean/latest-brief.js
          grep -F '/qilylean/daily/2026-08-11.html' qilylean/daily/feed.xml
          git diff --check
      - name: Commit publication outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "2026-08-11 brief is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            qilylean/daily/2026-08-11.html \
            qilylean/daily/assets/2026-08-11-01-visual-loop.svg \
            qilylean/daily/2026-08-10.html \
            qilylean/daily-insights.html \
            qilylean/daily/index.json \
            qilylean/latest-brief.js \
            qilylean/daily/feed.xml \
            qilylean/site-data.json \
            qilylean/site-search-index.json \
            knowledge/index.html \
            trust/index.html \
            cooperation/index.html \
            site-search.js \
            index.html \
            sitemap.xml \
            sitemap-core.xml
          git commit -m "publish: 2026-08-11 visual management brief [skip ci]"
          git push origin HEAD:main
