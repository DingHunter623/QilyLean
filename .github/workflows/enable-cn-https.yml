name: Enable QilyLean CN HTTPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cn-site/.https-ready'

permissions:
  contents: read

concurrency:
  group: qilylean-cn-https
  cancel-in-progress: false

jobs:
  enable-https:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts

      - name: Upload HTTPS activation script
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          scp -i ~/.ssh/qilylean_cn cn-site/scripts/enable-https.sh \
            "$USER_NAME@$CN_PREPROD_HOST:/tmp/enable-qilylean-cn-https.sh"

      - name: Verify DNS and enable HTTPS
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "chmod +x /tmp/enable-qilylean-cn-https.sh && /tmp/enable-qilylean-cn-https.sh 1.117.71.235"
