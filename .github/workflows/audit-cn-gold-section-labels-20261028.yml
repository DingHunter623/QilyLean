name: Audit CN gold section labels against international production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-cn-gold-section-labels-20261028.yml'
      - 'scripts/audit-cn-gold-section-labels-20261028.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium --with-deps
      - run: node scripts/audit-cn-gold-section-labels-20261028.cjs
