name: Publish sitewide visual readability V5

# Trigger refresh: 2026-09-27 small-type enlargement + canonical gold parity
on:
  push:
    branches: [main]
    paths:
      - 'site-visual-readability-v5.css'
      - 'scripts/publish-visual-readability-v5.js'
      - '.github/workflows/publish-visual-readability-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

# V4 Build ignores this publisher's three owned files, so this visual materializer can
# keep its own queue without racing V4 on visual-only publication changes.
concurrency:
  group: publish-visual-readability-v5
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Materialize and verify small-type and gold-label parity across public pages
        run: |
          node --check scripts/publish-visual-readability-v5.js
          node scripts/publish-visual-readability-v5.js
          git diff --check

      - name: Validate protected R8 heading contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--qily-r8-heading-ceiling:clamp(30px,2.65vw,44px)' site-visual-readability-v5.css
          grep -Fq 'R8-HEADING-CEILING-V1-20260903' site-visual-readability-v5.css
          grep -Fq 'html:root:root:root body main h1' site-visual-readability-v5.css
          grep -Fq 'font-size:clamp(30px,8.2vw,38px)!important' site-visual-readability-v5.css
          grep -Fq "const VERSION = '20260927-small-type-gold-parity-v2';" scripts/publish-visual-readability-v5.js
          grep -Fq 'QILY-SITEWIDE-SMALL-TYPE-GOLD-PARITY-V1' site-visual-readability-v5.css
          grep -Fq 'QILY-READABILITY-ALL-SMALL-COPY-FLOOR-V2' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-small:20px' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-small-strong:21px' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-section-kicker:21px' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-gold-label:#b88b45' site-visual-readability-v5.css

      - name: Commit sitewide R8 visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'R8.2 visual hierarchy already materialized.'
            exit 0
          fi
          git commit -m 'style: materialize small-type and gold-label parity sitewide [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
