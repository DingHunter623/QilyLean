name: Publish sitewide visual readability V5

# Trigger refresh: 2026-09-27 small-type enlargement + canonical gold parity
on:
  push:
    branches: [main]
    paths:
      - 'site-visual-readability-v5.css'
      - 'scripts/publish-visual-readability-v5.js'
      - '.github/workflows/publish-visual-readability-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

# V4 Build ignores this publisher's three owned files, so this visual materializer can
# keep its own queue without racing V4 on visual-only publication changes.
concurrency:
  group: publish-visual-readability-v5
  # Queue another publisher run instead of cancelling an active materialization/push.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Materialize and verify small-type and gold-label parity across public pages
        run: |
          node --check scripts/publish-visual-readability-v5.js
          node scripts/publish-visual-readability-v5.js
          git diff --check

      - name: Validate protected R8 heading contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--qily-r8-heading-ceiling:clamp(28px,2.25vw,38px)' site-visual-readability-v5.css
          grep -Fq 'R8-HEADING-CEILING-V1-20260903' site-visual-readability-v5.css
          grep -Fq 'html:root:root:root body main h1' site-visual-readability-v5.css
          grep -Fq 'font-size:clamp(27px,7.2vw,33px)!important' site-visual-readability-v5.css
          grep -Fq "const VERSION = '20261015-cn-parity-h1-38px-v6';" scripts/publish-visual-readability-v5.js
          grep -Fq 'QILY-SITEWIDE-SMALL-TYPE-GOLD-PARITY-V1' site-visual-readability-v5.css
          grep -Fq 'QILY-READABILITY-ALL-SMALL-COPY-FLOOR-V2' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-small:20px' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-small-strong:21px' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-section-kicker:21px' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-gold-label:#b88b45' site-visual-readability-v5.css
          grep -Fq -- '--qily-v5-gold-light:#ffe39b' site-visual-readability-v5.css
          grep -Fq 'QILY-FULL-SITE-HERO-LABEL-VI-V1' site-visual-readability-v5.css
          grep -Fq 'font-weight:400!important' site-visual-readability-v5.css

      - name: Commit sitewide R8 visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'R8.2 visual hierarchy already materialized.'
            exit 0
          fi
          git commit -m 'style: materialize small-type and gold-label parity sitewide [skip ci]'
          # Another authorized main writer may advance the branch between rebase and push.
          # Retry only with a fresh fetch/rebase; never force-update main.
          for attempt in 1 2 3 4 5; do
            echo "R8 publisher safe-push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'R8 publisher rebase conflict; aborting without overwriting main.' >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "R8 visual hierarchy published safely on attempt ${attempt}."
              exit 0
            fi
            if test "${attempt}" -lt 5; then sleep $((attempt * 2)); fi
          done
          echo 'R8 publisher could not update main after five safe attempts; no force push was used.' >&2
          exit 1
