name: Publish sitewide visual readability V5

# Trigger refresh: 2026-09-03 V10/R8 homepage-heading ceiling + V9 VI/static semantics
on:
  push:
    branches: [main]
    paths:
      - 'site-visual-readability-v5.css'
      - 'scripts/publish-visual-readability-v5.js'
      - '.github/workflows/publish-visual-readability-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

# V4 Build ignores this publisher's three owned files, so this visual materializer can
# keep its own queue without racing V4 on visual-only publication changes.
concurrency:
  group: publish-visual-readability-v5
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Materialize V10/R8 heading authority across public pages
        run: |
          node --check scripts/publish-visual-readability-v5.js
          node scripts/publish-visual-readability-v5.js
          git diff --check

      - name: Validate R8 hierarchy and VI contracts
        shell: bash
        run: |
          grep -q -- '--qily-v5-small:17px' site-visual-readability-v5.css
          grep -q -- '--qily-v5-small-strong:18px' site-visual-readability-v5.css
          grep -q -- '--qily-v5-section-kicker:20px' site-visual-readability-v5.css
          grep -q -- '--qily-v5-gold-text:#b88b45' site-visual-readability-v5.css
          grep -q -- '--qily-r8-heading-ceiling:clamp(34px,3.25vw,52px)' site-visual-readability-v5.css
          grep -q 'R8-HEADING-CEILING-V1-20260903' site-visual-readability-v5.css
          grep -q 'html:root:root:root body main h1' site-visual-readability-v5.css
          grep -q 'font-size:clamp(34px,9.6vw,43px)!important' site-visual-readability-v5.css
          grep -q 'color:var(--qily-v5-gold-text)!important' site-visual-readability-v5.css
          grep -q 'QILY-STATIC-VOCABULARY-NO-FEEDBACK-V9' site-visual-readability-v5.css
          ! grep -q -- '--qily-v5-red:#9e4a34' site-visual-readability-v5.css
          grep -q '.qily-home-conversion-kicker' site-visual-readability-v5.css
          grep -q '.qily-home-conversion-hero__kicker' site-visual-readability-v5.css
          grep -q '.qily-home-launch-section' site-visual-readability-v5.css
          grep -q 'width:48px!important' site-visual-readability-v5.css
          grep -q 'font-size:18px!important' site-visual-readability-v5.css
          grep -q 'color:var(--qily-v5-white)!important' site-visual-readability-v5.css
          grep -q 'QILY-DAILY-SURFACE-CONTRAST-V7-20260825' site-visual-readability-v5.css
          grep -q '#engineering-enablers' site-visual-readability-v5.css
          grep -q '#qily-digital-enablers' site-visual-readability-v5.css
          grep -q '/site-visual-readability-v5.css?v=20260903-r8-heading-ceiling-v10' index.html
          grep -q '/site-visual-readability-v5.css?v=20260903-r8-heading-ceiling-v10' cooperation/index.html
          grep -q '/site-visual-readability-v5.css?v=20260903-r8-heading-ceiling-v10' knowledge/pdca-gantt-milestone-opl.html
          grep -q 'QILY-DAILY-READABILITY-CLOSURE-V9-20260901' qilylean/daily/2026-08-25.html
          grep -q '<h2>三大核心业务</h2>' cooperation/index.html
          grep -q '三项增强能力，不与三大核心业务同级' cooperation/index.html
          ! grep -q '<h2>六类核心业务</h2>' cooperation/index.html

      - name: Commit sitewide R8 visual hierarchy
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V10/R8 visual hierarchy already materialized.'
            exit 0
          fi
          git commit -m 'fix: materialize R8 homepage heading ceiling sitewide [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
