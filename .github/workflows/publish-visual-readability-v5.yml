name: Publish sitewide visual readability V5

# Trigger refresh: 2026-09-03 V10/R8 homepage-heading ceiling + V9 VI/static semantics
on:
  push:
    branches: [main]
    paths:
      - 'site-visual-readability-v5.css'
      - 'scripts/publish-visual-readability-v5.js'
      - '.github/workflows/publish-visual-readability-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

# V4 Build ignores this publisher's three owned files, so this visual materializer can
# keep its own queue without racing V4 on visual-only publication changes.
concurrency:
  group: publish-visual-readability-v5
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Materialize and verify V10/R8 heading authority across public pages
        run: |
          node --check scripts/publish-visual-readability-v5.js
          node scripts/publish-visual-readability-v5.js
          git diff --check

      - name: Validate protected R8 heading contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '--qily-r8-heading-ceiling:clamp(34px,3.25vw,52px)' site-visual-readability-v5.css
          grep -Fq 'R8-HEADING-CEILING-V1-20260903' site-visual-readability-v5.css
          grep -Fq 'html:root:root:root body main h1' site-visual-readability-v5.css
          grep -Fq 'font-size:clamp(34px,9.6vw,43px)!important' site-visual-readability-v5.css
          grep -Fq "const VERSION = '20260903-r8-heading-ceiling-v10';" scripts/publish-visual-readability-v5.js

      - name: Commit sitewide R8 visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V10/R8 visual hierarchy already materialized.'
            exit 0
          fi
          git commit -m 'fix: materialize R8 homepage heading ceiling sitewide [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
