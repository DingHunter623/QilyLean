name: Cleanup QilyLean Home Build Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-qhome-build-artifacts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated Android build files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch android/qilylean-home/.gradle android/qilylean-home/app/build
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          text = path.read_text(encoding='utf-8')
          block = '''

# Android / Gradle generated build files
**/.gradle/
**/build/
'''
          if '**/.gradle/' not in text:
              text = text.rstrip() + block
          path.write_text(text, encoding='utf-8')
          PY
          git rm --ignore-unmatch .github/workflows/cleanup-qhome-build-artifacts.yml
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore
          git commit -m 'chore: remove Android build artifacts and ignore generated files'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
