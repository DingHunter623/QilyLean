name: Cleanup QilyLean Home Build Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-qhome-build-artifacts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated Android build files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch android/qilylean-home/.gradle android/qilylean-home/app/build
          if ! grep -q '^\*\*/\.gradle/$' .gitignore; then
            printf '\n\n# Android / Gradle generated build files\n**/.gradle/\n**/build/\n' >> .gitignore
          fi
          git rm --ignore-unmatch .github/workflows/cleanup-qhome-build-artifacts.yml
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore
          git commit -m 'chore: remove Android build artifacts and ignore generated files'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
