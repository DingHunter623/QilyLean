name: QilyLean V4 Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'meta/build.json'
      - 'maintenance/site-system-v4-*.json'
      - 'docs/site-system-v4/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-v4-build-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '[v4-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source before materialization
        run: node scripts/site-system-v4-validate.js

      - name: Materialize deterministic sitemap lastmod
        run: node scripts/site-system-v4-sitemap-lastmod.js --write

      - name: Materialize production build identity
        env:
          QILY_SOURCE_COMMIT: ${{ github.sha }}
          QILY_BUILD_STATE: CI_PASS
        run: node scripts/site-system-v4-build-meta.js

      - name: Revalidate generated source
        run: |
          node scripts/site-system-v4-validate.js
          npm run test:seo
          git diff --check

      - name: Commit V4 generated production metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- meta/build.json sitemap.xml sitemap-core.xml; then
            echo 'V4 production metadata already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta/build.json sitemap.xml sitemap-core.xml
          git commit -m 'build(v4): materialize production metadata [v4-generated]'
          git pull --rebase origin main
          git push
