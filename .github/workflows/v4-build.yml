name: QilyLean V4 Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'meta/build.json'
      - 'maintenance/site-system-v4-*.json'
      - 'docs/site-system-v4/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-v4-build-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '[v4-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source before materialization
        run: node scripts/site-system-v4-validate.js

      - name: Materialize C919 cross-browser single-source closure
        run: |
          set -euo pipefail
          node --check scripts/fix-c919-v14-crossbrowser-20260826.js
          node scripts/fix-c919-v14-crossbrowser-20260826.js
          node --check scripts/enforce-c919-home-hero.js
          node --check scripts/site-regression-guard-c919-hero.js
          node scripts/site-regression-guard-c919-hero.js
          grep -q 'c919-strategy-hero-v14.png?v=20260826-c919-crossbrowser-v1' index.html
          ! grep -q 'c919-strategy-hero-v14.webp' index.html
          ! sed -n '/QILY-C919-DIGITAL-FLAGSHIP-HERO-V4:START/,/QILY-C919-DIGITAL-FLAGSHIP-HERO-V4:END/p' index.html | grep -q '<picture>'

      - name: Normalize regional sitemap URL contract
        run: node scripts/qilylean-north-v4-sitemap-contract.js

      - name: Materialize incremental sitemap lastmod
        run: node scripts/site-system-v4-sitemap-lastmod.js --write

      - name: Materialize production build identity
        env:
          QILY_SOURCE_COMMIT: ${{ github.sha }}
          QILY_BUILD_STATE: CI_PASS
        run: node scripts/site-system-v4-build-meta.js

      - name: Revalidate generated source
        run: |
          node scripts/qilylean-north-v4-sitemap-contract.js --check
          node scripts/site-system-v4-validate.js
          node scripts/site-regression-guard-c919-hero.js
          npm run test:seo
          git diff --check

      - name: Commit V4 generated metadata and C919 closure
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            meta/build.json
            sitemap.xml
            sitemap-core.xml
            index.html
            scripts/enforce-c919-home-hero.js
            scripts/site-regression-guard-c919-hero.js
            scripts/validate-sitewide-remediation-20260822.js
            .github/workflows/apply-sitewide-audit-performance-visual-20260824.yml
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'V4 production metadata and C919 cross-browser closure already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'build(v4): materialize production metadata and C919 cross-browser closure [v4-generated]'
          git pull --rebase origin main
          git push
