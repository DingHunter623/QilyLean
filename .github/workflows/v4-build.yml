name: QilyLean V4 Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'meta/build.json'
      - 'maintenance/site-system-v4-*.json'
      - 'docs/site-system-v4/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-v4-build-main
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '[v4-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Incremental sitemap materialization compares HEAD with HEAD^.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate source before materialization
        run: node scripts/site-system-v4-validate.js

      - name: Materialize canonical homepage aircraft artwork
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='官网首图.png'
          TARGET='assets/qilylean-aircraft-hero-approved-20260826.png'
          EXPECTED_BLOB='e67ad824312acecab66a7b93e4f9e38b85835af9'
          test -f "$SOURCE"
          ACTUAL_BLOB="$(git hash-object "$SOURCE")"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          mkdir -p assets
          if ! cmp -s "$SOURCE" "$TARGET"; then
            cp "$SOURCE" "$TARGET"
          fi
          cmp -s "$SOURCE" "$TARGET"
          node - <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('官网首图.png');
          const target=fs.readFileSync('assets/qilylean-aircraft-hero-approved-20260826.png');
          const png=Buffer.from([137,80,78,71,13,10,26,10]);
          if(!source.subarray(0,8).equals(png)) throw new Error('Canonical homepage aircraft artwork is not PNG');
          if(source.readUInt32BE(16)!==1672||source.readUInt32BE(20)!==941) throw new Error('Canonical homepage aircraft artwork dimensions changed');
          if(!source.equals(target)) throw new Error('Production aircraft asset is not byte-identical to 官网首图.png');
          console.log(`Canonical homepage aircraft artwork ready: ${source.length} bytes, 1672x941; no recompression or quality loss.`);
          NODE
          ! grep -RIl --exclude-dir=.git -E 'git fetch[^\n]*c919-approved-20260826|git show[^\n]*c919-strategy-hero-v14\.png' .github scripts >/tmp/qily-old-aircraft-runtime.txt

      - name: Materialize approved aircraft brand hero
        run: |
          set -euo pipefail
          node --check scripts/enforce-aircraft-home-hero.js
          node scripts/enforce-aircraft-home-hero.js
          grep -q 'qilylean-aircraft-hero-approved-20260826.png?v=20260827-home-original-approved-v2' index.html
          ! sed -n '/QILY-AIRCRAFT-BRAND-HERO-V1:START/,/QILY-AIRCRAFT-BRAND-HERO-V1:END/p' index.html | grep -Eq '<picture|<source|srcset=|data-src=|data-srcset='
          node scripts/site-regression-guard-aircraft-hero.js

      - name: Normalize regional sitemap URL contract
        run: node scripts/qilylean-north-v4-sitemap-contract.js

      - name: Materialize incremental sitemap lastmod
        run: node scripts/site-system-v4-sitemap-lastmod.js --write

      - name: Materialize production build identity
        env:
          QILY_SOURCE_COMMIT: ${{ github.sha }}
          QILY_BUILD_STATE: CI_PASS
        run: node scripts/site-system-v4-build-meta.js

      - name: Revalidate generated source
        run: |
          node scripts/qilylean-north-v4-sitemap-contract.js --check
          node scripts/site-system-v4-validate.js
          node scripts/site-regression-guard-aircraft-hero.js
          npm run test:seo
          git diff --check

      - name: Commit V4 generated metadata and canonical aircraft artwork
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            assets/qilylean-aircraft-hero-approved-20260826.png
            meta/build.json
            sitemap.xml
            sitemap-core.xml
            index.html
            scripts/validate-sitewide-remediation-20260822.js
          )
          if git diff --quiet -- "${paths[@]}" && git ls-files --error-unmatch assets/qilylean-aircraft-hero-approved-20260826.png >/dev/null 2>&1; then
            echo 'V4 production metadata and canonical aircraft hero closure already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'build(v4): materialize canonical homepage aircraft artwork [v4-generated]'
          git pull --rebase origin main
          git push
