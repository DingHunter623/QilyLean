name: QilyLean V4 Build

on:
  push:
    branches: [main]
    paths-ignore:
      # China-site deployment owns these files; V4 must not touch COM on CN-only pushes.
      - 'cn-site/**'
      - 'services/cn-translation/**'
      - 'scripts/cn-*.spec.js'
      - 'scripts/cn-*.py'
      - 'scripts/test-cn-*.py'
      - '.github/workflows/cn-*.yml'
      - '.github/workflows/deploy-cn-preprod.yml'
      - 'meta/build.json'
      - 'maintenance/site-system-v4-*.json'
      - 'docs/site-system-v4/**'
      - 'site-visual-readability-v5.css'
      - 'scripts/publish-visual-readability-v5.js'
      - '.github/workflows/publish-visual-readability-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

# V4 owns its generated production artifacts. The sitewide readability publisher is
# excluded above so both HTML materializers are never triggered by the same visual-only change.
concurrency:
  group: qily-v4-build-main
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '[v4-generated]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate latest user-approved airplane SSOT
        shell: bash
        run: |
          set -euo pipefail
          declare -A EXPECTED_BLOBS=(
            ['assets/aircraft/aircraft-international-20261019-912.webp']='d02a9bc9a76ec439fd63c30008802c773870cb4e'
            ['assets/aircraft/aircraft-international-20261019-1824.webp']='1f65c74f1d2396a92fa802d69eebe8f6674b1583'
            ['assets/aircraft/aircraft-international-20261019-2736.webp']='c2fc7abd86e3cc7a7176c4d1e831cd1b2d993b82'
          )
          for SOURCE in "${!EXPECTED_BLOBS[@]}"; do
            test -f "$SOURCE"
            ACTUAL_BLOB="$(git hash-object "$SOURCE")"
            test "$ACTUAL_BLOB" = "${EXPECTED_BLOBS[$SOURCE]}"
            echo "Homepage aircraft WebP locked: $SOURCE $ACTUAL_BLOB"
          done
          test ! -e 'assets/qilylean-aircraft-hero-approved-20260826.png'


      - name: Validate source before materialization
        run: |
          node --check scripts/build-trust-search-sync.js
          node --check scripts/sync-search-brief-metadata.js
          node scripts/build-trust-search-sync.js --search-only
          node scripts/site-system-v4-validate.js
          node scripts/validate-translation-single-runtime-v1.js

      - name: Validate canonical homepage aircraft artwork
        shell: bash
        run: |
          set -euo pipefail
          node scripts/aircraft-assets.js

      - name: Materialize approved aircraft brand hero
        run: |
          set -euo pipefail
          node --check scripts/enforce-aircraft-home-hero.js
          node scripts/enforce-aircraft-home-hero.js
          grep -q 'aircraft-international-20261019-2736.webp' index.html
          node scripts/site-regression-guard-aircraft-hero.js

      - name: Guard sitewide floating dock gold identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--qily-dock-text:#ffe39b' site-floating-dock-standard-v1.css
          grep -q -- 'color:var(--qily-dock-text)!important' site-floating-dock-standard-v1.css
          grep -q -- '-webkit-text-fill-color:var(--qily-dock-text)!important' site-floating-dock-standard-v1.css

      - name: Normalize regional sitemap URL contract
        run: node scripts/qilylean-north-v4-sitemap-contract.js

      - name: Materialize incremental sitemap lastmod
        run: node scripts/site-system-v4-sitemap-lastmod.js --write

      - name: Materialize production build identity
        env:
          QILY_SOURCE_COMMIT: ${{ github.sha }}
          QILY_BUILD_STATE: CI_PASS
        run: node scripts/site-system-v4-build-meta.js

      - name: Revalidate V4-owned generated source
        run: |
          node scripts/qilylean-north-v4-sitemap-contract.js --check
          node scripts/site-system-v4-validate.js
          node scripts/site-regression-guard-aircraft-hero.js
          node scripts/validate-sitewide-visual-closure-v27.js
          node scripts/validate-tea-culture-visual-closure-v1.js
          node scripts/validate-translation-single-runtime-v1.js
          npm run test:seo
          git diff --check

      - name: Commit V4 generated metadata and canonical aircraft artwork
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            assets/aircraft/manifest.json
            meta/build.json
            sitemap.xml
            sitemap-core.xml
            index.html
            scripts/validate-sitewide-remediation-20260822.js
            qilylean/site-data.json
            qilylean/site-search-index.json
          )
          if git diff --quiet -- "${paths[@]}" \
            && git ls-files --error-unmatch assets/aircraft/aircraft-international-20261019-2736.webp >/dev/null 2>&1; then
            echo 'V4 production metadata and latest canonical aircraft hero already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'build(v4): materialize latest canonical aircraft hero [v4-generated]'
          git pull --rebase origin main
          git push
