name: Validate annotated navigation/footer redline closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'site-public-footer-type-v1.css'
      - 'cn-site/site-public-footer-type-v1.css'
      - 'site-navigation.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-visual-system-v2.css'
      - 'knowledge/index.html'
      - 'cn-site/assets/cn-nav-rail-v1.js'
      - 'cn-site/assets/cn-footer-actions-v1.css'
      - 'cn-site/**/*.html'
      - 'global-knowledge/cn-bridge-shell-v1.css'
      - 'global-knowledge/cn-bridge-shell-v1.js'
      - 'links/cn-public/index.html'
      - 'scripts/redline-navigation-footer-parity.spec.js'
      - '.github/workflows/validate-redline-navigation-footer-parity.yml'
  push:
    branches: [main]
    paths:
      - 'site-public-footer-type-v1.css'
      - 'cn-site/site-public-footer-type-v1.css'
      - 'site-navigation.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-visual-system-v2.css'
      - 'knowledge/index.html'
      - 'cn-site/assets/cn-nav-rail-v1.js'
      - 'cn-site/assets/cn-footer-actions-v1.css'
      - 'global-knowledge/cn-bridge-shell-v1.css'
      - 'global-knowledge/cn-bridge-shell-v1.js'
      - 'scripts/redline-navigation-footer-parity.spec.js'
      - '.github/workflows/validate-redline-navigation-footer-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redline-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static syntax and patch integrity
        run: |
          node --check site-navigation.js
          node --check site-dock-share-runtime-v1.js
          node --check cn-site/assets/cn-nav-rail-v1.js
          node --check global-knowledge/cn-bridge-shell-v1.js
          node --check scripts/redline-navigation-footer-parity.spec.js
          git diff --check
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start international and China-site servers
        run: |
          python3 -m http.server 4173 --directory . >/tmp/qily-redline-int.log 2>&1 &
          python3 -m http.server 4174 --directory cn-site >/tmp/qily-redline-cn.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
      - name: Verify annotated redline closure in Chromium
        env:
          QILY_INT_BASE: http://127.0.0.1:4173
          QILY_CN_BASE: http://127.0.0.1:4174
        run: npx playwright test scripts/redline-navigation-footer-parity.spec.js --reporter=line --workers=1
