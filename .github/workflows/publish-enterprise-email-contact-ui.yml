name: Publish enterprise email contact UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-enterprise-email-contact-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add enterprise email to global contact modal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          core = Path('site-navigation-core.js')
          text = core.read_text(encoding='utf-8')

          if "var CONTACT_EMAIL = 'admin@qilylean.com';" not in text:
              needle = "  var PHONE_NUMBERS = ['13450014003', '15168120722', '17681788259'];\n"
              if needle not in text:
                  raise SystemExit('PHONE_NUMBERS anchor not found in site-navigation-core.js')
              text = text.replace(needle, needle + "  var CONTACT_EMAIL = 'admin@qilylean.com';\n", 1)

          old_contact = "    contactMask.innerHTML = '<div class=\"qily-modal-panel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"qilyContactTitle\"><button class=\"qily-modal-close\" type=\"button\" aria-label=\"关闭\">×</button><h3 id=\"qilyContactTitle\">交流</h3><img class=\"wx-qr-image qily-contact-qr\" alt=\"微信二维码\"><p class=\"qily-wechat\"><span>微信号</span><strong>Qily259</strong></p><button class=\"qily-copy-wechat\" type=\"button\">复制微信号</button><div class=\"qily-phone-list\"><div>手机号码</div>' + PHONE_NUMBERS.map(function (phone) { return '<a href=\"tel:' + phone + '\">' + phone + '</a>'; }).join('') + '</div></div>';\n"
          new_contact = "    contactMask.innerHTML = '<div class=\"qily-modal-panel qily-contact-panel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"qilyContactTitle\"><button class=\"qily-modal-close\" type=\"button\" aria-label=\"关闭\">×</button><h3 id=\"qilyContactTitle\">交流</h3><img class=\"wx-qr-image qily-contact-qr\" alt=\"微信二维码\"><p class=\"qily-wechat\"><span>微信号</span><strong>Qily259</strong></p><button class=\"qily-copy-wechat\" type=\"button\">复制微信号</button><div class=\"qily-phone-list\"><div>手机号码</div>' + PHONE_NUMBERS.map(function (phone) { return '<a href=\"tel:' + phone + '\">' + phone + '</a>'; }).join('') + '</div><div class=\"qily-email-list\"><div>企业邮箱</div><a class=\"qily-contact-email\" href=\"mailto:' + CONTACT_EMAIL + '\">' + CONTACT_EMAIL + '</a><div class=\"qily-email-actions\"><button class=\"qily-copy-email\" type=\"button\">复制邮箱</button><a class=\"qily-send-email\" href=\"mailto:' + CONTACT_EMAIL + '\">发送邮件</a></div></div></div>';\n"
          if old_contact in text:
              text = text.replace(old_contact, new_contact, 1)
          elif 'qily-email-list' not in text:
              raise SystemExit('Global contact modal anchor not found')

          event_anchor = "    contactMask.querySelector('.qily-copy-wechat').addEventListener('click', function () {\n      copyText('Qily259').then(function () { showToast('微信号已复制'); });\n    });\n"
          event_new = event_anchor + "    contactMask.querySelector('.qily-copy-email').addEventListener('click', function () {\n      copyText(CONTACT_EMAIL).then(function () { showToast('企业邮箱已复制'); });\n    });\n"
          if "querySelector('.qily-copy-email')" not in text:
              if event_anchor not in text:
                  raise SystemExit('WeChat copy event anchor not found')
              text = text.replace(event_anchor, event_new, 1)

          text = text.replace("var SHARED_ASSET_VERSION = '20260729-no-old-flash-v1';", "var SHARED_ASSET_VERSION = '20260807-enterprise-email-contact-v1';")
          core.write_text(text, encoding='utf-8')

          css = Path('site-shell.css')
          css_text = css.read_text(encoding='utf-8')
          if 'QILY-ENTERPRISE-EMAIL-CONTACT:START' not in css_text:
              css_text += r'''

/* QILY-ENTERPRISE-EMAIL-CONTACT:START */
.qily-contact-panel{width:min(92vw,480px)}
.qily-email-list{display:grid;gap:8px;margin:18px 0 2px;padding-top:16px;border-top:1px solid var(--qily-line)}
.qily-email-list>div:first-child{color:var(--qily-muted);font-size:14px;font-weight:800}
.qily-contact-email{display:flex;align-items:center;justify-content:center;min-height:42px;padding:8px 12px;border:1px solid var(--qily-line);border-radius:10px;color:var(--qily-forest)!important;background:#f6fbfa;font-weight:900;letter-spacing:.01em;text-decoration:none!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qily-email-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qily-copy-email,.qily-send-email{display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:42px;padding:9px 12px;border:0;border-radius:10px;color:#fff!important;background:var(--qily-forest);cursor:pointer;font:inherit;font-weight:850;line-height:1.2;text-decoration:none!important;white-space:nowrap}
.qily-copy-email:hover,.qily-copy-email:focus-visible,.qily-send-email:hover,.qily-send-email:focus-visible{background:var(--qily-deep);outline:3px solid rgba(23,139,148,.2);outline-offset:2px}
@media(max-width:420px){.qily-modal-panel.qily-contact-panel{width:min(94vw,380px);padding:22px 18px}.qily-email-actions{grid-template-columns:1fr}.qily-contact-email{font-size:14px}}
/* QILY-ENTERPRISE-EMAIL-CONTACT:END */
'''
          css.write_text(css_text, encoding='utf-8')

          legacy = Path('site-navigation-legacy-20260802.js')
          legacy_text = legacy.read_text(encoding='utf-8')
          legacy_text = re.sub(r"var CORE_SRC = '/site-navigation-core\.js\?v=[^']+';", "var CORE_SRC = '/site-navigation-core.js?v=20260807-enterprise-email-contact-v1';", legacy_text, count=1)
          legacy.write_text(legacy_text, encoding='utf-8')

          wrapper = Path('site-navigation.js')
          wrapper_text = wrapper.read_text(encoding='utf-8')
          wrapper_text = re.sub(r"legacy\.src = '/site-navigation-legacy-20260802\.js\?v=[^']+';", "legacy.src = '/site-navigation-legacy-20260802.js?v=20260807-enterprise-email-contact-v1';", wrapper_text, count=1)
          wrapper.write_text(wrapper_text, encoding='utf-8')

          # Bust the outer navigation loader on all HTML pages that already load it.
          for path in Path('.').rglob('*.html'):
              try:
                  page = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = re.sub(r'/site-navigation\.js\?v=[^\"\'<>\s]+', '/site-navigation.js?v=20260807-enterprise-email-contact-v1', page)
              if updated != page:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Audit contact, cooperation and feedback email exposure
        shell: bash
        run: |
          set -euo pipefail
          node --check site-navigation-core.js
          node --check site-navigation.js
          node --check site-navigation-legacy-20260802.js
          grep -q "var CONTACT_EMAIL = 'admin@qilylean.com';" site-navigation-core.js
          grep -q 'qily-email-list' site-navigation-core.js
          grep -q '复制邮箱' site-navigation-core.js
          grep -q '发送邮件' site-navigation-core.js
          grep -q 'mailto:' site-navigation-core.js
          grep -q 'admin@qilylean.com' cooperation/index.html
          grep -q 'mailto:admin@qilylean.com' app-support/index.html
          grep -q 'admin@qilylean.com' trust/index.html
          grep -q 'admin@qilylean.com' cloudflare-worker/worker.js

          if git grep -n -I -F '396767769@qq.com' -- ':!*.lock' ':!.github/workflows/*'; then
            echo 'Legacy public QQ contact email remains in tracked non-workflow text files.'
            exit 1
          fi

          html_refs=$(git grep -l -E '/site-navigation\.js\?v=' -- '*.html' | wc -l | tr -d ' ')
          stale_refs=$(git grep -l -E '/site-navigation\.js\?v=(?!20260807-enterprise-email-contact-v1)' --perl-regexp -- '*.html' 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "HTML navigation references: $html_refs"
          echo "Stale HTML navigation references: $stale_refs"
          test "$stale_refs" -eq 0

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add site-navigation-core.js site-shell.css site-navigation-legacy-20260802.js site-navigation.js '*.html' '**/*.html' 2>/dev/null || git add -A
          git add -A
          git commit -m '全站交流入口新增企业邮箱并统一公开联系信息'
          git push origin HEAD:main
