name: One-time cancel stale CN release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-force-cancel-stale-cn-run-20261025.yml'
permissions:
  contents: read
  actions: write
jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale CN production run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_RUN_ID: '40200756415'
        run: |
          set -euo pipefail
          status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/runs/$STALE_RUN_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          echo "stale run status before cancel: $status"
          if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "pending" ] || [ "$status" = "requested" ] || [ "$status" = "waiting" ]; then
            curl -fsSL -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$STALE_RUN_ID/force-cancel"
          fi
