name: Publish site-wide layout and typography

on:
  push:
    branches: [main]
    paths:
      - "scripts/publish-site-system-v2.js"
      - "site-wide-layout-v1.css"
      - "site-typography-v1.css"
      - ".github/workflows/unlock-public-modules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site-system-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish balanced layout and typography
        run: node scripts/publish-site-system-v2.js

      - name: Validate alignment, hierarchy and cache refresh
        shell: bash
        run: |
          grep -q 'site-wide-layout-v1.css?v=20260728-balanced-layout-v3' site-navigation.js
          grep -q 'site-typography-v1.css?v=20260728-type-system-v2' site-navigation.js
          grep -q 'addWideLayoutStylesheet();' site-navigation.js
          grep -q 'addTypographyStylesheet();' site-navigation.js
          grep -q -- '--qily-wide-content:1480px' site-wide-layout-v1.css
          grep -q '.section>.section-inner' site-wide-layout-v1.css
          grep -q 'main.main:has(>.chat)>.chat' site-wide-layout-v1.css
          grep -q '.paper-grid' site-wide-layout-v1.css
          grep -q -- '--qily-type-nav-1:17px' site-typography-v1.css
          grep -q -- '--qily-type-nav-2:16px' site-typography-v1.css
          grep -q -- '--qily-type-nav-3:15px' site-typography-v1.css
          grep -q -- '--qily-type-body:18.5px' site-typography-v1.css
          grep -q '.paper-card h3' site-typography-v1.css
          grep -q '.answer-content h2' site-typography-v1.css
          grep -q '.composer textarea' site-typography-v1.css
          grep -R -q 'site-navigation.js?v=20260728-layout-type-v2' --include='*.html' .

      - name: Commit site-system release
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Site-wide layout and typography are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-navigation.js '*.html' '**/*.html'
          git commit -m "fix: publish balanced layout and typography hierarchy [skip ci]"
          git push
