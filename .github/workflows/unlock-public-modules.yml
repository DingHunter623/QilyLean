name: Restore QilyLean VI and contrast closure

on:
  push:
    branches: [main]
    paths:
      - "scripts/publish-site-system-v2.js"
      - "scripts/normalize-static-source-output.js"
      - "site-navigation.js"
      - "site-shell.css"
      - "site-visual-scale-v1.css"
      - "site-wide-layout-v1.css"
      - "site-typography-v1.css"
      - "site-vi-standard-v1.css"
      - "site-vi-contrast-restoration-v1.css"
      - "homepage-music.js"
      - "homepage-music-core-v4.js"
      - ".github/workflows/unlock-public-modules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-publication-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish restored VI and contrast-safe public shell
        run: node scripts/publish-site-system-v2.js

      - name: Validate VI, controls, navigation, evidence context and cache refresh
        shell: bash
        run: |
          node --check scripts/publish-site-system-v2.js
          node --check scripts/normalize-static-source-output.js
          node --check site-navigation.js
          node --check homepage-music-core-v4.js
          grep -q 'site-vi-standard-v1.css?v=20260801-vi-standard-v1' site-navigation.js
          grep -q 'site-vi-contrast-restoration-v1.css?v=20260803-vi-contrast-hotfix-v1' site-navigation.js
          ! grep -q 'site-microsoft-international-v1.css?v=' site-navigation.js
          ! grep -q 'site-microsoft-enterprise-components-v2.css?v=' site-navigation.js
          ! grep -q 'enhancer.src=.*/site-microsoft-international-v1.js' site-navigation.js
          grep -q -- '--qily-vi-olive:#0f4b5a' site-vi-standard-v1.css
          grep -q 'QilyLean 全站VI可读性恢复与对比度保险层' site-vi-contrast-restoration-v1.css
          grep -q '.site-music-toggle' site-vi-contrast-restoration-v1.css
          grep -q '.qily-float-contact' site-vi-contrast-restoration-v1.css
          grep -q '#qily-commercial-deliveries' site-vi-contrast-restoration-v1.css
          grep -q '.qily-modal-close' site-vi-contrast-restoration-v1.css
          grep -q 'var speakerOn' homepage-music-core-v4.js
          grep -q "button.className = 'site-music-toggle'" homepage-music-core-v4.js
          grep -R -q 'data-qily-shell-bootstrap' --include='*.html' .
          grep -R -q '<script defer src="/site-navigation.js?v=20260803-vi-contrast-restored-v1"' --include='*.html' .
          grep -R -q 'site-vi-standard-v1.css?v=20260801-vi-standard-v1' --include='*.html' .
          grep -R -q 'site-vi-contrast-restoration-v1.css?v=20260803-vi-contrast-hotfix-v1' --include='*.html' .
          grep -q '<h2>2022年度某制造企业｜制造改善项目佐证资料</h2>' capabilities/index.html
          grep -q '以下资料来自2022年度某制造企业的制造改善项目' capabilities/index.html
          grep -q '<h1>某制造企业｜2022年度制造改善项目佐证资料</h1>' projects/lean-improvement-evidence/index.html
          grep -q '查看商业交付档案' trust/index.html
          grep -q '查看客户评价授权规则' trust/index.html

      - name: Commit restored VI public pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Restored VI and contrast-safe pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish restored QilyLean VI and contrast closure [skip ci]"
          git pull --rebase origin main
          git push origin main
