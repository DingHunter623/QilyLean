name: Fix brief total count sync 20260809

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-brief-total-count-sync-20260809.yml"
      - "scripts/fix-brief-total-count-sync-20260809.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-brief-total-sync-main
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Apply canonical brief count rule
        run: |
          node --check scripts/fix-brief-total-count-sync-20260809.js
          node scripts/fix-brief-total-count-sync-20260809.js
          node --check scripts/build-daily-archive.js
          node --check scripts/publish-20260808-training-note.js
          grep -F '2019-07-10—2026-08-10｜共2589期' qilylean/daily-insights.html
          grep -F '当前显示全部 2589 期' qilylean/daily-insights.html
          grep -F 'data-brief-counted="false"' qilylean/daily-insights.html
          grep -F "!card.hasAttribute('data-brief-training-note')" qilylean/daily-insights.html
          grep -F '"total": 2589' qilylean/site-data.json
          grep -F '<strong>2589</strong><span>今日简报总数</span>' trust/index.html
          git diff --check
      - name: Commit count synchronization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Brief totals already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qilylean/daily-insights.html scripts/build-daily-archive.js scripts/publish-20260808-training-note.js
          git commit -m "修复简报总期数：培训纪要不重复计入正式期数 [skip ci]"
          git push origin HEAD:main
