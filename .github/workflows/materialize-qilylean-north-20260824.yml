name: Materialize QilyLean NORTH

on:
  pull_request:
    paths:
      - 'scripts/materialize-qilylean-north-20260824.js'
      - 'scripts/enforce-qilylean-north-funnel-v1.js'
      - 'scripts/enforce-public-canonical-no-trailing-v1.js'
      - 'scripts/qilylean-north-v4-sitemap-contract.js'
      - 'scripts/north-factory-diagnosis-v1.js'
      - 'styles/qily-north-v1.css'
      - 'styles/qily-north-diagnosis-v1.css'
      - '.github/workflows/materialize-qilylean-north-20260824.yml'
      - 'index.html'
      - 'projects/lean-improvement-evidence/index.html'
      - 'sitemap.xml'
      - 'north/**'
      - 'tools/pure-ddz/index.html'
  push:
    branches:
      - main
    paths:
      - 'scripts/materialize-qilylean-north-20260824.js'
      - 'scripts/enforce-qilylean-north-funnel-v1.js'
      - 'scripts/enforce-public-canonical-no-trailing-v1.js'
      - 'scripts/qilylean-north-v4-sitemap-contract.js'
      - 'scripts/north-factory-diagnosis-v1.js'
      - 'styles/qily-north-v1.css'
      - 'styles/qily-north-diagnosis-v1.css'
      - '.github/workflows/materialize-qilylean-north-20260824.yml'
      - 'index.html'
      - 'projects/lean-improvement-evidence/index.html'
      - 'sitemap.xml'
      - 'north/**'
      - 'tools/pure-ddz/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          node --check scripts/materialize-qilylean-north-20260824.js
          node --check scripts/enforce-qilylean-north-funnel-v1.js
          node --check scripts/enforce-public-canonical-no-trailing-v1.js
          node --check scripts/qilylean-north-v4-sitemap-contract.js
          node --check scripts/north-factory-diagnosis-v1.js

      - name: Materialize regional static assets
        run: |
          node scripts/materialize-qilylean-north-20260824.js
          node scripts/enforce-qilylean-north-funnel-v1.js
          node scripts/enforce-public-canonical-no-trailing-v1.js
          node scripts/qilylean-north-v4-sitemap-contract.js

      - name: Validate generated contract
        shell: bash
        run: |
          set -euo pipefail
          test -f north/index.html
          test -f north/inner-mongolia/index.html
          test -f north/shaanxi/index.html
          test -f north/ningxia/index.html
          test -f north/gansu/index.html
          test -f north/diagnosis/index.html
          test -f styles/qily-north-diagnosis-v1.css
          test -f scripts/north-factory-diagnosis-v1.js
          grep -q 'QILY-NORTH-HOME-V1:START' index.html
          grep -q '内蒙古某新能源负极材料制造加工厂' projects/lean-improvement-evidence/index.html
          grep -q '<loc>https://qilylean.com/north/inner-mongolia</loc>' sitemap.xml
          grep -q '<loc>https://qilylean.com/north/diagnosis</loc>' sitemap.xml
          grep -q '/north/diagnosis/' index.html
          grep -q '/north/diagnosis/' north/index.html
          grep -q 'data-qily-diagnosis-form' north/diagnosis/index.html
          grep -q 'site-interaction-continuity-v1.css' north/index.html
          grep -q '1560px' styles/qily-north-v1.css
          node scripts/enforce-public-canonical-no-trailing-v1.js --check
          node scripts/qilylean-north-v4-sitemap-contract.js --check
          git diff --check

      - name: Commit materialized public files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html sitemap.xml projects/lean-improvement-evidence/index.html north tools/pure-ddz/index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml projects/lean-improvement-evidence/index.html north tools/pure-ddz/index.html
          git commit -m 'feat: materialize QilyLean NORTH regional funnel [skip ci]'
          git pull --rebase origin main
          git push
