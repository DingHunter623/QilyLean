name: Publish global link standard

on:
  push:
    branches: [main]
    paths:
      - "site-link-standard-v1.css"
      - "site-link-standard-v2.css"
      - "site-dark-surface-contrast-v1.css"
      - "site-navigation.js"
      - "scripts/publish-global-link-standard.js"
      - ".github/workflows/publish-global-link-standard.yml"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-global-link-standard-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply the site-wide link and dark-surface standards
        run: node scripts/publish-global-link-standard.js

      - name: Validate navigation, anchor underline and dark-surface contrast
        shell: bash
        run: |
          node --check scripts/publish-global-link-standard.js
          grep -q '全站链接视觉规范 v5' site-link-standard-v2.css
          grep -q '深色／橄榄绿底色可视化规范 v1' site-dark-surface-contrast-v1.css
          grep -q 'article-hub' site-dark-surface-contrast-v1.css
          grep -q 'color:#fff!important' site-dark-surface-contrast-v1.css
          grep -q 'text-decoration-color:#ffe39b!important' site-dark-surface-contrast-v1.css
          grep -q 'article-links a\[href\]:not(\[aria-current="page"\])' site-dark-surface-contrast-v1.css
          grep -q 'qily-global-link-standard-loader-v1' site-navigation.js
          grep -q 'site-link-standard-v2.css?v=20260801-global-link-v5' site-navigation.js
          grep -q 'site-dark-surface-contrast-v1.css?v=20260801-dark-surface-v1' site-navigation.js
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const failures = [];
          const stale = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              if (['.git','node_modules','.cache'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) {
                const html = fs.readFileSync(full, 'utf8');
                if (/<\/head>/i.test(html) && !html.includes('qilyGlobalLinkStandardStylesheet')) failures.push(path.relative(root, full) + ':link');
                if (/<\/head>/i.test(html) && !html.includes('qilyDarkSurfaceContrastStylesheet')) failures.push(path.relative(root, full) + ':dark');
                if (html.includes('qilyGlobalLinkStandardStylesheet') && !html.includes('site-link-standard-v2.css?v=20260801-global-link-v5')) stale.push(path.relative(root, full) + ':link');
                if (html.includes('qilyDarkSurfaceContrastStylesheet') && !html.includes('site-dark-surface-contrast-v1.css?v=20260801-dark-surface-v1')) stale.push(path.relative(root, full) + ':dark');
              }
            }
          }
          walk(root);
          if (failures.length) throw new Error('Pages missing visual standards: ' + failures.slice(0,20).join(', '));
          if (stale.length) throw new Error('Pages using stale visual-standard cache versions: ' + stale.slice(0,20).join(', '));
          const vsm = fs.readFileSync('improvements/vsm/index.html', 'utf8');
          if (!vsm.includes('class="article-hub"')) throw new Error('VSM article hub is missing');
          NODE

      - name: Commit global visual standards
        shell: bash
        run: |
          if git diff --quiet; then
            echo "The global link and dark-surface standards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-navigation.js '*.html' '**/*.html'
          git commit -m "style: publish white text on dark surfaces site-wide [skip ci]"
          git push
