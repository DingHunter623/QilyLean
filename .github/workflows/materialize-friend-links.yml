name: Materialize friend-links baseline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-friend-links-and-layout.js'
      - '.github/workflows/materialize-friend-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-friend-links-main
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate friend-links enforcer syntax
        run: node --check scripts/enforce-friend-links-and-layout.js

      - name: Materialize friend-links baseline
        run: node scripts/enforce-friend-links-and-layout.js

      - name: Verify hao123 link and layout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'hao123|hao123 上网导航|网址导航|中国|https://www.hao123.com/' links/index.html
          grep -q "'网址导航'" links/index.html
          grep -q '友情链接｜全球科技企业100强' links/index.html
          grep -q 'width:min(1240px,100%)' links/index.html
          git diff --check

      - name: Commit materialized friend-links page
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Friend-links page already matches the permanent baseline.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add links/index.html index.html
          git commit -m 'Links: materialize hao123 friend link [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
