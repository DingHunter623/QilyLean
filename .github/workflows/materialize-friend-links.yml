name: Materialize friend-links baseline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-friend-links-and-layout.js'
      - 'scripts/site-friend-links-layout-guard.js'
      - '.github/workflows/materialize-friend-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-friend-links-main
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate friend-links enforcer syntax
        run: node --check scripts/enforce-friend-links-and-layout.js

      - name: Materialize friend-links baseline
        run: node scripts/enforce-friend-links-and-layout.js

      - name: Verify friend-links, full brand, China knowledge bridge and 1180px contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'hao123|hao123 上网导航|网址导航|中国|https://www.hao123.com/' links/index.html
          grep -q "'网址导航'" links/index.html
          grep -q '友情链接｜全球科技企业100强' links/index.html
          grep -Fq '与 QilyLean | 启力精益 制造业应用价值精选' links/index.html
          grep -Fq '<strong>网址导航友情链接：</strong>QilyLean | 启力精益 已增加主流网址导航官方入口' links/index.html
          grep -q 'id="qilyChinaKnowledgeBridge"' links/index.html
          grep -Fq '<strong>精益制造经验分享（QilyLean | 启力精益中国站）：</strong>' links/index.html
          grep -Fq '进入精益制造经验分享 ↗' links/index.html
          grep -Fq 'qilylean.cn 网站名称为“精益制造经验分享”' links/index.html
          grep -q 'href="https://qilylean.cn/"' links/index.html
          grep -q '不作为“全球科技企业100强”的企业收录项或排名依据' links/index.html
          grep -q 'width:min(1180px,100%)' links/index.html
          if grep -Eq 'width:min\((1240|1360|1560)px,100%\)' links/index.html; then
            echo 'Legacy non-1180 content axis returned on /links/.' >&2
            exit 1
          fi
          node scripts/site-friend-links-layout-guard.js
          git diff --check

      - name: Commit materialized friend-links page
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Friend-links page already matches the permanent baseline.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add links/index.html index.html
          git commit -m 'Links: materialize full-brand China knowledge bridge [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
