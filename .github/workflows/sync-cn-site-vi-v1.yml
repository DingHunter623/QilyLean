name: Validate QilyLean China VI base bridge

on:
  push:
    branches: [main]
    paths:
      - 'cn-site/assets/qilylean-vi-v1.css'
      - 'cn-site/assets/qilylean-vi-v2.css'
      - '.github/workflows/sync-cn-site-vi-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-cn-site-vi-base-guard
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Verify one final China-site VI authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "@import url('/assets/qilylean-vi-v1.css?v=20260923-cn-typography-base-v7');" cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-TYPE-HIERARCHY-V5' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'QILY-CN-HEADER-SHELL-PARITY-V3' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'min-height:83.4px!important' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h2:clamp(20px,1.25vw,22px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq -- '--qily-cn-h3:clamp(17px,1vw,19px)' cn-site/assets/qilylean-vi-v2.css
          grep -Fq 'clamp(20px,1.25vw,22px)!important' cn-site/assets/qilylean-vi-v1.css
          ! grep -Fq 'clamp(32px,3vw,48px)!important' cn-site/assets/qilylean-vi-v1.css
          python3 - <<'PY'
          from pathlib import Path

          expected = '/assets/qilylean-vi-v2.css?v=20260926-cn-vi-v28-footer-visual-parity'
          bad = []
          docs = 0
          for path in sorted(Path('cn-site').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text.lower() or '<body' not in text.lower():
                  continue
              docs += 1
              if text.count(expected) != 1:
                  bad.append((str(path), 'v2-count', text.count(expected)))
              if 'qilyCnUnifiedViV1' in text:
                  bad.append((str(path), 'legacy-direct-v1-link'))
          if bad:
              raise SystemExit(f'CN VI authority regression: {bad[:60]}')
          print(f'PASS: {docs} CN public document pages use one V22 authority; V1 is imported only through V2.')
          PY
