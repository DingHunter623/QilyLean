name: Remediate Times26001 release governance 20260827

on:
  push:
    branches:
      - governance/times26001-release-consistency-20260827
    paths:
      - '.github/workflows/remediate-times26001-release-governance-20260827.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: governance/times26001-release-consistency-20260827
          fetch-depth: 0

      - name: Apply release, legal, visual-axis and contact governance remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          VERSION = '1.1.14'
          VERSION_CODE = 17
          TARGET_SDK = 36
          EFFECTIVE_DATE = '2026年8月27日'
          APK_NAME = 'Times26001-Android-v1.1.14-Standard-Website-Logo.apk'
          APK_SHA_FILE = 'Times26001-Android-v1.1.14-Standard-Website-Logo.sha256.txt'
          APK_SHA256 = '4d92f7e09cef8fe9796a8bd19f3642161e0aeb7c8077a254a4e8f2af8691ca63'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_public_release_surface(path):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              s = s.replace('Times26001-Android-v1.1.13-Standard-Website-Logo.apk', APK_NAME)
              s = s.replace('Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt', APK_SHA_FILE)
              s = s.replace('v1.1.13', 'v1.1.14')
              s = s.replace('V1.1.13', 'V1.1.14')
              s = s.replace('versionCode 16', 'versionCode 17')
              s = s.replace('versionCode `16`', 'versionCode `17`')
              s = s.replace('code 16', 'code 17')
              s = s.replace('code16', 'code17')
              p.write_text(s, encoding='utf-8')

          # 1. APK must physically exist and match the controlled build digest before metadata is moved.
          apk = Path(APK_NAME)
          if not apk.exists():
              raise SystemExit(f'missing canonical website APK: {APK_NAME}')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if digest != APK_SHA256:
              raise SystemExit(f'website APK digest mismatch: {digest}')
          Path(APK_SHA_FILE).write_text(f'{APK_SHA256}  {APK_NAME}\n', encoding='utf-8')

          # 2. app-release-manifest.json is the sole current-release master record.
          manifest_path = Path('app-release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['updatedAt'] = '2026-08-27'
          t = manifest['apps']['times26001']
          public = t['publicRelease']
          public.update({
              'versionName': VERSION,
              'versionCode': VERSION_CODE,
              'targetSdk': TARGET_SDK,
              'apk': '/' + APK_NAME,
              'sha256': '/' + APK_SHA_FILE,
              'label': '当前官网安装包（v1.1.14 / code17 / API36 / QilyLean统一LOGO）',
              'status': '用于官网直接下载与试用；采用官网独立测试签名分发链，与Google Play Upload Key / Play App Signing链严格分开管理；签名不同的旧测试版可能需要卸载后安装'
          })
          t['latestBuild']['versionName'] = VERSION
          t['latestBuild']['versionCode'] = VERSION_CODE
          t['latestBuild']['targetSdk'] = TARGET_SDK
          t['storeCandidate']['versionName'] = VERSION
          t['storeCandidate']['versionCode'] = VERSION_CODE
          t['storeCandidate']['targetSdk'] = TARGET_SDK
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3. Synchronize every active Times26001 public release surface, not historical CI recipes.
          release_surfaces = [
              'times26001-home-card.js',
              'tools/times26001/index.html',
              'capabilities/index.html',
              'app-support/index.html',
              'app-download-share-v1.js',
              'assets/tools/times26001-overview.svg',
              'app-store/times26001/README.md',
          ]
          for path in release_surfaces:
              replace_public_release_surface(path)

          # Remove obsolete cache-busting values that still pointed to the former public APK.
          js = Path('app-download-share-v1.js')
          if js.exists():
              s = js.read_text(encoding='utf-8')
              s = re.sub(r"download:'https://qilylean\.com/Times26001-Android-v1\.1\.14-Standard-Website-Logo\.apk\?build=[^']+'",
                         "download:'https://qilylean.com/Times26001-Android-v1.1.14-Standard-Website-Logo.apk?build=20260827-v114'", s)
              js.write_text(s, encoding='utf-8')

          # Normalize website product page labels and direct download cache key.
          tool = Path('tools/times26001/index.html')
          if tool.exists():
              s = tool.read_text(encoding='utf-8')
              s = re.sub(r'Times26001-Android-v1\.1\.14-Standard-Website-Logo\.apk\?build=[^"\'<> ]+',
                         APK_NAME + '?build=20260827-v114', s)
              tool.write_text(s, encoding='utf-8')

          # 4. Privacy / terms must follow current app release, not a historical document snapshot.
          privacy = Path('legal/times26001/privacy/index.html')
          s = privacy.read_text(encoding='utf-8')
          s = s.replace('2026年8月15日', EFFECTIVE_DATE)
          s = s.replace('v1.1.13（versionCode 16 / API 36）', 'v1.1.14（versionCode 17 / API 36）')
          s = s.replace('/legal/app-legal.css?v=20260806-store-readiness-v1', '/legal/app-legal.css?v=20260827-release-governance-v2')
          privacy.write_text(s, encoding='utf-8')

          terms = Path('legal/times26001/terms/index.html')
          s = terms.read_text(encoding='utf-8')
          s = s.replace('2026年8月8日', EFFECTIVE_DATE)
          s = s.replace('<strong>版本：</strong>V1.1', '<strong>版本：</strong>v1.1.14（versionCode 17 / API 36）')
          s = s.replace('<strong>版本：</strong> V1.1', '<strong>版本：</strong> v1.1.14（versionCode 17 / API 36）')
          s = s.replace('/legal/app-legal.css?v=20260806-store-readiness-v1', '/legal/app-legal.css?v=20260827-release-governance-v2')
          terms.write_text(s, encoding='utf-8')

          # Every page that uses the shared legal stylesheet receives the new cache key.
          for p in Path('legal').rglob('index.html'):
              s = p.read_text(encoding='utf-8')
              if '/legal/app-legal.css' in s:
                  s = re.sub(r'/legal/app-legal\.css\?v=[^"\']+', '/legal/app-legal.css?v=20260827-release-governance-v2', s)
                  p.write_text(s, encoding='utf-8')

          # 5. Shared legal page geometry: remove obsolete 980px island and inherit site 1560px axis.
          legal_css = Path('legal/app-legal.css')
          css = legal_css.read_text(encoding='utf-8')
          css = css.replace('.top-inner,.wrap{width:min(980px,calc(100% - 36px));margin:auto}',
              '.top-inner,.wrap{width:calc(100% - (2 * var(--qily-content-axis-gutter,clamp(18px,3vw,48px))));max-width:var(--qily-content-axis-max,1560px);margin-inline:auto}')
          marker = '/* QILY-LEGAL-AXIS-CONTACT-GOVERNANCE:20260827 */'
          if marker not in css:
              css += ('\n' + marker + '\n'
                      '.app-legal a[href^="mailto:"],.meta a[href^="mailto:"],.card a[href^="mailto:"],.footer a[href^="mailto:"]{'
                      'text-decoration-line:underline!important;text-decoration-style:solid!important;text-decoration-thickness:1px!important;'
                      'text-underline-offset:3px!important;text-decoration-skip-ink:none!important;white-space:nowrap!important;word-break:normal!important;overflow-wrap:normal!important}'
                      '\n')
          legal_css.write_text(css, encoding='utf-8')

          # 6. Whole-site email address standard: continuous underline and no address splitting.
          link_css = Path('site-link-standard-v1.css')
          css = link_css.read_text(encoding='utf-8')
          marker = '/* QILY-MAILTO-CONTINUOUS-UNDERLINE:20260827 */'
          if marker not in css:
              css += ('\n' + marker + '\n'
                      'a[href^="mailto:"]{text-decoration-line:underline!important;text-decoration-style:solid!important;'
                      'text-decoration-thickness:1px!important;text-underline-offset:3px!important;text-decoration-skip-ink:none!important;'
                      'white-space:nowrap!important;word-break:normal!important;overflow-wrap:normal!important}\n')
          link_css.write_text(css, encoding='utf-8')

          # 7. Replace brittle hardcoded audit with manifest-derived governance gates.
          audit = r'''from pathlib import Path
          import hashlib
          import json
          import re
          import sys

          manifest = json.loads(Path('app-release-manifest.json').read_text(encoding='utf-8'))
          errors = []

          if manifest.get('officialWebsite') != 'https://qilylean.com':
              errors.append('官方网址主数据错误')
          if manifest.get('supportEmail') != 'admin@qilylean.com':
              errors.append('官网邮箱主数据错误')

          apps = manifest.get('apps', {})
          for key in ('times26001', 'qilyleanHome'):
              if key not in apps:
                  errors.append(f'主数据缺少应用: {key}')
                  continue
              app = apps[key]
              public = app['publicRelease']
              latest = app['latestBuild']
              store = app['storeCandidate']
              for field in ('apk', 'sha256'):
                  value = public.get(field)
                  if not value or not Path(value.lstrip('/')).exists():
                      errors.append(f'{key} 官网{field}不存在: {value}')
              if latest.get('targetSdk') != 36 or store.get('targetSdk') != 36:
                  errors.append(f'{key} targetSdk未统一到36')

          t = apps['times26001']
          public = t['publicRelease']
          latest = t['latestBuild']
          store = t['storeCandidate']
          current = (latest.get('versionName'), latest.get('versionCode'))
          if (public.get('versionName'), public.get('versionCode')) != current:
              errors.append('Times26001 官网下载安装包落后于最新构建')
          if (store.get('versionName'), store.get('versionCode')) != current:
              errors.append('Times26001 Google Play候选落后于最新构建')
          if public.get('targetSdk') != 36:
              errors.append('Times26001 官网包targetSdk未记录为36')
          if '测试签名' not in public.get('status', '') or 'Google Play' not in public.get('status', ''):
              errors.append('Times26001 官网测试签名与Google Play签名链边界说明缺失')
          if 'Upload Key' not in (store.get('status', '') + latest.get('status', '')):
              errors.append('Times26001 Google Play Upload Key状态说明缺失')

          apk_path = Path(public['apk'].lstrip('/'))
          checksum_path = Path(public['sha256'].lstrip('/'))
          if apk_path.exists() and checksum_path.exists():
              digest = hashlib.sha256(apk_path.read_bytes()).hexdigest()
              if digest not in checksum_path.read_text(encoding='utf-8'):
                  errors.append('Times26001 官网APK SHA-256文件与实体不一致')

          release_surfaces = [
              'times26001-home-card.js', 'tools/times26001/index.html', 'capabilities/index.html',
              'app-support/index.html', 'app-download-share-v1.js', 'assets/tools/times26001-overview.svg',
              'legal/times26001/privacy/index.html', 'legal/times26001/terms/index.html'
          ]
          stale = ('v1.1.13', 'versionCode 16', 'code16', 'Times26001-Android-v1.1.13-Standard-Website-Logo.apk')
          for path in release_surfaces:
              p = Path(path)
              if not p.exists():
                  errors.append(f'当前发布面文件不存在: {path}')
                  continue
              text = p.read_text(encoding='utf-8')
              for token in stale:
                  if token in text:
                      errors.append(f'{path} 仍残留旧发布口径: {token}')

          privacy = Path('legal/times26001/privacy/index.html').read_text(encoding='utf-8')
          for token in ('2026年8月27日', 'v1.1.14（versionCode 17 / API 36）', 'admin@qilylean.com', '不使用后台位置'):
              if token not in privacy:
                  errors.append(f'Times26001隐私政策缺当前口径: {token}')
          terms = Path('legal/times26001/terms/index.html').read_text(encoding='utf-8')
          for token in ('2026年8月27日', 'v1.1.14（versionCode 17 / API 36）', 'admin@qilylean.com'):
              if token not in terms:
                  errors.append(f'Times26001用户协议缺当前口径: {token}')

          legal_css = Path('legal/app-legal.css').read_text(encoding='utf-8')
          if '980px' in legal_css:
              errors.append('法律/协议共享样式仍残留980px旧版心')
          for token in ('--qily-content-axis-max,1560px', 'text-decoration-skip-ink:none', 'white-space:nowrap'):
              if token not in legal_css:
                  errors.append(f'法律/协议共享治理缺失: {token}')
          global_links = Path('site-link-standard-v1.css').read_text(encoding='utf-8')
          for token in ('a[href^="mailto:"]', 'text-decoration-skip-ink:none', 'white-space:nowrap'):
              if token not in global_links:
                  errors.append(f'全站邮箱链接规范缺失: {token}')

          # All shared legal pages must use the current shared legal stylesheet cache key.
          for p in Path('legal').rglob('index.html'):
              text = p.read_text(encoding='utf-8')
              if '/legal/app-legal.css' in text and '/legal/app-legal.css?v=20260827-release-governance-v2' not in text:
                  errors.append(f'法律页未同步共享样式版本: {p}')

          # Contact markup audit: visible official email must be a mailto link, never plain current-site text.
          html_paths = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          plain_email = re.compile(r'(?<!mailto:)admin@qilylean\.com')
          for p in html_paths:
              text = p.read_text(encoding='utf-8', errors='ignore')
              if 'admin@qilylean.com' in text and 'mailto:admin@qilylean.com' not in text:
                  # Some machine-readable or script-only pages may carry the address; only flag visible HTML text.
                  if re.search(r'>\s*admin@qilylean\.com\s*<', text):
                      errors.append(f'页面存在未链接的官网邮箱: {p}')

          h = apps['qilyleanHome']
          if (h['publicRelease'].get('versionName'), h['publicRelease'].get('versionCode')) != ('2.3.3', 11):
              errors.append('QilyLean Home官网安装包主数据异常')
          if (h['latestBuild'].get('versionName'), h['latestBuild'].get('versionCode')) != ('2.3.3', 11):
              errors.append('QilyLean Home最新构建主数据异常')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('APP release association audit passed: current APK / store candidate / legal metadata / content axis / continuous mail underline / signing boundary are governed from current release data.')
          '''
          # Dedent inline source because YAML block indentation is retained in shell heredoc source.
          import textwrap
          Path('scripts/audit-app-release-association.py').write_text(textwrap.dedent(audit).lstrip(), encoding='utf-8')

          # 8. Formal incident review and corrective action plan requested by site owner.
          review = '''# Times26001 官网发布一致性事件检讨书与整改计划

**日期：2026-08-27**  
**范围：QilyLean官网 / Times26001官网分发 / 隐私政策 / 用户协议 / 全站联系方式与视觉版心治理**

## 一、检讨结论

本次问题不是单一页面漏改，而是发布治理失效。Times26001 已推进到 v1.1.14 / versionCode 17 / API 36，并完成三星 C55 真机验证，但官网直接下载仍停留在 v1.1.13 / code16；隐私政策、用户协议又分别保留了旧版本与旧生效日期；法律页仍使用独立 980px 版心；邮箱链接虽然已有部分全站样式，但法律页未完整继承，造成下划线视觉不连续。

最需要检讨的是：此前把“官网独立APK”和“Google Play候选”分开管理后，只做了口径解释，没有把“最新版本是否应该同步到官网”做成自动闭环；同时 CI 审计反而硬编码允许官网继续停留 v1.1.13。这相当于用门禁固化了错误状态。发布管理不能再依赖逐页记忆和人工补丁。

## 二、根因

1. **版本主数据多源化。** `app-release-manifest.json`、产品页、下载JS、首页卡片、隐私政策、用户协议、支持页分别保存版本字符串，缺少真正的单一来源约束。
2. **发布链边界被误用。** Google Play Upload Key 与官网测试签名确实应分开，但“签名链分开”不等于“官网可以永久停留旧功能版本”。
3. **法律页未纳入发布关闭清单。** 升级APP时没有强制同步隐私政策、用户协议的版本号、生效日期与功能口径。
4. **历史组件样式脱离全站视觉轴。** `/legal/app-legal.css` 保留 980px 老版心，与全站 1560px 内容轴相冲突。
5. **联系方式规范覆盖不完整。** 全站链接规范已有 `text-decoration-skip-ink:none`，但法律页未完整继承，且没有对邮箱地址禁止换行形成硬性门禁。
6. **CI规则存在硬编码。** 审计脚本直接写死 v1.1.13/code16 与 v1.1.14/code17，而不是从发布主数据派生，版本升级后自然产生漂移。

## 三、立即整改

本次整改将官网可安装包同步到 v1.1.14 / code17 / API36；更新所有当前发布面下载链接和SHA-256；隐私政策与用户协议统一到 2026-08-27 生效、v1.1.14；法律页版心统一继承全站 1560px 内容轴；所有邮箱链接强制连续下划线、禁止地址中途换行；CI改为从 `app-release-manifest.json` 派生当前版本并扫描发布面残留旧版本。

Google Play 正式分发继续使用 Upload Key / Play App Signing 链；官网 APK 继续作为独立测试签名分发链。两条签名链边界必须清晰，但当前功能版本不再无故脱节。

## 四、全站排查范围

排查对象包括当前 Times26001 产品页、首页/能力体系卡片、APP支持页、下载/分享JS、发布清单、产品概览素材、隐私政策、用户协议，以及所有使用 `/legal/app-legal.css` 的法律页面；同时检查全站 `admin@qilylean.com` 可见文本是否使用 `mailto:`，并统一邮箱下划线样式。

历史CI配方、历史构建记录和明确的归档资料保留原版本事实，不把历史事实误改成当前版本；但任何面向访问者的“当前版本/立即下载/当前政策”不得再出现历史版本漂移。

## 五、防再发机制

今后版本发布以 `app-release-manifest.json` 为唯一当前发布主数据。任何 Times26001 最新版本变更，CI必须校验官网 APK实体与SHA-256、官网公开版本与最新构建版本、Google Play候选版本、隐私政策、用户协议、当前发布面字符串、法律页共享样式和邮箱链接规范。任一项不同步即失败，不允许合并。

## 六、验收标准

- 官网“立即下载”真实下载 v1.1.14 / versionCode17 / API36 APK；
- 官网当前发布面不再残留 v1.1.13 / versionCode16；
- 隐私政策与用户协议显示 2026-08-27 和 v1.1.14 / code17 / API36；
- 法律/协议页面不再使用 980px 独立窄版心，统一跟随全站 1560px 内容轴；
- `admin@qilylean.com` 的下划线连续、不因 skip-ink 或地址换行出现断裂；
- Google Play 与官网APK签名链边界明确；
- 发布一致性 CI 全部通过后方可合并上线。
'''
          review_path = Path('docs/incident-reviews/2026-08-27-times26001-site-release-consistency.md')
          review_path.parent.mkdir(parents=True, exist_ok=True)
          review_path.write_text(review, encoding='utf-8')
          PY

      - name: Static acceptance checks before commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-app-release-association.py
          grep -q 'v1.1.14' legal/times26001/privacy/index.html
          grep -q 'v1.1.14' legal/times26001/terms/index.html
          ! grep -q '980px' legal/app-legal.css
          grep -q 'text-decoration-skip-ink:none' site-link-standard-v1.css
          grep -q 'Times26001-Android-v1.1.14-Standard-Website-Logo.apk' app-release-manifest.json

      - name: Commit remediation to governance branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add app-release-manifest.json app-download-share-v1.js times26001-home-card.js tools/times26001/index.html capabilities/index.html app-support/index.html assets/tools/times26001-overview.svg app-store/times26001/README.md legal site-link-standard-v1.css scripts/audit-app-release-association.py docs/incident-reviews/2026-08-27-times26001-site-release-consistency.md
          if git diff --cached --quiet; then
            echo 'No remediation diff.'
            exit 0
          fi
          git commit -m 'fix: close Times26001 site release and governance drift'
          git push origin HEAD:governance/times26001-release-consistency-20260827
