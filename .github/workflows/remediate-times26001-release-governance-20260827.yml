name: Remediate Times26001 release governance 20260827

on:
  push:
    branches:
      - governance/times26001-release-consistency-20260827
    paths:
      - '.github/workflows/remediate-times26001-release-governance-20260827.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: governance/times26001-release-consistency-20260827
          fetch-depth: 0

      - name: Apply deterministic remediation
        run: python scripts/remediate-times26001-release-governance.py

      - name: Run release governance audit
        run: python scripts/audit-app-release-association.py

      - name: Commit remediated public surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add app-release-manifest.json app-download-share-v1.js times26001-home-card.js tools/times26001/index.html capabilities/index.html app-support/index.html assets/tools/times26001-overview.svg app-store/times26001/README.md legal site-link-standard-v1.css Times26001-Android-v1.1.14-Standard-Website-Logo.sha256.txt
          if git diff --cached --quiet; then
            echo 'No remediation diff.'
            exit 0
          fi
          git commit -m 'fix: close Times26001 site release and governance drift'
          git push origin HEAD:governance/times26001-release-consistency-20260827
