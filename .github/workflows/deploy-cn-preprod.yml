name: Deploy QilyLean CN knowledge site
# QILY-CN-STICKY-V17-PRODUCTION-DEPLOY | 2026-09-18
# QILY-CN-V7-PRODUCTION-DEPLOY-TRIGGER | 2026-09-18
# QILY-CN-FRESH-BUNDLE-V1 | 2026-09-20 | Never reuse a stale /tmp release archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cn-site/**'
      - '.github/workflows/deploy-cn-preprod.yml'
      - 'scripts/cn-search-discovery.py'
      - 'scripts/test-cn-search-discovery.py'

permissions:
  contents: read
  statuses: write

concurrency:
  group: qilylean-cn-production-v12
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark CN production verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'QilyLean CN Production',
              description: 'Deployment and production verification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: Test CN search submission failure handling
        run: python3 scripts/test-cn-search-discovery.py

      - name: Materialize approved CN practice evidence assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/materialize-practice-assets.sh
          cn-site/scripts/materialize-practice-assets.sh

      - name: Production structure gate
        shell: bash
        run: |
          set -euo pipefail
          test -f cn-site/index.html
          test -f cn-site/robots.txt
          test -f cn-site/sitemap.xml
          test -f cn-site/favicon.ico
          test -f cn-site/googleb7a991efbed3aa8a.html
          test -f cn-site/baidu_verify_codeva-Bp0VGliFcp.html
          test -f cn-site/b47ed759da519bd90586a7877122d7be.txt
          test -f cn-site/assets/site.css
          test -f cn-site/assets/qilylean-vi-v2.css
          test -s cn-site/assets/mps-beian.png
          test -f cn-site/assets/cn-nav-rail-v1.js
          test -f cn-site/assets/cn-footer-actions-v1.css
          test -f cn-site/assets/cn-footer-actions-v1.js
          grep -Fq 'QilyLean CN Footer Actions V3' cn-site/assets/cn-footer-actions-v1.js
          grep -Fq 'data-qily-footer-action' cn-site/index.html
          test -f cn-site/assets/cn-translate-baidu-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.css
          ! grep -Fq 'data-qily-translation-provider' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'QilyLean CN In-Page Translation V7' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq "data-qily-translation-engine','baidu'" cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'concurrency=1' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'QilyLean CN In-Page Translation UI V3' cn-site/assets/cn-translate-baidu-v1.css
          test -f cn-site/assets/portal.css
          test -f cn-site/assets/qilylean-aircraft-hero-cn-v2-20260919.png
          test -f cn-site/assets/practice.css
          test -f cn-site/assets/practice/smed-300t.svg
          test -f cn-site/assets/practice/mold-warehouse.svg
          test -f cn-site/assets/practice/fuse-process.svg
          test -f cn-site/assets/practice/lean-improvement-evidence.svg
          test -f cn-site/assets/practice/automotive-lean.svg
          test -f cn-site/assets/practice/factory-layout.svg
          test -f cn-site/assets/practice/digital-factory.svg
          test -f cn-site/assets/practice/visual-management.svg
          test -s cn-site/assets/practice/award-6s-page-01.jpg
          test -f cn-site/notes/index.html
          test -f cn-site/scripts/validate-personal-content.sh
          test -f cn-site/scripts/activate-public-http.sh
          test -f cn-site/nginx/qilylean.cn.conf
          test -f cn-site/knowledge/index.html
          test -f cn-site/lean/index.html
          test -f cn-site/ie/index.html
          test -f cn-site/standardization/index.html
          test -f cn-site/factory/index.html
          test -f cn-site/digital/index.html
          test -f cn-site/methods/index.html
          grep -Fq '<title>精益制造经验分享｜QilyLean | 启力精益｜制造工程、精益生产与数智工厂知识站</title>' cn-site/index.html
          grep -Fq '<p class="eyebrow">精益制造经验分享</p>' cn-site/index.html
          grep -Fq '<meta name="360-site-verification" content="42760a600d8679c79148d470325347ac" />' cn-site/index.html
          grep -Fq '"name":"精益制造经验分享"' cn-site/index.html
          grep -Fq 'QilyLean | 启力精益 · 精益制造经验分享' cn-site/index.html
          ! grep -Fq 'QILYLEAN CHINA｜' cn-site/index.html
          ! grep -RniF --include='*.html' '个人制造业知识与实践分享' cn-site
          grep -q '湘ICP备2026041143号-1' cn-site/index.html
          grep -Fq 'https://beian.mps.gov.cn/#/query/webSearch?code=43020002000443' cn-site/index.html
          grep -Fq '湘公网安备43020002000443号' cn-site/index.html
          grep -q '<urlset' cn-site/sitemap.xml

      - name: Mainland personal-site compliance gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/validate-personal-content.sh
          cn-site/scripts/validate-personal-content.sh cn-site

      - name: Build complete release archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='scripts' --exclude='nginx' --exclude='*.md' --exclude='assets/qilylean-aircraft-hero-cn-20260918.png' -czf /tmp/qilylean-cn-site.tar.gz -C cn-site .
          sha256sum /tmp/qilylean-cn-site.tar.gz

      - name: Configure SSH
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts

      - name: Stage release bundle on mainland server
        timeout-minutes: 20
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          SSH_OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes)

          copy_with_retry() {
            local src="$1"
            local dest="$2"
            local attempt
            for attempt in 1 2; do
              echo "SCP ${src} -> ${dest} (attempt ${attempt}/2)"
              if timeout 180s scp -q "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn "$src" "$USER_NAME@$CN_PREPROD_HOST:$dest"; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          # The mainland route can stall on one long SCP stream. Upload the release
          # archive in small independently retryable chunks, reconstruct it remotely,
          # then verify SHA-256 before the atomic release switch.
          ARCHIVE_SHA="$(sha256sum /tmp/qilylean-cn-site.tar.gz | awk '{print $1}')"
          rm -f /tmp/qilylean-cn-site.part.*
          split -b 512k -d -a 3 /tmp/qilylean-cn-site.tar.gz /tmp/qilylean-cn-site.part.

          timeout 60s ssh "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST"             'rm -f /tmp/qilylean-cn-site.part.* /tmp/qilylean-cn-site.tar.gz'

          for part in /tmp/qilylean-cn-site.part.*; do
            copy_with_retry "$part" "/tmp/$(basename "$part")"
          done
          copy_with_retry cn-site/scripts/server-bootstrap.sh /tmp/bootstrap-qilylean-cn.sh
          copy_with_retry cn-site/scripts/deploy-release.sh /tmp/deploy-qilylean-cn.sh
          copy_with_retry cn-site/scripts/activate-public-http.sh /tmp/activate-qilylean-cn-http.sh
          copy_with_retry cn-site/nginx/qilylean.cn.conf /tmp/qilylean.cn.conf

          timeout 90s ssh "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST"             "cat /tmp/qilylean-cn-site.part.* > /tmp/qilylean-cn-site.tar.gz &&              REMOTE_SHA=\$(sha256sum /tmp/qilylean-cn-site.tar.gz | cut -d' ' -f1) &&              test \"\$REMOTE_SHA\" = \"$ARCHIVE_SHA\" &&              rm -f /tmp/qilylean-cn-site.part.* &&              test -s /tmp/deploy-qilylean-cn.sh && test -s /tmp/activate-qilylean-cn-http.sh && test -s /tmp/qilylean.cn.conf &&              echo 'Release bundle staged and checksum verified.'"

      - name: Bootstrap server when required
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "if [ ! -f /etc/nginx/sites-available/qilylean-cn-preprod ]; then chmod +x /tmp/bootstrap-qilylean-cn.sh && /tmp/bootstrap-qilylean-cn.sh; else echo 'Server bootstrap already present'; fi"

      - name: Deploy release on mainland server
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          RELEASE_ID="${GITHUB_SHA::12}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "chmod +x /tmp/deploy-qilylean-cn.sh && /tmp/deploy-qilylean-cn.sh /tmp/qilylean-cn-site.tar.gz '$RELEASE_ID'"

      - name: Ensure public HTTP/HTTPS site remains active
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "chmod +x /tmp/activate-qilylean-cn-http.sh && /tmp/activate-qilylean-cn-http.sh /tmp/qilylean.cn.conf"

      - name: Verify production brand and interaction closure
        shell: bash
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.request

          sha = os.environ['VERIFY_SHA']

          def fetch(url, attempts=12):
              error = None
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'QilyLean-Production-Closure/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          return response.read().decode('utf-8')
                  except Exception as exc:
                      error = exc
                      if attempt < attempts:
                          time.sleep(5)
              raise RuntimeError(f'Failed to fetch {url}: {error}')

          about = fetch(f'https://qilylean.cn/about/?closure={sha}')
          home = fetch(f'https://qilylean.cn/?closure={sha}')
          practice = fetch(f'https://qilylean.cn/notes/?closure={sha}')
          practice_css = fetch(f'https://qilylean.cn/assets/practice.css?closure={sha}')
          vi = fetch(f'https://qilylean.cn/assets/qilylean-vi-v2.css?closure={sha}')
          nav_runtime = fetch(f'https://qilylean.cn/assets/cn-nav-rail-v1.js?closure={sha}')
          footer_actions_css = fetch(f'https://qilylean.cn/assets/cn-footer-actions-v1.css?closure={sha}')
          footer_actions_runtime = fetch(f'https://qilylean.cn/assets/cn-footer-actions-v1.js?closure={sha}')
          translate_runtime = fetch(f'https://qilylean.cn/assets/cn-translate-baidu-v1.js?closure={sha}')
          links = fetch(f'https://qilylean.com/links/?closure={sha}')
          vi_base = fetch(f'https://qilylean.cn/assets/qilylean-vi-v1.css?closure={sha}')
          site_css = fetch(f'https://qilylean.cn/assets/site.css?closure={sha}')
          portal_css = fetch(f'https://qilylean.cn/assets/portal.css?closure={sha}')

          production_routes = [
              '/', '/about/', '/ie/', '/factory/', '/lean/', '/digital/', '/methods/',
              '/knowledge/', '/notes/', '/standardization/',
              '/knowledge/vsm-time-structure/',
              '/knowledge/standard-time-capacity/',
              '/knowledge/line-balance-bottleneck/',
              '/knowledge/factory-layout-logistics/',
              '/knowledge/master-data-digitalization/',
              '/knowledge/standard-work-three-elements/',
              '/knowledge/capacity-digital-thread/',
              '/knowledge/production-engineering-quality-tripod/',
          ]
          for route in production_routes:
              doc = fetch(f'https://qilylean.cn{route}?closure={sha}')
              for marker in [
                  '/assets/site.css?v=20260923-cn-personal-v3-reading',
                  '/assets/portal.css?v=20260923-portal-v2-reading',
                  '/assets/qilylean-vi-v2.css?v=20260926-cn-vi-v43-single-external-arrow',
                  '/assets/cn-footer-actions-v1.css?v=20260926-footer-actions-v5-three-actions-vi-parity',
                  '/assets/cn-footer-actions-v1.js?v=20260926-footer-actions-v5-three-actions-vi-parity',
                  'data-qily-footer-action="top"',
                  'data-qily-footer-action="previous"',
                  'data-qily-footer-action="share"',
              ]:
                  if marker not in doc:
                      raise SystemExit(f'Production {route} missing V23 typography asset: {marker}')

          footer_actions_contract = [
              (footer_actions_css, 'QilyLean CN Footer Actions V3', 'three-action footer stylesheet marker'),
              (footer_actions_css, '.footer-actions>button', 'footer action button visual contract'),
              (footer_actions_css, 'grid-template-columns:repeat(3,max-content)!important', 'three-action desktop layout'),
              (footer_actions_css, 'min-height:40px!important', 'international-style button height'),
              (footer_actions_css, 'border-radius:8px!important', 'international-style button radius'),
              (footer_actions_css, 'background:#073c47!important', 'international-style share feedback background'),
              (footer_actions_runtime, 'QilyLean CN Footer Actions V3', 'three-action footer runtime marker'),
              (footer_actions_runtime, "var ORDER=[['top','顶部'],['previous','上一网页'],['share','分享当前']]", 'canonical China footer actions'),
              (footer_actions_runtime, "data-qily-footer-contract','top,previous,share'", 'three-action runtime contract'),
              (footer_actions_runtime, 'w.history.back()', 'previous-page browser history behavior'),
              (footer_actions_runtime, 'navigator.share', 'system share behavior'),
              (footer_actions_runtime, "behavior:reduce?'auto':'smooth'", 'top smooth-scroll behavior'),
              (footer_actions_runtime, '标题与网址已复制，正在打开系统分享', 'copy-before-share feedback'),
              (footer_actions_runtime, '已复制，可直接粘贴分享', 'cancelled-share copied feedback'),
              (footer_actions_runtime, '已复制，可粘贴到微信、微博等应用', 'share fallback feedback'),
              (footer_actions_runtime, "group.addEventListener('click'", 'single-click delegated binding'),
              (footer_actions_runtime, "node.id='qilyDockShareCopyToastV2'", 'international toast DOM id'),
          ]
          for source, marker, label in footer_actions_contract:
              if marker not in source:
                  raise SystemExit(f'Production footer action contract missing {label}: {marker}')

          for retired in ["['home','首页']", "['parent','上一层级']", "['knowledge','知识索引']", "['about','关于我们']"]:
              if retired in footer_actions_runtime:
                  raise SystemExit(f'Production China footer introduced an unauthorized menu action: {retired}')

          copy_marker = 'copyText(text).then(function(){'
          share_marker = 'navigator.share({title:title,text:title,url:url})'
          copy_at = footer_actions_runtime.find(copy_marker)
          share_at = footer_actions_runtime.find(share_marker)
          if copy_at < 0 or share_at < 0 or copy_at > share_at:
              raise SystemExit('Production share parity failed: title + URL must be copied before system share opens.')
          typography_contract = [
              (vi, 'QILY-CN-TYPE-HIERARCHY-V5', 'final V5 authority'),
              (vi, '--qily-cn-h2:clamp(20px,1.25vw,22px)', 'desktop H2 22px ceiling'),
              (vi, '--qily-cn-h3:clamp(17px,1vw,19px)', 'desktop H3 19px ceiling'),
              (vi, '--qily-cn-h2:clamp(19px,5vw,21px)', 'mobile H2 21px ceiling'),
              (vi, '--qily-cn-h3:clamp(17px,4.5vw,19px)', 'mobile H3 19px ceiling'),
              (vi_base, 'clamp(20px,1.25vw,22px)!important', 'base H2 22px fallback'),
              (site_css, 'font-size:clamp(20px,1.25vw,22px)', 'site H2 22px fallback'),
              (portal_css, 'font-size:clamp(20px,1.25vw,22px)', 'portal/article H2 22px fallback'),
          ]
          for source, marker, label in typography_contract:
              if marker not in source:
                  raise SystemExit(f'Production typography contract missing {label}: {marker}')
          for retired in [
              'clamp(32px,3vw,48px)!important',
              'font-size:clamp(22px,1.45vw,25px)',
              '--qily-cn-h2:clamp(22px,1.45vw,25px)',
          ]:
              if retired in vi or retired in vi_base or retired in site_css or retired in portal_css:
                  raise SystemExit(f'Retired oversized China heading rule returned in production: {retired}')

          required_about = [
              '关于“精益制造经验分享”',
              'QilyLean | <span>启力精益</span>',
              'QilyLean | 启力精益 · 精益制造经验分享',
              '湘公网安备43020002000443号',
              'https://beian.mps.gov.cn/#/query/webSearch?code=43020002000443',
              '/assets/mps-beian.png',
          ]
          for marker in required_about:
              if marker not in about:
                  raise SystemExit(f'Production About page missing: {marker}')

          if re.search(r'<aside\b[^>]*class=["\']toc["\']', about, re.I):
              raise SystemExit('Production About page still exposes retired 本页主旨 panel.')
          if '本页目录' in about or '<b>本页主旨</b>' in about:
              raise SystemExit('Retired page-thesis label returned in production.')

          required_home_name = [
              '<title>精益制造经验分享｜QilyLean | 启力精益｜制造工程、精益生产与数智工厂知识站</title>',
              '<meta name="360-site-verification" content="42760a600d8679c79148d470325347ac" />',
              '<p class="eyebrow">精益制造经验分享</p>',
              '"name":"精益制造经验分享"',
              'QilyLean | 启力精益 · 精益制造经验分享',
          ]
          for marker in required_home_name:
              if marker not in home:
                  raise SystemExit(f'Production China home filed-name mismatch: {marker}')
          if 'QILYLEAN CHINA｜' in home or '个人制造业知识与实践分享' in home:
              raise SystemExit('Production China home exposed a retired site name.')

          if '进入 Global Knowledge ↗' not in home:
              raise SystemExit('Production China home missing global-knowledge CTA.')
          if 'QilyLean | <span>启力精益</span>' not in home:
              raise SystemExit('Production China home lost full brand in header.')
          if '/assets/qilylean-aircraft-hero-cn-v2-20260919.png?v=20260919-cn-aircraft-v3' not in home:
              raise SystemExit('Production China home missing approved CN aircraft visual.')
          if '/assets/qilylean-vi-v2.css?v=20260926-cn-vi-v43-single-external-arrow' not in home:
              raise SystemExit('Production China home missing V42 final production VI revision.')
          if '/assets/cn-nav-rail-v1.js?v=20260926-nav-rail-v19-final-production' not in home:
              raise SystemExit('Production China home missing V19 final production nav runtime.')
          required_external_nav = [
              'data-qily-nav-key="briefs" target="_blank" rel="noopener noreferrer" title="进入 QilyLean 国际站精选简报（新标签页）" data-qily-external="international">精选简报<span class="qily-external-mark" aria-hidden="true">↗</span></a>',
              'data-qily-nav-key="resources" target="_blank" rel="noopener noreferrer" title="进入 QilyLean 国际站资源协同公开入口（新标签页）" data-qily-external="international">资源协同<span class="qily-external-mark" aria-hidden="true">↗</span></a>',
          ]
          for marker in required_external_nav:
              if marker not in home:
                  raise SystemExit(f'Production China primary nav missing external arrow/semantics: {marker}')
          if '<a href="https://qilylean.com/global-knowledge/" target="_blank" rel="noopener noreferrer" data-qily-external="international" title="进入 QilyLean 国际站 Global Knowledge（新标签页）">进入 Global Knowledge ↗</a>' not in home:
              raise SystemExit('Production China Global Knowledge CTA lost external-link semantics.')
          if '/assets/cn-footer-actions-v1.css?v=20260926-footer-actions-v5-three-actions-vi-parity' not in home:
              raise SystemExit('Production China home missing footer quick-action stylesheet.')
          if '/assets/cn-footer-actions-v1.js?v=20260926-footer-actions-v5-three-actions-vi-parity' not in home:
              raise SystemExit('Production China home missing footer quick-action runtime.')
          if '/assets/cn-translate-baidu-v1.css?v=20260922-translate-v6-baidu' not in home:
              raise SystemExit('Production China home missing in-page translator stylesheet.')
          if '/assets/cn-translate-baidu-v1.js?v=20260922-translate-v6-baidu' not in home:
              raise SystemExit('Production China home missing in-page translator runtime.')
          required_home_practice = [
              'PRACTICE & EVIDENCE｜实践与成果',
              '约14小时 → 7小时',
              '约180㎡ · 1200+副模具',
              '知识之外，更重要的是方法如何在现场落地',
              '精选 8 项制造实践',
              '从实践中提炼可复用方法',
              '查看全部实践成果',
          ]
          for marker in required_home_practice:
              if marker not in home:
                  raise SystemExit(f'Production China home missing practice marker: {marker}')

          required_practice = [
