name: Deploy QilyLean CN knowledge site
# QILY-CN-STICKY-V17-PRODUCTION-DEPLOY | 2026-09-18
# QILY-CN-V7-PRODUCTION-DEPLOY-TRIGGER | 2026-09-18
# QILY-CN-FRESH-BUNDLE-V1 | 2026-09-20 | Never reuse a stale /tmp release archive

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-cn-preprod.yml'
      - 'scripts/cn-release-transfer.py'
      - 'scripts/test-cn-release-transfer.py'
  workflow_dispatch:
    inputs:
      inspect_translation_only:
        description: 'Real NMT preflight on mainland server; no publication'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'cn-site/**'
      - 'qilylean/daily/**'
      - 'links/index.html'
      - 'qilylean/daily-briefs.css'
      - 'qilylean/daily-brief-unified-layout-v2.css'
      - 'qilylean/knowledge-brief.css'
      - 'qilylean/npi-four-stage-series-v1.css'
      - 'site-daily-brief-layout-guard-v1.css'
      - 'services/cn-translation/**'
      - '.github/workflows/deploy-cn-preprod.yml'
      - 'scripts/cn-search-discovery.py'
      - 'scripts/test-cn-search-discovery.py'
      - 'scripts/cn-release-transfer.py'
      - 'scripts/test-cn-release-transfer.py'

      - 'index.html'
      - 'experience/**'
      - 'capabilities/**'
      - 'improvements/**'
      - 'lean-production/**'
      - 'projects/**'
      - 'trust/**'
      - 'moments/**'
      - 'knowledge/**'
      - 'global-knowledge/**'
      - 'AI-Knowledge/**'
      - 'certificates/**'
      - 'tools/times26001/**'
      - 'qilylean/**'
      - 'assets/**'
      - 'styles/**'
      - 'fonts/**'
      - '*.css'
      - 'ai.html'
      - 'gbt2828.html'
      - 'papers.html'
      - 'standards.html'
      - 'knowledge.html'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.pdf'
      - '**/*.qly'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('qilylean-cn-transfer-pr-{0}', github.event.number) || inputs.inspect_translation_only && 'qilylean-cn-translation-inspection' || 'qilylean-cn-production-v12' }}
  # Production uploads and live verification must finish atomically; newer CN commits queue instead of cancelling an active release.
  cancel-in-progress: false

jobs:
  transfer-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test private artifact transfer, deterministic archive and resumable integrity
        run: python3 scripts/test-cn-release-transfer.py

  inspect-translation:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_translation_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source for secret audit and NMT verification
        uses: actions/checkout@v4
      - name: Audit repository and completed Actions logs without exposing credentials
        env:
          YOUDAO_APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          YOUDAO_APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: python3 services/cn-translation/audit-secrets.py

      - name: Configure SSH for read-only inspection
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts
          CONTROL_PATH="$HOME/.ssh/qilylean-cn-%r@%h:%p"
          ssh -MNf -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -o BatchMode=yes -o ControlMaster=yes -o ControlPersist=30m -o ControlPath="$CONTROL_PATH" \
            -i ~/.ssh/qilylean_cn "${CN_PREPROD_USER:-ubuntu}@$CN_PREPROD_HOST"
      - name: Validate proposed Nginx configuration without reload or publication
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes)
          scp -q "${OPTS[@]}" -i ~/.ssh/qilylean_cn cn-site/nginx/qilylean.cn.conf "$USER_NAME@$CN_PREPROD_HOST:/tmp/qily-cn-nginx-translation-check-site.conf"
          ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/qily-cn-nginx-translation-check-site.conf /tmp/qily-cn-nginx-translation-check-main.conf' EXIT
          printf '%s\n' 'events {}' 'http { include /etc/nginx/mime.types; include /tmp/qily-cn-nginx-translation-check-site.conf; }' > /tmp/qily-cn-nginx-translation-check-main.conf
          sudo nginx -t -c /tmp/qily-cn-nginx-translation-check-main.conf
          REMOTE
      - name: Real Youdao NMT translation from mainland without publishing
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
          YOUDAO_APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          YOUDAO_APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes)
          STAGE="/tmp/qily-nmt-preflight-${GITHUB_RUN_ID}"
          trap 'ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "sudo rm -rf $STAGE"' EXIT
          ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "mkdir -m 700 $STAGE"
          scp -q "${OPTS[@]}" -i ~/.ssh/qilylean_cn services/cn-translation/{server.py,protected-tokens.json,verify-production.py} "$USER_NAME@$CN_PREPROD_HOST:$STAGE/"
          python3 -c 'import os,json,sys; json.dump({key:os.environ[key] for key in ("YOUDAO_APP_KEY","YOUDAO_APP_SECRET")},sys.stdout)' | ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "sudo python3 -c 'import sys,json,pathlib,os; data=json.load(sys.stdin); dest=pathlib.Path(\"$STAGE/youdao\"); dest.write_text(json.dumps(data)); os.chmod(dest,0o600)'"
          ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "sudo env CREDENTIALS_DIRECTORY=$STAGE python3 $STAGE/verify-production.py"

  validate-and-deploy:
    needs: transfer-contract
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.inspect_translation_only) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[translation-only]'))
    timeout-minutes: 300
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark CN production verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'QilyLean CN Production',
              description: 'Deployment and production verification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: Test direct Youdao adapter
        run: python3 services/cn-translation/test_server.py

      - name: Test CN search submission failure handling
        run: python3 scripts/test-cn-search-discovery.py

      - name: Materialize approved CN practice evidence assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/materialize-practice-assets.sh
          cn-site/scripts/materialize-practice-assets.sh

      - name: Detect source-content clone contract
        id: source-parity
        shell: bash
        run: |
          set -euo pipefail
          if test -f cn-site/scripts/materialize-source-content-parity.py; then
            test -s cn-site/archive/source-content-parity.json
            grep -Fq 'data-cn-source-parity="v1"' cn-site/index.html
            test -f cn-site/scripts/validate-source-content-parity.py
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Production structure gate
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.source-parity.outputs.enabled }}" = true; then
            # Content is checked against source/main/style/media fingerprints,
            # while these deployment and China-owned shell inputs stay mandatory.
            for file in index.html robots.txt sitemap.xml favicon.ico googleb7a991efbed3aa8a.html baidu_verify_codeva-Bp0VGliFcp.html b47ed759da519bd90586a7877122d7be.txt assets/site.css assets/portal.css assets/qilylean-vi-v2.css assets/mps-beian.png assets/cn-nav-rail-v1.js assets/cn-footer-actions-v1.css assets/cn-footer-actions-v1.js assets/cn-translate-baidu-v1.js assets/cn-translate-baidu-v1.css site-content-axis-v1.css site-public-footer-type-v1.css about/index.html archive/source-content-parity.json; do
              test -s "cn-site/$file"
            done
            cmp site-content-axis-v1.css cn-site/site-content-axis-v1.css
            cmp site-public-footer-type-v1.css cn-site/site-public-footer-type-v1.css
            grep -Fq '20261021-nav-rail-v23-about' cn-site/index.html
            grep -Fq '20261017-cn-mainland-nmt-v2' cn-site/index.html
            grep -Fq '<urlset' cn-site/sitemap.xml
            node --check cn-site/assets/cn-nav-rail-v1.js
            exit 0
          fi
          test -f cn-site/index.html
          test -f cn-site/robots.txt
          test -f cn-site/sitemap.xml
          test -f cn-site/favicon.ico
          test -f cn-site/googleb7a991efbed3aa8a.html
          test -f cn-site/baidu_verify_codeva-Bp0VGliFcp.html
          test -f cn-site/b47ed759da519bd90586a7877122d7be.txt
          test -f cn-site/assets/site.css
          test -f cn-site/assets/qilylean-vi-v2.css
          test -f cn-site/site-content-axis-v1.css
          cmp site-content-axis-v1.css cn-site/site-content-axis-v1.css
          grep -Fq '/site-content-axis-v1.css?v=20261010-fullsite-axis-parity-v10' cn-site/index.html
          grep -Fq 'data-qily-site="cn"' cn-site/index.html
          test -s cn-site/assets/mps-beian.png
          test -f cn-site/assets/cn-nav-rail-v1.js
          cmp site-public-footer-type-v1.css cn-site/site-public-footer-type-v1.css
          test -f cn-site/assets/cn-footer-actions-v1.css
          test -f cn-site/assets/cn-footer-actions-v1.js
          grep -Fq 'QilyLean Floating Dock Authoritative Runtime V5.8' cn-site/assets/cn-footer-actions-v1.js
          grep -Fq 'data-qily-footer-action' cn-site/index.html
          test -f cn-site/assets/cn-translate-baidu-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.css
          ! grep -Fq 'data-qily-translation-provider' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'QilyLean CN In-Page Translation V7' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq "data-qily-translation-engine','youdao'" cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'concurrency=1' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'QilyLean CN In-Page Translation UI V3' cn-site/assets/cn-translate-baidu-v1.css
          test -f cn-site/assets/portal.css
          test -f cn-site/assets/qilylean-aircraft-hero-cn-v2-20260919.png
          test -f cn-site/assets/practice.css
          test -f cn-site/assets/practice/smed-300t.svg
          test -f cn-site/assets/practice/mold-warehouse.svg
          test -f cn-site/assets/practice/fuse-process.svg
          test -f cn-site/assets/practice/lean-improvement-evidence.svg
          test -f cn-site/assets/practice/automotive-lean.svg
          test -f cn-site/assets/practice/factory-layout.svg
          test -f cn-site/assets/practice/digital-factory.svg
          test -f cn-site/assets/practice/visual-management.svg
          test -s cn-site/assets/practice/award-6s-page-01.jpg
          test -f cn-site/notes/index.html
          test -f cn-site/scripts/validate-personal-content.sh
          test -f cn-site/scripts/activate-public-http.sh
          test -f cn-site/nginx/qilylean.cn.conf
          test -f cn-site/knowledge/index.html
          test -f cn-site/archive/content-catalog.json
          test -f cn-site/archive/brief-visual-parity.json
          test -f cn-site/archive/nonbrief-visual-parity.json
          test -f cn-site/assets/nonbrief-visual-parity.css
          grep -Fq 'data-qily-original-visual="v1"' cn-site/archive/practice/mold-warehouse/index.html
          test -f cn-site/assets/brief-visual-parity.css
          grep -Fq 'data-qily-brief-parity="v1"' cn-site/briefs/archive/2026-09-28/index.html
          grep -Fq 'data-qily-brief-parity="v1"' cn-site/briefs/archive/2020-01-09/index.html
          grep -Fq 'QILY-CN-KNOWLEDGE-ASSET-SUMMARY' cn-site/index.html
          grep -Fq 'QILY-CN-KNOWLEDGE-ASSET-CATALOG' cn-site/knowledge/index.html
          grep -Fq 'data-qily-knowledge-discovery="v1"' cn-site/briefs/index.html
          grep -Fq '完整知识库' cn-site/archive/index.html
          test -f cn-site/lean/index.html
          test -f cn-site/ie/index.html
          test -f cn-site/standardization/index.html
          test -f cn-site/factory/index.html
          test -f cn-site/digital/index.html
          test -f cn-site/methods/index.html
          grep -Fq '<title>精益制造经验分享｜QilyLean | 启力精益｜制造工程、精益生产与数智工厂知识站</title>' cn-site/index.html
          grep -Fq '<p class="eyebrow">LEAN MANUFACTURING EXPERIENCE | 精益制造经验分享</p>' cn-site/index.html
          grep -Fq '<meta name="360-site-verification" content="42760a600d8679c79148d470325347ac" />' cn-site/index.html
          grep -Fq '"name":"精益制造经验分享"' cn-site/index.html
          grep -Fq '<div class="footer-inner"><a class="footer-home" href="/" aria-label="返回精益制造经验分享中国站首页" title="返回中国站首页">精益制造经验分享</a>' cn-site/index.html
          ! grep -RniF --include='*.html' '<div class="footer-inner"><span>QilyLean | 启力精益 · 精益制造经验分享</span>' cn-site
          ! grep -Fq 'QILYLEAN CHINA｜' cn-site/index.html
          ! grep -RniF --include='*.html' '个人制造业知识与实践分享' cn-site
          grep -q '湘ICP备2026041143号-1' cn-site/index.html
          grep -Fq 'https://beian.mps.gov.cn/#/query/webSearch?code=43020002000443' cn-site/index.html
          grep -Fq '湘公网安备43020002000443号' cn-site/index.html
          grep -q '<urlset' cn-site/sitemap.xml

      - name: Mainland personal-site compliance gate
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.source-parity.outputs.enabled }}" = true; then
            python3 cn-site/scripts/validate-source-content-parity.py
          else
            chmod +x cn-site/scripts/validate-personal-content.sh
            cn-site/scripts/validate-personal-content.sh cn-site
          fi

      - name: Build complete release archive
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.source-parity.outputs.enabled }}" = true; then
            python3 - <<'PYRELEASE'
          import hashlib, json, os
          from pathlib import Path
          manifest=Path('cn-site/archive/source-content-parity.json')
          output=Path('cn-site/meta/cn-content-release.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],
              'sourceContentManifestSha256':hashlib.sha256(manifest.read_bytes()).hexdigest()},indent=2)+'\n')
          PYRELEASE
          fi
          # Identical content must produce identical bytes across a retried run;
          # checkout/materialization timestamps cannot invalidate the resume cache.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=gnu \
            --exclude='scripts' --exclude='nginx' --exclude='*.md' \
            --exclude='assets/qilylean-aircraft-hero-cn-20260918.png' \
            -cf - -C cn-site . | gzip -n > /tmp/qilylean-cn-site.tar.gz
          sha256sum /tmp/qilylean-cn-site.tar.gz

      - name: Preserve exact release archive for mainland HTTPS pull
        id: release-artifact
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: cn-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qilylean-cn-site.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Require configured Youdao application before any production change
        if: steps.source-parity.outputs.enabled != 'true'
        env:
          YOUDAO_APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          YOUDAO_APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$YOUDAO_APP_KEY" ] || [ -z "$YOUDAO_APP_SECRET" ]; then
            echo 'Missing YOUDAO_APP_KEY / YOUDAO_APP_SECRET; no production change is allowed.' >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts

      - name: Stage release bundle on mainland server
        timeout-minutes: 240
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ steps.release-artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          CONTROL_DIR="$(mktemp -d "$HOME/.ssh/qily-cn-transfer.XXXXXX")"
          SSH_OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=10m)
          REMOTE_HELPER="/tmp/qily-cn-transfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          REMOTE_MANIFEST="/tmp/qily-cn-transfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          LOCAL_PARTS="$(mktemp -d /tmp/qily-cn-parts.XXXXXX)"
          cleanup() {
            # Stop run-owned channels, retaining the checksum-addressed chunks.
            timeout 15s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
              "$USER_NAME@$CN_PREPROD_HOST" "rm -f '$REMOTE_HELPER' '$REMOTE_MANIFEST'" >/dev/null 2>&1 || true
            for lane in 0 1 2 3; do
              ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/$lane" -O exit \
                "$USER_NAME@$CN_PREPROD_HOST" >/dev/null 2>&1 || true
            done
            rm -rf "$CONTROL_DIR" "$LOCAL_PARTS"
          }
          trap cleanup EXIT
          ssh -MNf "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -o ControlMaster=yes \
            -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST"

          copy_with_retry() {
            local src="$1"
            local dest="$2"
            local lane="${3:-0}"
            local attempt
            for attempt in 1 2 3; do
              echo "SCP ${src} (lane ${lane}, attempt ${attempt}/3)"
              if timeout 240s scp -q "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/$lane" \
                -i ~/.ssh/qilylean_cn "$src" "$USER_NAME@$CN_PREPROD_HOST:$dest"; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          ARCHIVE_SHA="$(sha256sum /tmp/qilylean-cn-site.tar.gz | awk '{print $1}')"
          ARCHIVE_BYTES="$(stat -c '%s' /tmp/qilylean-cn-site.tar.gz)"
          echo "Release archive size: ${ARCHIVE_BYTES} bytes"
          copy_with_retry scripts/cn-release-transfer.py "$REMOTE_HELPER"
          pulled=false
          if test -n "$RELEASE_ARTIFACT_ID"; then
            # The GitHub bearer token stays on the runner. The one-time signed
            # storage URL is never echoed, saved, placed in argv or sent to logs.
            if python3 scripts/cn-release-transfer.py artifact-request \
                 --repository "$GITHUB_REPOSITORY" --artifact-id "$RELEASE_ARTIFACT_ID" \
                 | timeout 2760s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" \
                   -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' pull"; then
              pulled=true
            fi
          fi
          if test "$pulled" != true; then
            echo 'Artifact pull unavailable; resuming independently verified SCP chunks.'
            python3 scripts/cn-release-transfer.py split --directory "$LOCAL_PARTS" > "$LOCAL_PARTS/manifest.json"
            copy_with_retry "$LOCAL_PARTS/manifest.json" "$REMOTE_MANIFEST"
            timeout 120s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
              "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' missing --manifest '$REMOTE_MANIFEST'" > "$LOCAL_PARTS/missing.txt"
            echo "Remaining chunks: $(wc -l < "$LOCAL_PARTS/missing.txt")"
            for lane in 1 2 3; do
              # Separate masters give four actual TCP paths, rather than four
              # SFTP channels sharing the same stalled overseas connection.
              ssh -MNf "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/$lane" -o ControlMaster=yes \
                -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST"
            done
            batch=()
            for lane in 0 1 2 3; do
              (
                while IFS= read -r index; do
                  [[ "$index" =~ ^[0-9]{4,5}$ ]]
                  if ((10#$index % 4 != lane)); then continue; fi
                  part="$LOCAL_PARTS/part.$index"
                  incoming="/tmp/qily-cn-release-cache/$ARCHIVE_SHA/.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$index"
                  accepted=false
                  for attempt in 1 2 3; do
                    echo "Upload and verify chunk $index (lane $lane, attempt $attempt/3)"
                    if timeout 240s scp -q "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/$lane" \
                         -i ~/.ssh/qilylean_cn "$part" "$USER_NAME@$CN_PREPROD_HOST:$incoming" </dev/null && \
                       timeout 90s ssh -n "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/$lane" -i ~/.ssh/qilylean_cn \
                         "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' accept --manifest '$REMOTE_MANIFEST' --index '$index' --incoming '$incoming'"; then
                      accepted=true
                      break
                    fi
                    if test "$attempt" -lt 3; then sleep 3; fi
                  done
                  test "$accepted" = true
                done < "$LOCAL_PARTS/missing.txt"
              ) &
              batch+=("$!")
            done
            failed=0
            for pid in "${batch[@]}"; do wait "$pid" || failed=1; done
            test "$failed" -eq 0

            # A successful SCP/accept command is not enough: verify the complete
            # remote cache again and repair any chunk that is still absent/corrupt.
            for repair_round in 1 2 3; do
              timeout 120s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
                "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' missing --manifest '$REMOTE_MANIFEST'" \
                > "$LOCAL_PARTS/post-upload-missing.txt"
              remaining="$(wc -l < "$LOCAL_PARTS/post-upload-missing.txt")"
              echo "Post-upload chunk integrity check ${repair_round}/3: ${remaining} missing."
              if test "$remaining" -eq 0; then break; fi

              while IFS= read -r index; do
                [[ "$index" =~ ^[0-9]{4,5}$ ]]
                part="$LOCAL_PARTS/part.$index"
                incoming="/tmp/qily-cn-release-cache/$ARCHIVE_SHA/.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-repair-$index"
                accepted=false
                for attempt in 1 2 3; do
                  echo "Repair missing chunk $index (round ${repair_round}/3, attempt ${attempt}/3)"
                  if timeout 240s scp -q "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" \
                       -i ~/.ssh/qilylean_cn "$part" "$USER_NAME@$CN_PREPROD_HOST:$incoming" </dev/null && \
                     timeout 90s ssh -n "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
                       "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' accept --manifest '$REMOTE_MANIFEST' --index '$index' --incoming '$incoming'"; then
                    accepted=true
                    break
                  fi
                  if test "$attempt" -lt 3; then sleep 3; fi
                done
                test "$accepted" = true
              done < "$LOCAL_PARTS/post-upload-missing.txt"
            done

            timeout 120s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
              "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' missing --manifest '$REMOTE_MANIFEST'" \
              > "$LOCAL_PARTS/final-missing.txt"
            if test -s "$LOCAL_PARTS/final-missing.txt"; then
              echo 'Release integrity gate failed; remaining chunk indexes:' >&2
              cat "$LOCAL_PARTS/final-missing.txt" >&2
              exit 1
            fi
            timeout 180s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
              "$USER_NAME@$CN_PREPROD_HOST" "python3 '$REMOTE_HELPER' assemble --manifest '$REMOTE_MANIFEST'"
          fi
          timeout 60s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
            "$USER_NAME@$CN_PREPROD_HOST" 'mkdir -p /tmp/qilylean-cn-translation'
          copy_with_retry cn-site/scripts/server-bootstrap.sh /tmp/bootstrap-qilylean-cn.sh
          copy_with_retry cn-site/scripts/deploy-release.sh /tmp/deploy-qilylean-cn.sh
          copy_with_retry cn-site/scripts/activate-public-http.sh /tmp/activate-qilylean-cn-http.sh
          copy_with_retry cn-site/nginx/qilylean.cn.conf /tmp/qilylean.cn.conf
          for service_file in server.py protected-tokens.json qilylean-cn-translation.service install.sh verify-production.py; do
            copy_with_retry "services/cn-translation/$service_file" "/tmp/qilylean-cn-translation/$service_file"
          done
          for asset in cn-translate-baidu-v1.js cn-translate-baidu-v1.css; do
            copy_with_retry "cn-site/assets/$asset" "/tmp/qilylean-cn-translation/$asset"
          done

          timeout 90s ssh "${SSH_OPTS[@]}" -o ControlPath="$CONTROL_DIR/0" -i ~/.ssh/qilylean_cn \
            "$USER_NAME@$CN_PREPROD_HOST" \
            "test \"\$(sha256sum /tmp/qilylean-cn-site.tar.gz | cut -d' ' -f1)\" = '$ARCHIVE_SHA' && \
             test -s /tmp/deploy-qilylean-cn.sh && test -s /tmp/activate-qilylean-cn-http.sh && test -s /tmp/qilylean.cn.conf && \
             echo 'Release bundle staged and checksum verified.'"

      - name: Bootstrap server when required
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "if [ ! -f /etc/nginx/sites-available/qilylean-cn-preprod ]; then chmod +x /tmp/bootstrap-qilylean-cn.sh && /tmp/bootstrap-qilylean-cn.sh; else echo 'Server bootstrap already present'; fi"

      - name: Provision and verify direct mainland Youdao service
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
          YOUDAO_APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          YOUDAO_APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes)
          # Credentials travel only over encrypted SSH stdin, never command arguments/logs.
          python3 -c 'import os,json,sys; json.dump({key:os.environ[key] for key in ("YOUDAO_APP_KEY","YOUDAO_APP_SECRET")},sys.stdout)' | ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "sudo python3 -c 'import json,sys,pathlib,os; data=json.load(sys.stdin); assert all(isinstance(data.get(k),str) and data[k].strip() for k in (\"YOUDAO_APP_KEY\",\"YOUDAO_APP_SECRET\")); path=pathlib.Path(\"/tmp/qilylean-cn-youdao\"); path.mkdir(mode=0o700,exist_ok=True); os.chmod(path,0o700); dest=path/\"youdao\"; dest.write_text(json.dumps(data)); os.chmod(dest,0o600)'"
          ssh "${OPTS[@]}" -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" 'sudo bash /tmp/qilylean-cn-translation/install.sh'

      - name: Verify retained Youdao service before static-content switch
        if: steps.source-parity.outputs.enabled == 'true'
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          # Reuse systemd LoadCredential on the host; do not reinstall the working
          # service, replace credentials, or rewrite its Nginx /translate route.
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" 'sudo python3 /tmp/qilylean-cn-translation/verify-production.py --production'

      - name: Deploy release on mainland server
        id: static-release
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
          SOURCE_PARITY: ${{ steps.source-parity.outputs.enabled }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn)
          if test "$SOURCE_PARITY" != true; then
            RELEASE_ID="${GITHUB_SHA::12}"
            ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "chmod +x /tmp/deploy-qilylean-cn.sh && /tmp/deploy-qilylean-cn.sh /tmp/qilylean-cn-site.tar.gz '$RELEASE_ID'"
            exit 0
          fi
          RELEASE_ID="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STATE="/tmp/qily-cn-content-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$RELEASE_ID' '$STATE'" <<'REMOTE'
          set -euo pipefail
          RELEASE_ID="$1"
          STATE="$2"
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{12}-[0-9]+-[0-9]+$ ]]
          [[ "$STATE" =~ ^/tmp/qily-cn-content-[0-9]+-[0-9]+$ ]]
          SITE_ROOT=/var/www/qilylean-cn
          # The watchdog inherits this descriptor and holds the host lock across
          # CI steps, including runner cancellation and subsequent queued runs.
          exec 9>"$SITE_ROOT/.content-deploy.lock"
          flock -w 1260 9
          PREVIOUS="$(readlink -f "$SITE_ROOT/current")"
          [[ "$PREVIOUS" =~ ^/var/www/qilylean-cn/releases/[A-Za-z0-9_-]+$ ]]
          test -d "$PREVIOUS"
          EXPECTED="$SITE_ROOT/releases/$RELEASE_ID"
          mkdir -m 700 "$STATE"
          printf '%s\n' "$PREVIOUS" > "$STATE/previous"
          printf '%s\n' "$EXPECTED" > "$STATE/expected"
          trap 'status=$?; trap - EXIT; touch "$STATE/deployer-finished"; if test "$status" -ne 0; then touch "$STATE/failed"; fi; exit "$status"' EXIT
          trap 'touch "$STATE/failed"; exit 129' HUP
          trap 'touch "$STATE/failed"; exit 130' INT
          trap 'touch "$STATE/failed"; exit 143' TERM
          cat > "$STATE/watchdog.sh" <<'WATCHDOG'
          #!/usr/bin/env bash
          set -euo pipefail
          STATE="$1"
          PREVIOUS="$2"
          EXPECTED="$3"
          # Keep the previous static release until all public verification passes.
          # An abandoned/terminated CI run cannot leave unaccepted content active.
          for attempt in $(seq 1 1350); do
            if test -f "$STATE/committed"; then touch "$STATE/accepted"; exit 0; fi
            if test -f "$STATE/failed"; then break; fi
            sleep 2
          done
          touch "$STATE/failed"
          # Stop a late switch after cancellation/timeout. If the deployer was
          # already switching, let its atomic rename finish before restoration.
          for attempt in $(seq 1 30); do
            if test -f "$STATE/switched" || test -f "$STATE/deployer-finished"; then break; fi
            sleep 1
          done
          rollback() {
            local current
            current="$(readlink -f /var/www/qilylean-cn/current)"
            if test "$current" = "$EXPECTED"; then
              test -d "$PREVIOUS" || return 1
              local next="/var/www/qilylean-cn/.current-content-rollback-${EXPECTED##*/}"
              ln -sfn "$PREVIOUS" "$next" || return 1
              mv -Tf "$next" /var/www/qilylean-cn/current || return 1
              sudo nginx -t || return 1
            elif test "$current" != "$PREVIOUS"; then
              echo 'A different release owns current; refusing to overwrite it.' >&2
              return 1
            fi
            test "$(readlink -f /var/www/qilylean-cn/current)" = "$PREVIOUS" || return 1
            test "$(curl --silent --show-error --connect-timeout 5 --max-time 20 --resolve qilylean.cn:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://qilylean.cn/)" = 200
          }
          if rollback; then
            touch "$STATE/rolled-back"
            echo 'Previous static release restored; translation service was not changed.'
          else
            touch "$STATE/rollback-failed"
            echo "Static rollback incomplete; recovery state retained at $STATE" >&2
            exit 1
          fi
          WATCHDOG
          chmod 700 "$STATE/watchdog.sh"
          nohup bash "$STATE/watchdog.sh" "$STATE" "$PREVIOUS" "$EXPECTED" > "$STATE/watchdog.log" 2>&1 </dev/null &
          # The legacy deployer prunes old releases before deep acceptance.
          # Keep this transaction's prior release intact and switch static files
          # atomically without replacing Nginx configuration or service state.
          test ! -e "$EXPECTED"
          mkdir -p "$EXPECTED"
          tar --no-same-owner -xzf /tmp/qilylean-cn-site.tar.gz -C "$EXPECTED"
          for required in index.html robots.txt sitemap.xml favicon.ico assets/site.css assets/portal.css archive/source-content-parity.json meta/cn-content-release.json; do
            test -s "$EXPECTED/$required"
          done
          grep -Fq '湘ICP备2026041143号-1' "$EXPECTED/index.html"
          grep -Fq '湘公网安备43020002000443号' "$EXPECTED/index.html"
          grep -Fq '<urlset' "$EXPECTED/sitemap.xml"
          sudo nginx -t
          test ! -f "$STATE/failed"
          test ! -f "$STATE/rolled-back"
          NEXT="$SITE_ROOT/.current-content-$RELEASE_ID"
          ln -s "$EXPECTED" "$NEXT"
          mv -Tf "$NEXT" "$SITE_ROOT/current"
          touch "$STATE/switched"
          test "$(readlink -f "$SITE_ROOT/current")" = "$EXPECTED"
          test "$(curl --silent --show-error --connect-timeout 5 --max-time 20 --resolve qilylean.cn:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://qilylean.cn/)" = 200
          echo 'Static content switched provisionally; independent rollback watchdog is active.'
          REMOTE

      - name: Ensure public HTTP/HTTPS site remains active
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "chmod +x /tmp/activate-qilylean-cn-http.sh && /tmp/activate-qilylean-cn-http.sh /tmp/qilylean.cn.conf"

      - name: Verify full-quality CN media mirror byte integrity
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.parse
          import urllib.request

          root = pathlib.Path('.')
          manifest = pathlib.Path('cn-site/archive/media-manifest.txt')
          items = [line.strip() for line in manifest.read_text(encoding='utf-8').splitlines() if line.strip()]
          candidates = []
          for encoded in items:
              rel = urllib.parse.unquote(encoded)
              path = root / rel
              if path.is_file():
                  size = path.stat().st_size
                  if 10_000 <= size <= 2_500_000:
                      candidates.append((size, encoded))
          samples = [encoded for _, encoded in sorted(candidates)[:3]]
          if not samples:
              raise SystemExit('No suitable CN media integrity samples were found.')

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'QilyLean-Media-Integrity/1.0','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req, timeout=90) as resp:
                  return resp.read()

          for encoded in samples:
              global_bytes = fetch('https://qilylean.com/' + encoded)
              cn_bytes = fetch('https://qilylean.cn/mirror-media/' + encoded)
              if hashlib.sha256(global_bytes).digest() != hashlib.sha256(cn_bytes).digest():
                  raise SystemExit(f'CN media quality integrity mismatch: {encoded}')
              print(f'PASS exact-byte media mirror: {encoded} ({len(cn_bytes)} bytes)')
          PY

      - name: Warm Tencent-side full-quality media cache
        continue-on-error: true
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          MANIFEST=/var/www/qilylean-cn/current/archive/media-manifest.txt
          if [ ! -s "$MANIFEST" ]; then
            echo "No CN media manifest to warm."
            exit 0
          fi
          nohup bash -c '
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              curl -fsS --retry 2 --connect-timeout 8 --max-time 120 -o /dev/null "https://qilylean.cn/mirror-media/$rel" || true
            done < /var/www/qilylean-cn/current/archive/media-manifest.txt
          ' >/var/log/qilylean-media-warm.log 2>&1 </dev/null &
          echo "Tencent-side full-quality media cache warm-up started."
          REMOTE

      - name: Verify fresh Youdao translation through the production CN origin
        run: |
          python3 - <<'PY'
          import json, urllib.request, uuid
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for target in ('en','zh-TW','ja'):
              source='同源翻译验收：制造质量与现场改善 '+uuid.uuid4().hex
              payload=json.dumps({'source_language':'zh-CN','target_language':target,'texts':[source]}).encode()
              request=urllib.request.Request('https://qilylean.cn/translate',data=payload,headers={'Content-Type':'application/json'})
              with opener.open(request,timeout=65) as response:
                  result=json.load(response)
              translations=result.get('translations',[])
              if result.get('ok') is not True or result.get('provider')!='youdao' or result.get('cached') is not False or len(translations)!=1 or not isinstance(translations[0],str) or not translations[0].strip() or translations[0]==source:
                  raise SystemExit('Fresh production Youdao translation failed: '+target)
              print('PASS: production same-origin fresh Youdao translation: '+target)
          PY

      - name: Mainland production NMT comparison and secret audit
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" 'sudo python3 /tmp/qilylean-cn-translation/verify-production.py --production'

      - name: Verify exact source-content clone on production
        timeout-minutes: 40
        if: steps.source-parity.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This compares actual served main DOM, CSS and every declared media
          # byte with the freshly generated manifest, not implementation tokens.
          python3 cn-site/scripts/validate-source-content-parity.py --production --origin https://qilylean.cn
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          origin='https://qilylean.cn'
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def fetch(path):
              request=urllib.request.Request(origin+path,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'})
              with opener.open(request,timeout=45) as response:
                  assert response.status==200,(path,response.status)
                  assert urlsplit(response.url).hostname=='qilylean.cn','Offsite production redirect: '+path
                  return response.read()
          expected=Path('cn-site/archive/source-content-parity.json').read_bytes()
          release=json.loads(fetch('/meta/cn-content-release.json?release='+os.environ['GITHUB_SHA']))
          assert release['sourceCommit']==os.environ['GITHUB_SHA'],'Unexpected deployed source commit'
          assert release['sourceContentManifestSha256']==hashlib.sha256(expected).hexdigest(),'Wrong release manifest identity'
          assert fetch('/archive/source-content-parity.json?release='+os.environ['GITHUB_SHA'])==expected,'Production manifest bytes differ'
          for route in ('/','/archive/profile/experience/','/archive/profile/capabilities/','/archive/profile/tools/','/lean/','/notes/','/trust/','/knowledge/','/resources/','/briefs/','/about/'):
              text=fetch(route+'?release='+os.environ['GITHUB_SHA']).decode('utf-8')
              assert len(re.findall(r'<link\b[^>]*rel=[\x22\x27]canonical[\x22\x27]',text,re.I))==1,'Missing/duplicate canonical: '+route
              assert '湘ICP备2026041143号-1' in text and '湘公网安备43020002000443号' in text,'Filings missing: '+route
          print('PASS: exact content-release commit, source manifest and core China URLs.')
          PY

      - name: Save exact source-content production manifest
        if: always() && steps.source-parity.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cn-source-content-release-${{ github.run_id }}
          path: |
            cn-site/archive/source-content-parity.json
            cn-site/meta/cn-content-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify production brand and interaction closure
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.request

          sha = os.environ['VERIFY_SHA']

          def fetch(url, attempts=12, capture_headers=False):
              error = None
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'QilyLean-Production-Closure/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          body = response.read().decode('utf-8')
                          return (body, response.headers) if capture_headers else body
                  except Exception as exc:
                      error = exc
                      if attempt < attempts:
                          time.sleep(5)
              raise RuntimeError(f'Failed to fetch {url}: {error}')

          about = fetch(f'https://qilylean.cn/about/?closure={sha}')
          briefs_bridge = fetch(f'https://qilylean.cn/briefs/?closure={sha}')
          resources_bridge = fetch(f'https://qilylean.cn/resources/?closure={sha}')
          home = fetch('https://qilylean.cn/')
          practice = fetch(f'https://qilylean.cn/notes/?closure={sha}')
          practice_css = fetch(f'https://qilylean.cn/assets/practice.css?closure={sha}')
          vi_match = re.search(r'<link id="qilyCnUnifiedViV2" rel="stylesheet" href="([^"]+)">', home)
          expected_vi = '/assets/qilylean-vi-v2.css?v=20261008-cn-vi-v50-cache-revalidation'
          if not vi_match or vi_match.group(1) != expected_vi:
              raise SystemExit('Production homepage must use the exact current VI cache address.')
          vi, vi_headers = fetch('https://qilylean.cn' + expected_vi, capture_headers=True)
