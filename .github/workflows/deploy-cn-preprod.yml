      - name: Verify CN knowledge discovery closure
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, time, urllib.request
          sha=os.environ["VERIFY_SHA"]
          catalog=json.loads(pathlib.Path("cn-site/archive/content-catalog.json").read_text(encoding="utf-8"))
          total=int(catalog["generated"]); briefs=int(catalog["briefs"])
          def fetch(path):
              url="https://qilylean.cn"+path+("?closure="+sha if "?" not in path else "&closure="+sha)
              err=None
              for _ in range(12):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"QilyLean-Knowledge-Discovery/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=20) as resp:
                          return resp.read().decode("utf-8")
                  except Exception as exc:
                      err=exc; time.sleep(5)
              raise SystemExit(f"Failed to fetch {path}: {err}")
          home=fetch("/")
          knowledge=fetch("/knowledge/")
          brief_page=fetch("/briefs/")
          archive=fetch("/archive/")
          manufacturing=fetch("/archive/categories/manufacturing-engineering-ie/")
          checks=[
              ('data-qily-generated-total="'+str(total)+'"',home,"homepage total"),
              ("QILY-CN-KNOWLEDGE-ASSET-CATALOG",knowledge,"knowledge catalog"),
              ('data-qily-international-knowledge-mirror="v1"',knowledge,"international knowledge hub"),
              ('data-qily-terminology-total="193"',knowledge,"193 independent training topics"),
              ("16 项",knowledge,"16 eligible tools, topics and reference entries"),
              ('href="/archive/knowledge/terminology/"',knowledge,"local terminology entry"),
              ('href="#cn-global-tools"',knowledge,"local tools section"),
              ('knowledge-route-feedback-v3&anchors=20261013-v1',knowledge,"knowledge-only CSS cache identity"),
              ('data-qily-brief-total="'+str(briefs)+'"',brief_page,"brief total"),
              ('data-qily-generated-total="'+str(total)+'"',archive,"archive total"),
              ("制造工程与 IE",manufacturing,"manufacturing category"),
          ]
          for needle,body,label in checks:
              if needle not in body:
                  raise SystemExit(f"CN knowledge discovery closure failed: {label} missing {needle}")
          for section in ("knowledge-stats","ai-manufacturing-knowledge","terminology","daily","tools","lean-series","documents"):
              if knowledge.count('id="cn-global-'+section+'"')!=1:
                  raise SystemExit("CN knowledge section missing in production: "+section)
          style=fetch("/assets/content-mirror.css?v=20261016-knowledge-route-feedback-v3")
          if ("QILY-CN-INTERNATIONAL-KNOWLEDGE-VI-PARITY-V2" not in style
                  or "QILY-CN-KNOWLEDGE-ROUTE-FEEDBACK-V3" not in style):
              raise SystemExit("CN international knowledge UI CSS not live")
          import hashlib
          training="/assets/knowledge/%E7%8E%B0%E5%9C%BA%E7%AE%A1%E7%90%86.pdf"
          src=pathlib.Path("cn-site/assets/knowledge/现场管理.pdf").read_bytes()
          source_hash=hashlib.sha256(src).hexdigest()
          error=None
          for attempt in range(6):
              try:
                  request=urllib.request.Request("https://qilylean.cn"+training+"?closure="+sha,
                      headers={"User-Agent":"QilyLean-Knowledge-PDF-Integrity/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      actual=response.read()
                  if hashlib.sha256(actual).hexdigest()!=source_hash:
                      raise RuntimeError("Published 150-page PDF differs from full source bytes")
                  break
              except Exception as exc:
                  error=exc
                  if attempt==5:raise SystemExit(f"Knowledge PDF production validation failed: {error}")
                  time.sleep(4)
          print(f"PASS: CN international knowledge module live: 7 sections / 193 lesson entries / 16 content assets / {briefs} briefs; original training PDF byte-identical.")
          print(f"PASS: CN knowledge discovery is live: {total} pages / {briefs} briefs.")
          PY

      - name: Verify original brief visual parity on production
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          import time
          def fetch(path):
              error=None
              for attempt in range(12):
                  try:
                      request=urllib.request.Request(
                          "https://qilylean.cn"+path,
                          headers={"User-Agent":"QilyLean-Curated-Brief-Visual-Parity/1.0",
                                   "Cache-Control":"no-cache"},
                      )
                      with urllib.request.urlopen(request,timeout=25) as response:
                          if response.status!=200: raise AssertionError(response.status)
                          return response.read().decode("utf-8","replace")
                  except Exception as exc:
                      error=exc
                      if attempt<11:time.sleep(5)
              raise SystemExit("CN brief production fetch failed: "+path+" "+str(error))
          modern=fetch("/briefs/archive/2026-09-28/?brief-vi=20261011-v1")
          legacy=fetch("/briefs/archive/2020-01-09/?brief-vi=20261011-v1")
          modern_css=fetch("/assets/brief-visual-source/qilylean/daily/assets/2026-09-28-brief.css?v=20261011-v1")
          standard_css=fetch("/assets/brief-visual-source/qilylean/daily/brief-layout-standard.css?v=20261011-v1")
          role_page=fetch("/briefs/archive/2026-09-04/?brief-vi=20261015-role-type-parity-v14")
          role_css=fetch("/assets/brief-visual-parity.css?v=20261015-role-type-parity-v14")
          conditions=[
              ("modern brief original layout",modern,('data-qily-brief-parity="v1"','class="plan-chain"','class="formula-grid"')),
              ("semantic role panel",role_page,('class="brief-topic-statement"','<aside class="brief-role-shift" aria-label="角色升级方向">','制造系统设计者</strong><span>现场事实仍是起点')),
              ("semantic role CSS",role_css,('.brief-topic-statement{','.brief-role-shift{','background:linear-gradient(145deg,#073c47,#0f4b5a')),
              ("source role typography and cache",role_page,('/assets/brief-visual-parity.css?v=20261015-role-type-parity-v14',)),
              ("CN role font matches international 19–22px",role_css,('QILY-CN-BRIEF-ROLE-TYPE-PARITY-V14','font-size:clamp(19px,1.25vw,22px)!important;line-height:1.45!important')),
              ("legacy brief original layout",legacy,('data-qily-brief-parity="v1"','brief-one-point-training','/mirror-media/qilylean/assets/daily-2020-01-09.svg')),
              ("source issue styles",modern_css,('.plan-chain','/assets/brief-visual-source/qilylean/daily/brief-layout-standard.css')),
              ("original shared styles",standard_css,('--qily-brief-font-h1','.knowledge-brief-hero')),
          ]
          for label,body,needles in conditions:
              for needle in needles:
                  if needle not in body:
                      raise SystemExit("Visual parity production gate failed: "+label+" / "+needle)
          print("PASS: legacy, rich, and 2026-09-04 semantic aside role cards retain production HTML/CSS parity")
          PY

      - name: Verify non-brief mirrored visual fidelity on production
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,time,urllib.request
          sha=os.environ['VERIFY_SHA']
          data=json.loads(pathlib.Path('cn-site/archive/nonbrief-visual-parity.json').read_text())
          assert data['checked']>=40,'Non-brief mirrored page coverage too small'
          cases=[
              ('/archive/practice/mold-warehouse/','data-qily-original-visual="v1"'),
              ('/archive/knowledge/seat-switch-one-piece-flow/','data-qily-original-visual="v1"'),
              ('/briefs/archive/2026-04-29/','npi-gantt-table'),
          ]
          def fetch(path):
              url='https://qilylean.cn'+path+'?visual='+sha
              last=None
              for _ in range(12):
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'QilyLean-CN-Visual-Fidelity/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          if response.status==200:return response.read().decode('utf-8')
                  except Exception as exc:last=exc
                  time.sleep(5)
              raise SystemExit(f'Production visual page unavailable: {path}: {last}')
          for path,required in cases:
              page=fetch(path)
              if required not in page:
                  raise SystemExit(f'Production original visual layout missing: {path} -> {required}')
              if '湘ICP备2026041143号-1' not in page:
                  raise SystemExit(f'Production China legal footer missing: {path}')
              if '/site-content-axis-v1.css' not in page:
                  raise SystemExit(f'Production canonical content-axis CSS missing: {path}')
          styles=fetch('/assets/nonbrief-visual-parity.css')
          if 'QILY-CN-NONBRIEF-VISUAL-PARITY-V1' not in styles:
              raise SystemExit('Production non-brief visual parity CSS missing')
          styles=fetch('/assets/brief-visual-parity.css')
          if 'QILY-NPI-HIGH-CONTRAST-20261011' not in styles:
              raise SystemExit('Production NPI high-contrast correction missing')
          print(f'PASS non-brief mirrored visual fidelity: {data["checked"]} pages and NPI contrast.')
          PY

      - name: Verify local practice award evidence is public
        if: steps.source-parity.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --location --fail --silent --show-error \
            "https://qilylean.cn/assets/practice/award-6s-page-01.jpg?closure=$GITHUB_SHA" \
            --output "$tmp"
          bytes="$(wc -c < "$tmp" | tr -d ' ')"
          test "$bytes" -gt 10000
          python3 - "$tmp" <<'PY'
          import pathlib
          import sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Production award evidence asset is not a JPEG.')
          print(f'PASS: local CN award evidence is public ({len(data)} bytes, JPEG).')
          PY
          rm -f "$tmp"

      - name: Accept verified static-content release
        if: steps.source-parity.outputs.enabled == 'true'
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          STATE="/tmp/qily-cn-content-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$STATE'" <<'REMOTE'
          set -euo pipefail
          STATE="$1"
          [[ "$STATE" =~ ^/tmp/qily-cn-content-[0-9]+-[0-9]+$ ]]
          test -d "$STATE"
          test ! -f "$STATE/failed"
          test ! -f "$STATE/rolled-back"
          test ! -f "$STATE/rollback-failed"
          test "$(readlink -f /var/www/qilylean-cn/current)" = "$(cat "$STATE/expected")"
          touch "$STATE/committed"
          for attempt in $(seq 1 20); do
            if test -f "$STATE/accepted"; then
              rm -rf "$STATE"
              echo 'PASS: source-content release committed after complete public verification.'
              exit 0
            fi
            test ! -f "$STATE/rolled-back"
            test ! -f "$STATE/rollback-failed"
            sleep 1
          done
          echo 'Static-content acceptance receipt was not confirmed.' >&2
          exit 1
          REMOTE

      - name: Publish CN production verification success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'QilyLean CN Production',
              description: 'Production deploy and live verification passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: Audit CN search readiness and record submission receipts
        continue-on-error: true
        timeout-minutes: 2
        env:
          BAIDU_CN_PUSH_TOKEN: ${{ secrets.BAIDU_CN_PUSH_TOKEN }}
        run: python3 scripts/cn-search-discovery.py --submit both --output-dir "$RUNNER_TEMP/cn-search-discovery"

      - name: Preserve CN search audit and submission receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-search-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/cn-search-discovery/
          if-no-files-found: warn
          retention-days: 30

      - name: Restore previous static release after failed acceptance
        if: (failure() || cancelled()) && steps.static-release.outcome != 'skipped' && steps.source-parity.outputs.enabled == 'true'
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          STATE="/tmp/qily-cn-content-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$STATE'" <<'REMOTE'
          set -euo pipefail
          STATE="$1"
          [[ "$STATE" =~ ^/tmp/qily-cn-content-[0-9]+-[0-9]+$ ]]
          if test ! -d "$STATE"; then echo 'No provisional content release remains.'; exit 0; fi
          if test -f "$STATE/accepted"; then echo 'Content was already fully verified and accepted.'; exit 0; fi
          touch "$STATE/failed"
          for attempt in $(seq 1 90); do
            if test -f "$STATE/rolled-back"; then
              sudo python3 /tmp/qilylean-cn-translation/verify-production.py --production
              echo 'PASS: prior content restored and retained Youdao translation verified.'
              exit 0
            fi
            if test -f "$STATE/rollback-failed"; then
              cat "$STATE/watchdog.log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Rollback confirmation timed out; protected recovery state remains at $STATE" >&2
          exit 1
          REMOTE

      - name: Publish CN production verification failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'QilyLean CN Production',
              description: 'Production deploy or live verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
