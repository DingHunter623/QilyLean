name: Deploy QilyLean CN knowledge site
# QILY-CN-V7-PRODUCTION-DEPLOY-TRIGGER | 2026-09-18

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cn-site/**'
      - '.github/workflows/deploy-cn-preprod.yml'

permissions:
  contents: read

concurrency:
  group: qilylean-cn-production-v7
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize approved CN practice evidence assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/materialize-practice-assets.sh
          cn-site/scripts/materialize-practice-assets.sh

      - name: Production structure gate
        shell: bash
        run: |
          set -euo pipefail
          test -f cn-site/index.html
          test -f cn-site/robots.txt
          test -f cn-site/sitemap.xml
          test -f cn-site/favicon.ico
          test -f cn-site/googleb7a991efbed3aa8a.html
          test -f cn-site/baidu_verify_codeva-Bp0VGliFcp.html
          test -f cn-site/b47ed759da519bd90586a7877122d7be.txt
          test -f cn-site/assets/site.css
          test -f cn-site/assets/qilylean-vi-v2.css
          test -f cn-site/assets/cn-nav-rail-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.js
          test -f cn-site/assets/cn-translate-baidu-v1.css
          ! grep -Fq 'data-qily-translation-provider' cn-site/assets/cn-nav-rail-v1.js
          grep -Fq 'QilyLean CN In-Page Translation V4' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq "data-qily-translation-engine','youdao'" cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'concurrency=3' cn-site/assets/cn-translate-baidu-v1.js
          grep -Fq 'QilyLean CN In-Page Translation UI V3' cn-site/assets/cn-translate-baidu-v1.css
          test -f cn-site/assets/portal.css
          test -f cn-site/assets/qilylean-aircraft-hero-cn-20260918.png
          test -f cn-site/assets/practice.css
          test -f cn-site/assets/practice/smed-300t.svg
          test -f cn-site/assets/practice/mold-warehouse.svg
          test -f cn-site/assets/practice/fuse-process.svg
          test -f cn-site/assets/practice/lean-improvement-evidence.svg
          test -f cn-site/assets/practice/automotive-lean.svg
          test -f cn-site/assets/practice/factory-layout.svg
          test -f cn-site/assets/practice/digital-factory.svg
          test -f cn-site/assets/practice/visual-management.svg
          test -s cn-site/assets/practice/award-6s-page-01.jpg
          test -f cn-site/notes/index.html
          test -f cn-site/scripts/validate-personal-content.sh
          test -f cn-site/scripts/activate-public-http.sh
          test -f cn-site/nginx/qilylean.cn.conf
          test -f cn-site/knowledge/index.html
          test -f cn-site/lean/index.html
          test -f cn-site/ie/index.html
          test -f cn-site/standardization/index.html
          test -f cn-site/factory/index.html
          test -f cn-site/digital/index.html
          test -f cn-site/methods/index.html
          grep -q '湘ICP备2026041143号-1' cn-site/index.html
          grep -q '<urlset' cn-site/sitemap.xml

      - name: Mainland personal-site compliance gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cn-site/scripts/validate-personal-content.sh
          cn-site/scripts/validate-personal-content.sh cn-site

      - name: Build complete release archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='scripts' --exclude='nginx' --exclude='*.md' -czf /tmp/qilylean-cn-site.tar.gz -C cn-site .
          sha256sum /tmp/qilylean-cn-site.tar.gz

      - name: Configure SSH
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts

      - name: Upload release and operations scripts
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          SSH_OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes)
          scp -C "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn /tmp/qilylean-cn-site.tar.gz "$USER_NAME@$CN_PREPROD_HOST:/tmp/qilylean-cn-site.tar.gz"
          scp -C "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn cn-site/scripts/server-bootstrap.sh "$USER_NAME@$CN_PREPROD_HOST:/tmp/bootstrap-qilylean-cn.sh"
          scp -C "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn cn-site/scripts/deploy-release.sh "$USER_NAME@$CN_PREPROD_HOST:/tmp/deploy-qilylean-cn.sh"
          scp -C "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn cn-site/scripts/activate-public-http.sh "$USER_NAME@$CN_PREPROD_HOST:/tmp/activate-qilylean-cn-http.sh"
          scp -C "${SSH_OPTS[@]}" -i ~/.ssh/qilylean_cn cn-site/nginx/qilylean.cn.conf "$USER_NAME@$CN_PREPROD_HOST:/tmp/qilylean.cn.conf"

      - name: Bootstrap server when required
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "if [ ! -f /etc/nginx/sites-available/qilylean-cn-preprod ]; then chmod +x /tmp/bootstrap-qilylean-cn.sh && /tmp/bootstrap-qilylean-cn.sh; else echo 'Server bootstrap already present'; fi"

      - name: Deploy release on mainland server
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          RELEASE_ID="${GITHUB_SHA::12}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "chmod +x /tmp/deploy-qilylean-cn.sh && /tmp/deploy-qilylean-cn.sh /tmp/qilylean-cn-site.tar.gz '$RELEASE_ID'"

      - name: Ensure public HTTP/HTTPS site remains active
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" \
            "chmod +x /tmp/activate-qilylean-cn-http.sh && /tmp/activate-qilylean-cn-http.sh /tmp/qilylean.cn.conf"

      - name: Verify production brand and interaction closure
        shell: bash
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.request

          sha = os.environ['VERIFY_SHA']

          def fetch(url, attempts=12):
              error = None
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'QilyLean-Production-Closure/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          return response.read().decode('utf-8')
                  except Exception as exc:
                      error = exc
                      if attempt < attempts:
                          time.sleep(5)
              raise RuntimeError(f'Failed to fetch {url}: {error}')

          about = fetch(f'https://qilylean.cn/about/?closure={sha}')
          home = fetch(f'https://qilylean.cn/?closure={sha}')
          practice = fetch(f'https://qilylean.cn/notes/?closure={sha}')
          practice_css = fetch(f'https://qilylean.cn/assets/practice.css?closure={sha}')
          vi = fetch(f'https://qilylean.cn/assets/qilylean-vi-v2.css?closure={sha}')
          nav_runtime = fetch(f'https://qilylean.cn/assets/cn-nav-rail-v1.js?closure={sha}')
          translate_runtime = fetch(f'https://qilylean.cn/assets/cn-translate-baidu-v1.js?closure={sha}')
          links = fetch(f'https://qilylean.com/links/?closure={sha}')

          required_about = [
              '关于 QilyLean | 启力精益 中国知识站',
              'QilyLean | <span>启力精益</span>',
              'QilyLean | 启力精益 · 个人制造业知识与实践分享',
              'aria-label="本页主旨"',
              '<b>本页主旨</b>',
          ]
          for marker in required_about:
              if marker not in about:
                  raise SystemExit(f'Production About page missing: {marker}')

          toc_match = re.search(r'<aside\b[^>]*class=["\']toc["\'][^>]*>(.*?)</aside>', about, re.I | re.S)
          if not toc_match:
              raise SystemExit('Production About page missing 本页主旨 panel.')
          toc_inner = toc_match.group(1).lower()
          if '<a' in toc_inner or 'href=' in toc_inner:
              raise SystemExit('Production 本页主旨 panel is still clickable.')
          if '本页目录' in about:
              raise SystemExit('Legacy 本页目录 label returned in production.')

          if '进入 Global Knowledge →' not in home:
              raise SystemExit('Production China home missing global-knowledge CTA.')
          if 'QilyLean | <span>启力精益</span>' not in home:
              raise SystemExit('Production China home lost full brand in header.')
          if '/assets/qilylean-aircraft-hero-cn-20260918.png?v=20260918-cn-aircraft-v1' not in home:
              raise SystemExit('Production China home missing approved no-QR aircraft visual.')
          if '/assets/qilylean-vi-v2.css?v=20260918-cn-vi-v16' not in home:
              raise SystemExit('Production China home missing unified mobile VI cache version.')
          if '/assets/cn-nav-rail-v1.js?v=20260918-nav-rail-v7' not in home:
              raise SystemExit('Production China home missing international-style nav rail runtime.')
          if '/assets/cn-translate-baidu-v1.css?v=20260918-translate-v4-youdao' not in home:
              raise SystemExit('Production China home missing in-page translator stylesheet.')
          if '/assets/cn-translate-baidu-v1.js?v=20260918-translate-v4-youdao' not in home:
              raise SystemExit('Production China home missing in-page translator runtime.')
          required_home_practice = [
              'PRACTICE & EVIDENCE｜实践与成果',
              '约14小时 → 7小时',
              '约180㎡ · 1200+副模具',
              '知识之外，更重要的是方法如何在现场落地',
              '精选 8 项制造实践',
              '从实践中提炼可复用方法',
              '查看全部实践成果',
          ]
          for marker in required_home_practice:
              if marker not in home:
                  raise SystemExit(f'Production China home missing practice marker: {marker}')

          required_practice = [
              '实践与成果：把改善结果还原成可复用的工程方法',
              '从现场问题，到可复用的方法',
              '/assets/practice/automotive-lean.svg?v=20260918-practice-map-v1',
              '/assets/practice/smed-300t.svg?v=20260918-practice-v1',
              '/assets/practice/mold-warehouse.svg?v=20260918-practice-v1',
              '/assets/practice/factory-layout.svg?v=20260918-practice-map-v1',
              '/assets/practice/digital-factory.svg?v=20260918-practice-map-v1',
              '/assets/practice/visual-management.svg?v=20260918-practice-map-v1',
              '/assets/practice/fuse-process.svg?v=20260918-fuse-finished-v2',
              '/assets/practice/lean-improvement-evidence.svg?v=20260918-practice-v1',
              '/assets/practice/award-6s-page-01.jpg?v=20260918-practice-award-v1',
              '/assets/practice.css?v=20260918-practice-visual-v2',
              '6S改善机制：从稽核到激励的运行记录',
              '6S改善运行机制摘要',
              'award-metrics-grid',
              'award-flow',
              '机制说明：',
              '跨部门共同推进，评审、风险确认与结果复盘构成完整闭环',
              '玻璃管保险丝切口与烧口工艺改善后的成品照片',
              '8项制造实践，从现场问题走向标准化沉淀',
              'PRACTICE REPRESENTATIVE｜实践代表',
              '汽车电子精益体系、VSM、单件流与SMED标准化',
              'Factory Layout、精益物流与扩展边界规划',
              '制造数据治理、IT/OT分层与系统验收',
              '制造现场目视化系统设计与运行闭环',
          ]
          for marker in required_practice:
              if marker not in practice:
                  raise SystemExit(f'Production China practice archive missing: {marker}')
          if 'REPRESENTATIVE PRACTICE｜代表实践' in practice:
              raise SystemExit('Legacy representative-practice wording returned in production.')
          required_practice_css = [
              '.practice-grid',
              '.award-panel',
              '.award-summary',
              '.award-metrics-grid',
              '.award-flow',
              '.award-flow-step',
              '.boundary-note',
              'QILY-CN-AWARD-MECHANISM-V2',
              'grid-template-columns:repeat(2,minmax(0,1fr));',
              'white-space:nowrap;',
          ]
          for marker in required_practice_css:
              if marker not in practice_css:
                  raise SystemExit(f'Production China practice stylesheet missing: {marker}')

          required_vi = [
              'QILY-CN-AIRCRAFT-CENTERED-V2',
              'QILY-CN-NAV-RAIL-V7',
              'background:#b9d9d4!important',
              'background:#0f4b5a!important',
              'min-width:104px!important',
              '--qily-cn-primary-nav-font-size:20px',
              '--qily-cn-h1:clamp(30px,8.4vw,38px)',
              '--qily-cn-h2:clamp(24px,6.8vw,29px)',
              '--qily-cn-h3:clamp(19px,5.7vw,21px)',
              'grid-template-areas:"brand nav translate"',
              'grid-template-areas:"brand translate" "nav nav"',
              'object-position:50% 50%!important',
              'CN global-knowledge CTA: VI gold + explicit interaction feedback.',
              'background:var(--qily-gold)!important',
              'html:root body .knowledge-bridge>a:active',
              'QILY-CN-THESIS-NONINTERACTIVE-V1',
              'pointer-events:none!important',
          ]
          for marker in required_vi:
              if marker not in vi:
                  raise SystemExit(f'Production China VI missing: {marker}')
          for marker in ['QilyLean CN Primary Navigation Rail V7', 'qily-cn-nav-shell', 'qily-primary-nav-scroll-thumb', 'mousedown', 'mousemove', 'touchstart', 'ResizeObserver']:
              if marker not in nav_runtime:
                  raise SystemExit(f'Production China nav runtime missing: {marker}')
          for marker in ['QilyLean CN In-Page Translation V4', "data-qily-translation-engine','youdao'", 'concurrency=3']:
              if marker not in translate_runtime:
                  raise SystemExit(f'Production China translation runtime missing: {marker}')

          required_links = [
              '与 QilyLean | 启力精益 制造业应用价值精选',
              '<strong>网址导航友情链接：</strong>QilyLean | 启力精益 已增加主流网址导航官方入口',
              '<strong>QilyLean | 启力精益 中国知识站：</strong>',
              '进入 QilyLean | 启力精益 中国知识站 ↗',
              'qilylean.cn 为 QilyLean | 启力精益 制造知识体系',
          ]
          for marker in required_links:
              if marker not in links:
                  raise SystemExit(f'Production international links page missing full-brand context: {marker}')

          print('PASS: production closure verified on qilylean.cn About/home/practice/VI and qilylean.com /links/.')
          PY

      - name: Verify local practice award evidence is public
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --location --fail --silent --show-error \
            "https://qilylean.cn/assets/practice/award-6s-page-01.jpg?closure=$GITHUB_SHA" \
            --output "$tmp"
          bytes="$(wc -c < "$tmp" | tr -d ' ')"
          test "$bytes" -gt 10000
          python3 - "$tmp" <<'PY'
          import pathlib
          import sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Production award evidence asset is not a JPEG.')
          print(f'PASS: local CN award evidence is public ({len(data)} bytes, JPEG).')
          PY
          rm -f "$tmp"

      - name: Verify Baiduspider PC and mobile reachability
        shell: bash
        run: |
          set -euo pipefail
          uas=(
            'Mozilla/5.0 (compatible; Baiduspider/2.0; +http://www.baidu.com/search/spider.html)'
            'Mozilla/5.0 (Linux; Android 12; Mobile; compatible; Baiduspider/2.0; +http://www.baidu.com/search/spider.html)'
          )
          urls=(
            'https://qilylean.cn/'
            'https://qilylean.cn/ie/'
            'https://qilylean.cn/lean/'
            'https://qilylean.cn/knowledge/'
            'https://qilylean.cn/robots.txt'
            'https://qilylean.cn/sitemap.xml'
          )
          for ua in "${uas[@]}"; do
            for url in "${urls[@]}"; do
              code=''
              for attempt in {1..6}; do
                code="$(curl --location --silent --show-error \
                  --max-time 20 \
                  --connect-timeout 8 \
                  --user-agent "$ua" \
                  --header 'Cache-Control: no-cache' \
                  --output /tmp/qily-baidu-probe-body \
                  --dump-header /tmp/qily-baidu-probe-headers \
                  --write-out '%{http_code}' \
                  "$url?baidu_probe=$GITHUB_SHA-$attempt" || true)"
                if [ "$code" = "200" ]; then
                  break
                fi
                sleep 5
              done
              if [ "$code" != "200" ]; then
                echo "Baiduspider reachability failed: $url returned HTTP ${code:-transport-error}" >&2
                exit 1
              fi
              if grep -Eiq '^X-Robots-Tag:.*noindex' /tmp/qily-baidu-probe-headers; then
                echo "Baiduspider indexing blocked by X-Robots-Tag on $url" >&2
                exit 1
              fi
              echo "PASS: Baiduspider can fetch $url"
            done
          done

          robots_body="$(curl --location --fail --silent --show-error \
            --max-time 20 \
            --user-agent 'Mozilla/5.0 (compatible; Baiduspider/2.0; +http://www.baidu.com/search/spider.html)' \
            "https://qilylean.cn/robots.txt?baidu_probe=$GITHUB_SHA")"
          grep -Fxq 'Allow: /' <<<"$robots_body"
          grep -Fq 'Sitemap: https://qilylean.cn/sitemap.xml' <<<"$robots_body"

          sitemap_body="$(curl --location --fail --silent --show-error \
            --max-time 20 \
            --user-agent 'Mozilla/5.0 (compatible; Baiduspider/2.0; +http://www.baidu.com/search/spider.html)' \
            "https://qilylean.cn/sitemap.xml?baidu_probe=$GITHUB_SHA")"
          for required_url in '/' '/ie/' '/lean/' '/knowledge/'; do
            grep -Fq "<loc>https://qilylean.cn${required_url}</loc>" <<<"$sitemap_body"
          done
          echo 'PASS: QilyLean CN is crawlable by Baiduspider PC/mobile user agents and discovery files are consistent.'

      - name: Verify search-engine ownership files are public
        shell: bash
        run: |
          set -euo pipefail
          verify_exact() {
            local url="$1"
            local expected="$2"
            local label="$3"
            for attempt in {1..18}; do
              body="$(curl --location --fail --silent --show-error "$url?deploy=$GITHUB_SHA-$attempt" || true)"
              if [ "$body" = "$expected" ]; then
                echo "$label verification file is public."
                return 0
              fi
              sleep 5
            done
            echo "$label verification file was not reachable with the expected content." >&2
            return 1
          }
          verify_exact \
            'https://qilylean.cn/googleb7a991efbed3aa8a.html' \
            'google-site-verification: googleb7a991efbed3aa8a.html' \
            'Google Search Console'
          verify_exact \
            'https://qilylean.cn/baidu_verify_codeva-Bp0VGliFcp.html' \
            '8bdf47bc085187ab7717a549ec5b7904' \
            'Baidu Search Resource Platform'

      - name: Verify CN IndexNow key is public
        shell: bash
        env:
          INDEXNOW_KEY: b47ed759da519bd90586a7877122d7be
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            body="$(curl --location --fail --silent --show-error "https://qilylean.cn/$INDEXNOW_KEY.txt?deploy=$GITHUB_SHA-$attempt" || true)"
            if [ "$body" = "$INDEXNOW_KEY" ]; then
              echo "QilyLean CN IndexNow key is public."
              exit 0
            fi
            sleep 10
          done
          echo "QilyLean CN IndexNow key was not reachable in time."
          exit 1

      - name: Submit QilyLean CN sitemap URLs through IndexNow
        shell: bash
        env:
          INDEXNOW_KEY: b47ed759da519bd90586a7877122d7be
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('cn-site/sitemap.xml').getroot()
          urls = []
          seen = set()
          for node in root.findall('sm:url/sm:loc', ns):
              url = (node.text or '').strip()
              if url.startswith('https://qilylean.cn/') and url not in seen:
                  urls.append(url)
                  seen.add(url)

          payload = json.dumps({
              'host': 'qilylean.cn',
              'key': os.environ['INDEXNOW_KEY'],
              'keyLocation': f"https://qilylean.cn/{os.environ['INDEXNOW_KEY']}.txt",
              'urlList': urls,
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=payload,
              headers={'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow accepted {len(urls)} QilyLean CN URLs with HTTP {response.status}.")
          PY

      - name: Submit QilyLean CN URLs to Baidu when configured
        shell: bash
        env:
          BAIDU_CN_PUSH_TOKEN: ${{ secrets.BAIDU_CN_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BAIDU_CN_PUSH_TOKEN" ]; then
            echo 'BAIDU_CN_PUSH_TOKEN is not configured; Baidu API submission is prepared but skipped.'
            exit 0
          fi
          python3 - <<'PY' > /tmp/qilylean-cn-baidu-urls.txt
          import xml.etree.ElementTree as ET
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('cn-site/sitemap.xml').getroot()
          for node in root.findall('sm:url/sm:loc', ns):
              url = (node.text or '').strip()
              if url.startswith('https://qilylean.cn/'):
                  print(url)
          PY
          response="$(curl --fail-with-body --retry 2 --retry-delay 3 -sS \
            -H 'Content-Type: text/plain' \
            --data-binary @/tmp/qilylean-cn-baidu-urls.txt \
            "https://data.zz.baidu.com/urls?site=https://qilylean.cn&token=${BAIDU_CN_PUSH_TOKEN}")"
          echo "Baidu CN submission response: ${response}"
