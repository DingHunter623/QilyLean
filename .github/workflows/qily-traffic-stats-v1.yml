name: QilyLean dual-site traffic stats

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'about/**'
      - 'cn-site/**'
      - 'site-traffic-stats-v1.js'
      - 'site-traffic-stats-v1.css'
      - 'cn-site/assets/site-traffic-stats-v1.js'
      - 'cn-site/assets/site-traffic-stats-v1.css'
      - 'scripts/materialize-qily-traffic-stats-v1.js'
      - '.github/workflows/qily-traffic-stats-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-traffic-stats-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tracking runtimes and materializer
        run: |
          node --check site-traffic-stats-v1.js
          node --check cn-site/assets/site-traffic-stats-v1.js
          node --check scripts/materialize-qily-traffic-stats-v1.js
      - name: Materialize the non-blocking loader on public site pages
        run: node scripts/materialize-qily-traffic-stats-v1.js
      - name: Verify coverage and About modules
        run: |
          node scripts/materialize-qily-traffic-stats-v1.js --check
          node -e "const fs=require('fs');const a=fs.readFileSync('about/index.html','utf8');const c=fs.readFileSync('cn-site/about/index.html','utf8');for(const [s,n] of [[a,'international'],[c,'China']]){if(!s.includes('data-qily-traffic-stats')||!s.includes('intl-total')||!s.includes('cn-total'))throw new Error(n+' About traffic module missing')}"
          git diff --check
      - name: Commit materialized public pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: materialize dual-site traffic tracking on public pages'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Published traffic tracking on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Unable to publish materialized pages after five attempts." >&2
                exit 1
              fi
              echo "Main advanced during push; rebasing and retrying (${attempt}/5)." >&2
              sleep 2
            done
          else
            echo 'All eligible public pages already include the traffic loader.'
          fi