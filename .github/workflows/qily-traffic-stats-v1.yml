name: QilyLean dual-site traffic stats

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'about/**'
      - 'cn-site/**'
      - 'site-traffic-stats-v1.js'
      - 'site-traffic-daily-kline-v1.js'
      - 'scripts/intl-traffic-kline.spec.js'
      - 'scripts/intl-about-traffic-vi.spec.js'
      - 'scripts/cn-traffic-kline.spec.js'
      - 'site-traffic-stats-v1.css'
      - 'cn-site/assets/site-traffic-stats-v1.js'
      - 'cn-site/assets/site-traffic-stats-v1.css'
      - 'scripts/materialize-qily-traffic-stats-v1.js'
      - '.github/workflows/qily-traffic-stats-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-traffic-stats-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tracking runtimes and materializer
        run: |
          node --check site-traffic-stats-v1.js
          node --check site-traffic-daily-kline-v1.js
          node --check scripts/intl-traffic-kline.spec.js
          node --check scripts/intl-about-traffic-vi.spec.js
          node --check cn-site/assets/site-traffic-daily-kline-v1.js
          node --check scripts/cn-traffic-kline.spec.js
          node --check cn-site/assets/site-traffic-stats-v1.js
          node --check scripts/materialize-qily-traffic-stats-v1.js
      - name: Smoke-test the public counter API using a separate health-check key
        shell: bash
        run: |
          set -euo pipefail
          base='https://countapi.mileshilliard.com/api/v1'
          status="$(curl --fail --silent --show-error --max-time 20 "$base/status")"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status") == "operational" or d.get("message") == "API is running", d; print("Counter API status: healthy")' "$status"
          key='qilylean_ci_smoke_test_only_not_site_views'
          hit="$(curl --fail --silent --show-error --max-time 20 "$base/hit/$key")"
          hit_value="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); v=int(d["value"]); assert v >= 1; print(v)' "$hit")"
          readback="$(curl --fail --silent --show-error --max-time 20 "$base/get/$key")"
          read_value="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(int(d["value"]))' "$readback")"
          test "$read_value" -ge "$hit_value"
          echo "Counter API read/write smoke test passed (isolated health key)."

      - name: Browser regression - real PV traffic trend and mobile typography
        shell: bash
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test scripts/intl-traffic-kline.spec.js scripts/cn-traffic-kline.spec.js scripts/intl-about-traffic-vi.spec.js --workers=1 --reporter=line

      - name: Archive phone and desktop Kline visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intl-daily-kline-visual-${{ github.run_id }}
          path: |
            test-results/intl-kline-390.png
            test-results/intl-kline-1440.png
            test-results/intl-about-traffic-vi-390.png
            test-results/intl-about-traffic-vi-1440.png
            test-results/cn-kline-390.png
            test-results/cn-kline-1440.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Clean isolated browser screenshots before any Git commit
        if: always()
        shell: bash
        run: |
          rm -f test-results/intl-kline-390.png test-results/intl-kline-1440.png test-results/intl-about-traffic-vi-390.png test-results/intl-about-traffic-vi-1440.png test-results/cn-kline-390.png test-results/cn-kline-1440.png

      - name: Materialize the non-blocking loader on public site pages
        run: node scripts/materialize-qily-traffic-stats-v1.js
      - name: Verify coverage and About modules
        run: |
          node scripts/materialize-qily-traffic-stats-v1.js --check
          node -e "const fs=require('fs');const a=fs.readFileSync('about/index.html','utf8');const c=fs.readFileSync('cn-site/about/index.html','utf8');for(const [s,n] of [[a,'international'],[c,'China']]){if(!s.includes('data-qily-traffic-stats')||!s.includes('intl-total')||!s.includes('cn-total'))throw new Error(n+' About traffic module missing')}"
          git diff --check
      - name: Commit materialized public pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: materialize dual-site traffic tracking on public pages'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Published traffic tracking on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Unable to publish materialized pages after five attempts." >&2
                exit 1
              fi
              echo "Main advanced during push; rebasing and retrying (${attempt}/5)." >&2
              sleep 2
            done
          else
            echo 'All eligible public pages already include the traffic loader.'
          fi