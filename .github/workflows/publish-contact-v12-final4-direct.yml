name: Publish contact V12.4 direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-contact-v12-final4-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contact-v12-final4-direct-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply final V12.4 directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          version='20260814-contact-v124'

          helper=r'''
            /* QILY-PHONE-COPY-CALL-PROMPT-V12.4 */
            function ensurePhoneCallPrompt(){
              var p=document.getElementById('qilyPhoneCallPrompt');if(p)return p;
              p=document.createElement('div');p.id='qilyPhoneCallPrompt';p.className='qily-wechat-copy-prompt qily-phone-call-prompt';p.setAttribute('role','status');p.setAttribute('aria-live','polite');
              p.innerHTML='<span></span><button type="button" data-qily-call-now>立即拨打</button>';document.body.appendChild(p);
              p.querySelector('[data-qily-call-now]').addEventListener('click',function(){var phone=p.getAttribute('data-phone')||'';p.classList.remove('show');if(phone)window.location.href='tel:'+phone;});
              return p;
            }
            function copyPhoneAndPrompt(anchor,phone){
              phone=(phone||'').replace(/[^0-9+]/g,'');if(!phone)return Promise.resolve();
              return copyText(phone).then(function(){var p=ensurePhoneCallPrompt();p.setAttribute('data-phone',phone);p.querySelector('span').textContent='电话号码 '+phone+' 已复制，是否立即拨打？';positionWechatCopyPrompt(anchor,p);p.classList.add('show');clearTimeout(copyPhoneAndPrompt.timer);copyPhoneAndPrompt.timer=setTimeout(function(){p.classList.remove('show');},9000);});
            }
            window.__qilyCopyPhoneAndPrompt=copyPhoneAndPrompt;
            document.addEventListener('click',function(e){
              var x=e.target.closest&&e.target.closest('[data-qily-phone-call],.qily-phone-list a[href^="tel:"],.term-opl-contact-lines a[href^="tel:"],.contact-card a[href^="tel:"]');if(!x)return;
              e.preventDefault();e.stopPropagation();var phone=x.getAttribute('data-qily-phone-call')||(x.getAttribute('href')||'').replace(/^tel:/,'');copyPhoneAndPrompt(x,phone);
            });

          '''

          for name in ['site-navigation.js','site-navigation-core.js']:
              p=root/name
              if not p.exists(): continue
              t=p.read_text('utf-8')
              t=re.sub(r"var SHARED_ASSET_VERSION = '[^']+';",f"var SHARED_ASSET_VERSION = '{version}';",t,count=1)
              if 'QILY-PHONE-COPY-CALL-PROMPT-V12.4' not in t:
                  if '  function shareUrl(' not in t: raise SystemExit(name+': shareUrl anchor missing')
                  t=t.replace('  function shareUrl(',helper+'  function shareUrl(',1)
              p.write_text(t,'utf-8')

          p=root/'site-shell.css';t=p.read_text('utf-8')
          start='/* QILY-CONTACT-INTERACTION-V12.4:START */';end='/* QILY-CONTACT-INTERACTION-V12.4:END */'
          block=r'''/* QILY-CONTACT-INTERACTION-V12.4:START */
          .qily-contact-panel .qily-phone-list a{cursor:pointer!important;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease!important}
          .qily-contact-panel .qily-phone-list a:hover,.qily-contact-panel .qily-phone-list a:focus-visible{transform:translateY(-2px)!important;border-color:#caa15f!important;background:#fff8e8!important;box-shadow:0 9px 20px rgba(15,75,90,.14)!important;outline:3px solid rgba(202,161,95,.18)!important;outline-offset:2px!important}
          .qily-contact-panel .qily-phone-list a:active{transform:scale(.985)!important;background:#ffeab3!important}
          .qily-contact-panel .qily-phone-city{text-decoration:none!important;text-decoration-line:none!important}
          .qily-contact-panel .qily-phone-number{text-decoration:underline!important;text-decoration-thickness:2px!important;text-underline-offset:4px!important;text-decoration-skip-ink:none!important}
          .qily-phone-call-prompt{border-color:#178b94!important;background:#eef8f6!important}.qily-phone-call-prompt button{background:#0f4b5a!important}
          .contact-card .contact-line,.contact-card .wechat-contact-action{display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;width:100%!important;min-height:46px!important;margin-top:10px!important;padding:9px 14px!important;border:1px solid rgba(255,227,155,.48)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;background:rgba(255,255,255,.08)!important;text-decoration:none!important;cursor:pointer!important;font:inherit!important;font-weight:900!important;box-sizing:border-box!important}
          .contact-card .contact-line span,.contact-card .wechat-contact-action span{text-decoration:none!important;text-decoration-line:none!important;color:inherit!important;-webkit-text-fill-color:inherit!important}
          .contact-card .contact-line strong,.contact-card .wechat-contact-action strong{text-decoration:underline!important;text-decoration-thickness:2px!important;text-underline-offset:4px!important;text-decoration-skip-ink:none!important;color:inherit!important;-webkit-text-fill-color:inherit!important;font-weight:950!important}
          .contact-card .contact-line:hover,.contact-card .contact-line:focus-visible,.contact-card .wechat-contact-action:hover,.contact-card .wechat-contact-action:focus-visible{transform:translateY(-2px)!important;border-color:#ffe39b!important;background:#12606f!important;box-shadow:0 8px 20px rgba(15,75,90,.22)!important;outline:none!important}
          .contact-card .contact-line:active,.contact-card .wechat-contact-action:active{transform:scale(.99)!important;background:#073c47!important}
          /* QILY-CONTACT-INTERACTION-V12.4:END */'''
          if start in t and end in t:t=re.sub(re.escape(start)+r'.*?'+re.escape(end),block,t,count=1,flags=re.S)
          else:t+='\n\n'+block+'\n'
          p.write_text(t,'utf-8')

          p=root/'cooperation/index.html';t=p.read_text('utf-8')
          t=re.sub(r'<a(?: class="contact-line")? href="tel:13450014003"[^>]*>.*?</a>', '<a class="contact-line" href="tel:13450014003" data-qily-phone-call="13450014003" aria-label="复制电话号码13450014003并确认拨打"><span>电话：</span><strong>134 5001 4003</strong></a>', t, count=1, flags=re.S)
          t=re.sub(r'<a(?: class="contact-line")? href="mailto:admin@qilylean.com"[^>]*>.*?</a>', '<a class="contact-line" href="mailto:admin@qilylean.com"><span>官网邮箱：</span><strong>admin@qilylean.com</strong></a>', t, count=1, flags=re.S)
          t=re.sub(r'<button type="button" id="copyWechat"[^>]*>.*?</button>', '<button type="button" id="copyWechat" class="wechat-contact-action" data-qily-wechat-copy="Qily259" aria-label="复制微信 Qily259"><span>微信：</span><strong>Qily259</strong></button>', t, count=1, flags=re.S)
          p.write_text(t,'utf-8')
          PY

      - name: Validate final V12.4
        shell: bash
        run: |
          node --check site-navigation.js
          node --check site-navigation-core.js
          git diff --check
          grep -q 'QILY-PHONE-COPY-CALL-PROMPT-V12.4' site-navigation.js
          grep -q '20260814-contact-v124' site-navigation.js
          grep -q 'QILY-CONTACT-INTERACTION-V12.4:START' site-shell.css
          grep -q 'data-qily-phone-call="13450014003"' cooperation/index.html
          grep -q '<span>电话：</span><strong>134 5001 4003</strong>' cooperation/index.html
          grep -q '<span>微信：</span><strong>Qily259</strong>' cooperation/index.html
          grep -q '.qily-phone-city{text-decoration:none' site-shell.css
          grep -q '.qily-phone-number{text-decoration:underline' site-shell.css

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add site-navigation.js site-navigation-core.js site-shell.css cooperation/index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix: finalize phone feedback and contact button visual V12.4 [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
