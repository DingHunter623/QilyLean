name: Retire Lucky Data source gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lucky-data-source-gateway
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the retired Lucky Data Worker
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          match = re.search(r'[0-9a-fA-F]{32}', os.environ['RAW_CLOUDFLARE_ACCOUNT_ID'])
          if not match:
              raise SystemExit('Invalid Cloudflare account ID')
          account = match.group(0)
          target = 'qilylean-lucky-data'
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts'
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']}
          def scripts():
              with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
                  payload = json.load(response)
              if not payload.get('success'):
                  raise SystemExit('Cloudflare script inventory failed')
              return {item['id'] for item in payload['result']}
          before = scripts()
          if target in before:
              request = urllib.request.Request(base + '/' + target, headers=headers, method='DELETE')
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
              if body and json.loads(body).get('success') is not True:
                  raise SystemExit('Cloudflare deletion failed')
          after = scripts()
          if target in after:
              raise SystemExit('Retired Worker is still present')
          if before - {target} - after:
              raise SystemExit('Unexpected change in other Workers')
          print('Verified: Lucky Data Worker absent; other Workers preserved.')
          PY
