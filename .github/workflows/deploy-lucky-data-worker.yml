name: Deploy Lucky Data source gateway

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/lucky-data-source.js"
      - "wrangler-lucky-data.toml"
      - ".github/workflows/deploy-lucky-data-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lucky-data-source-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validate worker source
        run: |
          node --check cloudflare-worker/lucky-data-source.js
          grep -q "qilylean-lucky-data" wrangler-lucky-data.toml
          grep -q "www.lottery.gov.cn" cloudflare-worker/lucky-data-source.js
          grep -q "www.cwl.gov.cn" cloudflare-worker/lucky-data-source.js

      - name: Validate Cloudflare account ID
        shell: bash
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -n 1)"
          if [ "${#ACCOUNT_ID}" -ne 32 ]; then
            echo "Invalid Cloudflare account ID"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy source gateway
        run: npx wrangler deploy --config wrangler-lucky-data.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify health and official-source reachability
        shell: bash
        run: |
          node <<'NODE'
          const base='https://qilylean-lucky-data.dinghunter623.workers.dev';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path, attempts=8){
            let last;
            for(let i=0;i<attempts;i++){
              try{
                const r=await fetch(base+path,{headers:{Origin:'https://qilylean.com'},signal:AbortSignal.timeout(20000)});
                const text=await r.text();
                if(!r.ok)throw new Error('HTTP '+r.status+' '+text.slice(0,200));
                return JSON.parse(text);
              }catch(e){last=e;if(i<attempts-1)await wait(3000);}
            }
            throw last;
          }
          const health=await get('/health');
          if(!health.ok||health.service!=='qilylean-lucky-data')throw new Error('health contract failed');
          for(const game of ['dlt','ssq','kl8','fc3d']){
            const data=await get('/draws?game='+game+'&page=1&pageSize=10',3);
            if(!data.ok||!Array.isArray(data.rows)||data.rows.length===0)throw new Error(game+' official source returned no rows');
            console.log(game, data.rows[0].issue, data.rows.length);
          }
          NODE
