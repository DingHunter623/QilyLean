name: Retired six-core enforcer — manual record only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "Six-core automatic source enforcement is retired."
          echo "Do not execute enforce-six-core-static-source.js or enforce-six-core-navigation.js as automatic writers."
