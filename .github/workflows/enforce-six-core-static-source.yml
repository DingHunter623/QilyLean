name: Enforce 3+3 cooperation static source

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cooperation/index.html"
      - "site-information-architecture-v1.js"
      - "scripts/materialize-static-core-pages.js"
      - "scripts/hide-public-pricing.js"
      - "scripts/enforce-six-core-static-source.js"
      - ".github/workflows/enforce-six-core-static-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-six-core-static-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate source script syntax
        run: node --check scripts/enforce-six-core-static-source.js

      - name: Enforce canonical static business source
        run: node scripts/enforce-six-core-static-source.js

      - name: Refresh static search index
        continue-on-error: true
        run: |
          if [ -f scripts/refresh-static-core-search-index.js ]; then
            node scripts/refresh-static-core-search-index.js
          fi

      - name: Validate SSR and no-JS business contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '六类项目合作能力｜三类核心项目交付 + 三项数智化产品与技术能力' index.html
          grep -q '<h2>六类项目合作能力</h2>' cooperation/index.html
          grep -q '三类核心项目交付' index.html
          grep -q '三项数智化产品与技术能力' cooperation/index.html
          grep -q '<span class="service-number">01</span>' cooperation/index.html
          grep -q '<h3>新工厂／新产线规划</h3>' cooperation/index.html
          grep -q '<span class="service-number">02</span>' cooperation/index.html
          grep -q '<h3>精益改善项目交付</h3>' cooperation/index.html
          grep -q '<span class="service-number">03</span>' cooperation/index.html
          grep -q '<h3>目视化项目设计与交付</h3>' cooperation/index.html
          grep -q '<span class="service-number">04</span>' cooperation/index.html
          grep -q '<h3>数字化工厂</h3>' cooperation/index.html
          grep -q '<span class="service-number">05</span>' cooperation/index.html
          grep -q '<h3>APP软件开发</h3>' cooperation/index.html
          grep -q '<span class="service-number">06</span>' cooperation/index.html
          grep -q '<h3>官网建设</h3>' cooperation/index.html
          grep -q 'data-qily-six-service-boundary="v1"' cooperation/index.html
          grep -q '合作启动路径与公开报价边界' cooperation/index.html
          ! grep -q '六大核心业务' index.html
          ! grep -q '六大核心业务' cooperation/index.html
          ! grep -q '<h2>三大核心业务</h2>' cooperation/index.html
          ! grep -q '<h2>四类项目合作边界</h2>' cooperation/index.html
          ! grep -q '三类核心业务' index.html
          ! grep -q '三类核心服务' index.html

      - name: Commit normalized static output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No static-source drift detected.'
            exit 0
          fi
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add index.html cooperation/index.html site-information-architecture-v1.js scripts/materialize-static-core-pages.js scripts/hide-public-pricing.js qilylean/site-search-index.json qilylean/site-data.json
          git commit -m '全站口径：统一3+3六类项目合作能力'
          git pull --rebase origin main
          git push origin HEAD:main
