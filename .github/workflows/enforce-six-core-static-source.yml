name: Enforce three-core business architecture

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cooperation/index.html"
      - "site-information-architecture-v1.js"
      - "site-brand-trust-v1.js"
      - "scripts/materialize-static-core-pages.js"
      - "scripts/prepare-static-source-rematerialization.js"
      - "scripts/enforce-six-core-static-source.js"
      - "docs/QILYLEAN_SITE_SYSTEM_V3.md"
      - "docs/QilyLean全站业务口径规范_20260809.md"
      - ".github/workflows/enforce-six-core-static-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-three-core-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enforce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate normalization script syntax
        run: node --check scripts/enforce-six-core-static-source.js

      - name: Normalize and validate canonical three-core static source
        run: node scripts/enforce-six-core-static-source.js

      - name: Refresh static search index
        continue-on-error: true
        run: |
          if [ -f scripts/refresh-static-core-search-index.js ]; then
            node scripts/refresh-static-core-search-index.js
          fi

      - name: Validate SSR, no-JS contract and positive public framing
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<h2>三大核心业务</h2>' index.html
          grep -q '制造运营资产' index.html
          grep -q 'ENGINEERING ENABLERS｜数智化增强' index.html
          grep -q '<h2>三大核心业务</h2>' cooperation/index.html
          grep -q '<span class="service-number">01</span>' cooperation/index.html
          grep -q '<h3>新工厂／新产线规划</h3>' cooperation/index.html
          grep -q '<span class="service-number">02</span>' cooperation/index.html
          grep -q '<h3>精益改善项目交付</h3>' cooperation/index.html
          grep -q '<span class="service-number">03</span>' cooperation/index.html
          grep -q '<h3>目视化项目设计与交付</h3>' cooperation/index.html
          grep -q 'ENGINEERING ENABLERS｜数智化增强' cooperation/index.html
          ! grep -Eq '<span class="service-number">0[456]</span>' cooperation/index.html
          ! grep -q '六类核心能力' index.html cooperation/index.html
          ! grep -q '六类项目合作能力' index.html cooperation/index.html
          ! grep -q '六大核心业务' index.html cooperation/index.html
          ! grep -Eq '不计入核心业务|非核心业务|不列为核心业务|不列为标准核心业务|不另行包装成核心业务|不再与核心业务并列|不作为第四、第五、第六项核心业务' index.html cooperation/index.html

      - name: Verify deterministic diff
        run: git diff --check

      - name: Commit normalized static output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No three-core source drift detected.'
            exit 0
          fi
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add -A
          git commit -m '全站文案：移除否定式核心业务标签 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
