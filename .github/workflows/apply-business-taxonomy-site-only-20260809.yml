name: Publish QilyLean 3+3 taxonomy and trust upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-business-taxonomy-site-only-20260809.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply website and source updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
            'index.html',
            'cooperation/index.html',
            'site-information-architecture-v1.js',
            'site-core-service-dock-closure-v1.js',
            'scripts/materialize-static-core-pages.js',
            'scripts/hide-public-pricing.js',
            'scripts/sync-home-latest-brief-cta.js',
            'scripts/enforce-six-core-static-source.js',
          ]
          replacements = [
            ('QilyLean｜启力精益｜六大核心业务项目交付','QilyLean｜启力精益｜六类项目合作能力'),
            ('项目合作｜QilyLean六大核心业务与项目交付','项目合作｜QilyLean六类项目合作能力'),
            ('QilyLean项目合作｜六大核心业务与项目交付','QilyLean项目合作｜六类项目合作能力'),
            ('两大业务主线，六大核心业务——从制造现场改善，到数智化产品交付。','三类核心项目交付 + 三项数智化产品与技术能力，合计六类项目合作能力。'),
            ('两大业务主线、六大核心业务；以范围、交付物、Pilot／测试、验证和验收定义合作。','三类核心项目交付 + 三项数智化产品与技术能力，合计六类项目合作能力；以范围、交付物、Pilot／测试、验证和验收定义合作。'),
            ('制造工程交付｜数智化产品交付｜六大核心业务','三类核心项目交付｜三项数智化产品与技术能力｜六类项目合作能力'),
            ('两大业务主线｜六大核心业务','六类项目合作能力｜三类核心项目交付 + 三项数智化产品与技术能力'),
            ('CORE BUSINESS｜两大业务主线','COOPERATION CAPABILITIES｜核心项目交付 + 数智化技术能力'),
            ('查看六大核心业务与交付边界','查看六类项目合作能力与交付边界'),
            ('查看六大核心业务与交付','查看六类项目合作能力与交付'),
            ('六大核心业务之外的平台扩展价值','六类项目合作能力之外的平台扩展价值'),
            ('六大核心业务均明确范围、交付物与验收边界','六类项目合作能力均明确范围、交付物与验收边界'),
            ('六大核心业务完整项目','六类项目合作能力的完整合作'),
            ('六大核心业务任一完整专项项目总价','六类项目合作能力任一完整专项合作总价'),
            ('六大核心业务均属于项目型服务','六类项目合作能力均按项目边界定义合作'),
            ('不与六大核心业务争夺首页主视觉','不与六类项目合作能力争夺首页主视觉'),
            ('QilyLean六大核心业务项目交付','QilyLean六类项目合作能力'),
            ('提供新工厂／新产线规划、精益改善、目视化、数字化工厂、APP软件开发与官网建设六大核心业务','提供三类核心项目交付（新工厂／新产线规划、精益改善、目视化）与三项数智化产品与技术能力（数字化工厂、APP软件开发、官网建设），合计六类项目合作能力'),
            ('围绕制造工程交付与数智化产品交付，形成新工厂规划、精益改善、目视化、数字化工厂、APP软件开发与官网建设六大核心业务。','形成三类核心项目交付（新工厂规划、精益改善、目视化）与三项数智化产品与技术能力（数字化工厂、APP软件开发、官网建设），合计六类项目合作能力。'),
            ('围绕“制造工程交付”与“数智化产品交付”两条主线形成六大核心业务','形成三类核心项目交付与三项数智化产品与技术能力，合计六类项目合作能力'),
            ('依托20年制造工程与精益改善实践，围绕两大业务主线形成六大核心业务','依托20年制造工程与精益改善实践，形成三类核心项目交付与三项数智化产品与技术能力，合计六类项目合作能力'),
            ('六项业务形成“制造工程交付 + 数智化产品交付”两条主线；','六类能力采用“3+3”结构：前三类为核心项目交付，后三项为数智化产品与技术能力；'),
            ('六项业务统一遵循问题定义、事实基线、方案／原型、Pilot／测试、实绩验证、标准固化与项目验收。','六类项目合作能力统一遵循问题定义、事实基线、方案／原型、Pilot／测试、实绩验证、标准固化与项目验收。'),
            ('制造工程交付解决工厂、产线与现场运营问题；数智化产品交付把制造业务逻辑进一步沉淀为数字化系统、软件工具与专业互联网载体。','前三类核心项目交付直接解决工厂、产线与现场运营问题；后三项数智化产品与技术能力把制造业务逻辑进一步沉淀为数字化系统、软件工具与专业互联网载体。'),
            ('<small>制造工程交付｜01</small>','<small>核心项目交付｜01</small>'),
            ('<small>制造工程交付｜02</small>','<small>核心项目交付｜02</small>'),
            ('<small>制造工程交付｜03</small>','<small>核心项目交付｜03</small>'),
            ('<small>数智化产品交付｜04</small>','<small>数智化产品与技术能力｜04</small>'),
            ('<small>数智化产品交付｜05</small>','<small>数智化产品与技术能力｜05</small>'),
            ('<small>数智化产品交付｜06</small>','<small>数智化产品与技术能力｜06</small>'),
            ('<span>制造工程交付</span>','<span>核心项目交付</span>'),
            ('<span>数智化产品交付</span>','<span>数智化产品与技术能力</span>'),
            ('六大核心业务','六类项目合作能力'),
          ]

          changed=[]
          for rel in files:
            p=Path(rel)
            if not p.exists(): continue
            text=p.read_text(encoding='utf-8'); old=text
            for a,b in replacements: text=text.replace(a,b)
            if rel=='index.html':
              text=text.replace('data-qily-six-core-services="v1"','data-qily-six-cooperation-capabilities="v1"')
              text=text.replace('QilyLean六类项目合作能力项目交付','QilyLean六类项目合作能力')
            if rel=='cooperation/index.html':
              text=text.replace('QilyLean提供六类项目合作能力项目合作：新工厂／新产线规划、精益改善、目视化设计交付、数字化工厂、APP软件开发与官网建设，通过诊断、方案、Pilot／测试、验证、固化和验收形成项目闭环。','QilyLean项目合作采用“3+3”结构：三类核心项目交付——新工厂／新产线规划、精益改善、目视化；三项数智化产品与技术能力——数字化工厂、APP软件开发、官网建设；合计六类项目合作能力。')
            if text!=old:
              p.write_text(text,encoding='utf-8'); changed.append(rel)

          trust=Path('trust/index.html'); t=trust.read_text(encoding='utf-8'); old=t
          t=t.replace('<a href="#evidence">成果证据</a><a href="#evidence-levels">证据分级</a>','<a href="#evidence">成果证据</a><a href="#external-verification">外部核验</a><a href="#evidence-levels">证据分级</a>')
          section='''\n<section class="module-section" id="external-verification"><div class="module-inner"><div class="module-heading"><h2>外部可验证信用｜建设状态</h2><p>站内证据链与站外独立背书分开披露。QilyLean不以自建页面、任职项目或个人作品冒充第三方评价；外部信用只收录能够由客户、合作方、行业平台或其他独立来源自行核验的公开信息。</p></div><div class="trust-grid"><article class="trust-card"><span class="trust-label">COMMERCIAL DELIVERY</span><h3>QilyLean品牌商业交付</h3><p><strong>当前公开记录：0项。</strong> 仅当项目存在真实合作范围、完成交付、形成验收证据并取得客户公开授权后，才进入商业交付档案。任职期间项目不计入QilyLean品牌订单。</p><p><a href="/projects/qilylean-commercial-deliveries/">查看商业交付档案 →</a></p></article><article class="trust-card"><span class="trust-label">CLIENT AUTHORIZATION</span><h3>客户授权评价</h3><p><strong>当前状态：尚无经书面授权公开的客户评价。</strong> 后续评价必须保留原始授权、项目编号与对应验收记录；不代写、不拼接、不默认授权。</p></article><article class="trust-card"><span class="trust-label">INDEPENDENT REFERENCES</span><h3>独立第三方引用</h3><p><strong>当前状态：外部信用图谱建设中。</strong> 仅收录可独立访问的客户官网／公众号、行业平台、协会、媒体或合作机构页面；QilyLean自有页面不计作第三方背书。</p></article><article class="trust-card"><span class="trust-label">VERIFICATION RULE</span><h3>核验优先于包装</h3><p>职业经历、团队成果、个人作品、QilyLean商业订单和第三方评价分别建档。无法公开核验的内容，不使用“客户推荐”“行业认证”“合作案例”等容易造成误解的措辞。</p></article></div><div class="trust-callout" style="margin-top:18px"><strong>信用建设原则：</strong>先完成真实订单与验收，再取得客户授权，最后形成独立外部来源；在此之前保持“建设中”状态，不用站内自证替代站外背书。</div></div></section>\n'''
          marker='<section class="module-section" id="evidence-levels">'
          if 'id="external-verification"' not in t:
            if marker not in t: raise SystemExit('trust marker missing')
            t=t.replace(marker,section+marker,1)
          if t!=old: trust.write_text(t,encoding='utf-8'); changed.append(str(trust))

          commercial=Path('projects/qilylean-commercial-deliveries/index.html'); c=commercial.read_text(encoding='utf-8'); old=c
          credit='''\n<section class="section"><h2>从首单到站外信用的闭环</h2><div class="grid"><article class="card"><h3>1｜真实签约</h3><p>建立可核验的合同、订单、报价确认或等效书面范围，项目编号与责任主体一致。</p></article><article class="card"><h3>2｜交付验收</h3><p>保存基线、交付物、变更、验收或关闭记录，并按A／B／C／D证据等级管理公开口径。</p></article><article class="card"><h3>3｜客户授权与外部来源</h3><p>客户评价必须书面授权；如客户、合作方或行业平台形成独立公开页面，再登记其可核验来源，不以QilyLean自有页面替代第三方背书。</p></article></div><p class="fine"><strong>当前阶段：</strong>QilyLean品牌商业交付公开记录0项、经书面授权公开的客户评价0项；外部信用图谱处于建设阶段。真实完成一项，再公开一项。</p></section>\n'''
          cm='<section class="section"><h2>项目编号与公开条件</h2>'
          if '从首单到站外信用的闭环' not in c:
            if cm not in c: raise SystemExit('commercial marker missing')
            c=c.replace(cm,credit+cm,1)
          if c!=old: commercial.write_text(c,encoding='utf-8'); changed.append(str(commercial))

          standard=Path('docs/QilyLean全站业务口径规范_20260809.md')
          standard.write_text('''# QilyLean全站业务口径规范｜2026-08-09\n\n- **三类核心项目交付**：①新工厂／新产线规划；②精益改善项目交付；③目视化项目设计与交付。\n- **三项数智化产品与技术能力**：④数字化工厂；⑤APP软件开发；⑥官网建设。\n- **六类项目合作能力**：以上“3+3”的统一总称。\n\n禁止再将全部六项统称为“六大核心业务”，禁止“三大核心业务／六大核心业务”并存。任职期间项目 ≠ QilyLean商业订单；个人专业作品 ≠ 客户验收项目；站内证据 ≠ 第三方背书。客户评价须书面授权，第三方引用须站外独立可核验。\n\n**保护项：本轮不修改《ChatGPT应用与精益生产实践证书》名称、页面或相关说明。**\n''',encoding='utf-8')
          changed.append(str(standard))

          for p in [Path('index.html'),Path('cooperation/index.html'),Path('site-information-architecture-v1.js'),Path('scripts/enforce-six-core-static-source.js')]:
            if '六大核心业务' in p.read_text(encoding='utf-8'): raise SystemExit(f'old taxonomy remains in {p}')
          if '三类核心项目交付' not in Path('index.html').read_text(encoding='utf-8'): raise SystemExit('home taxonomy missing')
          if '三项数智化产品与技术能力' not in Path('cooperation/index.html').read_text(encoding='utf-8'): raise SystemExit('cooperation taxonomy missing')
          print('\n'.join(changed))
          PY
          if [ -f scripts/refresh-static-core-search-index.js ]; then node scripts/refresh-static-core-search-index.js || true; fi
      - name: Commit website upgrade
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add index.html cooperation/index.html trust/index.html projects/qilylean-commercial-deliveries/index.html site-information-architecture-v1.js site-core-service-dock-closure-v1.js scripts/materialize-static-core-pages.js scripts/hide-public-pricing.js scripts/sync-home-latest-brief-cta.js scripts/enforce-six-core-static-source.js docs/QilyLean全站业务口径规范_20260809.md qilylean/site-search-index.json qilylean/site-data.json 2>/dev/null || true
          git commit -m '官网整改：统一3+3项目合作口径并补强外部信用披露'
          git pull --rebase origin main
          git push origin HEAD:main
