name: Verify Pure DDZ Start Flow

on:
  pull_request:
    paths:
      - 'tools/pure-ddz/**'
      - '.github/workflows/verify-pure-ddz-start-flow.yml'
  workflow_dispatch:

jobs:
  start-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static contract
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/qilylean-theme.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -q "player === 1 ? '左家' : '右家'" tools/pure-ddz/game/js/game.js
          grep -q "player===1?'左家':'右家'" tools/pure-ddz/game/js/visual-v120.js
          grep -q "function positionClass" tools/pure-ddz/game/js/visual-v120.js
          ! grep -q "table.appendChild(strip)" tools/pure-ddz/game/js/qilylean-theme.js
          grep -q "20260824-mobile-hotfix1" tools/pure-ddz/index.html
          grep -q "html:not(.ddz-ready) .game-shell" tools/pure-ddz/index.html
      - name: Install browser smoke deps
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start web server
        run: |
          nohup python3 -m http.server 4173 --directory tools/pure-ddz >/tmp/ddz-start-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ddz-start-http.log || true
          exit 1
      - name: Verify desktop and mobile start flow
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for (const viewport of [{width:1440,height:900},{width:844,height:390}]) {
              const page=await browser.newPage({viewport});
              await page.addInitScript(()=>localStorage.setItem('qily_global_language_v3','zh-CN'));
              const dialogs=[]; const pageErrors=[];
              page.on('dialog', async dialog=>{dialogs.push(dialog.message()); await dialog.dismiss();});
              page.on('pageerror', error=>pageErrors.push(error.stack || `${error.name}: ${error.message}`));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              await page.evaluate(()=>{localStorage.clear();localStorage.setItem('qily_global_language_v3','zh-CN');});
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.documentElement.classList.contains('ddz-ready')&&Boolean(window.PureDDZTest)&&Boolean(window.QilyLeanV120),null,{timeout:8000});
              const names=await page.evaluate(()=>({left:document.querySelector('#left-panel .player-name')?.textContent?.trim(),right:document.querySelector('#right-panel .player-name')?.textContent?.trim()}));
              if(names.left!=='左家'||names.right!=='右家') throw new Error('Player labels incorrect: '+JSON.stringify(names));
              const welcome=page.locator('#welcome');
              if(await welcome.isVisible().catch(()=>false)) await page.locator('#welcome-start').click();
              else await page.locator('#start').click();
              await page.waitForTimeout(1200);
              const result=await page.evaluate(()=>({
                phase:window.PureDDZTest?.getState().phase,
                stateHand:window.PureDDZTest?.getState().hands?.[0]?.length,
                domHand:document.querySelectorAll('#hand .card').length,
                strips:document.querySelectorAll('.qily-business-strip').length,
                ready:document.documentElement.classList.contains('ddz-ready'),
                hasTheme:Boolean(window.QilyLeanCardTheme),
                hasVisual:Boolean(window.QilyLeanV120)
              }));
              result.pageErrors=[...pageErrors];
              console.log(JSON.stringify({viewport,result,dialogs},null,2));
              if(dialogs.length) throw new Error('Unexpected dialog on initial start: '+dialogs.join(' | '));
              if(result.phase!=='bidding'&&result.phase!=='playing') throw new Error('Game did not start: '+JSON.stringify(result));
              if(result.stateHand<17||result.domHand<17) throw new Error('Cards not visible: '+JSON.stringify(result));
              if(result.strips!==0) throw new Error('Business strip still present: '+JSON.stringify(result));
              if(!result.ready||!result.hasTheme||!result.hasVisual) throw new Error('Runtime not ready: '+JSON.stringify(result));
              if(result.pageErrors.length) throw new Error('Page errors: '+result.pageErrors.join(' | '));
              await page.close();
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE