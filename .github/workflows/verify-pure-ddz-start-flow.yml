name: Verify Pure DDZ Start Flow

on:
  pull_request:
    paths:
      - 'tools/pure-ddz/**'
      - '.github/workflows/verify-pure-ddz-start-flow.yml'
  workflow_dispatch:

jobs:
  verify-start-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify V152 elder-paced turn sequencing
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "const VERSION = '1.5.2'" tools/pure-ddz/game/js/game.js
          grep -Fq 'flowToken:0' tools/pure-ddz/game/js/game.js
          grep -Fq 'function speakAsync' tools/pure-ddz/game/js/game.js
          grep -Fq 'function afterNarration' tools/pure-ddz/game/js/game.js
          grep -Fq "afterNarration(narration,()=>{state.current=nextPlayer(player);render();scheduleTurn();},1100)" tools/pure-ddz/game/js/game.js
          grep -Fq "afterNarration(text,()=>{if(resetRound){state.lastPlay=null;state.passCount=0;}state.current=next;render();scheduleTurn();},1000)" tools/pure-ddz/game/js/game.js
          grep -Fq 'finishIfNeeded(player,narration)' tools/pure-ddz/game/js/game.js
          grep -Fq "pass(0,{auto:true})" tools/pure-ddz/game/js/game.js
          grep -Fq "auto?'不要':'您不要'" tools/pure-ddz/game/js/game.js
          grep -Fq "flash('不要，自动轮到下家')" tools/pure-ddz/game/js/game.js
          grep -Fq "utterance.rate=.82" tools/pure-ddz/game/js/game.js
          grep -Fq '20260902-ddz-integrated-v152' tools/pure-ddz/index.html
