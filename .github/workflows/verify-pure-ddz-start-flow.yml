name: Verify Pure DDZ Start Flow

on:
  pull_request:
    paths:
      - 'tools/pure-ddz/**'
      - '.github/workflows/verify-pure-ddz-start-flow.yml'
  workflow_dispatch:

jobs:
  verify-start-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify V150 turn sequencing
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "const VERSION = '1.5.0'" tools/pure-ddz/game/js/game.js
          grep -Fq 'flowToken:0' tools/pure-ddz/game/js/game.js
          grep -Fq 'function speakAsync' tools/pure-ddz/game/js/game.js
          grep -Fq 'function afterNarration' tools/pure-ddz/game/js/game.js
          grep -Fq 'afterNarration(narration,scheduleTurn,700)' tools/pure-ddz/game/js/game.js
          grep -Fq 'afterNarration(text,scheduleTurn,650)' tools/pure-ddz/game/js/game.js
          grep -Fq 'finishIfNeeded(player,narration)' tools/pure-ddz/game/js/game.js
          grep -Fq "pass(0,{auto:true})" tools/pure-ddz/game/js/game.js
          grep -Fq 'speechSynthesis.cancel' tools/pure-ddz/game/js/game.js
          grep -Fq '20260902-ddz-integrated-v150' tools/pure-ddz/index.html