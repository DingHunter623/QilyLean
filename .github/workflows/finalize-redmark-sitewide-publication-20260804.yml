name: Finalize 2026-08-04 sitewide redmark closure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-redmark-sitewide-publication-20260804.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-redmark-sitewide-publication-20260804
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate closure sources
        run: |
          node --check site-navigation.js
          node --check site-visual-closure-v1.js
          node --check scripts/sync-daily-index-source.js
          node --check scripts/build-site-metadata.js
          node --check scripts/apply-integrity-upgrade.js
          node --check scripts/build-trust-search-sync.js
          node --check scripts/publish-global-link-standard.js
          node --check scripts/emergency-materialize-vi.js

      - name: Rebuild live brief metadata and public statistics
        run: |
          node scripts/sync-daily-index-source.js
          node scripts/build-site-metadata.js
          node scripts/apply-integrity-upgrade.js
          node scripts/build-trust-search-sync.js

      - name: Materialize current navigation and sitewide visual closure
        run: |
          node scripts/publish-global-link-standard.js
          node scripts/emergency-materialize-vi.js

      - name: Validate all redmark corrections and no-regression rules
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const briefs = JSON.parse(fs.readFileSync('qilylean/daily/index.json','utf8'));
          if (!Array.isArray(briefs) || !briefs.length) throw new Error('Daily brief index is empty.');
          briefs.sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
          const latest = briefs[0];
          const total = briefs.length;
          const data = JSON.parse(fs.readFileSync('qilylean/site-data.json','utf8'));
          const home = fs.readFileSync('index.html','utf8');
          const knowledge = fs.readFileSync('knowledge/index.html','utf8');
          const cooperation = fs.readFileSync('cooperation/index.html','utf8');
          const closure = fs.readFileSync('site-visual-closure-v1.js','utf8');

          if (latest.date !== '2026-08-04') throw new Error(`Expected latest brief 2026-08-04, got ${latest.date}.`);
          if (total !== 2583) throw new Error(`Expected 2583 briefs, got ${total}.`);
          if (data.briefs.total !== total || data.briefs.latestDate !== latest.date) throw new Error('site-data brief statistics are stale.');
          if (!home.includes(`${total}期`) || !home.includes(latest.date)) throw new Error('Homepage brief statistics are stale.');
          if (!knowledge.includes(`${total} 期`) || !knowledge.includes(`最新更新至 ${latest.date}`)) throw new Error('Knowledge statistics are stale.');
          if (!closure.includes('qilySitewideClarityStyleV2')) throw new Error('Sitewide clarity rules are missing.');
          if (!closure.includes('.service-number')) throw new Error('Core-business number contrast rule is missing.');
          if (!closure.includes('.hero-actions a.primary')) throw new Error('Hero primary-button contrast rule is missing.');
          if (!closure.includes('.module-grid>.module-card>.module-actions')) throw new Error('Card action-bottom alignment rule is missing.');
          if (!cooperation.includes('service-number')) throw new Error('Core-business number markup is missing.');

          const failures = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              if (['.git','node_modules','.cache'].includes(entry.name)) continue;
              const full = path.join(dir,entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) {
                const html = fs.readFileSync(full,'utf8');
                if (!/<\/head>/i.test(html)) continue;
                const rel = path.relative(process.cwd(),full);
                if (!html.includes('site-navigation.js?v=20260804-sitewide-clarity-v2')) failures.push(`${rel}:navigation`);
                if (!html.includes('site-visual-closure-v1.css?v=20260804-sitewide-clarity-v2')) failures.push(`${rel}:closure-css`);
                if (!html.includes('site-visual-closure-v1.js?v=20260804-sitewide-clarity-v2')) failures.push(`${rel}:closure-js`);
              }
            }
          }
          walk(process.cwd());
          if (failures.length) throw new Error('Stale public assets remain: '+failures.slice(0,40).join(', '));
          NODE
          git diff --check

      - name: Commit final public closure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sitewide redmark closure is already fully published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize sitewide redmark clarity statistics and action alignment [skip ci]"
          git pull --rebase origin main
          git push origin main
