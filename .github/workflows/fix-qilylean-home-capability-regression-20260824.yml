name: Apply QilyLean Home v2.3.3 capability repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qilylean-home-capability-regression-20260824.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current QilyLean Home publication source
        run: python3 scripts/publish-qilylean-home-v2.py
      - name: Validate restored capability card
        run: |
          set -euo pipefail
          grep -q 'data-qily-home-card="v2.3.3-full"' capabilities/index.html
          grep -q '/assets/tools/qilylean-unified-app-icon.svg?v=20260824-home-card-restore-v1' capabilities/index.html
          grep -q 'Android 官网全导航通用版 · v2.3.3' capabilities/index.html
          grep -q 'versionCode 11' capabilities/index.html
          grep -q '/QilyLean_Home_v2.3.3_API36_INSTALL.apk' capabilities/index.html
          grep -q 'Times26001直达' capabilities/index.html
          grep -q '全部应用抽屉' capabilities/index.html
          grep -q 'times26001-overview.svg' capabilities/index.html
          grep -q 'ding-qili-ai-avatar-560.webp' capabilities/index.html
          grep -q 'c919-strategy-hero-v14.png' capabilities/index.html
          ! grep -q '/QilyLeanHome-v1.0.1.apk' capabilities/index.html
          ! grep -q '当前版本：v1.0.1' capabilities/index.html
      - name: Commit repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm --quiet .github/workflows/fix-qilylean-home-capability-regression-20260824.yml
          git add capabilities/index.html scripts/publish-qilylean-home-v2.py
          git commit -m 'fix: restore QilyLean Home full capability card and official icon'
          git pull --rebase origin main
          git push origin HEAD:main
