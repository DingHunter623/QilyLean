name: Fix PDCA Gantt OPL header V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-pdca-gantt-opl-header-v1.js'
      - '.github/workflows/fix-pdca-gantt-opl-header-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdca-gantt-opl-header-v1-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply screenshot-marked OPL fixes
        run: node scripts/fix-pdca-gantt-opl-header-v1.js
      - name: Validate target page
        shell: bash
        run: |
          node --check scripts/fix-pdca-gantt-opl-header-v1.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('knowledge/pdca-gantt-milestone-opl.html','utf8');
          const checks=[
            '<img src="/assets/brand/qilylean-logo.svg" alt="QilyLean｜启力精益">',
            '.opl-brand img{display:block;width:auto;height:36px',
            '.opl-btn.secondary{background:rgba(6,49,58,.24)!important;color:#fff!important;-webkit-text-fill-color:#fff!important'
          ];
          for(const token of checks){if(!html.includes(token))throw new Error('Missing visual fix: '+token)}
          if(html.includes('<a class="opl-brand" href="/">QilyLean｜启力精益</a>'))throw new Error('Legacy text brand remains');
          console.log('PDCA OPL visual QA passed.');
          NODE
      - name: Commit production page
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add knowledge/pdca-gantt-milestone-opl.html
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: use official logo and white dark-surface CTA in PDCA OPL [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
