name: Fix capability visuals 20260824

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-capabilities-visuals-20260824.yml'
      - 'scripts/fix-capabilities-visuals-20260824.js'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'scripts/publish-qilylean-home-v2.py'
      - 'assets/tools/times26001-overview.svg'
      - 'pure-ddz-capability-visual-v2.css'
      - 'capability-digital-tools-layout-v1.css'
      - 'app-download-share-v1.js'
      - 'tools/pure-ddz/game/js/card-theme.js'
      - 'tools/pure-ddz/game/js/qilylean-theme.js'
      - 'tools/pure-ddz/game/js/visual-v120.js'
      - 'tools/pure-ddz/game/css/card-comfort-v122.css'
      - 'tools/pure-ddz/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-capabilities-visuals-20260824-main
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source scripts
        run: |
          node --check scripts/fix-capabilities-visuals-20260824.js
          node --check scripts/materialize-ddz-public-ui-20260824.js
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/qilylean-theme.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check app-download-share-v1.js
          python3 -m py_compile scripts/publish-qilylean-home-v2.py
      - name: Apply capability and DDZ public UI fixes
        run: |
          node scripts/fix-capabilities-visuals-20260824.js
          node scripts/materialize-ddz-public-ui-20260824.js
      - name: Validate output
        shell: bash
        run: |
          test -f assets/tools/times26001-overview.svg
          test -f tools/pure-ddz/game/css/card-comfort-v122.css
          test -f assets/qilylean-aircraft-hero-latest-q98.webp
          grep -q '/assets/tools/times26001-overview.svg?v=20260824-capability-visual-fix-v1' capabilities/index.html
          grep -q '/pure-ddz-capability-visual-v2.css?v=20260824-red-heart-ace-v8' capabilities/index.html
          grep -Fq '.capability-ddz-card.red strong{color:#d32f2f!important;-webkit-text-fill-color:#d32f2f!important}' pure-ddz-capability-visual-v2.css
          grep -q 'capability-ddz-title" style="color:#fff!important;-webkit-text-fill-color:#fff!important' capabilities/index.html
          grep -q 'capability-ddz-sub" style="color:#ffe39b!important;-webkit-text-fill-color:#ffe39b!important' capabilities/index.html
          grep -q '<div class="capability-ddz-card red"><strong aria-label="红桃A">A♥</strong>' capabilities/index.html
          grep -q 'data-qily-home-actions="20260824-v2"' capabilities/index.html
          grep -q 'data-app-share-qr="qilyleanHome"' capabilities/index.html
          grep -q 'data-app-share-link="qilyleanHome"' capabilities/index.html
          grep -q '/app-download-share-v1.js?v=20260824-capability-home-actions-v2' capabilities/index.html
          grep -Fq "const version='20260828-elder-ux-v127';" tools/pure-ddz/index.html
          grep -Fq "window.__PURE_DDZ_CACHE_KEY__||'20260828-elder-ux-v127'" tools/pure-ddz/index.html
          grep -Fq "loadStyle('css/card-comfort-v122.css')" tools/pure-ddz/index.html
          grep -Fq 'name="screen-orientation" content="landscape"' tools/pure-ddz/index.html
          grep -Fq 'MicroMessenger' tools/pure-ddz/index.html
          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          grep -Fq 'IS_WECHAT_WEBVIEW' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "screen.orientation.lock('landscape')" tools/pure-ddz/game/js/visual-v120.js
          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'QilyLeanDDZElderV123' tools/pure-ddz/game/js/qilylean-theme.js
          grep -Fq "const VERSION = '1.2.4'" tools/pure-ddz/game/js/game.js
          grep -Fq "state.settings.difficulty==='expert'?1750+Math.random()*450" tools/pure-ddz/game/js/game.js
          ! grep -Fq 'C919' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'qilylean-aircraft-hero-latest-q98.webp' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "16:{type:'small-joker',title:'小王',image:HOME_AIRCRAFT}" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "17:{type:'big-joker',title:'大王',image:assetUrl('avatar-king.webp')}" tools/pure-ddz/game/js/card-theme.js
          ! grep -Fq 'qily-joker-aircraft' tools/pure-ddz/game/js/card-theme.js
          grep -Fq '#hint-message.hint-message' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'flex-basis:112px' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'flex-basis:104px' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'min-width:0!important' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'width:80vw' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq 'font-size:38px' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq '<span>官网邮箱</span>' tools/pure-ddz/index.html
          ! grep -Fq '<span>企业邮箱</span>' tools/pure-ddz/index.html
          grep -Fq 'qily-rank-suit-line' tools/pure-ddz/game/js/card-theme.js
          grep -Fq '滑动查看更多' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'Android版暂未开放下载' capabilities/index.html
          ! grep -Fq 'Android安装包待网页版验证确认OK后再发布' capabilities/index.html
          ! grep -Fq 'Android 安装包待验证' capabilities/index.html
          ! grep -Fq 'Android安装包待验证' capabilities/index.html
          ! grep -Fq '安装包待验证后发布' capabilities/index.html
          for label in '下载 Android APK' '下载说明' '扫码下载' '分享下载页' '隐私政策' '用户协议' '技术支持'; do
            grep -Fq "$label" capabilities/index.html
          done
          if grep -Fq '/times26001/times26001-showcase.svg' capabilities/index.html; then
            echo 'Broken Times26001 path still present' >&2
            exit 1
          fi
      - name: Commit materialized public pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Capability/DDZ public UI already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capabilities/index.html tools/pure-ddz/index.html
          git commit -m "fix: materialize DDZ elder UX v1.2.7 and public UI [skip ci]"
          git pull --rebase origin main
          git push origin main
