name: Build QilyLean Home v2.3.1 website APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qhome-v231-website-apk-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Upgrade QilyLean Home source to v2.3.1
        shell: bash
        env:
          CONTACT_JAVA_B64: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          main = Path('android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          s = s.replace('QilyLean Home v2.3.0 · Android 16 / API 36商店版',
                        'QilyLean Home v2.3.1 · Android 16 / API 36')
          marker = '        TextView footer = text(\n'
          contact = base64.b64decode(os.environ['CONTACT_JAVA_B64']).decode('utf-8')
          if 'webCard("企业邮箱", "admin@qilylean.com"' not in s:
              if marker not in s:
                  raise SystemExit('Footer insertion marker not found')
              s = s.replace(marker, contact + marker, 1)
          main.write_text(s, encoding='utf-8')

          gradle = Path('android/qilylean-home/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s+\d+', 'versionCode 9', g, count=1)
          g = re.sub(r"versionName\s+'[^']+'", "versionName '2.3.1'", g, count=1)
          gradle.write_text(g, encoding='utf-8')

          for path in ['.github/workflows/build-qilylean-home.yml',
                       '.github/workflows/release-qilylean-home-store.yml']:
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              t = t.replace('v2.3.0', 'v2.3.1').replace("versionCode='8'", "versionCode='9'").replace('versionCode 8', 'versionCode 9')
              p.write_text(t, encoding='utf-8')
          PY
          grep -q 'QilyLean Home v2.3.1' android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java
          grep -q 'admin@qilylean.com' android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java
          grep -q 'https://qilylean.com/' android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java
          grep -q 'versionCode 9' android/qilylean-home/app/build.gradle
          grep -q "versionName '2.3.1'" android/qilylean-home/app/build.gradle

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build installable website APK and compare certificate
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android/qilylean-home :app:assembleDebug --stacktrace
          APK='android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.qilylean.home' versionCode='9' versionName='2.3.1'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs QilyLean_Home_Universal_v2.2.apk > old-cert.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > new-cert.txt
          OLD_SHA=$(grep 'Signer #1 certificate SHA-256 digest:' old-cert.txt | awk '{print $NF}')
          NEW_SHA=$(grep 'Signer #1 certificate SHA-256 digest:' new-cert.txt | awk '{print $NF}')
          mkdir -p dist-website
          cp "$APK" dist-website/QilyLean_Home_Universal_v2.3.1.apk
          cp old-cert.txt new-cert.txt dist-website/
          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo 'upgrade_signature_compatible=true' | tee dist-website/website-build-status.txt
          else
            echo 'upgrade_signature_compatible=false' | tee dist-website/website-build-status.txt
          fi
          sha256sum dist-website/QilyLean_Home_Universal_v2.3.1.apk > dist-website/QilyLean_Home_Universal_v2.3.1.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: QilyLean-Home-v2.3.1-API36-website-installable
          path: dist-website/
          if-no-files-found: error
          retention-days: 30

      - name: Commit source upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f .github/workflows/build-qhome-v231-website-apk-20260807.yml
          git add android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java android/qilylean-home/app/build.gradle .github/workflows/build-qilylean-home.yml .github/workflows/release-qilylean-home-store.yml
          git commit -m 'release: QilyLean Home v2.3.1 with official website and enterprise email'
          git pull --rebase origin main
          git push origin HEAD:main
