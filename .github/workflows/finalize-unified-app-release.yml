name: Finalize Unified App Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-unified-app-release.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      TIMES_APK: Times26001-Android-v1.1.4-IE-Stopwatch.apk
      HOME_APK: QilyLean_Home_Universal_v2.1.apk

    steps:
      - name: Checkout release inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows/finalize-unified-app-release.yml
            .github/workflows/build-qilylean-home.yml
            android/qilylean-home
            assets/tools/qilylean-unified-app-icon.svg
            assets/tools/times26001-overview.svg
            capabilities/index.html
            scripts/publish-qilylean-home-v2.py
            times26001-home-card.js
            tools/times26001/index.html
            Times26001-Android-v1.1.4-IE-Stopwatch.apk
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Times26001 staged package
        shell: bash
        run: |
          set -euo pipefail
          test -s "$TIMES_APK"
          grep -q 'qily_unified_app_icon' <(unzip -l "$TIMES_APK")

      - name: Build QilyLean Home v2.1
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:icon="@drawable/ic_launcher"' android/qilylean-home/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_launcher"' android/qilylean-home/app/src/main/AndroidManifest.xml
          grep -q '#FF10596C' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml
          grep -q '#FF121A16' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml
          grep -q '#FFDC3C31' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml
          gradle -p android/qilylean-home :app:assembleDebug --stacktrace
          cp android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk "$HOME_APK"
          test -s "$HOME_APK"
          aapt dump badging "$HOME_APK" | grep -q "application-icon-.*:'res/drawable/ic_launcher.xml'"

      - name: Calculate release checksums
        shell: bash
        run: |
          set -euo pipefail
          TIMES_SHA256="$(sha256sum "$TIMES_APK" | awk '{print $1}')"
          HOME_SHA256="$(sha256sum "$HOME_APK" | awk '{print $1}')"
          echo "TIMES_SHA256=$TIMES_SHA256" >> "$GITHUB_ENV"
          echo "HOME_SHA256=$HOME_SHA256" >> "$GITHUB_ENV"
          printf '%s  %s\n%s  %s\n' "$TIMES_SHA256" "$TIMES_APK" "$HOME_SHA256" "$HOME_APK" > app-release-sha256.txt

      - name: Update website app icons and downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          times_hash = os.environ['TIMES_SHA256'][:8]
          home_hash = os.environ['HOME_SHA256'][:12]

          for path in [
              Path('times26001-home-card.js'),
              Path('tools/times26001/index.html'),
              Path('capabilities/index.html'),
          ]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('Times26001-Android-v1.1.3-IE-Stopwatch.apk', 'Times26001-Android-v1.1.4-IE-Stopwatch.apk')
              text = text.replace('build=9e5930e', f'build={times_hash}')
              text = text.replace('20260805-android-v113', '20260805-android-v114')
              text = text.replace('v1.1.3', 'v1.1.4')
              path.write_text(text, encoding='utf-8')

          capabilities = Path('capabilities/index.html')
          text = capabilities.read_text(encoding='utf-8')
          text = text.replace(
              '.capability-home-icon svg{display:block;width:100%;height:100%}',
              '.capability-home-icon svg,.capability-home-icon img{display:block;width:100%;height:100%;object-fit:contain}'
          )
          text = re.sub(
              r'<div class="capability-home-icon" aria-hidden="true"><svg.*?</svg></div>',
              '<div class="capability-home-icon" aria-hidden="true"><img src="/assets/tools/qilylean-unified-app-icon.svg?v=20260805-unified-app-icon-v1" alt=""></div>',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('QilyLean_Home_Universal_v2.0.apk', 'QilyLean_Home_Universal_v2.1.apk')
          text = text.replace('build=dc8ba9ddff23', f'build={home_hash}')
          text = text.replace('Android官网全导航通用版 v2.0', 'Android官网全导航通用版 v2.1')
          text = text.replace('Android通用版 v2.0｜', 'Android通用版 v2.1｜')
          text = text.replace('Android通用版 v2.0下载', 'Android通用版 v2.1下载')
          capabilities.write_text(text, encoding='utf-8')

          readme = Path('android/qilylean-home/README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('QilyLean_Home_Universal_v2.0.apk', 'QilyLean_Home_Universal_v2.1.apk')
          readme_text = readme_text.replace('v2.0', 'v2.1')
          readme.write_text(readme_text, encoding='utf-8')

          publisher = Path('scripts/publish-qilylean-home-v2.py')
          if publisher.exists():
              publisher_text = publisher.read_text(encoding='utf-8')
              publisher_text = publisher_text.replace('QilyLean_Home_Universal_v2.0.apk', 'QilyLean_Home_Universal_v2.1.apk')
              publisher_text = publisher_text.replace('v2.0', 'v2.1')
              publisher.write_text(publisher_text, encoding='utf-8')

          checks = {
              'capabilities/index.html': [
                  'Times26001-Android-v1.1.4-IE-Stopwatch.apk',
                  'QilyLean_Home_Universal_v2.1.apk',
                  'qilylean-unified-app-icon.svg',
                  'Android通用版 v2.1',
              ],
              'tools/times26001/index.html': [
                  'Times26001-Android-v1.1.4-IE-Stopwatch.apk',
                  'v1.1.4',
              ],
              'times26001-home-card.js': [
                  'Times26001-Android-v1.1.4-IE-Stopwatch.apk',
                  'v1.1.4',
              ],
          }
          for name, needles in checks.items():
              content = Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f'Missing {needle!r} in {name}')
          PY

      - name: Validate publication package
        shell: bash
        run: |
          set -euo pipefail
          test -s "$TIMES_APK"
          test -s "$HOME_APK"
          test -s assets/tools/qilylean-unified-app-icon.svg
          grep -q 'QilyLean_Home_Universal_v2.1.apk' capabilities/index.html
          grep -q 'Times26001-Android-v1.1.4-IE-Stopwatch.apk' capabilities/index.html
          grep -q 'qilylean-unified-app-icon.svg' capabilities/index.html
          git diff --check

      - name: Commit and push with conflict recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "$HOME_APK" app-release-sha256.txt \
            capabilities/index.html tools/times26001/index.html times26001-home-card.js \
            assets/tools/times26001-overview.svg assets/tools/qilylean-unified-app-icon.svg \
            android/qilylean-home scripts/publish-qilylean-home-v2.py \
            .github/workflows/build-qilylean-home.yml
          git commit -m 'release: publish unified app icons and Android packages'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
