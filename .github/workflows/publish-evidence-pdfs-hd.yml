name: Publish site-hosted evidence files

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-site-hosted-evidence
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.title == 'Publish QilyLean site-hosted evidence assets')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install conversion tools
        run: |
          python3 -m pip install --disable-pip-version-check --quiet img2pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Download temporary high-resolution page archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence/q3 /tmp/evidence/q4 /tmp/evidence/award
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -A 'Mozilla/5.0' -o /tmp/evidence/q3.zip \
            'https://at.adobe.com/rfsDsn2xPOgcVXehXYTTzesUhfdS'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -A 'Mozilla/5.0' -o /tmp/evidence/q4.zip \
            'https://at.adobe.com/tPd3NfT5ArgRHQJMcZhM8WNv0Pj6'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -A 'Mozilla/5.0' -o /tmp/evidence/award.zip \
            'https://at.adobe.com/QB416xRmX7b0Mqb1s16THFysuyIw'
          unzip -q /tmp/evidence/q3.zip -d /tmp/evidence/q3
          unzip -q /tmp/evidence/q4.zip -d /tmp/evidence/q4
          unzip -q /tmp/evidence/award.zip -d /tmp/evidence/award

      - name: Normalize high-resolution page images
        shell: bash
        run: |
          set -euo pipefail
          target='assets/projects/lean-improvement-evidence'
          rm -rf "$target/q3" "$target/q4" "$target/award"
          mkdir -p "$target/q3" "$target/q4" "$target/award"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('/tmp/evidence')
          target = Path('assets/projects/lean-improvement-evidence')
          expected = {'q3': 5, 'q4': 9, 'award': 3}

          def natural_key(path: Path):
              return [int(x) if x.isdigit() else x.lower() for x in re.split(r'(\d+)', str(path))]

          for group, count in expected.items():
              files = sorted(
                  [p for p in (root / group).rglob('*') if p.suffix.lower() in {'.jpg', '.jpeg'}],
                  key=natural_key,
              )
              if len(files) != count:
                  raise SystemExit(f'{group}: expected {count} JPEG pages, found {len(files)}: {files}')
              out = target / group
              for index, source in enumerate(files, 1):
                  shutil.copy2(source, out / f'page-{index:02d}.jpg')
              print(group, [p.name for p in sorted(out.glob('*.jpg'))])
          PY

      - name: Build site-hosted PDF files without image recompression
        shell: bash
        run: |
          set -euo pipefail
          target='assets/projects/lean-improvement-evidence'
          python3 -m img2pdf "$target"/q3/page-*.jpg --output "$target/q3-public-hd.pdf"
          python3 -m img2pdf "$target"/q4/page-*.jpg --output "$target/q4-public-hd.pdf"
          python3 -m img2pdf "$target"/award/page-*.jpg --output "$target/award-public-hd.pdf"
          for pdf in "$target"/*-public-hd.pdf; do
            test "$(head -c 4 "$pdf")" = '%PDF'
            echo "$(basename "$pdf"): $(stat -c%s "$pdf") bytes"
          done

      - name: Commit site-hosted evidence assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add assets/projects/lean-improvement-evidence/q3 \
                  assets/projects/lean-improvement-evidence/q4 \
                  assets/projects/lean-improvement-evidence/award \
                  assets/projects/lean-improvement-evidence/*-public-hd.pdf
          if git diff --cached --quiet; then
            echo 'Site-hosted evidence files are already current.'
            exit 0
          fi
          git commit -m 'chore: publish site-hosted evidence files [skip workflow]'
          git push origin HEAD:main

  add-case-sharing-copy:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'Add project case sharing copy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add public-redaction and projection-review wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('projects/lean-improvement-evidence/index.html'): [
                  (
                      '公开版本仅对企业名称、内部编号、第三方姓名与签名及人物面部进行脱敏，日期、课题、评分、评审结构和已核定财务贡献口径按原材料保留。</div>',
                      '公开版本仅对企业名称、内部编号、第三方姓名与签名及人物面部进行脱敏，日期、课题、评分、评审结构和已核定财务贡献口径按原材料保留。<br><strong>正式洽谈核验：</strong>公开网页仅展示脱敏资料。进入正式洽谈并确认合作意向后，可在签署保密约定或现场会议条件下，通过投屏方式展示与客户需求相匹配的更完整案例资料，包括改善前后基线、实施过程、阶段评审、结案绩效、财务确认口径及相关验收记录；投屏资料仅用于能力核验，不作未授权复制或公开传播。</div>'
                  )
              ],
              Path('capabilities/index.html'): [
                  (
                      '资料仅对企业名称、内部编号、第三方姓名与签名及人物面部进行脱敏；日期、课题、评审结构、评分及已核定财务贡献口径按原材料保留。</div>',
                      '资料仅对企业名称、内部编号、第三方姓名与签名及人物面部进行脱敏；日期、课题、评审结构、评分及已核定财务贡献口径按原材料保留。<br><strong>案例核验方式：</strong>公开端展示脱敏佐证；正式洽谈阶段可依据企业需求，在保密约定下投屏分享匹配案例、改善前后数据、结案绩效及验收材料。涉及客户名称、合同、成本、工艺及内部经营数据的内容，仅限现场核验。</div>'
                  )
              ],
              Path('cooperation/index.html'): [
                  (
                      '<section class="module-section alt" id="evidence"><div class="module-inner"><div class="module-heading"><h2>项目结果证据</h2><p>公开展示经过脱敏的典型量化成果；正式合作时依据企业现状重新建立基线，不照搬结论。</p></div>',
                      '<section class="module-section alt" id="evidence"><div class="module-inner"><div class="module-heading"><h2>项目结果证据</h2><p>公开网页展示经过脱敏的典型量化成果；进入正式洽谈并确认合作意向后，可在签署NDA或双方约定的保密条件下，通过投屏方式展示与企业问题相匹配的案例资料，包括诊断基线、改善方案、实施过程、结案绩效及验收证明。投屏资料用于项目能力核验，不提供未授权拷贝或外传；正式合作仍须依据企业现状重新建立基线，不照搬既有结论。</p></div>'
                  )
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count == 0 and new in text:
                      print(f'{path}: wording already present')
                      continue
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one source match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print(f'updated {path}')
          PY

      - name: Commit case-sharing wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add projects/lean-improvement-evidence/index.html capabilities/index.html cooperation/index.html
          if git diff --cached --quiet; then
            echo 'Case-sharing wording is already current.'
            exit 0
          fi
          git commit -m 'content: clarify redacted evidence and projection review [skip workflow]'
          git push origin HEAD:main
