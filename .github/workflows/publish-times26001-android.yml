name: 刷新 Times26001 Android 安装包

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-times26001-android.yml"

permissions:
  contents: write

jobs:
  publish:
    name: 刷新 Android v1.1.2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-e728-81fb-b708-b2f2d2c99d55/raw?se=2026-07-27T15:23:52Z&sp=r&sv=2026-02-06&sr=b&scid=90311ff1-dcca-430f-a9ed-c00dd4b9a1f7&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T13:58:20Z&ske=2026-07-29T13:58:20Z&sks=b&skv=2026-02-06&sig=uYa%2BTx55uyWHlq0WOr7puy4pfLoKflpiuwlpq0lwBNk%3D"
      ZIP_SHA256: "4ae90531ad607951701bdd3c59105bc6197b878b41ed5d78e7ac932e90b89547"
      APK_SHA256: "aacfd946e7778287959f291100e4a5693d04c9dafe5b3071446d9058a201d1df"
      APK_PATH: "Times26001-Android-v1.1.2-IE-Stopwatch.apk"

    steps:
      - name: 检出主页仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载并校验最终安装包
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error "$ARTIFACT_URL" -o /tmp/times26001-android.zip
          echo "$ZIP_SHA256  /tmp/times26001-android.zip" | sha256sum --check -
          unzip -p /tmp/times26001-android.zip app-debug.apk > "$APK_PATH"
          echo "$APK_SHA256  $APK_PATH" | sha256sum --check -

      - name: 提交最终安装包并清理一次性工作流
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm ".github/workflows/publish-times26001-android.yml"
          git add --all -- "$APK_PATH" ".github/workflows/publish-times26001-android.yml"
          git commit -m "release: refresh Times26001 Android v1.1.2 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
