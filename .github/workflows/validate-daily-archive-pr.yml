name: Validate daily archive publication

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-daily-archive-pr.yml"
      - ".github/workflows/build-daily-archive.yml"
      - ".github/workflows/commercial-quality-closure.yml"
      - "cooperation/index.html"
      - "links/index.html"
      - "site-commercial-quality-closure-v1.css"
      - "site-number-badge-contrast-v1.css"
      - "site-interactive-hover-contrast-v1.css"
      - "qilylean/daily/*.html"
      - "qilylean/assets/daily-*.svg"
      - "qilylean/daily-briefs.css"
      - "qilylean/daily-feedback.js"
      - "qilylean/site-data.json"
      - "qilylean/site-search-index.json"
      - "knowledge/index.html"
      - "knowledge/terminology.html"
      - "knowledge/terminology/*.html"
      - "scripts/build-daily-archive.js"
      - "scripts/daily-engineering-archive.js"
      - "scripts/enhance-daily-archive.js"
      - "scripts/enhance-terminology-training.js"
      - "scripts/audit-daily-terminology.js"
      - "scripts/audit-daily-quality-linkage.js"
      - "scripts/apply-commercial-quality-closure-20260804.js"
      - "scripts/hide-public-pricing.js"
      - "scripts/normalize-daily-quality-label.js"
      - "scripts/enforce-productivity-theme-alias.js"
      - "scripts/publish-equipment-reliability-terminology.js"
      - "scripts/sync-daily-terminology.js"
      - "scripts/bump-daily-css-version.js"
      - "scripts/validate-daily-archive.js"
      - "scripts/remove-daily-directory-consultation.js"
      - "scripts/normalize-daily-visual-closure.js"
      - "scripts/publish-number-badge-contrast.js"
      - "scripts/materialize-static-core-pages.js"
      - "sitemap.xml"
      - "sitemap-core.xml"

permissions:
  contents: read

concurrency:
  group: daily-archive-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /scripts/
            /qilylean/daily/
            /qilylean/assets/daily-*.svg
            /qilylean/daily-insights.html
            /qilylean/daily-briefs.css
            /qilylean/daily-feedback.js
            /qilylean/site-data.json
            /qilylean/site-search-index.json
            /knowledge/
            /cooperation/index.html
            /links/index.html
            /index.html
            /sitemap.xml
            /sitemap-core.xml
            /*.css
            /*.js

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate script syntax
        run: |
          node --check scripts/build-daily-archive.js
          node --check scripts/enhance-daily-archive.js
          node --check scripts/enhance-terminology-training.js
          node --check scripts/audit-daily-terminology.js
          node --check scripts/audit-daily-quality-linkage.js
          node --check scripts/apply-commercial-quality-closure-20260804.js
          node --check scripts/hide-public-pricing.js
          node --check scripts/normalize-daily-quality-label.js
          node --check scripts/enforce-productivity-theme-alias.js
          node --check scripts/publish-equipment-reliability-terminology.js
          node --check scripts/sync-daily-terminology.js
          node --check scripts/bump-daily-css-version.js
          node --check scripts/validate-daily-archive.js
          node --check scripts/remove-daily-directory-consultation.js
          node --check scripts/normalize-daily-visual-closure.js
          node --check scripts/publish-number-badge-contrast.js

      - name: Build publication candidate
        run: |
          node scripts/apply-commercial-quality-closure-20260804.js
          node scripts/hide-public-pricing.js
          node scripts/enforce-productivity-theme-alias.js
          node scripts/normalize-daily-quality-label.js
          node scripts/build-daily-archive.js
          node scripts/publish-equipment-reliability-terminology.js
          node scripts/enhance-daily-archive.js
          node scripts/enhance-terminology-training.js
          node scripts/normalize-daily-quality-label.js
          node scripts/audit-daily-terminology.js
          node scripts/sync-daily-terminology.js
          node scripts/sync-daily-terminology.js --check
          node scripts/bump-daily-css-version.js
          node scripts/apply-commercial-quality-closure-20260804.js
          node scripts/hide-public-pricing.js
          node scripts/enforce-productivity-theme-alias.js
          node scripts/normalize-daily-quality-label.js

      - name: Unify Daily Engineering Brief brand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('qilylean/daily-insights.html'), *Path('qilylean/daily').glob('*.html')]
          for file in files:
              text = file.read_text(encoding='utf-8')
              file.write_text(text.replace('>制造改善知识分享<', '>QilyLean｜启力精益<'), encoding='utf-8')
          PY

      - name: Validate generated engineering archive
        run: node scripts/validate-daily-archive.js

      - name: Finalize current message and visual closure
        run: |
          node scripts/remove-daily-directory-consultation.js
          node scripts/normalize-daily-visual-closure.js
          node scripts/publish-number-badge-contrast.js
          node scripts/audit-daily-quality-linkage.js

      - name: Validate latest brief and publication contracts
        shell: bash
        run: |
          LATEST_DATE="$(node -e "const data=require('./qilylean/daily/index.json'); process.stdout.write(data[0].date)")"
          SOURCE_LATEST="$(node - <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('qilylean/daily').filter(x=>/^\d{4}-\d{2}-\d{2}\.html$/.test(x)).sort().reverse();
          process.stdout.write(files[0].slice(0,10));
          NODE
          )"
          TOTAL="$(node -e "const data=require('./qilylean/daily/index.json'); process.stdout.write(String(data.length))")"
          test "$LATEST_DATE" = "$SOURCE_LATEST"
          test "$LATEST_DATE" = "2026-08-05"
          test "$TOTAL" -ge "2584"
          grep -q '设备停机不是维修单' "qilylean/daily/$LATEST_DATE.html"
          grep -q '2026-08-05｜ME工程' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'data-brief-message-form' "qilylean/daily/$LATEST_DATE.html"
          grep -q '留言交流' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'MTBF' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'MTTR' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'OEE' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'TPM' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'href="/knowledge/terminology/mtbf.html"' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'href="/knowledge/terminology/mttr.html"' "qilylean/daily/$LATEST_DATE.html"
          grep -q "data-latest-brief-date=\"$LATEST_DATE\"" knowledge/index.html
          grep -q "qilylean/daily/$LATEST_DATE.html" sitemap.xml
          grep -q "$LATEST_DATE" qilylean/daily-insights.html
          grep -q 'site-number-badge-contrast-v1.css?v=20260805-number-badge-contrast-v1' "qilylean/daily/$LATEST_DATE.html"
          grep -q 'site-interactive-hover-contrast-v1.css?v=20260805-interactive-hover-contrast-v1' "qilylean/daily/$LATEST_DATE.html"

          grep -q '<div class="term-code">MTBF</div>' knowledge/terminology.html
          grep -q '<div class="term-code">MTTR</div>' knowledge/terminology.html
          grep -q '词典：183项中文诠释' knowledge/terminology.html
          grep -q '<h1>MTBF｜平均故障间隔时间</h1>' knowledge/terminology/mtbf.html
          grep -q '<h1>MTTR｜平均修复时间</h1>' knowledge/terminology/mttr.html
          grep -q 'knowledge/terminology/mtbf.html' qilylean/site-search-index.json
          grep -q 'knowledge/terminology/mttr.html' qilylean/site-search-index.json
          grep -q 'knowledge/terminology/mtbf.html' sitemap.xml
          grep -q 'knowledge/terminology/mttr.html' sitemap.xml
          node - <<'NODE'
          const data=require('./qilylean/site-data.json');
          if (data.terminology.total !== 183) throw new Error('Terminology total is not 183');
          if (data.search.terminologyTotal !== 183) throw new Error('Search terminology total is not 183');
          NODE

          grep -q 'data-quality-throughline="2026-08-04"' qilylean/daily/2026-08-04.html
          grep -q '质量门槛｜科学改进生产力' qilylean/daily/2026-08-04.html

          grep -q 'QILY-PRICING-PUBLIC-DISABLED' cooperation/index.html
          grep -q '<h2>合作启动路径</h2>' cooperation/index.html
          grep -q '质量不是PQCD中的一个并列数字' cooperation/index.html
          grep -q 'qilyCommercialQualityClosureStylesheet' links/index.html
          if grep -q '¥\|公开价格参考与报价依据\|公开报价不包含\|<div class="price">' cooperation/index.html; then
            echo "Public pricing remains on the cooperation page"
            exit 1
          fi
          if grep -q '\bGATE\b' "qilylean/daily/$LATEST_DATE.html"; then
            echo "Unexplained GATE label remains"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('qilylean/daily/terminology-audit-latest.json','utf8'));
          if (report.status !== 'passed') throw new Error('Terminology audit failed');
          if ((report.unknownTerms || []).length) throw new Error(`Unknown terms: ${report.unknownTerms.join(', ')}`);
          NODE

      - name: Verify deterministic diff
        shell: bash
        run: |
          git diff --check
          git status --short
