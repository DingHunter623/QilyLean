name: Fast publish 2026-08-06 management brief

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-2026-08-06-management-brief-api.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-publish-2026-08-06-management-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: DingHunter623/QilyLean
    steps:
      - name: Download publication source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qily-aug6
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/EcY4fpbmTgcpwChH" -o "/tmp/qily-aug6/2026-08-06.html"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/Z2MFczU2eF2Mzwhw" -o "/tmp/qily-aug6/daily-2026-08-06-01.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/JPlTehf6pFv7yUoU" -o "/tmp/qily-aug6/daily-2026-08-06-02.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/Kz7pSW492Kx8ovoO" -o "/tmp/qily-aug6/daily-2026-08-06-03.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/lEJ8GgDGv7ZRvXnT" -o "/tmp/qily-aug6/daily-2026-08-06-04.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/XJ9W4s5sGMhwMgiu" -o "/tmp/qily-aug6/daily-2026-08-06-05.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/f6ixhV2Q8SrxBU3F" -o "/tmp/qily-aug6/daily-2026-08-06-06.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/4HQ5A3CZjUVqKvy7" -o "/tmp/qily-aug6/daily-2026-08-06-07.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/WunizAwseu1fRxob" -o "/tmp/qily-aug6/daily-2026-08-06-08.webp"
          curl -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" "https://at.adobe.com/OfHVcBTuNdJoaB9H" -o "/tmp/qily-aug6/daily-2026-08-06-09.webp"
          grep -q '管理六大用人之道' /tmp/qily-aug6/2026-08-06.html
          grep -q 'data-brief-message-form' /tmp/qily-aug6/2026-08-06.html
          for image in /tmp/qily-aug6/*.webp; do
            test -s "$image"
            file "$image" | grep -qi 'Web/P image'
          done

      - name: Commit page and images through Git data API
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/qily-aug6
          entries=$(mktemp)
          echo '[]' > "$entries"

          add_blob() {
            local local_file="$1" repo_path="$2" content sha next
            content=$(base64 -w0 "$local_file")
            sha=$(jq -n --arg content "$content" '{content:$content,encoding:"base64"}' \
              | gh api --method POST "repos/$REPO/git/blobs" --input - --jq '.sha')
            next=$(mktemp)
            jq --arg path "$repo_path" --arg sha "$sha" \
              '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' "$entries" > "$next"
            mv "$next" "$entries"
          }

          add_blob "$work/2026-08-06.html" "qilylean/daily/2026-08-06.html"
          for n in $(seq -w 1 9); do
            add_blob "$work/daily-2026-08-06-${n}.webp" "qilylean/assets/daily-2026-08-06-${n}.webp"
          done

          next=$(mktemp)
          jq '. + [
            {path:".github/workflows/publish-2026-08-06-management-brief.yml",mode:"100644",type:"blob",sha:null},
            {path:".github/workflows/publish-2026-08-06-management-brief-api.yml",mode:"100644",type:"blob",sha:null}
          ]' "$entries" > "$next"
          mv "$next" "$entries"

          published=''
          for attempt in 1 2 3; do
            parent=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
            base_tree=$(gh api "repos/$REPO/git/commits/$parent" --jq '.tree.sha')
            tree_sha=$(jq -n --arg base_tree "$base_tree" --slurpfile tree "$entries" \
              '{base_tree:$base_tree,tree:$tree[0]}' \
              | gh api --method POST "repos/$REPO/git/trees" --input - --jq '.sha')
            commit_sha=$(jq -n \
              --arg message "feat: publish Aug 6 management and people-development brief" \
              --arg tree "$tree_sha" --arg parent "$parent" \
              '{message:$message,tree:$tree,parents:[$parent]}' \
              | gh api --method POST "repos/$REPO/git/commits" --input - --jq '.sha')
            if jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' \
              | gh api --method PATCH "repos/$REPO/git/refs/heads/main" --input - >/dev/null 2>&1; then
              published="$commit_sha"
              break
            fi
            sleep 3
          done
          test -n "$published"
          echo "Published commit: $published"
