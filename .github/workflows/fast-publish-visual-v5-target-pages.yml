name: Fast publish visual V5 target pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-publish-visual-v5-target-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch target pages through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const files=['knowledge/index.html','projects/factory-layout/index.html'];
            const oldV='/site-visual-readability-v4.css?v=20260813-visual-readability-v4';
            const newV='/site-visual-readability-v4.css?v=20260813-visual-readability-v5-compact-contact-factory';
            for (const path of files) {
              const {data}=await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              const source=Buffer.from(data.content,'base64').toString('utf8');
              const next=source.split(oldV).join(newV);
              if(next===source){core.info(`${path}: already V5 or no old token`);continue;}
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path,branch:'main',sha:data.sha,
                message:`fix: fast cache-bust visual V5 for ${path} [skip ci]`,
                content:Buffer.from(next,'utf8').toString('base64')
              });
              core.info(`${path}: V5 cache-bust published`);
            }
