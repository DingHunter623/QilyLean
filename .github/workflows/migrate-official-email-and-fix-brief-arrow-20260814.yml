name: Migrate 官网邮箱 naming and fix brief arrow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-official-email-and-fix-brief-arrow-20260814.py'
      - '.github/workflows/migrate-official-email-and-fix-brief-arrow-20260814.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-official-email-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: Apply, validate and publish from latest main with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          for attempt in 1 2 3 4; do
            echo "migration attempt=$attempt"
            git fetch origin main
            git reset --hard origin/main
            python scripts/migrate-official-email-and-fix-brief-arrow-20260814.py
            git add -A
            if git diff --cached --quiet; then
              echo 'Migration already fully present on latest main.'
              exit 0
            fi
            git commit -m 'fix: unify 官网邮箱 naming and correct brief arrow'
            if git push origin HEAD:main; then
              echo 'Migration published successfully.'
              exit 0
            fi
            echo 'Concurrent write detected; retrying from newest main.'
            sleep 3
          done
          echo 'Unable to publish migration after retries.' >&2
          exit 1
