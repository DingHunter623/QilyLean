name: Normalize role-boundary copy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/normalize-role-boundary-copy.yml"
      - "scripts/normalize-role-boundary-copy.js"
      - "projects/index.html"
      - "projects/mold-warehouse/index.html"
      - "moments/work/index.html"
      - "knowledge/index.html"
      - "qilylean/production-operations-organization.html"
      - "qilylean/public-copy-polish.js"
      - "cloudflare-worker/worker.js"
      - "improvements/index.html"
      - "improvements/vsm/index.html"
      - "improvements/visual/index.html"
      - "qilylean/lean-knowledge.html"
      - "qilylean/terminology-v2.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-role-boundary-copy.yml"
      - "scripts/normalize-role-boundary-copy.js"
      - "projects/index.html"
      - "projects/mold-warehouse/index.html"
      - "moments/work/index.html"
      - "knowledge/index.html"
      - "qilylean/production-operations-organization.html"
      - "qilylean/public-copy-polish.js"
      - "cloudflare-worker/worker.js"
      - "improvements/index.html"
      - "improvements/vsm/index.html"
      - "improvements/visual/index.html"
      - "qilylean/lean-knowledge.html"
      - "qilylean/terminology-v2.js"
  workflow_run:
    workflows: ["Build daily engineering brief archive"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-role-boundary-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize and validate responsibility boundaries
        run: |
          node --check scripts/normalize-role-boundary-copy.js
          node scripts/normalize-role-boundary-copy.js
          node scripts/normalize-role-boundary-copy.js --check
          git diff --check
      - name: Verify external implementation and personal role wording
        shell: bash
        run: |
          grep -F '由供应商完成施工安装与系统联调' projects/index.html
          grep -F '本人主导方案设计、供应商技术对接、跨方协调与验收推进' projects/index.html
          grep -F '供应商按分级库位方案完成货架安装' projects/mold-warehouse/index.html
          grep -F '本人主导技术方案、供应商对接、跨方协调与验收推进' projects/mold-warehouse/index.html
          grep -F '外协设计衔接、实施协调与后续验收' moments/work/index.html
          grep -F '12周实施推进路线' knowledge/index.html
          grep -F '12周组织实施推进路线' qilylean/production-operations-organization.html
          grep -F '可执行、可验证、可复用的制造改善方法' qilylean/public-copy-polish.js
          grep -F '工程化、可执行且可验证的分析' cloudflare-worker/worker.js
          grep -F 'VSM价值流分析的实施与验证方法' improvements/vsm/index.html
          grep -F '四、应用场景' improvements/visual/index.html
          grep -F '可执行动作' qilylean/lean-knowledge.html
          ! grep -R -n -E '保证落地|承诺落地|独立落地|全过程落地|端到端落地|一站式落地|施工落地|货架落地|后续落地|深化与落地|可落地的制造改善方法|可落地的分析|12周(组织)?落地路线|可落地动作' \
            projects/index.html projects/mold-warehouse/index.html moments/work/index.html knowledge/index.html \
            qilylean/production-operations-organization.html qilylean/public-copy-polish.js cloudflare-worker/worker.js \
            improvements/index.html improvements/vsm/index.html improvements/visual/index.html qilylean/lean-knowledge.html

  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh main and normalize public wording
        shell: bash
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main
          node --check scripts/normalize-role-boundary-copy.js
          node scripts/normalize-role-boundary-copy.js
          node scripts/normalize-role-boundary-copy.js --check
          git diff --check
      - name: Commit normalized public sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Role-boundary wording is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/index.html projects/mold-warehouse/index.html moments/work/index.html knowledge/index.html \
            qilylean/production-operations-organization.html qilylean/public-copy-polish.js cloudflare-worker/worker.js \
            improvements/index.html improvements/vsm/index.html improvements/visual/index.html \
            qilylean/lean-knowledge.html qilylean/terminology-v2.js
          git commit -m "build: clarify solution leadership and external implementation [skip ci]"
          git push origin HEAD:main
