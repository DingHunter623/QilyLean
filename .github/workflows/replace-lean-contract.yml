name: Replace lean improvement contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-lean-contract.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download uploaded PDF and publish preview source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            --output /tmp/lean-improvement-contract.pdf \
            'https://at.adobe.com/Jjr2LqbedN5VeFzs'
          test "$(head -c 4 /tmp/lean-improvement-contract.pdf)" = '%PDF'
          echo 'a7785765d8db058000cc6569abc1359c678af39203946b5cc894747ef1bcd76c  /tmp/lean-improvement-contract.pdf' | sha256sum --check --status
          base64 -w 0 /tmp/lean-improvement-contract.pdf > qilylean/private/lean-improvement-delivery-contract.pdf.b64
          test -s qilylean/private/lean-improvement-delivery-contract.pdf.b64

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qilylean/private/lean-improvement-delivery-contract.pdf.b64
          git rm .github/workflows/replace-lean-contract.yml
          git commit -m 'feat: replace lean contract with 17-page uploaded PDF [skip ci]'
          git push
