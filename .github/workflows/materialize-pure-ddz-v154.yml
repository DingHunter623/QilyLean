name: Materialize Pure DDZ V155

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-pure-ddz-v154.yml'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'tools/pure-ddz/game/js/card-theme.js'
      - 'tools/pure-ddz/game/js/ai-expert.js'
      - 'tools/pure-ddz/game/js/game.js'
      - 'tools/pure-ddz/game/js/visual-v120.js'
      - 'tools/pure-ddz/game/js/ios-virtual-landscape-v154.js'
      - 'tools/pure-ddz/game/js/fast-site-shell-v155.js'
      - 'tools/pure-ddz/game/css/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-pure-ddz-v155-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Materialize and validate DDZ V155 fast route
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-ddz-public-ui-20260824.js
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/ai-expert.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          node --check tools/pure-ddz/game/js/fast-site-shell-v155.js
          node scripts/materialize-ddz-public-ui-20260824.js
          node --check tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '20260903-ddz-fast-knowledge-v155' tools/pure-ddz/index.html
          grep -Fq "loadStyle('css/ddz-core-v155.css')" tools/pure-ddz/index.html
          grep -Fq "const chain=['js/ddz-core-v155.js'];" tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-fast-shell="v155"' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-virtual-landscape="v154"' tools/pure-ddz/index.html
          grep -Fq '/site-dock-share-runtime-v1.js?' tools/pure-ddz/index.html
          ! grep -Fq '/site-navigation.js?' tools/pure-ddz/index.html
          ! grep -Fq '/site-translation-safe-runtime-v1.js?' tools/pure-ddz/index.html
          grep -Fq 'IE 7 Tools' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '5M2E' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'Smart Factory' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'card-knowledge-v155.css' tools/pure-ddz/game/css/ddz-core-v155.css
          git diff --check
      - name: Publish materialized DDZ V155 entry and bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/pure-ddz/index.html tools/pure-ddz/game/css/ddz-core-v155.css tools/pure-ddz/game/js/ddz-core-v155.js; then
            echo 'Pure DDZ V155 entry and bundles already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pure-ddz/index.html tools/pure-ddz/game/css/ddz-core-v155.css tools/pure-ddz/game/js/ddz-core-v155.js
          git commit -m 'perf(ddz): materialize V155 fast route and knowledge bundles [skip ci]'
          git pull --rebase origin main
          git push origin main
