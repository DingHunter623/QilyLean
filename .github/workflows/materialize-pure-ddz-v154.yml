name: Materialize Pure DDZ V161

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-pure-ddz-v154.yml'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'scripts/materialize-pure-ddz-home-entry-v158.js'
      - 'times26001-home-card.js'
      - 'tools/pure-ddz/game/js/card-theme.js'
      - 'tools/pure-ddz/game/js/ai-expert.js'
      - 'tools/pure-ddz/game/js/game.js'
      - 'tools/pure-ddz/game/js/visual-v120.js'
      - 'tools/pure-ddz/game/js/ios-virtual-landscape-v154.js'
      - 'tools/pure-ddz/game/js/fast-site-shell-v155.js'
      - 'tools/pure-ddz/game/css/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-pure-ddz-v161-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Materialize and validate DDZ V161 fast route
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-ddz-public-ui-20260824.js
          node --check scripts/materialize-pure-ddz-home-entry-v158.js
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/ai-expert.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          node --check tools/pure-ddz/game/js/fast-site-shell-v155.js
          node scripts/materialize-ddz-public-ui-20260824.js
          node scripts/materialize-pure-ddz-home-entry-v158.js
          node --check tools/pure-ddz/game/js/ddz-core-v155.js
          node --check times26001-home-card.js
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-core="v158"' tools/pure-ddz/index.html
          grep -Fq './game/css/ddz-core-v155.css?v=20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161' tools/pure-ddz/index.html
          grep -Fq 'window.__PURE_DDZ_STYLE_READY__=Promise.resolve();' tools/pure-ddz/index.html
          ! grep -Fq "loadStyle('css/ddz-core-v155.css')" tools/pure-ddz/index.html
          grep -Fq "const chain=['js/ddz-core-v155.js'];" tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-fast-shell="v155"' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-virtual-landscape="v154"' tools/pure-ddz/index.html
          grep -Fq '/site-dock-share-runtime-v1.js?' tools/pure-ddz/index.html
          ! grep -Fq '/site-navigation.js?' tools/pure-ddz/index.html
          ! grep -Fq '/site-translation-safe-runtime-v1.js?' tools/pure-ddz/index.html
          ! grep -Fq 'class="clean-promise"' tools/pure-ddz/index.html
          grep -Fq 'IE 7 Tools' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '5M2E' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'Smart Factory' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'visual-tuning-v158.css' tools/pure-ddz/game/css/ddz-core-v155.css
          grep -Fq 'QilyLean Pure DDZ V161' tools/pure-ddz/game/css/ddz-core-v155.css
          grep -Fq 'min-height:38px!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'min-height:40px!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '.clean-promise{display:none!important}' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'height:clamp(714px,calc(100vh - 112px),768px)!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'width:82px!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'background:#0f4b5a!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '.controls .control-btn:not(:disabled):focus-visible' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '.controls .control-btn:not(:disabled):active' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '.controls .control-btn:disabled' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'opacity:.58!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'prefers-reduced-motion:reduce' tools/pure-ddz/game/css/visual-tuning-v158.css
          ! grep -Fq 'visual-tuning-v157.css' tools/pure-ddz/game/css/ddz-core-v155.css
          grep -Fq 'function primePureDdzV158(){' times26001-home-card.js
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161' times26001-home-card.js
          grep -Fq 'data-qily-ddz-prefetch' times26001-home-card.js
          ! grep -Fq 'Pure-DDZ-Classic-v1.0.2.apk' times26001-home-card.js
          git diff --check
      - name: Publish materialized DDZ V161 entry and bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/pure-ddz/index.html tools/pure-ddz/game/css/ddz-core-v155.css tools/pure-ddz/game/js/ddz-core-v155.js times26001-home-card.js; then
            echo 'Pure DDZ V161 entry and bundles already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pure-ddz/index.html tools/pure-ddz/game/css/ddz-core-v155.css tools/pure-ddz/game/js/ddz-core-v155.js times26001-home-card.js
          git commit -m 'perf(ddz): materialize V161 nav feedback and table depth [skip ci]'
          git pull --rebase origin main
          git push origin main