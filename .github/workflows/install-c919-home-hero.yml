name: Install C919 homepage strategy hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-c919-home-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-install-c919-home-hero
  cancel-in-progress: false

env:
  C919_SOURCE_URL: 'https://at.adobe.com/C4SbtF8JyrhzGUhh'

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download approved C919 strategy image
        shell: bash
        run: |
          mkdir -p qilylean
          curl -L --fail --retry 3 --retry-delay 2 -o qilylean/c919-strategy-hero.png "$C919_SOURCE_URL"
          test -s qilylean/c919-strategy-hero.png
          file qilylean/c919-strategy-hero.png | grep -qi 'PNG image data'
          test "$(wc -c < qilylean/c919-strategy-hero.png)" -gt 100000

      - name: Materialize static homepage and validate
        shell: bash
        run: |
          node --check scripts/enforce-c919-home-hero.js
          node --check scripts/site-regression-guard-c919-hero.js
          node scripts/enforce-six-core-static-source.js
          node scripts/enforce-c919-home-hero.js
          node scripts/enforce-six-core-navigation.js
          python3 scripts/normalize-six-capability-pricing-20260809.py
          node scripts/site-regression-guard-six-core.js
          node scripts/site-regression-guard-c919-hero.js
          node scripts/site-friend-links-layout-guard.js
          git diff --check

      - name: Publish and remove one-time installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git rm -f .github/workflows/install-c919-home-hero.yml 2>/dev/null || true
            git add index.html qilylean/c919-strategy-hero.png scripts .github/workflows docs cooperation site-navigation-core.js site-navigation-legacy-20260802.js site-ui-consistency-v1.js 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "C919 homepage strategy hero already published."
              exit 0
            fi

            git commit -m "首页头号位：发布C919战略蓝图与灵魂概述 [skip ci]"
            if git push origin HEAD:main; then
              echo "C919 homepage strategy hero published."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish C919 homepage after 3 attempts."
              exit 1
            fi

            echo "main changed concurrently; restart installation from latest remote."
            git fetch origin main --depth=1
            git reset --hard origin/main
            mkdir -p qilylean
            curl -L --fail --retry 3 --retry-delay 2 -o qilylean/c919-strategy-hero.png "$C919_SOURCE_URL"
            file qilylean/c919-strategy-hero.png | grep -qi 'PNG image data'
            node scripts/enforce-six-core-static-source.js
            node scripts/enforce-c919-home-hero.js
            node scripts/enforce-six-core-navigation.js
            python3 scripts/normalize-six-capability-pricing-20260809.py
            node scripts/site-regression-guard-six-core.js
            node scripts/site-regression-guard-c919-hero.js
            node scripts/site-friend-links-layout-guard.js
            git diff --check
          done
