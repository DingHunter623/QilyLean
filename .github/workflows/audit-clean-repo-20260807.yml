name: Apply QilyLean repository cleanup 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-clean-repo-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-clean-repo-20260807
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply conservative unreferenced-asset cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-unreferenced-assets.js
          node scripts/audit-unreferenced-assets.js --apply
          node - <<'NODE'
          const r=require('./maintenance/unreferenced-assets-report.json');
          if(r.safetyStop) throw new Error('Cleanup safety stop was triggered');
          if(!r.deletedAssets) throw new Error('Expected obsolete/unreferenced assets were not deleted');
          console.log(`CLEANUP_APPLIED deleted=${r.deletedAssets} bytes=${r.deletedBytes}`);
          for (const x of r.deletable) console.log(`DELETE ${x.bytes} ${x.path}`);
          NODE

      - name: Remove superseded August 7 SVG artwork
        shell: bash
        run: |
          set -euo pipefail
          files=(
            qilylean/assets/daily-2026-08-07.svg
            qilylean/assets/daily-2026-08-07-01.svg
            qilylean/assets/daily-2026-08-07-02.svg
            qilylean/assets/daily-2026-08-07-03.svg
            qilylean/assets/daily-2026-08-07-04.svg
            qilylean/assets/daily-2026-08-07-05.svg
          )
          for f in "${files[@]}"; do
            if [ -e "$f" ]; then
              base="$(basename "$f")"
              refs="$(git grep -l -F "$base" -- ':!qilylean/assets/*' ':!.github/workflows/audit-clean-repo-20260807.yml' || true)"
              if [ -n "$refs" ]; then
                echo "Refusing to delete referenced superseded asset $f; references: $refs" >&2
                exit 1
              fi
              bytes="$(stat -c%s "$f")"
              rm -f "$f"
              echo "DELETE_SUPERSEDED $bytes $f"
            fi
          done

      - name: Stage deletions and verify no unreferenced assets remain
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          node scripts/audit-unreferenced-assets.js
          node - <<'NODE'
          const r=require('./maintenance/unreferenced-assets-report.json');
          console.log(`POST_CLEANUP assets=${r.assetFiles} retained=${r.retainedAssets} remainingUnreferenced=${r.unreferencedAssets}`);
          if(r.unreferencedAssets!==0) {
            for (const x of r.deletable) console.log(`REMAINS ${x.bytes} ${x.path}`);
            throw new Error('Unreferenced assets remain after cleanup');
          }
          NODE

      - name: Validate critical site sources and August 7 publication
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s site-navigation-core.js
          test -s site-shell.css
          test -s knowledge/terminology.html
          test -s scripts/audit-unreferenced-assets.js
          test -d projects/lean-improvement-evidence
          for f in tiger eagle wolf leopard dog; do test -s "qilylean/assets/2026-08-07-$f.png"; done
          grep -q '/qilylean/assets/2026-08-07-tiger.png' qilylean/daily/2026-08-07.html
          grep -q '/qilylean/assets/2026-08-07-eagle.png' qilylean/daily/2026-08-07.html
          grep -q '/qilylean/assets/2026-08-07-wolf.png' qilylean/daily/2026-08-07.html
          grep -q '/qilylean/assets/2026-08-07-leopard.png' qilylean/daily/2026-08-07.html
          grep -q '/qilylean/assets/2026-08-07-dog.png' qilylean/daily/2026-08-07.html
          ! grep -q 'daily-2026-08-07-0[1-5]\.svg' qilylean/daily/2026-08-07.html
          node --check site-navigation-core.js
          node --check site-navigation.js
          node --check site-core-service-dock-closure-v1.js
          grep -q 'admin@qilylean.com' knowledge/terminology.html

      - name: Commit cleanup and remove one-time runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm .github/workflows/audit-clean-repo-20260807.yml
          git add -u
          if git diff --cached --quiet; then
            echo 'No obsolete assets require deletion.'
            exit 0
          fi
          git commit -m '仓库瘦身：清理无引用附件与已替代旧素材'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1