name: Audit public PDF contact 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-public-pdf-contact-20260807.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-public-pdf-contact-20260807
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF engine
        run: python -m pip install --disable-pip-version-check --quiet pymupdf
      - name: Audit every tracked PDF
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, fitz
          from pathlib import Path

          old='396767769@qq.com'
          admin='admin@qilylean.com'
          raw=subprocess.check_output(['git','ls-files','-z','*.pdf'])
          pdfs=[Path(x.decode()) for x in raw.split(b'\0') if x]
          print(f'PDF_AUDIT_TOTAL {len(pdfs)}')
          old_files=[]; missing_final=[]; unreadable=[]
          for p in pdfs:
              try:
                  doc=fitz.open(p)
                  old_pages=[]
                  for i,page in enumerate(doc):
                      txt=page.get_text('text') or ''
                      if old in txt or ('396767769' in txt and 'qq.com' in txt):
                          old_pages.append(i+1)
                  final=(doc[-1].get_text('text') or '') if len(doc) else ''
                  has_admin=admin.lower() in final.lower()
                  if old_pages: old_files.append((str(p),old_pages))
                  if not has_admin: missing_final.append(str(p))
                  print(f'PDF {p} pages={len(doc)} old_pages={old_pages or "-"} final_admin={has_admin}')
              except Exception as e:
                  unreadable.append((str(p),repr(e)))
                  print(f'PDF_ERROR {p} {e!r}')
          print(f'OLD_EMAIL_FILES {len(old_files)}')
          for p,pages in old_files: print(f'OLD_EMAIL {p} pages={pages}')
          print(f'MISSING_FINAL_ADMIN {len(missing_final)}')
          for p in missing_final: print(f'MISSING_ADMIN {p}')
          print(f'UNREADABLE {len(unreadable)}')
          for p,e in unreadable: print(f'UNREADABLE_PDF {p} {e}')
          PY
