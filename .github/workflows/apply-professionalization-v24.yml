name: Apply QilyLean professionalization V24/V25/V26/V27

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-professionalization-v24.yml"
      - ".github/workflows/build-daily-archive.yml"
      - "homepage-music-v5.js"
      - "scripts/publish-primary-contrast-music-continuity.js"
      - "scripts/apply-professionalization-v24.js"
      - "scripts/materialize-professionalization-v24.js"
      - "scripts/apply-footer-one-line-v25.js"
      - "scripts/apply-footer-standard-v26.js"
      - "scripts/materialize-footer-standard-v26.js"
      - "site-layout-typography-closure-v20.css"
      - "site-footer-standard-v26.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-professionalization-v24-main
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate V24/V25/V26/V27 scripts
        run: |
          node --check scripts/apply-professionalization-v24.js
          node --check scripts/materialize-professionalization-v24.js
          node --check scripts/apply-footer-one-line-v25.js
          node --check scripts/apply-footer-standard-v26.js
          node --check scripts/materialize-footer-standard-v26.js
          node --check site-footer-standard-v26.js
          node --check homepage-music-v5.js
          node --check scripts/publish-primary-contrast-music-continuity.js

      - name: Integrate V24 into publication sources
        run: node scripts/apply-professionalization-v24.js

      - name: Apply V25 single-line footer closure
        run: node scripts/apply-footer-one-line-v25.js

      - name: Integrate V26 footer standard into publication sources
        run: node scripts/apply-footer-standard-v26.js

      - name: Materialize V24 across current public HTML
        run: node scripts/materialize-professionalization-v24.js --all

      - name: Materialize V26 footer runtime across every HTML page
        run: node scripts/materialize-footer-standard-v26.js

      - name: Materialize V27 sitewide gesture music
        run: node scripts/publish-primary-contrast-music-continuity.js

      - name: Validate deterministic V24/V25/V26/V27 state
        run: |
          node scripts/apply-professionalization-v24.js --check
          node scripts/apply-footer-one-line-v25.js --check
          node scripts/apply-footer-standard-v26.js --check
          node scripts/materialize-professionalization-v24.js --all --check
          node scripts/materialize-footer-standard-v26.js --check
          node scripts/publish-primary-contrast-music-continuity.js
          node --check scripts/build-daily-archive.js
          node --check scripts/build-site-metadata.js
          git diff --check

      - name: Commit V24/V25/V26/V27 full-site closure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "V24/V25/V26/V27 full-site closure is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V27: publish sitewide gesture music and home-only control"
          git push origin HEAD:main
