name: Fix Cooperation Axis Current Text R10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-cooperation-axis-current-text-r10.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Confirm VI and patch only 05 text
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'body:has(header a[href="/cooperation/"][aria-current="page"]) .qily-system-axis__step[href="/cooperation/"]' site-visual-governance-v2.css
          grep -Fq 'color:#fff!important;-webkit-text-fill-color:#fff!important;background:var(--qily-axis-green)!important;border:2px solid var(--qily-axis-gold)!important' site-visual-governance-v2.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          cp=Path('site-commercial-quality-closure-v1.css'); hp=Path('cooperation/index.html')
          css=cp.read_text(encoding='utf-8'); html=hp.read_text(encoding='utf-8')
          marker='QILY-R10-COOPERATION-AXIS-CURRENT-TEXT-WHITE'
          block='''\n\n/* QILY-R10-COOPERATION-AXIS-CURRENT-TEXT-WHITE | 2026-09-04\n * VI contract: current operating-axis card = deep teal + gold border + white text.\n * Scope: text only; no background/border/layout changes.\n */\nhtml:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"],\nhtml:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"]:visited,\nhtml:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"] > strong,\nhtml:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"] > span,\nhtml:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"]:visited > strong,\nhtml:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"]:visited > span{\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n  opacity:1!important;\n  text-shadow:none!important;\n}\n'''
          if marker in css:
              css=re.sub(r'\n/\* QILY-R10-COOPERATION-AXIS-CURRENT-TEXT-WHITE[\s\S]*?\n}\s*$',block.rstrip()+"\n",css,count=1)
          else:
              css=css.rstrip()+block
          version='20260904-cooperation-axis-current-white-r10'
          html,n=re.subn(r'/site-commercial-quality-closure-v1\.css\?v=[^"\']+',f'/site-commercial-quality-closure-v1.css?v={version}',html,count=1)
          assert n==1,n
          cp.write_text(css,encoding='utf-8'); hp.write_text(html,encoding='utf-8')
          PY
          git config user.name QilyLean
          git config user.email DingHunter623@gmail.com
          git add site-commercial-quality-closure-v1.css cooperation/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix(vi): set cooperation 05 current-card text white'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Production computed-style audit
        shell: bash
        run: |
          set -euo pipefail
          B="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$B"
          "$B" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/qily-r10 about:blank >/tmp/chrome.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:9222/json/version >/dev/null
          cat >/tmp/audit.mjs <<'NODE'
          const sleep=m=>new Promise(r=>setTimeout(r,m)); const fail=m=>{throw Error(m)};
          const t=await (await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'})).json();
          const c=await new Promise((ok,no)=>{const w=new WebSocket(t.webSocketDebuggerUrl),p=new Map();let n=0;w.onopen=()=>ok({call:(m,a={})=>new Promise((r,j)=>{const id=++n;p.set(id,{r,j});w.send(JSON.stringify({id,method:m,params:a}))})});w.onerror=no;w.onmessage=e=>{const x=JSON.parse(e.data),q=p.get(x.id);if(q){p.delete(x.id);x.error?q.j(Error(x.error.message)):q.r(x.result)}}});
          await c.call('Page.enable');await c.call('Runtime.enable');await c.call('Network.enable');await c.call('Network.setCacheDisabled',{cacheDisabled:true});
          async function ev(e){return (await c.call('Runtime.evaluate',{expression:e,returnByValue:true})).result.value}
          async function run(w,h){await c.call('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<600});for(let a=1;a<=30;a++){await c.call('Network.clearBrowserCache');await c.call('Page.navigate',{url:'https://qilylean.com/cooperation/?r10='+Date.now()});await sleep(1800);const d=await ev(`(()=>{let e=document.querySelector('.qily-system-axis__step[href="/cooperation/"]'),l=document.querySelector('link[href*="site-commercial-quality-closure-v1.css"]');if(!e)return null;let q=getComputedStyle(e),s=getComputedStyle(e.querySelector('strong')),p=getComputedStyle(e.querySelector('span'));return {v:l?.href||'',bg:q.backgroundColor,b:q.borderColor,c:q.color,f:q.webkitTextFillColor,sc:s.color,sf:s.webkitTextFillColor,pc:p.color,pf:p.webkitTextFillColor}})()`);console.log(w,a,d);if(d?.v.includes('20260904-cooperation-axis-current-white-r10')){if(d.bg!=='rgb(15, 75, 90)'||d.b!=='rgb(202, 161, 95)')fail(w+' VI surface mismatch '+JSON.stringify(d));for(const k of ['c','f','sc','sf','pc','pf'])if(d[k]!=='rgb(255, 255, 255)')fail(w+' '+k+' not white '+JSON.stringify(d));console.log('PASS',w,h);return}await sleep(8000)}fail(w+' production R10 timeout')}
          await run(1680,950);await run(390,844);
          NODE
          node /tmp/audit.mjs
