name: Materialize industry resource network

# QilyLean publication contract: source pages are materialized into final static HTML on every authorized main update.
on:
  pull_request:
    branches: [main]
    paths:
      - "site-resource-network-v1.css"
      - "links/network/**"
      - "scripts/materialize-industry-resource-network.js"
      - "scripts/validate-industry-resource-network.js"
      - ".github/workflows/materialize-industry-resource-network.yml"
      - "index.html"
      - "links/index.html"
      - "links/onboarding/index.html"
      - "sitemap.xml"
      - "sitemap-core.xml"
  push:
    branches: [main]
    paths:
      - "site-resource-network-v1.css"
      - "links/network/**"
      - "scripts/materialize-industry-resource-network.js"
      - "scripts/validate-industry-resource-network.js"
      - ".github/workflows/materialize-industry-resource-network.yml"
      - "index.html"
      - "links/index.html"
      - "links/onboarding/index.html"
      - "sitemap.xml"
      - "sitemap-core.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-industry-resource-network-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate scripts and source page
        shell: bash
        run: |
          node --check scripts/materialize-industry-resource-network.js
          node --check scripts/validate-industry-resource-network.js
          test -s site-resource-network-v1.css
          test -s links/network/index.html

      - name: Materialize resource-network pages
        shell: bash
        run: |
          sed -i 's|<link rel="stylesheet" href="/site-resource-network-v1.css?v=20260805-resource-network-v1">|<link id="qilyResourceNetworkStylesheet" rel="stylesheet" href="/site-resource-network-v1.css?v=20260805-resource-network-v1">|' links/network/index.html
          node scripts/materialize-industry-resource-network.js
          if test -f scripts/build-trust-search-sync.js; then
            node scripts/build-trust-search-sync.js
          fi
          node scripts/materialize-industry-resource-network.js

      - name: Verify deterministic generation
        shell: bash
        run: |
          git diff -- index.html links/index.html links/onboarding/index.html links/network/index.html sitemap.xml sitemap-core.xml qilylean/site-data.json qilylean/site-search-index.json > /tmp/resource-first.diff
          node scripts/materialize-industry-resource-network.js
          if test -f scripts/build-trust-search-sync.js; then
            node scripts/build-trust-search-sync.js
          fi
          node scripts/materialize-industry-resource-network.js
          git diff -- index.html links/index.html links/onboarding/index.html links/network/index.html sitemap.xml sitemap-core.xml qilylean/site-data.json qilylean/site-search-index.json > /tmp/resource-second.diff
          if ! cmp /tmp/resource-first.diff /tmp/resource-second.diff; then
            echo "Resource-network generation changed on repeat execution:" >&2
            diff -u /tmp/resource-first.diff /tmp/resource-second.diff || true
            exit 1
          fi

      - name: Validate public definition and compliance boundaries
        run: node scripts/validate-industry-resource-network.js

      - name: Commit generated public pages
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Industry resource network is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html links/index.html links/onboarding/index.html links/network/index.html sitemap.xml sitemap-core.xml trust/index.html cooperation/index.html qilylean/site-data.json qilylean/site-search-index.json site-search.js
          git commit -m "build: publish industry resource network"
          git push
