name: Fix factory thumbnail always-visible labels V7

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-factory-thumbnail-label-always-visible-v7.js'
      - 'projects/factory-layout/factory-thumbnail-label-v7.css'
      - '.github/workflows/fix-factory-thumbnail-label-always-visible-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factory-thumbnail-label-v7-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize VI-17 labels
        run: node scripts/fix-factory-thumbnail-label-always-visible-v7.js

      - name: Validate default-state readability contract
        shell: bash
        run: |
          node --check scripts/fix-factory-thumbnail-label-always-visible-v7.js
          node --check projects/factory-plan-viewer.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('projects/factory-layout/index.html','utf8');
          const css=fs.readFileSync('projects/factory-layout/factory-thumbnail-label-v7.css','utf8');
          const js=fs.readFileSync('projects/factory-plan-viewer.js','utf8');
          const labels=['1F｜方案1','1F｜方案2','2F｜功能布局','3F｜功能布局','2#｜1F','2#｜2F','2#｜3F','4#｜1F'];
          for(const label of labels){if(!html.includes('>'+label+'</div>'))throw new Error('Missing always-visible label: '+label);}
          if(!html.includes('factory-thumbnail-label-v7.css?v=20260813-always-visible-v7'))throw new Error('V7 CSS not last-linked');
          if(!css.includes('.factory-plan-label-v7'))throw new Error('V7 label style missing');
          if(!css.includes('font-size:13px!important'))throw new Error('Default label font too small');
          if(!css.includes('background:#f7fbfa!important')||!css.includes('color:#073c47!important'))throw new Error('Default label contrast contract missing');
          if(js.includes("setAttribute('title','点击进入站内图纸预览')"))throw new Error('Hover tooltip dependency not removed');
          console.log('VI-17 exact QA passed: default-visible, light-surface dark-text, no tooltip dependency.');
          NODE

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add projects/factory-layout/index.html projects/factory-plan-viewer.js projects/project-pages.css
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make factory thumbnail labels permanently readable [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
