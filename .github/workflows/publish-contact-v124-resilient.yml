name: Publish resilient contact V12.4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/contact-v124-resilient.py'
      - '.github/workflows/publish-contact-v124-resilient.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply V12.4 resilient source
        run: python3 scripts/contact-v124-resilient.py
      - name: Validate V12.4
        shell: bash
        run: |
          python3 -m py_compile scripts/contact-v124-resilient.py
          node --check site-navigation.js
          node --check site-navigation-core.js
          python3 - <<'PY'
          from pathlib import Path
          nav=Path('site-navigation.js').read_text('utf-8')
          css=Path('site-shell.css').read_text('utf-8')
          assert 'QILY-PHONE-CONTACT-V12.4:START' in nav
          assert 'QILY-CONTACT-V12.4-RESILIENT:START' in css
          assert '20260814-contact-v124' in nav
          assert '电话号码 '+"'+phone+'" not in ''
          print('V12.4 validation passed.')
          PY
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add site-navigation.js site-navigation-core.js site-shell.css cooperation/index.html scripts/contact-v124-resilient.py
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix: publish phone feedback and full-row contact visual V12.4 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
