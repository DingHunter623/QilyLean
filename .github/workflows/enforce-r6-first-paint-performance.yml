name: Enforce R6 static first paint and navigation performance

# Legacy V30 materializer retained for explicit recovery only. It must not
# rewrite V31 public pages on every HTML publication.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6-first-paint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate R6 performance sources
        run: |
          node --check site-native-prefetch-v1.js
          node --check site-navigation.js
          node --check site-navigation-core.js
          node --check site-navigation-legacy-20260802.js
          node --check scripts/enforce-r6-first-paint-performance.js
          node --check scripts/validate-home-hero-dock-snapback-v1.js

      - name: Materialize current visual baseline before first paint
        run: node scripts/enforce-r6-first-paint-performance.js

      - name: Verify R6 native navigation, homepage hero and dock boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check site-navigation.js
          node --check site-navigation-core.js
          node --check site-navigation-legacy-20260802.js
          node scripts/validate-home-hero-dock-snapback-v1.js
          grep -q "domSwap: false" site-native-prefetch-v1.js
          grep -q "historyRewrite: false" site-native-prefetch-v1.js
          grep -q "sameOriginOnly: true" site-native-prefetch-v1.js
          ! grep -q 'DOMParser' site-native-prefetch-v1.js
          ! grep -q 'history.pushState' site-native-prefetch-v1.js
          grep -q '/site-visual-governance-v2.css?v=20260819-readable-floor-plus1-v6' index.html
          grep -q '/site-content-axis-v1.css?v=20260819-unified-content-axis-v1' index.html
          grep -q '/site-home-hero-tune-v1.css?v=20260819-home-hero-align-v3' index.html
          grep -q 'font-size:clamp(40px,3.6vw,52px)!important' index.html
          grep -q 'qilyR6HomeFirstPaintParity' index.html
          grep -q '/site-native-prefetch-v1.js?v=20260819-r6-native-prefetch-v1' index.html
          grep -q '/site-floating-dock-standard-v1.css?v=20260819-dock-snapback-v3' index.html
          grep -q '/site-navigation.js?v=20260819-dock-snapback-v30' index.html
          grep -q 'function snapDockHome()' site-navigation-core.js
          grep -q 'function setDockFreePosition(left, top)' site-navigation-core.js
          grep -q 'Math.hypot(dx, dy) > 7' site-navigation-core.js
          grep -q "localStorage.removeItem('qilyDockPositionV2')" site-navigation-core.js
          ! grep -q "localStorage.setItem('qilyDockPositionV2'" site-navigation-core.js
          ! grep -q 'saveDockPosition()' site-navigation-core.js
          ! grep -q 'var distance = event.clientY - startY;' site-navigation-core.js
          git diff --check

      - name: Commit R6 materialized public pages on main only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'R6 first-paint, homepage hero and dock snapback baseline already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: materialize R6 hero v3 and dock snapback v3 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: PR writer ownership note
        if: github.event_name == 'pull_request'
        run: echo 'PR materialization commits are owned by materialize-sitewide-interaction-v5.yml to prevent concurrent branch push races.'
