name: Publish early career history

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-early-career-history.yml"
      - "site-early-career-history-v1.css"
      - "site-early-career-history-v1.js"
      - "scripts/publish-early-career-history.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-early-career-history.yml"
      - "site-early-career-history-v1.css"
      - "site-early-career-history-v1.js"
      - "scripts/publish-early-career-history.js"
  workflow_run:
    workflows: ["Build daily engineering brief archive"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-early-career-history-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate scripts and publication contract
        run: |
          node --check site-early-career-history-v1.js
          node --check scripts/publish-early-career-history.js
          node scripts/publish-early-career-history.js
          node scripts/publish-early-career-history.js --check
          git diff --check
      - name: Verify career links, company identities and official websites
        shell: bash
        run: |
          grep -F '2015～2019年' qilylean/daily-insights.html
          grep -F '2009～2015年' qilylean/daily-insights.html
          grep -F '2006～2009年' qilylean/daily-insights.html
          grep -F '/experience/#career-2015-2019' qilylean/daily-insights.html
          grep -F '/experience/#career-2009-2015' qilylean/daily-insights.html
          grep -F '/experience/#career-2006-2009' qilylean/daily-insights.html
          grep -F '深圳万润科技股份有限公司' qilylean/daily-insights.html
          grep -F 'https://www.masonled.com/' qilylean/daily-insights.html
          grep -F '广东恒润光电有限公司' qilylean/daily-insights.html
          grep -F 'https://www.mason-led.com/' qilylean/daily-insights.html
          grep -F '东莞库柏电子有限公司' qilylean/daily-insights.html
          grep -F 'https://www.eaton.com.cn/cn/zh-cn.html' qilylean/daily-insights.html
          grep -F '伟创力制造（珠海）有限公司' qilylean/daily-insights.html
          grep -F 'https://flex.com/zh/' qilylean/daily-insights.html
          grep -F '2019.07—2025.08｜广东精工智能系统 / 广东高胜互联科技（集团内调动）' site-early-career-history-v1.js
          grep -F '广东精工智能系统有限公司' site-early-career-history-v1.js
          grep -F 'https://www.jinggon.com/' site-early-career-history-v1.js
          grep -F '广东高胜互联科技有限公司' site-early-career-history-v1.js
          grep -F 'https://www.gdgaosheng.cn/' site-early-career-history-v1.js
          grep -F '2015.07—2019.06｜深圳万润科技·广东恒润光电有限公司（上市公司：万润科技）' site-early-career-history-v1.js
          grep -F 'https://www.masonled.com/' site-early-career-history-v1.js
          grep -F 'https://www.mason-led.com/' site-early-career-history-v1.js
          grep -F "'career-2019-2025'" site-early-career-history-v1.js
          grep -F "'career-2015-2019'" site-early-career-history-v1.js
          grep -F "'career-2009-2015'" site-early-career-history-v1.js
          grep -F "'career-2006-2009'" site-early-career-history-v1.js
          grep -F 'width:168px!important' site-early-career-history-v1.css
          grep -F 'white-space:nowrap!important' site-early-career-history-v1.css
          grep -F 'career-company-group' site-early-career-history-v1.css
          grep -F 'career-company-official' site-early-career-history-v1.css

  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh latest main and materialize career company websites
        shell: bash
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main
          node --check site-early-career-history-v1.js
          node --check scripts/publish-early-career-history.js
          node scripts/publish-early-career-history.js
          node scripts/publish-early-career-history.js --check
          git diff --check
      - name: Commit public pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Career company websites are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qilylean/daily-insights.html experience/index.html
          git commit -m "build: publish 2015-2025 company websites [skip ci]"
          git push origin HEAD:main
