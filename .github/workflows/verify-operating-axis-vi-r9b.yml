name: Verify Operating Axis VI R9B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-operating-axis-vi-r9b.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-verify-r9b-operating-axis
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Chrome
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          echo "BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          python3 -m http.server 4173 >/tmp/qily-r9b-verify-http.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:4173/cooperation/ >/dev/null
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/qily-r9b-verify-chrome about:blank >/tmp/qily-r9b-verify-chrome.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:9222/json/version >/dev/null

      - name: Audit all six cards with browser cache disabled
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-operating-axis-r9b-verify
          cat > /tmp/qily-r9b-verify.mjs <<'NODE'
          import fs from 'node:fs';
          const EXPECTED='20260904-operating-axis-vi-r9b';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=m=>{throw new Error(m)};
          async function target(){const r=await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'});if(!r.ok)fail(`target ${r.status}`);return r.json()}
          function connect(url){return new Promise((resolve,reject)=>{const ws=new WebSocket(url);let seq=0;const p=new Map();ws.onopen=()=>resolve({call(m,params={}){return new Promise((res,rej)=>{const id=++seq;p.set(id,{res,rej});ws.send(JSON.stringify({id,method:m,params}))})},close(){ws.close()}});ws.onerror=reject;ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.id&&p.has(x.id)){const q=p.get(x.id);p.delete(x.id);x.error?q.rej(new Error(x.error.message)):q.res(x.result)}}})}
          async function ev(c,e){const r=await c.call('Runtime.evaluate',{expression:e,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)fail(r.exceptionDetails.text);return r.result?.value}
          async function nav(c,url,w,h){await c.call('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<600});await c.call('Network.clearBrowserCache');await c.call('Page.navigate',{url:url+'?__qily_vi_r9b='+Date.now()});const t=Date.now();while(Date.now()-t<30000){const s=await ev(c,'document.readyState');if(s==='interactive'||s==='complete')return;await sleep(200)}fail(`nav timeout ${url}`)}
          async function wait(c,s){const t=Date.now();while(Date.now()-t<20000){if(await ev(c,`!!document.querySelector(${JSON.stringify(s)})`))return;await sleep(200)}fail(`selector ${s}`)}
          function rgb(v){const m=String(v).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);return m?m.slice(1,4).map(Number):null}
          function lum(a){a=a.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
          function ratio(f,b){f=rgb(f);b=rgb(b);if(!f||!b)return 0;const x=lum(f),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
          async function audit(c,base,tag,w,h){
            await nav(c,base+'/cooperation/',w,h);await wait(c,'.qily-system-axis__step');
            const d=await ev(c,`(()=>{const cards=[...document.querySelectorAll('.qily-system-axis__step')];const link=document.querySelector('link[href*="site-commercial-quality-closure-v1.css"]');return {href:link?.getAttribute('href')||'',cards:cards.map((el,i)=>{const s=getComputedStyle(el),a=getComputedStyle(el.querySelector('strong')),b=getComputedStyle(el.querySelector('span'));return {i,href:el.getAttribute('href'),bg:s.backgroundColor,border:s.borderColor,color:s.color,strong:a.color,span:b.color}})}})()`);
            console.log(tag,w,JSON.stringify(d));
            if(!d.href.includes(EXPECTED))fail(`${tag}/${w}: stale stylesheet ${d.href}`);
            if(d.cards.length!==6)fail(`${tag}/${w}: expected 6 cards, got ${d.cards.length}`);
            const f=d.cards[0];
            for(const x of d.cards){
              if(x.bg!==f.bg||x.border!==f.border||x.color!==f.color||x.strong!==f.strong||x.span!==f.span)fail(`${tag}/${w}: card ${x.i+1} not VI-uniform ${JSON.stringify(x)} vs ${JSON.stringify(f)}`);
              if(ratio(x.strong,x.bg)<4.5||ratio(x.span,x.bg)<4.5)fail(`${tag}/${w}: card ${x.i+1} contrast below 4.5`);
            }
            const current=d.cards.find(x=>x.href==='/cooperation/');if(!current)fail(`${tag}/${w}: 05 card missing`);
            if(current.bg!=='rgb(244, 249, 248)'||current.color!=='rgb(23, 50, 45)')fail(`${tag}/${w}: 05 card did not return to shared light VI ${JSON.stringify(current)}`);
            const shot=await c.call('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync(`visual-operating-axis-r9b-verify/${tag}-${w}.png`,Buffer.from(shot.data,'base64'));
            console.log(`PASS ${tag} ${w}`);
          }
          const t=await target(),c=await connect(t.webSocketDebuggerUrl);
          try{await c.call('Page.enable');await c.call('Runtime.enable');await c.call('Network.enable');await c.call('Network.setCacheDisabled',{cacheDisabled:true});await audit(c,'http://127.0.0.1:4173','local',1680,950);await audit(c,'http://127.0.0.1:4173','local',390,844);let last;for(let i=1;i<=8;i++){try{await audit(c,'https://qilylean.com','production',1680,950);await audit(c,'https://qilylean.com','production',390,844);last=null;break}catch(e){last=e;console.log(`production attempt ${i}/8: ${e.message}`);await sleep(10000)}}if(last)throw last;fs.writeFileSync('visual-operating-axis-r9b-verify/PASS.txt','PASS all six cards uniform/readable; local+production; desktop+mobile; cache disabled\n')}finally{c.close()}
          NODE
          node /tmp/qily-r9b-verify.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-axis-vi-r9b-verify-${{ github.run_id }}
          path: visual-operating-axis-r9b-verify
          if-no-files-found: warn
          retention-days: 7
