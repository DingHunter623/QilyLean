name: Verify Operating Axis VI R9B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-operating-axis-vi-r9b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run cache-disabled Chrome audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-operating-axis-r9b-verify
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/qily-r9b-verify-chrome about:blank >/tmp/qily-r9b-verify-chrome.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:9222/json/version >/dev/null
          cat > /tmp/qily-r9b-verify.mjs <<'NODE'
          import fs from 'node:fs';
          const EXPECTED='20260904-operating-axis-vi-r9b';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=m=>{throw new Error(m)};
          async function target(){const r=await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'});if(!r.ok)fail(`target ${r.status}`);return r.json()}
          function connect(url){return new Promise((resolve,reject)=>{const ws=new WebSocket(url);let n=0,p=new Map();ws.onopen=()=>resolve({call(m,params={}){return new Promise((res,rej)=>{const id=++n;p.set(id,{res,rej});ws.send(JSON.stringify({id,method:m,params}))})},close(){ws.close()}});ws.onerror=reject;ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.id&&p.has(x.id)){const q=p.get(x.id);p.delete(x.id);x.error?q.rej(new Error(x.error.message)):q.res(x.result)}}})}
          async function ev(c,e){const r=await c.call('Runtime.evaluate',{expression:e,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)fail(r.exceptionDetails.text);return r.result?.value}
          async function one(c,w,h){await c.call('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<600});await c.call('Network.clearBrowserCache');await c.call('Page.navigate',{url:`https://qilylean.com/cooperation/?__qily_r9b=${Date.now()}`});for(let i=0;i<150;i++){if(await ev(c,"document.readyState==='complete' && !!document.querySelector('.qily-system-axis__step')"))break;await sleep(200)}const d=await ev(c,`(()=>{const a=[...document.querySelectorAll('.qily-system-axis__step')];const l=document.querySelector('link[href*="site-commercial-quality-closure-v1.css"]');return {v:l?.getAttribute('href')||'',cards:a.map((e,i)=>{const s=getComputedStyle(e),x=getComputedStyle(e.querySelector('strong')),y=getComputedStyle(e.querySelector('span'));return {i,href:e.getAttribute('href'),bg:s.backgroundColor,border:s.borderColor,color:s.color,strong:x.color,span:y.color}})}})()`);console.log(w,JSON.stringify(d));if(!d.v.includes(EXPECTED))fail(`${w}: stale ${d.v}`);if(d.cards.length!==6)fail(`${w}: card count ${d.cards.length}`);const f=d.cards[0];for(const x of d.cards){for(const k of ['bg','border','color','strong','span'])if(x[k]!==f[k])fail(`${w}: card ${x.i+1} ${k} ${x[k]} != ${f[k]}`)}const cur=d.cards.find(x=>x.href==='/cooperation/');if(!cur||cur.bg!=='rgb(244, 249, 248)'||cur.color!=='rgb(23, 50, 45)')fail(`${w}: 05 not shared VI ${JSON.stringify(cur)}`);const shot=await c.call('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync(`visual-operating-axis-r9b-verify/production-${w}.png`,Buffer.from(shot.data,'base64'));console.log(`PASS production ${w}x${h}`)}
          const t=await target(),c=await connect(t.webSocketDebuggerUrl);try{await c.call('Page.enable');await c.call('Runtime.enable');await c.call('Network.enable');await c.call('Network.setCacheDisabled',{cacheDisabled:true});await one(c,1680,950);await one(c,390,844);fs.writeFileSync('visual-operating-axis-r9b-verify/PASS.txt','PASS production desktop/mobile: all six cards share the same VI state\n')}finally{c.close()}
          NODE
          node /tmp/qily-r9b-verify.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-axis-vi-r9b-verify-${{ github.run_id }}
          path: visual-operating-axis-r9b-verify
          if-no-files-found: warn
          retention-days: 7
