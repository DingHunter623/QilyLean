name: Materialize Global Translation Dual Route V2 + Header Axis

on:
  push:
    branches: [main]
    paths:
      - 'site-global-language-v3.js'
      - 'site-global-language-v1.css'
      - 'site-navigation.js'
      - 'site-header-axis-v1.css'
      - 'site-translation-progress-v1.js'
      - 'site-translation-progress-v1.css'
      - 'site-parent-navigation-v3.js'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/validate-global-language-runtime-compat-v1.js'
      - '.github/workflows/materialize-global-language-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-global-translation-header-axis-main
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Chinese-default translation, header axis and progress sources
        run: |
          node --check site-global-language-v3.js
          node --check site-translation-progress-v1.js
          node --check site-navigation.js
          node --check site-parent-navigation-v3.js
          node --check site-ui-consistency-v1.js
          node --check site-dock-share-runtime-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/validate-global-language-runtime-compat-v1.js
          node scripts/validate-global-language-runtime-compat-v1.js

      - name: Materialize and publish across every tracked HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Materialization publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node --check site-global-language-v3.js
            node --check site-translation-progress-v1.js
            node --check site-navigation.js
            node --check site-parent-navigation-v3.js
            node --check site-ui-consistency-v1.js
            node --check site-dock-share-runtime-v1.js
            node --check site-core-service-dock-closure-v1.js
            node --check scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js --check
            git diff --check
            if git diff --quiet; then
              echo 'Global Translation / Header Axis already materialized on latest main.'
              exit 0
            fi
            git add -- '*.html'
            git commit -m 'build: materialize Header Axis and translation progress across public HTML'
            if git push origin HEAD:main; then
              echo 'Header Axis and translation progress sitewide materialization published.'
              exit 0
            fi
            echo 'main advanced during publish; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish Header Axis / translation progress after retries.'
          exit 1
