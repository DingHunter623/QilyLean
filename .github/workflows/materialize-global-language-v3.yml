name: Materialize Unified Public Baseline

on:
  push:
    branches: [main]
    paths:
      - 'site-global-language-v1.css'
      - 'site-translation-safe-runtime-v1.js'
      - 'site-translation-public-ui-v1.js'
      - 'site-translation-public-ui-v1.css'
      - 'site-translation-progress-v1.js'
      - 'site-translation-progress-v1.css'
      - 'site-interaction-contrast-guard-v1.js'
      - 'site-interaction-contrast-guard-v1.css'
      - 'site-content-contrast-guard-v1.js'
      - 'site-content-contrast-guard-v1.css'
      - 'site-navigation.js'
      - 'site-header-axis-v1.css'
      - 'site-parent-navigation-v3.js'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/validate-global-language-runtime-compat-v1.js'
      - 'scripts/validate-sitewide-safety-readability-v1.js'
      - 'scripts/validate-public-baseline-materialization-v1.js'
      - 'scripts/validate-20260825-remediation-closure-v1.js'
      - '.github/workflows/materialize-global-language-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-unified-public-baseline-main
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate unified baseline sources
        run: |
          node --check site-translation-safe-runtime-v1.js
          node --check site-translation-public-ui-v1.js
          node --check site-translation-progress-v1.js
          node --check site-interaction-contrast-guard-v1.js
          node --check site-content-contrast-guard-v1.js
          node --check site-navigation.js
          node --check site-parent-navigation-v3.js
          node --check site-ui-consistency-v1.js
          node --check site-dock-share-runtime-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/validate-global-language-runtime-compat-v1.js
          node --check scripts/validate-sitewide-safety-readability-v1.js
          node --check scripts/validate-public-baseline-materialization-v1.js
          node --check scripts/validate-20260825-remediation-closure-v1.js
          node scripts/validate-sitewide-safety-readability-v1.js
          node scripts/validate-global-language-runtime-compat-v1.js

      - name: Materialize, audit and publish every tracked HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Unified public baseline publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node scripts/validate-sitewide-safety-readability-v1.js
            node scripts/validate-global-language-runtime-compat-v1.js
            node scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js --check
            node scripts/validate-public-baseline-materialization-v1.js
            node scripts/validate-20260825-remediation-closure-v1.js
            git diff --check
            if git diff --quiet; then
              echo 'Unified public baseline already materialized on latest main.'
              exit 0
            fi
            git add -- '*.html'
            git commit -m 'build: materialize unified safe translation and readability baseline across public HTML'
            if git push origin HEAD:main; then
              echo 'Unified public baseline published and audited.'
              exit 0
            fi
            echo 'main advanced during publish; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish unified public baseline after retries.'
          exit 1
