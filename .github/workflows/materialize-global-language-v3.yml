name: Materialize Global Language V3

on:
  push:
    branches: [main]
    paths:
      - 'site-global-language-v3.js'
      - 'site-ui-consistency-v1.js'
      - 'scripts/materialize-global-language-v3.js'
      - '.github/workflows/materialize-global-language-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-global-language-v3-main
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Global Language V3 syntax
        run: |
          node --check site-global-language-v3.js
          node --check scripts/materialize-global-language-v3.js

      - name: Materialize V3 into every tracked HTML page
        run: node scripts/materialize-global-language-v3.js

      - name: Validate materialized output
        run: |
          node scripts/materialize-global-language-v3.js --check
          git diff --check

      - name: Commit generated HTML updates when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Global Language V3 already materialized.'
            exit 0
          fi
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'build: materialize Global Language V3 across public HTML'
          git push origin HEAD:main
