name: Materialize Unified Public Baseline

# Public translation is intentionally uninstalled. This workflow keeps every tracked HTML page on the same non-translation baseline.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'site-visual-system-v2.css'
      - 'site-responsive-containment-v1.css'
      - 'site-public-redline-closure-v2.css'
      - 'site-public-redline-closure-v2.js'
      - 'visual-regression-matrix.json'
      - 'styles/qily-aircraft-brand-hero-v1.css'
      - 'site-interaction-contrast-guard-v1.js'
      - 'site-interaction-contrast-guard-v1.css'
      - 'site-interaction-semantics-v1.js'
      - 'site-interaction-semantics-v1.css'
      - 'site-content-contrast-guard-v1.js'
      - 'site-content-contrast-guard-v1.css'
      - 'site-unified-visual-governance-v1.css'
      - 'site-search.js'
      - 'site-integrity-hotfix-v1.js'
      - 'site-navigation.js'
      - 'site-header-axis-v1.css'
      - 'site-parent-navigation-v3.js'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-contact-route-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'tools/pure-ddz/game/css/r8-closure-v128.css'
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/materialize-contact-route-v6.js'
      - 'scripts/validate-visual-system-v2.js'
      - 'scripts/validate-responsive-containment-v1.js'
      - 'scripts/validate-sitewide-safety-readability-v1.js'
      - 'scripts/validate-public-baseline-materialization-v1.js'
      - 'scripts/validate-20260825-remediation-closure-v1.js'
      - 'scripts/validate-mobile-primary-navigation-v1.js'
      - 'scripts/validate-unified-visual-governance-v1.js'
      - 'package.json'
      - '.github/workflows/materialize-global-language-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-unified-public-baseline-main
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate translation-uninstalled baseline sources
        run: |
          node --check site-ui-consistency-v1.js
          node --check site-public-redline-closure-v2.js
          node --check site-interaction-contrast-guard-v1.js
          node --check site-interaction-semantics-v1.js
          node --check site-content-contrast-guard-v1.js
          node --check site-search.js
          node --check site-integrity-hotfix-v1.js
          node --check site-navigation.js
          node --check site-parent-navigation-v3.js
          node --check site-dock-share-runtime-v1.js
          node --check site-contact-route-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/materialize-contact-route-v6.js
          node --check scripts/validate-visual-system-v2.js
          node --check scripts/validate-responsive-containment-v1.js
          node --check scripts/validate-sitewide-safety-readability-v1.js
          node --check scripts/validate-public-baseline-materialization-v1.js
          node --check scripts/validate-20260825-remediation-closure-v1.js
          node --check scripts/validate-mobile-primary-navigation-v1.js
          node --check scripts/validate-unified-visual-governance-v1.js
          node scripts/validate-visual-system-v2.js
          node scripts/validate-responsive-containment-v1.js
          node scripts/validate-sitewide-safety-readability-v1.js
          node scripts/validate-mobile-primary-navigation-v1.js
          node scripts/validate-unified-visual-governance-v1.js

      - name: Materialize, audit and publish every tracked HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Translation-uninstalled public baseline publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node scripts/validate-visual-system-v2.js
            node scripts/validate-responsive-containment-v1.js
            node scripts/validate-sitewide-safety-readability-v1.js
            node scripts/validate-mobile-primary-navigation-v1.js
            node scripts/validate-unified-visual-governance-v1.js
            node scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js --check
            node scripts/validate-visual-system-v2.js --materialized
            node scripts/validate-responsive-containment-v1.js --materialized
            node scripts/validate-public-baseline-materialization-v1.js
            node scripts/validate-20260825-remediation-closure-v1.js
            node scripts/validate-mobile-primary-navigation-v1.js
            node scripts/validate-unified-visual-governance-v1.js --materialized
            git diff --check
            if git diff --quiet; then
              echo 'Translation-uninstalled public baseline already materialized on latest main.'
              exit 0
            fi
            git add -- '*.html'
            git commit -m 'build: remove translator from public HTML'
            if git push origin HEAD:main; then
              echo 'Translator removed and public HTML audited sitewide.'
              exit 0
            fi
            echo 'main advanced during publish; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish translation-uninstalled baseline after retries.'
          exit 1
