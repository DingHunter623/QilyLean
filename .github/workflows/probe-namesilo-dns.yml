name: Probe NameSilo DNS access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-namesilo-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NAMESILO_API_KEY: ${{ secrets.NAMESILO_API_KEY }}
      DOMAIN: qilylean.com
    steps:
      - name: Require NameSilo API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAMESILO_API_KEY" || { echo 'Missing NAMESILO_API_KEY'; exit 2; }
      - name: List current MX records only
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://www.namesilo.com/api/dnsListRecords?version=1&type=json&key=$NAMESILO_API_KEY&domain=$DOMAIN")
          code=$(jq -r '.reply.code // empty' <<<"$response")
          detail=$(jq -r '.reply.detail // empty' <<<"$response")
          echo "NameSilo API response: code=$code detail=$detail"
          test "$code" = "300" || { jq '.reply' <<<"$response"; exit 1; }
          jq -r '.reply.resource_record // [] | .[] | select(.type=="MX") | "MX id=\(.record_id) host=\(.host) value=\(.value) priority=\(.distance) ttl=\(.ttl)"' <<<"$response"
