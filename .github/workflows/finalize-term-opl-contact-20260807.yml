name: Finalize terminology OPL contact and PDF

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-term-opl-contact.py'
      - '.github/workflows/finalize-term-opl-contact-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-term-opl-contact-20260807
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/finalize-term-opl-contact.py
      - run: |
          grep -R -q '企业邮箱：<a href="mailto:admin@qilylean.com"' knowledge/terminology
          grep -R -q '下载 / 保存PDF' knowledge/terminology
          if grep -R -q "e.ctrlKey||e.metaKey.*k==='p'||k==='s'" knowledge/terminology; then
            echo '仍存在打印/保存拦截代码'
            exit 1
          fi
      - name: Commit with non-fast-forward retry
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add knowledge/terminology/*.html
          if git diff --cached --quiet; then
            echo 'No terminology changes required.'
            exit 0
          fi
          git commit -m '术语课件：官网下方统一企业邮箱并开放PDF保存'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying..."
            sleep 2
          done
          exit 1
