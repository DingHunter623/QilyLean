name: Add Zoho CN domain verification TXT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-zoho-cn-verification-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: qilylean.com
      RECORD_NAME: qilylean.com
      RECORD_CONTENT: zoho-verification=zb78796168.zmverify.zoho.com.cn
    steps:
      - name: Require Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Create or preserve Zoho China TXT record
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          zone_json=$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME&status=active&per_page=50")
          success=$(jq -r '.success' <<<"$zone_json")
          test "$success" = true || { jq . <<<"$zone_json"; exit 1; }
          zone_id=$(jq -r --arg name "$ZONE_NAME" '.result[] | select(.name==$name) | .id' <<<"$zone_json" | head -n1)
          test -n "$zone_id" || { echo "Active zone not found: $ZONE_NAME"; exit 1; }

          records_json=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=TXT&name=$RECORD_NAME&per_page=100")
          test "$(jq -r '.success' <<<"$records_json")" = true || { jq . <<<"$records_json"; exit 1; }
          existing_id=$(jq -r --arg content "$RECORD_CONTENT" '.result[] | select(.content==$content) | .id' <<<"$records_json" | head -n1)

          if [ -n "$existing_id" ]; then
            echo "Zoho China TXT already exists: $existing_id"
          else
            payload=$(jq -n --arg type TXT --arg name "$RECORD_NAME" --arg content "$RECORD_CONTENT" '{type:$type,name:$name,content:$content,ttl:1,comment:"Zoho China domain verification"}')
            created=$(curl -fsS -X POST "${auth[@]}" "$api/zones/$zone_id/dns_records" --data "$payload")
            test "$(jq -r '.success' <<<"$created")" = true || { jq . <<<"$created"; exit 1; }
            echo "Created DNS record: $(jq -r '.result.id' <<<"$created")"
          fi

      - name: Verify public DNS propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            answer=$(dig +short TXT "$RECORD_NAME" @1.1.1.1 | tr -d '"' || true)
            if grep -Fq "$RECORD_CONTENT" <<<"$answer"; then
              echo "Public DNS verification passed: $RECORD_CONTENT"
              exit 0
            fi
            echo "Attempt $attempt/20: waiting for DNS propagation"
            sleep 15
          done
          echo 'TXT record was created but public propagation is still pending.' >&2
          exit 1
