name: Prune unreferenced repository assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-unreferenced-assets.js"
      - ".github/workflows/audit-unreferenced-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-unreferenced-assets-main
  cancel-in-progress: true

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove attachments with no repository references
        run: node scripts/audit-unreferenced-assets.js --apply

      - name: Validate cleanup report and remaining site sources
        shell: bash
        run: |
          node --check scripts/audit-unreferenced-assets.js
          test -s maintenance/unreferenced-assets-report.json
          node - <<'NODE'
          const fs = require('fs');
          const report = require('./maintenance/unreferenced-assets-report.json');
          if (report.mode !== 'apply') throw new Error('Unexpected report mode');
          if (!Array.isArray(report.deletable) || !Array.isArray(report.retained)) throw new Error('Cleanup report is incomplete');
          if (report.deletedAssets !== report.unreferencedAssets) throw new Error('Not every approved unreferenced asset was deleted');
          for (const item of report.deletedAssets ? report.deletable : []) {
            if (fs.existsSync(item.path)) throw new Error(`Deleted asset still exists: ${item.path}`);
          }
          console.log(`Deleted ${report.deletedAssets} unreferenced assets and released ${report.deletedBytes} bytes from the current branch tree.`);
          NODE

      - name: Commit attachment cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No unreferenced attachments required removal."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove unreferenced repository attachments [skip ci]"
          git push
