name: Install exact approved C919 artwork

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-exact-approved-c919-20260818
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact user-approved PNG and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qilylean
          curl -fL --retry 3 --retry-delay 2 'https://at.adobe.com/gwtaAwfw1yNdhDFM' -o /tmp/c919-approved.png
          echo '71f37901a72a345ebf298d22055ff28325511594c19f70859dd7ab4ca2cce4f7  /tmp/c919-approved.png' | sha256sum -c -
          python3 - <<'PY'
          import struct
          p='/tmp/c919-approved.png'
          with open(p,'rb') as f:
              sig=f.read(24)
          if sig[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Downloaded artwork is not PNG')
          w,h=struct.unpack('>II',sig[16:24])
          if (w,h)!=(1672,941):
              raise SystemExit(f'Unexpected dimensions: {w}x{h}')
          print(f'Approved artwork verified: {w}x{h}')
          PY
          mv /tmp/c919-approved.png qilylean/c919-strategy-hero-approved-20260818.png

      - name: Commit exact approved artwork and retire installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qilylean/c919-strategy-hero-approved-20260818.png
          git rm .github/workflows/install-approved-c919-20260818.yml
          git commit -m 'fix: install exact user-approved C919 homepage artwork [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
