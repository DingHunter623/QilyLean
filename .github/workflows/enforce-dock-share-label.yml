name: Enforce compact 分享官网 dock label

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce-dock-share-label-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'scripts/publish-dock-label-polish-v1.js'
      - 'scripts/publish-core-service-dock-closure.js'
      - '.github/workflows/enforce-dock-share-label.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-dock-share-label-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enforce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate scoped dock enforcer
        run: node --check scripts/enforce-dock-share-label-v1.js

      - name: Materialize compact 分享官网 across public pages
        run: node scripts/enforce-dock-share-label-v1.js

      - name: Verify no oversized share button regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q '分享官网' site-ui-consistency-v1.js
          grep -q '分享官网' site-core-service-dock-closure-v1.js
          ! grep -q '分享官方网址' site-ui-consistency-v1.js
          ! grep -q '分享官方网址' site-core-service-dock-closure-v1.js
          grep -q 'width:62px!important' index.html
          grep -q 'height:62px!important' index.html
          ! grep -q 'width:76px!important' index.html
          ! grep -q 'width:72px!important' index.html
          grep -q 'aria-label="分享官网"' index.html
          git diff --check

      - name: Commit scoped dock normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Dock share label already compliant.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git commit -m 'UX: compact floating 分享官网 button [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
