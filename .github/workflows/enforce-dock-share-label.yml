name: Enforce functional 分享官网 dock

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/enforce-dock-share-label-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'scripts/publish-dock-label-polish-v1.js'
      - 'scripts/publish-core-service-dock-closure.js'
      - '.github/workflows/enforce-dock-share-label.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/enforce-dock-share-label-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - '.github/workflows/enforce-dock-share-label.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enforce-dock-share-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate dock share sources
        run: |
          node --check scripts/enforce-dock-share-label-v1.js
          node --check scripts/validate-public-shell-v31.js
          node --check scripts/validate-home-hero-dock-snapback-v1.js
          node --check site-dock-share-runtime-v1.js
          node --check site-ui-consistency-v1.js
          node --check site-core-service-dock-closure-v1.js

      - name: Materialize functional 分享官网 across public pages
        run: node scripts/enforce-dock-share-label-v1.js

      - name: Verify V31 shell, Dock behavior and deterministic output
        run: |
          node scripts/validate-public-shell-v31.js
          node scripts/validate-home-hero-dock-snapback-v1.js
          git diff --exit-code
          git diff --check
