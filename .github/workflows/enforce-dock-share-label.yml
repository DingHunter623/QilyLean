name: Enforce functional 分享官网 dock

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/enforce-dock-share-label-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'scripts/publish-dock-label-polish-v1.js'
      - 'scripts/publish-core-service-dock-closure.js'
      - '.github/workflows/enforce-dock-share-label.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/enforce-dock-share-label-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - '.github/workflows/enforce-dock-share-label.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enforce-dock-share-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate dock share sources
        run: |
          node --check scripts/enforce-dock-share-label-v1.js
          node --check site-dock-share-runtime-v1.js
          node --check site-ui-consistency-v1.js
          node --check site-core-service-dock-closure-v1.js

      - name: Materialize functional 分享官网 across public pages
        run: node scripts/enforce-dock-share-label-v1.js

      - name: Verify share function, typography and URL contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "分享<br>官网" site-ui-consistency-v1.js
          grep -q "分享<br>官网" site-core-service-dock-closure-v1.js
          ! grep -q 'qily-share-label-line' site-ui-consistency-v1.js
          ! grep -q 'qily-share-label-line' site-core-service-dock-closure-v1.js
          grep -q "var HOME_URL = 'https://qilylean.com';" site-dock-share-runtime-v1.js
          grep -q "navigator.share({ url: url })" site-dock-share-runtime-v1.js
          grep -q "payload: 'url-only'" site-dock-share-runtime-v1.js
          grep -q 'width:62px!important' index.html
          grep -q 'height:62px!important' index.html
          grep -q '分享<br>官网' index.html
          grep -q 'aria-label="分享官网"' index.html
          grep -q 'site-dock-share-runtime-v1.js?v=20260820-dock-share-runtime-v1' index.html
          ! grep -q 'qily-share-label-line' index.html
          ! grep -q 'width:76px!important' index.html
          ! grep -q 'width:72px!important' index.html
          git diff --exit-code
          git diff --check
