name: Notify search engines with IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "sitemap-core.xml"
      - "sitemap-topics.xml"
      - "robots.txt"
      - "data/search-authority-map.json"
      - "data/google-index-coverage-policy.json"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_HOST: qilylean.com
      SITE_ORIGIN: https://qilylean.com
      INDEXNOW_KEY: b47ed759da519bd90586a7877122d7be
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Wait for the published key
        shell: bash
        run: |
          for attempt in {1..30}; do
            body="$(curl --fail --silent --show-error "$SITE_ORIGIN/$INDEXNOW_KEY.txt?deploy=$GITHUB_SHA-$attempt" || true)"
            if [ "$body" = "$INDEXNOW_KEY" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The published IndexNow key was not available in time."
          exit 1

      - name: Build changed authority URL list
        id: urls
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          origin = os.environ["SITE_ORIGIN"].rstrip("/")
          event = os.environ.get("GITHUB_EVENT_NAME", "push")
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          def sitemap_urls(path):
              file = Path(path)
              if not file.exists():
                  return []
              root = ET.parse(file).getroot()
              return [node.text.strip() for node in root.findall("sm:url/sm:loc", namespace) if node.text and node.text.strip()]

          def coverage_urls():
              file = Path("data/google-index-coverage-policy.json")
              if not file.exists():
                  return []
              payload = json.loads(file.read_text(encoding="utf-8"))
              return [
                  item["url"].strip()
                  for item in payload.get("routes", [])
                  if item.get("policy") == "submit" and item.get("url")
              ]

          def authority_urls():
              file = Path("data/search-authority-map.json")
              if not file.exists():
                  return []
              payload = json.loads(file.read_text(encoding="utf-8"))
              rows = []
              for index, item in enumerate(payload.get("targets", [])):
                  url = (item.get("url") or "").strip()
                  priority = item.get("priority")
                  if url and priority in {"S", "A"}:
                      rows.append((0 if priority == "S" else 1, index, url))
              rows.sort()
              return [url for _, _, url in rows]

          topic_urls = sitemap_urls("sitemap-topics.xml")
          priority_urls = coverage_urls()
          authority_priority_urls = authority_urls()
          candidates = []

          def add_many(items):
              candidates.extend(item for item in items if item)

          # A manual run is a controlled authority refresh: brand, service, method,
          # project and knowledge URLs are queued in priority order rather than the
          # entire public site.
          if event == "workflow_dispatch":
              add_many(authority_priority_urls)
              add_many(topic_urls)
              add_many(priority_urls)

          try:
              changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True).splitlines()
          except Exception:
              changed = subprocess.check_output(["git", "show", "--pretty=", "--name-only", "HEAD"], text=True).splitlines()

          # Changed canonical HTML is always first-class discovery material.
          for name in changed:
              path = Path(name)
              if name.endswith(".html") and path.exists():
                  html = path.read_text(encoding="utf-8", errors="ignore")
                  if re.search(r'<meta\s+[^>]*name=["\'](?:robots|googlebot)["\'][^>]*content=["\'][^"\']*\bnoindex\b', html, re.I):
                      continue
                  match = re.search(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\'](https://qilylean\.com[^"\']*)["\']', html, re.I)
                  if not match:
                      match = re.search(r'<link\b[^>]*href=["\'](https://qilylean\.com[^"\']*)["\'][^>]*rel=["\']canonical["\']', html, re.I)
                  if match:
                      candidates.insert(0, match.group(1))

              if name in {"sitemap-topics.xml", "data/search-authority-map.json"}:
                  add_many(authority_priority_urls)
                  add_many(topic_urls)

              if name == "data/google-index-coverage-policy.json":
                  add_many(priority_urls)

              if name in {"sitemap.xml", "sitemap-core.xml"}:
                  try:
                      diff = subprocess.check_output(["git", "diff", "HEAD^", "HEAD", "--", name], text=True)
                  except Exception:
                      diff = ""
                  for candidate in re.findall(r'^\+.*?<loc>\s*(https://qilylean\.com[^<]+)\s*</loc>', diff, re.M):
                      candidates.append(candidate.strip())

          clean = []
          seen = set()
          for url in candidates:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.netloc != os.environ["SITE_HOST"]:
                  continue
              normalized = origin if parsed.path == "/" else url.rstrip("/")
              if normalized not in seen:
                  clean.append(normalized)
                  seen.add(normalized)

          Path("search-engine-urls.txt").write_text("\n".join(clean) + ("\n" if clean else ""), encoding="utf-8")
          Path("search-engine-urls.json").write_text(json.dumps(clean, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"count={len(clean)}\n")
          print(f"Prepared {len(clean)} changed/high-authority URLs for discovery.")
          for url in clean:
              print(url)
          PY

      - name: Submit changed URLs through IndexNow
        if: steps.urls.outputs.count != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open("search-engine-urls.json", encoding="utf-8") as file:
              urls = json.load(file)
          payload = json.dumps({
              "host": os.environ["SITE_HOST"],
              "key": os.environ["INDEXNOW_KEY"],
              "keyLocation": f'{os.environ["SITE_ORIGIN"]}/{os.environ["INDEXNOW_KEY"]}.txt',
              "urlList": urls,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"IndexNow accepted {len(urls)} URLs with HTTP {response.status}.")
          PY

      - name: Submit changed URLs to Baidu when configured
        if: steps.urls.outputs.count != '0'
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "BAIDU_PUSH_TOKEN is not configured; skipping Baidu API submission."
            exit 0
          fi

          # Baidu is intentionally fed in small batches. A manual authority refresh
          # can cover several batches, while quota exhaustion stops the run cleanly.
          BAIDU_BATCH_SIZE=10
          BAIDU_MAX_URLS=50
          head -n "$BAIDU_MAX_URLS" search-engine-urls.txt > baidu-urls.txt
          submitted_total="$(grep -c . baidu-urls.txt || true)"
          echo "Prepared up to $submitted_total URL(s) for Baidu API submission."

          split -l "$BAIDU_BATCH_SIZE" -d -a 3 baidu-urls.txt baidu-batch-
          batch_no=0
          for batch in baidu-batch-*; do
            [ -s "$batch" ] || continue
            batch_no=$((batch_no + 1))
            batch_count="$(grep -c . "$batch" || true)"
            echo "Submitting Baidu batch $batch_no with $batch_count URL(s)."

            response_file="$(mktemp)"
            set +e
            http_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H 'Content-Type: text/plain' \
              --data-binary @"$batch" \
              "http://data.zz.baidu.com/urls?site=$SITE_ORIGIN&token=$BAIDU_PUSH_TOKEN")"
            curl_exit=$?
            set -e

            response="$(cat "$response_file")"
            rm -f "$response_file"
            echo "Baidu API HTTP status: $http_code"
            echo "Baidu API response: $response"

            if [ "$curl_exit" -ne 0 ]; then
              echo "Baidu API transport failed with curl exit code $curl_exit."
              exit "$curl_exit"
            fi
            if [ "$http_code" != "200" ]; then
              echo "Baidu API rejected the submission; see the response above for the exact reason."
              exit 1
            fi

            success="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("success",0))' "$response" 2>/dev/null || echo 0)"
            remain="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("remain",-1))' "$response" 2>/dev/null || echo -1)"
            not_same_site="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(len(d.get("not_same_site",[]) or []))' "$response" 2>/dev/null || echo 0)"
            not_valid="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(len(d.get("not_valid",[]) or []))' "$response" 2>/dev/null || echo 0)"
            echo "Baidu accepted: $success; remaining quota: $remain; not_same_site: $not_same_site; not_valid: $not_valid"

            if [ "$remain" = "0" ]; then
              echo "Baidu reported no remaining quota; stopping further batches without failing the workflow."
              break
            fi
            sleep 1
          done
