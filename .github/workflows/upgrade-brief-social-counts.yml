name: Upgrade brief social counters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-brief-social-counts.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upgrade persistent social counters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          worker_path = Path('cloudflare-worker/worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          worker = replace_once(worker,
              "const BUILD_VERSION = 'v1.6.0-brief-engagement';",
              "const BUILD_VERSION = 'v1.6.1-social-counts';",
              'worker build version')

          summary_pattern = re.compile(r"function emptyBriefSummary\(date, title = '', url = ''\) \{[\s\S]*?\n\}\n\nfunction publicBriefSummary\(summary\) \{[\s\S]*?\n\}\n\nasync function briefVoterKey")
          summary_replacement = r'''function emptyBriefSummary(date, title = '', url = '') {
            return {
              brief_date: date,
              brief_title: title,
              brief_url: url,
              rating_sum: 0,
              rating_count: 0,
              five_star_count: 0,
              likes: 0,
              dislikes: 0,
              comments: 0,
              updated_at: ''
            };
          }

          function publicBriefSummary(summary) {
            const ratingCount = Math.max(0, Number(summary.rating_count || 0));
            const ratingSum = Math.max(0, Number(summary.rating_sum || 0));
            const fiveStarCount = Math.max(0, Number(summary.five_star_count || 0));
            const likes = Math.max(0, Number(summary.likes || 0));
            const dislikes = Math.max(0, Number(summary.dislikes || 0));
            const comments = Math.max(0, Number(summary.comments || 0));
            return {
              brief_date: summary.brief_date || '',
              brief_title: summary.brief_title || '',
              brief_url: summary.brief_url || '',
              rating_average: ratingCount ? Math.round((ratingSum / ratingCount) * 10) / 10 : 0,
              rating_count: ratingCount,
              five_star_count: fiveStarCount,
              likes,
              dislikes,
              comments,
              interaction_count: ratingCount + likes + dislikes + comments,
              updated_at: summary.updated_at || ''
            };
          }

          async function briefVoterKey'''
          worker, count = summary_pattern.subn(summary_replacement, worker, count=1)
          if count != 1:
              raise SystemExit('failed to replace brief summary functions')

          get_summary = '''async function getBriefSummary(env, briefDate) {
            if (!env.QILY_STATS) return emptyBriefSummary(briefDate);
            return (await env.QILY_STATS.get(`brief-feedback:summary:${briefDate}`, 'json')) || emptyBriefSummary(briefDate);
          }
          '''
          comment_helpers = get_summary + r'''
          function briefDateFromConsultation(record) {
            const source = `${record.source_brief || ''} ${record.timing || ''} ${record.source_page || ''}`;
            const matched = source.match(/\d{4}-\d{2}-\d{2}/);
            return matched ? normalizeBriefDate(matched[0]) : '';
          }

          async function recordBriefComment(record, env) {
            if (!env.QILY_STATS) return null;
            const briefDate = briefDateFromConsultation(record);
            if (!briefDate) return null;
            const summary = await getBriefSummary(env, briefDate);
            const sourceBrief = clean(record.source_brief, 300);
            const derivedTitle = clean(sourceBrief.replace(briefDate, '').replace(/^[\s｜|·:：-]+/, ''), 220);
            summary.brief_date = briefDate;
            if (derivedTitle) summary.brief_title = derivedTitle;
            if (record.source_page) summary.brief_url = record.source_page;
            summary.comments = Number(summary.comments || 0) + 1;
            summary.updated_at = new Date().toISOString();
            await env.QILY_STATS.put(`brief-feedback:summary:${briefDate}`, JSON.stringify(summary));
            return summary;
          }
          '''
          worker = replace_once(worker, get_summary, comment_helpers, 'brief comment helpers')
          worker = replace_once(worker,
              '''    summary.rating_sum = Number(summary.rating_sum || 0) + value;
              summary.rating_count = Number(summary.rating_count || 0) + 1;''',
              '''    summary.rating_sum = Number(summary.rating_sum || 0) + value;
              summary.rating_count = Number(summary.rating_count || 0) + 1;
              if (value === 5) summary.five_star_count = Number(summary.five_star_count || 0) + 1;''',
              'five-star counter')
          worker = replace_once(worker,
              '''    const interactionsA = a.rating_count + a.likes + a.dislikes;
              const interactionsB = b.rating_count + b.likes + b.dislikes;''',
              '''    const interactionsA = a.rating_count + a.likes + a.dislikes + a.comments;
              const interactionsB = b.rating_count + b.likes + b.dislikes + b.comments;''',
              'feedback sort')

          consultation_pattern = re.compile(r"        const key = await saveConsultation\(record, env\);\n        const emailSent = await sendConsultationEmail\(record, env\);\n        await recordMetric\(env, 'consultations'\);\n        if \(record.industry === '今日简报留言交流'\) await recordMetric\(env, 'brief_comments'\);\n        return json\(\{ ok: true, id: record.id, key, email_sent: emailSent, receiver: CONSULTATION_RECEIVER \}, 201, origin\);")
          consultation_replacement = '''        const key = await saveConsultation(record, env);
                  const isBriefComment = record.industry === '今日简报留言交流';
                  const briefSummary = isBriefComment ? await recordBriefComment(record, env) : null;
                  const emailSent = await sendConsultationEmail(record, env);
                  await recordMetric(env, 'consultations');
                  if (isBriefComment) await recordMetric(env, 'brief_comments');
                  return json({
                    ok: true,
                    id: record.id,
                    key,
                    email_sent: emailSent,
                    receiver: CONSULTATION_RECEIVER,
                    brief_summary: briefSummary ? publicBriefSummary(briefSummary) : null
                  }, 201, origin);'''
          worker, count = consultation_pattern.subn(consultation_replacement, worker, count=1)
          if count != 1:
              raise SystemExit('failed to patch brief comment aggregation')
          worker_path.write_text(worker, encoding='utf-8')

          daily_feedback = r'''(function(){
          'use strict';
          var root=document.querySelector('[data-brief-feedback]');
          if(!root)return;

          var api='https://qilylean-ai.dinghunter623.workers.dev';
          var date=root.getAttribute('data-brief-date')||'';
          var title=root.getAttribute('data-brief-title')||'';
          var pageUrl=root.getAttribute('data-brief-url')||location.href;
          var status=root.querySelector('[data-brief-feedback-status]');
          var ratingSummary=root.querySelector('[data-rating-summary]');
          var messageForm=root.querySelector('[data-brief-message-form]');

          function ensureCounterUi(){
            if(!document.getElementById('briefSocialCounterStyle')){
              var style=document.createElement('style');
              style.id='briefSocialCounterStyle';
              style.textContent='.brief-feedback-totals{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 2px}.brief-feedback-totals span{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:7px 11px;border:1px solid var(--daily-line,#d5e4e3);border-radius:999px;color:var(--daily-forest,#0f4b5a);background:#f8fbfa;font-size:14px;font-weight:850}.brief-feedback-totals b,.brief-inline-message-heading b{color:#a26d18;font-size:15px}.brief-feedback-totals span:last-child{background:#fff8e8;border-color:#e7d39b}@media(max-width:620px){.brief-feedback-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.brief-feedback-totals span{justify-content:center}.brief-feedback-totals span:last-child{grid-column:1/-1}}';
              document.head.appendChild(style);
            }
            var totals=root.querySelector('[data-brief-feedback-totals]');
            if(!totals){
              totals=document.createElement('div');
              totals.className='brief-feedback-totals';
              totals.setAttribute('data-brief-feedback-totals','');
              totals.setAttribute('aria-label','本期简报累计互动');
              totals.innerHTML='<span>⭐ 五星好评 <b data-five-star-count>0</b></span><span>👍 点赞 <b data-social-like-count>0</b></span><span>💬 留言 <b data-social-comment-count>0</b></span><span>累计互动 <b data-total-interaction-count>0</b></span>';
              var heading=root.querySelector('.brief-feedback-heading');
              if(heading)heading.insertAdjacentElement('afterend',totals);else root.insertBefore(totals,root.firstChild);
            }
            var messageHeading=root.querySelector('.brief-inline-message-heading strong');
            if(messageHeading&&!messageHeading.querySelector('[data-comment-count]')){
              messageHeading.insertAdjacentHTML('beforeend',' <b data-comment-count>0</b>');
            }
          }
          ensureCounterUi();

          var likeCount=root.querySelector('[data-like-count]');
          var dislikeCount=root.querySelector('[data-dislike-count]');
          var fiveStarCount=root.querySelector('[data-five-star-count]');
          var socialLikeCount=root.querySelector('[data-social-like-count]');
          var socialCommentCount=root.querySelector('[data-social-comment-count]');
          var commentCount=root.querySelector('[data-comment-count]');
          var interactionCount=root.querySelector('[data-total-interaction-count]');

          function setStatus(text,type){
            if(!status)return;
            status.textContent=text;
            status.className='brief-feedback-status'+(type?' '+type:'');
          }

          function safeStorage(){
            try{return window.localStorage;}catch(error){return null;}
          }

          var storage=safeStorage();
          var tokenKey='qilylean_feedback_client';
          var clientToken='';
          if(storage){
            clientToken=storage.getItem(tokenKey)||'';
            if(!clientToken){
              clientToken=window.crypto&&window.crypto.randomUUID
                ?window.crypto.randomUUID()
                :'ql-'+Date.now()+'-'+Math.random().toString(36).slice(2);
              storage.setItem(tokenKey,clientToken);
            }
          }
          if(!clientToken)clientToken='session-'+Date.now()+'-'+Math.random().toString(36).slice(2);

          function marker(action){return'qilylean_feedback_'+date+'_'+action;}
          function number(value){var parsed=Number(value||0);return Number.isFinite(parsed)&&parsed>0?parsed:0;}

          function render(summary){
            summary=summary||{};
            var count=number(summary.rating_count);
            var average=number(summary.rating_average);
            var five=number(summary.five_star_count);
            var likes=number(summary.likes);
            var dislikes=number(summary.dislikes);
            var comments=number(summary.comments);
            var interactions=number(summary.interaction_count)||(count+likes+dislikes+comments);
            if(ratingSummary)ratingSummary.textContent=count
              ?'平均 '+average.toFixed(1)+' / 5｜累计 '+count+' 次评分｜五星好评 '+five+' 次'
              :'累计评分 0｜五星好评 0，期待你的第一颗星。';
            if(likeCount)likeCount.textContent=String(likes);
            if(dislikeCount)dislikeCount.textContent=String(dislikes);
            if(fiveStarCount)fiveStarCount.textContent=String(five);
            if(socialLikeCount)socialLikeCount.textContent=String(likes);
            if(socialCommentCount)socialCommentCount.textContent=String(comments);
            if(commentCount)commentCount.textContent=String(comments);
            if(interactionCount)interactionCount.textContent=String(interactions);
            if(!storage)return;
            var savedRating=Number(storage.getItem(marker('rating'))||0);
            var savedSentiment=storage.getItem(marker('sentiment'))||'';
            root.querySelectorAll('[data-brief-rating]').forEach(function(button){
              var value=Number(button.getAttribute('data-brief-rating'));
              button.classList.toggle('selected',savedRating>0&&value<=savedRating);
              button.setAttribute('aria-pressed',String(value===savedRating));
            });
            root.querySelectorAll('[data-brief-sentiment]').forEach(function(button){
              var active=button.getAttribute('data-brief-sentiment')===savedSentiment;
              button.classList.toggle('selected',active);
              button.setAttribute('aria-pressed',String(active));
            });
          }

          async function loadSummary(){
            try{
              var response=await fetch(api+'/brief-feedback?brief='+encodeURIComponent(date)+'&_='+Date.now(),{headers:{Accept:'application/json'},cache:'no-store'});
              if(response.ok)render(await response.json());
            }catch(error){console.warn('Brief feedback summary unavailable',error);}
          }

          async function submitVote(action,value){
            if(storage&&storage.getItem(marker(action))){
              setStatus(action==='rating'?'你已经为本期评过星。':'你已经为本期提交过好／差评。','');
              return;
            }
            var buttons=Array.prototype.slice.call(root.querySelectorAll('[data-brief-rating],[data-brief-sentiment]'));
            buttons.forEach(function(item){item.disabled=true;});
            setStatus('正在提交评价…','');
            try{
              var response=await fetch(api+'/brief-feedback',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({brief_date:date,brief_title:title,brief_url:pageUrl,action:action,value:value,client_token:clientToken})
              });
              var result=await response.json().catch(function(){return{};});
              if(!response.ok)throw new Error(result.error||'feedback_'+response.status);
              if(storage)storage.setItem(marker(action),String(value));
              render(result.summary||result);
              setStatus(result.duplicate?'本期同类评价已记录，无需重复提交。':'谢谢你的评价，累计数已更新。','success');
            }catch(error){setStatus('评价暂未提交成功，请稍后重试。','error');}
            finally{buttons.forEach(function(item){item.disabled=false;});}
          }

          root.addEventListener('click',function(event){
            var rating=event.target.closest&&event.target.closest('[data-brief-rating]');
            if(rating){submitVote('rating',Number(rating.getAttribute('data-brief-rating')));return;}
            var sentiment=event.target.closest&&event.target.closest('[data-brief-sentiment]');
            if(sentiment)submitVote('sentiment',sentiment.getAttribute('data-brief-sentiment'));
          });

          async function sendMessageFallback(data,id){
            var mail=new FormData();
            mail.append('_subject','【QilyLean今日简报留言】'+data.company+'｜'+date);
            mail.append('_template','table');mail.append('_captcha','false');
            mail.append('留言编号',id||'后台处理中');mail.append('留言人称谓',data.company);
            mail.append('联系方式',data.contact);mail.append('来源简报',date+'｜'+title);
            mail.append('留言内容',data.message);mail.append('来源页面',pageUrl);
            var response=await fetch('https://formsubmit.co/ajax/396767769@qq.com',{method:'POST',headers:{Accept:'application/json'},body:mail});
            if(!response.ok)throw new Error('email_'+response.status);
            return true;
          }

          if(messageForm)messageForm.addEventListener('submit',async function(event){
            event.preventDefault();
            if(!messageForm.reportValidity())return;
            var formData=new FormData(messageForm);
            var website=String(formData.get('website')||'').trim();
            if(website){setStatus('留言已提交。','success');return;}
            var message=String(formData.get('message')||'').trim();
            var name=String(formData.get('name')||'').trim()||'匿名读者';
            var contact=String(formData.get('contact')||'').trim()||'未留下联系方式';
            var button=messageForm.querySelector('button[type="submit"]');
            var data={company:name,industry:'今日简报留言交流',location:'未提供',scale:'',problem:'来源简报：'+date+'｜'+title+'\n留言内容：'+message,target:'',timing:'今日简报留言｜'+date,contact:contact,website:website,source_page:pageUrl,source_brief:date+'｜'+title,message:message};
            button.disabled=true;button.textContent='正在提交…';setStatus('正在提交留言…','');
            var emailSent=false,id='';
            try{
              var response=await fetch(api+'/consultations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
              var result=await response.json().catch(function(){return{};});
              if(!response.ok)throw new Error(result.error||'message_'+response.status);
              id=result.id||'';emailSent=Boolean(result.email_sent);
              if(result.brief_summary)render(result.brief_summary);else await loadSummary();
              if(!emailSent){try{emailSent=await sendMessageFallback(data,id);}catch(emailError){console.warn('Brief message email fallback unavailable',emailError);}}
              messageForm.reset();
              setStatus(emailSent?'留言已提交，累计留言数已更新，并已发送邮件通知。':'留言已提交，累计留言数已更新；邮件通知暂未确认。','success');
            }catch(error){
              try{emailSent=await sendMessageFallback(data,id);}catch(emailError){console.warn('Brief message email unavailable',emailError);}
              setStatus(emailSent?'后台暂时繁忙，但留言已发送至接收邮箱。':'留言暂未提交成功，请稍后重试。','error');
            }finally{button.disabled=false;button.textContent='提交留言';}
          });

          loadSummary();
          window.setInterval(function(){if(!document.hidden)loadSummary();},60000);
          document.addEventListener('visibilitychange',function(){if(!document.hidden)loadSummary();});
          window.addEventListener('focus',loadSummary,{passive:true});
          })();
          '''
          Path('qilylean/daily-feedback.js').write_text(daily_feedback, encoding='utf-8')

          build_path = Path('scripts/build-daily-archive.js')
          build = build_path.read_text(encoding='utf-8')
          build = build.replace('暂无评分，期待你的第一颗星。', '累计评分 0｜五星好评 0，期待你的第一颗星。')
          build = build.replace('<div class="brief-inline-message-heading"><strong>留言交流</strong>', '<div class="brief-inline-message-heading"><strong>留言交流 <b data-comment-count>0</b></strong>')
          build = build.replace('评分与好／差评仅展示汇总数据；留言不会在公开页面展示', '评分、五星好评、好／差评及留言数量仅展示汇总数据；留言正文不会在公开页面展示')
          build = replace_once(build, '/qilylean/daily-feedback.js?v=20260729-brief-engagement-v1', '/qilylean/daily-feedback.js?v=20260729-social-counts-v2', 'daily feedback asset version')
          build_path.write_text(build, encoding='utf-8')

          validate_path = Path('scripts/validate-daily-archive.js')
          validate = validate_path.read_text(encoding='utf-8')
          validate = validate.replace('/qilylean/daily-feedback.js?v=20260729-brief-engagement-v1', '/qilylean/daily-feedback.js?v=20260729-social-counts-v2')
          validate = validate.replace("assert(page.includes('data-brief-message-form') && page.includes('称谓（选填）') && page.includes('联系方式（选填）'),", "assert(page.includes('data-brief-message-form') && page.includes('data-comment-count') && page.includes('称谓（选填）') && page.includes('联系方式（选填）'),")
          validate_path.write_text(validate, encoding='utf-8')

          for page_path in Path('qilylean/daily').glob('*.html'):
              page = page_path.read_text(encoding='utf-8')
              revised = page.replace('/qilylean/daily-feedback.js?v=20260729-brief-engagement-v1', '/qilylean/daily-feedback.js?v=20260729-social-counts-v2')
              revised = revised.replace('暂无评分，期待你的第一颗星。', '累计评分 0｜五星好评 0，期待你的第一颗星。')
              revised = revised.replace('<div class="brief-inline-message-heading"><strong>留言交流</strong>', '<div class="brief-inline-message-heading"><strong>留言交流 <b data-comment-count>0</b></strong>')
              revised = revised.replace('评分与好／差评仅展示汇总数据；留言不会在公开页面展示', '评分、五星好评、好／差评及留言数量仅展示汇总数据；留言正文不会在公开页面展示')
              if revised != page:
                  page_path.write_text(revised, encoding='utf-8')

          admin_js_path = Path('qily-admin.js')
          admin_js = admin_js_path.read_text(encoding='utf-8')
          old_admin = """    var count=Number(item.rating_count||0),average=Number(item.rating_average||0),total=count+Number(item.likes||0)+Number(item.dislikes||0);
              return '<article class=\"feedback-card\"><div><strong>'+escapeHtml(item.brief_date||'未标注日期')+'</strong><span>'+escapeHtml(item.brief_title||'未标注标题')+'</span></div>'
                +'<div class=\"feedback-numbers\"><b>'+escapeHtml(count?average.toFixed(1):'—')+'</b><small>五星均分／'+escapeHtml(count)+'次</small></div>'
                +'<div class=\"feedback-numbers\"><b>👍 '+escapeHtml(item.likes||0)+'　👎 '+escapeHtml(item.dislikes||0)+'</b><small>总互动 '+escapeHtml(total)+'</small></div>'"""
          new_admin = """    var count=Number(item.rating_count||0),average=Number(item.rating_average||0),five=Number(item.five_star_count||0),comments=Number(item.comments||0),total=Number(item.interaction_count||0)||(count+Number(item.likes||0)+Number(item.dislikes||0)+comments);
              return '<article class=\"feedback-card\"><div><strong>'+escapeHtml(item.brief_date||'未标注日期')+'</strong><span>'+escapeHtml(item.brief_title||'未标注标题')+'</span></div>'
                +'<div class=\"feedback-numbers\"><b>'+escapeHtml(count?average.toFixed(1):'—')+'</b><small>平均分／'+escapeHtml(count)+'次 · 五星 '+escapeHtml(five)+'</small></div>'
                +'<div class=\"feedback-numbers\"><b>👍 '+escapeHtml(item.likes||0)+'　👎 '+escapeHtml(item.dislikes||0)+'　💬 '+escapeHtml(comments)+'</b><small>累计互动 '+escapeHtml(total)+'</small></div>'"""
          admin_js = replace_once(admin_js, old_admin, new_admin, 'admin feedback cards')
          admin_js_path.write_text(admin_js, encoding='utf-8')

          admin_html_path = Path('admin.html')
          admin_html = admin_html_path.read_text(encoding='utf-8')
          admin_html = admin_html.replace('按评分、好评与差评总互动排序', '按评分、五星好评、点赞、差评与留言总互动排序')
          admin_html = admin_html.replace('/qily-admin.js?v=20260729-brief-engagement-v2', '/qily-admin.js?v=20260729-social-counts-v3')
          admin_html_path.write_text(admin_html, encoding='utf-8')

          deploy_path = Path('.github/workflows/deploy-worker.yml')
          deploy = deploy_path.read_text(encoding='utf-8')
          deploy = deploy.replace("healthData.build_version !== 'v1.6.0-brief-engagement'", "healthData.build_version !== 'v1.6.1-social-counts'")
          deploy = deploy.replace("['rating_average', 'rating_count', 'likes', 'dislikes']", "['rating_average', 'rating_count', 'five_star_count', 'likes', 'dislikes', 'comments', 'interaction_count']")
          deploy_path.write_text(deploy, encoding='utf-8')
          PY

      - name: Validate upgraded files
        shell: bash
        run: |
          node --check cloudflare-worker/worker.js
          node --check qilylean/daily-feedback.js
          node --check qily-admin.js
          grep -q "v1.6.1-social-counts" cloudflare-worker/worker.js
          grep -q "data-social-comment-count" qilylean/daily-feedback.js
          grep -q "data-comment-count" qilylean/daily/2026-07-29.html
          grep -q "20260729-social-counts-v2" qilylean/daily/2026-07-29.html
          grep -q "five_star_count" qily-admin.js

      - name: Commit and publish
        shell: bash
        run: |
