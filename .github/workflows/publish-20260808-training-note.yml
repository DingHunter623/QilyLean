name: Publish 2026-08-08 training note

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20260808-training-note.yml"
      - "scripts/publish-20260808-training-note.js"
      - "qilylean/training/2026-08-08.html"
      - "qilylean/assets/training-2026-08-08.svg"
  workflow_run:
    workflows: ["Publish early career history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-20260808-training-note-main
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve original brief and publish training note supplement
        run: |
          node --check scripts/publish-20260808-training-note.js
          node scripts/publish-20260808-training-note.js
          grep -F '异常不过夜：从 Andon 暴露、分层响应到复发验证，建立现场异常闭环' qilylean/daily-insights.html
          grep -F 'data-brief-training-note="2026-08-08"' qilylean/daily-insights.html
          grep -F '/qilylean/training/2026-08-08.html' qilylean/daily-insights.html
          git diff --check
      - name: Commit supplemental directory entry
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Training note supplement is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qilylean/daily-insights.html
          git commit -m "build: publish 2026-08-08 training note supplement [skip ci]"
          git push origin HEAD:main
