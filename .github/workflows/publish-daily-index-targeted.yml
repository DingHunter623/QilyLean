name: Targeted latest brief publication sync

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publish-daily-index-targeted.yml"
      - ".github/scripts/sync-latest-brief-20260803.py"
      - "qilylean/daily/**.html"
      - "qilylean/assets/daily-*.svg"

permissions:
  contents: write

jobs:
  sync-latest-brief:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize publication indexes
        run: python .github/scripts/sync-latest-brief-20260803.py

      - name: Commit targeted publication files
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          files=(
            index.html
            knowledge/index.html
            qilylean/latest-brief.js
            qilylean/site-data.json
            qilylean/daily-insights.html
            qilylean/daily/index.json
            qilylean/daily/2026-08-02.html
            qilylean/daily/terminology-audit-latest.json
            sitemap.xml
          )
          git diff --check
          if git diff --quiet -- "${files[@]}"; then
            echo "Latest brief publication metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "build: publish 2026-08-03 brief across indexes [skip ci]"
          git push origin "HEAD:${BRANCH}"
