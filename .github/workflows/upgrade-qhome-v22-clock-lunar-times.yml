name: Release QilyLean Home v2.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upgrade-qhome-v22-clock-lunar-times.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NEW_APK: QilyLean_Home_Universal_v2.2.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source and website modules
        run: python3 scripts/release-qhome-v22.py prepare

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and validate APK
        run: |
          set -euo pipefail
          gradle -p android/qilylean-home :app:assembleDebug --stacktrace 2>&1 | tee qhome-v22-build.log
          cp android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk "$NEW_APK"
          test -s "$NEW_APK"
          {
            echo
            echo '===== AAPT BADGING ====='
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$NEW_APK"
          } | tee -a qhome-v22-build.log
          grep -q "versionCode='7'" qhome-v22-build.log
          grep -q "versionName='2.2.0-clock-lunar-week-times'" qhome-v22-build.log
          grep -q "application-label:'QilyLean Home'" qhome-v22-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qhome-v22-build-diagnostics
          path: qhome-v22-build.log
          if-no-files-found: warn

      - name: Finalize release metadata
        run: |
          set -euo pipefail
          HOME_SHA256="$(sha256sum "$NEW_APK" | awk '{print $1}')"
          python3 scripts/release-qhome-v22.py finalize --apk "$NEW_APK" --sha256 "$HOME_SHA256"

      - name: Commit and publish release
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java \
            android/qilylean-home/app/build.gradle \
            android/qilylean-home/README.md \
            .github/workflows/build-qilylean-home.yml \
            capabilities/index.html \
            tools/times26001/index.html \
            "$NEW_APK" \
            QilyLean_Home_Universal_v2.2.sha256.txt
          git commit -m 'feat: release QilyLean Home v2.2 with seconds lunar week and Times26001'
          git push origin HEAD:main
