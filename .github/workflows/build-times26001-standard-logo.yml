name: Build Times26001 standard website logo APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-times26001-standard-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'

      - name: Replace top logo with website standard logo
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path('Times26001-Android-v1.1.13-Location-Fix.apk')
          target = Path('/tmp/Times26001-unsigned.apk')
          logo = Path('assets/brand/qilylean-logo.svg').read_bytes()
          js_path = 'assets/public/assets/index-CwdlYVYK.js'
          css_path = 'assets/public/assets/index-P___uYFs.css'
          logo_path = 'assets/public/assets/qilylean-header-logo.svg'
          old_logo = b'qilylean-app-icon-BvtNbU8q.png'
          new_logo = b'qilylean-header-logo.svg'
          old_css = b'.appLogo{width:38px;height:38px;flex:0 0 38px;border-radius:10px;object-fit:cover;box-shadow:0 2px 10px #0000002e}'
          new_css = b'.appLogo{width:178px;height:38px;flex:0 0 178px;border-radius:0;object-fit:contain;object-position:left center;box-shadow:none}'

          with ZipFile(source, 'r') as zin, ZipFile(target, 'w', ZIP_DEFLATED) as zout:
              found_js = found_css = False
              for item in zin.infolist():
                  if item.filename.startswith('META-INF/'):
                      continue
                  data = zin.read(item.filename)
                  if item.filename == js_path:
                      if old_logo not in data:
                          raise SystemExit('old top logo reference missing')
                      data = data.replace(old_logo, new_logo)
                      found_js = True
                  elif item.filename == css_path:
                      if old_css not in data:
                          raise SystemExit('old top logo CSS missing')
                      data = data.replace(old_css, new_css)
                      found_css = True
                  zout.writestr(item, data)
              if not found_js or not found_css:
                  raise SystemExit('Times26001 topbar assets not patched')
              zout.writestr(logo_path, logo)

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/times26001-logo.keystore -storepass QilyLean26001 -keypass QilyLean26001 -alias times26001-logo -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=QilyLean, OU=Times26001, O=QilyLean, C=CN'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 /tmp/Times26001-unsigned.apk /tmp/Times26001-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/times26001-logo.keystore --ks-key-alias times26001-logo --ks-pass pass:QilyLean26001 --key-pass pass:QilyLean26001 --out Times26001-Android-v1.1.13-Standard-Website-Logo.apk /tmp/Times26001-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Times26001-Android-v1.1.13-Standard-Website-Logo.apk
          unzip -p Times26001-Android-v1.1.13-Standard-Website-Logo.apk assets/public/assets/index-CwdlYVYK.js | grep -q 'qilylean-header-logo.svg'
          unzip -p Times26001-Android-v1.1.13-Standard-Website-Logo.apk assets/public/assets/index-P___uYFs.css | grep -q 'width:178px'
          unzip -p Times26001-Android-v1.1.13-Standard-Website-Logo.apk assets/public/assets/qilylean-header-logo.svg | grep -q 'QilyLean｜启力精益'
          sha256sum Times26001-Android-v1.1.13-Standard-Website-Logo.apk > SHA256SUMS.txt
          cp SHA256SUMS.txt Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt

      - name: Synchronize website Times26001 modules
        shell: python
        run: |
          from pathlib import Path
          import json, re

          apk = 'Times26001-Android-v1.1.13-Standard-Website-Logo.apk'
          sha = 'Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt'
          targets = [
              'tools/times26001/index.html',
              'capabilities/index.html',
              'app-download-share-v1.js',
              'times26001-home-card.js',
              'assets/tools/times26001-overview.svg',
              'app-support/index.html',
              'app-store/times26001/README.md',
          ]
          apk_pattern = r'Times26001-Android-v1\\.1\\.\\d+(?:-[A-Za-z0-9]+)*\\.apk'
          sha_pattern = r'Times26001-Android-v1\\.1\\.\\d+(?:-[A-Za-z0-9]+)*\\.sha256\\.txt'
          warning = '如覆盖安装失败，请先备份必要信息后卸载旧版；卸载会清除本机闹钟、设置及测时记录。'
          for name in targets:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(apk_pattern, apk, s)
              s = re.sub(sha_pattern, sha, s)
              s = s.replace('天气定位可靠性修正版', '官网标准LOGO统一修正版')
              s = s.replace('定位可靠性修正版', '官网标准LOGO统一修正版')
              s = s.replace('界面精简与大字版', '官网标准LOGO统一修正版')
              if name == 'tools/times26001/index.html' and warning not in s:
                  notice = '<div class="tool-note"><strong>安装提示：</strong>' + warning + '</div>'
                  s = s.replace('</div></section>\n\n</main>', notice + '</div></section>\n\n</main>')
              if name == 'app-store/times26001/README.md' and warning not in s:
                  s += '\\n> 安装提示：' + warning + '\\n'
              p.write_text(s, encoding='utf-8')

          manifest = Path('app-release-manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['updatedAt'] = '2026-08-13'
          app = data['apps']['times26001']
          app['publicRelease'].update(
              versionName='1.1.13',
              versionCode=16,
              apk='/' + apk,
              sha256='/' + sha,
              label='当前官网安装包（官网标准LOGO统一修正版）'
          )
          app['latestBuild'].update(
              versionName='1.1.13',
              versionCode=16,
              status='顶部LOGO已统一为官网QilyLean｜启力精益横版标准；保留天气定位可靠性修正'
          )
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')

          checks = ['tools/times26001/index.html','capabilities/index.html','times26001-home-card.js','app-release-manifest.json']
          for name in checks:
              text = Path(name).read_text(encoding='utf-8')
              if apk not in text:
                  raise SystemExit(f'new Times26001 APK link missing in {name}')
          if warning not in Path('tools/times26001/index.html').read_text(encoding='utf-8'):
              raise SystemExit('Times26001 installation warning missing from product page')

      - name: Publish APK and website synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add Times26001-Android-v1.1.13-Standard-Website-Logo.apk \
            Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt \
            tools/times26001/index.html capabilities/index.html \
            app-download-share-v1.js times26001-home-card.js \
            assets/tools/times26001-overview.svg app-support/index.html \
            app-store/times26001/README.md app-release-manifest.json
          git commit -m 'release: publish Times26001 standard website logo APK'
          git push origin HEAD:main

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Times26001-v1.1.13-Standard-Website-Logo
          path: |
            Times26001-Android-v1.1.13-Standard-Website-Logo.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
