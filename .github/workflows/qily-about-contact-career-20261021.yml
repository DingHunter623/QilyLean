name: Complete QilyLean dual-site About navigation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-about-nav-footer-v1.js'
      - '.github/workflows/qily-about-contact-career-20261021.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qily-about-contact-career-closure-20261021
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize two-site shell, China footer and nested About menu
        run: |
          node scripts/materialize-public-shell-first-paint-v1.js
          node scripts/materialize-cn-footer-actions-v2.js
          node scripts/materialize-about-nav-footer-v1.js
      - name: Verify navigation, About assets and archived career routing
        run: |
          node scripts/materialize-about-nav-footer-v1.js --check
          node scripts/validate-about-contact-career-20261021.js
          node scripts/validate-dock-flow-navigation-v56.js
          node scripts/validate-sitewide-vi-unification.js
          node --check site-navigation-core.js
          node --check site-dock-share-runtime-v1.js
          git diff --check
      - name: Commit all static pages for actual production deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'cn-site/assets/cn-footer-actions-v1.css' 'cn-site/assets/cn-footer-actions-v1.js'
          if ! git diff --cached --quiet; then
            git commit -m 'build(about): apply career hierarchy and footer to all pages [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
