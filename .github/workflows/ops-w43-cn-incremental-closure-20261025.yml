name: One-time W43 CN incremental closure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-w43-cn-incremental-closure-20261025.yml'
permissions:
  contents: read
  actions: write
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Stop superseded full CN release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '40202970001'
        run: |
          set -euo pipefail
          status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "completed" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/force-cancel"
          fi
          for i in $(seq 1 30); do
            status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            [ "$status" = "completed" ] && exit 0
            sleep 2
          done
          echo "Superseded run did not stop" >&2
          exit 1

      - name: Materialize current CN source-content output
        run: |
          set -euo pipefail
          python3 scripts/test-cn-source-content-parity.py
          bash cn-site/scripts/materialize-practice-assets.sh
          node scripts/validate-sitewide-vi-unification.js
          test -s cn-site/briefs/archive/2026-10-25/index.html
          test -s cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css
          test -s cn-site/assets/source-content/site-vi-standard-v4.css
          grep -Fq 'table:not(.w43-table)' cn-site/assets/source-content/site-vi-standard-v4.css
          grep -Fq 'word-break:break-all!important' cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css

      - name: Configure SSH
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts

      - name: Build atomic incremental release from current
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn)
          RELEASE_ID="w43-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          META="$(ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail
          RELEASE_ID="$1"
          SITE_ROOT=/var/www/qilylean-cn
          exec 9>"$SITE_ROOT/.content-deploy.lock"
          flock -w 120 9
          PREVIOUS="$(readlink -f "$SITE_ROOT/current")"
          EXPECTED="$SITE_ROOT/releases/$RELEASE_ID"
          test -d "$PREVIOUS"
          test ! -e "$EXPECTED"
          mkdir -p "$EXPECTED"
          cp -al "$PREVIOUS/." "$EXPECTED/"
          rm -f             "$EXPECTED/briefs/archive/2026-10-25/index.html"             "$EXPECTED/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"             "$EXPECTED/assets/source-content/site-vi-standard-v4.css"
          mkdir -p             "$EXPECTED/briefs/archive/2026-10-25"             "$EXPECTED/assets/brief-visual-source/qilylean/daily/assets"             "$EXPECTED/assets/source-content"
          printf '%s|%s\n' "$PREVIOUS" "$EXPECTED"
          REMOTE
          )"
          PREVIOUS="${META%%|*}"
          EXPECTED="${META#*|}"
          echo "W43_PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
          echo "W43_EXPECTED=$EXPECTED" >> "$GITHUB_ENV"
          scp -q "${OPTS[@]}" cn-site/briefs/archive/2026-10-25/index.html "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/briefs/archive/2026-10-25/index.html"
          scp -q "${OPTS[@]}" cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"
          scp -q "${OPTS[@]}" cn-site/assets/source-content/site-vi-standard-v4.css "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/assets/source-content/site-vi-standard-v4.css"
          ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$EXPECTED'" <<'REMOTE'
          set -euo pipefail
          EXPECTED="$1"
          SITE_ROOT=/var/www/qilylean-cn
          grep -Fq 'table:not(.w43-table)' "$EXPECTED/assets/source-content/site-vi-standard-v4.css"
          grep -Fq 'word-break:break-all!important' "$EXPECTED/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"
          NEXT="$SITE_ROOT/.current-w43-${EXPECTED##*/}"
          ln -sfn "$EXPECTED" "$NEXT"
          mv -Tf "$NEXT" "$SITE_ROOT/current"
          sudo nginx -t
          test "$(readlink -f "$SITE_ROOT/current")" = "$EXPECTED"
          test "$(curl --silent --show-error --connect-timeout 5 --max-time 20 --resolve qilylean.cn:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://qilylean.cn/briefs/archive/2026-10-25/)" = 200
          REMOTE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify W43 text containment on both production domains
        env:
          QILY_INT_BASE: https://qilylean.com
          QILY_CN_BASE: https://qilylean.cn
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test scripts/dual-site-mobile-axis-20261025.spec.js --reporter=line --workers=1 --trace=on

      - name: Roll back incremental release on failure
        if: failure() && env.W43_PREVIOUS != ''
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$W43_PREVIOUS' '$W43_EXPECTED'" <<'REMOTE'
          set -euo pipefail
          PREVIOUS="$1"
          EXPECTED="$2"
          SITE_ROOT=/var/www/qilylean-cn
          if [ "$(readlink -f "$SITE_ROOT/current")" = "$EXPECTED" ]; then
            NEXT="$SITE_ROOT/.current-w43-rollback"
            ln -sfn "$PREVIOUS" "$NEXT"
            mv -Tf "$NEXT" "$SITE_ROOT/current"
            sudo nginx -t
          fi
          REMOTE

      - name: Upload W43 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w43-production-closure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30
