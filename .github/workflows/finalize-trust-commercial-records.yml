name: Finalize static public pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/materialize-static-core-pages.js"
      - "scripts/prepare-static-source-rematerialization.js"
      - "scripts/normalize-static-source-output.js"
      - "scripts/remove-legacy-home-schema.js"
      - "scripts/refresh-static-core-search-index.js"
      - "scripts/finalize-trust-commercial-records.js"
      - "scripts/patch-finalizer-validation.js"
      - "scripts/enforce-final-trust-output.js"
      - ".github/workflows/finalize-trust-commercial-records.yml"
      - "index.html"
      - "cooperation/index.html"
      - "qilylean/daily-insights.html"
      - "projects/index.html"
      - "trust/index.html"
      - "qilylean/ding-qili-knowledge-base.json"
      - "qilylean/ding-qili-digital-human.md"
      - "qilylean/site-data.json"
      - "qilylean/site-search-index.json"
      - "site-brand-trust-v1.js"
      - "site-information-architecture-v1.js"
      - "site-information-architecture-v1.css"
      - "site-static-core-interactions-v1.js"
      - "site-navigation.js"
      - "sitemap.xml"
      - "sitemap-core.xml"
      - "projects/qilylean-commercial-deliveries/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/materialize-static-core-pages.js"
      - "scripts/prepare-static-source-rematerialization.js"
      - "scripts/normalize-static-source-output.js"
      - "scripts/remove-legacy-home-schema.js"
      - "scripts/refresh-static-core-search-index.js"
      - "scripts/finalize-trust-commercial-records.js"
      - "scripts/patch-finalizer-validation.js"
      - "scripts/enforce-final-trust-output.js"
      - ".github/workflows/finalize-trust-commercial-records.yml"
      - "index.html"
      - "cooperation/index.html"
      - "qilylean/daily-insights.html"
      - "site-information-architecture-v1.js"
      - "site-information-architecture-v1.css"
      - "site-static-core-interactions-v1.js"
  workflow_run:
    workflows: ["Sync unified site metadata", "Build daily engineering brief archive"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-final-static-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request or push revision
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out current main after upstream generators
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate finalizer scripts
        shell: bash
        run: |
          node --check scripts/patch-finalizer-validation.js
          node --check scripts/finalize-trust-commercial-records.js
          node --check scripts/enforce-final-trust-output.js
          node --check scripts/prepare-static-source-rematerialization.js
          node --check scripts/materialize-static-core-pages.js
          node --check scripts/normalize-static-source-output.js
          node --check scripts/remove-legacy-home-schema.js
          node --check scripts/refresh-static-core-search-index.js
          node --check site-static-core-interactions-v1.js

      - name: Normalize finalizer validation contract
        run: node scripts/patch-finalizer-validation.js

      - name: Refresh upstream metadata and search assets first
        shell: bash
        run: |
          if test -f scripts/build-trust-search-sync.js; then
            node scripts/build-trust-search-sync.js
          fi

      - name: Apply trust wording archive and commercial-record rules
        run: QILY_SKIP_INTERNAL_VALIDATE=1 node scripts/finalize-trust-commercial-records.js

      - name: Enforce final cumulative-result disclosures
        run: node scripts/enforce-final-trust-output.js

      - name: Materialize final public HTML and final search entries
        shell: bash
        run: |
          node scripts/prepare-static-source-rematerialization.js
          node scripts/materialize-static-core-pages.js
          node scripts/normalize-static-source-output.js
          node scripts/remove-legacy-home-schema.js
          node scripts/normalize-static-source-output.js
          node scripts/refresh-static-core-search-index.js

      - name: Verify deterministic repeat execution
        shell: bash
        run: |
          git diff -- index.html cooperation/index.html qilylean/daily-insights.html qilylean/site-search-index.json qilylean/site-data.json > /tmp/static-first.diff
          node scripts/prepare-static-source-rematerialization.js
          node scripts/materialize-static-core-pages.js
          node scripts/normalize-static-source-output.js
          node scripts/remove-legacy-home-schema.js
          node scripts/normalize-static-source-output.js
          node scripts/refresh-static-core-search-index.js
          git diff -- index.html cooperation/index.html qilylean/daily-insights.html qilylean/site-search-index.json qilylean/site-data.json > /tmp/static-second.diff
          cmp /tmp/static-first.diff /tmp/static-second.diff

      - name: Validate final static public output
        shell: bash
        run: |
          test -s index.html
          test -s cooperation/index.html
          test -s qilylean/daily-insights.html
          test -s projects/qilylean-commercial-deliveries/index.html
          test -s projects/qilylean-commercial-deliveries/records.json
          test -s projects/qilylean-commercial-deliveries/delivery-record-template.html
          test -s projects/qilylean-commercial-deliveries/review-authorization-template.html
          grep -q 'QILY-HOME-STATIC-COMMERCIAL:START' index.html
          grep -q 'data-qily-static-source="home-core-v1"' index.html
          grep -q '把复杂制造问题，转化为可验证的交付结果' index.html
          grep -q '新工厂／新产线规划' index.html
          grep -q '精益改善项目交付' index.html
          grep -q '目视化项目设计与实施' index.html
          grep -q 'qilyInformationArchitectureStylesheet' index.html
          grep -q 'qilyStaticCoreInteractions' index.html
          grep -q '非QilyLean品牌独立营收' index.html
          grep -q 'QILY-COOPERATION-STATIC-SUMMARY:START' cooperation/index.html
          grep -q '分阶段付款' cooperation/index.html
          grep -q '验收边界' cooperation/index.html
          grep -q '非QilyLean品牌独立营收' cooperation/index.html
          grep -q 'QILY-ARCHIVE-DISCLOSURE:START' qilylean/daily-insights.html
          grep -q 'QILY-ARCHIVE-STATIC-SCHEMA:START' qilylean/daily-insights.html
          grep -q '不等同于网页首次公开发布日期' qilylean/daily-insights.html
          grep -q '当前公开记录：' projects/qilylean-commercial-deliveries/index.html
          grep -q '不会被冒充为QilyLean商业订单' projects/qilylean-commercial-deliveries/index.html
          grep -q '没有明确书面授权，不公开客户评价' projects/qilylean-commercial-deliveries/review-authorization-template.html
          grep -q 'qilylean-commercial-deliveries' sitemap.xml
          ! grep -Eq '超千万元累计(项目)?改善收益' index.html cooperation/index.html
          ! grep -q 'class="group-label">职能标签' index.html
          ! grep -q '<ul class="tags">' index.html
          node - <<'NODE'
          const fs = require('fs');
          const home = fs.readFileSync('index.html', 'utf8');
          const beforeCore = home.split('QILY-HOME-STATIC-COMMERCIAL:START')[0];
          if (beforeCore.includes('<section class="assistant-panel" id="assistant">')) {
            throw new Error('AI assistant remains in the static homepage hero');
          }
          const schemas = Array.from(home.matchAll(/<script\s+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)).map((match) => {
            try { return JSON.parse(match[1]); } catch (error) { return null; }
          }).filter(Boolean);
          if (schemas.some((schema) => schema['@type'] === 'Person' && !Array.isArray(schema['@graph']))) {
            throw new Error('Legacy standalone Person schema remains');
          }
          const search = JSON.parse(fs.readFileSync('qilylean/site-search-index.json','utf8'));
          const root = search.entries.find((entry) => entry.url === '/');
          const cooperation = search.entries.find((entry) => entry.url === '/cooperation/');
          const daily = search.entries.find((entry) => entry.url === '/qilylean/daily-insights.html');
          if (!root || !root.text.includes('把复杂制造问题，转化为可验证的交付结果') || root.text.includes('职能标签')) throw new Error('Homepage search entry is stale');
          if (!cooperation || !cooperation.text.includes('分阶段付款') || cooperation.text.includes('超千万元累计项目改善收益')) throw new Error('Cooperation search entry is stale');
          if (!daily || !daily.text.includes('不等同于网页首次公开发布日期')) throw new Error('Daily archive search entry is stale');
          const records = JSON.parse(fs.readFileSync('projects/qilylean-commercial-deliveries/records.json','utf8'));
          if (!Array.isArray(records.records)) throw new Error('Commercial delivery records must be an array');
          if (!records.publicationPolicy) throw new Error('Commercial publication policy missing');
          NODE

      - name: Commit final static public pages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Final static public pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cooperation/index.html qilylean/daily-insights.html projects/index.html trust/index.html qilylean/ding-qili-knowledge-base.json qilylean/ding-qili-digital-human.md qilylean/site-data.json site-brand-trust-v1.js site-search.js qilylean/site-search-index.json sitemap.xml sitemap-core.xml projects/qilylean-commercial-deliveries
          git commit -m "build: publish final static public pages"
          git push
