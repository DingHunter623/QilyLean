name: Site regression poka-yoke and self-heal

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-regression-poka-yoke
  cancel-in-progress: true

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected site source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /**/*.html
            /**/*.css
            /**/*.js
            /**/*.py
            /**/*.sh
            /qilylean/c919-strategy-hero-approved-20260818.png
            /qilylean/c919-strategy-hero-v13.png
            /.github/workflows/*.yml
            /docs/*.md

      - name: Ensure approved C919 v13 artwork is present
        shell: bash
        run: |
          IMAGE='qilylean/c919-strategy-hero-v13.png'
          SHA='220e893d9db3dedaa7f4c95e57ef30e8af522c9bfcea0da19f4506f496fc306a'
          mkdir -p qilylean
          if [ -f "$IMAGE" ] && echo "$SHA  $IMAGE" | sha256sum -c - >/dev/null 2>&1; then
            echo 'Approved C919 v13 artwork already present.'
          else
            curl -fL --retry 3 --retry-delay 2 -o "$IMAGE" 'https://at.adobe.com/e3Mx32HIwzWLFAUb'
            echo "$SHA  $IMAGE" | sha256sum -c -
          fi

      - name: Apply protected six-core + exact approved C919 baseline and validate
        shell: bash
        run: |
          node scripts/enforce-c919-home-hero.js
          node scripts/apply-site-poka-yoke-v2.js
          node scripts/enforce-six-core-static-source.js
          node scripts/enforce-c919-home-hero.js
          node scripts/enforce-six-core-navigation.js
          node scripts/site-regression-guard-six-core.js
          node scripts/site-regression-guard-c919-hero.js
          node scripts/site-friend-links-layout-guard.js
          python3 scripts/normalize-six-capability-pricing-20260809.py
          git diff --check

      - name: Commit automatic self-heal when required
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            node scripts/enforce-c919-home-hero.js
            node scripts/apply-site-poka-yoke-v2.js
            node scripts/enforce-six-core-static-source.js
            node scripts/enforce-c919-home-hero.js
            node scripts/enforce-six-core-navigation.js
            node scripts/site-regression-guard-six-core.js
            node scripts/site-regression-guard-c919-hero.js
            node scripts/site-friend-links-layout-guard.js
            python3 scripts/normalize-six-capability-pricing-20260809.py
            git diff --check

            if git diff --quiet; then
              echo "Protected six-core + exact approved C919 homepage baseline is healthy; no self-heal required."
              exit 0
            fi

            git add -A
            git commit -m "guard: restore six-core, approved C919 v13, operating axis and Friend Links baseline [skip ci]"

            if git push origin HEAD:main; then
              echo "Protected six-core + approved C919 v13 homepage baseline automatically restored."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Automatic self-heal could not publish after 3 attempts."
              exit 1
            fi

            git fetch origin main --depth=1 --filter=blob:none
            git reset --hard origin/main
            IMAGE='qilylean/c919-strategy-hero-v13.png'
            SHA='220e893d9db3dedaa7f4c95e57ef30e8af522c9bfcea0da19f4506f496fc306a'
            if [ ! -f "$IMAGE" ] || ! echo "$SHA  $IMAGE" | sha256sum -c - >/dev/null 2>&1; then
              curl -fL --retry 3 --retry-delay 2 -o "$IMAGE" 'https://at.adobe.com/e3Mx32HIwzWLFAUb'
              echo "$SHA  $IMAGE" | sha256sum -c -
            fi
          done
