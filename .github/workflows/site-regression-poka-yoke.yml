name: Site regression poka-yoke and self-heal

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-regression-poka-yoke
  cancel-in-progress: true

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected site source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /**/*.html
            /**/*.css
            /**/*.js
            /**/*.py
            /**/*.sh
            /qilylean/c919-strategy-hero.png
            /qilylean/c919-strategy-hero-v10.svg
            /qilylean/c919-patch-topleft-v10.webp
            /qilylean/c919-patch-tail-v10.webp
            /qilylean/c919-patch-bottomq-v10.webp
            /qilylean/c919-strategy-hero-v11.png
            /.github/workflows/*.yml
            /docs/*.md

      - name: Prepare standalone C919 rasterizer
        shell: bash
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends librsvg2-bin
          fi

      - name: Apply protected six-core + C919 baseline and validate
        shell: bash
        run: |
          node scripts/migrate-c919-enforcer-to-v11.js
          bash scripts/build-c919-raster-v11.sh
          node scripts/enforce-c919-home-hero.js
          node scripts/apply-site-poka-yoke-v2.js
          node scripts/enforce-six-core-static-source.js
          node scripts/enforce-c919-home-hero.js
          node scripts/enforce-six-core-navigation.js
          node scripts/site-regression-guard-six-core.js
          node scripts/site-regression-guard-c919-hero.js
          node scripts/site-friend-links-layout-guard.js
          python3 scripts/normalize-six-capability-pricing-20260809.py
          git diff --check

      - name: Commit automatic self-heal when required
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            node scripts/migrate-c919-enforcer-to-v11.js
            bash scripts/build-c919-raster-v11.sh
            node scripts/enforce-c919-home-hero.js
            node scripts/apply-site-poka-yoke-v2.js
            node scripts/enforce-six-core-static-source.js
            node scripts/enforce-c919-home-hero.js
            node scripts/enforce-six-core-navigation.js
            node scripts/site-regression-guard-six-core.js
            node scripts/site-regression-guard-c919-hero.js
            node scripts/site-friend-links-layout-guard.js
            python3 scripts/normalize-six-capability-pricing-20260809.py
            git diff --check

            if git diff --quiet; then
              echo "Protected six-core + C919 homepage baseline is healthy; no self-heal required."
              exit 0
            fi

            git add -A
            git commit -m "guard: restore six-core, standalone C919 PNG, operating axis and Friend Links baseline [skip ci]"

            if git push origin HEAD:main; then
              echo "Protected six-core + standalone C919 homepage baseline automatically restored."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Automatic self-heal could not publish after 3 attempts."
              exit 1
            fi

            git fetch origin main --depth=1 --filter=blob:none
            git reset --hard origin/main
          done
