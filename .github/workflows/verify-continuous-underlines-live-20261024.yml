name: Verify continuous underlines on real dual-site production
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-continuous-underlines-live-20261024.cjs'
      - '.github/workflows/verify-continuous-underlines-live-20261024.yml'
  workflow_run:
    workflows: ['Deploy QilyLean CN knowledge site']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qily-live-underline-proof
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare isolated browser validation
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Read-only verify ten live routes at desktop and phone widths
        run: node scripts/verify-continuous-underlines-live-20261024.cjs
      - name: Upload production CSS checks and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qily-continuous-underline-live-${{ github.run_id }}
          path: underline-production-evidence/
          if-no-files-found: warn
          retention-days: 30
