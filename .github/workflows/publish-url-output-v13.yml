name: Publish URL Output V14 path-safe no trailing slash

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-public-url-trailing-slash-v13.js'
      - 'scripts/repair-public-url-path-separator-v13.js'
      - 'scripts/publish-r2-clean-runtime-v3.js'
      - '.github/workflows/publish-url-output-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: url-output-v14-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize path-safe no-trailing-slash public URL policy
        run: |
          node scripts/remove-public-url-trailing-slash-v13.js
          node scripts/repair-public-url-path-separator-v13.js
          node scripts/publish-r2-clean-runtime-v3.js
          node scripts/remove-public-url-trailing-slash-v13.js
          node scripts/repair-public-url-path-separator-v13.js

      - name: Regenerate official homepage QR without trailing slash
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'qrcode>=7.4,<9'
          python - <<'PY'
          import qrcode
          import qrcode.image.svg
          target = 'https://qilylean.com'
          img = qrcode.make(
              target,
              image_factory=qrcode.image.svg.SvgPathImage,
              error_correction=qrcode.constants.ERROR_CORRECT_M,
              box_size=10,
              border=4,
          )
          img.save('qilylean/qilylean-home-qr.svg')
          print('QR payload:', target)
          PY

      - name: Validate URL V14 output contract
        shell: bash
        run: |
          node --check scripts/remove-public-url-trailing-slash-v13.js
          node --check scripts/repair-public-url-path-separator-v13.js
          node --check site-navigation.js
          node --check site-navigation-core.js
          python - <<'PY'
          from pathlib import Path
          import json, re

          core = Path('site-navigation-core.js').read_text(encoding='utf-8')
          wrapper = Path('site-navigation.js').read_text(encoding='utf-8')
          legacy = Path('site-navigation-legacy-20260802.js').read_text(encoding='utf-8')
          assert "var HOME_URL = 'https://qilylean.com';" in core
          assert 'var url = normalizePublicUrl(location.href);' in core
          assert '/site-navigation-legacy-20260802.js?v=20260814-url-v14' in wrapper
          assert '/site-navigation-core.js?v=20260814-url-v14' in legacy

          report = json.loads(Path('maintenance/public-url-output-v14.json').read_text(encoding='utf-8'))
          assert report['root_url'] == 'https://qilylean.com'
          assert report['site_navigation_cache_version'] == '20260814-url-v14'

          integrity = json.loads(Path('maintenance/public-url-path-integrity-v13.json').read_text(encoding='utf-8'))
          assert integrity['root_url'] == 'https://qilylean.com'

          qhome = Path('android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java')
          if qhome.exists():
              text = qhome.read_text(encoding='utf-8')
              assert 'webCard("官方网址", "https://qilylean.com", "https://qilylean.com")' in text

          # Root may not be slash-terminated in user/product output; subpaths must still keep hostname/path separator.
          malformed = re.compile(r'https://qilylean[.]com(?=[A-Za-z0-9])')
          standalone = re.compile(r'https://qilylean[.]com/(?=(?:["\'`<>\s),;\]}]|$))')
          bad=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('.git','.github','node_modules','.gradle','build','dist')):
                  continue
              if p.suffix.lower() not in {'.html','.htm','.json','.md','.txt','.java','.kt','.xml','.svg'}:
                  continue
              try: s=p.read_text(encoding='utf-8')
              except Exception: continue
              if malformed.search(s): bad.append(f'{p}: malformed host/path separator')
              if standalone.search(s): bad.append(f'{p}: standalone root still slash-terminated')
              if len(bad)>=30: break
          assert not bad, '\n'.join(bad)
          print('PASS URL V14: root URL no trailing slash, subpath separators intact, navigation cache chain V14.')
          PY

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A -- ':!.github'
          if git diff --cached --quiet; then
            echo 'No production changes.'
            exit 0
          fi
          git commit -m 'fix: enforce path-safe no-trailing-slash public URLs V14 [skip ci]'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $i failed; retrying"
            sleep $((i*3))
          done
          exit 1
