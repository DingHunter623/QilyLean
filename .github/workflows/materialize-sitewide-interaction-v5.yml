name: Materialize R6 static first-paint baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.html'
      - 'site-navigation.js'
      - 'site-navigation-core.js'
      - 'site-navigation-legacy-20260802.js'
      - 'site-music-persistent-navigation-v1.js'
      - 'site-native-prefetch-v1.js'
      - 'site-visual-geometry-v1.js'
      - 'site-floating-dock-standard-v1.css'
      - 'site-visual-governance-v2.css'
      - 'site-content-axis-v1.css'
      - 'site-home-hero-tune-v1.css'
      - 'scripts/enforce-r6-first-paint-performance.js'
      - 'scripts/site-regression-guard.js'
      - 'scripts/site-regression-guard-r6.js'
      - 'scripts/site-friend-links-layout-guard.js'
      - 'scripts/validate-sitewide-dock-arrow-v4.js'
      - '.github/workflows/materialize-sitewide-interaction-v5.yml'

permissions:
  contents: write

concurrency:
  group: materialize-r6-first-paint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate R6 production sources
        run: |
          node --check scripts/enforce-r6-first-paint-performance.js
          node --check scripts/site-regression-guard.js
          node --check scripts/site-regression-guard-r6.js
          node --check scripts/validate-sitewide-dock-arrow-v4.js
          node --check site-navigation.js
          node --check site-visual-geometry-v1.js
          node --check site-music-persistent-navigation-v1.js
          node --check site-native-prefetch-v1.js
          node scripts/validate-sitewide-dock-arrow-v4.js

      - name: Materialize R6 static first paint
        run: node scripts/enforce-r6-first-paint-performance.js

      - name: Run R6 regression guard
        run: |
          node scripts/site-regression-guard.js
          node scripts/validate-sitewide-dock-arrow-v4.js
          git diff --check

      - name: Verify deterministic idempotency
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/r6-before.diff
          node scripts/enforce-r6-first-paint-performance.js
          git diff --binary > /tmp/r6-after.diff
          cmp /tmp/r6-before.diff /tmp/r6-after.diff

      - name: Verify R6 first-paint performance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/site-visual-governance-v2.css?v=20260819-readable-floor-plus1-v6' index.html
          grep -q '/site-content-axis-v1.css?v=20260819-unified-content-axis-v1' index.html
          grep -q '/site-home-hero-tune-v1.css?v=20260819-home-hero-align-v2' index.html
          grep -q 'qilyR6HomeFirstPaintParity' index.html
          grep -q '/site-native-prefetch-v1.js?v=20260819-r6-native-prefetch-v1' index.html
          grep -q '/site-floating-dock-standard-v1.css?v=20260819-sitewide-dock-v1' site-navigation.js
          grep -q '/site-visual-geometry-v1.js?v=20260819-arrow-geometry-v4' site-navigation.js
          grep -q 'convertSeparateArrows' site-visual-geometry-v1.js
          grep -q 'normalizeLeanBidirectionalScene' site-visual-geometry-v1.js
          ! grep -q 'JOIN_OVERLAP' site-visual-geometry-v1.js
          ! grep -q 'DOMParser' site-native-prefetch-v1.js
          ! grep -q 'history.pushState' site-native-prefetch-v1.js

      - name: Commit only genuine R6 materialization changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'R6 baseline is already fully materialized; zero generated diff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R6: materialize static first paint and native prefetch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
