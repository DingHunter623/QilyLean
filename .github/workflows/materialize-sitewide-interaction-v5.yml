name: Materialize R6 static first-paint baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.html'
      - 'site-navigation.js'
      - 'site-navigation-core.js'
      - 'site-navigation-legacy-20260802.js'
      - 'site-music-persistent-navigation-v1.js'
      - 'site-native-prefetch-v1.js'
      - 'site-visual-geometry-v1.js'
      - 'site-floating-dock-standard-v1.css'
      - 'site-visual-governance-v2.css'
      - 'site-content-axis-v1.css'
      - 'site-home-hero-tune-v1.css'
      - 'scripts/enforce-r6-first-paint-performance.js'
      - 'scripts/site-regression-guard.js'
      - 'scripts/site-regression-guard-r6.js'
      - 'scripts/site-friend-links-layout-guard.js'
      - 'scripts/validate-sitewide-dock-arrow-v4.js'
      - 'scripts/validate-home-hero-dock-snapback-v1.js'
      - '.github/workflows/materialize-sitewide-interaction-v5.yml'

permissions:
  contents: read

concurrency:
  group: materialize-r6-first-paint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate current V31 shell sources
        run: |
          node --check scripts/validate-public-shell-v31.js
          node --check scripts/validate-home-hero-dock-snapback-v1.js
          node --check site-navigation.js
          node --check site-navigation-core.js

      - name: Validate current V31 first-paint and Dock contracts
        run: |
          node scripts/validate-public-shell-v31.js
          node scripts/validate-home-hero-dock-snapback-v1.js
          git diff --exit-code
          git diff --check
