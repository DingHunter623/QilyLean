name: Repair CN Youdao translation service

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: 'Read-only inspection of active translation routing'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize with the existing CN deployment, which also installs this service.
concurrency:
  group: qilylean-cn-production-v12
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.inspect_only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved translation service
        uses: actions/checkout@v4

      - name: Test translation service
        run: python3 services/cn-translation/test_server.py

      - name: Prepare isolated CI browser
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CI browser dependencies outside repository
        run: |
          npm install --prefix "$RUNNER_TEMP/cn-browser" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/cn-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Preflight, install, and verify translation service only
        shell: bash
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
          YOUDAO_APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          YOUDAO_APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          test -n "$YOUDAO_APP_KEY"
          test -n "$YOUDAO_APP_SECRET"
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          STAGE="/tmp/qily-cn-translation-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_DIR="$(mktemp -d "$RUNNER_TEMP/qily-cn-translation-ssh.XXXXXX")"
          SSH_OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/key")
          cleanup() {
            local status=$?
            trap - EXIT
            if test -n "${TUNNEL_PID:-}"; then kill "$TUNNEL_PID" 2>/dev/null || true; fi
            if test -n "${REPAIR_PID:-}"; then
              ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "sudo touch '$STAGE/browser-failed'" || true
              wait "$REPAIR_PID" || true
            fi
            # A disconnected repair retains its lock until its rollback/cleanup finishes.
            if test -s "$SSH_DIR/key" && test -s "$SSH_DIR/known_hosts"; then
              timeout 30s ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "sudo flock -n /run/lock/qily-cn-translation-repair.lock rm -rf '$STAGE'" || true
            fi
            rm -rf "$SSH_DIR"
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"
          ssh-keyscan -T 10 -H "$CN_PREPROD_HOST" > "$SSH_DIR/known_hosts"

          verify_browser() {
            # Only the CI browser uses this transport, to place its egress in China.
            # No forwarding/service/browser software is installed on production.
            ssh "${SSH_OPTS[@]}" -o ExitOnForwardFailure=yes -N -D 127.0.0.1:10880 "$USER_NAME@$CN_PREPROD_HOST" &
            TUNNEL_PID=$!
            for attempt in $(seq 1 20); do
              if nc -z 127.0.0.1 10880; then break; fi
              kill -0 "$TUNNEL_PID"
              sleep 1
            done
            env -u YOUDAO_APP_KEY -u YOUDAO_APP_SECRET -u CN_PREPROD_SSH_KEY MAINLAND_BROWSER_PROXY=socks5://127.0.0.1:10880 PLAYWRIGHT_PATH="$RUNNER_TEMP/cn-browser/node_modules/playwright" BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/cn-browser-evidence" BROWSER_INSPECT_ONLY="$INSPECT_ONLY" node services/cn-translation/browser-smoke.cjs
          }

          if test "$INSPECT_ONLY" = true; then
            ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" 'sudo python3 -' <<'DIAG'
          import json, pathlib, re, subprocess, urllib.parse, urllib.request
          config = subprocess.check_output(['nginx', '-T'], stderr=subprocess.DEVNULL).decode()
          sections = re.split(r'# configuration file ([^\n]+):\n', config)
          routes = []
          for index in range(1, len(sections), 2):
              path, text = sections[index:index+2]
              for match in re.finditer(r'location\s+(?:=\s+|\^~\s+)?[^\n{]*translate[^\n{]*\{', text):
                  end, depth = match.end(), 1
                  while depth and end < len(text):
                      depth += (text[end] == '{') - (text[end] == '}')
                      end += 1
                  block = text[match.start():end]
                  proxy = re.search(r'proxy_pass\s+([^;]+);', block)
                  origin = None
                  if proxy:
                      url = urllib.parse.urlsplit(proxy.group(1).strip())
                      origin = str(url.scheme) + '://' + str(url.hostname) + (':' + str(url.port) if url.port else '')
                  routes.append({'config_file': path, 'location': block.split('{')[0].strip(), 'proxy_origin': origin})
          state = subprocess.run(['systemctl', 'is-active', 'qilylean-cn-translation'], capture_output=True, text=True).stdout.strip()
          print(json.dumps({'active_translation_routes': routes, 'service_state': state}, ensure_ascii=False))
          errors = []
          log = pathlib.Path('/var/log/nginx/error.log')
          for line in (log.read_text(errors='replace').splitlines()[-1000:] if log.exists() else []):
              if '/translate' not in line:
                  continue
              failure = re.search(r'(connect\(\) failed \([^)]*\)|upstream timed out|upstream prematurely closed connection)', line)
              upstream = re.search(r'upstream: "(https?://[^/"]+)', line)
              if failure:
                  errors.append({'failure': failure.group(1), 'upstream': upstream.group(1) if upstream else None})
          print(json.dumps({'recent_translation_upstream_errors': errors[-5:]}))
          for url in ('http://127.0.0.1:8081/health', 'https://qilylean.cn/translate'):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      print(json.dumps({'url': url, 'status': response.status}))
              except Exception as error:
                  print(json.dumps({'url': url, 'error': str(error)}))
          DIAG
            verify_browser
            exit 0
          fi

          cat > "$SSH_DIR/repair.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          STAGE="$1"
          test "$(id -u)" = 0
          [[ "$STAGE" =~ ^/tmp/qily-cn-translation-repair-[0-9]+-[0-9]+$ ]]
          exec 9>/run/lock/qily-cn-translation-repair.lock
          flock -w 60 9
          BACKUP="$(mktemp -d /tmp/qily-cn-translation-rollback.XXXXXX)"
          chmod 700 "$BACKUP"
          DEST=/opt/qilylean-cn-translation
          UNIT=/etc/systemd/system/qilylean-cn-translation.service
          CONF=/etc/qilylean-cn/translate.json
          INSTALLED=false
          TOUCHED=false
          HAD_DEST=false
          HAD_UNIT=false
          HAD_CONF=false
          HAD_CONF_DIR=false
          WAS_ACTIVE=false
          WAS_ENABLED=false
          rollback() {
            echo 'Translation verification failed; restoring previous translation service.' >&2
            python3 "$STAGE/refresh-browser-cache.py" --backup "$BACKUP/browser-cache" --restore || return 1
            systemctl disable --now qilylean-cn-translation >/dev/null 2>&1 || true
            rm -rf "$DEST" || return 1
            if "$HAD_DEST"; then cp -a "$BACKUP/service" "$DEST" || return 1; fi
            if "$HAD_UNIT"; then cp -a "$BACKUP/unit" "$UNIT" || return 1; else rm -f "$UNIT" || return 1; fi
            if "$HAD_CONF"; then cp -a "$BACKUP/credentials" "$CONF" || return 1; else rm -f "$CONF" || return 1; fi
            if "$HAD_CONF_DIR"; then chmod "$CONF_DIR_MODE" /etc/qilylean-cn || return 1; else rmdir /etc/qilylean-cn 2>/dev/null || true; fi
            systemctl daemon-reload || return 1
            if "$WAS_ENABLED"; then systemctl enable qilylean-cn-translation || return 1; fi
            if "$WAS_ACTIVE"; then systemctl restart qilylean-cn-translation || return 1; fi
          }
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            KEEP_BACKUP=false
            if ! "$INSTALLED" && "$TOUCHED"; then
              rollback || { status=1; KEEP_BACKUP=true; echo "Rollback incomplete; protected recovery backup retained at $BACKUP" >&2; }
            fi
            rm -rf /tmp/qilylean-cn-youdao /tmp/qilylean-cn-translation "$STAGE"
            if ! "$KEEP_BACKUP"; then rm -rf "$BACKUP"; fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # This verifies actual NMT over direct mainland TLS before any service change.
          CREDENTIALS_DIRECTORY="$STAGE" python3 "$STAGE/verify-production.py"
          if test -d "$DEST"; then HAD_DEST=true; cp -a "$DEST" "$BACKUP/service"; fi
          if test -f "$UNIT"; then HAD_UNIT=true; cp -a "$UNIT" "$BACKUP/unit"; fi
          if test -f "$CONF"; then HAD_CONF=true; cp -a "$CONF" "$BACKUP/credentials"; fi
          if test -d /etc/qilylean-cn; then HAD_CONF_DIR=true; CONF_DIR_MODE="$(stat -c '%a' /etc/qilylean-cn)"; fi
          if systemctl is-active --quiet qilylean-cn-translation; then WAS_ACTIVE=true; fi
          if systemctl is-enabled --quiet qilylean-cn-translation; then WAS_ENABLED=true; fi

          # install.sh owns these fixed staging paths; both workflow and host locks protect them.
          rm -rf /tmp/qilylean-cn-youdao /tmp/qilylean-cn-translation
          install -d -m 700 /tmp/qilylean-cn-youdao /tmp/qilylean-cn-translation
          install -m 600 "$STAGE/youdao" /tmp/qilylean-cn-youdao/youdao
          for file in server.py protected-tokens.json qilylean-cn-translation.service install.sh; do
            install -m 644 "$STAGE/$file" "/tmp/qilylean-cn-translation/$file"
          done
          TOUCHED=true
          bash /tmp/qilylean-cn-translation/install.sh

          EXPECTED_BUILD="$(sha256sum "$STAGE/server.py" | cut -d' ' -f1)" PAGE_SAMPLES="$STAGE/page-smoke-samples.json" python3 - <<'PY'
          import json, os, urllib.request, uuid
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open('http://127.0.0.1:8081/health', timeout=10) as response:
              health = json.load(response)
          assert health.get('build_sha256') == os.environ['EXPECTED_BUILD'], 'Unexpected installed translation build'
          tests = []
          for target in ('en', 'zh-TW', 'ja'):
              source = '制造现场的数据验证，质量改善与资源协调。验收编号：' + uuid.uuid4().hex
              payload = json.dumps({'target_language': target, 'texts': [source]}).encode()
              request = urllib.request.Request('https://qilylean.cn/translate', data=payload, headers={'Content-Type': 'application/json'})
              with opener.open(request, timeout=65) as response:
                  result = json.load(response)
              translations = result.get('translations', [])
              assert result.get('ok') is True and result.get('provider') == 'youdao' and result.get('cached') is False, 'Fresh Youdao call required'
              assert len(translations) == 1 and isinstance(translations[0], str) and translations[0].strip() and translations[0] != source, 'Actual translation required'
              tests.append({'target': target, 'source': source, 'translation': translations[0], 'provider': result['provider'], 'cached': result['cached']})
          samples = json.load(open(os.environ['PAGE_SAMPLES']))
          for target in ('en', 'zh-TW', 'ja'):
              request = urllib.request.Request('https://qilylean.cn/translate',
                  data=json.dumps({'target_language': target, 'texts': samples}).encode(),
                  headers={'Content-Type': 'application/json'})
              with opener.open(request, timeout=65) as response:
                  result = json.load(response)
              assert result.get('ok') is True and result.get('provider') == 'youdao' and result.get('cached') is False
              assert len(result.get('translations', [])) == len(samples)
              assert all(isinstance(text, str) and text.strip() for text in result['translations'])
              assert result['translations'][9] != samples[9], 'Actual page heading must be translated'
              assert 'QilyLean' in result['translations'][13] and 'SMED' in result['translations'][17]
              tests.append({'target': target, 'page_batch_texts': len(samples), 'provider': result['provider'], 'cached': result['cached']})
          print(json.dumps({'ok': True, 'endpoint': 'https://qilylean.cn/translate', 'build_sha256': health['build_sha256'], 'tests': tests}, ensure_ascii=False))
          PY
          python3 "$STAGE/refresh-browser-cache.py" --root /var/www/qilylean-cn/current --backup "$BACKUP/browser-cache"
          python3 "$STAGE/verify-production.py" --production
          # Keep the existing rollback backup and lock until real browser proof.
          touch "$STAGE/browser-ready"
          BROWSER_PASSED=false
          for attempt in $(seq 1 300); do
            if test -f "$STAGE/browser-failed"; then exit 1; fi
            if test -f "$STAGE/browser-passed"; then BROWSER_PASSED=true; break; fi
            sleep 2
          done
          "$BROWSER_PASSED" || { echo 'Browser verification timed out; rolling back.' >&2; exit 1; }
          INSTALLED=true
          echo 'PASS: translation service repaired; fresh English, Traditional Chinese and Japanese verified.'
          REMOTE

          ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "mkdir -m 700 '$STAGE'"
          scp -q "${SSH_OPTS[@]}" services/cn-translation/{server.py,protected-tokens.json,qilylean-cn-translation.service,install.sh,verify-production.py,refresh-browser-cache.py,page-smoke-samples.json} cn-site/assets/cn-translate-baidu-v1.{js,css} "$SSH_DIR/repair.sh" "$USER_NAME@$CN_PREPROD_HOST:$STAGE/"
          # Never put credential values in argv, command text, artifacts, or logs.
          python3 - <<'PY' | ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "sudo python3 -c 'import json,os,pathlib,sys; data=json.load(sys.stdin); assert all(isinstance(data.get(k),str) and data[k].strip() for k in (\"YOUDAO_APP_KEY\",\"YOUDAO_APP_SECRET\")); dest=pathlib.Path(\"$STAGE/youdao\"); fd=os.open(dest,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600); os.write(fd,json.dumps(data).encode()); os.close(fd)'"
          import json, os, sys
          json.dump({name: os.environ[name] for name in ('YOUDAO_APP_KEY', 'YOUDAO_APP_SECRET')}, sys.stdout)
          PY
          ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "sudo timeout --signal=TERM --kill-after=90s 900s bash '$STAGE/repair.sh' '$STAGE'" &
          REPAIR_PID=$!
          READY=false
          for attempt in $(seq 1 120); do
            if ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "test -f '$STAGE/browser-ready'"; then READY=true; break; fi
            kill -0 "$REPAIR_PID" 2>/dev/null || { wait "$REPAIR_PID"; exit 1; }
            sleep 2
          done
          "$READY" || { echo 'Translation preflight did not reach browser verification.' >&2; exit 1; }
          if verify_browser; then
            ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "sudo touch '$STAGE/browser-passed'"
          else
            ssh "${SSH_OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "sudo touch '$STAGE/browser-failed'"
            wait "$REPAIR_PID" || true
            REPAIR_PID=
            exit 1
          fi
          wait "$REPAIR_PID"
          REPAIR_PID=

      - name: Save public browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-mainland-browser-evidence
          path: ${{ runner.temp }}/cn-browser-evidence/
          if-no-files-found: ignore
