name: Enforce QilyLean site VI palette

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "site-*.js"
      - "scripts/materialize-global-language-v3.js"
      - "scripts/enforce-site-vi-palette.js"
      - ".github/workflows/enforce-site-vi-palette.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enforce-site-vi-palette-main
  cancel-in-progress: false

jobs:
  enforce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate current V27 VI authority without mutating public pages
        run: |
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/validate-visual-system-v2.js
          node --check scripts/validate-sitewide-visual-closure-v27.js
          node scripts/materialize-global-language-v3.js --check
          node scripts/validate-visual-system-v2.js --materialized
          node scripts/validate-sitewide-visual-closure-v27.js
          git diff --check
