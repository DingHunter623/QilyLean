name: Repair QilyLean business architecture runtime 20260809

on:
  push:
    paths:
      - '.github/workflows/repair-business-architecture-runtime-20260809.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Repair runtime and related business logic
        run: python3 scripts/repair-business-architecture-20260809.py
      - name: Syntax checks
        run: |
          node --check site-brand-trust-v1.js
          node --check site-information-architecture-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check site-navigation-legacy-20260802.js
          node --check scripts/apply-commercial-quality-closure-20260804.js
      - name: Validate business architecture contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PROJECT DELIVERY STRATEGY｜项目合作从哪里开始' site-brand-trust-v1.js
          grep -q '六类项目合作能力＝三类核心项目交付＋三项数智化产品与技术能力' site-brand-trust-v1.js
          ! grep -q '三项核心业务' site-brand-trust-v1.js
          ! grep -q 'CORE BUSINESS｜先看能解决什么' site-brand-trust-v1.js
          grep -q 'DIGITAL PRODUCT & TECH 04' site-information-architecture-v1.js
          grep -q 'DIGITAL PRODUCT & TECH 05' site-information-architecture-v1.js
          grep -q 'DIGITAL PRODUCT & TECH 06' site-information-architecture-v1.js
          ! grep -q "kicker:'CORE BUSINESS" site-information-architecture-v1.js
          for f in cooperation/factory-planning/index.html cooperation/lean-improvement/index.html cooperation/visual-management/index.html; do
            grep -q 'QilyLean核心项目交付' "$f"
            grep -q 'CORE PROJECT DELIVERY' "$f"
            grep -q '返回六类项目合作能力' "$f"
            ! grep -q '返回三大核心业务' "$f"
            ! grep -q 'QilyLean核心业务' "$f"
          done
          grep -q '三类核心项目交付公开价格参考' site-navigation-legacy-20260802.js
          grep -q '三类核心项目交付价格方案' site-navigation-legacy-20260802.js
          ! grep -q '三大核心业务公开价格参考' site-navigation-legacy-20260802.js
          grep -q '三类核心项目交付｜公开价格参考与报价依据' scripts/apply-commercial-quality-closure-20260804.js
          ! grep -q '三大核心业务｜公开价格参考与报价依据' scripts/apply-commercial-quality-closure-20260804.js
          grep -q '六类项目合作能力｜三类核心项目交付 + 三项数智化产品与技术能力' index.html
          grep -q '三类核心项目交付' cooperation/index.html
          grep -q '三项数智化产品与技术能力' cooperation/index.html
          ! grep -q '六大核心业务' index.html
          ! grep -q '六大核心业务' cooperation/index.html
      - name: Commit comprehensive architecture repair
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add site-brand-trust-v1.js site-information-architecture-v1.js site-core-service-dock-closure-v1.js site-navigation-legacy-20260802.js cooperation/factory-planning/index.html cooperation/lean-improvement/index.html cooperation/visual-management/index.html scripts/apply-commercial-quality-closure-20260804.js site-commercial-quality-closure-v1.css docs/QilyLean全站业务口径规范_20260809.md
          git commit -m '全站业务架构闭环：消除三项核心业务与六类能力双重定义'
          git pull --rebase origin main
          git push origin HEAD:main
