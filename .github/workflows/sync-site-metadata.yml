name: Sync unified site metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-site-metadata.yml"
      - "scripts/apply-integrity-upgrade.js"
      - "scripts/build-site-metadata.js"
      - "scripts/sync-daily-index-source.js"
      - "scripts/build-trust-search-sync.js"
      - "scripts/ensure-footer-v21-source.js"
      - "scripts/patch-trust-live-status.js"
      - "trust/live-status.js"
      - "site-visual-closure-v1.js"
      - "index.html"
      - "knowledge/index.html"
      - "capabilities/index.html"
      - "projects/index.html"
      - "cooperation/index.html"
      - "qilylean/daily/index.json"
      - "qilylean/daily/*.html"
      - "qilylean/daily-insights.html"
      - "site-search.js"
      - "sitemap.xml"
      - "sitemap-core.xml"
  workflow_run:
    workflows: ["Build daily engineering brief archive"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unified-site-metadata-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name == 'workflow_run' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive brief index from published daily pages
        run: node scripts/sync-daily-index-source.js

      - name: Generate central site data and synchronized pages
        run: node scripts/build-site-metadata.js

      - name: Apply permanent integrity and disclosure rules
        shell: bash
        run: |
          if node scripts/apply-integrity-upgrade.js; then
            echo "Integrity upgrade applied or already current."
          else
            echo "Legacy integrity patch target has drifted; verifying that its required end-state is already materialized."
            grep -q '非QilyLean品牌独立营收' index.html
            grep -q 'evidenceLevelRule' scripts/build-trust-search-sync.js
            grep -q 'publicationRule' scripts/build-trust-search-sync.js
            grep -q 'credentialRule' scripts/build-trust-search-sync.js
            grep -q '核定、验证、估算、陈述' cooperation/index.html
            echo "Required integrity end-state is present; continuing with generated synchronization."
          fi

      - name: Publish trust center and generated search index
        run: node scripts/build-trust-search-sync.js

      - name: Preserve V21 footer visual closure on generated pages
        run: node scripts/ensure-footer-v21-source.js

      - name: Bind trust status directly to live brief index
        run: node scripts/patch-trust-live-status.js

      - name: Validate synchronized metadata trust controls and sitewide closure
        shell: bash
        run: |
          node --check scripts/apply-integrity-upgrade.js
          node --check scripts/sync-daily-index-source.js
          node --check scripts/build-site-metadata.js
          node --check scripts/build-trust-search-sync.js
          node --check scripts/ensure-footer-v21-source.js
          node --check scripts/patch-trust-live-status.js
          node --check trust/live-status.js
          node --check site-search.js
          node --check site-visual-closure-v1.js
          test -f qilylean/site-data.json
          test -f qilylean/site-search-index.json
          test -f trust/index.html
          test -f trust/live-status.js
          grep -q 'qilySitewideClarityStyleV2' site-visual-closure-v1.js
          grep -q 'syncDailyMetadata' site-visual-closure-v1.js
          grep -q 'module-grid>.module-card>.module-actions' site-visual-closure-v1.js
          grep -q 'data-trust-stat="briefs"' trust/index.html
          grep -q '/trust/live-status.js' trust/index.html
          grep -q 'site-layout-typography-closure-v20.css?v=20260810-footer-visual-v21' trust/index.html
          grep -q 'site-layout-typography-closure-v20.css?v=20260810-footer-visual-v21' capabilities/index.html
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('qilylean/site-data.json', 'utf8'));
          const briefs = JSON.parse(fs.readFileSync('qilylean/daily/index.json', 'utf8'));
          const search = JSON.parse(fs.readFileSync('qilylean/site-search-index.json', 'utf8'));
          const home = fs.readFileSync('index.html', 'utf8');
          const knowledge = fs.readFileSync('knowledge/index.html', 'utf8');
          const terminology = fs.readFileSync('knowledge/terminology.html', 'utf8');
          const directory = fs.readFileSync('qilylean/daily-insights.html', 'utf8');
          const cooperation = fs.readFileSync('cooperation/index.html', 'utf8');
          const projects = fs.readFileSync('projects/index.html', 'utf8');
          const capabilities = fs.readFileSync('capabilities/index.html', 'utf8');
          const trust = fs.readFileSync('trust/index.html', 'utf8');
          const siteSearch = fs.readFileSync('site-search.js', 'utf8');
          if (!Number.isInteger(data.terminology.total) || data.terminology.total < 1) throw new Error('Invalid terminology total');
          if (!Number.isInteger(data.briefs.total) || data.briefs.total < 1) throw new Error('Invalid brief total');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(data.briefs.latestDate)) throw new Error('Invalid latest brief date');
          if (!Array.isArray(briefs) || briefs.length !== data.briefs.total) throw new Error('Brief index count mismatch');
          if (!briefs[0] || briefs[0].date !== data.briefs.latestDate) throw new Error('Brief index latest-date mismatch');
          if (!data.compliance || data.compliance.defaultContractingParty !== '丁启利（自然人）') throw new Error('Commercial contracting party is not explicit');
          if (!data.compliance.evidenceLevelRule || !data.compliance.publicationRule || !data.compliance.credentialRule) throw new Error('Integrity disclosure rules missing');
          if (!data.search || data.search.indexedEntries !== search.meta.indexedEntries) throw new Error('Search-index metadata mismatch');
          if (search.meta.briefTotal !== data.briefs.total) throw new Error('Search brief count mismatch');
          if (search.meta.terminologyTotal !== data.terminology.total) throw new Error('Search terminology count mismatch');
          if (!home.includes('SITE-METADATA:HOME-LATEST:START')) throw new Error('Homepage latest-content block missing');
          if (!home.includes('QILY-TRUST:HOME:START')) throw new Error('Homepage trust-center block missing');
          if (!home.includes('非QilyLean品牌独立营收')) throw new Error('Homepage cumulative-results boundary missing');
          if (!home.includes(data.briefs.latestDate)) throw new Error('Homepage latest date mismatch');
          if (!home.includes(`${data.briefs.total}期`)) throw new Error('Homepage brief total mismatch');
          if (!knowledge.includes('SITE-METADATA:KNOWLEDGE-STATS:START')) throw new Error('Knowledge statistics block missing');
          if (!knowledge.includes(`data-latest-brief-date="${data.briefs.latestDate}"`)) throw new Error('Knowledge latest brief mismatch');
          if (!knowledge.includes(`${data.briefs.total} 期`)) throw new Error('Knowledge brief total mismatch');
          if (!terminology.includes(`共收录 ${data.terminology.total} 项术语`)) throw new Error('Terminology total mismatch');
          if (!directory.includes(`共${data.briefs.total}期`)) throw new Error('Daily directory count mismatch');
          if (!directory.includes(`/qilylean/daily/${data.briefs.latestDate}.html`)) throw new Error('Daily directory latest link mismatch');
          if (!directory.includes('QILY-ARCHIVE-DISCLOSURE:START')) throw new Error('Daily archive disclosure missing');
          if (!cooperation.includes('QILY-TRUST:COOPERATION:START')) throw new Error('Cooperation compliance block missing');
          if (!cooperation.includes('核定、验证、估算、陈述')) throw new Error('Cooperation evidence classification missing');
          if (!projects.includes('QILY-PROJECT-READING-RULE:START')) throw new Error('Project reading rule missing');
          if (!capabilities.includes('不构成OpenAI官方认证')) throw new Error('Certificate boundary missing');
          if (!trust.includes('默认签约主体：丁启利（自然人）')) throw new Error('Trust center contracting party missing');
          if (!trust.includes('公开成果证据分级')) throw new Error('Trust evidence levels missing');
          if (!trust.includes('内容日期、版本与非背书声明')) throw new Error('Trust publication statement missing');
          if (!trust.includes(`data-trust-stat="briefs">${briefs.length}<`)) throw new Error('Trust brief total is not bound to daily index');
          if (!siteSearch.includes('qily-generated-search-index-v1')) throw new Error('Generated search index loader missing');
          NODE
          grep -q "https://qilylean.com/trust/" sitemap.xml
          grep -q "https://qilylean.com/trust/" sitemap-core.xml
          grep -q "<lastmod>" sitemap.xml
          grep -q "<lastmod>" sitemap-core.xml

      - name: Commit synchronized site metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Unified site metadata, trust center, search index and sitewide closure are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-trust-search-sync.js scripts/ensure-footer-v21-source.js scripts/patch-trust-live-status.js trust/live-status.js site-visual-closure-v1.js index.html knowledge/index.html knowledge/terminology.html capabilities/index.html projects/index.html cooperation/index.html trust/index.html site-search.js qilylean/site-data.json qilylean/site-search-index.json qilylean/daily/index.json qilylean/daily-insights.html qilylean/latest-brief.js qilylean/daily-insights-card.js sitemap.xml sitemap-core.xml
          git commit -m "build: publish synchronized site data and sitewide clarity closure [skip ci]"
          git pull --rebase origin main
          git push
