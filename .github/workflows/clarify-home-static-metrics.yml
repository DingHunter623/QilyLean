name: Enforce homepage static metric cards

on:
  push:
    branches: [main]
    paths:
      - "scripts/clarify-home-static-metrics.js"
      - "scripts/materialize-static-core-pages.js"
      - "site-static-core-interactions-v1.js"
      - "site-link-standard-v2.css"
      - ".github/workflows/clarify-home-static-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-home-static-metrics-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce true static cards
        run: node scripts/clarify-home-static-metrics.js

      - name: Validate static-card visual state
        shell: bash
        run: |
          node --check scripts/clarify-home-static-metrics.js
          node --check scripts/materialize-static-core-pages.js
          node --check site-static-core-interactions-v1.js
          grep -q 'QILY-HOME-STATIC-METRIC-NO-HOVER' index.html
          grep -q 'QILY-STATIC-RESULT-CARD-HARD-LOCK:START' site-link-standard-v2.css
          grep -q 'border-left-color:transparent!important' index.html
          grep -q 'border-right-color:transparent!important' index.html
          grep -q 'border-bottom-color:transparent!important' index.html
          grep -q 'border-top-color:var(--qily-static-top)!important' index.html
          grep -q 'color:var(--forest)!important' index.html
          grep -q 'color:var(--muted)!important' index.html
          grep -q 'color:var(--red)!important' index.html
          grep -q -- '-webkit-text-fill-color:var(--forest)!important' index.html
          grep -q -- '-webkit-text-fill-color:var(--muted)!important' index.html
          grep -q -- '-webkit-text-fill-color:var(--red)!important' index.html
          grep -q '20260803-static-text-lock-v4' index.html
          grep -q '20260803-static-card-lock-v7' index.html
          grep -q '20260803-static-text-lock-v4' scripts/materialize-static-core-pages.js
          grep -q '“超千万元”口径' index.html
          if grep -q 'hover :is(strong,span,em){color:inherit' site-link-standard-v2.css; then
            echo 'Static result-card text must not inherit a hover color.' >&2
            exit 1
          fi
          if grep -q '以下为静态成果概览卡片' index.html; then
            echo 'Do not add explanatory static-card copy to compensate for interaction defects.' >&2
            exit 1
          fi
          if grep -q '\.metric:hover{transform:translateY' index.html; then
            echo 'Static metric cards must not move on hover.' >&2
            exit 1
          fi

      - name: Commit static-card correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Homepage static cards already keep an identical visual state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/materialize-static-core-pages.js site-link-standard-v2.css
          git commit -m "fix: keep static result-card text and borders unchanged [skip ci]"
          git push
