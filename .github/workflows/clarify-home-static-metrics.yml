name: Clarify homepage static metrics

on:
  push:
    branches: [main]
    paths:
      - "scripts/clarify-home-static-metrics.js"
      - ".github/workflows/clarify-home-static-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clarify-home-static-metrics-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add static-display clarification
        run: node scripts/clarify-home-static-metrics.js

      - name: Validate homepage interaction wording
        shell: bash
        run: |
          node --check scripts/clarify-home-static-metrics.js
          grep -q 'metric-display-note' index.html
          grep -q '以下为静态成果概览卡片，仅用于信息展示' index.html
          grep -q '不代表可点击或页面跳转' index.html
          grep -q 'cursor:default' index.html

      - name: Commit homepage clarification
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Homepage static-card clarification is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clarify homepage metric cards are display-only [skip ci]"
          git push
