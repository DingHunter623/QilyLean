name: Enforce homepage static metric cards

on:
  push:
    branches: [main]
    paths:
      - "scripts/clarify-home-static-metrics.js"
      - "scripts/materialize-static-core-pages.js"
      - "site-static-core-interactions-v1.js"
      - ".github/workflows/clarify-home-static-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-home-static-metrics-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce zero-feedback static cards
        run: node scripts/clarify-home-static-metrics.js

      - name: Validate static-card interaction standard
        shell: bash
        run: |
          node --check scripts/clarify-home-static-metrics.js
          node --check scripts/materialize-static-core-pages.js
          node --check site-static-core-interactions-v1.js
          grep -q 'QILY-HOME-STATIC-METRIC-NO-HOVER' index.html
          grep -q 'transition:none!important' index.html
          grep -q 'transform:none!important' index.html
          grep -q 'qily-static-metric-no-hover-style' site-static-core-interactions-v1.js
          grep -q '20260803-static-no-hover-v2' index.html
          grep -q '20260803-static-no-hover-v2' scripts/materialize-static-core-pages.js
          grep -q '“超千万元”口径' index.html
          if grep -q '以下为静态成果概览卡片' index.html; then
            echo 'Misleading static-card note must not exist.' >&2
            exit 1
          fi
          if grep -q '\.metric:hover{transform:translateY' index.html; then
            echo 'Static metric cards must not move on hover.' >&2
            exit 1
          fi

      - name: Commit homepage static-card correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Homepage static cards already have zero hover feedback."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/materialize-static-core-pages.js
          git commit -m "fix: persist zero-hover static cards in final page source [skip ci]"
          git push
