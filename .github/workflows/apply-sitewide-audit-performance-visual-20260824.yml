name: Verify Sitewide Performance Visual Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-materialized-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify the materialized sitewide visual audit
        run: |
          set -euo pipefail
          node scripts/validate-contact-readability-ddz-20260824.js
          node scripts/validate-home-hero-dock-snapback-v1.js
          node scripts/site-regression-guard-c919-hero.js
          grep -q 'qilyC919HeroPreloadV1' index.html
          grep -q 'c919-strategy-hero-v14.png?v=20260826-c919-crossbrowser-v1' index.html
          ! grep -q 'c919-strategy-hero-v14.webp' index.html
          grep -q 'QILY-CONTACT-LINK-ACTION-V12.5' site-navigation-core.js
          grep -q 'qilyCooperationReadableHierarchyV2' cooperation/index.html
          grep -q 'QILY-SITEWIDE-AUDIT-CONTRAST-V5' pure-ddz-capability-visual-v2.css
          ! grep -q '确认OK后再发布' capabilities/index.html
          ! grep -q '安装包待验证' tools/pure-ddz/index.html
          git diff --check
