name: Assemble approved PDCA final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-approved-pdca-final.yml"
      - "qilylean/assets/pdca-approved-strip-*.webp"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-approved-pdca-final
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install image assembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Assemble the user-approved PDCA artwork and replace the live SVG resource
        shell: bash
        run: |
          set -euo pipefail
          convert \
            qilylean/assets/pdca-approved-strip-1.webp \
            qilylean/assets/pdca-approved-strip-2.webp \
            qilylean/assets/pdca-approved-strip-3.webp \
            qilylean/assets/pdca-approved-strip-4.webp \
            qilylean/assets/pdca-approved-strip-5.webp \
            qilylean/assets/pdca-approved-strip-6.webp \
            +append /tmp/pdca-approved-final.webp
          test "$(identify -format '%wx%h' /tmp/pdca-approved-final.webp)" = "1200x675"
          B64="$(base64 -w0 /tmp/pdca-approved-final.webp)"
          cat > qilylean/assets/training-2026-08-08-pdca.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc"><title id="title">PDCA｜持续改善闭环</title><desc id="desc">8月8日培训纪要PDCA持续改善闭环确认终稿。</desc><image href="data:image/webp;base64,${B64}" x="0" y="0" width="1200" height="675" preserveAspectRatio="xMidYMid meet"/></svg>
          EOF
          grep -F '8月8日培训纪要PDCA持续改善闭环确认终稿' qilylean/assets/training-2026-08-08-pdca.svg
          grep -F 'data:image/webp;base64,' qilylean/assets/training-2026-08-08-pdca.svg
          git diff --check
      - name: Commit approved final artwork and clean temporary assembly inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qilylean/assets/training-2026-08-08-pdca.svg
          git rm -f qilylean/assets/pdca-approved-strip-*.webp
          git rm -f .github/workflows/assemble-approved-pdca-final.yml
          git commit -m "fix: 培训纪要PDCA图替换为确认终稿 [skip ci]"
          git push origin HEAD:main
