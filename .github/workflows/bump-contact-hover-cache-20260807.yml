name: Bump official contact hover cache 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-contact-hover-cache-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bump sitewide interactive hover stylesheet version
        shell: bash
        run: |
          set -euo pipefail
          MATCH='site-interactive-hover-contrast-v1.css?v=20260805-interactive-hover-contrast-v'
          NEW='site-interactive-hover-contrast-v1.css?v=20260807-official-contact-hover-v2'
          git grep -lz -F "$MATCH" -- . | xargs -0 -r sed -i -E 's#site-interactive-hover-contrast-v1\.css\?v=20260805-interactive-hover-contrast-v[12]#site-interactive-hover-contrast-v1.css?v=20260807-official-contact-hover-v2#g'
          if git grep -q -F "$MATCH" -- .; then
            echo 'Stale hover cache version remains.' >&2
            exit 1
          fi
          grep -q 'QILY-OFFICIAL-CONTACT-HOVER-CONTRAST-20260807' site-interactive-hover-contrast-v1.css
          grep -q '20260807-official-contact-hover-v2' site-navigation.js

      - name: Publish cache closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f .github/workflows/bump-contact-hover-cache-20260807.yml
          git add -A
          git commit -m '全站规范：刷新官网邮箱高对比交互样式缓存版本'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
