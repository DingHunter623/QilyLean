name: Publish QilyLean business architecture cache bust 20260809

on:
  push:
    paths:
      - '.github/workflows/publish-business-architecture-cache-bust-20260809.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply sitewide cache bust
        run: python3 scripts/publish-business-architecture-cache-bust-20260809.py
      - name: Validate loader chain
        shell: bash
        run: |
          set -euo pipefail
          node --check site-navigation.js
          grep -q '/site-brand-trust-v1.js?v=20260809-project-delivery-strategy-v2' site-navigation.js
          grep -q '/site-information-architecture-v1.js?v=20260809-six-capabilities-v2' site-navigation.js
          grep -q '/site-navigation-legacy-20260802.js?v=20260809-core-project-pricing-v2' site-navigation.js
          grep -q '/site-navigation.js?v=20260809-business-architecture-v2' index.html
          grep -q '/site-navigation.js?v=20260809-business-architecture-v2' cooperation/index.html
          grep -q '/site-navigation.js?v=20260809-business-architecture-v2' cooperation/factory-planning/index.html
          ! grep -q '/site-navigation.js?v=20260807-sitewide-closure-v4' index.html
      - name: Commit cache-bust publication
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add site-navigation.js '*.html' '**/*.html' 2>/dev/null || true
          git commit -m '全站缓存闭环：强制加载新版3+3业务架构运行层'
          git pull --rebase origin main
          git push origin HEAD:main
