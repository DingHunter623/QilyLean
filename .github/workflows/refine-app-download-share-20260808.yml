name: Refine APP download and share entries 20260808

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_app_download_share_20260808.py'
      - '.github/workflows/refine-app-download-share-20260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QR generator
        run: python -m pip install 'qrcode==8.2'

      - name: Apply APP download/share refinement
        run: python scripts/refine_app_download_share_20260808.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'data-app-share-qr="times26001"' capabilities/index.html
          grep -q 'data-app-share-qr="qilyleanHome"' capabilities/index.html
          grep -q 'data-app-share-link="times26001"' tools/times26001/index.html
          grep -q 'id="android-download"' tools/times26001/index.html
          test -s assets/tools/qr-times26001-download.svg
          test -s assets/tools/qr-qilylean-home-download.svg
          ! grep -q '历史版 v2.2（不建议新装）' capabilities/index.html
          ! grep -q '历史版 v1.1.4（不建议新装）' tools/times26001/index.html

      - name: Commit website refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add capabilities/index.html tools/times26001/index.html assets/tools/qr-times26001-download.svg assets/tools/qr-qilylean-home-download.svg
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '官网：清理旧版APP下载按钮并新增二维码与链接分享'
          git pull --rebase origin main
          git push origin HEAD:main
