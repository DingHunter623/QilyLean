name: Verify Cooperation Contrast R8 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-cooperation-contrast-r8-20260904.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-verify-cooperation-contrast-r8
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare system Chrome audit runtime
        run: |
          npm install --no-save --package-lock=false playwright-core@1.55.0
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Start local public site
        run: |
          python3 -m http.server 4173 >/tmp/qily-contrast-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/cooperation/factory-planning/ >/dev/null

      - name: Browser computed-style audit on local and production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-cooperation-contrast
          export BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cat > /tmp/verify-cooperation-contrast.js <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const expected={detailVersion:'20260904-r8-core-contrast-v2-root-selector',commercialVersion:'20260904-commercial-contrast-v2-root-selector'};
          const fail=m=>{throw new Error(m)};
          const rgb=v=>{const m=String(v).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);return m?m.slice(1,4).map(Number):null};
          const lum=a=>{a=a.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
          const ratio=(a,b)=>{a=rgb(a);b=rgb(b);if(!a||!b)return 0;const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
          async function css(page,sel){return page.locator(sel).first().evaluate(el=>{const s=getComputedStyle(el);return {color:s.color,fill:s.webkitTextFillColor,bg:s.backgroundColor,bgi:s.backgroundImage,w:s.width,h:s.height}})}
          async function one(browser,base,tag,v){
            const c=await browser.newContext({viewport:v});const p=await c.newPage();p.setDefaultTimeout(15000);
            await p.goto(base+'/cooperation/factory-planning/',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.core-business-hero-actions>a.primary');
            const dref=await p.locator('link[href*="core-business-detail.css"]').first().getAttribute('href');
            if(!dref||!dref.includes(expected.detailVersion))fail(`${tag}: detail version ${dref}`);
            const a=await css(p,'.core-business-hero-actions>a.primary');
            if(a.color!=='rgb(23, 50, 45)'||a.fill!=='rgb(23, 50, 45)'||!a.bgi||a.bgi==='none')fail(`${tag}: detail CTA ${JSON.stringify(a)}`);
            const b=await css(p,'.core-business-process .core-business-step>b');
            if(b.color!=='rgb(255, 255, 255)'||b.fill!=='rgb(255, 255, 255)'||b.bg!=='rgb(7, 60, 71)'||parseFloat(b.w)<38||parseFloat(b.h)<38)fail(`${tag}: detail badge ${JSON.stringify(b)}`);
            await p.locator('.module-hero').screenshot({path:`visual-cooperation-contrast/${tag}-factory-hero.png`});
            await p.locator('.core-business-process').screenshot({path:`visual-cooperation-contrast/${tag}-factory-process.png`});

            await p.goto(base+'/cooperation/',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForSelector('.hero-actions>a.primary');
            const cref=await p.locator('link[href*="site-commercial-quality-closure-v1.css"]').first().getAttribute('href');
            if(!cref||!cref.includes(expected.commercialVersion))fail(`${tag}: commercial version ${cref}`);
            const h=await css(p,'.hero-actions>a.primary');
            if(h.color!=='rgb(51, 33, 0)'||h.fill!=='rgb(51, 33, 0)'||h.bg!=='rgb(255, 211, 106)')fail(`${tag}: cooperation CTA ${JSON.stringify(h)}`);
            const f=p.locator('.flow-grid .flow-step>b').first();
            if(await f.count()){const x=await css(p,'.flow-grid .flow-step>b');if(x.color!=='rgb(255, 255, 255)'||x.bg!=='rgb(7, 60, 71)'||parseFloat(x.w)<40||parseFloat(x.h)<40)fail(`${tag}: flow badge ${JSON.stringify(x)}`);await p.locator('.flow-grid').first().screenshot({path:`visual-cooperation-contrast/${tag}-cooperation-flow.png`})}
            const ax=p.locator('.qily-system-axis__step').first();
            if(await ax.count()){const s=await css(p,'.qily-system-axis__step>strong'),q=await css(p,'.qily-system-axis__step');if(ratio(s.color,q.bg)<4.5)fail(`${tag}: axis ratio ${ratio(s.color,q.bg).toFixed(2)} ${s.color}/${q.bg}`);await p.locator('.qily-system-axis').screenshot({path:`visual-cooperation-contrast/${tag}-cooperation-axis.png`})}
            await p.locator('.module-hero').screenshot({path:`visual-cooperation-contrast/${tag}-cooperation-hero.png`});
            await c.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_BIN,args:['--no-sandbox']});try{
            await one(browser,'http://127.0.0.1:4173','local-desktop',{width:1680,height:950});
            await one(browser,'http://127.0.0.1:4173','local-mobile',{width:390,height:844});
            let e=null;for(let i=1;i<=10;i++){try{await one(browser,'https://qilylean.com','production-desktop',{width:1680,height:950});await one(browser,'https://qilylean.com','production-mobile',{width:390,height:844});e=null;break}catch(err){e=err;console.log(`production attempt ${i}/10: ${err.message}`);await new Promise(r=>setTimeout(r,12000))}}if(e)throw e;
            fs.writeFileSync('visual-cooperation-contrast/PASS.txt','PASS local + production desktop/mobile computed-style audit\n');console.log('PASS local + production desktop/mobile computed-style audit');
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify-cooperation-contrast.js

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooperation-contrast-r8-${{ github.run_id }}
          path: visual-cooperation-contrast
          if-no-files-found: warn
          retention-days: 7
