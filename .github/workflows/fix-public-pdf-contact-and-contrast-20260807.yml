name: Fix public PDF contact and lean-tools contrast 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-public-pdf-contact-and-contrast-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-public-pdf-contact-and-contrast-20260807
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF engine
        run: python -m pip install --disable-pip-version-check --quiet pymupdf

      - name: Replace obsolete QQ email in every tracked PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, fitz, tempfile, os
          from pathlib import Path

          OLD='396767769@qq.com'
          NEW='admin@qilylean.com'
          raw=subprocess.check_output(['git','ls-files','-z'])
          pdfs=[Path(x.decode()) for x in raw.split(b'\0') if x and x.decode().lower().endswith('.pdf')]
          changed_files=0
          replacements=0

          for p in pdfs:
              doc=fitz.open(p)
              page_count=len(doc)
              changed_here=0
              for page in doc:
                  hits=page.search_for(OLD)
                  if not hits:
                      # Defensive fallback for PDFs that split the email into text spans.
                      text=page.get_text('text') or ''
                      if '396767769' in text and 'qq.com' in text:
                          hits=page.search_for('396767769@qq.com')
                  if not hits:
                      continue
                  targets=[]
                  for r in hits:
                      extra=max(18.0, r.width*0.38)
                      t=fitz.Rect(max(0,r.x0-1.2), max(0,r.y0-1.0), min(page.rect.x1-2,r.x1+extra), min(page.rect.y1,r.y1+1.0))
                      page.add_redact_annot(t, fill=(1,1,1))
                      targets.append(t)
                  page.apply_redactions()
                  for t in targets:
                      size=max(4.6, min(9.0, t.height*0.72))
                      while size>4.5 and fitz.get_text_length(NEW, fontname='helv', fontsize=size)>t.width-2:
                          size-=0.25
                      rc=page.insert_textbox(
                          fitz.Rect(t.x0+1,t.y0,t.x1,t.y1), NEW,
                          fontname='helv', fontsize=size,
                          color=(0.04,0.28,0.32), align=0, overlay=True
                      )
                      if rc < -2:
                          raise RuntimeError(f'Could not fit enterprise email in {p} page {page.number+1}: {rc}')
                      changed_here += 1
                      replacements += 1
              if changed_here:
                  tmp=p.with_suffix(p.suffix+'.qilytmp')
                  doc.save(tmp, garbage=4, deflate=True, clean=True)
                  doc.close()
                  os.replace(tmp,p)
                  # Re-open and validate without changing page count.
                  check=fitz.open(p)
                  if len(check)!=page_count:
                      raise RuntimeError(f'Page count changed for {p}: {page_count} -> {len(check)}')
                  alltext='\n'.join((pg.get_text('text') or '') for pg in check)
                  if OLD in alltext or ('396767769' in alltext and 'qq.com' in alltext):
                      raise RuntimeError(f'Old QQ email remains in {p}')
                  if NEW not in alltext:
                      raise RuntimeError(f'Enterprise email missing after rewrite in {p}')
                  check.close()
                  changed_files += 1
                  print(f'PDF_REWRITTEN {p} replacements={changed_here} pages={page_count}')
              else:
                  doc.close()

          print(f'PDF_REWRITE_SUMMARY pdfs={len(pdfs)} changed_files={changed_files} replacements={replacements}')
          if changed_files != 2:
              raise RuntimeError(f'Expected exactly 2 PDFs with obsolete QQ email, got {changed_files}')
          if replacements != 151:
              raise RuntimeError(f'Expected 151 obsolete-email replacements, got {replacements}')
          PY

      - name: Enforce visible enterprise email on every PDF final page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, fitz
          from pathlib import Path
          NEW='admin@qilylean.com'
          raw=subprocess.check_output(['git','ls-files','-z'])
          pdfs=[Path(x.decode()) for x in raw.split(b'\0') if x and x.decode().lower().endswith('.pdf')]
          failures=[]
          for p in pdfs:
              doc=fitz.open(p)
              final=(doc[-1].get_text('text') or '') if len(doc) else ''
              ok=NEW.lower() in final.lower()
              print(f'PDF_FINAL_CONTACT {p} pages={len(doc)} enterprise_email={ok}')
              if not ok: failures.append(str(p))
              doc.close()
          if failures:
              raise RuntimeError('Final-page enterprise email missing: '+', '.join(failures))
          print(f'PDF_FINAL_CONTACT_OK {len(pdfs)}')
          PY

      - name: Fix lean-tools dark-card readability and final-sheet contact preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Figure 3: final scoped rule, loaded after all global styles.
          p=Path('qilylean/lean-tools.html')
          s=p.read_text(encoding='utf-8')
          marker='qily-lean-flow-contrast-20260807'
          block='''\n<!-- QILY-LEAN-FLOW-CONTRAST:START -->\n<style id="qily-lean-flow-contrast-20260807">\nbody .flow-row .step{\n  background:#0b5662 !important;\n  color:#ffffff !important;\n  -webkit-text-fill-color:#ffffff !important;\n  border:2px solid #063f49 !important;\n  box-shadow:0 8px 18px rgba(6,63,73,.18) !important;\n  opacity:1 !important;\n  text-shadow:none !important;\n}\nbody .flow-row .step,body .flow-row .step *{\n  color:#ffffff !important;\n  -webkit-text-fill-color:#ffffff !important;\n}\nbody .flow-row .arrow{\n  color:#315f5e !important;\n  -webkit-text-fill-color:#315f5e !important;\n  opacity:1 !important;\n  font-weight:900 !important;\n}\n</style>\n<!-- QILY-LEAN-FLOW-CONTRAST:END -->\n'''
          if marker not in s:
              if '</head>' not in s: raise RuntimeError('lean-tools </head> not found')
              s=s.replace('</head>',block+'</head>',1)
          p.write_text(s,encoding='utf-8')

          # Figure 2: make the enterprise email visibly part of the last-sheet inline preview.
          p=Path('qilylean/production-operations-organization.html')
          s=p.read_text(encoding='utf-8')
          marker='qily-final-sheet-enterprise-email-20260807'
          css='''\n<!-- QILY-FINAL-SHEET-CONTACT:START -->\n<style id="qily-final-sheet-enterprise-email-20260807">\n.qily-contact-sheet-preview .preview-open{position:relative}\n.qily-contact-sheet-preview .preview-open::after{\n  content:"企业邮箱：admin@qilylean.com";\n  position:absolute;left:50%;bottom:8.2%;transform:translateX(-50%);\n  z-index:3;max-width:88%;padding:5px 12px;border:1px solid #b9d4d2;border-radius:6px;\n  background:rgba(255,255,255,.94);color:#0b5662 !important;-webkit-text-fill-color:#0b5662 !important;\n  font-size:clamp(12px,1.25vw,16px);font-weight:900;line-height:1.35;letter-spacing:.01em;\n  box-shadow:0 3px 10px rgba(11,86,98,.10);white-space:nowrap;pointer-events:none\n}\n.qily-contact-sheet-preview figcaption span::after{content:" · 企业邮箱：admin@qilylean.com";color:#0b5662;font-weight:900}\n</style>\n<!-- QILY-FINAL-SHEET-CONTACT:END -->\n'''
          if marker not in s:
              if '</head>' not in s: raise RuntimeError('production page </head> not found')
              s=s.replace('</head>',css+'</head>',1)
          needle='<figure class="preview-card"><button class="preview-open" type="button"><img src="/assets/knowledge/production-operations-organization/sheets/sheet-10.webp"'
          repl='<figure class="preview-card qily-contact-sheet-preview"><button class="preview-open" type="button"><img src="/assets/knowledge/production-operations-organization/sheets/sheet-10.webp"'
          if needle in s:
              s=s.replace(needle,repl,1)
          elif 'qily-contact-sheet-preview' not in s:
              raise RuntimeError('sheet-10 preview markup not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate visual contract and old-email eradication
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'qily-lean-flow-contrast-20260807' qilylean/lean-tools.html
          grep -q 'color:#ffffff !important' qilylean/lean-tools.html
          grep -q 'qily-final-sheet-enterprise-email-20260807' qilylean/production-operations-organization.html
          grep -q 'qily-contact-sheet-preview' qilylean/production-operations-organization.html
          grep -q '企业邮箱：admin@qilylean.com' qilylean/production-operations-organization.html
          python - <<'PY'
          import subprocess,fitz
          from pathlib import Path
          old='396767769@qq.com'; new='admin@qilylean.com'
          raw=subprocess.check_output(['git','ls-files','-z'])
          pdfs=[Path(x.decode()) for x in raw.split(b'\0') if x and x.decode().lower().endswith('.pdf')]
          for p in pdfs:
              doc=fitz.open(p)
              alltext='\n'.join((pg.get_text('text') or '') for pg in doc)
              if old in alltext or ('396767769' in alltext and 'qq.com' in alltext):
                  raise RuntimeError(f'Obsolete QQ email remains: {p}')
              if new not in (doc[-1].get_text('text') or ''):
                  raise RuntimeError(f'Final page lacks enterprise email: {p}')
              doc.close()
          print(f'VALIDATED_PDFS {len(pdfs)}')
          PY

      - name: Commit fixes and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f .github/workflows/audit-public-pdf-contact-20260807.yml || true
          git rm -f .github/workflows/fix-public-pdf-contact-and-contrast-20260807.yml || true
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m '全站规范：修复公开PDF企业邮箱与十大工具对比度'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing unsafe overwrite.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
