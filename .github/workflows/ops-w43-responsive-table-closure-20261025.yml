name: One-time W43 responsive table production closure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-w43-responsive-table-closure-20261025.yml'
permissions:
  contents: read
  actions: write
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Materialize current CN brief
        run: |
          set -euo pipefail
          bash cn-site/scripts/materialize-practice-assets.sh
          test -s cn-site/briefs/archive/2026-10-25/index.html
          test -s cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css
          test -s cn-site/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css
          test -s cn-site/assets/source-content/qilylean/daily/assets/2026-10-25-brief.css
          grep -Fq 'w43-mobile-break' cn-site/briefs/archive/2026-10-25/index.html
          for css in             cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css             cn-site/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css             cn-site/assets/source-content/qilylean/daily/assets/2026-10-25-brief.css
          do
            grep -Fq 'width:24%' "$css"
            grep -Fq 'display:block!important' "$css"
          done

      - name: Configure SSH
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts

      - name: Atomically deploy responsive W43 files
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn)
          RELEASE_ID="w43responsive-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          META="$(ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail
          RELEASE_ID="$1"
          SITE_ROOT=/var/www/qilylean-cn
          exec 9>"$SITE_ROOT/.content-deploy.lock"
          flock -w 120 9
          PREVIOUS="$(readlink -f "$SITE_ROOT/current")"
          EXPECTED="$SITE_ROOT/releases/$RELEASE_ID"
          test -d "$PREVIOUS"
          test ! -e "$EXPECTED"
          mkdir -p "$EXPECTED"
          cp -al "$PREVIOUS/." "$EXPECTED/"
          rm -f             "$EXPECTED/briefs/archive/2026-10-25/index.html"             "$EXPECTED/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"             "$EXPECTED/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"             "$EXPECTED/assets/source-content/qilylean/daily/assets/2026-10-25-brief.css"
          mkdir -p             "$EXPECTED/briefs/archive/2026-10-25"             "$EXPECTED/assets/brief-visual-source/qilylean/daily/assets"             "$EXPECTED/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets"             "$EXPECTED/assets/source-content/qilylean/daily/assets"
          printf '%s|%s\n' "$PREVIOUS" "$EXPECTED"
          REMOTE
          )"
          PREVIOUS="${META%%|*}"
          EXPECTED="${META#*|}"
          echo "W43_PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
          echo "W43_EXPECTED=$EXPECTED" >> "$GITHUB_ENV"
          scp -q "${OPTS[@]}" cn-site/briefs/archive/2026-10-25/index.html "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/briefs/archive/2026-10-25/index.html"
          scp -q "${OPTS[@]}" cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"
          scp -q "${OPTS[@]}" cn-site/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"
          scp -q "${OPTS[@]}" cn-site/assets/source-content/qilylean/daily/assets/2026-10-25-brief.css "$USER_NAME@$CN_PREPROD_HOST:$EXPECTED/assets/source-content/qilylean/daily/assets/2026-10-25-brief.css"
          ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$EXPECTED'" <<'REMOTE'
          set -euo pipefail
          EXPECTED="$1"
          SITE_ROOT=/var/www/qilylean-cn
          grep -Fq 'w43-mobile-break' "$EXPECTED/briefs/archive/2026-10-25/index.html"
          for css in             "$EXPECTED/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"             "$EXPECTED/assets/destination-shell/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"             "$EXPECTED/assets/source-content/qilylean/daily/assets/2026-10-25-brief.css"
          do
            grep -Fq 'width:24%' "$css"
            grep -Fq 'display:block!important' "$css"
          done
          NEXT="$SITE_ROOT/.current-w43responsive-${EXPECTED##*/}"
          ln -sfn "$EXPECTED" "$NEXT"
          mv -Tf "$NEXT" "$SITE_ROOT/current"
          sudo nginx -t
          test "$(readlink -f "$SITE_ROOT/current")" = "$EXPECTED"
          test "$(curl --silent --show-error --connect-timeout 5 --max-time 20 --resolve qilylean.cn:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://qilylean.cn/briefs/archive/2026-10-25/)" = 200
          REMOTE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Purge international W43 page cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Cloudflare token unavailable; continue with propagation retry."
            exit 0
          fi
          ZONE_JSON="$(curl -fsSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones?name=qilylean.com")" || exit 0
          ZONE_ID="$(printf '%s' "$ZONE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id",""))')" || true
          if [ -z "$ZONE_ID" ]; then
            echo "No Cloudflare zone id resolved; continue with propagation retry."
            exit 0
          fi
          curl -fsSL -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache"             --data '{"files":["https://qilylean.com/qilylean/daily/2026-10-25.html","https://qilylean.com/qilylean/daily/assets/2026-10-25-brief.css"]}' || true

      - name: Verify responsive W43 on dual-site production
        env:
          QILY_INT_BASE: https://qilylean.com
          QILY_CN_BASE: https://qilylean.cn
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test scripts/dual-site-mobile-axis-20261025.spec.js --grep "W43 governance table uses efficient desktop columns and semantic mobile wrapping" --reporter=line --workers=1 --trace=on

      - name: Roll back CN on failure
        if: failure() && env.W43_PREVIOUS != ''
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          ssh -o ConnectTimeout=20 -o BatchMode=yes -i ~/.ssh/qilylean_cn "$USER_NAME@$CN_PREPROD_HOST" "bash -se -- '$W43_PREVIOUS' '$W43_EXPECTED'" <<'REMOTE'
          set -euo pipefail
          PREVIOUS="$1"; EXPECTED="$2"; SITE_ROOT=/var/www/qilylean-cn
          if [ "$(readlink -f "$SITE_ROOT/current")" = "$EXPECTED" ]; then
            NEXT="$SITE_ROOT/.current-w43responsive-rollback"
            ln -sfn "$PREVIOUS" "$NEXT"
            mv -Tf "$NEXT" "$SITE_ROOT/current"
            sudo nginx -t
          fi
          REMOTE
