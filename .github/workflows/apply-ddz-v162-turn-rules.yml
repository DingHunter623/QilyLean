name: Apply Pure DDZ V162 Turn Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ddz-v162-turn-rules.yml'
      - 'scripts/apply-ddz-v162-turn-rules.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pure-ddz-v162-turn-rules-main
  cancel-in-progress: false

jobs:
  apply-v162:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply V162 authoritative-source changes
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-ddz-v162-turn-rules.js
          node scripts/apply-ddz-v162-turn-rules.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          node --check tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'humanTurnTimer:null' tools/pure-ddz/game/js/game.js
          grep -Fq 'Date.now()+30000' tools/pure-ddz/game/js/game.js
          grep -Fq "speak('该您了')" tools/pure-ddz/game/js/game.js
          grep -Fq '我出${body}' tools/pure-ddz/game/js/game.js
          grep -Fq '30秒未出牌，自动不要' tools/pure-ddz/game/js/game.js
          grep -Fq 'V162 turn-information placement' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'transform:translateY(-14px)!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'transform:scale(1.15)!important' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'function syncViewportProfile()' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'window.visualViewport' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq -- '--ddz-landscape-scale' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'const viewport=()=>' tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          grep -Fq -- '--ddz-v154-w' tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161-v162' tools/pure-ddz/index.html
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161-v162' times26001-home-card.js
          git diff --check
      - name: Commit V162 materialized sources and bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Pure DDZ V162 already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/pure-ddz/game/js/game.js \
            tools/pure-ddz/game/css/visual-tuning-v158.css \
            scripts/materialize-ddz-public-ui-20260824.js \
            scripts/materialize-pure-ddz-home-entry-v158.js \
            tools/pure-ddz/index.html \
            tools/pure-ddz/game/css/ddz-core-v155.css \
            tools/pure-ddz/game/js/ddz-core-v155.js \
            times26001-home-card.js
          git commit -m 'feat(ddz): materialize V162 turn timer narration and enlarged center cards [skip ci]'
          git pull --rebase origin main
          git push origin main
