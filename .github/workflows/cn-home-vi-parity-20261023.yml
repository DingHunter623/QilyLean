name: CN public content & international VI acceptance
on:
  pull_request:
    paths:
      - 'index.html'
      - 'site-home-*.js'
      - 'capabilities/**'
      - 'improvements/**'
      - 'lean-production/**'
      - 'projects/**'
      - 'trust/**'
      - 'knowledge/**'
      - 'links/**'
      - 'qilylean/**'
      - '*.css'
      - 'styles/**'
      - 'cn-site/scripts/**'
      - 'cn-site/assets/cn-sitewide-visual-parity-v1.css'
      - 'scripts/cn-home-visual-parity-20261023.spec.js'
      - 'scripts/test-cn-source-content-parity.py'
      - '.github/workflows/cn-home-vi-parity-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sitewide-source-and-browser-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild China site using the production content pipeline
        run: |
          set -euo pipefail
          python3 scripts/test-cn-source-content-parity.py
          bash cn-site/scripts/materialize-practice-assets.sh
          node scripts/validate-sitewide-vi-unification.js
      - name: Prepare local cross-domain browser comparison
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory . >/tmp/qily-int-home.log 2>&1 &
          python3 -m http.server 4174 --directory cn-site >/tmp/qily-cn-home.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          curl -fsS http://127.0.0.1:4174/ >/dev/null
      - name: Verify 1440/1588/1920 desktop and responsive China site
        env:
          QILY_INT_BASE: http://127.0.0.1:4173
          QILY_CN_BASE: http://127.0.0.1:4174
        run: npx playwright test scripts/cn-home-visual-parity-20261023.spec.js --reporter=line --workers=1 --trace=on
      - name: Store browser screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cn-international-home-and-modules-vi-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
