name: Verify Pure DDZ v1.5 Visual Contract

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-v120-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-dock-share-runtime-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-v120-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-dock-share-runtime-v1.js'
  workflow_dispatch:

jobs:
  verify-v151:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify integrated V151 seven-issue contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check site-dock-share-runtime-v1.js
          grep -Fq '20260902-ddz-integrated-v151' tools/pure-ddz/index.html
          grep -Fq "const chain=['js/card-theme.js','js/ai-expert.js','js/game.js','js/visual-v120.js'];" tools/pure-ddz/index.html
          grep -Fq "loadStyle('css/ddz-site-page-v140.css')" tools/pure-ddz/index.html
          ! grep -Fq "loadStyle('css/ddz-playability-v141.css')" tools/pure-ddz/index.html
          ! grep -Fq 'ddz-site-shell-v140.js' tools/pure-ddz/index.html
          ! grep -Fq 'js/qilylean-theme.js' tools/pure-ddz/index.html
          ! grep -Fq 'js/elder-assist-v140.js' tools/pure-ddz/index.html
          ! grep -Fq '<footer class="site-footer">' tools/pure-ddz/index.html
          ! grep -Fq 'class="ddz-page-note"' tools/pure-ddz/index.html
          grep -Fq '<p id="hint-message" class="hint-message" aria-hidden="true"></p>' tools/pure-ddz/index.html
          ! grep -Fq 'name="screen-orientation"' tools/pure-ddz/index.html
          ! grep -Fq 'name="x5-orientation"' tools/pure-ddz/index.html
          grep -Fq -- '--ddz-game-max:var(--qily-content-axis,1560px)' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'height:clamp(560px,calc(100vh - 260px),620px)' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq '#hint-message.hint-message{display:none!important}' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'qily-rank-suit-line' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "13:{code:'TPM'" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "const VERSION = '1.5.1'" tools/pure-ddz/game/js/game.js
          grep -Fq 'function describePlay(play)' tools/pure-ddz/game/js/game.js
          grep -Fq 'function speakAsync' tools/pure-ddz/game/js/game.js
          grep -Fq "afterNarration(narration,()=>{state.current=nextPlayer(player);render();scheduleTurn();},1100)" tools/pure-ddz/game/js/game.js
          grep -Fq "pass(0,{auto:true})" tools/pure-ddz/game/js/game.js
          grep -Fq "utterance.rate=.82" tools/pure-ddz/game/js/game.js
          grep -Fq '__qilyFloatingDockUnifiedV55' site-dock-share-runtime-v1.js
          grep -Fq 'function isExcluded(){return false;}' site-dock-share-runtime-v1.js
