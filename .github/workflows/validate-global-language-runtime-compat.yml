name: Validate Global Translation Dual Route V2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'site-global-language-v3.js'
      - 'site-global-language-v1.css'
      - 'site-translation-public-ui-v1.js'
      - 'site-translation-public-ui-v1.css'
      - 'site-interaction-contrast-guard-v1.js'
      - 'site-interaction-contrast-guard-v1.css'
      - 'site-navigation.js'
      - 'site-header-axis-v1.css'
      - 'site-translation-progress-v1.js'
      - 'site-translation-progress-v1.css'
      - 'site-parent-navigation-v3.js'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/validate-global-language-runtime-compat-v1.js'
      - 'scripts/validate-home-hero-dock-snapback-v1.js'
      - 'scripts/validate-sitewide-remediation-20260822.js'
      - '.github/workflows/validate-global-language-runtime-compat.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check translation, header and interaction runtimes
        run: |
          node --check site-global-language-v3.js
          node --check site-translation-public-ui-v1.js
          node --check site-translation-progress-v1.js
          node --check site-interaction-contrast-guard-v1.js
          node --check site-navigation.js
          node --check site-parent-navigation-v3.js
          node --check site-ui-consistency-v1.js
          node --check site-dock-share-runtime-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/validate-global-language-runtime-compat-v1.js
          node --check scripts/validate-home-hero-dock-snapback-v1.js
          node --check scripts/validate-sitewide-remediation-20260822.js
      - name: Validate Chinese-default translation and public navigation contract
        run: node scripts/validate-global-language-runtime-compat-v1.js
      - name: Validate homepage, header axis and sitewide compatibility guards
        run: |
          node scripts/validate-home-hero-dock-snapback-v1.js
          node scripts/validate-sitewide-remediation-20260822.js
      - name: Diff hygiene
        run: git diff --check
