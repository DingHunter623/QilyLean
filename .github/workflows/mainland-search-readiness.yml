name: Mainland search crawler readiness

on:
  push:
    branches: [main]
    paths:
      - "robots.txt"
      - "sitemap.xml"
      - "sitemap-core.xml"
      - "sitemap-topics.xml"
      - "sitemap-baidu.xml"
      - "sitemap-cn.xml"
      - "data/baidu-core-urls.json"
      - "scripts/validate-search-engine-discovery.js"
      - ".github/workflows/mainland-search-readiness.yml"
  workflow_dispatch:
  schedule:
    # 09:35 China Standard Time. This verifies crawler reachability after the daily discovery run.
    - cron: "35 1 * * *"

permissions:
  contents: read

concurrency:
  group: mainland-search-readiness-main
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE_ORIGIN: https://qilylean.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate search discovery source contracts
        run: node scripts/validate-search-engine-discovery.js

      - name: Verify Baidu, 360 and Sogou crawler reachability
        shell: bash
        run: |
          set -euo pipefail

          uas=("Baiduspider" "360Spider" "Sogou web spider")
          urls=(
            "$SITE_ORIGIN/"
            "$SITE_ORIGIN/robots.txt"
            "$SITE_ORIGIN/sitemap-cn.xml"
          )

          for attempt in {1..30}; do
            failed=0
            for ua in "${uas[@]}"; do
              for url in "${urls[@]}"; do
                separator='?'
                [[ "$url" == *'?'* ]] && separator='&'
                probe_url="${url}${separator}crawler_probe=${GITHUB_SHA}-${attempt}"
                code="$(curl --location --silent --show-error \
                  --max-time 20 \
                  --user-agent "$ua" \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  "$probe_url" || true)"
                if [ "$code" != "200" ]; then
                  echo "$ua -> $url returned HTTP ${code:-transport-error}"
                  failed=1
                fi
              done
            done

            if [ "$failed" -eq 0 ]; then
              robots_body="$(curl --location --fail --silent --show-error --max-time 20 --user-agent 'Baiduspider' "$SITE_ORIGIN/robots.txt?crawler_probe=$GITHUB_SHA-$attempt")"
              sitemap_body="$(curl --location --fail --silent --show-error --max-time 20 --user-agent '360Spider' "$SITE_ORIGIN/sitemap-cn.xml?crawler_probe=$GITHUB_SHA-$attempt")"
              if grep -Fq 'Sitemap: https://qilylean.com/sitemap-cn.xml' <<<"$robots_body" \
                && grep -Fq '<loc>https://qilylean.com/</loc>' <<<"$sitemap_body"; then
                echo "Baidu, 360 Search and Sogou crawler reachability checks passed."
                exit 0
              fi
              echo "Live robots.txt or sitemap-cn.xml has not reached the expected deployment yet."
            fi

            sleep 10
          done

          echo "Mainland crawler readiness failed after retries."
          exit 1
