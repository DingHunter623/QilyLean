name: 部署 QilyLean AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qilylean-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm install

      - name: 校验多素材、标准Office导出与最新简报
        run: npm run test:maintenance

      - name: 校验 Worker 语法与咨询接口
        shell: bash
        run: |
          node --check cloudflare-worker/worker.js
          grep -q "url.pathname === '/consultations'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/admin/consultations'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/brief-feedback'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/admin/brief-feedback'" cloudflare-worker/worker.js
          grep -q "admin@qilylean.com" cloudflare-worker/worker.js

      - name: 校验 Cloudflare 账户 ID
        shell: bash
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -n 1)"
          if [ "${#ACCOUNT_ID}" -ne 32 ]; then
            echo "Cloudflare 账户 ID 无效：应为 32 位十六进制字符串。"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: 部署 Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 验证 AI 健康状态与真实回答
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://qilylean-ai.dinghunter623.workers.dev';
          const pendingCustomDomains = [
            'https://api.qilylean.com',
            'https://ai-api.qilylean.com'
          ];
          const androidHeaders = {
            Origin: 'https://qilylean.com',
            'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 Chrome/138.0 Mobile Safari/537.36'
          };
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function withRetry(label, task, attempts = 10, delay = 4000) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try { return await task(); }
              catch (error) {
                lastError = error;
                if (attempt < attempts) await wait(delay);
              }
            }
            throw new Error(label + ' failed after route propagation retries: ' + lastError.message);
          }
          await withRetry(base + ' health', async () => {
            const health = await fetch(base + '/health', {
              headers: androidHeaders,
              signal: AbortSignal.timeout(12000)
            });
            if (!health.ok) throw new Error('status ' + health.status);
            if (health.headers.get('access-control-allow-origin') !== 'https://qilylean.com') {
              throw new Error('CORS origin is not available to the website');
            }
            const healthData = await health.json();
            if (healthData.build_version !== 'v1.6.0-brief-engagement') {
              throw new Error('unexpected build ' + healthData.build_version);
            }
          });
          await withRetry(base + ' chat', async () => {
            const chat = await fetch(base + '/chat', {
              method: 'POST',
              headers: {
                ...androidHeaders,
                'Content-Type': 'text/plain;charset=UTF-8',
                Accept: 'application/json'
              },
              body: JSON.stringify({ message: '安卓链路验证：请仅回复OK。' }),
              signal: AbortSignal.timeout(60000)
            });
            const data = await chat.json();
            if (!chat.ok || !String(data.answer || '').trim()) {
              throw new Error('status ' + chat.status);
            }
          }, 3, 3000);
          await withRetry(base + ' brief feedback', async () => {
            const feedback = await fetch(base + '/brief-feedback?brief=2026-07-29', {
              headers: androidHeaders,
              signal: AbortSignal.timeout(12000)
            });
            const data = await feedback.json();
            if (!feedback.ok || data.brief_date !== '2026-07-29') {
              throw new Error('status ' + feedback.status);
            }
            for (const field of ['rating_average', 'rating_count', 'likes', 'dislikes']) {
              if (typeof data[field] !== 'number') throw new Error('missing numeric field ' + field);
            }
          });
          const speech = await fetch(base + '/tts', {
            method: 'POST',
            headers: {
              ...androidHeaders,
              'Content-Type': 'text/plain;charset=UTF-8'
            },
            body: JSON.stringify({ text: 'QilyLean AI 男声发布验证。', gender: 'male' }),
            signal: AbortSignal.timeout(45000)
          });
          const speechType = speech.headers.get('content-type') || '';
          const speechVoice = speech.headers.get('x-qilylean-voice') || '';
          const speechBytes = new Uint8Array(await speech.arrayBuffer());
          if (!speech.ok || !speechType.startsWith('audio/') || speechVoice !== 'Neil' || speechBytes.length < 1000) {
            throw new Error('AI male voice smoke test failed: ' + speech.status);
          }
          for (const customBase of pendingCustomDomains) {
            try {
              const customHealth = await fetch(customBase + '/health', {
                headers: androidHeaders,
                signal: AbortSignal.timeout(8000)
              });
              if (!customHealth.ok) throw new Error('status ' + customHealth.status);
              console.log(customBase + ' custom-domain endpoint is ready.');
            } catch (error) {
              console.warn(customBase + ' is pending DNS/zone activation: ' + error.message);
            }
          }
          console.log('QilyLean AI Android Worker, real answer and male voice checks passed.');
          NODE
