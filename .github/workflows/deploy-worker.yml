name: 部署 QilyLean AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
      - "site-translation-safe-runtime-v1.js"
      - "scripts/validate-global-language-runtime-compat-v1.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qilylean-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[translation-only]')
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm install

      - name: 校验翻译运行时与 Worker 契约
        shell: bash
        run: |
          node --check site-translation-safe-runtime-v1.js
          node --check cloudflare-worker/worker.js
          node --check cloudflare-worker/worker-social.js
          node --check scripts/validate-global-language-runtime-compat-v1.js
          # Worker deployment must not depend on unrelated CN page/cache rollout state.
          # Keep worker/provider checks local to this workflow; production translation
          # is verified after deployment by the real /health and /translate smoke tests.
          grep -q "url.pathname === '/consultations'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/admin/consultations'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/brief-feedback'" cloudflare-worker/worker-social.js
          grep -q "url.pathname === '/admin/brief-feedback'" cloudflare-worker/worker-social.js
          grep -q "url.pathname === '/translate'" cloudflare-worker/worker-social.js
          grep -q "TRANSLATION_SYSTEM_INSTRUCTIONS" cloudflare-worker/worker-social.js
          grep -q "BAIDU_TRANSLATE_URL = 'https://fanyi-api.baidu.com/api/trans/vip/translate'" cloudflare-worker/worker-social.js
          grep -q "callBaiduTranslation" cloudflare-worker/worker-social.js
          grep -q "callYoudaoTranslation" cloudflare-worker/worker-social.js
          grep -q "TRANSLATION_CACHE_VERSION = 'v5-provider-aware'" cloudflare-worker/worker-social.js
          grep -q 'TRANSLATE_DAILY_IP_LIMIT = "600"' wrangler.toml
          grep -q 'TRANSLATE_PROVIDER = "baidu"' wrangler.toml
          grep -q "admin@qilylean.com" cloudflare-worker/worker.js

      - name: 校验 Cloudflare 账户 ID
        shell: bash
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -n 1)"
          if [ "${#ACCOUNT_ID}" -ne 32 ]; then
            echo "Cloudflare 账户 ID 无效：应为 32 位十六进制字符串。"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: 同步百度翻译密钥到 Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BAIDU_TRANSLATE_APP_ID: ${{ secrets.BAIDU_TRANSLATE_APP_ID }}
          BAIDU_TRANSLATE_APP_KEY: ${{ secrets.BAIDU_TRANSLATE_APP_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$BAIDU_TRANSLATE_APP_ID" ] && [ -n "$BAIDU_TRANSLATE_APP_KEY" ]; then
            printf '%s' "$BAIDU_TRANSLATE_APP_ID" | npx wrangler secret put BAIDU_TRANSLATE_APP_ID
            printf '%s' "$BAIDU_TRANSLATE_APP_KEY" | npx wrangler secret put BAIDU_TRANSLATE_APP_KEY
            echo "Baidu Translate credentials synchronized."
          else
            echo "Baidu Translate repository secrets are not configured; Worker will use the existing safe translation fallback."
          fi

      - name: 同步有道翻译密钥到 Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUDAO_APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          YOUDAO_APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$YOUDAO_APP_KEY" ] && [ -n "$YOUDAO_APP_SECRET" ]; then
            printf '%s' "$YOUDAO_APP_KEY" | npx wrangler secret put YOUDAO_APP_KEY
            printf '%s' "$YOUDAO_APP_SECRET" | npx wrangler secret put YOUDAO_APP_SECRET
            echo "Youdao credentials synchronized."
          else
            echo "Youdao repository secrets are not configured; deploy will keep translation available through the existing Worker AI provider fallback."
          fi

      - name: 部署 Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 验证 AI 健康状态、翻译与真实回答
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://qilylean-ai.dinghunter623.workers.dev';
          const pendingCustomDomains = [
            'https://api.qilylean.com',
            'https://ai-api.qilylean.com'
          ];
          const androidHeaders = {
            Origin: 'https://qilylean.com',
            'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 Chrome/138.0 Mobile Safari/537.36'
          };
          let healthSnapshot = null;
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function withRetry(label, task, attempts = 10, delay = 4000) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try { return await task(); }
              catch (error) {
                lastError = error;
                if (attempt < attempts) await wait(delay);
              }
            }
            throw new Error(label + ' failed after route propagation retries: ' + lastError.message);
          }
          await withRetry(base + ' health', async () => {
            const health = await fetch(base + '/health', {
              headers: androidHeaders,
              signal: AbortSignal.timeout(12000)
            });
            if (!health.ok) throw new Error('status ' + health.status);
            if (health.headers.get('access-control-allow-origin') !== 'https://qilylean.com') {
              throw new Error('CORS origin is not available to the website');
            }
            const healthData = await health.json();
            healthSnapshot = healthData;
            if (healthData.build_version !== 'v1.6.0-brief-engagement') {
              throw new Error('unexpected build ' + healthData.build_version);
            }
            if (healthData.translation_provider !== 'baidu') {
              throw new Error('translation preference is not Baidu');
            }
            if (!healthData.baidu_available && !healthData.youdao_available && !healthData.qwen_available && !healthData.openai_available) {
              throw new Error('no translation backend is provisioned');
            }
            console.log('Translation health:', JSON.stringify({
              preferred: healthData.translation_provider,
              baidu_available: healthData.baidu_available,
              youdao_available: healthData.youdao_available,
              qwen_available: healthData.qwen_available,
              openai_available: healthData.openai_available
            }));
          });
          await withRetry(base + ' translation', async () => {
            const translation = await fetch(base + '/translate', {
              method: 'POST',
              headers: {
                ...androidHeaders,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify({
                source_language: 'zh-CN',
                target_language: 'en',
                texts: ['精益生产', 'QilyLean｜启力精益']
              }),
              signal: AbortSignal.timeout(60000)
            });
            const data = await translation.json();
            if (!translation.ok || !data.ok || !Array.isArray(data.translations) || data.translations.length !== 2) {
              throw new Error('status ' + translation.status);
            }
            if (healthSnapshot && healthSnapshot.baidu_available === true) {
              if (data.provider !== 'baidu') {
                throw new Error('Baidu is provisioned but translation provider is ' + String(data.provider || ''));
              }
            } else if (healthSnapshot && healthSnapshot.youdao_available === true) {
              if (data.provider !== 'youdao') {
                throw new Error('Baidu is unavailable and Youdao is provisioned, but translation provider is ' + String(data.provider || ''));
              }
            } else if (!['qwen','openai'].includes(String(data.provider || ''))) {
              throw new Error('translation fallback provider is unavailable: ' + String(data.provider || ''));
            }
            if (!String(data.translations[0] || '').trim() || data.translations[0] === '精益生产') {
              throw new Error('translation backend did not translate the smoke-test source text');
            }
            if (data.translations[1] !== 'QilyLean｜启力精益') {
              throw new Error('protected brand token changed');
            }
            console.log('Translation smoke provider:', String(data.provider || 'unknown'));
          }, 3, 3000);
          await withRetry(base + ' chat', async () => {
            const chat = await fetch(base + '/chat', {
              method: 'POST',
              headers: {
                ...androidHeaders,
                'Content-Type': 'text/plain;charset=UTF-8',
                Accept: 'application/json'
              },
              body: JSON.stringify({ message: '安卓链路验证：请仅回复OK。' }),
              signal: AbortSignal.timeout(60000)
            });
            const data = await chat.json();
            if (!chat.ok || !String(data.answer || '').trim()) {
              throw new Error('status ' + chat.status);
            }
          }, 3, 3000);
          await withRetry(base + ' brief feedback', async () => {
            const feedback = await fetch(base + '/brief-feedback?brief=2026-07-29', {
              headers: androidHeaders,
              signal: AbortSignal.timeout(12000)
            });
            const data = await feedback.json();
            if (!feedback.ok || data.brief_date !== '2026-07-29') {
              throw new Error('status ' + feedback.status);
            }
            for (const field of ['rating_average', 'rating_count', 'likes', 'dislikes']) {
              if (typeof data[field] !== 'number') throw new Error('missing numeric field ' + field);
            }
          });
          const speech = await fetch(base + '/tts', {
            method: 'POST',
            headers: {
              ...androidHeaders,
              'Content-Type': 'text/plain;charset=UTF-8'
            },
            body: JSON.stringify({ text: 'QilyLean AI 男声发布验证。', gender: 'male' }),
            signal: AbortSignal.timeout(45000)
          });
          const speechType = speech.headers.get('content-type') || '';
          const speechVoice = speech.headers.get('x-qilylean-voice') || '';
          const speechBytes = new Uint8Array(await speech.arrayBuffer());
          if (!speech.ok || !speechType.startsWith('audio/') || speechVoice !== 'Neil' || speechBytes.length < 1000) {
            throw new Error('AI male voice smoke test failed: ' + speech.status);
          }
          for (const customBase of pendingCustomDomains) {
            try {
              const customHealth = await fetch(customBase + '/health', {
                headers: androidHeaders,
                signal: AbortSignal.timeout(8000)
              });
              if (!customHealth.ok) throw new Error('status ' + customHealth.status);
              console.log(customBase + ' custom-domain endpoint is ready.');
            } catch (error) {
              console.warn(customBase + ' is pending DNS/zone activation: ' + error.message);
            }
          }
          console.log('QilyLean AI Worker, translation, Android chain and male voice checks passed.');
          NODE
