name: 部署 QilyLean AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qilylean-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm install

      - name: 校验 Worker 语法与咨询接口
        shell: bash
        run: |
          node --check cloudflare-worker/worker.js
          grep -q "url.pathname === '/consultations'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/admin/consultations'" cloudflare-worker/worker.js
          grep -q "396767769@qq.com" cloudflare-worker/worker.js

      - name: 校验 Cloudflare 账户 ID
        shell: bash
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -n 1)"
          if [ "${#ACCOUNT_ID}" -ne 32 ]; then
            echo "Cloudflare 账户 ID 无效：应为 32 位十六进制字符串。"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: 部署 Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 验证 AI 健康状态与真实回答
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://qilylean-ai.dinghunter623.workers.dev';
          const health = await fetch(base + '/health');
          if (!health.ok) throw new Error('AI health check failed: ' + health.status);
          const chat = await fetch(base + '/chat', {
            method: 'POST',
            headers: {
              Origin: 'https://qilylean.com',
              'Content-Type': 'text/plain;charset=UTF-8'
            },
            body: JSON.stringify({ message: '健康检查：请仅回复OK。' })
          });
          const data = await chat.json();
          if (!chat.ok || !String(data.answer || '').trim()) {
            throw new Error('AI answer smoke test failed: ' + chat.status);
          }
          const speech = await fetch(base + '/tts', {
            method: 'POST',
            headers: {
              Origin: 'https://qilylean.com',
              'Content-Type': 'text/plain;charset=UTF-8'
            },
            body: JSON.stringify({ text: 'QilyLean AI 男声发布验证。', gender: 'male' })
          });
          const speechType = speech.headers.get('content-type') || '';
          const speechVoice = speech.headers.get('x-qilylean-voice') || '';
          const speechBytes = new Uint8Array(await speech.arrayBuffer());
          if (!speech.ok || !speechType.startsWith('audio/') || speechVoice !== 'Neil' || speechBytes.length < 1000) {
            throw new Error('AI male voice smoke test failed: ' + speech.status);
          }
          console.log('QilyLean AI health, answer and male voice checks passed.');
          NODE
