name: Publish Sitewide V28 Visual Closure

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/materialize-contact-route-v6.js'
      - 'scripts/validate-r7-authoritative-runtime-20260828.js'
      - 'scripts/validate-sitewide-visual-closure-v27.js'
      - 'site-visual-system-v2.css'
      - 'site-responsive-containment-v1.css'
      - 'site-header-project-integrity-v2.css'
      - 'site-public-redline-closure-v1.css'
      - 'site-public-redline-closure-v2.css'
      - 'site-contact-route-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'site-core-service-dock-closure-v1.js'
      - 'site-navigation.js'
      - 'site-header-axis-v1.css'
      - 'site-interaction-continuity-v1.css'
      - 'site-interaction-semantics-v1.css'
      - 'site-interaction-semantics-v1.js'
      - 'tools/pure-ddz/game/css/r8-closure-v128.css'
      - 'capabilities/index.html'
      - 'cooperation/index.html'
      - 'lean-production/index.html'
      - 'projects/index.html'
      - 'projects/automotive-lean/index.html'
      - 'trust/index.html'
      - 'assets/qilylean-aircraft-hero-approved-20260826.png'
      - 'assets/qilylean-aircraft-hero-latest-q98.webp'
      - 'tools/pure-ddz/index.html'
      - 'tools/pure-ddz/game/js/game.js'
      - '.github/workflows/publish-visual-regression-contact-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitewide-v28-visual-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v28-materialized]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate V28 authoritative source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/materialize-contact-route-v6.js
          node --check scripts/validate-r7-authoritative-runtime-20260828.js
          node --check scripts/validate-sitewide-visual-closure-v27.js
          node --check site-contact-route-v1.js
          node --check site-dock-share-runtime-v1.js
          node --check site-ui-consistency-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check site-navigation.js
          node --check site-interaction-semantics-v1.js
          node scripts/validate-r7-authoritative-runtime-20260828.js
          node scripts/validate-sitewide-visual-closure-v27.js
          grep -Fq "const BASELINE_VERSION='20260830-sitewide-responsive-containment-v28'" scripts/materialize-global-language-v3.js
          grep -Fq "const FINAL_INTEGRITY_CSS='/site-header-project-integrity-v2.css?v=20260830-header-project-integrity-v2'" scripts/materialize-global-language-v3.js
          grep -Fq 'QilyLean Header + Project Integrity V2' site-header-project-integrity-v2.css
          grep -Fq 'flex:0 0 206px!important' site-header-project-integrity-v2.css
          grep -Fq 'project-list-card .qily-project-list-grade>b' site-header-project-integrity-v2.css
          grep -Fq 'project-detail-page .module-hero .qily-project-evidence-grade>span' site-header-project-integrity-v2.css
          grep -Fq 'QilyLean Interaction Semantics V1.4' site-interaction-semantics-v1.css
          grep -Fq '__qilyInteractionSemanticsV14' site-interaction-semantics-v1.js
          grep -Fq 'qily-primary-nav-scroll-rail' site-interaction-semantics-v1.js
          grep -Fq '.brief-action-strip>span' site-interaction-semantics-v1.js
          grep -Fq 'Pure DDZ R12 Closure V132' tools/pure-ddz/game/css/r8-closure-v128.css
          grep -Fq 'justify-content:safe center!important' tools/pure-ddz/game/css/r8-closure-v128.css
          grep -Fq "const ROUTE='/site-contact-route-v1.js?v=20260829-dock-functional-public-v134'" scripts/materialize-contact-route-v6.js
          grep -Fq "const DOCK='/site-dock-share-runtime-v1.js?v=20260829-authority-v54'" scripts/materialize-contact-route-v6.js
          grep -Fq "w.open(url,'_blank','noopener,noreferrer')" site-dock-share-runtime-v1.js
          ! grep -Fq "mask.classList.add('show')" site-dock-share-runtime-v1.js
          ! grep -Eq 'new[[:space:]]+MutationObserver[[:space:]]*\(' site-dock-share-runtime-v1.js
          ! grep -Eq 'new[[:space:]]+MutationObserver[[:space:]]*\(' site-navigation.js

      - name: Materialize V28 to every tracked public HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "V28 publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node scripts/validate-r7-authoritative-runtime-20260828.js
            node scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js --check
            node scripts/materialize-contact-route-v6.js
            node scripts/materialize-contact-route-v6.js --check
            node scripts/validate-seo-indexability.js
            grep -Fq '/site-header-axis-v1.css?v=20260829-primary-navigation-safe-scroll-v7' index.html
            grep -Fq '/site-interaction-semantics-v1.css?v=20260829-r11-semantics-v14-visual-0830-v2' index.html
            grep -Fq '/site-responsive-containment-v1.css?v=20260830-header-integrity-v2' index.html
            grep -Fq '/site-header-project-integrity-v2.css?v=20260830-header-project-integrity-v2' index.html
            grep -Fq '/site-header-project-integrity-v2.css?v=20260830-header-project-integrity-v2' projects/index.html
            grep -Fq '/site-header-project-integrity-v2.css?v=20260830-header-project-integrity-v2' projects/automotive-lean/index.html
            grep -Fq '/site-interaction-semantics-v1.js?v=20260829-r11-semantics-v14' knowledge/index.html
            grep -Fq '/tools/pure-ddz/game/css/r8-closure-v128.css?v=20260829-r12-v132' tools/pure-ddz/index.html
            grep -Fq '/site-contact-route-v1.js?v=20260829-dock-functional-public-v134' tools/pure-ddz/index.html
            grep -Fq 'data-qily-interaction-semantics-direct="v1.4"' qilylean/daily/2026-07-29.html
            git diff --check
            if git diff --quiet; then
              echo 'V28 public baseline already current on latest main.'
              exit 0
            fi
            git add -- ':(glob)**/*.html'
            git commit -m 'fix: materialize V28 header project integrity [v28-materialized]'
            if git push origin HEAD:main; then
              echo 'V28 authoritative baseline published to tracked public HTML.'
              exit 0
            fi
            echo 'main advanced during publication; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish V28 after retries.'
          exit 1
