name: Publish Sitewide Visual & Contact Closure V12

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-contact-route-v6.js'
      - 'site-public-redline-closure-v1.css'
      - 'site-core-service-dock-closure-v1.css'
      - 'site-contact-route-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'contact/index.html'
      - '.github/workflows/publish-visual-regression-contact-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitewide-visual-contact-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[visual-contact-materialized]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate V12 source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-contact-route-v6.js
          node --check site-contact-route-v1.js
          node --check site-dock-share-runtime-v1.js
          grep -Fq 'Site Shell Recovery + Contact Route V12' site-contact-route-v1.js
          grep -Fq '__qilySiteShellRecoveryV12' site-contact-route-v1.js
          grep -Fq 'site-dock-share-runtime-v1.js?v=20260828-functional-public-v4' site-contact-route-v1.js
          grep -Fq 'site-public-redline-closure-v1.css?v=20260828-home-dock-v1' site-contact-route-v1.js
          grep -Fq 'Floating Dock Unified Runtime V4' site-dock-share-runtime-v1.js
          grep -Fq '__qilyFloatingDockUnifiedV4' site-dock-share-runtime-v1.js
          grep -Fq "var glyph=action==='top'?'↑':'↗'" site-dock-share-runtime-v1.js
          grep -Fq 'installIntegrityObserver' site-dock-share-runtime-v1.js
          grep -Fq 'body.qily-home-v3 .hero::after' site-public-redline-closure-v1.css
          grep -Fq 'content:none!important' site-public-redline-closure-v1.css
          grep -Fq 'data-action="top"' site-public-redline-closure-v1.css
          grep -Fq 'rotate:0deg!important' site-public-redline-closure-v1.css
          ! grep -Fq 'qily-float-top {' site-core-service-dock-closure-v1.css
      - name: Materialize V12 to every tracked public HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Sitewide V12 publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node --check scripts/materialize-contact-route-v6.js
            node scripts/materialize-contact-route-v6.js
            node scripts/materialize-contact-route-v6.js --check
            node scripts/validate-seo-indexability.js
            grep -Fq 'data-qily-contact-route-direct="v12"' index.html
            grep -Fq '/site-contact-route-v1.js?v=20260828-dock-functional-public-v12' index.html
            grep -Fq '/site-public-redline-closure-v1.css?v=20260828-home-dock-v1' index.html
            grep -Fq 'data-qily-contact-route-direct="v12"' contact/index.html
            grep -Fq '/site-public-redline-closure-v1.css?v=20260828-home-dock-v1' contact/index.html
            ! grep -q '<iframe' contact/index.html
            git diff --check
            if git diff --quiet; then
              echo 'Sitewide V12 baseline already current on latest main.'
              exit 0
            fi
            git add -- ':(glob)**/*.html'
            git commit -m 'fix: materialize homepage and Dock V12 [visual-contact-materialized]'
            if git push origin HEAD:main; then
              echo 'Sitewide homepage/Dock V12 published to tracked HTML.'
              exit 0
            fi
            echo 'main advanced during publication; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish sitewide V12 after retries.'
          exit 1
