name: Publish Sitewide Visual & Contact Closure V10

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-global-language-v3.js'
      - 'scripts/materialize-contact-route-v6.js'
      - 'site-unified-visual-governance-v1.css'
      - 'site-visual-regression-closure-v1.css'
      - 'site-stability-recovery-v1.css'
      - 'site-content-contrast-guard-v1.js'
      - 'site-content-contrast-guard-v1.css'
      - 'site-early-career-history-v1.css'
      - 'site-core-service-dock-closure-v1.js'
      - 'site-contact-route-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-ui-consistency-v1.js'
      - 'contact/index.html'
      - 'lean-production/index.html'
      - '.github/workflows/publish-visual-regression-contact-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitewide-visual-contact-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[visual-contact-materialized]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate visual and contact sources
        run: |
          node --check scripts/materialize-global-language-v3.js
          node --check scripts/materialize-contact-route-v6.js
          node --check site-content-contrast-guard-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check site-contact-route-v1.js
          node --check site-dock-share-runtime-v1.js
      - name: Materialize public baseline to every tracked HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Sitewide visual/contact publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node --check scripts/materialize-global-language-v3.js
            node --check scripts/materialize-contact-route-v6.js
            node scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js --check
            node scripts/materialize-contact-route-v6.js
            node scripts/materialize-contact-route-v6.js --check
            node scripts/validate-seo-indexability.js
            grep -q 'Site Shell Recovery + Contact Route V10' site-contact-route-v1.js
            grep -q '__qilySiteShellRecoveryV10' site-contact-route-v1.js
            grep -q 'disconnectRetiredDockObserver' site-contact-route-v1.js
            grep -q '#floatDock.qily-float-dock,#floatDock.qily-floating-dock{display:flex!important' site-contact-route-v1.js
            ! grep -q 'installRetirementObserver' site-contact-route-v1.js
            grep -q 'Floating Dock Unified Runtime V2' site-dock-share-runtime-v1.js
            grep -q 'qilyDockSemanticUnifiedV2' site-dock-share-runtime-v1.js
            grep -q "ORDER=\['home','top','back','search','current','contact'\]" site-dock-share-runtime-v1.js
            grep -q "normalizeSemanticButton(controls.top,'top',LABELS.top)" site-dock-share-runtime-v1.js
            grep -q "normalizeSemanticButton(controls.back,'back',LABELS.back)" site-dock-share-runtime-v1.js
            grep -q 'sanitizeContactMaps' site-contact-route-v1.js
            grep -q "google:'https://www.google.com/maps/dir/?api=1&destination='" site-contact-route-v1.js
            grep -q "apple:'https://maps.apple.com/?daddr='" site-contact-route-v1.js
            grep -q 'QilyLean Sitewide Visual Regression Closure V2' site-visual-regression-closure-v1.css
            grep -q 'background:var(--qily-fix-alt)!important' site-visual-regression-closure-v1.css
            grep -q 'contact-page-v3 .map-preview iframe' site-stability-recovery-v1.css
            grep -q '/qilylean/wechat-qrcode-20260826.png?v=20260826-user-resubmitted-v2' contact/index.html
            grep -q 'data-qily-map-address="苏吕党主题公园"' contact/index.html
            grep -q 'data-qily-map-address="皂三村口 石羊街139号"' contact/index.html
            grep -q 'data-qily-clean-map-nav="v2"' contact/index.html
            grep -q 'data-qily-map-provider="amap"' contact/index.html
            grep -q 'data-qily-map-provider="baidu"' contact/index.html
            grep -q 'data-qily-map-provider="tencent"' contact/index.html
            grep -q 'data-qily-map-provider="google"' contact/index.html
            grep -q 'data-qily-map-provider="apple"' contact/index.html
            grep -q 'uri.amap.com/search' contact/index.html
            grep -q 'api.map.baidu.com/place/search' contact/index.html
            grep -q 'apis.map.qq.com/uri/v1/search' contact/index.html
            grep -q 'www.google.com/maps/dir/?api=1' contact/index.html
            grep -q 'maps.apple.com/?daddr=' contact/index.html
            ! grep -q '<iframe' contact/index.html
            ! grep -q 'api.map.baidu.com/geocoder' contact/index.html
            grep -q 'data-qily-contact-route-direct="v10"' contact/index.html
            grep -q '20260828-dock-functional-symbol-v10' contact/index.html
            git diff --check
            if git diff --quiet; then
              echo 'Sitewide visual/contact baseline already current on latest main.'
              exit 0
            fi
            git add -- ':(glob)**/*.html'
            git commit -m 'fix: materialize functional sitewide Dock V10 [visual-contact-materialized]'
            if git push origin HEAD:main; then
              echo 'Sitewide visual/contact V10 published to tracked HTML.'
              exit 0
            fi
            echo 'main advanced during publication; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish sitewide visual/contact V10 after retries.'
          exit 1
