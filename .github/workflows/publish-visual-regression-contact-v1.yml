name: Publish Sitewide Visual & Contact Closure V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-global-language-v3.js'
      - 'site-unified-visual-governance-v1.css'
      - 'site-visual-regression-closure-v1.css'
      - 'site-content-contrast-guard-v1.js'
      - 'site-content-contrast-guard-v1.css'
      - 'site-early-career-history-v1.css'
      - 'site-core-service-dock-closure-v1.js'
      - 'site-contact-route-v1.js'
      - 'assets/contact/wechat-contact-card.svg'
      - 'contact/index.html'
      - 'lean-production/index.html'
      - '.github/workflows/publish-visual-regression-contact-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitewide-visual-contact-main
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[visual-contact-materialized]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate visual and contact sources
        run: |
          node --check scripts/materialize-global-language-v3.js
          node --check site-content-contrast-guard-v1.js
          node --check site-core-service-dock-closure-v1.js
          node --check site-contact-route-v1.js
      - name: Materialize public baseline to every tracked HTML page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            echo "Sitewide visual/contact publish attempt ${attempt}/4"
            git fetch origin main
            git reset --hard origin/main
            node --check scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js
            node scripts/materialize-global-language-v3.js --check
            node scripts/validate-seo-indexability.js
            grep -q 'Site Shell Recovery + Contact Route V5' site-contact-route-v1.js
            grep -q "w.open(CONTACT_URL,'_blank')" site-contact-route-v1.js
            grep -q 'new-window-v5' site-contact-route-v1.js
            grep -q 'QilyLean Sitewide Visual Regression Closure V2' site-visual-regression-closure-v1.css
            grep -q 'background:var(--qily-fix-alt)!important' site-visual-regression-closure-v1.css
            grep -q 'width="888" height="1131"' assets/contact/wechat-contact-card.svg
            grep -q '东方猎手微信二维码' assets/contact/wechat-contact-card.svg
            grep -q '20260826-official-restored-v2' contact/index.html
            grep -q 'data-qily-contact-route-direct="v5"' contact/index.html
            grep -q '20260826-screenshot-closure-v2' contact/index.html
            git diff --check
            if git diff --quiet; then
              echo 'Sitewide visual/contact baseline already current on latest main.'
              exit 0
            fi
            git add -- ':(glob)**/*.html'
            git commit -m 'fix: materialize sitewide visual and contact closure [visual-contact-materialized]'
            if git push origin HEAD:main; then
              echo 'Sitewide visual/contact closure published to tracked HTML.'
              exit 0
            fi
            echo 'main advanced during publication; retrying from newest main.'
            sleep $((attempt * 3))
          done
          echo 'Unable to publish sitewide visual/contact closure after retries.'
          exit 1
