name: Pin brief social counter client

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pin-brief-social-client.yml"

permissions:
  contents: write

jobs:
  pin-client:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin all brief pages and generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '/qilylean/daily-feedback.js?v=20260729-brief-engagement-v1'
          new = '/qilylean/daily-feedback.js?v=20260729-social-counts-v3'
          files = [
              Path('scripts/build-daily-archive.js'),
              Path('scripts/validate-daily-archive.js'),
              *Path('qilylean/daily').glob('*.html')
          ]
          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              revised = text.replace(old, new)
              revised = revised.replace('暂无评分，期待你的第一颗星。', '累计评分 0｜五星好评 0，期待你的第一颗星。')
              revised = revised.replace('评分与好／差评仅展示汇总数据；留言不会在公开页面展示', '评分、五星好评、好／差评及留言数量仅展示汇总数据；留言正文不会在公开页面展示')
              if revised != text:
                  path.write_text(revised, encoding='utf-8')
                  changed += 1
          if not changed:
              raise SystemExit('No brief client references were updated')
          print('updated files:', changed)
          PY

      - name: Validate pinned client
        shell: bash
        run: |
          node --check qilylean/daily-feedback.js
          grep -q '20260729-social-counts-v3' qilylean/daily/2026-07-29.html
          grep -q '20260729-social-counts-v3' scripts/build-daily-archive.js
          if grep -R '20260729-brief-engagement-v1' qilylean/daily scripts/build-daily-archive.js scripts/validate-daily-archive.js >/dev/null; then
            echo 'Old brief feedback cache version remains'
            exit 1
          fi

      - name: Commit cache pinning
        shell: bash
        run: |
          git rm .github/workflows/pin-brief-social-client.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-daily-archive.js scripts/validate-daily-archive.js qilylean/daily/*.html
          git commit -m "build: pin brief social counter client [skip ci]"
          git push
