name: Remediate mobile Dock and first-paint navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remediate-mobile-dock-first-paint-v1.js'
      - 'site-dock-share-runtime-v1.js'
      - 'site-navigation.js'
      - 'site-navigation-core.js'
      - 'site-navigation-legacy-20260802.js'
      - 'scripts/align-primary-nav-operating-axis.js'
      - 'scripts/enforce-six-core-navigation.js'
      - '**/*.html'
      - '.github/workflows/remediate-mobile-dock-first-paint-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-mobile-dock-first-paint-v1
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Materialize mobile Dock and static first-paint navigation
        run: |
          set -euo pipefail
          node --check scripts/remediate-mobile-dock-first-paint-v1.js
          node scripts/remediate-mobile-dock-first-paint-v1.js --apply
          node --check site-dock-share-runtime-v1.js
          node --check site-navigation.js
          node --check site-navigation-core.js
          node --check site-navigation-legacy-20260802.js
          node scripts/remediate-mobile-dock-first-paint-v1.js
          git diff --check

      - name: Verify closure invariants
        run: |
          set -euo pipefail
          grep -q "home:\['首页'\],top:\['顶部'\]" site-dock-share-runtime-v1.js
          grep -q "mobile-fixed-bottom-compact-navigation" site-dock-share-runtime-v1.js
          grep -q "grid-template-columns','repeat(7,minmax(0,1fr))" site-dock-share-runtime-v1.js
          grep -q "\['精益生产', '/lean-production/'\]" site-navigation-core.js
          grep -q "\['资源协同', '/links/'\]" site-navigation-core.js
          ! grep -q "\['友情链接', '/links/'\]" site-navigation-core.js
          grep -q '20260906-primary-first-paint-core-v31' site-navigation.js
          grep -q '20260906-primary-first-paint-legacy-v24' site-navigation.js
          grep -q '资源协同' index.html
          grep -q '精益生产' index.html

      - name: Commit closed public source
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Mobile Dock and first-paint navigation are already closed.'
            exit 0
          fi
          git commit -m 'fix: close mobile Dock and first-paint navigation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
