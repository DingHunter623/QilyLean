name: Verify Pure DDZ Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'times26001-home-card.js'
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'times26001-home-card.js'
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify current playable elder-friendly same-origin release
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/qilylean-theme.js
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/ai-expert.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'id="start"' tools/pure-ddz/index.html
          grep -Fq 'id="hand"' tools/pure-ddz/index.html
          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          grep -Fq '20260828-elder-ux-v125' tools/pure-ddz/index.html
          grep -Fq 'name="screen-orientation" content="landscape"' tools/pure-ddz/index.html
          grep -Fq 'name="x5-orientation" content="landscape"' tools/pure-ddz/index.html
          grep -Fq 'Android版暂未开放' tools/pure-ddz/index.html
          grep -Fq "screen.orientation.lock('landscape')" tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'grid-template-areas:"brand score translate" "actions actions actions"' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq '.bottom-cards .mini-card{min-width:98px' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq '.v120-play-card{flex-basis:124px' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq '#floatDock.qily-float-dock.qily-float-dock' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq "const VERSION = '1.2.4'" tools/pure-ddz/game/js/game.js
          grep -Fq "state.settings.difficulty==='expert'?1750+Math.random()*450" tools/pure-ddz/game/js/game.js
          ! grep -Fq 'C919' tools/pure-ddz/game/js/card-theme.js
          grep -Fq "qilylean-aircraft-hero-latest-q98.webp" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "16:{type:'small-joker',title:'小王',image:assetUrl('avatar-king.webp'),aircraft:HOME_AIRCRAFT}" tools/pure-ddz/game/js/card-theme.js
          grep -Fq "17:{type:'big-joker',title:'大王',image:assetUrl('avatar-king.webp')}" tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'qily-joker-aircraft' tools/pure-ddz/game/js/card-theme.js
          grep -Fq '#hint-message.hint-message' tools/pure-ddz/game/js/card-theme.js
          grep -Fq ':has(.card:nth-child(18))' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'QilyLeanDDZElderV123' tools/pure-ddz/game/js/qilylean-theme.js
          grep -Fq '4个' tools/pure-ddz/game/js/qilylean-theme.js
          ! grep -Fq 'Pure-DDZ-Classic-v1.0.3.apk' tools/pure-ddz/index.html
          git diff --check

      - name: Verify deployed elder-friendly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ok=0
          for i in {1..48}; do
            if curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/?verify=20260828-elder-v125' -o /tmp/page.html \
              && grep -Fq '20260828-elder-ux-v125' /tmp/page.html \
              && grep -Fq 'name="screen-orientation" content="landscape"' /tmp/page.html \
              && grep -Fq 'name="x5-orientation" content="landscape"' /tmp/page.html \
              && grep -Fq 'Android版暂未开放' /tmp/page.html; then
              ok=1
              break
            fi
            echo "Waiting for QilyLean Pure DDZ elder UX deployment: $i/48"
            sleep 10
          done
          test "$ok" = 1
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/qilylean-theme.js?verify=20260828-v125' -o /tmp/qily-theme.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/card-theme.js?verify=20260828-v125' -o /tmp/card-theme.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/game.js?verify=20260828-v125' -o /tmp/game.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/visual-v120.js?verify=20260828-v125' -o /tmp/visual.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/css/card-comfort-v122.css?verify=20260828-v125' -o /tmp/comfort.css
          node --check /tmp/qily-theme.js
          node --check /tmp/card-theme.js
          node --check /tmp/game.js
          node --check /tmp/visual.js
          grep -Fq "screen.orientation.lock('landscape')" /tmp/visual.js
          grep -Fq 'grid-template-areas:"brand score translate" "actions actions actions"' /tmp/comfort.css
          grep -Fq '.bottom-cards .mini-card{min-width:98px' /tmp/comfort.css
          grep -Fq '#floatDock.qily-float-dock.qily-float-dock' /tmp/comfort.css
          grep -Fq "const VERSION = '1.2.4'" /tmp/game.js
          grep -Fq "state.settings.difficulty==='expert'?1750+Math.random()*450" /tmp/game.js
          ! grep -Fq 'C919' /tmp/card-theme.js
          grep -Fq 'qilylean-aircraft-hero-latest-q98.webp' /tmp/card-theme.js
          grep -Fq 'qily-joker-aircraft' /tmp/card-theme.js
          grep -Fq '#hint-message.hint-message' /tmp/card-theme.js
          grep -Fq ':has(.card:nth-child(18))' /tmp/card-theme.js
          grep -Fq 'QilyLeanDDZElderV123' /tmp/qily-theme.js
          grep -Fq '王炸' /tmp/qily-theme.js
          echo 'PURE_DDZ_ELDER_V125_LIVE_OK'
