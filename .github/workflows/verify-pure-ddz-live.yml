name: Verify Pure DDZ Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-dock-share-runtime-v1.js'
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-dock-share-runtime-v1.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify V153 publication contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check site-dock-share-runtime-v1.js
          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          grep -Fq '20260903-ddz-mobile-landscape-v153' tools/pure-ddz/index.html
          grep -Fq "loadStyle('css/mobile-landscape-v153.css')" tools/pure-ddz/index.html
          grep -Fq 'id="v120-landscape-toggle"' tools/pure-ddz/index.html
          grep -Fq 'id="welcome-landscape"' tools/pure-ddz/index.html
          grep -Fq '/site-navigation.js?' tools/pure-ddz/index.html
          grep -Fq '/site-dock-share-runtime-v1.js?' tools/pure-ddz/index.html
          ! grep -Fq 'qilyPureDdzR8ClosureV128' tools/pure-ddz/index.html
          ! grep -Fq 'ddz-site-shell-v140.js' tools/pure-ddz/index.html
          ! grep -Fq '<footer class="site-footer">' tools/pure-ddz/index.html
          ! grep -Fq 'class="ddz-page-note"' tools/pure-ddz/index.html
          ! grep -Fq 'name="screen-orientation"' tools/pure-ddz/index.html
          ! grep -Fq 'name="x5-orientation"' tools/pure-ddz/index.html
          grep -Fq '<p id="hint-message" class="hint-message" aria-hidden="true"></p>' tools/pure-ddz/index.html
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/card-comfort-v122.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'html.ddz-mobile-landscape body.ddz-site-page' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'env(safe-area-inset-right)' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq "version:'1.2.4-mobile-landscape-adaptive'" tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'function syncViewportProfile()' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'screen.orientation?.lock' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'document.documentElement.requestFullscreen' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'window.PureDDZTest.hint()' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "const VERSION = '1.5.2'" tools/pure-ddz/game/js/game.js
          grep -Fq 'function isExcluded(){return false;}' site-dock-share-runtime-v1.js
