name: Verify Pure DDZ Live
# Final external closure trigger: 2026-08-23 v1.0.3 same-origin runtime + Android release.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'times26001-home-card.js'
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'times26001-home-card.js'
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify direct playable QilyLean game page
        run: |
          set -euo pipefail
          ok=0
          for i in {1..36}; do
            if curl -fsSL --max-time 20 'https://qilylean.com/tools/pure-ddz/?verify=20260823-v103' -o /tmp/pure-ddz.html; then
              if grep -q 'id="start"' /tmp/pure-ddz.html \
                && grep -q 'id="hand"' /tmp/pure-ddz.html \
                && grep -q '__PURE_DDZ_ROOTS__' /tmp/pure-ddz.html \
                && grep -q 'Pure-DDZ-Classic-v1.0.3.apk' /tmp/pure-ddz.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          if grep -q '<iframe[^>]*Pure-DDZ-Classic' /tmp/pure-ddz.html; then
            echo 'ERROR: game page is still iframe-only'
            exit 1
          fi

      - name: Verify homepage stable game entry runtime
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://qilylean.com/site-ui-consistency-v1.js?verify=20260823-v14' -o /tmp/ui.js
          grep -q 'ensurePureDdzHomeEntry' /tmp/ui.js
          grep -q '纯净斗地主｜在线玩' /tmp/ui.js
          grep -q 'Pure-DDZ-Classic-v1.0.3.apk' /tmp/ui.js

      - name: Verify same-origin web game runtime
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://qilylean.com/tools/pure-ddz/game/css/style.css?verify=20260823-v103' -o /tmp/style.css
          curl -fsSL --max-time 20 'https://qilylean.com/tools/pure-ddz/game/css/qilylean-theme.css?verify=20260823-v103' -o /tmp/theme.css
          curl -fsSL --max-time 20 'https://qilylean.com/tools/pure-ddz/game/js/qilylean-theme.js?verify=20260823-v103' -o /tmp/theme.js
          curl -fsSL --max-time 20 'https://qilylean.com/tools/pure-ddz/game/js/game.js?verify=20260823-v103' -o /tmp/game.js
          test -s /tmp/style.css
          test -s /tmp/theme.css
          grep -q 'function createDeck' /tmp/game.js
          grep -q 'function analyze' /tmp/game.js
          node --check /tmp/game.js
          node --check /tmp/theme.js

      - name: Verify Android v1.0.3 release APK download and contents
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-delay 5 --max-time 180 'https://github.com/DingHunter623/Pure-DDZ-Classic/releases/download/v1.0.3/Pure-DDZ-Classic-v1.0.3.apk' -o /tmp/pure-ddz.apk
          test -s /tmp/pure-ddz.apk
          test "$(head -c 2 /tmp/pure-ddz.apk)" = 'PK'
          unzip -l /tmp/pure-ddz.apk | grep -q 'assets/www/index.html'
          unzip -l /tmp/pure-ddz.apk | grep -q 'assets/www/css/style.css'
          unzip -l /tmp/pure-ddz.apk | grep -q 'assets/www/js/game.js'
          unzip -l /tmp/pure-ddz.apk | grep -q 'classes.dex'
          echo "APK bytes: $(wc -c </tmp/pure-ddz.apk)"
