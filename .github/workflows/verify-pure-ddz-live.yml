name: Verify Pure DDZ Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'site-dock-share-runtime-v1.js'
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-live.yml'
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'site-dock-share-runtime-v1.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify V155 fast publication contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-ddz-public-ui-20260824.js
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/fast-site-shell-v155.js
          node --check tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check site-dock-share-runtime-v1.js

          node scripts/materialize-ddz-public-ui-20260824.js
          node --check tools/pure-ddz/game/js/ddz-core-v155.js
          git diff --check

          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          grep -Fq '20260903-ddz-fast-knowledge-v155' tools/pure-ddz/index.html
          grep -Fq "loadStyle('css/ddz-core-v155.css')" tools/pure-ddz/index.html
          grep -Fq "const chain=['js/ddz-core-v155.js'];" tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-fast-shell="v155"' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-virtual-landscape="v154"' tools/pure-ddz/index.html
          grep -Fq 'id="v120-landscape-toggle"' tools/pure-ddz/index.html
          grep -Fq 'id="welcome-landscape"' tools/pure-ddz/index.html
          grep -Fq '/site-dock-share-runtime-v1.js?' tools/pure-ddz/index.html
          ! grep -Fq '/site-navigation.js?' tools/pure-ddz/index.html
          ! grep -Fq '/site-translation-safe-runtime-v1.js?' tools/pure-ddz/index.html
          ! grep -Fq "loadStyle('css/style.css')" tools/pure-ddz/index.html
          ! grep -Fq "const chain=['js/card-theme.js','js/ai-expert.js','js/game.js','js/visual-v120.js'];" tools/pure-ddz/index.html
          ! grep -Fq 'qilyPureDdzR8ClosureV128' tools/pure-ddz/index.html
          ! grep -Fq 'ddz-site-shell-v140.js' tools/pure-ddz/index.html
          ! grep -Fq '<footer class="site-footer">' tools/pure-ddz/index.html
          ! grep -Fq 'class="ddz-page-note"' tools/pure-ddz/index.html
          ! grep -Fq 'name="screen-orientation"' tools/pure-ddz/index.html
          ! grep -Fq 'name="x5-orientation"' tools/pure-ddz/index.html
          grep -Fq '<p id="hint-message" class="hint-message" aria-hidden="true"></p>' tools/pure-ddz/index.html

          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/card-comfort-v122.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'html.ddz-mobile-landscape body.ddz-site-page' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'html.ddz-ios-virtual-landscape body.ddz-site-page' tools/pure-ddz/game/css/card-knowledge-v155.css
          grep -Fq 'width:104px!important' tools/pure-ddz/game/css/card-knowledge-v155.css
          grep -Fq 'width:56px!important' tools/pure-ddz/game/css/card-knowledge-v155.css
          grep -Fq 'card-knowledge-v155.css' tools/pure-ddz/game/css/ddz-core-v155.css

          grep -Fq 'IE 7 Tools' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'IE七大手法' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '取消·合并·重排·简化' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '价值流图分析' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '整理·整顿·清扫' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'TPS' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'FMEA' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'CPK' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'ERP' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'MES' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'APS' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'PQCD' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'PDCA' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq '5M2E' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'Smart Factory' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq "version:'1.5.5-knowledge-52'" tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq "version:'1.2.4-mobile-landscape-adaptive'" tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'function syncViewportProfile()' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'screen.orientation?.lock' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'document.documentElement.requestFullscreen' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'window.PureDDZTest.hint()' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq "const VERSION = '1.5.2'" tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'function isExcluded(){return false;}' site-dock-share-runtime-v1.js
