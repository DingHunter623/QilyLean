name: Sync Search Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-search-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install

      - name: Generate search index
        run: |
          node scripts/build-trust-search-sync.js

      - name: Check changes
        run: |
          git status

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add qilylean/site-search-index.json qilylean/site-data.json

          git commit -m "fix: sync search index with SSOT after AI knowledge integration" || echo "No changes"

          git push
