name: Upgrade cooperation digital factory boundary 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-cooperation-digital-boundary-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply four-category cooperation boundary
        run: python scripts/upgrade-cooperation-digital-boundary-20260807.py

      - name: Validate cooperation page
        shell: bash
        run: |
          set -euo pipefail
          grep -q '四类项目合作边界' cooperation/index.html
          grep -q '02｜数字化工厂项目' cooperation/index.html
          grep -q '03｜精益改善项目' cooperation/index.html
          grep -q '04｜目视化项目' cooperation/index.html
          grep -q 'ERP／MES／APS厂商' cooperation/index.html
          grep -q 'data-qily-boundary-version="v3"' cooperation/index.html
          ! grep -q '三类项目合作边界' cooperation/index.html

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add cooperation/index.html
          git commit -m '项目合作：新增数字化工厂项目合作边界并升级为四类'
          git pull --rebase origin main
          git push origin HEAD:main
