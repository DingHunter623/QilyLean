name: Publish C919 cross-browser single-source closure

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-c919-v14-crossbrowser-20260826.js'
      - '.github/workflows/publish-c919-crossbrowser-20260826.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-c919-crossbrowser-20260826
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize one authoritative C919 image path
        run: |
          set -euo pipefail
          node --check scripts/fix-c919-v14-crossbrowser-20260826.js
          node scripts/fix-c919-v14-crossbrowser-20260826.js
          node --check scripts/enforce-c919-home-hero.js
          node --check scripts/site-regression-guard-c919-hero.js
          node scripts/site-regression-guard-c919-hero.js
          grep -q 'c919-strategy-hero-v14.png?v=20260826-c919-crossbrowser-v1' index.html
          ! grep -q 'c919-strategy-hero-v14.webp' index.html
          ! grep -q '<picture>' <(sed -n '/QILY-C919-DIGITAL-FLAGSHIP-HERO-V4:START/,/QILY-C919-DIGITAL-FLAGSHIP-HERO-V4:END/p' index.html)
          git diff --check

      - name: Commit only C919 source/guard closure
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet; then
            echo 'C919 cross-browser closure already materialized.'
            exit 0
          fi
          git add index.html \
            scripts/enforce-c919-home-hero.js \
            scripts/site-regression-guard-c919-hero.js \
            scripts/validate-sitewide-remediation-20260822.js \
            .github/workflows/apply-sitewide-audit-performance-visual-20260824.yml
          git commit -m 'fix: materialize C919 single-source PNG cache closure [c919-crossbrowser]'
          git push origin HEAD:main
