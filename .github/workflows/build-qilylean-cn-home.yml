name: Build QilyLean China Home API 36

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/qilylean-cn-home/**'
      - 'cn-site/legal/qilylean-cn-home/**'
      - 'cn-site/app-support/qilylean-cn-home/**'
      - '.github/workflows/build-qilylean-cn-home.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate China launcher identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "namespace 'cn.qilylean.home'" android/qilylean-cn-home/app/build.gradle
          grep -q "applicationId 'cn.qilylean.home'" android/qilylean-cn-home/app/build.gradle
          grep -q "versionCode 1" android/qilylean-cn-home/app/build.gradle
          grep -q "versionName '1.0.0'" android/qilylean-cn-home/app/build.gradle
          grep -q 'targetSdk 36' android/qilylean-cn-home/app/build.gradle
          grep -q 'android:label="QilyLean｜启力精益"' android/qilylean-cn-home/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.HOME' android/qilylean-cn-home/app/src/main/AndroidManifest.xml
          grep -q 'com.qilylean.times26001' android/qilylean-cn-home/app/src/main/AndroidManifest.xml
          grep -q 'https://qilylean.cn/' android/qilylean-cn-home/app/src/main/java/cn/qilylean/home/MainActivity.java
          ! grep -q 'https://qilylean.com/' android/qilylean-cn-home/app/src/main/java/cn/qilylean/home/MainActivity.java
          grep -q 'legal/qilylean-cn-home/privacy' android/qilylean-cn-home/app/src/main/java/cn/qilylean/home/MainActivity.java
          grep -q 'legal/qilylean-cn-home/terms' android/qilylean-cn-home/app/src/main/java/cn/qilylean/home/MainActivity.java
          grep -q 'app-support/qilylean-cn-home' android/qilylean-cn-home/app/src/main/java/cn/qilylean/home/MainActivity.java

      - name: Build installable debug APK and unsigned release packages
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android/qilylean-cn-home :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Validate APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/qilylean-cn-home/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='cn.qilylean.home' versionCode='1' versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/qilylean-cn-home/app/build/outputs/apk/debug/app-debug.apk dist/QilyLean_CN_Home_v1.0.0_API36_INSTALL.apk
          cp android/qilylean-cn-home/app/build/outputs/apk/release/app-release-unsigned.apk dist/QilyLean_CN_Home_v1.0.0_API36_unsigned.apk
          cp android/qilylean-cn-home/app/build/outputs/bundle/release/app-release.aab dist/QilyLean_CN_Home_v1.0.0_API36_unsigned.aab
          sha256sum dist/*.apk dist/*.aab > dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QilyLean-CN-Home-v1.0.0-API36
          path: dist/
          if-no-files-found: error
          retention-days: 30
