name: Vendor Pure DDZ v1.0.3 Web Assets (Legacy Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Legacy manual-only v1.0.3 vendor guard
        run: |
          echo 'This workflow is retained only for historical/manual recovery.'
          echo 'Automatic PR vendoring is disabled so newer Pure DDZ runtimes cannot be overwritten by v1.0.3.'
