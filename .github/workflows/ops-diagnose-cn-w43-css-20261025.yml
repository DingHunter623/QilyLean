name: One-time diagnose CN W43 generated CSS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-diagnose-cn-w43-css-20261025.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize CN brief output
        run: |
          set -euo pipefail
          bash cn-site/scripts/materialize-practice-assets.sh
      - name: Show generated W43 stylesheet and page links
        run: |
          set -euo pipefail
          CSS="cn-site/assets/brief-visual-source/qilylean/daily/assets/2026-10-25-brief.css"
          HTML="cn-site/briefs/archive/2026-10-25/index.html"
          echo "=== GENERATED HTML STYLES ==="
          grep -oE '<link[^>]+stylesheet[^>]*>' "$HTML" | grep -E '2026-10-25|brief-visual|parity' || true
          echo "=== GENERATED W43 CSS MATCHES ==="
          grep -n -C 8 -E 'w43-mobile-break|w43-table td:nth-child\(1\)|@media.*680' "$CSS" || true
          echo "=== CSS TAIL ==="
          tail -n 80 "$CSS"
