name: Stage W42 generated brief metadata once
on:
  push:
    branches: [publish/w42-automated-packaging-20261018]
    paths: ['.github/workflows/w42-stage-generated.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/w42-automated-packaging-20261018
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/publish-curated-daily.js
      - name: Commit generated records, no VI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html experience/index.html knowledge/index.html global-knowledge/index.html knowledge/terminology.html trust/index.html sitemap.xml sitemap-core.xml qilylean/career-resume-full.js qilylean/daily-insights.html qilylean/daily/*.html qilylean/daily/index.json qilylean/daily/feed.xml qilylean/daily/curation-report.json qilylean/daily/terminology-audit-latest.json qilylean/site-data.json qilylean/site-search-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: derive W42 latest-brief index and site metadata'
            git push origin HEAD:refs/heads/publish/w42-automated-packaging-20261018
          fi
