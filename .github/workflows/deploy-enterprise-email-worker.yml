name: Deploy enterprise email to QilyLean AI Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-enterprise-email-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-enterprise-email-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate enterprise email Worker change
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/worker.js
          grep -q 'admin@qilylean.com' cloudflare-worker/worker.js
          if grep -q '396767769@qq.com' cloudflare-worker/worker.js; then
            echo 'Legacy QQ email remains in Worker.'
            exit 1
          fi
          grep -q "url.pathname === '/consultations'" cloudflare-worker/worker.js
          grep -q "url.pathname === '/brief-feedback'" cloudflare-worker/worker.js

      - name: Resolve Cloudflare account ID
        shell: bash
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -n 1)"
          test "${#ACCOUNT_ID}" -eq 32
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://qilylean-ai.dinghunter623.workers.dev/health';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let last = '';
          for (let i = 1; i <= 10; i += 1) {
            try {
              const response = await fetch(url, {
                headers: { Origin: 'https://qilylean.com' },
                signal: AbortSignal.timeout(12000)
              });
              last = `status ${response.status}`;
              if (response.ok) {
                const data = await response.json();
                console.log(JSON.stringify(data));
                process.exit(0);
              }
            } catch (error) {
              last = error.message;
            }
            await wait(3000);
          }
          throw new Error('Live Worker health verification failed: ' + last);
          NODE
