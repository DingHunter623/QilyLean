name: Publish QilyLean Home v2.3.3 官网邮箱 + URL V14 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-qhome-v233-official-email-20260814.yml'
      - 'android/qilylean-home/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qhome-v233-url-v14-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Normalize QilyLean Home source naming, R5 navigation and public URL output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/qilylean-home')
          changed=0
          standalone=re.compile(r'https://qilylean[.]com/(?=(?:["\'<>\s),;\]}]|$))')
          malformed=re.compile(r'https://qilylean[.]com(?=[A-Za-z0-9])')
          for p in root.rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('build','.gradle')):
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):
                  continue
              n=s.replace('企业邮箱','官网邮箱')
              n=standalone.sub('https://qilylean.com',n)
              # Never remove the separator between the host and a real path.
              n=malformed.sub('https://qilylean.com/',n)
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed+=1

          main=Path('android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java')
          s=main.read_text(encoding='utf-8')
          old='''        addSectionTitle(content, "官网最新导航");
        addCardRow(content,
                webCard("首页", "官网总入口与最新内容", "https://qilylean.com"),
                webCard("能力体系", "六类核心能力与交付边界", "https://qilylean.com/capabilities"));
        addCardRow(content,
                webCard("代表项目", "项目成果、证据与交付资产", "https://qilylean.com/projects"),
                webCard("改善方法", "精益、IE与现场改善方法", "https://qilylean.com/improvements"));
        addCardRow(content,
                webCard("知识资产", "术语、模板、方法与简报", "https://qilylean.com/knowledge"),
                webCard("履历主线", "制造业经历与岗位主线", "https://qilylean.com/experience"));
        addCardRow(content,
                webCard("项目合作", "诊断、规划与项目交付", "https://qilylean.com/cooperation"),
                webCard("信任中心", "主体、隐私、证据与合作边界", "https://qilylean.com/trust"));'''
          new='''        addSectionTitle(content, "官网最新导航");
        addCardRow(content,
                webCard("首页", "官网总入口与最新内容", "https://qilylean.com"),
                webCard("履历主线", "制造业经历与岗位主线", "https://qilylean.com/experience"));
        addCardRow(content,
                webCard("能力体系", "六类核心能力与交付边界", "https://qilylean.com/capabilities"),
                webCard("改善方法", "精益、IE与现场改善方法", "https://qilylean.com/improvements"));
        addCardRow(content,
                webCard("代表项目", "项目成果、证据与交付资产", "https://qilylean.com/projects"),
                webCard("信任中心", "主体、隐私、证据与合作边界", "https://qilylean.com/trust"));
        addCardRow(content,
                webCard("项目合作", "诊断、规划与项目交付", "https://qilylean.com/cooperation"),
                webCard("知识资产", "术语、模板、方法与简报", "https://qilylean.com/knowledge"));'''
          if old in s:
              main.write_text(s.replace(old,new),encoding='utf-8')
              changed+=1
          elif new not in s:
              raise SystemExit('QilyLean Home navigation block is neither legacy nor R5 fixed order')
          print('QilyLean Home source files normalized:',changed)
          PY

      - name: Validate source naming, R5 navigation, URL V14 output and Android 16 baseline
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude-dir=build --exclude-dir=.gradle '企业邮箱' android/qilylean-home
          grep -q 'webCard("官方网址", "https://qilylean.com", "https://qilylean.com")' android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java
          grep -q 'webCard("官网邮箱", "admin@qilylean.com"' android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java
          grep -q 'versionCode 11' android/qilylean-home/app/build.gradle
          grep -q "versionName '2.3.3'" android/qilylean-home/app/build.gradle
          python - <<'PY'
          from pathlib import Path
          import re
          standalone=re.compile(r'https://qilylean[.]com/(?=(?:["\'<>\s),;\]}]|$))')
          malformed=re.compile(r'https://qilylean[.]com(?=[A-Za-z0-9])')
          bad=[]
          for p in Path('android/qilylean-home').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('build','.gradle')): continue
              try:s=p.read_text(encoding='utf-8')
              except Exception:continue
              if standalone.search(s):bad.append(str(p)+': trailing slash root')
              if malformed.search(s):bad.append(str(p)+': malformed host/path separator')
          assert not bad, bad
          main=Path('android/qilylean-home/app/src/main/java/com/qilylean/home/MainActivity.java').read_text(encoding='utf-8')
          start=main.index('addSectionTitle(content, "官网最新导航")')
          end=main.index('addSectionTitle(content, "知识重点直达")')
          block=main[start:end]
          order=['webCard("首页"','webCard("履历主线"','webCard("能力体系"','webCard("改善方法"','webCard("代表项目"','webCard("信任中心"','webCard("项目合作"','webCard("知识资产"']
          pos=[block.index(x) for x in order]
          assert pos==sorted(pos), 'R5 navigation order mismatch: '+str(pos)
          print('PASS QHome R5 navigation + URL V14: 首页→履历主线→能力体系→改善方法→代表项目→信任中心→项目合作→知识资产')
          PY
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build installable APK
        run: gradle -p android/qilylean-home :app:assembleDebug --stacktrace

      - name: Publish APK and synchronize website references
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC='android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk'
          APK='QilyLean_Home_v2.3.3_API36_INSTALL.apk'
          SHA='QilyLean_Home_v2.3.3_API36_INSTALL.sha256.txt'
          test -s "$APK_SRC"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_SRC" | grep -q "package: name='com.qilylean.home' versionCode='11' versionName='2.3.3'"
          cp "$APK_SRC" "$APK"
          sha256sum "$APK" > "$SHA"
          python - <<'PY'
          from pathlib import Path
          import json, re
          apk='QilyLean_Home_v2.3.3_API36_INSTALL.apk'
          sha='QilyLean_Home_v2.3.3_API36_INSTALL.sha256.txt'
          standalone=re.compile(r'https://qilylean[.]com/(?=(?:["\'<>\s),;\]}]|$))')
          malformed=re.compile(r'https://qilylean[.]com(?=[A-Za-z0-9])')
          targets=['capabilities/index.html','app-support/index.html','app-store/qilylean-home/README.md','app-download-share-v1.js']
          for name in targets:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'QilyLean_Home_v2[.]3[.]\d+_API36_INSTALL[.]apk',apk,s)
              s=re.sub(r'QilyLean_Home_v2[.]3[.]\d+_API36_INSTALL[.]sha256[.]txt',sha,s)
              s=s.replace('企业邮箱','官网邮箱')
              s=standalone.sub('https://qilylean.com',s)
              s=malformed.sub('https://qilylean.com/',s)
              if name=='app-store/qilylean-home/README.md':
                  s=s.replace('QilyLean首页、能力体系、履历主线、代表项目、改善方法、知识资产、项目合作与信任中心导航；','QilyLean首页、履历主线、能力体系、改善方法、代表项目、信任中心、项目合作与知识资产导航；')
              p.write_text(s,encoding='utf-8')
          p=Path('app-release-manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['updatedAt']='2026-08-14'
          data['apps']['qilyleanHome']['publicRelease'].update(versionName='2.3.3',versionCode=11,apk='/'+apk,sha256='/'+sha,label='当前官网安装包（R5官网最新导航、官网邮箱与URL V14精细化统一版）')
          data['apps']['qilyleanHome']['latestBuild'].update(versionName='2.3.3',versionCode=11,status='桌面导航按R5固定顺序同步官网： 首页→履历主线→能力体系→改善方法→代表项目→信任中心→项目合作→知识资产；官网邮箱统一；用户可见/复制官方网址无尾斜杠；子路径分隔完整；API 36可安装包构建通过')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify built APK URL V14 contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('QilyLean_Home_v2.3.3_API36_INSTALL.apk')
          slash_root=b'https://qilylean.com/'
          root_markers=(b'"',b"'",b'\x00',b' ',b'\n',b'\r',b'<',b')',b']',b'}')
          with ZipFile(apk) as z:
              trailing=[]
              for n in z.namelist():
                  try:data=z.read(n)
                  except Exception:continue
                  if any(slash_root+m in data for m in root_markers) or data.endswith(slash_root):
                      trailing.append(n)
              if trailing:
                  raise SystemExit('slash-terminated standalone root URL remains in APK: '+','.join(trailing[:20]))
          print('PASS: QilyLean Home APK public root URL has no trailing slash')
          PY

      - name: Commit official website package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add android/qilylean-home QilyLean_Home_v2.3.3_API36_INSTALL.apk QilyLean_Home_v2.3.3_API36_INSTALL.sha256.txt \
            capabilities/index.html app-support/index.html app-store/qilylean-home/README.md app-download-share-v1.js app-release-manifest.json
          git commit -m 'release: rebuild QilyLean Home v2.3.3 R5 latest' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: QilyLean-Home-v2.3.3-R5-URL-V14
          path: |
            QilyLean_Home_v2.3.3_API36_INSTALL.apk
            QilyLean_Home_v2.3.3_API36_INSTALL.sha256.txt
          if-no-files-found: error
          retention-days: 30
