name: Build installable QilyLean Home QA APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/qilylean-home/**'
      - '.github/workflows/build-installable-qa-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android/qilylean-home
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate version and unified icon
        run: |
          grep -q 'versionCode 9' android/qilylean-home/app/build.gradle
          grep -q "versionName '2.3.1'" android/qilylean-home/app/build.gradle
          grep -q 'android:icon="@drawable/ic_launcher"' android/qilylean-home/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_launcher"' android/qilylean-home/app/src/main/AndroidManifest.xml
          grep -q '#FF126478' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml
          grep -q '#FF081E20' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml
          grep -q '#FFF03A39' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml

      - name: Build installable debug APK
        run: gradle -p android/qilylean-home :app:assembleDebug --stacktrace

      - name: Validate installable APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK='android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.qilylean.home' versionCode='9' versionName='2.3.1'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          mkdir -p dist
          cp "$APK" dist/QilyLean_Home_v2.3.1_API36_INSTALL.apk
          sha256sum dist/QilyLean_Home_v2.3.1_API36_INSTALL.apk > dist/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: QilyLean-Home-v2.3.1-API36-INSTALL
          path: dist/
          if-no-files-found: error
          retention-days: 30
