name: Tea Culture Visual Closure V4

on:
  push:
    branches: [main]
    paths:
      - 'links/anxi-tea/index.html'
      - 'links/index.html'
      - 'tea-resource-visual-closure-v2.css'
      - 'scripts/validate-tea-culture-visual-closure-v1.js'
      - 'scripts/tea-culture-visual-qa-v3.cjs'
      - '.github/workflows/tea-culture-visual-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tea-culture-visual-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Chromium visual QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate V4 page structure, shared content axis, gallery rules and WCAG contrast
        run: node scripts/validate-tea-culture-visual-closure-v1.js

      - name: Render and verify detail page and directory at desktop, tablet and mobile
        env:
          QILY_TEA_URL: https://qilylean.com/links/anxi-tea/
          QA_OUTPUT: qa-output/tea-culture-v4
        run: node scripts/tea-culture-visual-qa-v3.cjs

      - name: Upload tea page visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tea-culture-visual-v4-${{ github.run_id }}
          path: qa-output/tea-culture-v4/
          if-no-files-found: warn
          retention-days: 14