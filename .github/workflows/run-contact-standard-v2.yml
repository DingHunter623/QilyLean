name: Run sitewide enterprise contact standard v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-contact-standard-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/publish-contact-standard-v2.js
      - run: node --check site-navigation-core.js
      - run: node --check site-navigation.js
      - run: node --check site-navigation-legacy-20260802.js
      - run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add -A
          git commit -m '全站联系入口统一企业邮箱并新增国际化页脚联系信息'
          git push origin HEAD:main
