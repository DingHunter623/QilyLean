name: Run sitewide enterprise contact standard v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-contact-standard-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prevent audit script self-match
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/publish-contact-standard-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const forbidden=['396767769@qq.com','DingHunter623@gmail.com','dinghunter623@gmail.com'];", "const forbidden=['396767769'+'@qq.com','DingHunter623'+'@gmail.com','dinghunter623'+'@gmail.com'];")
          p.write_text(s,encoding='utf-8')
          PY
      - run: node scripts/publish-contact-standard-v2.js
      - run: node --check site-navigation-core.js
      - run: node --check site-navigation.js
      - run: node --check site-navigation-legacy-20260802.js
      - run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add -A
          git commit -m '全站联系入口统一企业邮箱并新增国际化页脚联系信息'
          git push origin HEAD:main
