name: Validate Dock V5.8 Compact Fixed Bottom Navigation
# Final closure trigger: concise labels, two-row phone labels, true viewport width and complete first/last borders, 2026-09-06.

on:
  push:
    branches: [main]
    paths:
      - 'site-dock-share-runtime-v1.js'
      - 'scripts/validate-dock-flow-navigation-v56.js'
      - 'scripts/dock-flow-navigation-v56.spec.js'
      - '.github/workflows/validate-dock-flow-navigation-v56.yml'
      - 'index.html'
      - 'contact/index.html'
      - 'qilylean/daily/2026-09-04.html'
  pull_request:
    branches: [main]
    paths:
      - 'site-dock-share-runtime-v1.js'
      - 'scripts/validate-dock-flow-navigation-v56.js'
      - 'scripts/dock-flow-navigation-v56.spec.js'
      - '.github/workflows/validate-dock-flow-navigation-v56.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dock-v58-compact-fixed-bottom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dock-compact-fixed-bottom-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Static Dock V5.8 compact contract
        run: |
          node --check site-dock-share-runtime-v1.js
          node --check scripts/validate-dock-flow-navigation-v56.js
          node --check scripts/dock-flow-navigation-v56.spec.js
          node scripts/validate-dock-flow-navigation-v56.js
          git diff --check

      - name: Install Chromium regression dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/qily-dock-v58-http.log 2>&1 &
          echo $! >/tmp/qily-dock-v58-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Desktop and mobile compact fixed-bottom regression
        env:
          QILY_DOCK_V58_BASE: http://127.0.0.1:4173
        run: npx playwright test scripts/dock-flow-navigation-v56.spec.js --reporter=line --workers=1

      - name: Upload Dock V5.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qily-dock-v58-compact-${{ github.run_id }}
          path: dock-v58-artifacts
          if-no-files-found: warn
          retention-days: 30