name: Verify Pure DDZ Parent-Friendly UX

on:
  pull_request:
    paths:
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - '.github/workflows/verify-pure-ddz-v167-user-experience.yml'
  push:
    branches: [main]
    paths:
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - '.github/workflows/verify-pure-ddz-v167-user-experience.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Materialize current fast route
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/materialize-ddz-public-ui-20260824.js
          node scripts/materialize-ddz-public-ui-20260824.js
          grep -Fq 'fast-site-shell-v155.js?v=20260913-ddz-played-table-v169' tools/pure-ddz/index.html
      - name: Verify parent-friendly source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/mobile-game-ux-v168.js
          node --check tools/pure-ddz/game/js/classic-voice-v170.js
          node --check tools/pure-ddz/game/js/parent-friendly-v171.js
          node --check tools/pure-ddz/game/js/fast-site-shell-v155.js
          grep -Fq "mobile-game-ux-v168.js?v=20260913-ddz-played-table-v169" tools/pure-ddz/game/js/fast-site-shell-v155.js
          grep -Fq "classic-voice-v170.js?v=20260915-ddz-classic-voice-v172-q-kou" tools/pure-ddz/game/js/fast-site-shell-v155.js
          grep -Fq "parent-friendly-v171.js?v=20260915-ddz-parent-friendly-v173-free-choice" tools/pure-ddz/game/js/fast-site-shell-v155.js
          grep -Fq "12:'抠'" tools/pure-ddz/game/js/classic-voice-v170.js
          grep -Fq "return\`三个\${main}带对\${rankVoice(side)}\`" tools/pure-ddz/game/js/classic-voice-v170.js
          grep -Fq "QilyLeanCardTheme" tools/pure-ddz/game/js/parent-friendly-v171.js
          grep -Fq "clearSelectedHand(targetId);" tools/pure-ddz/game/js/parent-friendly-v171.js
          grep -Fq "if(id==='pass')clearSelectedHand();" tools/pure-ddz/game/js/parent-friendly-v171.js
          ! grep -Fq "document.addEventListener('pointerdown'" tools/pure-ddz/game/js/parent-friendly-v171.js
          git diff --check
      - name: Install Chromium audit dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/qily-ddz-parent-http.log 2>&1 &
          echo $! >/tmp/qily-ddz-parent-http.pid
      - name: Browser regression - free selection survives hand rerender, pass reset and parent voice
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:760}});
            await page.goto('http://127.0.0.1:4173/tools/pure-ddz/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.QilyLeanDdzClassicVoiceV170&&window.QilyLeanDdzParentFriendlyV171,{timeout:10000});
            const phrases=await page.evaluate(()=>({
              triplePair:window.QilyLeanDdzClassicVoiceV170.classicPlayBody({combo:{type:'triple2',main:5},cards:[{rank:5},{rank:5},{rank:5},{rank:9},{rank:9}]}),
              pairQ:window.QilyLeanDdzClassicVoiceV170.classicPlayBody({combo:{type:'pair',main:12},cards:[{rank:12},{rank:12}]})
            }));
            if(phrases.triplePair!=='三个5带对9')throw new Error('detailed classic voice mismatch: '+phrases.triplePair);
            if(phrases.pairQ!=='对抠')throw new Error('Q pronunciation mismatch: '+phrases.pairQ);
            await page.evaluate(()=>{
              const hand=document.getElementById('hand');
              window.__qilySelectionFixture=new Set(['6']);
              window.__renderSelectionFixture=()=>{
                hand.innerHTML='<button class="card" data-id="6" style="width:84px;height:110px;margin:0"></button><button class="card" data-id="2" style="width:84px;height:110px;margin:0"></button>';
                [...hand.querySelectorAll('.card')].forEach(btn=>{
                  const id=btn.dataset.id;
                  const selected=window.__qilySelectionFixture.has(id);
                  btn.setAttribute('aria-pressed',String(selected));
                  btn.addEventListener('click',()=>{
                    window.__qilySelectionFixture.has(id)?window.__qilySelectionFixture.delete(id):window.__qilySelectionFixture.add(id);
                    window.__renderSelectionFixture();
                  });
                });
              };
              window.__renderSelectionFixture();
            });
            await page.click('#hint');
            await page.waitForTimeout(30);
            await page.locator('#hand .card[data-id="2"]').click();
            let selected=await page.evaluate(()=>[...document.querySelectorAll('#hand .card')].filter(el=>el.getAttribute('aria-pressed')==='true').map(el=>el.dataset.id));
            if(JSON.stringify(selected)!=='["2"]')throw new Error('manual choice did not replace hint selection after rerender: '+JSON.stringify(selected));
            await page.evaluate(()=>window.QilyLeanDdzParentFriendlyV171.clearSelectedHand());
            selected=await page.evaluate(()=>[...document.querySelectorAll('#hand .card')].filter(el=>el.getAttribute('aria-pressed')==='true').map(el=>el.dataset.id));
            if(selected.length)throw new Error('pass reset did not lower selected cards: '+JSON.stringify(selected));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE