name: Publish QilyLean confidentiality statement

on:
  push:
    branches: [main]
    paths:
      - "QilyLean_项目保密声明_范本_V1.0.pdf"
      - "scripts/nda-source/nda-preview-template.html"
      - "scripts/publish-nda-link.js"
      - "scripts/publish-nda-mobile-preview.js"
      - ".github/workflows/publish-nda-template.yml"
  workflow_run:
    workflows: ["Sync unified site metadata"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nda-template-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPROVED_PDF_SHA256: e724f58694242e6982875b6eb37e19800e1ab86c4876d136f6aa57cf3941637f
      APPROVED_PDF_SOURCE: QilyLean_项目保密声明_范本_V1.0.pdf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install PDF validation and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install the exact latest user-uploaded PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APPROVED_PDF_SOURCE"
          echo "$APPROVED_PDF_SHA256  $APPROVED_PDF_SOURCE" | sha256sum --check
          mkdir -p qilylean/assets/legal
          cp "$APPROVED_PDF_SOURCE" qilylean/assets/legal/qilylean-mutual-nda-v1.pdf
          echo "$APPROVED_PDF_SHA256  qilylean/assets/legal/qilylean-mutual-nda-v1.pdf" | sha256sum --check

      - name: Render exact high-resolution online preview
        shell: bash
        run: |
          rm -f qilylean/assets/legal/qilylean-confidentiality-statement-v2.png
          pdftoppm -png -f 1 -singlefile -r 300 \
            qilylean/assets/legal/qilylean-mutual-nda-v1.pdf \
            qilylean/assets/legal/qilylean-confidentiality-statement-v2
          test -s qilylean/assets/legal/qilylean-confidentiality-statement-v2.png

      - name: Remove public Word source
        shell: bash
        run: rm -f qilylean/assets/legal/qilylean-mutual-nda-v1.docx

      - name: Publish preview-only access and synchronized metadata
        run: |
          node scripts/publish-nda-link.js
          node scripts/publish-nda-mobile-preview.js

      - name: Validate latest PDF and mobile online preview
        shell: bash
        run: |
          pdf="qilylean/assets/legal/qilylean-mutual-nda-v1.pdf"
          png="qilylean/assets/legal/qilylean-confidentiality-statement-v2.png"
          test -s "$pdf"
          test -s "$png"
          echo "$APPROVED_PDF_SHA256  $pdf" | sha256sum --check
          test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = "1"
          pdfinfo "$pdf" | grep -q 'Page size:.*595.*842'
          pdftotext "$pdf" - | grep -Eq '保[[:space:]]*密[[:space:]]*声[[:space:]]*明'
          pdftotext "$pdf" - | grep -q '声明内容'
          pdftotext "$pdf" - | grep -q '项目责任人签名'
          pdftotext "$pdf" - | grep -q '委托单位（填写）'
          pdftotext "$pdf" - | grep -q '项目名称（填写）'
          cmp --silent "$APPROVED_PDF_SOURCE" "$pdf"
          grep -q '/trust/nda-preview.html' trust/index.html
          grep -q '在线预览保密声明' trust/index.html
          grep -q '最新版PDF在线预览' trust/nda-preview.html
          grep -q '300DPI高清预览图' trust/nda-preview.html
          grep -q 'qilylean-confidentiality-statement-v2.png' trust/nda-preview.html
          grep -q '适应宽度' trust/nda-preview.html
          grep -q '原始清晰度' trust/nda-preview.html
          ! grep -q '<iframe' trust/nda-preview.html
          ! grep -q 'download=' trust/index.html
          ! grep -q 'qilylean-mutual-nda-v1.pdf' trust/nda-preview.html
          ! grep -q 'qilylean-mutual-nda-v1.docx' trust/index.html
          grep -q 'https://qilylean.com/trust/nda-preview.html' sitemap.xml
          ! grep -q 'https://qilylean.com/qilylean/assets/legal/qilylean-mutual-nda-v1.pdf' sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('qilylean/site-data.json', 'utf8'));
          const search = JSON.parse(fs.readFileSync('qilylean/site-search-index.json', 'utf8'));
          if (data.compliance.ndaDocumentName !== 'QilyLean项目保密声明') throw new Error('Statement document name mismatch');
          if (data.compliance.ndaPreviewUrl !== '/trust/nda-preview.html') throw new Error('Statement preview metadata mismatch');
          if (data.compliance.ndaTemplateUrl || data.compliance.ndaWordUrl) throw new Error('Direct file URL remains public in metadata');
          if (data.search.indexedEntries !== search.entries.length) throw new Error('Search entry count mismatch');
          if (!search.entries.some((entry) => entry.url === data.compliance.ndaPreviewUrl)) throw new Error('Statement preview missing from search index');
          NODE

      - name: Commit and publish the latest approved statement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "The latest approved QilyLean confidentiality statement is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch qilylean/assets/legal/qilylean-mutual-nda-v1.docx
          git add index.html trust/index.html trust/nda-preview.html qilylean/site-data.json qilylean/site-search-index.json sitemap.xml sitemap-core.xml \
            qilylean/assets/legal/qilylean-mutual-nda-v1.pdf \
            qilylean/assets/legal/qilylean-confidentiality-statement-v2.png
          git commit -m "build: publish latest uploaded QilyLean confidentiality PDF [skip ci]"
          git push
