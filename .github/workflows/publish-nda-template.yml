name: Publish QilyLean confidentiality statement

on:
  push:
    branches: [main]
    paths:
      - "scripts/nda-source/approved-pdf-v1.b64"
      - "scripts/nda-source/nda-preview-template.html"
      - "scripts/publish-nda-link.js"
      - "scripts/publish-nda-mobile-preview.js"
      - "qilylean/assets/legal/qilylean-trust-qr.svg"
      - ".github/workflows/publish-nda-template.yml"
  workflow_run:
    workflows: ["Sync unified site metadata"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nda-template-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Restore the approved PDF source of truth
        shell: bash
        run: |
          mkdir -p qilylean/assets/legal
          base64 --decode scripts/nda-source/approved-pdf-v1.b64 \
            > qilylean/assets/legal/qilylean-mutual-nda-v1.pdf
          test -s qilylean/assets/legal/qilylean-mutual-nda-v1.pdf

      - name: Remove public Word source
        shell: bash
        run: rm -f qilylean/assets/legal/qilylean-mutual-nda-v1.docx

      - name: Publish responsive preview-only access and synchronized metadata
        run: |
          node scripts/publish-nda-link.js
          node scripts/publish-nda-mobile-preview.js

      - name: Validate approved statement and clear mobile online preview
        shell: bash
        run: |
          test -s qilylean/assets/legal/qilylean-mutual-nda-v1.pdf
          test -s qilylean/assets/legal/qilylean-trust-qr.svg
          test -s trust/nda-preview.html
          test "$(pdfinfo qilylean/assets/legal/qilylean-mutual-nda-v1.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdfinfo qilylean/assets/legal/qilylean-mutual-nda-v1.pdf | grep -q 'Page size:.*595.*842'
          pdftotext qilylean/assets/legal/qilylean-mutual-nda-v1.pdf - | grep -Eq '保[[:space:]]*密[[:space:]]*声[[:space:]]*明'
          pdftotext qilylean/assets/legal/qilylean-mutual-nda-v1.pdf - | grep -q '声明内容'
          pdftotext qilylean/assets/legal/qilylean-mutual-nda-v1.pdf - | grep -q '项目责任人签名'
          pdftotext qilylean/assets/legal/qilylean-mutual-nda-v1.pdf - | grep -q '日期'
          pdftotext qilylean/assets/legal/qilylean-mutual-nda-v1.pdf - | grep -q '委托单位（填写）'
          pdftotext qilylean/assets/legal/qilylean-mutual-nda-v1.pdf - | grep -q '项目名称（填写）'
          grep -q '/trust/nda-preview.html' trust/index.html
          grep -q '在线预览保密声明' trust/index.html
          grep -q '内容与正式PDF一致' trust/nda-preview.html
          grep -q '手机端无需下载' trust/nda-preview.html
          grep -q 'qilylean-trust-qr.svg' trust/nda-preview.html
          grep -q '项目责任人：丁启利' trust/nda-preview.html
          grep -q '委托单位（填写）' trust/nda-preview.html
          grep -q '项目名称（填写）' trust/nda-preview.html
          ! grep -q '<iframe' trust/nda-preview.html
          ! grep -q 'download=' trust/index.html
          ! grep -q 'qilylean-mutual-nda-v1.pdf' trust/nda-preview.html
          ! grep -q 'qilylean-mutual-nda-v1.docx' trust/index.html
          grep -q 'https://qilylean.com/trust/nda-preview.html' sitemap.xml
          ! grep -q 'https://qilylean.com/qilylean/assets/legal/qilylean-mutual-nda-v1.pdf' sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('qilylean/site-data.json', 'utf8'));
          const search = JSON.parse(fs.readFileSync('qilylean/site-search-index.json', 'utf8'));
          if (data.compliance.ndaDocumentName !== 'QilyLean项目保密声明') throw new Error('Statement document name mismatch');
          if (data.compliance.ndaPreviewUrl !== '/trust/nda-preview.html') throw new Error('Statement preview metadata mismatch');
          if (data.compliance.ndaTemplateUrl || data.compliance.ndaWordUrl) throw new Error('Direct file URL remains public in metadata');
          if (data.search.indexedEntries !== search.entries.length) throw new Error('Search entry count mismatch');
          if (!search.entries.some((entry) => entry.url === data.compliance.ndaPreviewUrl)) throw new Error('Statement preview missing from search index');
          NODE

      - name: Commit and publish the approved QilyLean statement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "The approved QilyLean confidentiality statement is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch qilylean/assets/legal/qilylean-mutual-nda-v1.docx
          git add index.html trust/index.html trust/nda-preview.html qilylean/site-data.json qilylean/site-search-index.json sitemap.xml sitemap-core.xml \
            qilylean/assets/legal/qilylean-mutual-nda-v1.pdf \
            qilylean/assets/legal/qilylean-trust-qr.svg
          git commit -m "build: publish approved QilyLean confidentiality statement PDF [skip ci]"
          git push
