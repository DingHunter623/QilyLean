name: Deploy and verify brief social counters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-brief-social-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-brief-social-counts
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validate enhanced Worker syntax
        run: |
          node --check cloudflare-worker/worker.js
          node --check cloudflare-worker/worker-social.js
          node --check qilylean/daily-feedback.js
          node --check qily-admin.js
          grep -q 'main = "cloudflare-worker/worker-social.js"' wrangler.toml

      - name: Resolve Cloudflare account ID
        shell: bash
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -n 1)"
          if [ "${#ACCOUNT_ID}" -ne 32 ]; then
            echo "Cloudflare account ID is invalid"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy enhanced Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public cumulative counter API
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = 'https://qilylean-ai.dinghunter623.workers.dev/brief-feedback?brief=2026-07-29';
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(endpoint, {
                headers: { Origin: 'https://qilylean.com', Accept: 'application/json' },
                signal: AbortSignal.timeout(12000)
              });
              const data = await response.json();
              if (!response.ok) throw new Error('status ' + response.status);
              for (const field of ['rating_average', 'rating_count', 'five_star_count', 'likes', 'dislikes', 'comments', 'interaction_count']) {
                if (typeof data[field] !== 'number') throw new Error('missing numeric field ' + field);
              }
              console.log(JSON.stringify(data));
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 12) await wait(5000);
            }
          }
          throw new Error('public counter API verification failed: ' + lastError.message);
          NODE

      - name: Record successful deployment
        shell: bash
        run: |
          mkdir -p deployments
          cat > deployments/brief-social-counts.json <<EOF
          {
            "feature": "brief-social-counts",
            "status": "deployed-and-verified",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "fields": ["rating_average", "rating_count", "five_star_count", "likes", "dislikes", "comments", "interaction_count"]
          }
          EOF
          git rm .github/workflows/deploy-brief-social-counts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/brief-social-counts.json
          git commit -m "deploy: verify brief social counters [skip ci]"
          git push
