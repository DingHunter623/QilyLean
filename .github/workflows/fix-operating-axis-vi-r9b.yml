name: Fix Operating Axis VI R9B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-operating-axis-vi-r9b.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-r9b-operating-axis-vi
  cancel-in-progress: true

jobs:
  remediate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Simplify current-card override to shared VI ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path=Path('site-commercial-quality-closure-v1.css')
          html_path=Path('cooperation/index.html')
          css=css_path.read_text(encoding='utf-8')
          html=html_path.read_text(encoding='utf-8')
          assert 'QILY-R9-OPERATING-AXIS-VI-CLOSURE' in css

          # Current card: only cancel the global persistent inverse state.
          css=re.sub(
            r'''html:root:root body\.cooperation-page:has\(header a\[href="/cooperation/"\]\[aria-current="page"\]\) main \.qily-system-axis__step\[href="/cooperation/"\],\nhtml:root:root body\.cooperation-page:has\(header a\[href="/cooperation/"\]\[aria-current="page"\]\) main \.qily-system-axis__step\[href="/cooperation/"\] > :is\(strong,span\)\{\n  color:inherit!important;\n  -webkit-text-fill-color:currentColor!important;\n\}\n''',
            '''html:root:root body.cooperation-page:has(header a[href="/cooperation/"][aria-current="page"]) main .qily-system-axis__step[href="/cooperation/"] > :is(strong,span){\n  color:inherit!important;\n  -webkit-text-fill-color:currentColor!important;\n}\n''',
            css,
            count=1,
          )

          # Remove R9's explicit child tones on 05; those made it differ from siblings.
          css,n1=re.subn(
            r'''html:root:root body\.cooperation-page:has\(header a\[href="/cooperation/"\]\[aria-current="page"\]\) main \.qily-system-axis__step\[href="/cooperation/"\] > strong\{\n  color:#0f4b5a!important;\n  -webkit-text-fill-color:#0f4b5a!important;\n\}\n''','',css,count=1)
          css,n2=re.subn(
            r'''html:root:root body\.cooperation-page:has\(header a\[href="/cooperation/"\]\[aria-current="page"\]\) main \.qily-system-axis__step\[href="/cooperation/"\] > span\{\n  color:#315b61!important;\n  -webkit-text-fill-color:#315b61!important;\n\}\n''','',css,count=1)
          assert n1==1 and n2==1, (n1,n2)

          css=css.replace('QILY-R9-OPERATING-AXIS-VI-CLOSURE | 2026-09-04','QILY-R9B-OPERATING-AXIS-VI-CLOSURE | 2026-09-04',1)
          css_path.write_text(css,encoding='utf-8')

          version='20260904-operating-axis-vi-r9b'
          html,n=re.subn(r'/site-commercial-quality-closure-v1\.css\?v=[^"\']+',f'/site-commercial-quality-closure-v1.css?v={version}',html,count=1)
          assert n==1
          html_path.write_text(html,encoding='utf-8')
          print('PATCHED R9B',version)
          PY

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add site-commercial-quality-closure-v1.css cooperation/index.html
          if git diff --cached --quiet; then echo 'No diff'; else git commit -m 'fix(r9b): normalize operating-axis current card'; git push origin HEAD:main; fi

      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          echo "BROWSER_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          python3 -m http.server 4173 >/tmp/qily-r9b-http.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:4173/cooperation/ >/dev/null
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/qily-r9b-chrome about:blank >/tmp/qily-r9b-chrome.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:9222/json/version >/dev/null

      - name: Audit all six cards local and production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-operating-axis-r9b
          cat > /tmp/qily-r9b-audit.mjs <<'NODE'
          import fs from 'node:fs';
          const EXPECTED='20260904-operating-axis-vi-r9b',sleep=ms=>new Promise(r=>setTimeout(r,ms)),fail=m=>{throw new Error(m)};
          async function target(){const r=await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'});if(!r.ok)fail(`target ${r.status}`);return r.json()}
          function connect(url){return new Promise((resolve,reject)=>{const ws=new WebSocket(url);let seq=0;const p=new Map();ws.onopen=()=>resolve({call(m,params={}){return new Promise((res,rej)=>{const id=++seq;p.set(id,{res,rej});ws.send(JSON.stringify({id,method:m,params}))})},close(){ws.close()}});ws.onerror=reject;ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.id&&p.has(x.id)){const q=p.get(x.id);p.delete(x.id);x.error?q.rej(new Error(x.error.message)):q.res(x.result)}}})}
          async function ev(c,e){const r=await c.call('Runtime.evaluate',{expression:e,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)fail(r.exceptionDetails.text);return r.result?.value}
          async function nav(c,url,w,h){await c.call('Emulation.setDeviceMetricsOverride',{width:w,height:h,deviceScaleFactor:1,mobile:w<600});await c.call('Page.navigate',{url});const t=Date.now();while(Date.now()-t<30000){const s=await ev(c,'document.readyState');if(s==='interactive'||s==='complete')return;await sleep(200)}fail(`nav ${url}`)}
          async function wait(c,s){const t=Date.now();while(Date.now()-t<20000){if(await ev(c,`!!document.querySelector(${JSON.stringify(s)})`))return;await sleep(200)}fail(`selector ${s}`)}
          function rgb(v){const m=String(v).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);return m?m.slice(1,4).map(Number):null}function lum(a){a=a.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}function ratio(f,b){f=rgb(f);b=rgb(b);if(!f||!b)return 0;const x=lum(f),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
          async function audit(c,base,tag,w,h){await nav(c,base+'/cooperation/',w,h);await wait(c,'.qily-system-axis__step');const d=await ev(c,`(()=>{const cards=[...document.querySelectorAll('.qily-system-axis__step')];const link=document.querySelector('link[href*="site-commercial-quality-closure-v1.css"]');return {href:link?.getAttribute('href')||'',cards:cards.map((el,i)=>{const s=getComputedStyle(el),a=getComputedStyle(el.querySelector('strong')),b=getComputedStyle(el.querySelector('span'));return {i,href:el.getAttribute('href'),bg:s.backgroundColor,border:s.borderColor,color:s.color,strong:a.color,span:b.color}})}})()`);console.log(tag,w,JSON.stringify(d));if(!d.href.includes(EXPECTED))fail(`${tag}/${w} stale ${d.href}`);if(d.cards.length!==6)fail(`${tag}/${w} count ${d.cards.length}`);const f=d.cards[0],cur=d.cards.find(x=>x.href==='/cooperation/');if(!cur)fail('current missing');for(const x of d.cards){if(x.bg!==f.bg)fail(`${tag}/${w} card ${x.i+1} bg ${x.bg}/${f.bg}`);if(x.strong!==f.strong)fail(`${tag}/${w} card ${x.i+1} strong ${x.strong}/${f.strong}`);if(x.span!==f.span)fail(`${tag}/${w} card ${x.i+1} span ${x.span}/${f.span}`);if(ratio(x.strong,x.bg)<4.5)fail(`${tag}/${w} strong contrast ${x.i+1}`);if(ratio(x.span,x.bg)<4.5)fail(`${tag}/${w} span contrast ${x.i+1}`)}const shot=await c.call('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync(`visual-operating-axis-r9b/${tag}-${w}.png`,Buffer.from(shot.data,'base64'));console.log('PASS',tag,w)}
          const t=await target(),c=await connect(t.webSocketDebuggerUrl);try{await c.call('Page.enable');await c.call('Runtime.enable');await audit(c,'http://127.0.0.1:4173','local',1680,950);await audit(c,'http://127.0.0.1:4173','local',390,844);let last;for(let i=1;i<=20;i++){try{await audit(c,'https://qilylean.com','production',1680,950);await audit(c,'https://qilylean.com','production',390,844);last=null;break}catch(e){last=e;console.log(`production ${i}/20 ${e.message}`);await sleep(15000)}}if(last)throw last;fs.writeFileSync('visual-operating-axis-r9b/PASS.txt','PASS all six cards uniform/readable desktop+mobile local+production\n')}finally{c.close()}
          NODE
          node /tmp/qily-r9b-audit.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-axis-vi-r9b-${{ github.run_id }}
          path: visual-operating-axis-r9b
          if-no-files-found: warn
          retention-days: 7
