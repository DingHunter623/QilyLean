name: Apply Pure DDZ V174 Free Choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ddz-v174-free-choice.yml'
      - 'tools/pure-ddz/game/js/free-choice-v174.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ddz-v174-free-choice-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Wire V174 and bust public cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fast=Path('tools/pure-ddz/game/js/fast-site-shell-v155.js')
          text=fast.read_text()
          parent="  const PARENT_FRIENDLY_PATCH='/tools/pure-ddz/game/js/parent-friendly-v171.js?v=20260915-ddz-parent-friendly-v173-free-choice';"
          free="  const FREE_CHOICE_PATCH='/tools/pure-ddz/game/js/free-choice-v174.js?v=20260915-ddz-free-choice-v174';"
          if 'FREE_CHOICE_PATCH=' not in text:
              if parent not in text:
                  raise SystemExit('Current parent-friendly patch anchor changed; refusing blind overwrite')
              text=text.replace(parent,parent+'\n'+free)
          if 'function loadFreeChoicePatch(){' not in text:
              anchor='  function scheduleDeferredTranslation(){'
              fn='''  function loadFreeChoicePatch(){\n    if(document.querySelector('script[data-qily-ddz-free-choice="v174"]'))return;\n    const script=document.createElement('script');\n    script.src=FREE_CHOICE_PATCH;\n    script.async=false;\n    script.dataset.qilyDdzFreeChoice='v174';\n    document.head.appendChild(script);\n  }\n\n'''
              if anchor not in text:
                  raise SystemExit('Fast-shell function anchor changed; refusing blind overwrite')
              text=text.replace(anchor,fn+anchor)
          if 'loadFreeChoicePatch();' not in text:
              call='  loadParentFriendlyPatch();'
              if call not in text:
                  raise SystemExit('Parent-friendly loader call missing')
              text=text.replace(call,call+'\n  loadFreeChoicePatch();')
          text=text.replace("version:'1.5.5-v172'","version:'1.5.5-v174'")
          text=text.replace("version:'1.5.5-v173'","version:'1.5.5-v174'")
          fast.write_text(text)

          new_shell='fast-site-shell-v155.js?v=20260915-ddz-free-choice-v174'
          old_shell='fast-site-shell-v155.js?v=20260913-ddz-played-table-v169'
          index=Path('tools/pure-ddz/index.html')
          page=index.read_text()
          if old_shell in page:
              page=page.replace(old_shell,new_shell)
          elif new_shell not in page:
              raise SystemExit('Index fast-shell cache key changed unexpectedly')
          index.write_text(page)

          materialize=Path('scripts/materialize-ddz-public-ui-20260824.js')
          script=materialize.read_text()
          if old_shell in script:
              script=script.replace(old_shell,new_shell)
          elif new_shell not in script:
              raise SystemExit('Materializer fast-shell cache key changed unexpectedly')
          materialize.write_text(script)
          PY
          node --check tools/pure-ddz/game/js/free-choice-v174.js
          node --check tools/pure-ddz/game/js/fast-site-shell-v155.js
          node --check scripts/materialize-ddz-public-ui-20260824.js
          grep -Fq "free-choice-v174.js?v=20260915-ddz-free-choice-v174" tools/pure-ddz/game/js/fast-site-shell-v155.js
          grep -Fq 'loadFreeChoicePatch();' tools/pure-ddz/game/js/fast-site-shell-v155.js
          grep -Fq 'fast-site-shell-v155.js?v=20260915-ddz-free-choice-v174' tools/pure-ddz/index.html
          grep -Fq 'fast-site-shell-v155.js?v=20260915-ddz-free-choice-v174' scripts/materialize-ddz-public-ui-20260824.js
          git diff --check
      - name: Commit V174 wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/pure-ddz/game/js/fast-site-shell-v155.js tools/pure-ddz/index.html scripts/materialize-ddz-public-ui-20260824.js; then
            echo 'V174 wiring already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pure-ddz/game/js/fast-site-shell-v155.js tools/pure-ddz/index.html scripts/materialize-ddz-public-ui-20260824.js
          git commit -m 'fix(ddz): wire V174 true free choice [skip ci]'
          git pull --rebase origin main
          git push origin main
