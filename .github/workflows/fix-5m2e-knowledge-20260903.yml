name: Fix 5M2E knowledge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-5m2e-knowledge-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate 5M2E correction
        run: python3 scripts/fix-5m2e-knowledge-20260903.py

      - name: Commit corrected knowledge source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- knowledge/terminology.html knowledge/terminology-sponsor-v1.js; then
            echo 'No 5M2E source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/terminology.html knowledge/terminology-sponsor-v1.js
          git commit -m 'fix: correct 5M2E to include Energy'
          git push origin HEAD:main
