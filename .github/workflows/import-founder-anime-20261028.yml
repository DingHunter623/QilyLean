name: Import approved QilyLean founder anime artwork
on:
  push:
    branches:
      - feature/founder-anime-20261028
    paths:
      - .github/workflows/import-founder-anime-20261028.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/founder-anime-20261028
      - name: Download approved ChatGPT artwork from temporary Adobe transfer link
        env:
          SOURCE_URL: https://at.adobe.com/jOSZ1lFPW1iRd0nZ
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 --silent --show-error "$SOURCE_URL" -o /tmp/qily-founder-artwork
          file /tmp/qily-founder-artwork
      - name: Validate artwork and prepare high-quality web image
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('/tmp/qily-founder-artwork')
          with Image.open(src) as img:
              img.load()
              if img.width < 900 or img.height < 750:
                  raise RuntimeError(f'Unexpected image dimensions: {img.size}')
              if img.format not in ('PNG', 'WEBP', 'JPEG'):
                  raise RuntimeError(f'Unexpected format: {img.format}')
              print(f'Source: {img.format} {img.width}x{img.height}')
              dest = Path('qilylean/ding-qili-anime-20261028.webp')
              dest.parent.mkdir(parents=True, exist_ok=True)
              img.convert('RGB').save(dest, 'WEBP', quality=92, method=6)
              print(f'Saved {dest} ({dest.stat().st_size} bytes)')
          PY
      - name: Commit verified binary image asset to candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qilylean/ding-qili-anime-20261028.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add approved founder anime artwork [skip ci]"
            git push
          fi
