name: Public visual acceptance V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-visual-qa-v1.yml'
      - 'qilylean/daily/2026-08-25.html'
      - 'knowledge/terminology.html'
      - 'knowledge/terminology-opl-readability-v8.css'
      - 'scripts/publish-visual-readability-v5.js'
      - 'site-visual-readability-v5.css'
      - 'index.html'
      - 'links/index.html'
      - 'cn-site/index.html'
      - 'cn-site/assets/qilylean-vi-v1.css'
      - 'cn-site/assets/qilylean-vi-v2.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-visual-acceptance-v2
  cancel-in-progress: true

jobs:
  chromium-public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Chromium QA runtime
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify live Daily Brief and OPL PDF
        env:
          QA_BASE: https://qilylean.com
          QA_CN_BASE: https://qilylean.cn
        run: |
          mkdir -p qa-output
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1680,height:950}, deviceScaleFactor:1});
            const stamp = Date.now();
            await page.goto(`${process.env.QA_BASE}/qilylean/daily/2026-08-25.html?qa=${stamp}`, {waitUntil:'networkidle', timeout:120000});
            await page.screenshot({path:'qa-output/brief-2026-08-25-full.png', fullPage:true});
            const daily = await page.evaluate(() => {
              const kicker = document.querySelector('article.post .hero .kicker');
              const heroCopy = document.querySelector('article.post .hero>p');
              return {
                bodyClass: document.body.className,
                sections: [...document.querySelectorAll('article.post .section-head>.section-no')].map(n => n.textContent.trim()),
                kickerColor: kicker ? getComputedStyle(kicker).color : '',
                kickerFill: kicker ? getComputedStyle(kicker).webkitTextFillColor : '',
                heroCopyColor: heroCopy ? getComputedStyle(heroCopy).color : '',
                heroCopyFill: heroCopy ? getComputedStyle(heroCopy).webkitTextFillColor : '',
                tagColors: [...document.querySelectorAll('article.post .overview-card>.tag')].map(n => getComputedStyle(n).color),
                tagFills: [...document.querySelectorAll('article.post .overview-card>.tag')].map(n => getComputedStyle(n).webkitTextFillColor)
              };
            });
            fs.writeFileSync('qa-output/daily-computed.json', JSON.stringify(daily,null,2));
            assert(daily.bodyClass.split(/\s+/).includes('daily-single-page'), `live brief body hook missing: ${daily.bodyClass}`);
            assert(JSON.stringify(daily.sections.slice(0,4)) === JSON.stringify(['一、','二、','三、','四、']), `major headings wrong: ${daily.sections.join('|')}`);
            assert(daily.kickerColor === 'rgb(255, 227, 155)' || daily.kickerFill === 'rgb(255, 227, 155)', `hero kicker is not gold: ${daily.kickerColor}/${daily.kickerFill}`);
            assert(
              ['rgb(237, 249, 246)','rgb(255, 255, 255)'].includes(daily.heroCopyColor) ||
              ['rgb(237, 249, 246)','rgb(255, 255, 255)'].includes(daily.heroCopyFill),
              `hero body copy is not readable white: ${daily.heroCopyColor}/${daily.heroCopyFill}`
            );
            assert(daily.tagColors.length >= 8 && daily.tagColors.every(v => v === 'rgb(255, 255, 255)'), `overview numbers not white: ${daily.tagColors.join(',')}`);
            assert(daily.tagFills.every(v => !v || v === 'rgb(255, 255, 255)'), `overview text-fill not white: ${daily.tagFills.join(',')}`);
            await page.locator('article.post .hero').first().screenshot({path:'qa-output/brief-hero.png'});
            await page.locator('article.post .overview').first().screenshot({path:'qa-output/brief-eight-wastes-overview.png'});

            const verifySemanticLabel = async (url, selector, evidenceName) => {
              const visual = await browser.newPage({viewport:{width:1680,height:950}, deviceScaleFactor:1});
              await visual.goto(url, {waitUntil:'networkidle', timeout:120000});
              const label = visual.locator(selector).first();
              await label.waitFor({state:'visible', timeout:30000});
              await visual.reload({waitUntil:'networkidle',timeout:120000});
              const computed = await label.evaluate(node => {
                const style = getComputedStyle(node);
                return {
                  text: node.textContent.trim(),
                  color: style.color,
                  fill: style.webkitTextFillColor,
                  fontWeight: style.fontWeight,
                  viHref:document.querySelector('#qilyCnUnifiedViV2')?.href || ''
                };
              });
              fs.writeFileSync(`qa-output/${evidenceName}-computed.json`, JSON.stringify(computed,null,2));
              assert(
                computed.color === 'rgb(255, 227, 155)' && computed.fill === 'rgb(255, 227, 155)',
                `${evidenceName} semantic label is not light gold: ${computed.color}/${computed.fill}`
              );
              assert(computed.fontWeight === '400', `${evidenceName} semantic label is not regular weight: ${computed.fontWeight}`);
              await visual.screenshot({path:`qa-output/${evidenceName}-full.png`, fullPage:true});
              await visual.close();
            };

            await verifySemanticLabel(
              `${process.env.QA_BASE}/?qa=${stamp}`,
              '.qily-home-conversion-hero__kicker',
              'international-home-hero-label'
            );
            await verifySemanticLabel(
              `${process.env.QA_BASE}/links/?qa=${stamp}`,
              '.hero .eyebrow',
              'international-links-hero-label'
            );
            await verifySemanticLabel(
              `${process.env.QA_CN_BASE}/`,
              '.hero .eyebrow',
              'china-home-hero-label'
            );

            const opl = await browser.newPage({viewport:{width:1680,height:950}, deviceScaleFactor:1});
            await opl.goto(`${process.env.QA_BASE}/knowledge/terminology.html?opl=6S&qa=${stamp}`, {waitUntil:'networkidle', timeout:120000});
            await opl.waitForSelector('.term-opl-modal:not([hidden]) .term-opl-content', {timeout:30000});
            await opl.screenshot({path:'qa-output/opl-6s-screen.png', fullPage:true});
            const oplComputed = await opl.evaluate(() => ({
              numbers: [...document.querySelectorAll('.term-opl-modal:not([hidden]) .term-opl-num')].map(n => ({text:n.textContent.trim(),color:getComputedStyle(n).color,fill:getComputedStyle(n).webkitTextFillColor})),
              blocks: [...document.querySelectorAll('.term-opl-modal:not([hidden]) .term-opl-block')].map(n => ({scrollHeight:n.scrollHeight,clientHeight:n.clientHeight,overflow:getComputedStyle(n).overflow,lineHeight:getComputedStyle(n).lineHeight}))
            }));
            fs.writeFileSync('qa-output/opl-computed.json', JSON.stringify(oplComputed,null,2));
            assert(oplComputed.numbers.length >= 4, 'OPL section numbers not found');
            assert(oplComputed.numbers.every(n => n.color === 'rgb(255, 255, 255)' || n.fill === 'rgb(255, 255, 255)'), `OPL numbers not white: ${JSON.stringify(oplComputed.numbers)}`);

            await opl.emulateMedia({media:'print'});
            const printComputed = await opl.evaluate(() => ({
              running: [...document.querySelectorAll('.term-opl-running')].map(n => getComputedStyle(n).display),
              runningHead: [...document.querySelectorAll('.term-opl-running-head')].map(n => getComputedStyle(n).display),
              runningFoot: [...document.querySelectorAll('.term-opl-running-foot')].map(n => getComputedStyle(n).display)
            }));
            fs.writeFileSync('qa-output/opl-print-computed.json', JSON.stringify(printComputed,null,2));
            assert(printComputed.running.length >= 2, 'OPL running print elements missing from DOM');
            assert(printComputed.running.every(v => v === 'none'), `OPL repeated running elements still visible in print: ${printComputed.running.join(',')}`);
            assert(printComputed.runningHead.every(v => v === 'none'), `OPL print running header still visible: ${printComputed.runningHead.join(',')}`);
            assert(printComputed.runningFoot.every(v => v === 'none'), `OPL print running footer still visible: ${printComputed.runningFoot.join(',')}`);
            await opl.pdf({path:'qa-output/opl-6s.pdf', format:'A4', printBackground:true, preferCSSPageSize:true});
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify CN three-region contacts desktop and mobile
        env:
          QA_CN_BASE: https://qilylean.cn
          QA_BASE: https://qilylean.com
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const numbers=['134 5001 4003','151 6812 0722','176 8178 8259'];
            for(const [name,width,height,expectedColumns] of [
              ['desktop',1440,900,3],['mobile',390,844,1]
            ]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto(process.env.QA_CN_BASE+'/about/?visual-qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('.qily-about-phone-item').first().waitFor({state:'visible',timeout:20000});
              const metrics=await page.evaluate(()=>{
                const grid=document.querySelector('.qily-about-phone-grid');
                const items=[...document.querySelectorAll('.qily-about-phone-item')];
                const style=getComputedStyle(grid);
                return {
                  columns:style.gridTemplateColumns.split(' ').length,
                  phones:items.map(e=>e.textContent.replace(/\\s+/g,' ').trim()),
                  overflow:document.documentElement.scrollWidth>innerWidth+1,
                  goldBorder:items.map(e=>getComputedStyle(e).borderLeftColor),
                  fontWeights:items.map(e=>getComputedStyle(e.querySelector('span')).fontWeight),
                  styleUrl:document.getElementById('qilyCnUnifiedViV2')?.href||''
                };
              });
              for(const n of numbers)assert(metrics.phones.some(x=>x.includes(n)),name+' missing phone '+n);
              assert(metrics.phones.length===3,name+' must show exactly 3 phone cards');
              assert(metrics.columns===expectedColumns,name+' phone-grid column mismatch: '+metrics.columns);
              assert(!metrics.overflow,name+' has horizontal document overflow');
              assert(metrics.fontWeights.every(x=>x==='400'),name+' violates regular-weight VI');
              assert(metrics.styleUrl.includes('20261014-cn-contact-three-phones-v1'),name+' loaded stale contact CSS');
              fs.writeFileSync('qa-output/cn-about-contact-'+name+'.json',JSON.stringify(metrics,null,2));
              await page.locator('.qily-about-phone-grid').screenshot({path:'qa-output/cn-about-contact-'+name+'.png'});
              await page.close();
            }
            const international=await browser.newPage();
            await international.goto(process.env.QA_BASE+'/contact/?visual-qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            const comPhones=await international.locator('.phone-card a').allTextContents();
            for(const n of numbers)assert(comPhones.some(x=>x.includes(n)),'COM contact parity mismatch '+n);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-visual-acceptance-v2
          path: qa-output/
          if-no-files-found: error
          retention-days: 7
