name: Fix contact footer and hover contrast 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-contact-footer-hover-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-contact-footer-hover-20260807
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF engine
        run: python -m pip install --disable-pip-version-check --quiet pymupdf

      - name: Rewrite PDF contact footer and contact hover contrast
        run: python scripts/fix_contact_footer_20260807.py

      - name: Preserve rendered verification samples
        uses: actions/upload-artifact@v4
        with:
          name: qily-contact-footer-preview-20260807
          path: /tmp/qily-contact-preview/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QILY-OFFICIAL-CONTACT-HOVER-CONTRAST-20260807' site-interactive-hover-contrast-v1.css
          grep -q 'mailto:admin@qilylean.com' site-interactive-hover-contrast-v1.css
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f .github/workflows/fix-contact-footer-hover-20260807.yml
          git rm -f scripts/fix_contact_footer_20260807.py
          git add -A
          git commit -m '全站规范：补齐现场管理PDF官网邮箱并强化联系链接悬停对比度'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
