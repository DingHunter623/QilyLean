name: Upgrade QilyLean CN VI V14 Reading Scale Closure

on:
  push:
    branches: [main]
    paths:
      - 'cn-site/**/*.html'
      - 'cn-site/assets/qilylean-vi-v1.css'
      - 'cn-site/assets/qilylean-vi-v2.css'
      - 'cn-site/assets/cn-nav-rail-v1.js'
      - 'cn-site/assets/cn-footer-actions-v1.css'
      - 'cn-site/assets/cn-footer-actions-v1.js'
      - 'cn-site/assets/cn-translate-baidu-v1.js'
      - 'cn-site/assets/cn-translate-baidu-v1.css'
      - '.github/workflows/upgrade-cn-vi-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-cn-vi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize China brand, page thesis panels, global CTA and shared VI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('cn-site')
          files = sorted(root.rglob('*.html'))
          css_version = '20260926-cn-vi-v34-interaction-closure'
          base_version = '20260923-cn-typography-base-v7'
          nav_script_version = '20260926-nav-rail-v11-external-arrows'
          translate_version = '20260922-translate-v6-baidu'
          footer_actions_version = '20260926-footer-actions-v5-three-actions-vi-parity'
          official_brand = 'QilyLean | 启力精益'
          css_target = f'<link id="qilyCnUnifiedViV2" rel="stylesheet" href="/assets/qilylean-vi-v2.css?v={css_version}">'
          nav_script_target = f'<script defer src="/assets/cn-nav-rail-v1.js?v={nav_script_version}"></script>'
          translate_css_target = f'<link id="qilyCnDomesticTranslateV1Stylesheet" rel="stylesheet" href="/assets/cn-translate-baidu-v1.css?v={translate_version}">'
          translate_js_target = f'<script defer src="/assets/cn-translate-baidu-v1.js?v={translate_version}"></script>'
          footer_actions_css_target = f'<link id="qilyCnFooterActionsV1Stylesheet" rel="stylesheet" href="/assets/cn-footer-actions-v1.css?v={footer_actions_version}">'
          footer_actions_js_target = f'<script defer src="/assets/cn-footer-actions-v1.js?v={footer_actions_version}"></script>'
          css_pattern = re.compile(r'\s*<link id="qilyCnUnifiedViV[12]" rel="stylesheet" href="/assets/qilylean-vi-v[12]\.css\?v=[^"]+">\s*')
          footer_target = '<footer class="footer"><div class="footer-inner"><span>QilyLean | 启力精益 · 精益制造经验分享</span><nav class="footer-actions" aria-label="页脚快捷操作"><button type="button" data-qily-footer-action="top">顶部</button><button type="button" data-qily-footer-action="previous">上一网页</button><button type="button" data-qily-footer-action="share">分享当前</button></nav><span class="footer-records notranslate" translate="no"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" title="工信部备案查询（新标签页打开）">湘ICP备2026041143号-1</a><a class="police-record" href="https://beian.mps.gov.cn/#/query/webSearch?code=43020002000443" target="_blank" rel="noopener noreferrer" title="公安备案查询（新标签页打开）"><img src="/assets/mps-beian.png" width="18" height="20" alt="" aria-hidden="true"><span>湘公网安备43020002000443号</span></a></span></div></footer>'
          toc_pattern = re.compile(r'(<aside\b[^>]*class=["\']toc["\'][^>]*>)(.*?)(</aside>)', re.I | re.S)
          brand_anchor_pattern = re.compile(r'(<a\b[^>]*class=["\']brand["\'][^>]*>)(.*?)(</a>)', re.I | re.S)
          changed = 0
          document_count = 0
          footer_count = 0
          thesis_count = 0
          skipped = []

          def normalize_thesis(match):
              nonlocal_thesis[0] += 1
              opening, inner, closing = match.groups()
              opening = re.sub(r'\s+aria-label=["\'][^"\']*["\']', '', opening, flags=re.I)
              opening = opening[:-1] + ' aria-label="本页主旨">'
              if re.search(r'<b\b[^>]*>.*?</b>', inner, flags=re.I | re.S):
                  inner = re.sub(r'<b\b[^>]*>.*?</b>', '<b>本页主旨</b>', inner, count=1, flags=re.I | re.S)
              else:
                  inner = '<b>本页主旨</b>' + inner
              inner = re.sub(r'<a\b[^>]*>(.*?)</a>', r'<span>\1</span>', inner, flags=re.I | re.S)
              return opening + inner + closing

          def normalize_brand_anchor(match):
              opening, inner, closing = match.groups()
              plain = re.sub(r'<[^>]+>', '', inner)
              if 'QilyLean' not in plain:
                  return match.group(0)
              return opening + 'QilyLean | <span>启力精益</span>' + closing

          for path in files:
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text or '<body' not in text.lower():
                  skipped.append(str(path))
                  continue
              document_count += 1
              out = css_pattern.sub('\n', text)
              out = re.sub(r'\s*<link id="qilyCnDomesticTranslateV1Stylesheet" rel="stylesheet" href="/assets/cn-translate-baidu-v1\.css\?v=[^"]+">\s*', '\n', out)
              out = re.sub(r'\s*<link id="qilyCnFooterActionsV1Stylesheet" rel="stylesheet" href="/assets/cn-footer-actions-v1\.css\?v=[^"]+">\s*', '\n', out)
              out = out.replace('</head>', f'{translate_css_target}\n  {css_target}\n  {footer_actions_css_target}\n</head>', 1)
              out = re.sub(r'\s*<script defer src="/assets/cn-translate-baidu-v1\.js\?v=[^"]+"></script>\s*', '\n', out)
              out = re.sub(r'\s*<script defer src="/assets/cn-nav-rail-v1\.js\?v=[^"]+"></script>\s*', '\n', out)
              out = re.sub(r'\s*<script defer src="/assets/cn-footer-actions-v1\.js\?v=[^"]+"></script>\s*', '\n', out)
              out = out.replace('</body>', f'{translate_js_target}\n{footer_actions_js_target}\n{nav_script_target}\n</body>', 1)

              # Official China-site brand expression: visible/metadata brand spelling uses ASCII separator with spaces.
              out = out.replace('QilyLean｜<span>启力精益</span>', 'QilyLean | <span>启力精益</span>')
              out = out.replace('QilyLean｜启力精益', official_brand)
              out = out.replace('QilyLean 启力精益', official_brand)
              out = brand_anchor_pattern.sub(normalize_brand_anchor, out)

              if path.as_posix() == 'cn-site/about/index.html':
                  out = out.replace('<h1>关于 QilyLean 中国知识站</h1>', '<h1>关于“精益制造经验分享”</h1>')
                  out = out.replace(f'<h1>关于 {official_brand} 中国知识站</h1>', '<h1>关于“精益制造经验分享”</h1>')
                  out = re.sub(
                      r'content="(?:QilyLean 中国站|QilyLean \| 启力精益中国站)为个人制造业知识与实践分享站，聚焦精益生产、工业工程、标准化与数智工厂。"',
                      'content="精益制造经验分享是 QilyLean | 启力精益中国站的备案服务名称，内容聚焦精益生产、工业工程、标准化与数智工厂。"',
                      out
                  )

              nonlocal_thesis = [0]
              out = toc_pattern.sub(normalize_thesis, out)
              thesis_count += nonlocal_thesis[0]

              if re.search(r'<footer class="footer">.*?</footer>', out, flags=re.S):
                  out = re.sub(r'<footer class="footer">.*?</footer>', footer_target, out, count=1, flags=re.S)
                  footer_count += 1

              if out != text:
                  path.write_text(out, encoding='utf-8')
                  changed += 1

          v1 = root / 'assets' / 'qilylean-vi-v1.css'
          css1 = v1.read_text(encoding='utf-8')
          css1 = css1.replace('.toc a', '.toc :is(a,span)')
          v1.write_text(css1, encoding='utf-8')

          v2 = root / 'assets' / 'qilylean-vi-v2.css'
          css2 = v2.read_text(encoding='utf-8')
          css2 = re.sub(
              r"@import url\('/assets/qilylean-vi-v1\.css\?v=[^']+'\);",
              f"@import url('/assets/qilylean-vi-v1.css?v={base_version}');",
              css2,
              count=1,
          )
          css2 = css2.replace('.toc a', '.toc :is(a,span)')
          css2 = css2.replace('CN fixed-footer shared-resource VI V5', 'CN shared-resource VI V7 · brand + page-thesis + CTA closure')
          css2 = css2.replace('CN shared-resource VI V6 · page-thesis closure', 'CN shared-resource VI V7 · brand + page-thesis + CTA closure')

          thesis_marker = '/* 2026-09-17 | CN page-thesis module: descriptive, not clickable. */'
          if thesis_marker not in css2:
              css2 += f'''\n\n{thesis_marker}\nhtml:root body aside.toc{{cursor:default!important}}\nhtml:root body aside.toc>b{{display:block!important;margin-bottom:8px!important}}\nhtml:root body aside.toc>span{{\n  display:block!important;\n  padding:7px 0!important;\n  color:var(--qily-cn-copy)!important;\n  -webkit-text-fill-color:var(--qily-cn-copy)!important;\n  font-size:var(--qily-cn-small)!important;\n  line-height:1.55!important;\n  font-weight:500!important;\n  text-decoration:none!important;\n  cursor:default!important;\n  word-break:keep-all!important;\n  overflow-wrap:normal!important;\n}}\n'''
          thesis_safety = '/* QILY-CN-THESIS-NONINTERACTIVE-V1 */'
          if thesis_safety not in css2:
              css2 += f'''\n\n{thesis_safety}\nhtml:root body aside.toc>span{{pointer-events:none!important}}\n'''

          cta_marker = '/* 2026-09-17 | CN global-knowledge CTA: VI gold + explicit interaction feedback. */'
          if cta_marker not in css2:
              css2 += f'''\n\n{cta_marker}\nhtml:root body .knowledge-bridge>a{{\n  display:inline-flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  min-height:46px!important;\n  margin-top:8px!important;\n  padding:8px 14px!important;\n  border:1px solid var(--qily-gold)!important;\n  border-radius:9px!important;\n  background:#fffaf0!important;\n  color:#8b6219!important;\n  -webkit-text-fill-color:#8b6219!important;\n  font-size:18px!important;\n  line-height:1.35!important;\n  font-weight:900!important;\n  text-decoration:none!important;\n  transition:transform .15s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease,border-color .15s ease!important;\n}}\nhtml:root body .knowledge-bridge>a:hover,\nhtml:root body .knowledge-bridge>a:focus-visible{{\n  background:var(--qily-gold)!important;\n  border-color:var(--qily-gold)!important;\n  color:#17322d!important;\n  -webkit-text-fill-color:#17322d!important;\n  transform:translateY(-2px)!important;\n  box-shadow:0 10px 24px rgba(122,90,24,.22)!important;\n  outline:3px solid rgba(202,161,95,.32)!important;\n  outline-offset:2px!important;\n}}\nhtml:root body .knowledge-bridge>a:active{{\n  transform:translateY(1px)!important;\n  box-shadow:inset 0 2px 5px rgba(23,50,45,.22)!important;\n}}\n@media(max-width:620px){{\n  html:root body .knowledge-bridge>a{{font-size:20px!important}}\n}}\n@media(prefers-reduced-motion:reduce){{\n  html:root body .knowledge-bridge>a{{transition:none!important}}\n  html:root body .knowledge-bridge>a:hover,\n  html:root body .knowledge-bridge>a:active{{transform:none!important}}\n}}\n'''
          v2.write_text(css2, encoding='utf-8')

          print(f'Document pages: {document_count}; thesis panels: {thesis_count}; canonical footer found on {footer_count}; changed HTML: {changed}; non-document HTML skipped: {len(skipped)}.')
          if skipped:
              print('Skipped non-document HTML: ' + ', '.join(skipped))
          PY

      - name: Verify China brand, page-thesis and CTA rules
        shell: bash
        run: |
          set -euo pipefail
          test -f cn-site/assets/qilylean-vi-v1.css
          test -f cn-site/assets/qilylean-vi-v2.css
          test -f cn-site/assets/cn-nav-rail-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path('cn-site').rglob('*.html'))
          css_marker = 'qilylean-vi-v2.css?v=20260926-cn-vi-v34-interaction-closure'
          official_brand = 'QilyLean | 启力精益'
          footer_marker = 'QilyLean | 启力精益 · 精益制造经验分享</span><nav class="footer-actions" aria-label="页脚快捷操作">'
          toc_pattern = re.compile(r'<aside\b[^>]*class=["\']toc["\'][^>]*>(.*?)</aside>', re.I | re.S)
          brand_anchor_pattern = re.compile(r'<a\b[^>]*class=["\']brand["\'][^>]*>(.*?)</a>', re.I | re.S)
          bad = []
          documents = 0
          footered = 0
          thesis_panels = 0
          brand_anchors = 0

          for path in files:
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text or '<body' not in text.lower():
                  continue
              documents += 1
              css_count = text.count(css_marker)
              nav_script_count = text.count('/assets/cn-nav-rail-v1.js?v=20260926-nav-rail-v11-external-arrows')
              translate_css_count = text.count('/assets/cn-translate-baidu-v1.css?v=20260922-translate-v6-baidu')
              translate_js_count = text.count('/assets/cn-translate-baidu-v1.js?v=20260922-translate-v6-baidu')
              footer_count = text.count(footer_marker)
              footer_tags = len(re.findall(r'<footer class="footer">', text))
              if css_count != 1:
                  bad.append((str(path), 'css', css_count))
              if nav_script_count != 1:
                  bad.append((str(path), 'nav-script', nav_script_count))
              if translate_css_count != 1:
                  bad.append((str(path), 'translate-css', translate_css_count))
              if translate_js_count != 1:
                  bad.append((str(path), 'translate-js', translate_js_count))
              if 'QilyLean｜启力精益' in text or 'QilyLean 启力精益' in text:
                  bad.append((str(path), 'legacy-brand-separator'))
              if footer_tags:
                  footered += 1
                  if footer_count != 1 or footer_tags != 1 or 'footer-links' in text:
                      bad.append((str(path), 'footer', footer_count, footer_tags))

              for match in brand_anchor_pattern.finditer(text):
                  brand_anchors += 1
                  block = match.group(0)
                  if 'QilyLean | <span>启力精益</span>' not in block:
                      bad.append((str(path), 'brand-anchor-not-full'))

              for match in toc_pattern.finditer(text):
                  thesis_panels += 1
                  block = match.group(0)
                  inner = match.group(1)
                  if '<b>本页主旨</b>' not in inner:
                      bad.append((str(path), 'thesis-title'))
                  if '<a' in inner.lower() or 'href=' in inner.lower():
                      bad.append((str(path), 'thesis-clickable'))
                  if 'aria-label="本页主旨"' not in block:
                      bad.append((str(path), 'thesis-aria'))

          about = Path('cn-site/about/index.html').read_text(encoding='utf-8')
          if '<h1>关于“精益制造经验分享”</h1>' not in about:
              bad.append(('cn-site/about/index.html', 'filed-site-name-h1'))
          if '<h1>关于 QilyLean 中国知识站</h1>' in about or f'<h1>关于 {official_brand} 中国知识站</h1>' in about:
              bad.append(('cn-site/about/index.html', 'legacy-china-knowledge-name-h1'))

          home = Path('cn-site/index.html').read_text(encoding='utf-8')
          if '进入 Global Knowledge ↗' not in home:
              bad.append(('cn-site/index.html', 'global-knowledge-cta-label'))
          if '<a href="https://qilylean.com/global-knowledge/" target="_blank" rel="noopener noreferrer" data-qily-external="international" title="进入 QilyLean 国际站 Global Knowledge（新标签页）">进入 Global Knowledge ↗</a>' not in home:
              bad.append(('cn-site/index.html', 'global-knowledge-cta-external-semantics'))

          if thesis_panels < 1:
              bad.append(('cn-site', 'no-thesis-panels-found'))
          if brand_anchors < 1:
              bad.append(('cn-site', 'no-brand-anchors-found'))
          if bad:
              raise SystemExit(f'CN brand/page-thesis/CTA normalization failed: {bad[:80]}')
          if documents < 17:
              raise SystemExit(f'Expected at least 17 China document pages, got {documents}')
          print(f'PASS: {official_brand} verified; {brand_anchors} brand anchor(s), {thesis_panels} non-clickable 本页主旨 panel(s), {documents} China document pages and {footered} canonical footer(s) verified.')
          PY
          grep -q "qilylean-vi-v1.css?v=20260923-cn-typography-base-v7" cn-site/assets/qilylean-vi-v2.css
          grep -q 'CN page-thesis module: descriptive, not clickable' cn-site/assets/qilylean-vi-v2.css
          grep -q 'QILY-CN-THESIS-NONINTERACTIVE-V1' cn-site/assets/qilylean-vi-v2.css
          grep -q 'QILY-CN-NAV-RAIL-V7' cn-site/assets/qilylean-vi-v2.css
          grep -q 'QILY-CN-CURRENT-MODULE-V1' cn-site/assets/qilylean-vi-v2.css
          grep -q 'QILY-CN-CURRENT-MODULE-RUNTIME-V1' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'QILY-CN-STICKY-HEADER-V1' cn-site/assets/qilylean-vi-v2.css
          grep -q 'QILY-CN-HEADER-SHELL-PARITY-V3' cn-site/assets/qilylean-vi-v2.css
          grep -q 'min-height:83.4px!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'QILY-CN-TYPE-HIERARCHY-V5' cn-site/assets/qilylean-vi-v2.css
          grep -q -- '--qily-cn-h1:clamp(28px,2.25vw,38px)' cn-site/assets/qilylean-vi-v2.css
          grep -q -- '--qily-cn-h2:clamp(20px,1.25vw,22px)' cn-site/assets/qilylean-vi-v2.css
          grep -q -- '--qily-cn-h3:clamp(17px,1vw,19px)' cn-site/assets/qilylean-vi-v2.css
          ! grep -q 'clamp(32px,3vw,48px)!important' cn-site/assets/qilylean-vi-v1.css
          grep -q 'position:sticky!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'top:0!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'qily-primary-nav-scroll-rail' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'qily-primary-nav-scroll-thumb' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'mousedown' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'mousemove' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'touchstart' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'qily-cn-nav-shell' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'justify-content:flex-start!important' cn-site/assets/qilylean-vi-v2.css # CN nav must start from the physical left edge
          grep -q 'height:9px!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'height:7px!important' cn-site/assets/qilylean-vi-v2.css
          grep -q '.qily-primary-nav-scroll-thumb' cn-site/assets/qilylean-vi-v2.css
          grep -q 'background:#b9d9d4!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'background:#0f4b5a!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'min-width:104px!important' cn-site/assets/qilylean-vi-v2.css
          grep -q -- '--qily-cn-primary-nav-font-size:20px' cn-site/assets/qilylean-vi-v2.css
          grep -q 'grid-template-areas:"brand nav translate"' cn-site/assets/qilylean-vi-v2.css
          grep -q 'grid-template-areas:"brand translate" "nav nav"' cn-site/assets/qilylean-vi-v2.css
          grep -q 'mousedown' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'mousemove' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'touchstart' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'installNavMouseDrag' cn-site/assets/cn-nav-rail-v1.js
          ! grep -q 'pointerdown' cn-site/assets/cn-nav-rail-v1.js
          grep -q -- '--qily-nav-scroll-track:#b9d9d4' cn-site/assets/qilylean-vi-v2.css
          grep -q -- '--qily-nav-scroll-thumb:#0f4b5a' cn-site/assets/qilylean-vi-v2.css
          ! grep -q 'data-qily-translation-provider' cn-site/assets/cn-nav-rail-v1.js
          grep -q 'QilyLean CN In-Page Translation V7' cn-site/assets/cn-translate-baidu-v1.js
          grep -q 'API_BASES' cn-site/assets/cn-translate-baidu-v1.js
          grep -q 'target_language:target' cn-site/assets/cn-translate-baidu-v1.js
          grep -q "data-qily-translation-engine','baidu'" cn-site/assets/cn-translate-baidu-v1.js
          grep -q 'concurrency=1' cn-site/assets/cn-translate-baidu-v1.js
          grep -q 'QilyLean CN In-Page Translation UI V3' cn-site/assets/cn-translate-baidu-v1.css
          grep -q -- '--qily-cn-h3:clamp(17px,4.5vw,19px)' cn-site/assets/qilylean-vi-v2.css
          grep -q 'CN global-knowledge CTA: VI gold + explicit interaction feedback' cn-site/assets/qilylean-vi-v2.css
          grep -q 'html:root body .knowledge-bridge>a:hover' cn-site/assets/qilylean-vi-v2.css
          grep -q 'font-size:18px!important' cn-site/assets/qilylean-vi-v2.css
          grep -q 'background:var(--qily-gold)!important' cn-site/assets/qilylean-vi-v2.css
          grep -q "content:'精益生产'" cn-site/assets/qilylean-vi-v2.css
          grep -q "content:'工业工程'" cn-site/assets/qilylean-vi-v2.css
          grep -q "content:'标准体系'" cn-site/assets/qilylean-vi-v2.css
          grep -q "content:'改善工具'" cn-site/assets/qilylean-vi-v2.css
          echo 'CN V14 reading-scale closure passed: QilyLean | 启力精益 + non-clickable 本页主旨 + gold interactive global CTA + shared VI.'

      - name: Commit rollout safely
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No rollout changes required.'
            exit 0
          fi
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add cn-site
          git commit -m 'style(cn): close brand, thesis and global CTA VI'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
