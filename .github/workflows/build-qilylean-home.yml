name: Build QilyLean Home APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/qilylean-home/**'
      - 'assets/tools/qilylean-unified-app-icon.svg'
      - 'capabilities/index.html'
      - '.github/workflows/build-qilylean-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android and publication files
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            android/qilylean-home
            assets/tools/qilylean-unified-app-icon.svg
            capabilities/index.html
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate unified icon wiring
        run: |
          grep -q 'android:icon="@drawable/ic_launcher"' android/qilylean-home/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_launcher"' android/qilylean-home/app/src/main/AndroidManifest.xml
          grep -q '#FF10596C' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml
          grep -q '#FFDC3C31' android/qilylean-home/app/src/main/res/drawable/ic_launcher.xml

      - name: Build debug APK
        run: gradle -p android/qilylean-home :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk dist/QilyLean_Home_Universal_v2.1.apk
          sha256sum dist/QilyLean_Home_Universal_v2.1.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QilyLean-Home-Universal-v2.1
          path: dist/
          if-no-files-found: error
