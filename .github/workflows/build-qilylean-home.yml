name: Build QilyLean Home APK

on:
  push:
    branches: [qilylean-home-universal-v2.0]
    paths:
      - 'android/qilylean-home/**'
      - 'scripts/publish-qilylean-home-v2.py'
      - '.github/workflows/build-qilylean-home.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/qilylean-home/**'
      - 'scripts/publish-qilylean-home-v2.py'
      - '.github/workflows/build-qilylean-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android and publication files
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            android/qilylean-home
            capabilities/index.html
            scripts/publish-qilylean-home-v2.py
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android/qilylean-home :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/qilylean-home/app/build/outputs/apk/debug/app-debug.apk dist/QilyLean_Home_Universal_v2.0.apk
          sha256sum dist/QilyLean_Home_Universal_v2.0.apk > dist/SHA256SUMS.txt

      - name: Validate website publication patch
        run: |
          python3 scripts/publish-qilylean-home-v2.py
          grep -q 'Android官网全导航通用版 v2.0' capabilities/index.html
          grep -q 'QilyLean_Home_Universal_v2.0.apk?build=dc8ba9ddff23' capabilities/index.html
          git diff --check

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QilyLean-Home-Universal-v2.0
          path: dist/
          if-no-files-found: error

      - name: Publish APK and website module to branch
        if: github.event_name == 'push'
        run: |
          cp dist/QilyLean_Home_Universal_v2.0.apk ./QilyLean_Home_Universal_v2.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f QilyLean_Home_Universal_v2.0.apk capabilities/index.html
          if git diff --cached --quiet; then
            echo 'No publication changes required.'
          else
            git commit -m 'build: publish QilyLean Home universal v2.0'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
