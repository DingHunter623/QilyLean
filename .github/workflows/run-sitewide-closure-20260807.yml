name: Run QilyLean sitewide closure 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sitewide-closure-20260807.py'
      - '.github/workflows/run-sitewide-closure-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF dependency
        run: python3 -m pip install --quiet pymupdf

      - name: Apply sitewide closure
        run: python3 scripts/sitewide-closure-20260807.py

      - name: Validate JavaScript
        run: |
          node --check site-navigation-core.js
          node --check site-core-service-dock-closure-v1.js
          node --check site-navigation.js
          node --check site-navigation-legacy-20260802.js
          node --check scripts/normalize-first-paint-fouc.js

      - name: Commit and publish
        run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add -A ':!.github/workflows/run-sitewide-closure-20260807.yml' ':!scripts/sitewide-closure-20260807.py'
          if git diff --cached --quiet; then
            echo 'No content changes to publish.'
            exit 0
          fi
          git commit -m '全站整改：术语PDF、文档邮箱、回顶部、跳转性能与安全清理'
          git push origin HEAD:main
