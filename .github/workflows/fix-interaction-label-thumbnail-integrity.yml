name: Fix interaction label and thumbnail integrity

on:
  push:
    branches:
      - fix/interaction-label-and-thumbnail-separation-20260805
    paths:
      - "site-text-contrast-audit-v1.js"
      - "scripts/fix-interaction-label-thumbnail-integrity.js"
      - "scripts/fix-interaction-label-thumbnail-integrity-v2.js"
      - ".github/workflows/fix-interaction-label-thumbnail-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-interaction-label-thumbnail-integrity
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interaction-label-and-thumbnail-separation-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply repeatable sitewide fixes
        run: |
          node --check site-text-contrast-audit-v1.js
          node --check scripts/fix-interaction-label-thumbnail-integrity-v2.js
          node scripts/fix-interaction-label-thumbnail-integrity-v2.js
          node --check site-navigation.js
          node --check site-visual-closure-v1.js
          git diff --check

      - name: Verify full-site contracts
        shell: bash
        run: |
          grep -q 'qtc-action-label' site-trust-conversion-v2.css
          grep -q 'data-qily-auto-contrast' site-trust-conversion-v2.css
          grep -q 'QILY-FACTORY-THUMBNAIL-LABEL-SEPARATION' projects/project-pages.css
          grep -q "if(!link.classList.contains('qtc-action'))" site-visual-closure-v1.js
          grep -q 'data-qily-text-contrast-audit' site-navigation.js
          grep -q '20260805-action-label-v4' site-navigation.js
          grep -q '20260805-runtime-audit-v1' site-navigation.js
          node scripts/fix-interaction-label-thumbnail-integrity-v2.js
          git diff --check

      - name: Commit materialized fixes to branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No materialized changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-trust-conversion-v2.css projects/project-pages.css site-visual-closure-v1.js site-navigation.js
          git commit -m "fix: materialize interaction label and thumbnail separation [skip ci]"
          git push origin HEAD:fix/interaction-label-and-thumbnail-separation-20260805
