name: Render protected contract previews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-contract-pages.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils webp

      - name: Render PDFs to lossless WebP pages
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          render_contract() {
            key="$1"
            source_b64="$2"
            pdf="$work/${key}.pdf"
            png_dir="$work/${key}-png"
            output_dir="media/contracts/${key}"

            mkdir -p "$png_dir"
            rm -rf "$output_dir"
            mkdir -p "$output_dir"

            base64 --decode "$source_b64" > "$pdf"
            test "$(head -c 4 "$pdf")" = "%PDF"
            pdftoppm -png -r 170 "$pdf" "$png_dir/page"

            for image in "$png_dir"/page-*.png; do
              number="${image##*-}"
              number="${number%.png}"
              printf -v padded '%02d' "$((10#$number))"
              cwebp -quiet -lossless -m 6 "$image" -o "$output_dir/page-${padded}.webp"
            done
          }

          render_contract factory qilylean/private/factory-planning-contract.pdf.b64
          render_contract lean qilylean/private/lean-improvement-delivery-contract.pdf.b64
          render_contract visual qilylean/private/5s-visual-contract.pdf.b64

          test "$(find media/contracts/factory -name 'page-*.webp' | wc -l)" -eq 16
          test "$(find media/contracts/lean -name 'page-*.webp' | wc -l)" -eq 17
          test "$(find media/contracts/visual -name 'page-*.webp' | wc -l)" -eq 12

          rm -f \
            qilylean/private/factory-planning-contract.pdf.b64 \
            qilylean/private/lean-improvement-delivery-contract.pdf.b64 \
            qilylean/private/5s-visual-contract.pdf.b64 \
            .github/workflows/render-contract-pages.yml

      - name: Publish protected online previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A media/contracts qilylean/private .github/workflows/render-contract-pages.yml
          git commit -m 'fix: publish contract image previews and remove PDF sources [skip ci]'
          git push
