name: Publish weekly curated engineering brief archive
# QilyLean R2 production authority: curated archive only; no legacy full-daily regeneration.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-daily-archive.yml'
      - 'qilylean/daily/*.html'
      - 'qilylean/daily/index.json'
      - 'qilylean/daily/feed.xml'
      - 'qilylean/daily/curation-report.json'
      - 'qilylean/daily/curation-baseline.json'
      - 'qilylean/assets/daily-*.svg'
      - 'qilylean/daily/assets/**'
      - 'qilylean/daily-briefs.css'
      - 'qilylean/daily-feedback.js'
      - 'qilylean/brief-curation-policy.json'
      - 'knowledge/terminology.html'
      - 'knowledge/terminology/*.html'
      - 'scripts/curate-weekly-briefs.js'
      - 'scripts/validate-weekly-brief-curation.js'
      - 'scripts/enforce-six-core-static-source.js'
      - 'scripts/sync-curated-site-metadata.js'
      - 'scripts/sync-search-brief-metadata.js'
      - 'scripts/sync-trust-brief-metadata.js'
      - 'scripts/sync-daily-terminology.js'
      - 'scripts/audit-daily-terminology.js'
      - 'scripts/audit-daily-quality-linkage.js'
      - 'scripts/remove-daily-directory-consultation.js'
      - 'scripts/normalize-daily-visual-closure.js'
      - 'scripts/publish-r2-clean-runtime-v3.js'
      - 'scripts/validate-current-daily-publication.js'
      - 'index.html'
      - 'knowledge/index.html'
      - 'trust/index.html'
      - 'sitemap.xml'
      - 'sitemap-core.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-publication-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate curated publisher syntax
        run: |
          node --check scripts/curate-weekly-briefs.js
          node --check scripts/validate-weekly-brief-curation.js
          node --check scripts/enforce-six-core-static-source.js
          node --check scripts/sync-curated-site-metadata.js
          node --check scripts/sync-search-brief-metadata.js
          node --check scripts/sync-trust-brief-metadata.js
          node --check scripts/sync-daily-terminology.js
          node --check scripts/audit-daily-terminology.js
          node --check scripts/audit-daily-quality-linkage.js
          node --check scripts/remove-daily-directory-consultation.js
          node --check scripts/normalize-daily-visual-closure.js
          node --check scripts/publish-r2-clean-runtime-v3.js
          node --check scripts/validate-current-daily-publication.js

      - name: Curate current candidate archive by weekly value
        run: node scripts/curate-weekly-briefs.js

      - name: Normalize retained knowledge and brief quality
        run: |
          node scripts/remove-daily-directory-consultation.js
          node scripts/normalize-daily-visual-closure.js
          node scripts/sync-daily-terminology.js
          node scripts/sync-daily-terminology.js --check
          node scripts/audit-daily-terminology.js
          node scripts/audit-daily-quality-linkage.js

      - name: Synchronize six-core source, search, trust and R2 runtime
        run: |
          node scripts/sync-curated-site-metadata.js
          node scripts/enforce-six-core-static-source.js
          node scripts/sync-search-brief-metadata.js
          node scripts/sync-trust-brief-metadata.js
          node scripts/publish-r2-clean-runtime-v3.js

      - name: Validate curated publication contracts
        run: |
          node scripts/sync-trust-brief-metadata.js --check
          node scripts/validate-weekly-brief-curation.js
          node scripts/validate-current-daily-publication.js
          git diff --check

      - name: Commit curated production output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Curated production archive is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish curated weekly engineering archive [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
