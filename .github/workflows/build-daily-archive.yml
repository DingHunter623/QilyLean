name: Build curated engineering brief archive
# Weekly quality-first publication baseline: 2026-08-12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-daily-archive.yml'
      - 'qilylean/daily/*.html'
      - 'qilylean/assets/daily-*.svg'
      - 'qilylean/daily-briefs.css'
      - 'qilylean/daily-feedback.js'
      - 'qilylean/brief-curation-policy.json'
      - 'qilylean/site-data.json'
      - 'qilylean/site-search-index.json'
      - 'site-number-badge-contrast-v1.css'
      - 'site-interactive-hover-contrast-v1.css'
      - 'homepage-music-v5.js'
      - 'site-footer-standard-v28.css'
      - 'site-footer-standard-v28.js'
      - 'knowledge/terminology.html'
      - 'knowledge/terminology/*.html'
      - 'scripts/build-daily-archive.js'
      - 'scripts/curate-weekly-briefs.js'
      - 'scripts/validate-weekly-brief-curation.js'
      - 'scripts/materialize-professionalization-v24.js'
      - 'scripts/publish-primary-contrast-music-continuity.js'
      - 'scripts/apply-footer-standard-v28.js'
      - 'scripts/materialize-footer-standard-v28.js'
      - 'scripts/build-site-metadata.js'
      - 'scripts/sync-search-brief-metadata.js'
      - 'scripts/sync-trust-brief-metadata.js'
      - 'scripts/daily-engineering-archive.js'
      - 'scripts/enhance-daily-archive.js'
      - 'scripts/enhance-terminology-training.js'
      - 'scripts/audit-daily-terminology.js'
      - 'scripts/audit-daily-quality-linkage.js'
      - 'scripts/publish-equipment-reliability-terminology.js'
      - 'scripts/sync-daily-terminology.js'
      - 'scripts/bump-daily-css-version.js'
      - 'scripts/validate-daily-archive.js'
      - 'scripts/validate-current-daily-publication.js'
      - 'scripts/remove-daily-directory-consultation.js'
      - 'scripts/normalize-daily-visual-closure.js'
      - 'scripts/publish-number-badge-contrast.js'
      - 'scripts/apply-commercial-quality-closure-20260804.js'
      - 'scripts/hide-public-pricing.js'
      - 'scripts/enforce-productivity-theme-alias.js'
      - 'scripts/normalize-daily-quality-label.js'
      - 'sitemap.xml'
      - 'sitemap-core.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-publication-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate publisher syntax
        run: |
          node --check scripts/build-daily-archive.js
          node --check scripts/curate-weekly-briefs.js
          node --check scripts/validate-weekly-brief-curation.js
          node --check scripts/build-site-metadata.js
          node --check scripts/sync-search-brief-metadata.js
          node --check scripts/sync-trust-brief-metadata.js
          node --check scripts/enhance-daily-archive.js
          node --check scripts/enhance-terminology-training.js
          node --check scripts/audit-daily-terminology.js
          node --check scripts/audit-daily-quality-linkage.js
          node --check scripts/publish-equipment-reliability-terminology.js
          node --check scripts/sync-daily-terminology.js
          node --check scripts/bump-daily-css-version.js
          node --check scripts/validate-daily-archive.js
          node --check scripts/validate-current-daily-publication.js
          node --check scripts/remove-daily-directory-consultation.js
          node --check scripts/normalize-daily-visual-closure.js
          node --check scripts/publish-number-badge-contrast.js
          node --check scripts/apply-commercial-quality-closure-20260804.js
          node --check scripts/hide-public-pricing.js
          node --check scripts/enforce-productivity-theme-alias.js
          node --check scripts/normalize-daily-quality-label.js
          node --check scripts/materialize-professionalization-v24.js
          node --check scripts/publish-primary-contrast-music-continuity.js
          node --check scripts/apply-footer-standard-v28.js
          node --check scripts/materialize-footer-standard-v28.js
          node --check site-footer-standard-v28.js
          node --check homepage-music-v5.js

      - name: Rebuild complete engineering source archive
        run: |
          node scripts/apply-commercial-quality-closure-20260804.js
          node scripts/hide-public-pricing.js
          node scripts/enforce-productivity-theme-alias.js
          node scripts/normalize-daily-quality-label.js
          node scripts/build-daily-archive.js
          node scripts/publish-equipment-reliability-terminology.js
          node scripts/enhance-daily-archive.js
          node scripts/enhance-terminology-training.js
          node scripts/normalize-daily-quality-label.js
          node scripts/audit-daily-terminology.js
          node scripts/sync-daily-terminology.js
          node scripts/sync-daily-terminology.js --check
          node scripts/build-site-metadata.js
          node scripts/sync-search-brief-metadata.js
          node scripts/bump-daily-css-version.js
          node scripts/apply-commercial-quality-closure-20260804.js
          node scripts/hide-public-pricing.js
          node scripts/enforce-productivity-theme-alias.js
          node scripts/normalize-daily-quality-label.js

      - name: Unify source archive brand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('qilylean/daily-insights.html'), *Path('qilylean/daily').glob('*.html')]
          for file in files:
              text = file.read_text(encoding='utf-8')
              file.write_text(text.replace('>制造改善知识分享<', '>QilyLean｜启力精益<'), encoding='utf-8')
          PY

      - name: Validate complete source archive before curation
        run: node scripts/validate-daily-archive.js

      - name: Curate weekly high-value public archive
        run: node scripts/curate-weekly-briefs.js

      - name: Finalize current message, visual and metadata closure
        run: |
          node scripts/remove-daily-directory-consultation.js
          node scripts/normalize-daily-visual-closure.js
          node scripts/publish-number-badge-contrast.js
          node scripts/audit-daily-quality-linkage.js
          node scripts/build-site-metadata.js
          node scripts/sync-search-brief-metadata.js
          node scripts/sync-trust-brief-metadata.js

      - name: Apply V24 professionalization closure
        run: node scripts/materialize-professionalization-v24.js

      - name: Apply V27 sitewide gesture music contract
        run: node scripts/publish-primary-contrast-music-continuity.js

      - name: Apply V28 unified footer contract
        run: |
          node scripts/apply-footer-standard-v28.js
          node scripts/materialize-footer-standard-v28.js
          node scripts/materialize-footer-standard-v28.js --check

      - name: Validate trust brief metadata contract
        run: node scripts/sync-trust-brief-metadata.js --check

      - name: Validate weekly curation and protected briefs
        run: node scripts/validate-weekly-brief-curation.js

      - name: Verify deterministic diff
        run: git diff --check

      - name: Commit generated curated publication
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Generated curated archive is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish weekly curated engineering brief archive [skip ci]'
          git push origin HEAD:main
