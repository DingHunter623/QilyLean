name: Build daily engineering brief archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-daily-archive.yml"
      - "qilylean/daily/*.html"
      - "qilylean/assets/daily-*.svg"
      - "qilylean/daily-briefs.css"
      - "qilylean/daily-feedback.js"
      - "site-search.js"
      - "site-navigation.js"
      - "knowledge/terminology.html"
      - "scripts/build-daily-archive.js"
      - "scripts/daily-engineering-archive.js"
      - "scripts/enhance-daily-archive.js"
      - "scripts/enhance-terminology-training.js"
      - "scripts/bump-daily-css-version.js"
      - "scripts/validate-daily-archive.js"
      - "scripts/remove-daily-directory-consultation.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-archive-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild archive, adjacent links and sitemap
        run: node scripts/build-daily-archive.js

      - name: Deepen archive content and external visuals
        run: node scripts/enhance-daily-archive.js

      - name: Keep terminology search aligned
        run: node scripts/enhance-terminology-training.js

      - name: Pin responsive daily stylesheet version
        run: node scripts/bump-daily-css-version.js

      - name: Unify Daily Engineering Brief brand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('qilylean/daily-insights.html'), *Path('qilylean/daily').glob('*.html')]
          old = '>制造改善知识分享<'
          new = '>QilyLean｜启力精益<'
          for file in files:
              text = file.read_text(encoding='utf-8')
              if old in text:
                  file.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate generated archive
        shell: bash
        run: |
          test -f qilylean/daily-insights.html
          test -f qilylean/daily/index.json
          test -f qilylean/assets/daily-2019-07-10.svg
          LATEST_DATE="$(node -e "const data=require('./qilylean/daily/index.json'); process.stdout.write(data[0].date)")"
          grep -q "qilylean/daily/$LATEST_DATE.html" sitemap.xml || {
            echo "Latest daily brief is missing from sitemap.xml"
            exit 1
          }
          grep -q "$LATEST_DATE" qilylean/daily-insights.html || {
            echo "Latest daily brief is missing from daily-insights.html"
            exit 1
          }
          grep -q "data-latest-brief-card data-latest-brief-date=\"$LATEST_DATE\"" knowledge/index.html || {
            echo "Knowledge sharing latest brief card has a mismatched date"
            exit 1
          }
          grep -q "data-latest-brief-link href=\"/qilylean/daily/$LATEST_DATE.html\"" knowledge/index.html || {
            echo "Knowledge sharing latest brief card has a mismatched link"
            exit 1
          }
          grep -q "QilyLean｜启力精益" qilylean/daily-insights.html || {
            echo "Daily Engineering Brief brand is not unified"
            exit 1
          }
          if grep -R -E "DAY[0-9]{3}" qilylean/daily qilylean/daily-insights.html >/dev/null; then
            echo "Legacy DAY sequence is still present"
            exit 1
          fi
          grep -q "工程者手记" qilylean/daily/2019-07-10.html || {
            echo "Daily engineering archive depth was not generated"
            exit 1
          }
          grep -q 'img src="/qilylean/assets/daily-2019-07-10.svg"' qilylean/daily/2019-07-10.html || {
            echo "Daily brief external visual was not generated"
            exit 1
          }
          grep -q "ranked-search-v12" qilylean/daily-briefs.css || {
            echo "Mobile responsive stylesheet marker is missing"
            exit 1
          }
          node --check site-search.js
          node --check site-navigation.js
          grep -q "loadDailyEntries" site-search.js || {
            echo "Structured Daily Brief search index is missing"
            exit 1
          }
          grep -q "已按关联度排序" site-search.js || {
            echo "Site search relevance-first status is missing"
            exit 1
          }
          grep -q "site-search.js?v=20260729-ranked-search-v1" site-navigation.js || {
            echo "Ranked site search asset version is not active"
            exit 1
          }
          grep -q "点击进入该词条的原分类位置" knowledge/terminology.html || {
            echo "Terminology result jump guidance is missing"
            exit 1
          }
          grep -q "daily-briefs.css?v=20260729-ranked-search-v12" "qilylean/daily/$LATEST_DATE.html" || {
            echo "Latest brief is not pinned to the mobile responsive stylesheet"
            exit 1
          }
          node scripts/validate-daily-archive.js

      - name: Remove duplicate directory consultation
        run: node scripts/remove-daily-directory-consultation.js

      - name: Validate directory consultation removal
        shell: bash
        run: |
          if grep -E 'id="brief-consultation"|id="briefConsultationForm"|简报留言交流|留言来源：今日简报总目录' qilylean/daily-insights.html >/dev/null; then
            echo "Duplicate consultation module still exists in the daily directory"
            exit 1
          fi
          if grep -R -E 'brief-consultation-cta|#brief-consultation' qilylean/daily/*.html >/dev/null; then
            echo "Obsolete directory consultation CTA still exists in a brief page"
            exit 1
          fi
          LATEST_DATE="$(node -e "const data=require('./qilylean/daily/index.json'); process.stdout.write(data[0].date)")"
          grep -q 'data-brief-message-form' "qilylean/daily/$LATEST_DATE.html" || {
            echo "Direct message form is missing from the latest brief"
            exit 1
          }
          grep -q '留言交流' "qilylean/daily/$LATEST_DATE.html" || {
            echo "Direct brief message module is missing"
            exit 1
          }
          if grep -E '评价本期简报|五星好评|点赞好评|data-brief-rating|data-brief-sentiment|data-like-count|data-dislike-count' "qilylean/daily/$LATEST_DATE.html" >/dev/null; then
            echo "Obsolete public rating module still exists"
            exit 1
          fi
          for PAGE in "qilylean/daily-insights.html" "qilylean/daily/$LATEST_DATE.html" "qilylean/daily/2019-07-10.html"; do
            grep -q 'data-qily-shell-bootstrap' "$PAGE" || {
              echo "No-flash shell bootstrap is missing: $PAGE"
              exit 1
            }
            grep -q '<script defer src="/site-navigation.js?v=20260729-no-old-flash-v1"></script>' "$PAGE" || {
              echo "Current deferred navigation is missing: $PAGE"
              exit 1
            }
            grep -q 'site-shell.css?v=20260729-no-old-flash-v1' "$PAGE" || {
              echo "Current shell stylesheet is missing: $PAGE"
              exit 1
            }
          done
          if grep -R -E 'site-navigation\.js\?v=20260728-layout-type-v3|site-shell\.css\?v=20260725-compact-hero-v1|homepage-music\.js\?v=20260722-continuous-v3' qilylean/daily qilylean/daily-insights.html >/dev/null; then
            echo "Legacy shared asset reference was regenerated"
            exit 1
          fi

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated archive is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/index.html knowledge/terminology.html qilylean/daily-insights.html qilylean/daily/index.json qilylean/daily/*.html qilylean/assets/daily-*.svg sitemap.xml
          git commit -m "build: publish enriched daily engineering brief archive [skip ci]"
          git push
