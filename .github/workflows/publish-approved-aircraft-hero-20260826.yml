name: Validate Approved Aircraft Hero

on:
  push:
    branches: [main]
    paths:
      - '官网首图.png'
      - 'assets/qilylean-aircraft-hero-approved-20260826.png'
      - 'assets/qilylean-aircraft-hero-latest-q98.webp'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-approved-aircraft-hero-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate latest user-approved airplane closure
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='32a218ed835ff0518cc7e2530f37c8cfa0b05b53'
          test "$(git hash-object '官网首图.png')" = "$EXPECTED_BLOB"
          cmp -s '官网首图.png' 'assets/qilylean-aircraft-hero-approved-20260826.png'
          grep -q 'qilylean-aircraft-hero-latest-q98.webp?v=20260831-aircraft-latest-v5' index.html
          grep -q 'qilylean-aircraft-hero-approved-20260826.png?v=20260831-aircraft-latest-v5' index.html
          node --check scripts/site-regression-guard-aircraft-hero.js
          node scripts/site-regression-guard-aircraft-hero.js
          git diff --check
