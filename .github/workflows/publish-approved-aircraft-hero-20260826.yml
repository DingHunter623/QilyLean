name: Validate Current Approved Aircraft Hero

on:
  push:
    branches: [main]
    paths:
      - 'assets/aircraft/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-approved-aircraft-hero-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate latest user-approved airplane closure
        shell: bash
        run: |
          set -euo pipefail
          declare -A EXPECTED_BLOBS=(
            ['assets/aircraft/aircraft-international-20261019-912.webp']='d02a9bc9a76ec439fd63c30008802c773870cb4e'
            ['assets/aircraft/aircraft-international-20261019-1824.webp']='1f65c74f1d2396a92fa802d69eebe8f6674b1583'
            ['assets/aircraft/aircraft-international-20261019-2736.webp']='c2fc7abd86e3cc7a7176c4d1e831cd1b2d993b82'
          )
          for SOURCE in "${!EXPECTED_BLOBS[@]}"; do
            test -f "$SOURCE"
            ACTUAL_BLOB="$(git hash-object "$SOURCE")"
            test "$ACTUAL_BLOB" = "${EXPECTED_BLOBS[$SOURCE]}"
            echo "Homepage aircraft WebP locked: $SOURCE $ACTUAL_BLOB"
          done
          test ! -e 'assets/qilylean-aircraft-hero-approved-20260826.png'
          node scripts/aircraft-assets.js
          grep -q 'aircraft-international-20261019-2736.webp' index.html
          if grep -q 'qilylean-aircraft-hero-approved-20260826.png' index.html; then echo 'Retired aircraft PNG still referenced by index.html'; exit 1; fi
          node --check scripts/site-regression-guard-aircraft-hero.js
          node scripts/site-regression-guard-aircraft-hero.js
          git diff --check
