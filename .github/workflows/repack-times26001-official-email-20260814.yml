name: Repack Times26001 v1.1.13 官网邮箱 + URL V13 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repack-times26001-official-email-20260814.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: times26001-url-v13-main
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: android-actions/setup-android@v3
      - name: Install signing tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'

      - name: Patch APK user-visible contact text and standalone root URL
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          source=Path('Times26001-Android-v1.1.13-Standard-Website-Logo.apk')
          target=Path('/tmp/Times26001-url-v13-unsigned.apk')
          if not source.exists(): raise SystemExit('Times26001 source APK missing')
          old_email='企业邮箱'.encode('utf-8')
          new_email='官网邮箱'.encode('utf-8')
          old_url=b'https://qilylean.com/'
          new_url=b'https://qilylean.com'
          text_ext={'.html','.htm','.js','.json','.txt','.xml','.css','.md','.svg','.csv'}
          email_replacements=0
          url_replacements=0
          unsafe=[]
          markers=(b'"',b"'",b'\x00',b' ',b'\n',b'\r',b'<',b')',b']',b'}')
          with ZipFile(source,'r') as zin, ZipFile(target,'w',ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.filename.startswith('META-INF/'):
                      continue
                  data=zin.read(item.filename)
                  c=data.count(old_email)
                  if c:
                      # Same UTF-8 byte length, safe for existing binary/string-pool payloads.
                      if len(old_email)!=len(new_email): raise SystemExit('email byte length mismatch')
                      data=data.replace(old_email,new_email)
                      email_replacements+=c
                  standalone=any(old_url+m in data for m in markers) or data.endswith(old_url)
                  if standalone:
                      ext=Path(item.filename).suffix.lower()
                      is_text=ext in text_ext or item.filename.startswith(('assets/','res/raw/'))
                      if not is_text:
                          unsafe.append(item.filename)
                      else:
                          # Text/Web resource: variable length replacement is safe inside its ZIP entry.
                          pattern=re.compile(rb'https://qilylean[.]com/(?=(?:["\'<>\s),;\]}]|$))')
                          data,n=pattern.subn(new_url,data)
                          url_replacements+=n
                  zout.writestr(item,data)
          print('APK email replacements:',email_replacements)
          print('APK URL replacements:',url_replacements)
          if unsafe:
              raise SystemExit('Standalone root URL found in unsafe compiled entries: '+','.join(unsafe[:20]))
          with ZipFile(target,'r') as z:
              stale_email=[]; stale_url=[]
              for name in z.namelist():
                  data=z.read(name)
                  if old_email in data: stale_email.append(name)
                  if any(old_url+m in data for m in markers) or data.endswith(old_url): stale_url.append(name)
          if stale_email: raise SystemExit('企业邮箱 remains inside APK: '+','.join(stale_email[:20]))
          if stale_url: raise SystemExit('slash-terminated standalone root URL remains inside APK: '+','.join(stale_url[:20]))

      - name: Sign and validate installable APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/times26001-url-v13.keystore -storepass QilyLean26001 -keypass QilyLean26001 -alias times26001-url-v13 -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=QilyLean, OU=Times26001, O=QilyLean, C=CN'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 /tmp/Times26001-url-v13-unsigned.apk /tmp/Times26001-url-v13-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/times26001-url-v13.keystore --ks-key-alias times26001-url-v13 --ks-pass pass:QilyLean26001 --key-pass pass:QilyLean26001 --out Times26001-Android-v1.1.13-Standard-Website-Logo.apk /tmp/Times26001-url-v13-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Times26001-Android-v1.1.13-Standard-Website-Logo.apk
          sha256sum Times26001-Android-v1.1.13-Standard-Website-Logo.apk > Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt

      - name: Synchronize release metadata safely
        shell: python
        run: |
          from pathlib import Path
          import json,re
          standalone=re.compile(r'https://qilylean[.]com/(?=(?:["\'<>\s),;\]}]|$))')
          for name in ['tools/times26001/index.html','capabilities/index.html','app-support/index.html','app-store/times26001/README.md','app-download-share-v1.js','times26001-home-card.js']:
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8').replace('企业邮箱','官网邮箱')
                  s=standalone.sub('https://qilylean.com',s)
                  p.write_text(s,encoding='utf-8')
          p=Path('app-release-manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['updatedAt']='2026-08-14'
          app=data['apps']['times26001']
          app['officialWebsiteLinkPolicy']='APP可展示并由用户主动访问QilyLean官网与官网邮箱；用户可见官方网址不带尾斜杠；Google Play及正式应用市场版不得引导用户绕过应用市场下载、更新或安装APK'
          app['publicRelease']['label']='当前官网安装包（官网标准LOGO、官网邮箱与URL V13统一版）'
          app['latestBuild']['status']='顶部LOGO统一为官网横版标准；官网邮箱统一；用户可见官方网址无尾斜杠；保留天气定位可靠性修正'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit repacked official package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add Times26001-Android-v1.1.13-Standard-Website-Logo.apk Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt \
            tools/times26001/index.html capabilities/index.html app-support/index.html app-store/times26001/README.md \
            app-download-share-v1.js times26001-home-card.js app-release-manifest.json
          git commit -m 'release: repack Times26001 URL V13 [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: Times26001-v1.1.13-URL-V13
          path: |
            Times26001-Android-v1.1.13-Standard-Website-Logo.apk
            Times26001-Android-v1.1.13-Standard-Website-Logo.sha256.txt
          if-no-files-found: error
          retention-days: 30
