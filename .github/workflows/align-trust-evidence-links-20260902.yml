name: Align trust evidence links 20260902

on:
  push:
    paths:
      - '.github/workflows/align-trust-evidence-links-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align evidence link baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site-public-redline-closure-v2.css')
          text = path.read_text(encoding='utf-8')
          old = '''html body #evidence-levels .trust-level .trust-evidence-links{margin-top:14px!important;padding-top:0!important;border-top:0!important}\nhtml body #evidence-levels .trust-level .trust-evidence-links>a{display:block!important;margin-top:5px!important}'''
          new = '''html body #evidence-levels .trust-level .trust-evidence-links{margin-top:14px!important;padding-top:0!important;border-top:0!important}\nhtml body #evidence-levels .trust-level .trust-evidence-links>span{display:block!important;min-height:calc(1.55em * 2)!important}\nhtml body #evidence-levels .trust-level .trust-evidence-links>a{display:block!important;margin-top:5px!important}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Self-check scope
        run: |
          git diff -- site-public-redline-closure-v2.css
          grep -Fq 'trust-evidence-links>span{display:block!important;min-height:calc(1.55em * 2)!important}' site-public-redline-closure-v2.css

      - name: Commit targeted fix and remove one-time workflow
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git rm .github/workflows/align-trust-evidence-links-20260902.yml
          git add site-public-redline-closure-v2.css
          git commit -m 'fix: align trust evidence link baselines'
          git push
