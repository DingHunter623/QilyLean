name: Publish core business links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-core-business-links.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert core business preview buttons to dedicated links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('cooperation/index.html')
          text = path.read_text(encoding='utf-8')

          old_rule = '.service-contract button{width:100%;min-height:46px;padding:10px 14px;border:1px solid #0f4b5a;color:#fff;background:#0f4b5a;cursor:pointer;font:inherit;font-weight:900;transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}'
          new_rule = '.service-contract button,.service-contract a.service-contract-link{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;min-height:46px;padding:10px 14px;border:1px solid #0f4b5a;color:#fff;background:#0f4b5a;cursor:pointer;text-decoration:none;font:inherit;font-weight:900;transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}'
          assert old_rule in text
          text = text.replace(old_rule, new_rule)

          old_hover = '.service-contract button:hover,.service-contract button:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,75,90,.18);background:#12606f;outline:none}'
          new_hover = '.service-contract button:hover,.service-contract button:focus-visible,.service-contract a.service-contract-link:hover,.service-contract a.service-contract-link:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,75,90,.18);background:#12606f;outline:none}'
          assert old_hover in text
          text = text.replace(old_hover, new_hover)

          replacements = {
            '<button type="button" data-contract-preview="factory">预览《新工厂规划设计》合同范本</button>': '<a class="service-contract-link" href="/cooperation/factory-planning/">查看独立业务页与合同范本</a>',
            '<button type="button" data-contract-preview="lean">预览《精益改善项目交付》合同范本</button>': '<a class="service-contract-link" href="/cooperation/lean-improvement/">查看独立业务页与合同范本</a>',
            '<button type="button" data-contract-preview="visual">预览《5S与目视化管理咨询》合同范本</button>': '<a class="service-contract-link" href="/cooperation/visual-management/">查看独立业务页与合同范本</a>',
          }
          for old, new in replacements.items():
              assert old in text
              text = text.replace(old, new)

          lean_old = '<div class="service-contract-meta"><strong>匹配合同范本</strong><span>15页高清PDF原版</span></div><a class="service-contract-link" href="/cooperation/lean-improvement/">'
          lean_new = '<div class="service-contract-meta"><strong>匹配合同范本</strong><span>17页高清PDF原版</span></div><a class="service-contract-link" href="/cooperation/lean-improvement/">'
          assert lean_old in text
          text = text.replace(lean_old, lean_new)

          text, count = re.subn(r'\s*<section class="core-contract-viewer" id="coreContractViewer".*?</section>', '', text, count=1, flags=re.S)
          assert count == 1
          text = re.sub(r'\s*<script src="/qilylean/core-business-contracts\.js\?v=[^"]+"></script>', '', text, count=1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit published links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cooperation/index.html
          git rm .github/workflows/publish-core-business-links.yml
          git commit -m 'feat: link three core services to dedicated review pages [skip ci]'
          git push
