name: Apply 0810 function-value brief scope correction

on:
  push:
    paths:
      - 'scripts/patch-daily-20260810-function-boundary.py'
      - '.github/workflows/apply-daily-20260810-function-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct 0810 brief editorial scope
        run: python scripts/patch-daily-20260810-function-boundary.py
      - name: Validate no personal-project or recruitment framing remains
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qilylean/daily/2026-08-10.html').read_text(encoding='utf-8')
          assert '2026-08-10｜岗位价值与职能闭环' in p
          assert '本期边界：' in p
          assert '6. 职能复盘与岗位价值表达，统一用“证据闭环”' in p
          for bad in ['招聘面试','招聘、晋升和述职','300T冲压','14h降至约7h','大型模具换型改善']:
              assert bad not in p, bad
          print('0810 editorial boundary validation passed')
          PY
      - name: Commit corrected brief
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '8月10日简报纠偏：删除个人项目与招聘导向，回归职能价值 [skip ci]'
          git push
