name: Fix contact modal official website label 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-contact-modal-official-website-label-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-contact-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch floating contact modal and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('site-navigation-core.js')
          text = core.read_text(encoding='utf-8')
          old = '<div class="qily-email-list"><div>官网</div><a class="qily-contact-email" href="https://qilylean.com/">https://qilylean.com/</a></div>'
          new = '<div class="qily-email-list"><div>官网网址</div><a class="qily-contact-email" href="https://qilylean.com/">https://qilylean.com/</a></div>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one contact modal website label, found {count}')
          core.write_text(text.replace(old, new), encoding='utf-8')

          legacy = Path('site-navigation-legacy-20260802.js')
          text = legacy.read_text(encoding='utf-8')
          old = "var CORE_SRC = '/site-navigation-core.js?v=20260807-sitewide-closure-v4';"
          new = "var CORE_SRC = '/site-navigation-core.js?v=20260807-contact-label-v5';"
          if old not in text:
              raise SystemExit('Legacy core cache version marker not found')
          legacy.write_text(text.replace(old, new, 1), encoding='utf-8')

          wrapper = Path('site-navigation.js')
          text = wrapper.read_text(encoding='utf-8')
          old = "legacy.src = '/site-navigation-legacy-20260802.js?v=20260807-sitewide-closure-v4';"
          new = "legacy.src = '/site-navigation-legacy-20260802.js?v=20260807-contact-label-v5';"
          if old not in text:
              raise SystemExit('Navigation wrapper legacy cache version marker not found')
          wrapper.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate contact modal standard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<div class="qily-email-list"><div>官网网址</div>' site-navigation-core.js
          ! grep -q '<div class="qily-email-list"><div>官网</div>' site-navigation-core.js
          grep -q 'site-navigation-core.js?v=20260807-contact-label-v5' site-navigation-legacy-20260802.js
          grep -q 'site-navigation-legacy-20260802.js?v=20260807-contact-label-v5' site-navigation.js
          grep -q '四类项目合作边界' cooperation/index.html
          grep -q '02｜数字化工厂项目' cooperation/index.html

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm --quiet .github/workflows/fix-contact-modal-official-website-label-20260807.yml
          git add site-navigation-core.js site-navigation-legacy-20260802.js site-navigation.js cooperation/index.html
          git commit -m '全站交互：交流弹窗官网字段统一为官网网址并刷新缓存'
          git pull --rebase origin main
          git push origin HEAD:main
