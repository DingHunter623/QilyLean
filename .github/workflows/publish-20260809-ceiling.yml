name: Publish 2026-08-09 Ceiling brief

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-20260809-ceiling.yml"
      - "scripts/publish-20260809-ceiling.js"
      - "scripts/insert-20260809-scene-diagrams.js"
      - "scripts/build-trust-search-sync.js"
      - "qilylean/daily/2026-08-09.html"
      - "qilylean/assets/daily-2026-08-09.svg"
      - "qilylean/assets/daily-2026-08-09-*.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-20260809-ceiling-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Insert scene diagrams and publish Ceiling brief
        run: |
          node --check scripts/insert-20260809-scene-diagrams.js
          node scripts/insert-20260809-scene-diagrams.js
          node --check scripts/publish-20260809-ceiling.js
          node scripts/publish-20260809-ceiling.js
          QILY_BUILD_DATE=2026-08-09 node scripts/build-site-metadata.js
          node --check scripts/build-trust-search-sync.js
          QILY_BUILD_DATE=2026-08-09 node scripts/build-trust-search-sync.js
          grep -F 'data-brief-date="2026-08-09"' qilylean/daily-insights.html
          grep -F 'data-brief-training-note="2026-08-08"' qilylean/daily-insights.html
          grep -F 'Ceiling｜天花板／上限' qilylean/daily/2026-08-09.html
          grep -F 'daily-2026-08-09-concept-boundary.svg' qilylean/daily/2026-08-09.html
          grep -F 'daily-2026-08-09-capacity-improvement.svg' qilylean/daily/2026-08-09.html
          grep -F 'daily-2026-08-09-career-development.svg' qilylean/daily/2026-08-09.html
          grep -F 'daily-2026-08-09-management-judgement.svg' qilylean/daily/2026-08-09.html
          test -s qilylean/assets/daily-2026-08-09-concept-boundary.svg
          test -s qilylean/assets/daily-2026-08-09-capacity-improvement.svg
          test -s qilylean/assets/daily-2026-08-09-career-development.svg
          test -s qilylean/assets/daily-2026-08-09-management-judgement.svg
          grep -F '<div class="term-code">Ceiling</div>' knowledge/terminology.html
          grep -F '"total": 184' qilylean/site-data.json
          grep -F '"total": 2588' qilylean/site-data.json
          grep -F '"latestDate": "2026-08-09"' qilylean/site-data.json
          grep -F '<strong>184</strong><span>术语及单点课件</span>' trust/index.html
          grep -F '<strong>2588</strong><span>今日简报总数</span>' trust/index.html
          grep -F '<strong>2026-08-09</strong><span>最新简报日期</span>' trust/index.html
          grep -F '<strong>同步版本：</strong>2026-08-09' trust/index.html
          grep -F 'daily/2026-08-09.html' sitemap.xml
          grep -F '下一期 →' qilylean/daily/2026-08-08.html
          git diff --check
      - name: Commit publication outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "2026-08-09 Ceiling brief, trust center and scene diagrams are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            qilylean/daily-insights.html \
            qilylean/daily/index.json \
            qilylean/daily/2026-08-09.html \
            qilylean/daily/2026-08-08.html \
            qilylean/assets/daily-2026-08-09-concept-boundary.svg \
            qilylean/assets/daily-2026-08-09-capacity-improvement.svg \
            qilylean/assets/daily-2026-08-09-career-development.svg \
            qilylean/assets/daily-2026-08-09-management-judgement.svg \
            knowledge/terminology.html \
            knowledge/index.html \
            trust/index.html \
            cooperation/index.html \
            qilylean/site-data.json \
            qilylean/site-search-index.json \
            site-search.js \
            index.html \
            sitemap.xml \
            sitemap-core.xml
          git commit -m "build: sync 2026-08-09 brief trust center and site metadata [skip ci]"
          git push origin HEAD:main
