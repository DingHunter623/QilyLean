name: Fix network dark secondary contrast

on:
  push:
    branches:
      - fix/network-dark-secondary-contrast-20260805

permissions:
  contents: write

concurrency:
  group: fix-network-dark-secondary-contrast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize dark secondary contrast
        run: node scripts/fix-network-dark-secondary-contrast.js

      - name: Validate industry resource network
        run: node scripts/validate-industry-resource-network.js

      - name: Commit materialized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No materialized changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-resource-network-v1.css \
                  index.html \
                  links/index.html \
                  links/onboarding/index.html \
                  links/network/index.html \
                  scripts/materialize-industry-resource-network.js \
                  scripts/validate-industry-resource-network.js
          git commit -m "fix: enforce network dark secondary action contrast"
          git push origin HEAD:${{ github.ref_name }}
