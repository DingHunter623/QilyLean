name: QilyLean sitewide official contact and association closure 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitewide-contact-association-closure-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --quiet Pillow

      - name: Correct one-piece-flow repository paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/sitewide_contact_association_closure_20260807.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("Path('seat-switch-one-piece-flow.html')", "Path('qilylean/reference-one-piece-flow.html')")
          s=s.replace("Path('reference/seat-switch-one-piece-flow')", "Path('qilylean/reference/seat-switch-one-piece-flow')")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply sitewide closure
        run: |
          python scripts/sitewide_contact_association_closure_20260807.py
          python scripts/sitewide_contact_core_patch_20260807.py

      - name: Validate closure
        run: |
          python scripts/audit-official-contact-association.py
          grep -q 'QILY-OFFICIAL-CONTACT-RUNTIME-20260807' site-navigation.js
          grep -q '20260807-official-contact-hover-v3' site-navigation.js
          grep -q 'admin@qilylean.com' app-support/index.html
          grep -q '官网网址：' app-support/index.html
          grep -q '企业邮箱</th><td class="qtc-state-ok">已启用' site-trust-conversion-v2.js
          grep -q '官网网址：https://qilylean.com/' site-navigation-core.js
          grep -q '独立网址：在线阅览' knowledge/terminology.html
          grep -q '官网网址：https://qilylean.com/' qilylean/reference-one-piece-flow.html
          grep -q '企业邮箱：admin@qilylean.com' qilylean/reference-one-piece-flow.html
          test "$(find qilylean/reference/seat-switch-one-piece-flow -name 'page-*.qly' | wc -l)" -eq 14

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f .github/workflows/sitewide-contact-association-closure-20260807.yml
          git add -A
          git commit -m '全站规范：统一官网企业邮箱、Hover对比度、OPL与APP关联逻辑'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
