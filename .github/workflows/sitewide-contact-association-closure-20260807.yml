name: QilyLean sitewide official contact and association closure 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sitewide-contact-association-closure-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --quiet Pillow

      - name: Apply closure
        run: python scripts/sitewide_contact_association_closure_20260807.py

      - name: Validate closure
        run: |
          python scripts/audit-official-contact-association.py
          grep -q 'QILY-OFFICIAL-CONTACT-RUNTIME-20260807' site-navigation.js
          grep -q '20260807-official-contact-hover-v3' site-navigation.js
          grep -q '企业邮箱：admin@qilylean.com' app-support/index.html
          grep -q '企业邮箱</th><td class="qtc-state-ok">已启用' site-trust-conversion-v2.js
          test "$(find reference/seat-switch-one-piece-flow -name 'page-*.qly' | wc -l)" -eq 14

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f .github/workflows/sitewide-contact-association-closure-20260807.yml
          git add -A
          git commit -m '全站规范：统一官网企业邮箱、Hover对比度与APP关联逻辑'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
