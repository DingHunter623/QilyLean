name: QilyLean one-shot homepage static source sync

on:
  push:
    paths:
      - '.github/workflows/qily-static-home-sync-20260809.yml'

permissions:
  contents: write

jobs:
  sync-home-static-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync homepage source with rendered narrative
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              'QilyLean｜启力精益由丁启利发起，形成三类核心项目交付与三项数智化产品与技术能力，合计六类项目合作能力。项目以问题定义、事实基线、方案／原型、Pilot／测试、实绩验证、标准固化和验收闭环推进；具体范围、周期、费用、交付物及验收条件以书面方案与正式合同为准。',
              'QilyLean｜启力精益由丁启利发起，聚焦新工厂／新产线规划、精益改善、目视化三类核心项目交付，并将制造业务逻辑延伸至数字化工厂、APP软件开发、官网建设三项数智化产品与技术能力。项目从问题定义与事实基线出发，以方案／原型、Pilot／测试、实绩验证、标准固化和验收闭环推进。',
              'hero lead'
          )
          text = replace_once(
              text,
              '专业标签已归入<a href="/capabilities/">能力画像</a>，任职年限与岗位历程已归入<a href="/experience/">履历主线</a>，量化成果与证据归入<a href="/projects/">代表项目</a>。',
              '需要快速核验专业匹配度？查看<a href="/capabilities/">能力画像</a>、<a href="/experience/">履历主线</a>与<a href="/projects/">代表项目</a>。',
              'hero evidence navigation'
          )
          text = replace_once(
              text,
              '<h2>六类项目合作能力｜三类核心项目交付 + 三项数智化产品与技术能力</h2>',
              '<h2>六类项目合作能力</h2>',
              'core-services title'
          )
          text = replace_once(
              text,
              '前三类核心项目交付直接解决工厂、产线与现场运营问题；后三项数智化产品与技术能力把制造业务逻辑进一步沉淀为数字化系统、软件工具与专业互联网载体。六类项目合作能力统一遵循问题定义、事实基线、方案／原型、Pilot／测试、实绩验证、标准固化与项目验收。',
              '前三类核心项目交付直接解决工厂、产线与现场运营问题；后三项数智化产品与技术能力把制造业务逻辑沉淀为数字化系统、软件工具与专业互联网载体。六类能力统一遵循问题定义、事实基线、方案／原型、Pilot／测试、实绩验证、标准固化与项目验收。',
              'core-services summary'
          )
          text = replace_once(
              text,
              '全站术语、简报、知识模块和更新时间由统一数据源自动生成，避免不同页面统计口径不一致。',
              '持续更新制造工程、精益改善、质量与数智化工厂知识；可从最新简报、术语词典和知识分享快速进入对应内容。',
              'latest-content summary'
          )
          text = replace_once(
              text,
              '<h2>个人信息与知识资产各归其位</h2>',
              '<h2>继续了解｜能力、履历与知识资产</h2>',
              'further-context title'
          )
          text = replace_once(
              text,
              '保留全部有价值内容，但不再让个人标签、工具和知识数量遮挡客户最关心的服务、交付与验收。',
              '按需求进入能力画像、履历主线、知识分享、QilyLean AI与行走印记，快速查看对应的专业证据与长期积累。',
              'further-context summary'
          )
          text = replace_once(
              text,
              '/site-visual-closure-v1.js?v=20260804-sitewide-clarity-v2',
              '/site-visual-closure-v1.js?v=20260809-density-v3-2',
              'visual-closure cache bust'
          )

          network_start = '<!-- QILY-RESOURCE-NETWORK:HOME:START -->'
          network_end = '<!-- QILY-RESOURCE-NETWORK:HOME:END -->'
          ns = text.find(network_start)
          ne = text.find(network_end)
          if ns < 0 or ne < 0 or ne < ns:
              raise SystemExit('resource network block markers not found')
          ne += len(network_end)
          network_block = text[ns:ne]
          text = text[:ns] + text[ne:]

          latest_anchor = '<!-- SITE-METADATA:HOME-LATEST:END -->'
          if text.count(latest_anchor) != 1:
              raise SystemExit(f'latest anchor: expected exactly 1 match, found {text.count(latest_anchor)}')
          text = text.replace(latest_anchor, latest_anchor + '\n\n' + network_block, 1)

          disclosure_start = '<!-- QILY-CUMULATIVE-CONTRIBUTION-DISCLOSURE:START -->'
          disclosure_end = '<!-- QILY-CUMULATIVE-CONTRIBUTION-DISCLOSURE:END -->'
          ds = text.find(disclosure_start)
          de = text.find(disclosure_end)
          if ds < 0 or de < 0 or de < ds:
              raise SystemExit('cumulative disclosure block markers not found')
          de += len(disclosure_end)
          text = text[:ds] + text[de:]

          path.write_text(text, encoding='utf-8')

      - name: Commit synchronized source
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage source changes required.'
            exit 0
          fi
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'content: sync homepage static source with visual closure'
          git push origin HEAD:main
