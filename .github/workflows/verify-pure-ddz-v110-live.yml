name: Verify Pure DDZ Mobile Landscape Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-v110-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-v110-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
  workflow_dispatch:

jobs:
  verify-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify current same-origin Expert theme runtime
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/ai-expert.js
          node --check tools/pure-ddz/game/js/game.js
          grep -q "difficulty:'expert'" tools/pure-ddz/game/js/game.js
          grep -q 'PublicCardMemory' tools/pure-ddz/game/js/ai-expert.js
          grep -q 'avatar-king.webp' tools/pure-ddz/game/js/card-theme.js
          grep -q 'airplane-joker.png' tools/pure-ddz/game/js/card-theme.js
          grep -q "const chain=\['js/qilylean-theme.js','js/card-theme.js','js/ai-expert.js','js/game.js','js/visual-v120.js'\]" tools/pure-ddz/index.html
          grep -q '20260824-mobile-landscape-card-comfort-v122' tools/pure-ddz/index.html
          grep -q 'name="screen-orientation" content="landscape"' tools/pure-ddz/index.html
          grep -q 'name="x5-orientation" content="landscape"' tools/pure-ddz/index.html
          grep -q 'Android版暂未开放' tools/pure-ddz/index.html
          grep -q "screen.orientation.lock('landscape')" tools/pure-ddz/game/js/visual-v120.js
          grep -q 'font-size:9.5px' tools/pure-ddz/game/css/card-comfort-v122.css
          ! grep -q 'qily-card-corner' tools/pure-ddz/game/css/card-comfort-v122.css
          test -s tools/pure-ddz/game/assets/pure-ddz/avatar-king.webp
          test -s tools/pure-ddz/game/assets/pure-ddz/airplane-joker.png

      - name: Verify deployed QilyLean mobile-landscape release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ok=0
          for i in {1..48}; do
            if curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/?verify=20260824-mobile-landscape-v122' -o /tmp/page.html \
              && grep -q '20260824-mobile-landscape-card-comfort-v122' /tmp/page.html \
              && grep -q 'name="x5-orientation" content="landscape"' /tmp/page.html \
              && grep -q 'Android版暂未开放' /tmp/page.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/card-theme.js?verify=20260824-v122' -o /tmp/card-theme.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/ai-expert.js?verify=20260824-v122' -o /tmp/ai-expert.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/game.js?verify=20260824-v122' -o /tmp/game.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/visual-v120.js?verify=20260824-v122' -o /tmp/visual.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/css/card-comfort-v122.css?verify=20260824-v122' -o /tmp/comfort.css
          node --check /tmp/card-theme.js
          node --check /tmp/ai-expert.js
          node --check /tmp/game.js
          node --check /tmp/visual.js
          grep -q 'PublicCardMemory' /tmp/ai-expert.js
          grep -q "difficulty:'expert'" /tmp/game.js
          grep -q "screen.orientation.lock('landscape')" /tmp/visual.js
          grep -q 'font-size:9.5px' /tmp/comfort.css
          ! grep -q 'qily-card-corner' /tmp/comfort.css
          echo 'PURE_DDZ_MOBILE_LANDSCAPE_COMPATIBILITY_OK'
