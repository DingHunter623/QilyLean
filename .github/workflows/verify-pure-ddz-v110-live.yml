name: Verify Pure DDZ Mobile Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-v110-live.yml'
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'site-dock-share-runtime-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-v110-live.yml'
      - 'tools/pure-ddz/**'
      - 'scripts/materialize-ddz-public-ui-20260824.js'
      - 'site-dock-share-runtime-v1.js'
  workflow_dispatch:

jobs:
  verify-mobile-v158:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify portrait + adaptive landscape under V158
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check tools/pure-ddz/game/js/ios-virtual-landscape-v154.js
          node --check scripts/materialize-ddz-public-ui-20260824.js
          node scripts/materialize-ddz-public-ui-20260824.js
          grep -Fq '__PURE_DDZ_MOBILE_DEVICE__' tools/pure-ddz/index.html
          grep -Fq '__PURE_DDZ_WECHAT_WEBVIEW__' tools/pure-ddz/index.html
          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          ! grep -Fq 'name="screen-orientation"' tools/pure-ddz/index.html
          ! grep -Fq 'name="x5-orientation"' tools/pure-ddz/index.html
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-core="v158"' tools/pure-ddz/index.html
          grep -Fq 'data-qily-ddz-virtual-landscape="v154"' tools/pure-ddz/index.html
          grep -Fq 'window.__PURE_DDZ_STYLE_READY__=Promise.resolve();' tools/pure-ddz/index.html
          ! grep -Fq "loadStyle('css/ddz-core-v155.css')" tools/pure-ddz/index.html
          grep -Fq '@media(max-width:680px)' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'overflow-x:auto!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'overflow-x:clip!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/card-comfort-v122.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'html.ddz-mobile-landscape body.ddz-site-page' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'var(--ddz-mobile-vh,390px)' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'env(safe-area-inset-right)' tools/pure-ddz/game/css/mobile-landscape-v153.css
          grep -Fq 'function syncViewportProfile()' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'screen.orientation?.lock' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'document.documentElement.requestFullscreen' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "version:'1.2.4-mobile-landscape-adaptive'" tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "const VERSION = '1.5.2'" tools/pure-ddz/game/js/game.js
          grep -Fq 'function isExcluded(){return false;}' site-dock-share-runtime-v1.js
          git diff --check
