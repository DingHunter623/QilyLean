name: Verify Pure DDZ Mobile Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-v110-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-v110-live.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
  workflow_dispatch:

jobs:
  verify-mobile-v152:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify portrait-ready integrated runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -Fq '__PURE_DDZ_MOBILE_DEVICE__' tools/pure-ddz/index.html
          grep -Fq '__PURE_DDZ_WECHAT_WEBVIEW__' tools/pure-ddz/index.html
          grep -Fq '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          ! grep -Fq 'name="screen-orientation"' tools/pure-ddz/index.html
          ! grep -Fq 'name="x5-orientation"' tools/pure-ddz/index.html
          grep -Fq '@media(max-width:680px)' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'overflow-x:auto!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'overflow-x:clip!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/card-comfort-v122.css
          grep -Fq "const VERSION = '1.5.2'" tools/pure-ddz/game/js/game.js
          grep -Fq '20260902-ddz-integrated-v152' tools/pure-ddz/index.html
          grep -Fq 'function isExcluded(){return false;}' site-dock-share-runtime-v1.js
