name: Validate sitewide VI unification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site-content-axis-v1.css'
      - 'site-link-standard-v1.css'
      - 'scripts/validate-continuous-underlines-20261024.cjs'
      - 'site-interaction-semantics-v1.css'
      - 'site-visual-readability-v5.css'
      - 'global-knowledge/**'
      - 'cn-site/**'
      - 'scripts/validate-sitewide-vi-unification.js'
      - '.github/workflows/validate-sitewide-vi-unification.yml'
  push:
    branches:
      - main
    paths:
      - 'site-content-axis-v1.css'
      - 'site-link-standard-v1.css'
      - 'scripts/validate-continuous-underlines-20261024.cjs'
      - 'site-interaction-semantics-v1.css'
      - 'site-visual-readability-v5.css'
      - 'global-knowledge/**'
      - 'cn-site/**'
      - 'scripts/validate-sitewide-vi-unification.js'
      - '.github/workflows/validate-sitewide-vi-unification.yml'

permissions:
  contents: read

jobs:
  vi-unification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify continuous underlines for links and inline phone/email/WeChat text
        run: node scripts/validate-continuous-underlines-20261024.cjs
      - name: Materialize the current China public mirror before validation
        run: bash cn-site/scripts/materialize-practice-assets.sh
      - name: Verify international/CN/Global Knowledge VI authority
        run: node scripts/validate-sitewide-vi-unification.js
      - name: Keep public-copy governance intact
        run: node scripts/validate-public-copy-governance.js
      - name: Verify clean patch formatting
        run: git diff --check
