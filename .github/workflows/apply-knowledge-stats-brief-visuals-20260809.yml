name: Apply knowledge stats links and 0810 brief visuals

on:
  push:
    paths:
      - 'scripts/patch-knowledge-stats-brief-visuals-20260809.py'
      - '.github/workflows/apply-knowledge-stats-brief-visuals-20260809.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply clickable statistics and brief scene diagrams
        run: python scripts/patch-knowledge-stats-brief-visuals-20260809.py
      - name: Validate knowledge interaction and brief visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          k=Path('knowledge/index.html').read_text(encoding='utf-8')
          b=Path('qilylean/daily/2026-08-10.html').read_text(encoding='utf-8')
          assert k.count('class="module-card knowledge-stat-card"') == 4
          for href in ['/knowledge/#terminology','/knowledge/terminology.html','/qilylean/daily-insights.html','/knowledge/#tools']:
              assert f'href="{href}"' in k
          assert b.count('class="brief-scene-figure-v1"') == 5
          for i in range(1,6):
              assert f'/qilylean/daily/assets/2026-08-10-0{i}-' in b
          print('validation passed')
          PY
      - name: Commit production changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '知识分享整改：统计卡可跳转并为8月10日简报铺设场景简图 [skip ci]'
          git push
