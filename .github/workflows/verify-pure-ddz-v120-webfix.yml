name: Verify Pure DDZ Webfix

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-v120-webfix.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-v120-webfix.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
      - 'site-dock-share-runtime-v1.js'
  workflow_dispatch:

jobs:
  verify-web-v153:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify lean web runtime graph
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -Fq '20260903-ddz-mobile-landscape-v153' tools/pure-ddz/index.html
          grep -Fq "const chain=['js/card-theme.js','js/ai-expert.js','js/game.js','js/visual-v120.js'];" tools/pure-ddz/index.html
          grep -Fq "loadStyle('css/mobile-landscape-v153.css')" tools/pure-ddz/index.html
          ! grep -Fq 'js/qilylean-theme.js' tools/pure-ddz/index.html
          ! grep -Fq 'js/elder-assist-v140.js' tools/pure-ddz/index.html
          ! grep -Fq 'ddz-site-shell-v140.js' tools/pure-ddz/index.html
          ! grep -Fq "loadStyle('css/ddz-playability-v141.css')" tools/pure-ddz/index.html
          ! grep -Fq '<footer class="site-footer">' tools/pure-ddz/index.html
          ! grep -Fq 'class="ddz-page-note"' tools/pure-ddz/index.html
          grep -Fq '/site-navigation.js?' tools/pure-ddz/index.html
          grep -Fq '/site-dock-share-runtime-v1.js?' tools/pure-ddz/index.html
          grep -Fq -- '--ddz-game-max:var(--qily-content-axis,1560px)' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'overflow-x:clip!important' tools/pure-ddz/game/css/ddz-site-page-v140.css
          grep -Fq 'height:clamp(560px,calc(100vh - 260px),620px)' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/ddz-site-page-v140.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/card-comfort-v122.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/css/mobile-landscape-v153.css
          ! grep -Fq '#floatDock' tools/pure-ddz/game/js/card-theme.js
          grep -Fq 'function syncViewportProfile()' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'window.PureDDZTest.hint()' tools/pure-ddz/game/js/visual-v120.js
