name: Verify Pure DDZ Webfix

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pure-ddz-v120-webfix.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pure-ddz-v120-webfix.yml'
      - 'tools/pure-ddz/**'
      - 'site-ui-consistency-v1.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify web-only refinement contract
        run: |
          set -euo pipefail
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -q '启力精益斗地主' tools/pure-ddz/index.html
          grep -q '>启力提示</button>' tools/pure-ddz/index.html
          ! grep -q '启力托管' tools/pure-ddz/index.html tools/pure-ddz/game/js/visual-v120.js
          ! grep -q "CARD_SITE=" tools/pure-ddz/game/js/card-theme.js
          ! grep -q 'qily-card-site' tools/pure-ddz/game/js/card-theme.js
          grep -q 'v120-scroll-cue' tools/pure-ddz/game/css/visual-v120.css
          grep -q '启力提示功能' tools/pure-ddz/game/js/visual-v120.js
          grep -q 'chooseAiPlay(0)' tools/pure-ddz/game/js/visual-v120.js
          ! grep -q 'play.click()' tools/pure-ddz/game/js/visual-v120.js
          ! grep -q 'chooseAiBid(0)' tools/pure-ddz/game/js/visual-v120.js
          ! grep -q 'releases/download/v1.2.0/Pure-DDZ-Classic-v1.2.0.apk' tools/pure-ddz/index.html site-ui-consistency-v1.js
          grep -q 'Android版暂未开放' tools/pure-ddz/index.html
          grep -q '__PURE_DDZ_MANAGED_LOADER__' tools/pure-ddz/index.html
          grep -q '20260824-mobile-landscape-card-comfort-v122' tools/pure-ddz/index.html
          grep -q "screen.orientation.lock('landscape')" tools/pure-ddz/game/js/visual-v120.js
          git diff --check

      - name: Verify deployed webfix from public Internet
        run: |
          set -euo pipefail
          ok=0
          for i in {1..60}; do
            if curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/?verify=20260824-mobile-landscape-v122' -o /tmp/page.html \
              && grep -q '启力精益斗地主' /tmp/page.html \
              && grep -q '>启力提示</button>' /tmp/page.html \
              && grep -q 'Android版暂未开放' /tmp/page.html \
              && grep -q '20260824-mobile-landscape-card-comfort-v122' /tmp/page.html \
              && ! grep -q 'releases/download/v1.2.0/Pure-DDZ-Classic-v1.2.0.apk' /tmp/page.html; then
              ok=1
              break
            fi
            echo "Waiting for Pure DDZ webfix deployment: $i/60"
            sleep 10
          done
          test "$ok" = 1

          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/card-theme.js?verify=20260824-v122' -o /tmp/card-theme.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/js/visual-v120.js?verify=20260824-v122' -o /tmp/visual.js
          curl -fsSL --max-time 25 'https://qilylean.com/tools/pure-ddz/game/css/visual-v120.css?verify=20260824-v122' -o /tmp/visual.css

          node --check /tmp/card-theme.js
          node --check /tmp/visual.js
          ! grep -q "CARD_SITE=" /tmp/card-theme.js
          ! grep -q 'qily-card-site' /tmp/card-theme.js
          grep -q '启力提示功能' /tmp/visual.js
          grep -q 'chooseAiPlay(0)' /tmp/visual.js
          ! grep -q 'play.click()' /tmp/visual.js
          ! grep -q 'chooseAiBid(0)' /tmp/visual.js
          grep -q 'v120-scroll-cue' /tmp/visual.css
          echo 'PURE_DDZ_WEBFIX_PUBLIC_OK'
