name: Publish bottom-alignment standard

on:
  pull_request:
    branches: [main]
    paths:
      - "site-bottom-alignment-v1.css"
      - "site-visual-closure-v1.js"
      - "scripts/publish-bottom-alignment-standard.js"
      - ".github/workflows/publish-bottom-alignment-standard.yml"
  push:
    branches: [main]
    paths:
      - "site-bottom-alignment-v1.css"
      - "site-visual-closure-v1.js"
      - "scripts/publish-bottom-alignment-standard.js"
      - ".github/workflows/publish-bottom-alignment-standard.yml"
  workflow_run:
    workflows:
      - "Finalize static public pages"
      - "Publish global navigation standards"
      - "Materialize QilyLean visual closure"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-bottom-alignment-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate scripts and bottom-alignment rules
        shell: bash
        run: |
          node --check scripts/publish-bottom-alignment-standard.js
          node --check site-visual-closure-v1.js
          grep -q 'module-card > .module-result' site-bottom-alignment-v1.css
          grep -q 'module-result + .module-actions' site-bottom-alignment-v1.css
          grep -q 'boundary-service-card > .boundary-note' site-bottom-alignment-v1.css
          grep -q 'qilySitewideClarityStyleV3' site-visual-closure-v1.js
          grep -q 'boundary-service-grid>.boundary-service-card>.boundary-note' site-visual-closure-v1.js

      - name: Install current bottom-alignment standard in all public pages
        run: node scripts/publish-bottom-alignment-standard.js

      - name: Verify repeatable publication and complete page coverage
        shell: bash
        run: |
          git diff -- . ':!site-bottom-alignment-v1.css' > /tmp/bottom-alignment-first.diff
          node scripts/publish-bottom-alignment-standard.js
          git diff -- . ':!site-bottom-alignment-v1.css' > /tmp/bottom-alignment-second.diff
          cmp /tmp/bottom-alignment-first.diff /tmp/bottom-alignment-second.diff

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const failures = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              if (['.git','node_modules','.cache'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) {
                const html = fs.readFileSync(full, 'utf8');
                if (!/<\/head>/i.test(html)) return;
                if (!html.includes('site-bottom-alignment-v1.css?v=20260804-bottom-align-v1')) {
                  failures.push(path.relative(process.cwd(), full));
                }
              }
            }
          }
          walk(process.cwd());
          if (failures.length) throw new Error('Pages missing bottom-alignment standard: ' + failures.slice(0,40).join(', '));
          NODE
          git diff --check

      - name: Commit public-page materialization
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All public pages already contain the bottom-alignment standard."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish bottom-aligned labels and boundary notes [skip ci]"
          git pull --rebase origin main
          git push origin main
