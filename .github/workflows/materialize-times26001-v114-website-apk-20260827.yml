name: Materialize Times26001 v1.1.14 website APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-times26001-v114-website-apk-20260827.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current website main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Times26001 v1.1.14 install artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-4280-81f7-a515-8055c527c7d1/raw?se=2026-08-27T08%3A48%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=41cfc3df-4f6a-5d1a-9709-03b550d36990&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T03%3A58%3A46Z&ske=2026-08-28T03%3A58%3A46Z&sks=b&skv=2026-02-06&sig=8Io3KUiEvOLEUI6M57WvEVMJxXR%2BHV1XFU7O8zFCHpI%3D' -o /tmp/times26001-v114-install.zip
          echo 'f3be562816e9a801d6fbd84b6c76a5585c894e1590a0171aec6838d749b3d12f  /tmp/times26001-v114-install.zip' | sha256sum -c -
          unzip -j /tmp/times26001-v114-install.zip 'Times26001_v1.1.14_API36_INSTALL.apk' -d /tmp
          echo '4d92f7e09cef8fe9796a8bd19f3642161e0aeb7c8077a254a4e8f2af8691ca63  /tmp/Times26001_v1.1.14_API36_INSTALL.apk' | sha256sum -c -

      - name: Publish canonical website APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/Times26001_v1.1.14_API36_INSTALL.apk Times26001-Android-v1.1.14-Standard-Website-Logo.apk
          printf '%s  %s\n' '4d92f7e09cef8fe9796a8bd19f3642161e0aeb7c8077a254a4e8f2af8691ca63' 'Times26001-Android-v1.1.14-Standard-Website-Logo.apk' > Times26001-Android-v1.1.14-Standard-Website-Logo.sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Times26001-Android-v1.1.14-Standard-Website-Logo.apk Times26001-Android-v1.1.14-Standard-Website-Logo.sha256.txt
          if git diff --cached --quiet; then
            echo 'Website APK already materialized.'
            exit 0
          fi
          git commit -m 'release: publish Times26001 v1.1.14 website APK [generated]'
          git push origin HEAD:main
