name: Fix navigation maintenance test source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-navigation-test-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point maintenance test to navigation source of truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-maintenance-fixes.js')
          text = path.read_text(encoding='utf-8')
          old = "const navigation = read('site-navigation.js');"
          new = "const navigation = read('site-navigation-core.js');"
          if old not in text:
              raise SystemExit('Expected stale navigation test source was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q "const navigation = read('site-navigation-core.js');" scripts/test-maintenance-fixes.js

      - name: Run maintenance validation
        run: |
          npm install
          npm run test:maintenance

      - name: Commit corrected test only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add scripts/test-maintenance-fixes.js
          git commit -m '修复：维护测试读取实际导航权限源文件'
          git push origin HEAD:main
