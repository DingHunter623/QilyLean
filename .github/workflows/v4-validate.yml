name: QilyLean V4 Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'scripts/**'
      - 'data/**'
      - 'meta/**'
      - 'AI-Knowledge/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qily-v4-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check V4 governance tools
        run: |
          node --check scripts/site-system-v4-validate.js
          node --check scripts/site-system-v4-repository-audit.js
          node --check scripts/site-system-v4-workflow-audit.js
          node --check scripts/site-system-v4-sitemap-lastmod.js
          node --check scripts/site-system-v4-build-meta.js
          node --check scripts/site-system-v4-public-verify.js
          node --check scripts/build-trust-search-sync.js
          node --check scripts/sync-search-brief-metadata.js
          node --check scripts/qilylean-north-v4-sitemap-contract.js
          node --check scripts/audit-knowledge-asset-v2.js
          node --check scripts/enforce-aircraft-home-hero.js
          node --check knowledge/knowledge-asset-v2.js
          node --check knowledge/knowledge-asset-v2-opl-header.js
          node --check homepage-music.js

      - name: Verify SSOT search-index materialization
        run: node scripts/build-trust-search-sync.js --search-only --check

      - name: G1 source and SSOT validation
        run: node scripts/site-system-v4-validate.js

      - name: Knowledge Asset 2.0 content, case, linkage and VI gate
        run: node scripts/audit-knowledge-asset-v2.js

      - name: Existing SEO gate
        run: npm run test:seo

      - name: Materialize generated UI references in the validation worktree
        run: |
          # Validation must inspect the same generated homepage shell that V4 Build will publish.
          # Otherwise a source-level cache-version change can be misreported as a visual regression
          # before the build materializer has had a chance to update index.html.
          node scripts/enforce-aircraft-home-hero.js
          node scripts/materialize-global-language-v3.js
          node scripts/materialize-contact-route-v6.js
          node scripts/materialize-global-language-v3.js --check
          node scripts/materialize-contact-route-v6.js --check

      - name: Existing R6 visual and interaction gate
        run: npm run test:visual

      - name: Audit active workflow migration surface
        run: node scripts/site-system-v4-workflow-audit.js

      - name: Validate lightweight PR audit evidence
        run: |
          test -s maintenance/site-system-v4-workflow-audit.json
          git diff --check

      - name: Upload V4 PR audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qily-v4-pr-audit-evidence
          path: maintenance/site-system-v4-workflow-audit.json
          if-no-files-found: warn
          retention-days: 14
