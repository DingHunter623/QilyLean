name: Publish inline final contact V12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-contact-v12-inline-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contact-v12-inline-final-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply final V12 directly to current main
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          prompt='微信号Qily259已复制，是否开启微信主程序'
          skip_dirs={'.git','.github','node_modules','docs','build','.gradle'}
          exts={'.html','.js','.css','.json','.md','.py','.txt','.xml','.kt','.kts','.java'}
          skip_names={'apply-contact-v12-final.js','unify-wechat-official-url-contact-v12.js','preflight-contact-v12-cooperation.js'}
          def files():
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in exts or p.name in skip_names: continue
                  if any(part in skip_dirs for part in p.parts): continue
                  yield p
          changed=0
          for p in files():
              try: old=p.read_text('utf-8')
              except Exception: continue
              new=old.replace('官网网址','官方网址').replace('微信号','微信')
              new=new.replace('site-shell.css?v=20260812-r2-stability-v1','site-shell.css?v=20260814-contact-v12')
              if new!=old:
                  p.write_text(new,'utf-8'); changed+=1

          # Global contact modal/runtime.
          p=Path('site-navigation-core.js'); t=p.read_text('utf-8')
          t=t.replace("var SHARED_ASSET_VERSION = '20260812-r2-stability-v1';","var SHARED_ASSET_VERSION = '20260814-contact-v12';")
          newrow='<div class=\\"qily-wechat-row\\"><button class=\\"qily-wechat-action\\" type=\\"button\\" data-qily-wechat-copy=\\"Qily259\\" aria-label=\\"复制微信 Qily259\\"><span>微信</span><strong>Qily259</strong></button></div>'
          t,n=re.subn(r'<p class=\\"qily-wechat\\">.*?</p><button class=\\"qily-copy-wechat\\" type=\\"button\\">.*?</button>',newrow,t,count=1,flags=re.S)
          t=re.sub(r"\s*contactMask\.querySelector\('\.qily-copy-wechat'\)\.addEventListener\('click', function \(\) \{.*?\n\s*\}\);\n",'\n',t,count=1,flags=re.S)
          marker='/* QILY-WECHAT-COPY-PROMPT-V12 */'
          if marker not in t:
              helper='''\n  /* QILY-WECHAT-COPY-PROMPT-V12 */\n  function ensureWechatCopyPrompt(){\n    var p=document.getElementById('qilyWechatCopyPrompt');if(p)return p;\n    p=document.createElement('div');p.id='qilyWechatCopyPrompt';p.className='qily-wechat-copy-prompt';p.setAttribute('role','status');p.setAttribute('aria-live','polite');\n    p.innerHTML='<span>微信号Qily259已复制，是否开启微信主程序</span><button type="button" data-qily-open-wechat>开启微信</button>';document.body.appendChild(p);\n    p.querySelector('[data-qily-open-wechat]').addEventListener('click',function(){p.classList.remove('show');try{window.location.href='weixin://';}catch(e){}setTimeout(function(){if(document.visibilityState==='visible')showToast('如未自动打开微信，请手动打开微信并粘贴Qily259');},1400);});\n    return p;\n  }\n  function positionWechatCopyPrompt(a,p){var r=a&&a.getBoundingClientRect?a.getBoundingClientRect():{right:innerWidth/2,left:innerWidth/2,top:innerHeight/2};p.style.left='12px';p.style.top='12px';requestAnimationFrame(function(){var b=p.getBoundingClientRect(),x=r.right+10;if(x+b.width>innerWidth-12)x=Math.max(12,r.left-b.width-10);var y=Math.max(12,Math.min(r.top,innerHeight-b.height-12));p.style.left=Math.round(x)+'px';p.style.top=Math.round(y)+'px';});}\n  function copyWechatAndPrompt(a){return copyText('Qily259').then(function(){var p=ensureWechatCopyPrompt();p.querySelector('span').textContent='微信号Qily259已复制，是否开启微信主程序';positionWechatCopyPrompt(a,p);p.classList.add('show');clearTimeout(copyWechatAndPrompt.timer);copyWechatAndPrompt.timer=setTimeout(function(){p.classList.remove('show');},9000);});}\n  window.__qilyCopyWechatAndPrompt=copyWechatAndPrompt;\n  document.addEventListener('click',function(e){var x=e.target.closest&&e.target.closest('[data-qily-wechat-copy]');if(!x)return;e.preventDefault();copyWechatAndPrompt(x);});\n\n'''
              assert '  function shareUrl(' in t
              t=t.replace('  function shareUrl(',helper+'  function shareUrl(',1)
          assert 'data-qily-wechat-copy=\\"Qily259\\"' in t, 'global WeChat module not materialized'
          assert 'qily-copy-wechat' not in t, 'old global copy row remains'
          p.write_text(t,'utf-8')

          # Shared contact visual layer; one row removed so typography can grow.
          p=Path('site-shell.css'); t=p.read_text('utf-8')
          start='/* QILY-CONTACT-INTERACTION-V12:START */'; end='/* QILY-CONTACT-INTERACTION-V12:END */'
          block='''/* QILY-CONTACT-INTERACTION-V12:START */
          .qily-contact-panel{width:min(94vw,520px)!important;padding:22px 25px 24px!important}
          .qily-contact-panel h3{margin:5px 0 8px!important;font-size:27px!important;line-height:1.15!important}
          .qily-contact-panel .qily-contact-qr{width:min(54vw,220px)!important;max-width:220px!important;margin:7px auto 9px!important}
          .qily-wechat-row{display:flex!important;justify-content:center!important;margin:7px 0 11px!important}
          .qily-wechat-action{display:flex!important;width:min(100%,390px)!important;min-height:48px!important;align-items:center!important;justify-content:center!important;gap:12px!important;padding:9px 14px!important;border:1px solid #b8d9d4!important;border-radius:11px!important;color:#0f4b5a!important;-webkit-text-fill-color:#0f4b5a!important;background:#f6fbfa!important;cursor:pointer!important;font:inherit!important;font-size:18px!important;font-weight:850!important;box-shadow:none!important}
          .qily-wechat-action strong{color:#073c47!important;-webkit-text-fill-color:#073c47!important;font-size:22px!important;font-weight:950!important;text-decoration:underline!important;text-decoration-thickness:2px!important;text-underline-offset:4px!important;text-decoration-skip-ink:none!important}
          .qily-wechat-action:hover,.qily-wechat-action:focus-visible{border-color:#caa15f!important;background:#fff8e8!important;outline:3px solid rgba(202,161,95,.2)!important;outline-offset:2px!important}
          .qily-contact-panel .qily-phone-list{gap:9px!important;margin:13px 0 2px!important;padding-top:13px!important}
          .qily-contact-panel .qily-phone-list>div,.qily-contact-panel .qily-email-list>div{font-size:17px!important;font-weight:900!important;line-height:1.35!important}
          .qily-contact-panel .qily-phone-list a{min-height:48px!important;padding:9px 13px!important;font-size:19px!important;line-height:1.3!important}
          .qily-contact-panel .qily-phone-city{font-size:17px!important}.qily-contact-panel .qily-phone-number{font-size:21px!important}
          .qily-contact-panel .qily-email-list{padding-top:13px!important;margin-top:13px!important}.qily-contact-panel .qily-contact-email{font-size:19px!important;line-height:1.35!important}
          .qily-contact-panel .qily-email-actions{margin-top:9px!important}.qily-contact-panel .qily-email-actions button,.qily-contact-panel .qily-email-actions a{min-height:44px!important;font-size:17px!important}
          .qily-wechat-copy-prompt{position:fixed;z-index:12050;display:flex;max-width:min(430px,calc(100vw - 24px));align-items:center;gap:9px;padding:10px 12px;border:1px solid #caa15f;border-radius:12px;color:#17322d;background:#fff8e8;box-shadow:0 14px 34px rgba(7,60,71,.22);font-size:14px;font-weight:850;line-height:1.45;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease,visibility .16s ease}
          .qily-wechat-copy-prompt.show{opacity:1;visibility:visible;transform:translateY(0)}.qily-wechat-copy-prompt button{flex:0 0 auto;min-height:36px;padding:6px 10px;border:0;border-radius:8px;color:#fff;background:#0f4b5a;cursor:pointer;font:inherit;font-weight:900}
          @media(max-width:620px){.qily-contact-panel{width:min(96vw,460px)!important;padding:20px 18px!important}.qily-contact-panel h3{font-size:25px!important}.qily-contact-panel .qily-contact-qr{width:min(58vw,210px)!important}.qily-wechat-action{font-size:17px!important}.qily-wechat-action strong{font-size:20px!important}.qily-wechat-copy-prompt{left:12px!important;right:12px!important;top:auto!important;bottom:18px!important;max-width:none!important;justify-content:space-between}}
          /* QILY-CONTACT-INTERACTION-V12:END */'''
          if start in t and end in t:
              t=re.sub(re.escape(start)+r'.*?'+re.escape(end),block,t,count=1,flags=re.S)
          else:t+='\n\n'+block+'\n'
          p.write_text(t,'utf-8')

          # Project cooperation: entire row is the WeChat button frame.
          p=Path('cooperation/index.html'); t=p.read_text('utf-8')
          btn='<button type="button" id="copyWechat" class="wechat-contact-action" data-qily-wechat-copy="Qily259" aria-label="复制微信 Qily259"><span>微信：</span><strong>Qily259</strong></button>'
          t,n=re.subn(r'<button type="button" id="copyWechat"[^>]*>.*?Qily259</button>',btn,t,count=1,flags=re.S)
          assert n==1 or 'wechat-contact-action' in t, 'cooperation WeChat button not found'
          t=re.sub(r"\s*wechatButton\.addEventListener\('click',function\(\)\{.*?\}\);",'',t,count=1,flags=re.S)
          assert 'wechat-contact-action' in t
          p.write_text(t,'utf-8')

          # OPL/terminology: label “微信”; value triggers shared copy/open prompt.
          p=Path('knowledge/terminology.html'); t=p.read_text('utf-8')
          if 'data-opl-copy-wechat="Qily259"' in t and 'data-qily-wechat-copy="Qily259"' not in t:
              t=t.replace('data-opl-copy-wechat="Qily259"','data-opl-copy-wechat="Qily259" data-qily-wechat-copy="Qily259"',1)
          repl="""  if(wechatCopy){
            event.preventDefault();event.stopPropagation();
            if(window.__qilyCopyWechatAndPrompt)window.__qilyCopyWechatAndPrompt(wechatCopy);
            else copyText(wechatCopy.getAttribute('data-opl-copy-wechat')||wechatCopy.textContent||'Qily259').then(function(){toast('微信号Qily259已复制，是否开启微信主程序');}).catch(function(){toast('复制失败，请手动复制微信');});
            return;
          }
          if(event.target.closest('[data-opl-link]'))"""
          t,n=re.subn(r"  if\(wechatCopy\)\{.*?  if\(event\.target\.closest\('\[data-opl-link\]'\)\)",repl,t,count=1,flags=re.S)
          assert '微信：<a href="#copy-wechat"' in t
          assert 'data-qily-wechat-copy="Qily259"' in t
          p.write_text(t,'utf-8')

          # Legacy contact panel follows the same policy if it appears.
          p=Path('qilylean/contact-wechat-open.js')
          if p.exists():
              t=p.read_text('utf-8')
              t=t.replace("oldCopy.textContent='复制微信并打开微信';","oldCopy.textContent='微信：Qily259';").replace("oldCopy.textContent='复制微信打开微信';","oldCopy.textContent='微信：Qily259';")
              t=re.sub(r"      oldCopy\.onclick=function\(e\)\{.*?\n      \};","      oldCopy.onclick=function(e){e.preventDefault();e.stopPropagation();if(window.__qilyCopyWechatAndPrompt){window.__qilyCopyWechatAndPrompt(oldCopy);return;}copyText(WECHAT_ID).then(function(){var toast=document.getElementById('floatToast');if(toast){toast.textContent='微信号Qily259已复制，是否开启微信主程序';toast.classList.add('show');setTimeout(function(){toast.classList.remove('show');},3000);}});\n      };",t,count=1,flags=re.S)
              p.write_text(t,'utf-8')

          # Product-level exact QA. Required prompt is the only permitted “微信号”.
          for f in ['site-navigation-core.js','cooperation/index.html','knowledge/terminology.html']:
              t=Path(f).read_text('utf-8'); c=t.replace(prompt,'')
              assert '官网网址' not in c, f+' still has 官网网址'
              assert '微信号' not in c, f+' still has 微信号'
          assert 'QILY-CONTACT-INTERACTION-V12:START' in Path('site-shell.css').read_text('utf-8')
          print('Inline V12 PASS, generic sources changed:',changed)
          PY
          node --check site-navigation-core.js
          node --check qilylean/contact-wechat-open.js
          git diff --check
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add -A ':!.github'
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix: finalize full-row 微信 and 官方网址 UX [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
