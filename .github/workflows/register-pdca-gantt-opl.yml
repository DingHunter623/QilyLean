name: Register PDCA Gantt OPL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-pdca-gantt-opl.yml'
      - 'scripts/register-pdca-gantt-opl.js'
      - 'knowledge/pdca-gantt-milestone-opl.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-pdca-gantt-opl-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register OPL catalog entry
        run: node scripts/register-pdca-gantt-opl.js
      - name: Validate entry and lesson page
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('knowledge/index.html','utf8');
          const lesson=fs.readFileSync('knowledge/pdca-gantt-milestone-opl.html','utf8');
          for(const token of ['QILY-PDCA-GANTT-OPL:START','PDCA项目管理 × 甘特图里程碑推进','/knowledge/pdca-gantt-milestone-opl.html']){
            if(!index.includes(token))throw new Error('Missing index token: '+token);
          }
          for(const token of ['PDCA项目管理 × 甘特图里程碑推进','甘特图：把WBS任务放到时间轴上','OPL落地模板：一页带走']){
            if(!lesson.includes(token))throw new Error('Missing lesson token: '+token);
          }
          console.log('PDCA Gantt OPL QA passed.');
          NODE
      - name: Commit catalog entry and remove one-shot helpers
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git rm -f scripts/register-pdca-gantt-opl.js .github/workflows/register-pdca-gantt-opl.yml
          git add knowledge/index.html
          git commit -m 'feat: list PDCA Gantt OPL under terminology training [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
