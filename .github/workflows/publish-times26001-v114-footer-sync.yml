name: Synchronize Times26001 v1.1.4 website references

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-times26001-v114-footer-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-times26001-v114-site-references
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: DingHunter623/QilyLean
      OLD_CACHE: 81c7653c
      NEW_CACHE: af47a9ec
      OLD_SHA: 81c7653c28e5c46421925751342032597fcfd4dbbd7833d76a36e516c0724c9b
      NEW_SHA: af47a9ec817a1e08a40ae26ee6a1a8943ad5ee36458e611a56b869c13846247a
    steps:
      - name: Fetch and update all corresponding website references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/times-sync
          for path in times26001-home-card.js capabilities/index.html app-release-sha256.txt; do
            out="/tmp/times-sync/${path//\//__}"
            gh api "repos/$REPO/contents/$path?ref=main" --jq '.content' \
              | tr -d '\n' | base64 -d > "$out"
          done
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/times-sync')
          replacements = {
              'times26001-home-card.js': ('81c7653c', 'af47a9ec'),
              'capabilities__index.html': ('81c7653c', 'af47a9ec'),
              'app-release-sha256.txt': (
                  '81c7653c28e5c46421925751342032597fcfd4dbbd7833d76a36e516c0724c9b',
                  'af47a9ec817a1e08a40ae26ee6a1a8943ad5ee36458e611a56b869c13846247a',
              ),
          }
          for name, (old, new) in replacements.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected old reference not found in {name}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          ! grep -RFq "$OLD_CACHE" /tmp/times-sync/times26001-home-card.js
          ! grep -RFq "$OLD_CACHE" /tmp/times-sync/capabilities__index.html
          ! grep -RFq "$OLD_SHA" /tmp/times-sync/app-release-sha256.txt
          grep -Fq "$NEW_CACHE" /tmp/times-sync/times26001-home-card.js
          grep -Fq "$NEW_CACHE" /tmp/times-sync/capabilities__index.html
          grep -Fq "$NEW_SHA" /tmp/times-sync/app-release-sha256.txt

      - name: Commit synchronized references through Git data API
        shell: bash
        run: |
          set -euo pipefail
          create_blob() {
            python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$1" \
              | gh api --method POST "repos/$REPO/git/blobs" --input - --jq '.sha'
          }
          home_blob=$(create_blob /tmp/times-sync/times26001-home-card.js)
          capabilities_blob=$(create_blob /tmp/times-sync/capabilities__index.html)
          checksum_blob=$(create_blob /tmp/times-sync/app-release-sha256.txt)

          published=''
          for attempt in 1 2 3; do
            parent=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
            base_tree=$(gh api "repos/$REPO/git/commits/$parent" --jq '.tree.sha')
            tree=$(jq -n \
              --arg base_tree "$base_tree" \
              --arg home_blob "$home_blob" \
              --arg capabilities_blob "$capabilities_blob" \
              --arg checksum_blob "$checksum_blob" \
              '{base_tree:$base_tree,tree:[
                {path:"times26001-home-card.js",mode:"100644",type:"blob",sha:$home_blob},
                {path:"capabilities/index.html",mode:"100644",type:"blob",sha:$capabilities_blob},
                {path:"app-release-sha256.txt",mode:"100644",type:"blob",sha:$checksum_blob}
              ]}' \
              | gh api --method POST "repos/$REPO/git/trees" --input - --jq '.sha')
            commit=$(jq -n \
              --arg message 'fix: synchronize Times26001 v1.1.4 website references [skip ci]' \
              --arg tree "$tree" --arg parent "$parent" \
              '{message:$message,tree:$tree,parents:[$parent]}' \
              | gh api --method POST "repos/$REPO/git/commits" --input - --jq '.sha')
            if jq -n --arg sha "$commit" '{sha:$sha,force:false}' \
              | gh api --method PATCH "repos/$REPO/git/refs/heads/main" --input - >/dev/null 2>&1; then
              published="$commit"
              break
            fi
            sleep 2
          done
          test -n "$published"
          echo "Published commit: $published"
