name: Protect client and owner identity wording

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  protect-copy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'Protect QilyLean client and owner identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply client and enterprise-owner confidentiality wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('projects/lean-improvement-evidence/index.html'): (
                  '<strong>正式洽谈核验：</strong>公开网页仅展示脱敏资料。进入正式洽谈并确认合作意向后，可在签署保密约定或现场会议条件下，通过投屏方式展示与客户需求相匹配的更完整案例资料，包括改善前后基线、实施过程、阶段评审、结案绩效、财务确认口径及相关验收记录；投屏资料仅用于能力核验，不作未授权复制或公开传播。',
                  '<strong>客户及企业主保密说明：</strong>制造业咨询与改善项目通常涉及客户工艺、产能、成本、设备、布局、经营数据及管理人员信息。基于客户保密要求和职业操守，本站不公开客户企业名称、Logo、企业主及相关人员身份，也不展示可反向识别企业的信息。公开案例统一以行业、规模、项目场景、改善方法、量化结果和脱敏证据呈现。<br><strong>正式洽谈核验：</strong>进入正式洽谈并确认合作意向后，可在签署保密约定或现场会议条件下，通过投屏方式展示与客户需求相匹配的更完整案例资料，包括改善前后基线、实施过程、阶段评审、结案绩效、财务确认口径及相关验收记录；投屏资料仅用于能力核验，不作未授权复制、拍摄或公开传播。'
              ),
              Path('capabilities/index.html'): (
                  '<strong>案例核验方式：</strong>公开端展示脱敏佐证；正式洽谈阶段可依据企业需求，在保密约定下投屏分享匹配案例、改善前后数据、结案绩效及验收材料。涉及客户名称、合同、成本、工艺及内部经营数据的内容，仅限现场核验。',
                  '<strong>客户及企业主保密说明：</strong>本站不公开客户企业名称、Logo、企业主及相关人员身份，也不展示可反向识别企业的信息。公开端统一以行业、规模、项目场景、改善方法、量化结果和脱敏佐证呈现。<br><strong>案例核验方式：</strong>正式洽谈阶段可依据企业需求，在保密约定下投屏分享匹配案例、改善前后数据、结案绩效及验收材料。涉及客户名称、合同、成本、工艺、经营数据及管理人员信息的内容，仅限现场核验，不提供未授权复制、拍摄或外传。'
              ),
              Path('cooperation/index.html'): (
                  '公开网页展示经过脱敏的典型量化成果；进入正式洽谈并确认合作意向后，可在签署NDA或双方约定的保密条件下，通过投屏方式展示与企业问题相匹配的案例资料，包括诊断基线、改善方案、实施过程、结案绩效及验收证明。投屏资料用于项目能力核验，不提供未授权拷贝或外传；正式合作仍须依据企业现状重新建立基线，不照搬既有结论。',
                  '公开网页仅展示经过脱敏的典型量化成果，不公开客户企业名称、Logo、企业主及相关人员身份，也不展示可反向识别企业的信息。进入正式洽谈并确认合作意向后，可在签署NDA或双方约定的保密条件下，通过投屏方式展示与企业问题相匹配的案例资料，包括诊断基线、改善方案、实施过程、结案绩效及验收证明。投屏资料仅用于项目能力核验，不提供未授权复制、拍摄或外传；正式合作仍须依据企业现状重新建立基线，不照搬既有结论。'
              ),
          }

          changed = []
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print(f'{path}: already current')
                  continue
              if old not in text:
                  raise SystemExit(f'{path}: expected source wording not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY

      - name: Commit confidentiality wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add projects/lean-improvement-evidence/index.html capabilities/index.html cooperation/index.html
          if git diff --cached --quiet; then
            echo 'Confidentiality wording is already current.'
            exit 0
          fi
          git commit -m 'content: protect client and owner identity [skip workflow]'
          git push origin HEAD:main
