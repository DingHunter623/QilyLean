name: Normalize evidence viewer links

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  normalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'Normalize QilyLean evidence viewer links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace every legacy evidence preview URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              r'/projects/lean-improvement-evidence/q3-preview\.html(?:\?[^"\'<> ]*)?': '/projects/lean-improvement-evidence/q3-online-view.html',
              r'/projects/lean-improvement-evidence/q4-preview\.html(?:\?[^"\'<> ]*)?': '/projects/lean-improvement-evidence/q4-online-view.html',
              r'/projects/lean-improvement-evidence/award-preview\.html(?:\?[^"\'<> ]*)?': '/projects/lean-improvement-evidence/award-online-view.html',
          }
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern, replacement in replacements.items():
                  updated = re.sub(pattern, replacement, updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
      - name: Commit normalized links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'All evidence links are already normalized.'
            exit 0
          fi
          git commit -m 'fix: normalize all evidence viewer links [skip workflow]'
          git push origin HEAD:main
