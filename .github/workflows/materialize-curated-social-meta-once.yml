name: Materialize curated social metadata once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-curated-social-meta-once.yml'
      - 'scripts/sync-curated-site-metadata.js'
      - 'knowledge/index.html'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'build/materialize-curated-social-meta-20260825'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate curated publication output from SSOT
        run: |
          node --check scripts/publish-curated-daily.js
          node --check scripts/sync-curated-site-metadata.js
          node scripts/publish-curated-daily.js
          git diff --check
      - name: Commit only generated knowledge metadata output
        shell: bash
        run: |
          if git diff --quiet -- knowledge/index.html; then
            echo 'Knowledge social metadata already materialized.'
            exit 0
          fi
          git config user.name 'QilyLean Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- knowledge/index.html
          git commit -m 'build: materialize 2026-08-25 curated social metadata'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
