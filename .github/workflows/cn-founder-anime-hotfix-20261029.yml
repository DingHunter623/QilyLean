name: One-time CN founder anime image correction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cn-founder-anime-hotfix-20261029.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qilylean-cn-owner-anime-hotfix
  cancel-in-progress: false
jobs:
  fix-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved source artwork
        run: |
          set -euo pipefail
          test -s qilylean/ding-qili-anime-20261028.webp
          file qilylean/ding-qili-anime-20261028.webp
          sha256sum qilylean/ding-qili-anime-20261028.webp
      - name: Configure China production SSH
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_SSH_KEY: ${{ secrets.CN_PREPROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_PREPROD_HOST"
          test -n "$CN_PREPROD_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CN_PREPROD_SSH_KEY" > ~/.ssh/qilylean_cn
          chmod 600 ~/.ssh/qilylean_cn
          ssh-keyscan -H "$CN_PREPROD_HOST" >> ~/.ssh/known_hosts
      - name: Apply reversible image-only fix to current release
        timeout-minutes: 8
        env:
          CN_PREPROD_HOST: ${{ secrets.CN_PREPROD_HOST }}
          CN_PREPROD_USER: ${{ secrets.CN_PREPROD_USER }}
        run: |
          set -euo pipefail
          USER_NAME="${CN_PREPROD_USER:-ubuntu}"
          OPTS=(-o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o BatchMode=yes -i ~/.ssh/qilylean_cn)
          scp -q "${OPTS[@]}" qilylean/ding-qili-anime-20261028.webp "$USER_NAME@$CN_PREPROD_HOST:/tmp/qily-cn-founder-anime-approved-20261029.webp"
          ssh "${OPTS[@]}" "$USER_NAME@$CN_PREPROD_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          SITE=/var/www/qilylean-cn
          exec 9>"$SITE/.content-deploy.lock"
          flock -w 90 9
          CURRENT="$(readlink -f "$SITE/current")"
          case "$CURRENT" in "$SITE"/releases/*) ;; *) echo "Unexpected site root"; exit 1;; esac
          test -s "$CURRENT/index.html"
          test -s /tmp/qily-cn-founder-anime-approved-20261029.webp
          IMAGE="$CURRENT/assets/public-media/qilylean/ding-qili-anime-20261028.webp"
          mkdir -p "$CURRENT/assets/public-media/qilylean"
          install -m 644 /tmp/qily-cn-founder-anime-approved-20261029.webp "$IMAGE.tmp"
          mv -f "$IMAGE.tmp" "$IMAGE"
          BACKUP="/tmp/qily-cn-founder-anime-index-before-${GITHUB_RUN_ID:-manual}.html"
          cp -p "$CURRENT/index.html" "$BACKUP"
          export QILY_CN_CURRENT="$CURRENT"
          python3 - <<'PY'
          from pathlib import Path
          import os,re,stat
          current=Path(os.environ["QILY_CN_CURRENT"])
          path=current/"index.html"
          text=path.read_text(encoding="utf-8")
          url="/assets/public-media/qilylean/ding-qili-anime-20261028.webp?v=20261029-approved-v2"
          pattern=re.compile(r'(<figure\s+class="qily-home-collaboration__portrait"\s*>\s*<img\s+src=")[^"]*ding-qili-ai-avatar-560\.webp[^"]*(")', re.I)
          changed,n=pattern.subn(lambda m:m.group(1)+url+m.group(2),text)
          if n==0:
              if "qily-home-collaboration__portrait" not in text or "ding-qili-anime-20261028.webp" not in text:
                  raise SystemExit("Owner image reference not found; no page changes")
              changed=text
          elif n!=1:
              raise SystemExit("Expected exactly one founder image")
          changed=changed.replace('alt="QilyLean主理人制造工程与精益改善职业形象"', 'alt="QilyLean主理人动漫品牌形象：飞机模型与精益制造"')
          if "ding-qili-anime-20261028.webp" not in changed:
              raise SystemExit("New portrait missing after patch")
          tmp=path.with_name(".index-founder-anime-20261029.tmp")
          tmp.write_text(changed,encoding="utf-8")
          tmp.chmod(stat.S_IMODE(path.stat().st_mode))
          os.replace(tmp,path)
          print("Founder image reference updated in active China release")
          PY
          if ! curl --silent --show-error --fail --connect-timeout 10 --max-time 30 --resolve qilylean.cn:443:127.0.0.1 https://qilylean.cn/ -o /tmp/qily-cn-founder-anime-page-test.html || ! grep -Fq 'ding-qili-anime-20261028.webp' /tmp/qily-cn-founder-anime-page-test.html; then
            cp -p "$BACKUP" "$CURRENT/index.html"
            echo "Public homepage verification failed; original page restored"
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --resolve qilylean.cn:443:127.0.0.1 https://qilylean.cn/assets/public-media/qilylean/ding-qili-anime-20261028.webp -o /tmp/qily-cn-founder-anime-public-verify.webp
          cmp /tmp/qily-cn-founder-anime-public-verify.webp "$IMAGE"
          echo "CN FOUNDER ANIME PATCH AND REAL LOCAL ORIGIN VERIFICATION: PASS"
          REMOTE
