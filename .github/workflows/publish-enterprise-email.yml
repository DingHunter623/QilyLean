name: Publish enterprise email sitewide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-enterprise-email.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace public contact email in tracked text files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old = b'396767769@qq.com'
          new = b'admin@qilylean.com'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          changed = []
          total = 0
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8', errors='surrogateescape'))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b'\0' in data or old not in data:
                  continue
              count = data.count(old)
              path.write_bytes(data.replace(old, new))
              changed.append((str(path), count))
              total += count
          if not changed:
              raise SystemExit('No public email occurrences were found; refusing an empty publish.')
          print(f'Replaced {total} occurrence(s) across {len(changed)} file(s):')
          for path, count in changed:
              print(f'  {count:>2}  {path}')
          PY

      - name: Validate sitewide consistency
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -F '396767769@qq.com' -- .; then
            echo 'Old public email remains in tracked text files.'
            exit 1
          fi
          count=$(git grep -I -F 'admin@qilylean.com' -- . | wc -l | tr -d ' ')
          test "$count" -gt 0
          echo "Files containing the enterprise email: $count"

          mailto_count=$(git grep -I -F 'mailto:admin@qilylean.com' -- . | wc -l | tr -d ' ')
          test "$mailto_count" -gt 0
          echo "Files containing mailto enterprise links: $mailto_count"

          python3 -m json.tool qilylean/site-data.json >/dev/null
          node --check qilylean/daily-feedback.js
          node --check qily-admin.js
          node --check scripts/build-trust-search-sync.js
          node --check scripts/publish-sponsor-terminology.js
          node --check scripts/build-daily-archive.js
          node --check site-trust-conversion-v2.js
          node --check cloudflare-worker/worker.js

      - name: Show changed files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add -A
          git commit -m '全站统一公开联系邮箱为 admin@qilylean.com'
          git push origin HEAD:main
