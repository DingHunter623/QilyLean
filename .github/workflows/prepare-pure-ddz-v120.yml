name: Prepare Pure DDZ v1.2 Visual Website

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-pure-ddz-v120.yml'
      - 'tools/pure-ddz/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Upgrade direct game shell to v1.2 visual-first UX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/pure-ddz/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('20260823-large-card-v2','20260823-v120-visual')
          s=s.replace("      loadStyle('css/card-size-v2.css');\n",'')
          s=s.replace('>专家 AI 提示</button>','>启力托管：关</button>')
          s=s.replace('>确认出牌</button>','>出牌</button>')
          s=s.replace('选牌后点“确认出牌”；看不准时可使用 AI 提示。','自主判断后点“出牌”；需要休息时可开启“启力托管”。')
          s=s.replace('语音、音乐、AI提示','语音、音乐、启力托管')
          s=s.replace('按需开关，不会强制打扰','启力托管默认关闭，按需开启自动出牌')
          s=s.replace("status.textContent='v1.1.0 专家主题牌桌已加载';","status.textContent='v1.2 可视化牌桌已加载';")
          p.write_text(s,encoding='utf-8')
          PY
          node --check tools/pure-ddz/game/js/card-theme.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          grep -q '20260823-v120-visual' tools/pure-ddz/index.html
          ! grep -q "loadStyle('css/card-size-v2.css')" tools/pure-ddz/index.html
          grep -q '启力托管：关' tools/pure-ddz/index.html
          grep -q '>出牌</button>' tools/pure-ddz/index.html
          grep -q '启力精益 | https://qilylean.com' tools/pure-ddz/game/js/card-theme.js
          grep -q 'VISUAL_HOLD_MS=900' tools/pure-ddz/game/js/visual-v120.js
          grep -q 'flex:0 0 120px' tools/pure-ddz/game/css/visual-v120.css
          git diff --check
      - name: Commit prepared shell
        run: |
          set -euo pipefail
          git config user.name 'QilyLean Release Bot'
          git config user.email 'DingHunter623@gmail.com'
          git add tools/pure-ddz/index.html
          if git diff --cached --quiet; then
            echo 'Website shell already prepared'
          else
            git commit -m 'feat: prepare Pure DDZ v1.2 visual-first shell'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
