name: Upgrade QilyLean CN boss readability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-cn-boss-readability-v1.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce readable typography and full brand naming
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('cn-site/assets/qilylean-vi-v1.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* QILY-CN-BOSS-READABILITY-V2 */'
          if marker not in css:
              css += r'''

/* QILY-CN-BOSS-READABILITY-V2
 * Audience-first visual contract: QilyLean China pages are reviewed frequently by
 * middle-aged and senior manufacturing decision-makers. Readability outranks density.
 * Keep professional hierarchy, but never depend on tiny text to carry information.
 */
html:root body{
  font-size:21px!important;
  line-height:1.78!important;
}
html:root body main :is(.hero .lead,.page-hero p){
  font-size:clamp(21px,1.6vw,23px)!important;
  line-height:1.78!important;
}
html:root body main :is(.section-head p,.portal-card p,.article-link p,.trust-box p,.article-body p,.article-body li,.knowledge-bridge p,.callout,.formula){
  font-size:21px!important;
  line-height:1.8!important;
}
html:root body main :is(.meta,.article-meta,.toc a,.notice,.status,.logic span,.portal-card .meta){
  font-size:19px!important;
  line-height:1.68!important;
}
html:root body main :is(.logic b,.toc b){
  font-size:20px!important;
  line-height:1.5!important;
}
html:root body :is(.breadcrumbs,.tag,.subnav a,figcaption,time,.footer-links a){
  font-size:18px!important;
  line-height:1.6!important;
}
html:root body :is(th,td,label,input,select,textarea,button,option){
  font-size:20px!important;
  line-height:1.55!important;
}
html:root body .footer-inner{
  font-size:19px!important;
  line-height:1.65!important;
}
html:root body main .brand-domain{
  margin:3px 0 10px!important;
  color:var(--qily-cn-forest)!important;
  -webkit-text-fill-color:var(--qily-cn-forest)!important;
  font-size:20px!important;
  line-height:1.45!important;
  font-weight:850!important;
  letter-spacing:.01em!important;
}
@media(max-width:620px){
  html:root body{font-size:20px!important}
  html:root body main :is(.section-head p,.portal-card p,.article-link p,.trust-box p,.article-body p,.article-body li,.knowledge-bridge p,.callout,.formula){font-size:20px!important}
  html:root body main :is(.meta,.article-meta,.toc a,.notice,.status,.logic span,.portal-card .meta,.breadcrumbs,.tag,.subnav a,figcaption,time){font-size:18px!important}
  html:root body .footer-inner{font-size:18px!important}
}
'''
              css_path.write_text(css, encoding='utf-8')

          changed_html = []
          domain_only = re.compile(r'<h3([^>]*)>\s*qilylean\.cn\s*</h3>', re.I)
          for path in sorted(Path('cn-site').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              before = text
              text = text.replace('qilylean-vi-v1.css?v=20260916-cn-vi-v1',
                                  'qilylean-vi-v1.css?v=20260916-cn-vi-v2')
              text = domain_only.sub(r'<h3\1>QilyLean｜启力精益</h3><p class="brand-domain">qilylean.cn</p>', text)
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed_html.append(str(path))

          # Assertions: visible brand headings may not use the bare domain as the brand name.
          offenders = []
          for path in sorted(Path('cn-site').rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              if re.search(r'<h[1-4][^>]*>\s*qilylean\.cn\s*</h[1-4]>', text, re.I):
                  offenders.append(str(path))
              if 'qilylean-vi-v1.css' in text and 'v=20260916-cn-vi-v2' not in text:
                  offenders.append(str(path) + ' [stale VI cache key]')
          if offenders:
              raise SystemExit('CN visual contract failed:\n' + '\n'.join(offenders))

          print(f'Updated {len(changed_html)} China-site HTML files.')
          print('Boss-readable typography floor and full QilyLean｜启力精益 naming enforced.')
          PY

      - name: Verify key visual rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QILY-CN-BOSS-READABILITY-V2' cn-site/assets/qilylean-vi-v1.css
          grep -q 'font-size:21px!important' cn-site/assets/qilylean-vi-v1.css
          grep -q 'font-size:19px!important' cn-site/assets/qilylean-vi-v1.css
          grep -q 'QilyLean｜启力精益</h3><p class="brand-domain">qilylean.cn</p>' cn-site/index.html
          grep -q 'QilyLean｜启力精益</h3><p class="brand-domain">qilylean.cn</p>' cn-site/about/index.html

      - name: Commit China-site readability upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add cn-site
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'style(cn): enlarge minimum typography and unify brand naming'
          git push origin HEAD:main
