name: Apply Pure DDZ V163 Header Timer Visibility

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ddz-v163-header-timer-card-visibility.js'
      - '.github/workflows/apply-ddz-v163-header-timer-card-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pure-ddz-v163-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply and validate V163
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-ddz-v163-header-timer-card-visibility.js
          node scripts/apply-ddz-v163-header-timer-card-visibility.js
          node --check tools/pure-ddz/game/js/game.js
          node --check tools/pure-ddz/game/js/visual-v120.js
          node --check tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'function ensureRoundMetaPlacement(' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "timer.id='v163-turn-timer'" tools/pure-ddz/game/js/visual-v120.js
          grep -Fq 'function updateTurnTimer(state)' tools/pure-ddz/game/js/visual-v120.js
          grep -Fq "$('status').textContent='轮到你出牌';" tools/pure-ddz/game/js/game.js
          grep -Fq 'V163｜Header-aligned round meta + dedicated timer + full selected-card visibility' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '.ddz-page-heading .round-meta' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '.v163-turn-timer.active' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '#hand.hand .card.selected' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'html.ddz-mobile-landscape body.ddz-site-page .ddz-toolbar .top-actions .v163-turn-timer' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq 'html.ddz-ios-virtual-landscape body.ddz-site-page .ddz-toolbar .top-actions .v163-turn-timer' tools/pure-ddz/game/css/visual-tuning-v158.css
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161-v162-v163' tools/pure-ddz/index.html
          grep -Fq '20260903-ddz-fast-knowledge-v155-v158-v159-v160-v161-v162-v163' times26001-home-card.js
          grep -Fq 'function ensureRoundMetaPlacement(' tools/pure-ddz/game/js/ddz-core-v155.js
          grep -Fq 'V163｜Header-aligned round meta + dedicated timer + full selected-card visibility' tools/pure-ddz/game/css/ddz-core-v155.css
          git diff --check
      - name: Commit V163 materialized sources and bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Pure DDZ V163 already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/pure-ddz/game/js/game.js \
            tools/pure-ddz/game/js/visual-v120.js \
            tools/pure-ddz/game/css/visual-tuning-v158.css \
            tools/pure-ddz/game/js/ddz-core-v155.js \
            tools/pure-ddz/game/css/ddz-core-v155.css \
            tools/pure-ddz/index.html \
            scripts/materialize-ddz-public-ui-20260824.js \
            scripts/materialize-pure-ddz-home-entry-v158.js \
            times26001-home-card.js
          git commit -m 'fix(ddz): materialize V163 header timer and full-card visibility [skip ci]'
          git pull --rebase origin main
          git push origin main
