name: Stage Times26001 v1.1.4 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-times-v114.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-1c20-81fa-a42c-b8670034e964/raw?se=2026-08-05T15:34:02Z&sp=r&sv=2026-02-06&sr=b&scid=781b0c90-3119-50cd-95ec-83f0a35cb9d7&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T23:32:38Z&ske=2026-08-05T23:32:38Z&sks=b&skv=2026-02-06&sig=S0641IkB0MGSwHDkVLDRfCYPZOfMzGNxzVF2nKmdOWc%3D'
      APK_NAME: Times26001-Android-v1.1.4-IE-Stopwatch.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and stage APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$ARTIFACT_URL" --output /tmp/times-v114.zip
          rm -rf /tmp/times-v114
          mkdir -p /tmp/times-v114
          unzip -q /tmp/times-v114.zip -d /tmp/times-v114
          cp /tmp/times-v114/app-debug.apk "$APK_NAME"
          test -s "$APK_NAME"
          grep -q 'qily_unified_app_icon' <(unzip -l "$APK_NAME")

      - name: Commit staged APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/stage-times-v114.yml
          git add "$APK_NAME"
          git commit -m 'release: stage Times26001 Android v1.1.4'
          git push origin HEAD:main
