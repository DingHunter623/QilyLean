name: Fix terminology OPL readability and contact V9

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-terminology-opl-readability-contact-v8.js'
      - 'knowledge/terminology-opl-readability-v8.css'
      - 'site-text-contrast-audit-v1.js'
      - '.github/workflows/fix-terminology-opl-readability-contact-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminology-opl-v9-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply OPL V9 structural source patch
        run: node scripts/fix-terminology-opl-readability-contact-v8.js

      - name: Validate final-state wording, copy interaction and contrast ownership
        shell: bash
        run: |
          node --check scripts/fix-terminology-opl-readability-contact-v8.js
          node --check site-text-contrast-audit-v1.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('knowledge/terminology.html','utf8');
          const css=fs.readFileSync('knowledge/terminology-opl-readability-v8.css','utf8');
          const audit=fs.readFileSync('site-text-contrast-audit-v1.js','utf8');
          const required=[
            'terminology-opl-readability-v8.css?v=20260814-opl-readability-contact-v9',
            'term-opl-open-label-v9',
            '官方网址：<a href="https://qilylean.com/">qilylean.com</a>',
            'class="term-opl-copy-wechat-v9" data-opl-copy-wechat="Qily259"',
            "toast('微信号已复制')",
            '扫码访问官方网址',
            '官方网址：https://qilylean.com/'
          ];
          for(const token of required){if(!html.includes(token))throw new Error('Missing OPL V9 HTML token: '+token);}
          if(html.includes('<button type="button" class="term-opl-copy-wechat"'))throw new Error('Button-style WeChat copy control remains');
          if(!css.includes('a.term-opl-open>.term-opl-open-label-v9')||!css.includes('-webkit-text-fill-color:#fff!important'))throw new Error('Structural white CTA label lock missing');
          if(!css.includes('a.term-opl-copy-wechat-v9')||!css.includes('text-decoration-line:underline!important')||!css.includes('background:transparent!important'))throw new Error('WeChat text-link visual contract missing');
          if(!audit.includes("'.term-opl-open', '.term-opl-copy-wechat-v9'"))throw new Error('OPL controls not excluded from auto-contrast');
          if(!audit.includes("node.removeAttribute('data-qily-auto-contrast')"))throw new Error('Excluded-control cleanup missing');
          console.log('OPL V9 exact QA passed: runtime auto-contrast cannot recolor OPL controls.');
          NODE

      - name: Commit production terminology template
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add knowledge/terminology.html
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: harden OPL runtime contrast and WeChat link visual [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
