name: Fix terminology OPL readability and contact V13

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-terminology-opl-readability-contact-v8.js'
      - 'knowledge/terminology-opl-readability-v8.css'
      - 'site-text-contrast-audit-v1.js'
      - '.github/workflows/fix-terminology-opl-readability-contact-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminology-opl-v13-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply OPL V13 structural source patch
        run: node scripts/fix-terminology-opl-readability-contact-v8.js

      - name: Validate final-state wording, print layout and contrast ownership
        shell: bash
        run: |
          node --check scripts/fix-terminology-opl-readability-contact-v8.js
          node --check site-text-contrast-audit-v1.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('knowledge/terminology.html','utf8');
          const css=fs.readFileSync('knowledge/terminology-opl-readability-v8.css','utf8');
          const audit=fs.readFileSync('site-text-contrast-audit-v1.js','utf8');
          const hrefOk=html.includes('terminology-opl-readability-v8.css?v=20260814-opl-readability-contact-v9')||html.includes('terminology-opl-readability-v8.css?v=20260825-opl-readability-v13');
          if(!hrefOk)throw new Error('Missing approved OPL stylesheet version');
          const required=[
            'term-opl-open-label-v9',
            'class="term-opl-copy-wechat-v9" data-opl-copy-wechat="Qily259"',
            '扫码访问官方网址'
          ];
          for(const token of required){if(!html.includes(token))throw new Error('Missing OPL HTML token: '+token);}
          if(html.includes('<button type="button" class="term-opl-copy-wechat"'))throw new Error('Button-style WeChat copy control remains');
          if(!css.includes('a.term-opl-open>.term-opl-open-label-v9')||!css.includes('-webkit-text-fill-color:#fff!important'))throw new Error('Structural white CTA label lock missing');
          if(!css.includes('QILY-OPL-PRINT-LAYOUT-CLOSURE-V13-20260825'))throw new Error('OPL print overlap closure missing');
          if(!css.includes('break-inside:auto!important')||!css.includes('@page{size:A4'))throw new Error('OPL A4 pagination guard missing');
          if(!css.includes('.term-opl-num')||!css.includes('print-color-adjust:exact!important'))throw new Error('OPL number/print color ownership missing');
          if(!audit.includes("'.term-opl-open', '.term-opl-copy-wechat-v9'"))throw new Error('OPL controls not excluded from auto-contrast');
          console.log('OPL V13 QA passed: white numbers, readable controls and A4 pagination guards present.');
          NODE

      - name: Commit production terminology template
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add knowledge/terminology.html
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: publish OPL V13 print and contrast closure [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
