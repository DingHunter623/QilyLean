name: Install Daily Brief terminology gate

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-daily-terminology.js"
      - "scripts/install-daily-terminology-gate.js"
      - ".github/workflows/install-daily-terminology-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-daily-terminology-gate-main
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install terminology gate into Daily Brief publishing
        run: node scripts/install-daily-terminology-gate.js

      - name: Audit the latest brief and synchronize terminology links
        run: node scripts/audit-daily-terminology.js

      - name: Validate Sponsor and zero uncovered terms
        shell: bash
        run: |
          test -s qilylean/daily/terminology-audit-latest.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('qilylean/daily/terminology-audit-latest.json', 'utf8'));
          if (report.status !== 'passed') throw new Error('Terminology audit status is not passed');
          if (report.unknownTerms.length) throw new Error(`Uncovered terms: ${report.unknownTerms.join(', ')}`);
          if (!report.coveredTerms.includes('Sponsor')) throw new Error('Sponsor was not included in the latest brief terminology audit');
          NODE
          grep -q 'href="/knowledge/terminology/sponsor.html"' qilylean/daily/2026-08-01.html
          grep -q '本期术语：' qilylean/daily/2026-08-01.html
          grep -q 'Audit latest brief terminology before publication' .github/workflows/build-daily-archive.yml
          grep -q 'scripts/audit-daily-terminology.js' .github/workflows/build-daily-archive.yml

      - name: Commit the terminology governance upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Daily terminology governance is already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-daily-archive.yml qilylean/daily/2026-08-01.html qilylean/daily/terminology-audit-latest.json
          git commit -m "build: enforce terminology synchronization on every Daily Brief [skip ci]"
          git push
