name: Materialize QilyLean visual closure

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/emergency-materialize-vi.js"
      - "site-navigation.js"
      - "site-vi-standard-v1.css"
      - "site-vi-contrast-restoration-v1.css"
      - "site-visual-closure-v1.css"
      - "site-visual-closure-v1.js"
      - "site-visual-closure-v2.css"
      - "site-visual-closure-v2.js"
      - ".github/workflows/emergency-materialize-vi.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/emergency-materialize-vi.js"
      - "site-navigation.js"
      - "site-vi-standard-v1.css"
      - "site-vi-contrast-restoration-v1.css"
      - "site-visual-closure-v1.css"
      - "site-visual-closure-v1.js"
      - "site-visual-closure-v2.css"
      - "site-visual-closure-v2.js"
      - ".github/workflows/emergency-materialize-vi.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-visual-closure-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize VI and final visual closure into every HTML page
        run: node scripts/emergency-materialize-vi.js

      - name: Normalize navigation cache version after legacy materialization
        shell: bash
        run: |
          find . -type f -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i 's#site-navigation.js?v=20260803-boundary-links-v2#site-navigation.js?v=20260804-sitewide-clarity-v2#g'

      - name: Verify boundary-specific content, fresh clarity assets and link-card contrast
        shell: bash
        run: |
          grep -R -q '<script defer src="/site-navigation.js?v=20260804-sitewide-clarity-v2"' --include='*.html' .
          grep -R -q 'site-visual-closure-v1.css?v=20260804-sitewide-clarity-v2' --include='*.html' .
          grep -R -q 'site-visual-closure-v1.js?v=20260804-sitewide-clarity-v2' --include='*.html' .
          grep -R -q 'site-visual-closure-v2.css?v=20260803-boundary-links-v2' --include='*.html' .
          grep -R -q 'site-visual-closure-v2.js?v=20260803-boundary-links-v2' --include='*.html' .
          grep -q 'qilySitewideClarityStyleV2' site-visual-closure-v1.js
          grep -q 'syncDailyMetadata' site-visual-closure-v1.js
          grep -q 'site-visual-closure-v1.js?v=20260804-sitewide-clarity-v2' site-navigation.js
          grep -q '三类项目合作边界' cooperation/index.html
          grep -q '新工厂／新产线规划' cooperation/index.html
          grep -q '不替代具备相应资质单位出具的施工图' cooperation/index.html
          grep -q '基线、试点与收益边界' cooperation/index.html
          grep -q '标准、内容与实施边界' cooperation/index.html
          grep -q 'companyGrid' links/index.html
          grep -q '.boundary-service-grid' site-visual-closure-v2.css
          grep -q '#companyGrid .card' site-visual-closure-v2.css
          grep -q 'refineCooperationBoundary' site-visual-closure-v2.js
          grep -q 'enhanceLinkCards' site-visual-closure-v2.js
          grep -q 'qilyBoundaryLinksClosureStylesheet' site-navigation.js

      - name: Validate JavaScript syntax
        run: |
          node --check site-navigation.js
          node --check site-visual-closure-v1.js
          node --check site-visual-closure-v2.js
          node --check scripts/emergency-materialize-vi.js

      - name: Check generated diff integrity
        run: git diff --check

      - name: Commit materialized public pages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All public pages already contain the latest sitewide clarity, boundary and link-card closure."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize QilyLean sitewide clarity closure [skip ci]"
          git pull --rebase origin main
          git push origin main
