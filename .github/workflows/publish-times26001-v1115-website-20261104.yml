name: Publish verified Times26001 v1.1.15 APK to INTERNATIONAL site (acceptance)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-times26001-v1115-website-20261104.yml'
permissions:
  contents: write
concurrency:
  group: qilylean-times26001-v1115-release
  cancel-in-progress: false
jobs:
  publish-international:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and authenticate exact official Release APK archive
        shell: bash
        env:
          APK_SOURCE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-4150-8230-94e0-b4c4f010abd5/raw?se=2026-11-04T03%3A32%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=f4602518-0037-54b9-846b-9927026d5234&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T02%3A05%3A12Z&ske=2026-11-05T02%3A05%3A12Z&sks=b&skv=2026-02-06&sig=glaVJoXbmSIQbAkWjID0jl08UjlikUs6rKD7z1xiP9c%3D'
        run: |
          set -euo pipefail
          mkdir -p /tmp/times26001-v1115
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 "$APK_SOURCE_URL" -o /tmp/times26001-v1115/archive.zip
          unzip -q /tmp/times26001-v1115/archive.zip -d /tmp/times26001-v1115/out
          SOURCE=/tmp/times26001-v1115/out/Times26001_v1.1.15_API36_website_release.apk
          test -s "$SOURCE"
          printf '%s  %s\n' 'cf4f443e9382625a7207afc24fad129080d0b4fe73eab94ca16b98774db86606' "$SOURCE" | sha256sum -c -
          grep -Fq 'Signer #1 certificate SHA-256 digest: 4f34730e5cef71c3d079b0ba5139342cabe5b6d4013b64b38b7feb9a3e63b647' /tmp/times26001-v1115/out/APKSIGNER_VERIFICATION.txt
          grep -Fq 'Signer #1 certificate MD5 digest: c72b622d18976e3f10304d46911ec6ec' /tmp/times26001-v1115/out/APKSIGNER_VERIFICATION.txt
          grep -Fq 'ANDROID_APPLICATION_LABEL=个人时间管理' /tmp/times26001-v1115/out/BUILD_INFO.txt
          grep -Fq 'PACKAGE_NAME=com.qilylean.times26001' /tmp/times26001-v1115/out/BUILD_INFO.txt
          grep -Fq 'VERSION_NAME=1.1.15' /tmp/times26001-v1115/out/BUILD_INFO.txt
          grep -Fq 'VERSION_CODE=18' /tmp/times26001-v1115/out/BUILD_INFO.txt
          cp "$SOURCE" Times26001_v1.1.15_API36_website_release.apk
          printf '%s  %s\n' 'cf4f443e9382625a7207afc24fad129080d0b4fe73eab94ca16b98774db86606' 'Times26001_v1.1.15_API36_website_release.apk' > Times26001_v1.1.15_API36_website_release.sha256.txt
      - name: Synchronize INTERNATIONAL site download paths and official release manifest
        run: |
          python3 scripts/publish-times26001-v1115-verified-20261104.py
          python3 -m json.tool app-release-manifest.json >/dev/null
          node --check app-download-share-v1.js
          node --check times26001-home-card.js
          git diff --check
          test -s Times26001_v1.1.15_API36_website_release.apk
          test -s Times26001_v1.1.15_API36_website_release.sha256.txt
          ! git status --porcelain | grep -E '^[ MADRCU?!]{2} cn-site/' || { echo 'Unexpected CN site change'; exit 1; }
      - name: Commit verified APK and acceptance download entries to international site only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QilyLean'
          git config user.email 'admin@qilylean.com'
          git add Times26001_v1.1.15_API36_website_release.apk Times26001_v1.1.15_API36_website_release.sha256.txt tools/times26001/index.html app-download-share-v1.js times26001-home-card.js capabilities/index.html app-support/index.html app-release-manifest.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to publish'; exit 1; }
          git commit -m 'release: publish Times26001 v1.1.15 signed APK international acceptance'
          git push origin HEAD:main
