name: Publish primary contrast and music continuity

on:
  pull_request:
    branches: [main]
    paths:
      - "site-hero-primary-contrast-v1.css"
      - "homepage-music-v5.js"
      - "scripts/publish-primary-contrast-music-continuity.js"
      - ".github/workflows/publish-primary-contrast-music-continuity.yml"
      - "docs/QilyLean全站统一规范补充条款_20260804_主按钮对比与背景音乐连续性.md"
      - "**/*.html"
  push:
    branches: [main]
    paths:
      - "site-hero-primary-contrast-v1.css"
      - "homepage-music-v5.js"
      - "scripts/publish-primary-contrast-music-continuity.js"
      - ".github/workflows/publish-primary-contrast-music-continuity.yml"
      - "docs/QilyLean全站统一规范补充条款_20260804_主按钮对比与背景音乐连续性.md"
      - "**/*.html"
  workflow_run:
    workflows:
      - "Finalize static public pages"
      - "Publish global navigation standards"
      - "Materialize QilyLean visual closure"
      - "Finalize 2026-08-04 sitewide redmark closure v2"
      - "Publish core-service and exact-dock closure"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-primary-contrast-music-continuity
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source syntax and contracts
        shell: bash
        run: |
          node --check homepage-music-v5.js
          node --check scripts/publish-primary-contrast-music-continuity.js
          grep -q -- '--qily-hero-primary-bg:#ffd36a' site-hero-primary-contrast-v1.css
          grep -q -- '-webkit-text-fill-color:var(--qily-hero-primary-text)!important' site-hero-primary-contrast-v1.css
          grep -q 'TRANSIT_COMPENSATION_CAP = 0.25' homepage-music-v5.js
          grep -q "'/links/'" homepage-music-v5.js
          grep -q 'playNow().then' homepage-music-v5.js

      - name: Materialize sitewide contrast and music assets
        run: node scripts/publish-primary-contrast-music-continuity.js

      - name: Verify repeatability and full public-page coverage
        shell: bash
        run: |
          git diff > /tmp/first.diff
          node scripts/publish-primary-contrast-music-continuity.js
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cssHref = '/site-hero-primary-contrast-v1.css?v=20260804-hero-primary-contrast-v1';
          const musicSrc = '/homepage-music-v5.js?v=20260804-continuity-v5';
          const audioNeedle = 'id="qilyBackgroundMusicPreload"';
          const failures = [];
          let publicPages = 0;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              if (['.git','node_modules','.cache'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.html')) {
                const html = fs.readFileSync(full, 'utf8');
                if (!/<\/head>/i.test(html) || !/<\/body>/i.test(html)) continue;
                const isPublicShell = /site-navigation\.js\?v=/i.test(html) || /homepage-music(?:-v5)?\.js\?v=/i.test(html);
                if (!isPublicShell) continue;
                publicPages += 1;
                const rel = path.relative(process.cwd(), full);
                if (!html.includes(cssHref)) failures.push(`${rel}:contrast-css`);
                if (!html.includes(musicSrc)) failures.push(`${rel}:music-v5`);
                if (!html.includes(audioNeedle)) failures.push(`${rel}:audio-preload`);
                if (/homepage-music\.js\?v=/i.test(html)) failures.push(`${rel}:legacy-music`);
                if (html.indexOf(cssHref) > html.indexOf('</head>')) failures.push(`${rel}:css-order`);
              }
            }
          }
          walk(process.cwd());
          if (publicPages < 20) throw new Error(`Unexpectedly low public-page count: ${publicPages}`);
          if (failures.length) throw new Error('Publication coverage failed: ' + failures.slice(0,80).join(', '));

          const cooperation = fs.readFileSync('cooperation/index.html','utf8');
          const onboarding = fs.readFileSync('links/onboarding/index.html','utf8');
          const links = fs.readFileSync('links/index.html','utf8');
          const css = fs.readFileSync('site-hero-primary-contrast-v1.css','utf8');
          const music = fs.readFileSync('homepage-music-v5.js','utf8');

          if (!cooperation.includes('预约60分钟问题初筛')) throw new Error('Cooperation primary action missing.');
          if (!onboarding.includes('立即填写入驻资料')) throw new Error('Onboarding primary action missing.');
          if (!css.includes('.hero-actions > :is(a,button).primary')) throw new Error('Shared hero-primary selector missing.');
          if (!css.includes('-webkit-text-fill-color:var(--qily-hero-primary-text)!important')) throw new Error('WebKit text-fill override missing.');
          if (!links.includes(musicSrc)) throw new Error('Friend-links page still lacks background music.');
          if (!music.includes('V4 waited for seeked')) throw new Error('Low-gap restore rationale missing.');
          console.log(`Validated ${publicPages} public pages.`);
          NODE
          git diff --check

      - name: Commit materialized public pages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All public pages already use the current contrast and music continuity assets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish sitewide primary contrast and continuous music [skip ci]"
          git pull --rebase origin main
          git push origin main
