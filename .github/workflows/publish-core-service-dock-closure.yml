name: Publish core-service and compact-dock closure

on:
  push:
    branches: [main]
    paths:
      - "site-core-service-dock-closure-v1.css"
      - "site-core-service-dock-closure-v1.js"
      - "scripts/publish-core-service-dock-closure.js"
      - ".github/workflows/publish-core-service-dock-closure.yml"
  workflow_run:
    workflows:
      - "Finalize static public pages"
      - "Publish global navigation standards"
      - "Materialize QilyLean visual closure"
      - "Publish bottom-alignment standard"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-core-service-dock-closure
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate closure assets
        run: |
          node --check site-core-service-dock-closure-v1.js
          node --check scripts/publish-core-service-dock-closure.js
          grep -q 'data-action=.top' site-core-service-dock-closure-v1.js
          grep -q "\['home','top','search'\]" site-core-service-dock-closure-v1.js
          grep -q 'service-number' site-core-service-dock-closure-v1.css
          grep -q 'scope-list' site-core-service-dock-closure-v1.css
      - name: Install closure in all public pages
        run: node scripts/publish-core-service-dock-closure.js
      - name: Verify repeatability and page coverage
        shell: bash
        run: |
          git diff > /tmp/first.diff
          node scripts/publish-core-service-dock-closure.js
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const failures=[];
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','node_modules','.cache'].includes(e.name))continue;const f=path.join(dir,e.name);if(e.isDirectory())walk(f);else if(e.name.endsWith('.html')){const h=fs.readFileSync(f,'utf8');if(/<\/head>/i.test(h)&&(!h.includes('site-core-service-dock-closure-v1.css?v=20260804-core-service-dock-v1')||!h.includes('site-core-service-dock-closure-v1.js?v=20260804-core-service-dock-v1')))failures.push(path.relative(process.cwd(),f));}}}
          walk(process.cwd());
          if(failures.length)throw new Error('Closure missing: '+failures.slice(0,40).join(', '));
          NODE
          git diff --check
      - name: Commit materialized public pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All pages already use the current closure."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish core-service and compact-dock closure [skip ci]"
          git pull --rebase origin main
          git push origin main
