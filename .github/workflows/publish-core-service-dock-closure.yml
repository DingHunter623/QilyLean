name: Publish core-service and exact-dock closure

on:
  pull_request:
    branches: [main]
    paths:
      - "site-core-service-dock-closure-v1.css"
      - "site-core-service-dock-closure-v1.js"
      - "site-navigation-core.js"
      - "scripts/publish-core-service-dock-closure.js"
      - ".github/workflows/publish-core-service-dock-closure.yml"
      - "docs/QilyLean全站统一规范补充条款_20260804_核心业务与悬浮入口.md"
      - "site-hero-primary-contrast-v1.css"
      - "homepage-music-v5.js"
      - "scripts/publish-primary-contrast-music-continuity.js"
      - ".github/workflows/publish-primary-contrast-music-continuity.yml"
      - "docs/QilyLean全站统一规范补充条款_20260804_主按钮对比与背景音乐连续性.md"
  push:
    branches: [main]
    paths:
      - "site-core-service-dock-closure-v1.css"
      - "site-core-service-dock-closure-v1.js"
      - "site-navigation-core.js"
      - "scripts/publish-core-service-dock-closure.js"
      - ".github/workflows/publish-core-service-dock-closure.yml"
      - "site-hero-primary-contrast-v1.css"
      - "homepage-music-v5.js"
      - "scripts/publish-primary-contrast-music-continuity.js"
      - ".github/workflows/publish-primary-contrast-music-continuity.yml"
      - "docs/QilyLean全站统一规范补充条款_20260804_主按钮对比与背景音乐连续性.md"
  workflow_run:
    workflows:
      - "Finalize static public pages"
      - "Publish global navigation standards"
      - "Materialize QilyLean visual closure"
      - "Publish bottom-alignment standard"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-core-service-exact-dock-closure
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate exact dock, primary contrast and music sources
        shell: bash
        run: |
          node --check site-core-service-dock-closure-v1.js
          node --check site-navigation-core.js
          node --check scripts/publish-core-service-dock-closure.js
          node --check homepage-music-v5.js
          node --check scripts/publish-primary-contrast-music-continuity.js
          grep -q 'service-number' site-core-service-dock-closure-v1.css
          grep -q 'scope-list' site-core-service-dock-closure-v1.css
          grep -q -- '--qily-hero-primary-bg:#ffd36a' site-hero-primary-contrast-v1.css
          grep -q -- '-webkit-text-fill-color:var(--qily-hero-primary-text)!important' site-hero-primary-contrast-v1.css
          grep -q 'TRANSIT_COMPENSATION_CAP = 0.25' homepage-music-v5.js
          grep -q "'/links/'" homepage-music-v5.js
          for action in home search back current share contact; do
            grep -q "data-action=\\\"$action\\\"" site-navigation-core.js
          done
          node - <<'NODE'
          const fs=require('fs');
          const dock=fs.readFileSync('site-core-service-dock-closure-v1.js','utf8');
          const required=[
            "var order=['home','top','back','search','current','share','contact'];",
            "top:{html:'回<br>顶部',aria:'回顶部'}",
            "back:{html:'回<br>上一层',aria:'回上一层'}",
            "current:{html:'分享<br>当前页',aria:'分享当前页'}",
            "share:{html:'分享<br>官网',aria:'分享官网'}"
          ];
          required.forEach(item=>{if(!dock.includes(item))throw new Error('Dock rule missing: '+item);});
          if(dock.includes('返回<br>上一层'))throw new Error('Obsolete wording “返回上一层” remains in closure.');
          if(dock.includes("share:{html:'分享',"))throw new Error('Share label must explicitly say 分享官网.');
          if(dock.includes('button.remove'))throw new Error('Exact dock closure must not remove original buttons.');

          const music=fs.readFileSync('homepage-music-v5.js','utf8');
          ['window.__qilyLeanBackgroundMusicV5 = true','playNow().then','V4 waited for seeked','window.setInterval(writeState, 400)']
            .forEach(item=>{if(!music.includes(item))throw new Error('Music rule missing: '+item);});
          NODE

      - name: Install exact dock, primary contrast and music in public pages
        run: |
          node scripts/publish-core-service-dock-closure.js
          node scripts/publish-primary-contrast-music-continuity.js

      - name: Verify repeatability and page coverage
        shell: bash
        run: |
          git diff > /tmp/first.diff
          node scripts/publish-core-service-dock-closure.js
          node scripts/publish-primary-contrast-music-continuity.js
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dockCss='site-core-service-dock-closure-v1.css?v=20260804-core-service-dock-v3';
          const dockJs='site-core-service-dock-closure-v1.js?v=20260804-core-service-dock-v3';
          const contrast='/site-hero-primary-contrast-v1.css?v=20260804-hero-primary-contrast-v1';
          const music='/homepage-music-v5.js?v=20260804-continuity-v5';
          const failures=[];
          let publicPages=0;
          function walk(dir){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(['.git','node_modules','.cache'].includes(e.name))continue;
              const f=path.join(dir,e.name);
              if(e.isDirectory())walk(f);
              else if(e.name.endsWith('.html')){
                const h=fs.readFileSync(f,'utf8');
                if(!/<\/head>/i.test(h))continue;
                const rel=path.relative(process.cwd(),f);
                if(!h.includes(dockCss)||!h.includes(dockJs))failures.push(`${rel}:dock`);
                const isPublic=/site-navigation\.js\?v=/i.test(h)||/homepage-music(?:-v5)?\.js(?:\?v=)?/i.test(h);
                if(!isPublic)continue;
                publicPages+=1;
                if(!h.includes(contrast))failures.push(`${rel}:primary-contrast`);
                if(!h.includes(music))failures.push(`${rel}:music-v5`);
                if(!h.includes('id="qilyBackgroundMusicPreload"'))failures.push(`${rel}:audio-preload`);
                if(/homepage-music\.js(?:\?v=)?/i.test(h))failures.push(`${rel}:legacy-music`);
              }
            }
          }
          walk(process.cwd());
          if(publicPages<20)throw new Error('Unexpected public page count: '+publicPages);
          if(failures.length)throw new Error('Closure coverage failed: '+failures.slice(0,80).join(', '));

          const cooperation=fs.readFileSync('cooperation/index.html','utf8');
          const onboarding=fs.readFileSync('links/onboarding/index.html','utf8');
          const links=fs.readFileSync('links/index.html','utf8');
          const css=fs.readFileSync('site-hero-primary-contrast-v1.css','utf8');
          if(!cooperation.includes('预约60分钟问题初筛'))throw new Error('Cooperation primary action missing.');
          if(!onboarding.includes('立即填写入驻资料'))throw new Error('Onboarding primary action missing.');
          if(!css.includes('.hero-actions > :is(a,button).primary'))throw new Error('Shared hero primary selector missing.');
          if(!links.includes(music))throw new Error('Friend-links page still lacks V5 music.');
          console.log(`Validated ${publicPages} public pages with exact dock, button contrast and music continuity.`);
          NODE
          git diff --check

      - name: Commit materialized public pages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All pages already use the exact dock, primary contrast and music continuity assets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish exact dock primary contrast and continuous music [skip ci]"
          git pull --rebase origin main
          git push origin main
