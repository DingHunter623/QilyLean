name: Enforce primary navigation, operating-axis mapping and mobile readability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/align-primary-nav-operating-axis.js'
      - 'scripts/enforce-home-hero-layout.js'
      - 'scripts/enforce-unified-content-axis.js'
      - 'site-navigation-core.js'
      - 'site-navigation-legacy-20260802.js'
      - 'site-navigation.js'
      - 'site-visual-governance-v2.css'
      - 'site-home-hero-tune-v1.css'
      - 'site-content-axis-v1.css'
      - '*.html'
      - '**/*.html'
      - '.github/workflows/align-primary-nav-operating-axis.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qily-site-operating-axis-readability-v2
  cancel-in-progress: true

jobs:
  enforce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Materialize unified site baseline, primary navigation, homepage hero and content axis
        run: |
          node --check scripts/align-primary-nav-operating-axis.js
          node --check scripts/enforce-home-hero-layout.js
          node --check scripts/enforce-unified-content-axis.js
          node scripts/align-primary-nav-operating-axis.js --apply
          node scripts/enforce-home-hero-layout.js --apply
          node scripts/enforce-unified-content-axis.js --apply
          node --check site-navigation-core.js
          node --check site-navigation-legacy-20260802.js
          node --check site-navigation.js
          git diff --check

      - name: Validate navigation, interaction, typography, homepage hero and unified content axis
        shell: bash
        run: |
          set -euo pipefail
          node scripts/align-primary-nav-operating-axis.js --apply
          node scripts/enforce-home-hero-layout.js --apply
          node scripts/enforce-unified-content-axis.js --apply
          grep -q -- '--qily-readable-floor:18px' site-visual-governance-v2.css
          grep -q -- '--qily-readable-small:18px' site-visual-governance-v2.css
          grep -q -- '.qily-principle span' site-visual-governance-v2.css
          grep -q -- '.qily-value-card p' site-visual-governance-v2.css
          grep -q -- '.qily-proof-item span' site-visual-governance-v2.css
          grep -q -- '.qily-secondary-links span' site-visual-governance-v2.css
          grep -q -- '.trust-strip span' site-visual-governance-v2.css
          grep -q -- '.core-contract-viewer-note' site-visual-governance-v2.css
          grep -q -- '.attachment-size' site-visual-governance-v2.css
          grep -q -- '.qily-system-axis__step:hover' site-visual-governance-v2.css
          grep -q -- '.qily-system-axis__step:focus-visible' site-visual-governance-v2.css
          grep -q -- '.qily-system-axis__step:active' site-visual-governance-v2.css
          grep -q -- 'header a\[href="/trust/"\]\[aria-current="page"\]' site-visual-governance-v2.css
          grep -q -- "['履历主线', '/experience/']" site-navigation-core.js
          grep -q -- "['信任中心', '/trust/']" site-navigation-core.js
          grep -q -- "['资源协同', '/links/']" site-navigation-core.js
          ! grep -q -- "['友情链接', '/links/']" site-navigation-core.js
          grep -q -- "link.textContent = '资源协同';" site-navigation-legacy-20260802.js
          ! grep -q -- "link.textContent = '友情链接';" site-navigation-legacy-20260802.js
          grep -q -- '20260820-resource-collaboration-v25' site-navigation.js
          grep -q -- '20260820-resource-collaboration-v25' site-navigation-legacy-20260802.js
          ! grep -q 'font-size:11.5px!important' site-navigation-core.js
          ! grep -q 'font-size:12.5px!important' site-navigation-core.js
          ! grep -q 'font-size:16.5px!important' site-navigation-core.js
          ! grep -q 'font-size:17.5px!important' site-navigation-core.js
          grep -q -- 'qilyHomeHeroTuneV1' index.html
          grep -q -- '20260819-home-hero-align-v3' index.html
          grep -q -- 'font-size:clamp(40px,3.6vw,52px)!important' site-home-hero-tune-v1.css
          grep -q -- 'grid-template-columns:minmax(0,1fr) minmax(330px,360px)!important' site-home-hero-tune-v1.css
          grep -q -- '.qily-home-thesis' site-home-hero-tune-v1.css
          grep -q -- '.qily-home-actions' site-home-hero-tune-v1.css
          grep -q -- '--qily-content-axis:1560px' site-content-axis-v1.css
          grep -q -- '.qily-asset-inner' site-content-axis-v1.css
          grep -q -- '.qily-system-axis__inner' site-content-axis-v1.css
          grep -q -- '.qily-ia-inner' site-content-axis-v1.css
          grep -q -- 'qilyContentAxisV1' index.html
          grep -q -- '20260819-unified-content-axis-v1' index.html
          grep -q -- '20260820-resource-collaboration-v31' index.html
          grep -q -- 'CONTENT_AXIS_HREF' site-navigation.js
          grep -q -- 'unifiedContentAxis: true' site-navigation.js

      - name: Commit self-healed public baseline
        shell: bash
        run: |
          git config user.name 'QilyLean'
          git config user.email 'DingHunter623@gmail.com'
          git add site-navigation-core.js site-navigation-legacy-20260802.js site-navigation.js index.html '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo 'Primary navigation/resource collaboration/readability/homepage hero/content-axis baseline already materialized.'
            exit 0
          fi
          git commit -m 'fix: materialize 资源协同 primary navigation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
