name: Validate shared PDCA loop presentation
on:
  push:
    branches: [fix/dual-site-pdca-closed-loop-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mirror both sites with production generator
        run: |
          set -euo pipefail
          bash cn-site/scripts/materialize-practice-assets.sh
          python3 cn-site/scripts/validate-source-content-parity.py
      - name: Prepare Chromium and preview servers
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory . >/tmp/qily-pdca-international.log 2>&1 &
          python3 -m http.server 4174 --directory cn-site >/tmp/qily-pdca-china.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/capability-pdca-loop-v1.css >/dev/null
      - name: Check P-D-C-A cycle, four arrows, widths and no overflow on both sites
        run: node scripts/test-pdca-dual-site-layout-20261024.cjs
