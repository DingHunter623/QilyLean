name: Validate QilyLean information architecture v3

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cooperation/index.html"
      - "links/**"
      - "site-navigation-core.js"
      - "docs/QilyLean全站业务口径规范_20260809.md"
      - ".github/workflows/validate-information-architecture.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify Business Hierarchy v3
        shell: bash
        run: |
          set -euo pipefail
          grep -q '三大核心业务' index.html cooperation/index.html
          grep -q '新工厂／新产线规划' index.html cooperation/index.html
          grep -q '精益改善项目交付' index.html cooperation/index.html
          grep -q '目视化项目设计与交付' index.html cooperation/index.html
          grep -q '数智化增强' index.html cooperation/index.html
          grep -q 'APP软件开发' index.html cooperation/index.html
          grep -q '官网建设' index.html cooperation/index.html
          grep -q '友情链接' links/index.html
          ! grep -q '六类核心业务' index.html
          ! grep -q '<h2>六类核心业务</h2>' cooperation/index.html
          ! grep -q 'data-qily-six-core-services="v2"' index.html cooperation/index.html
          grep -q 'Business Hierarchy v3' docs/QilyLean全站业务口径规范_20260809.md
      - name: Verify diff hygiene
        run: git diff --check
