name: Validate QilyLean information architecture

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cooperation/index.html"
      - "links/**"
      - "site-navigation-core.js"
      - "site-information-architecture-v1.js"
      - "docs/QilyLean全站业务口径规范_20260809.md"
      - ".github/workflows/validate-information-architecture.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify six-business information architecture
        run: |
          node scripts/enforce-six-core-static-source.js
          grep -q '六类核心业务' index.html cooperation/index.html
          grep -q 'APP软件开发' index.html cooperation/index.html
          grep -q '官网建设' index.html cooperation/index.html
          grep -q '友情链接' links/index.html
          grep -q "\['友情链接', '/links/'\]" site-navigation-core.js
          grep -q '<strong>友情链接</strong>' index.html
          grep -q 'Six-Core Business Architecture v2' docs/QilyLean全站业务口径规范_20260809.md
          ! grep -q 'QilyLean AI／APP</h3>' index.html cooperation/index.html
          ! grep -q 'QilyLean官网</h3>' index.html cooperation/index.html
      - name: Verify syntax and diff
        run: |
          node --check site-navigation-core.js
          node --check site-information-architecture-v1.js
          git diff --check
