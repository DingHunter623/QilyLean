name: Validate QilyLean business hierarchy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate current hierarchy markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q '三大核心业务' index.html
          grep -q '新工厂／新产线规划' index.html
          grep -q '精益改善项目交付' index.html
          grep -q '目视化项目设计与交付' index.html
          grep -q '数智化增强' index.html
          ! grep -q '两大业务主线 · 六类核心业务' index.html
          ! grep -q '六类核心业务｜六类核心能力' index.html
