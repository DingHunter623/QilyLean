<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="场景简图｜职业发展">
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#12313a}.title{font-size:58px;font-weight:900}.sub{font-size:25px;fill:#526967}.h{font-size:29px;font-weight:850}.b{font-size:22px}.s{font-size:18px;fill:#526967}.num{font-size:30px;font-weight:900}.white{fill:#fff}.teal{fill:#0f6f78}.green{fill:#1f653d}.gold{fill:#c88d00}</style>
<rect width="1440" height="1080" fill="#fff"/>
<text x="720" y="76" text-anchor="middle" class="title">场景简图｜职业发展</text>
<line x1="490" y1="111" x2="675" y2="111" stroke="#0f6f78" stroke-width="4"/><circle cx="720" cy="111" r="7" fill="#c88d00"/><line x1="765" y1="111" x2="950" y2="111" stroke="#0f6f78" stroke-width="4"/>
<text x="720" y="158" text-anchor="middle" class="sub">职场里的“天花板”通常不是努力一点就能达成的目标，而是当前体系内的晋升或能力上限。</text>
<rect x="35" y="220" width="1000" height="720" rx="20" fill="#fff" stroke="#0f6f78" stroke-width="2"/><rect x="120" y="820" width="250" height="80" fill="#0f6f78" opacity=".95"/><circle cx="150" cy="800" r="25" fill="#0f6f78"/><text x="150" y="809" text-anchor="middle" class="b white" font-weight="900">01</text><text x="138" y="762" class="h" fill="#0f6f78">当前：IE工程师</text><rect x="330" y="700" width="300" height="120" fill="#0f6f78" opacity=".95"/><circle cx="360" cy="680" r="25" fill="#0f6f78"/><text x="360" y="689" text-anchor="middle" class="b white" font-weight="900">02</text><text x="348" y="642" class="h" fill="#0f6f78">目标：高级工程师</text><rect x="560" y="570" width="330" height="130" fill="#0f6f78" opacity=".95"/><circle cx="590" cy="550" r="25" fill="#0f6f78"/><text x="590" y="559" text-anchor="middle" class="b white" font-weight="900">03</text><text x="578" y="512" class="h" fill="#0f6f78">挑战目标：工程主管</text><rect x="790" y="420" width="330" height="150" fill="#c88d00" opacity=".95"/><circle cx="820" cy="400" r="25" fill="#c88d00"/><text x="820" y="409" text-anchor="middle" class="b white" font-weight="900">04</text><text x="808" y="362" class="h" fill="#c88d00">天花板：当前组织体系内可到达的上限</text><rect x="1010" y="270" width="260" height="150" fill="#1f653d" opacity=".95"/><circle cx="1040" cy="250" r="25" fill="#1f653d"/><text x="1040" y="259" text-anchor="middle" class="b white" font-weight="900">05</text><text x="1028" y="212" class="h" fill="#1f653d">标杆：行业优秀同岗位能力标准</text><circle cx="135" cy="735" r="35" fill="#0f6f78"/><line x1="135" y1="770" x2="135" y2="840" stroke="#0f6f78" stroke-width="18"/><line x1="135" y1="795" x2="200" y2="760" stroke="#0f6f78" stroke-width="15"/><line x1="135" y1="838" x2="90" y2="895" stroke="#0f6f78" stroke-width="15"/><line x1="135" y1="838" x2="190" y2="885" stroke="#0f6f78" stroke-width="15"/><rect x="1060" y="220" width="345" height="720" rx="20" fill="#fff" stroke="#0f6f78" stroke-width="2"/><rect x="1060" y="220" width="345" height="90" rx="20" fill="#0f6f78"/><rect x="1060" y="290" width="345" height="20" fill="#0f6f78"/><text x="1232" y="277" text-anchor="middle" class="h white">管理提醒</text><circle cx="1110" cy="380" r="28" fill="#0f6f78"/><text x="1110" y="389" text-anchor="middle" class="b white" font-weight="900">01</text><text x="1160" y="365" class="b">“目标”要写清时间、</text><text x="1160" y="399" class="b">标准和结果。</text><line x1="1090" y1="460" x2="1375" y2="460" stroke="#d5e4e3" stroke-width="2"/><circle cx="1110" cy="525" r="28" fill="#0f6f78"/><text x="1110" y="534" text-anchor="middle" class="b white" font-weight="900">02</text><text x="1160" y="510" class="b">“挑战目标”可以更高，</text><text x="1160" y="544" class="b">但仍需可争取。</text><line x1="1090" y1="605" x2="1375" y2="605" stroke="#d5e4e3" stroke-width="2"/><circle cx="1110" cy="670" r="28" fill="#0f6f78"/><text x="1110" y="679" text-anchor="middle" class="b white" font-weight="900">03</text><text x="1160" y="650" class="b">若已接近“天花板”，</text><text x="1160" y="684" class="b">应考虑岗位、组织或</text><text x="1160" y="718" class="b">能力结构升级。</text>
<line x1="40" y1="1030" x2="520" y2="1030" stroke="#0f6f78" stroke-width="3"/><text x="720" y="1041" text-anchor="middle" font-size="26" font-weight="800">QilyLean｜启力精益</text><line x1="920" y1="1030" x2="1400" y2="1030" stroke="#0f6f78" stroke-width="3"/>
</svg>
