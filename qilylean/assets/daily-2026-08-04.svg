      <text x="75" y="92" fill="#073c47" font-size="24">验证净收益</text>
      <text x="75" y="124" fill="#5f7474" font-size="17">质量·安全·投入</text>
    </g>
    <g transform="translate(867 512)">
      <rect width="150" height="148" rx="20" fill="#ffffff"/>
      <circle cx="75" cy="40" r="24" fill="#073c47"/>
      <text x="75" y="49" fill="#ffffff" font-size="24">6</text>
      <text x="75" y="92" fill="#073c47" font-size="24">固化标准</text>
      <text x="75" y="124" fill="#5f7474" font-size="17">培训·点检·复盘</text>
    </g>
