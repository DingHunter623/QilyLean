<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">科学改进生产力</title>
  <desc id="desc">从有效产出、事实基线、损失识别、试点验证到标准固化的生产力改善闭环</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073c47"/>
      <stop offset="0.58" stop-color="#0f4b5a"/>
      <stop offset="1" stop-color="#178b94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#052c35" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" rx="46" fill="url(#bg)"/>
  <circle cx="928" cy="148" r="94" fill="#ffe39b" opacity=".16"/>
  <circle cx="118" cy="928" r="138" fill="#ffffff" opacity=".06"/>

  <text x="540" y="104" text-anchor="middle" fill="#ffe39b" font-size="30" font-weight="800" letter-spacing="4">DAILY ENGINEERING BRIEF</text>
  <text x="540" y="178" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="900">科学改进生产力</text>
  <text x="540" y="229" text-anchor="middle" fill="#dcefeb" font-size="27" font-weight="600">不是催人提速，而是系统减少损失</text>

  <g filter="url(#shadow)">
    <rect x="82" y="296" width="916" height="148" rx="24" fill="#f7fbfa"/>
    <text x="540" y="350" text-anchor="middle" fill="#073c47" font-size="29" font-weight="900">有效生产力</text>
    <text x="540" y="407" text-anchor="middle" fill="#0f4b5a" font-size="38" font-weight="900">合格且满足需求的产出 ÷ 系统总投入</text>
  </g>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(62 512)">
      <rect width="150" height="148" rx="20" fill="#ffffff"/>
      <circle cx="75" cy="40" r="24" fill="#073c47"/>
      <text x="75" y="49" fill="#ffffff" font-size="24">1</text>
      <text x="75" y="92" fill="#073c47" font-size="24">定义产出</text>
      <text x="75" y="124" fill="#5f7474" font-size="17">需求·质量·交付</text>
    </g>
    <g transform="translate(223 512)">
      <rect width="150" height="148" rx="20" fill="#eef8f6"/>
      <circle cx="75" cy="40" r="24" fill="#0f4b5a"/>
      <text x="75" y="49" fill="#ffffff" font-size="24">2</text>
      <text x="75" y="92" fill="#073c47" font-size="24">建立基线</text>
      <text x="75" y="124" fill="#5f7474" font-size="17">时间·产出·异常</text>
    </g>
    <g transform="translate(384 512)">
      <rect width="150" height="148" rx="20" fill="#fff8e8"/>
      <circle cx="75" cy="40" r="24" fill="#9e4a34"/>
      <text x="75" y="49" fill="#ffffff" font-size="24">3</text>
      <text x="75" y="92" fill="#073c47" font-size="24">识别损失</text>
      <text x="75" y="124" fill="#6b5323" font-size="17">等待·返工·停机</text>
    </g>
    <g transform="translate(545 512)">
      <rect width="150" height="148" rx="20" fill="#fff1ed"/>
      <circle cx="75" cy="40" r="24" fill="#9e4a34"/>
      <text x="75" y="49" fill="#ffffff" font-size="24">4</text>
      <text x="75" y="92" fill="#073c47" font-size="24">小范围试点</text>
      <text x="75" y="124" fill="#78534c" font-size="17">假设·条件·风险</text>
    </g>
    <g transform="translate(706 512)">
      <rect width="150" height="148" rx="20" fill="#eef8f6"/>
      <circle cx="75" cy="40" r="24" fill="#0f4b5a"/>
