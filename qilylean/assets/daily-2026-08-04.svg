  <path d="M137 702 H943" stroke="#ffe39b" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 14"/>
  <path d="M925 686 L950 702 L925 718" fill="none" stroke="#ffe39b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(92 766)">
    <rect width="896" height="166" rx="26" fill="#062f39" opacity=".92"/>
    <text x="448" y="48" text-anchor="middle" fill="#ffe39b" font-size="27" font-weight="900">三条不可突破的改善边界</text>
    <g font-size="27" font-weight="800" text-anchor="middle">
      <text x="160" y="105" fill="#ffffff">质量不退步</text>
      <text x="448" y="105" fill="#ffffff">安全不透支</text>
      <text x="736" y="105" fill="#ffffff">库存不过量</text>
    </g>
    <g fill="#dcefeb">
      <circle cx="160" cy="132" r="8"/>
      <circle cx="448" cy="132" r="8"/>
      <circle cx="736" cy="132" r="8"/>
