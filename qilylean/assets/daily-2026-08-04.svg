  <text x="540" y="1004" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">QilyLean｜启力精益 · 2026-08-04</text>
  <text x="540" y="1040" text-anchor="middle" fill="#cfe4df" font-size="19">事实基线 · 损失结构 · 试点验证 · 标准固化</text>
