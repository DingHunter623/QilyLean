<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="场景简图｜目标设定的管理判断">
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#12313a}.title{font-size:58px;font-weight:900}.sub{font-size:25px;fill:#526967}.h{font-size:29px;font-weight:850}.b{font-size:22px}.s{font-size:18px;fill:#526967}.num{font-size:30px;font-weight:900}.white{fill:#fff}.teal{fill:#0f6f78}.green{fill:#1f653d}.gold{fill:#c88d00}</style>
<rect width="1440" height="1080" fill="#fff"/>
<text x="720" y="76" text-anchor="middle" class="title">场景简图｜目标设定的管理判断</text>
<line x1="490" y1="111" x2="675" y2="111" stroke="#0f6f78" stroke-width="4"/><circle cx="720" cy="111" r="7" fill="#c88d00"/><line x1="765" y1="111" x2="950" y2="111" stroke="#0f6f78" stroke-width="4"/>
<text x="720" y="158" text-anchor="middle" class="sub">先判断目标是否在当前上限之内，再决定是做改善，还是先改约束。</text>
<rect x="350" y="210" width="380" height="78" rx="14" fill="#fff" stroke="#0f6f78" stroke-width="2"/><text x="540" y="260" text-anchor="middle" class="h">先定义目标值</text><line x1="540" y1="288" x2="540" y2="330" stroke="#0f6f78" stroke-width="4"/><polygon points="540,330 720,410 540,490 360,410" fill="#fff" stroke="#0f6f78" stroke-width="3"/><text x="540" y="400" text-anchor="middle" class="h">目标值 ≤</text><text x="540" y="438" text-anchor="middle" class="h">当前天花板？</text><line x1="360" y1="410" x2="245" y2="410" stroke="#0f6f78" stroke-width="4"/><circle cx="220" cy="410" r="30" fill="#0f6f78"/><text x="220" y="420" text-anchor="middle" class="h white">是</text><line x1="220" y1="440" x2="220" y2="505" stroke="#0f6f78" stroke-width="4"/><line x1="720" y1="410" x2="830" y2="410" stroke="#1f653d" stroke-width="4"/><circle cx="855" cy="410" r="30" fill="#1f653d"/><text x="855" y="420" text-anchor="middle" class="h white">否</text><line x1="855" y1="440" x2="855" y2="505" stroke="#1f653d" stroke-width="4"/><rect x="70" y="505" width="300" height="72" rx="14" fill="#fff" stroke="#0f6f78" stroke-width="2"/><text x="220" y="551" text-anchor="middle" class="h">优化流程</text><line x1="220" y1="577" x2="220" y2="610" stroke="#0f6f78" stroke-width="4"/><rect x="70" y="610" width="300" height="72" rx="14" fill="#fff" stroke="#0f6f78" stroke-width="2"/><text x="220" y="656" text-anchor="middle" class="h">标准化作业</text><line x1="220" y1="682" x2="220" y2="715" stroke="#0f6f78" stroke-width="4"/><rect x="70" y="715" width="300" height="72" rx="14" fill="#fff" stroke="#0f6f78" stroke-width="2"/><text x="220" y="761" text-anchor="middle" class="h">培训与执行</text><line x1="220" y1="787" x2="220" y2="820" stroke="#0f6f78" stroke-width="4"/><rect x="70" y="820" width="300" height="72" rx="14" fill="#fff" stroke="#0f6f78" stroke-width="2"/><text x="220" y="866" text-anchor="middle" class="h">达成目标</text><rect x="705" y="505" width="300" height="72" rx="14" fill="#fff" stroke="#1f653d" stroke-width="2"/><text x="855" y="551" text-anchor="middle" font-size="29" font-weight="850">识别瓶颈约束</text><line x1="855" y1="577" x2="855" y2="610" stroke="#1f653d" stroke-width="4"/><rect x="705" y="610" width="300" height="72" rx="14" fill="#fff" stroke="#1f653d" stroke-width="2"/><text x="855" y="656" text-anchor="middle" font-size="20" font-weight="850">增加资源/设备/工艺/组织支持</text><line x1="855" y1="682" x2="855" y2="715" stroke="#1f653d" stroke-width="4"/><rect x="705" y="715" width="300" height="72" rx="14" fill="#fff" stroke="#1f653d" stroke-width="2"/><text x="855" y="761" text-anchor="middle" font-size="29" font-weight="850">重设新天花板</text><line x1="855" y1="787" x2="855" y2="820" stroke="#1f653d" stroke-width="4"/><rect x="705" y="820" width="300" height="72" rx="14" fill="#fff" stroke="#1f653d" stroke-width="2"/><text x="855" y="866" text-anchor="middle" font-size="29" font-weight="850">再设目标</text><rect x="1070" y="335" width="335" height="470" rx="20" fill="#fffaf0" stroke="#c88d00" stroke-width="2"/><text x="1238" y="395" text-anchor="middle" class="h gold">标杆的作用</text><line x1="1100" y1="425" x2="1375" y2="425" stroke="#c88d00" stroke-width="2" stroke-dasharray="8 8"/><rect x="1165" y="530" width="35" height="80" fill="#c88d00"/><rect x="1215" y="490" width="35" height="120" fill="#c88d00"/><rect x="1265" y="445" width="35" height="165" fill="#c88d00"/><text x="1238" y="675" text-anchor="middle" class="b">标杆用于对标学习</text><text x="1238" y="710" text-anchor="middle" class="b">和寻找差距，</text><text x="1238" y="745" text-anchor="middle" class="b">不直接等于本期考核值。</text><rect x="35" y="930" width="1370" height="70" rx="16" fill="#eef7f6" stroke="#0f6f78" stroke-width="2"/><text x="75" y="974" class="h teal">一句话：</text><text x="220" y="974" class="b">能在天花板内解决的，先做改善；超过天花板的，先改约束。</text>
<line x1="40" y1="1030" x2="520" y2="1030" stroke="#0f6f78" stroke-width="3"/><text x="720" y="1041" text-anchor="middle" font-size="26" font-weight="800">QilyLean｜启力精益</text><line x1="920" y1="1030" x2="1400" y2="1030" stroke="#0f6f78" stroke-width="3"/>
</svg>
