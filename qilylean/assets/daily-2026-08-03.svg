    <rect x="575" y="345" width="400" height="150" rx="22" fill="#fff8e8"/>
    <text x="775" y="405" fill="#574015" font-size="31" font-weight="900">B级｜已验证</text>
    <text x="775" y="452" fill="#6b5323" font-size="21">前后数据 · 现场记录</text>
    <rect x="105" y="545" width="400" height="150" rx="22" fill="#fff1ed"/>
    <text x="305" y="605" fill="#7b3526" font-size="31" font-weight="900">C级｜阶段估算</text>
