  <path d="M835 745 C835 855 245 855 245 745" fill="none" stroke="#f7d98b" stroke-width="6" stroke-dasharray="14 10"/>
  <text x="540" y="825" fill="#f7d98b" font-size="26" font-weight="850" text-anchor="middle">证据卡 → 对应成果页 → 同级标识 → 阶段门复核</text>
