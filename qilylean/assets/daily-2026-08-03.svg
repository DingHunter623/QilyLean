<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">成果证据链与阶段门</title>
  <desc id="desc">A、B、C、D证据等级通过阶段门评审连接公开成果链接与详情页等级。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073c47"/><stop offset="1" stop-color="#178b94"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#062f38" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1080" height="1080" rx="54" fill="url(#bg)"/>
  <text x="82" y="105" fill="#ffe39b" font-size="30" font-weight="800" letter-spacing="4">QILYLEAN · 2026-08-03</text>
  <text x="82" y="185" fill="#fff" font-size="58" font-weight="900">成果分级不是贴标签</text>
  <text x="82" y="246" fill="#dcefed" font-size="30" font-weight="700">证据等级 · 阶段门 · 公开链接 · 详情同口径</text>
  <g filter="url(#shadow)" font-family="sans-serif" text-anchor="middle">
    <g transform="translate(82 330)"><rect width="190" height="170" rx="26" fill="#fff" stroke="#ffe39b" stroke-width="5"/><text x="95" y="70" fill="#0f4b5a" font-size="50" font-weight="900">A级</text><text x="95" y="121" fill="#173d43" font-size="27" font-weight="800">已核定</text></g>
    <g transform="translate(322 330)"><rect width="190" height="170" rx="26" fill="#fff" stroke="#ffe39b" stroke-width="5"/><text x="95" y="70" fill="#177f87" font-size="50" font-weight="900">B级</text><text x="95" y="121" fill="#173d43" font-size="27" font-weight="800">已验证</text></g>
    <g transform="translate(562 330)"><rect width="190" height="170" rx="26" fill="#fff" stroke="#ffe39b" stroke-width="5"/><text x="95" y="70" fill="#9e4a34" font-size="50" font-weight="900">C级</text><text x="95" y="121" fill="#173d43" font-size="27" font-weight="800">阶段估算</text></g>
    <g transform="translate(802 330)"><rect width="190" height="170" rx="26" fill="#ffe39b" stroke="#fff" stroke-width="5"/><text x="95" y="70" fill="#17322d" font-size="50" font-weight="900">D级</text><text x="95" y="121" fill="#17322d" font-size="27" font-weight="800">经验陈述</text></g>
  </g>
  <path d="M177 545H903" stroke="#ffe39b" stroke-width="8" stroke-linecap="round"/>
  <path d="M540 545V618" stroke="#ffe39b" stroke-width="8" stroke-linecap="round"/>
  <rect x="325" y="618" width="430" height="118" rx="30" fill="#ffe39b" filter="url(#shadow)"/>
  <text x="540" y="691" fill="#17322d" font-size="42" font-weight="900" text-anchor="middle">阶段门评审</text>
  <path d="M540 736V800" stroke="#ffe39b" stroke-width="8" stroke-linecap="round"/>
  <g font-family="sans-serif" text-anchor="middle"><rect x="96" y="800" width="388" height="142" rx="28" fill="#fff"/><text x="290" y="862" fill="#0f4b5a" font-size="33" font-weight="900">公开成果链接</text><text x="290" y="906" fill="#526968" font-size="23">入口清晰 · 点击即达</text><rect x="596" y="800" width="388" height="142" rx="28" fill="#fff"/><text x="790" y="862" fill="#0f4b5a" font-size="33" font-weight="900">详情页等级</text><text x="790" y="906" fill="#526968" font-size="23">同级呈现 · 边界明确</text></g>
  <path d="M484 871H596" stroke="#ffe39b" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 12"/>
  <text x="540" y="1011" fill="#fff" font-size="25" font-weight="700" text-anchor="middle">可点击 · 可核验 · 可追溯 · 可升级</text>
</svg>
