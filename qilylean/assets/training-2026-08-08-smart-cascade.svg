<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">SMART目标逐级分解</title><desc id="d">公司目标逐级分解到部门目标、岗位目标、个人任务和绩效评价</desc><rect width="1200" height="420" rx="28" fill="#f7f8f5"/><text x="56" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="800" fill="#173f34">SMART目标｜逐级分解</text><text x="56" y="108" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#607068">目标不是口号，要一路落到岗位与个人任务</text><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g><rect x="55" y="165" width="180" height="110" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><circle cx="145" cy="190" r="18" fill="#1f6547"/><text x="145" y="197" font-size="18" font-weight="800" fill="#fff">1</text><text x="145" y="238" font-size="24" font-weight="800" fill="#173f34">公司目标</text></g><path d="M245 220h55" stroke="#1f6547" stroke-width="5"/><path d="M300 220l-15-10v20z" fill="#1f6547"/><g><rect x="310" y="165" width="180" height="110" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><circle cx="400" cy="190" r="18" fill="#1f6547"/><text x="400" y="197" font-size="18" font-weight="800" fill="#fff">2</text><text x="400" y="238" font-size="24" font-weight="800" fill="#173f34">部门目标</text></g><path d="M500 220h55" stroke="#1f6547" stroke-width="5"/><path d="M555 220l-15-10v20z" fill="#1f6547"/><g><rect x="565" y="165" width="180" height="110" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><circle cx="655" cy="190" r="18" fill="#1f6547"/><text x="655" y="197" font-size="18" font-weight="800" fill="#fff">3</text><text x="655" y="238" font-size="24" font-weight="800" fill="#173f34">岗位目标</text></g><path d="M755 220h55" stroke="#1f6547" stroke-width="5"/><path d="M810 220l-15-10v20z" fill="#1f6547"/><g><rect x="820" y="165" width="180" height="110" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><circle cx="910" cy="190" r="18" fill="#1f6547"/><text x="910" y="197" font-size="18" font-weight="800" fill="#fff">4</text><text x="910" y="238" font-size="24" font-weight="800" fill="#173f34">个人任务</text></g><path d="M1010 220h55" stroke="#1f6547" stroke-width="5"/><path d="M1065 220l-15-10v20z" fill="#1f6547"/><g><rect x="1075" y="165" width="95" height="110" rx="18" fill="#173f34"/><text x="1122" y="210" font-size="18" font-weight="800" fill="#e5c46f">结果</text><text x="1122" y="242" font-size="18" font-weight="800" fill="#fff">绩效</text></g><rect x="240" y="320" width="720" height="48" rx="24" fill="#eef4ef"/><text x="600" y="351" font-size="19" font-weight="700" fill="#315b4b">具体 · 可测量 · 可实现 · 相关联 · 有期限</text></g></svg>