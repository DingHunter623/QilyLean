<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">PDCA持续改善闭环</title><desc id="d">计划、执行、检查、处理四阶段循环并形成标准化再提升</desc><rect width="1200" height="460" rx="28" fill="#f7f8f5"/><text x="56" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="800" fill="#173f34">PDCA｜持续改善闭环</text><text x="56" y="108" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#607068">一次改善的终点，是把有效方法固化成下一轮的标准起点</text><g font-family="Arial,'Microsoft YaHei',sans-serif"><circle cx="410" cy="275" r="125" fill="#fff" stroke="#c5d6cc" stroke-width="14"/><path d="M410 150a125 125 0 0 1 125 125" fill="none" stroke="#1f6547" stroke-width="20"/><path d="M535 275a125 125 0 0 1-125 125" fill="none" stroke="#4f7f68" stroke-width="20"/><path d="M410 400a125 125 0 0 1-125-125" fill="none" stroke="#b89448" stroke-width="20"/><path d="M285 275a125 125 0 0 1 125-125" fill="none" stroke="#7d9d88" stroke-width="20"/><text x="410" y="267" text-anchor="middle" font-size="28" font-weight="900" fill="#173f34">PDCA</text><text x="410" y="300" text-anchor="middle" font-size="18" fill="#607068">持续改善</text><g text-anchor="middle"><rect x="660" y="145" width="210" height="70" rx="18" fill="#eef4ef"/><text x="765" y="177" font-size="23" font-weight="900" fill="#173f34">P｜Plan</text><text x="765" y="201" font-size="15" fill="#607068">目标 · 任务 · 资源</text><rect x="900" y="145" width="210" height="70" rx="18" fill="#eef4ef"/><text x="1005" y="177" font-size="23" font-weight="900" fill="#173f34">D｜Do</text><text x="1005" y="201" font-size="15" fill="#607068">按计划与标准执行</text><rect x="660" y="250" width="210" height="70" rx="18" fill="#fff7e8"/><text x="765" y="282" font-size="23" font-weight="900" fill="#6d5523">C｜Check</text><text x="765" y="306" font-size="15" fill="#806d47">检查过程与结果</text><rect x="900" y="250" width="210" height="70" rx="18" fill="#173f34"/><text x="1005" y="282" font-size="23" font-weight="900" fill="#e5c46f"