<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">执行闭环</title><desc id="d">责任人、任务内容、完成标准、完成时间、过程跟进、节点检查、结果验收与异常改善</desc><rect width="1200" height="430" rx="28" fill="#f7f8f5"/><text x="56" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="800" fill="#173f34">结果导向｜执行闭环</text><text x="56" y="108" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#607068">“已经安排”不是完成，必须有标准、有检查、有验收</text><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g><rect x="55" y="155" width="210" height="145" rx="20" fill="#fff" stroke="#b89448" stroke-width="2"/><text x="160" y="192" font-size="20" font-weight="800" fill="#173f34">任务定义</text><text x="160" y="226" font-size="16" fill="#607068">责任人 + 内容</text><text x="160" y="253" font-size="16" fill="#607068">标准 + 时间</text></g><path d="M275 227h55" stroke="#1f6547" stroke-width="5"/><path d="M330 227l-15-10v20z" fill="#1f6547"/><g><rect x="340" y="155" width="175" height="145" rx="20" fill="#eef4ef" stroke="#1f6547" stroke-width="2"/><text x="427" y="210" font-size="20" font-weight="800" fill="#173f34">过程跟进</text><text x="427" y="247" font-size="16" fill="#607068">进度 / 风险</text></g><path d="M525 227h55" stroke="#1f6547" stroke-width="5"/><path d="M580 227l-15-10v20z" fill="#1f6547"/><g><rect x="590" y="155" width="175" height="145" rx="20" fill="#eef4ef" stroke="#1f6547" stroke-width="2"/><text x="677" y="210" font-size="20" font-weight="800" fill="#173f34">节点检查</text><text x="677" y="247" font-size="16" fill="#607068">偏差 / 证据</text></g><path d="M775 227h55" stroke="#1f6547" stroke-width="5"/><path d="M830 227l-15-10v20z" fill="#1f6547"/><g><rect x="840" y="155" width="175" height="145" rx="20" fill="#173f34"/><text x="927" y="210" font-size="20" font-weight="800" fill="#e5c46f">结果验收</text><text x="927" y="247" font-size="16" fill="#fff">达标 / 未达标</text></g><path d="M1025 227h55" stroke="#b89448" stroke-width="5"/><path d="M1080 227l-15-10v20z" fill="#b89448"/><g><rect x="1090" y="170" width="80" height="115" rx="18" fill="#fff7e8" stroke="#b89448" stroke-width="2"/><text x="1130" y="210" font-size="18" font-weight="800" fill="#6d5523">异常</text><text x="1130" y="240" font-size="18" font-weight="800" fill="#6d5523">改善</text></g><path d="M1130 305v55H160v-45" fill="none" stroke="#b89448" stroke-width="3" stroke-dasharray="10 8"/><path d="M160 315l-10 15h20z" fill="#b89448"/><text x="645" y="389" font-size="18" font-weight="700" fill="#315b4b">任务下达 → 过程跟进 → 节点检查 → 结果验收 → 异常改善</text></g></svg>