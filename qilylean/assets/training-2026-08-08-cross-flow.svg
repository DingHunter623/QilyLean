<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">跨部门流程接口</title><desc id="d">输入、责任岗位、流程步骤、输出、验收标准与异常升级</desc><rect width="1200" height="440" rx="28" fill="#f7f8f5"/><text x="56" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="800" fill="#173f34">跨部门协同｜流程接口</text><text x="56" y="108" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#607068">把“谁负责、交给谁、做到什么程度”说清楚</text><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g><rect x="50" y="170" width="155" height="105" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><text x="127" y="210" font-size="20" font-weight="800" fill="#173f34">输入</text><text x="127" y="242" font-size="16" fill="#607068">需求 / 资料</text></g><path d="M215 222h45" stroke="#1f6547" stroke-width="5"/><path d="M260 222l-15-10v20z" fill="#1f6547"/><g><rect x="270" y="170" width="165" height="105" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><text x="352" y="210" font-size="20" font-weight="800" fill="#173f34">责任岗位</text><text x="352" y="242" font-size="16" fill="#607068">主责 / 协同</text></g><path d="M445 222h45" stroke="#1f6547" stroke-width="5"/><path d="M490 222l-15-10v20z" fill="#1f6547"/><g><rect x="500" y="145" width="195" height="155" rx="20" fill="#edf4ef" stroke="#1f6547" stroke-width="3"/><text x="597" y="195" font-size="21" font-weight="800" fill="#173f34">流程步骤</text><text x="597" y="230" font-size="16" fill="#607068">动作 · 节点 · 时限</text><text x="597" y="260" font-size="16" fill="#607068">信息传递 · 记录</text></g><path d="M705 222h45" stroke="#1f6547" stroke-width="5"/><path d="M750 222l-15-10v20z" fill="#1f6547"/><g><rect x="760" y="170" width="155" height="105" rx="18" fill="#fff" stroke="#b89448" stroke-width="2"/><text x="837" y="210" font-size="20" font-weight="800" fill="#173f34">输出</text><text x="837" y="242" font-size="16" fill="#607068">结果 / 文件</text></g><path d="M925 222h45" stroke="#1f6547" stroke-width="5"/><path d="M970 222l-15-10v20z" fill="#1f6547"/><g><rect x="980" y="170" width="170" height="105" rx="18" fill="#173f34"/><text x="1065" y="210" font-size="20" font-weight="800" fill="#e5c46f">验收标准</text><text x="1065" y="242" font-size="16" fill="#fff">完成 / 不通过</text></g><path d="M1065 295v55H350" fill="none" stroke="#b89448" stroke-width="3" stroke-dasharray="10 8"/><path d="M350 350l15-10v20z" fill="#b89448"/><rect x="350" y="328" width="300" height="44" rx="22" fill="#fff7e8" stroke="#b89448"/><text x="500" y="356" font-size="18" font-weight="800" fill="#6d5523">异常升级 / 重新协同</text></g></svg>