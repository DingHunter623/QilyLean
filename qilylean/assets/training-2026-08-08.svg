<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163f47"/><stop offset="1" stop-color="#365d52"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter>
</defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<circle cx="930" cy="120" r="230" fill="#fff" opacity=".05"/>
<circle cx="1010" cy="430" r="310" fill="#fff" opacity=".035"/>
