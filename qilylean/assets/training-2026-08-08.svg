<text x="66" y="292" fill="#dfece7" font-size="28">目标 · 岗位 · 流程 · 标准 · 执行 · 检查 · 改善</text>
<g filter="url(#shadow)">
  <rect x="66" y="370" width="948" height="380" rx="30" fill="#fff" opacity=".10"/>
  <g font-size="24" font-weight="800" text-anchor="middle">
    <rect x="95" y="438" width="170" height="74" rx="20" fill="#f3ead4"/><text x="180" y="485" fill="#173f47">SMART目标</text>
