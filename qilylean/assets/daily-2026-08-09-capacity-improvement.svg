<text x="720" y="158" text-anchor="middle" class="sub">当目标逼近或超过上限，管理动作必须从“优化”切换为“突破约束”。</text>
<rect x="35" y="230" width="480" height="92" rx="15" fill="#fff" stroke="#0f6f78" stroke-width="2"/><circle cx="82" cy="276" r="34" fill="#0f6f78"/><text x="82" y="286" text-anchor="middle" font-size="34" class="white" font-weight="900">1</text><text x="135" y="269" class="h" fill="#0f6f78">当前 Current</text><text x="360" y="288" class="num" fill="#0f6f78">800件/天</text><rect x="535" y="240" width="346.66666666666663" height="62" rx="4" fill="#0f6f78"/><text x="891.6666666666666" y="282" class="b">800</text><rect x="35" y="342" width="480" height="92" rx="15" fill="#fff" stroke="#0f6f78" stroke-width="2"/><circle cx="82" cy="388" r="34" fill="#0f6f78"/><text x="82" y="398" text-anchor="middle" font-size="34" class="white" font-weight="900">2</text><text x="135" y="381" class="h" fill="#0f6f78">目标 Target</text><text x="360" y="400" class="num" fill="#0f6f78">900件/天</text><rect x="535" y="352" width="390" height="62" rx="4" fill="#0f6f78"/><text x="935" y="394" class="b">900</text><rect x="35" y="454" width="480" height="92" rx="15" fill="#fff" stroke="#c88d00" stroke-width="2"/><circle cx="82" cy="500" r="34" fill="#c88d00"/><text x="82" y="510" text-anchor="middle" font-size="34" class="white" font-weight="900">3</text><text x="135" y="493" class="h" fill="#c88d00">挑战目标 Stretch</text><text x="360" y="512" class="num" fill="#c88d00">980件/天</text><rect x="535" y="464" width="424.6666666666667" height="62" rx="4" fill="#c88d00"/><text x="969.6666666666667" y="506" class="b">980</text><rect x="35" y="566" width="480" height="92" rx="15" fill="#fff" stroke="#0f6f78" stroke-width="2"/><circle cx="82" cy="612" r="34" fill="#0f6f78"/><text x="82" y="622" text-anchor="middle" font-size="34" class="white" font-weight="900">4</text><text x="135" y="605" class="h" fill="#0f6f78">天花板 Ceiling</text><text x="360" y="624" class="num" fill="#0f6f78">1000件/天</text><rect x="535" y="576" width="433.33333333333337" height="62" rx="4" fill="#0f6f78"/><text x="978.3333333333334" y="618" class="b">1000</text><rect x="35" y="678" width="480" height="92" rx="15" fill="#fff" stroke="#1f653d" stroke-width="2"/><circle cx="82" cy="724" r="34" fill="#1f653d"/><text x="82" y="734" text-anchor="middle" font-size="34" class="white" font-weight="900">5</text><text x="135" y="717" class="h" fill="#1f653d">标杆 Benchmark</text><text x="360" y="736" class="num" fill="#1f653d">1100件/天</text><rect x="535" y="688" width="476.66666666666663" height="62" rx="4" fill="#1f653d"/><text x="1021.6666666666666" y="730" class="b">1100</text><line x1="968.3333333333334" y1="205" x2="968.3333333333334" y2="790" stroke="#0f6f78" stroke-width="3" stroke-dasharray="9 9"/><text x="930" y="330" class="b" fill="#0f6f78">1000件/天</text><text x="930" y="360" class="s">现有人机料法条件下</text><line x1="1011.6666666666666" y1="205" x2="1011.6666666666666" y2="790" stroke="#1f653d" stroke-width="3" stroke-dasharray="9 9"/><text x="1010" y="665" class="b" fill="#1f653d">1100件/天</text><text x="1010" y="695" class="s">行业优秀线体参考</text><rect x="1125" y="220" width="280" height="570" rx="18" fill="#fff" stroke="#0f6f78" stroke-width="2"/><rect x="1140" y="238" width="250" height="54" rx="12" fill="#0f6f78"/><text x="1265" y="275" text-anchor="middle" class="h white">产线概览</text><text x="1160" y="330" class="b">OEE</text><path d="M1185 430 A80 80 0 0 1 1345 430" fill="none" stroke="#d8e5e5" stroke-width="25"/><path d="M1185 430 A80 80 0 0 1 1315 365" fill="none" stroke="#0f6f78" stroke-width="25"/><text x="1265" y="420" text-anchor="middle" font-size="40" font-weight="900">78%</text><text x="1160" y="485" class="b">产出趋势（件/天）</text><polyline points="1170,565 1205,545 1240,558 1275,530 1310,548 1345,515" fill="none" stroke="#0f6f78" stroke-width="6"/><circle cx="1170" cy="565" r="7" fill="#0f6f78"/><circle cx="1205" cy="545" r="7" fill="#0f6f78"/><circle cx="1240" cy="558" r="7" fill="#0f6f78"/><circle cx="1275" cy="530" r="7" fill="#0f6f78"/><circle cx="1310" cy="548" r="7" fill="#0f6f78"/><circle cx="1345" cy="515" r="7" fill="#0f6f78"/><text x="1160" y="630" class="b">生产线示意</text><rect x="1170" y="715" width="180" height="18" rx="8" fill="#738b8d"/><rect x="1190" y="685" width="35" height="30" fill="#aabbbc"/><rect x="1250" y="675" width="35" height="40" fill="#aabbbc"/><rect x="1310" y="660" width="50" height="55" fill="#6b8487"/><rect x="35" y="840" width="670" height="120" rx="18" fill="#eef7f6" stroke="#0f6f78" stroke-width="2"/><text x="75" y="885" class="h teal">当目标 ≤ 天花板：</text><text x="75" y="925" class="b">优先通过排程、线平衡、标准作业、换型改善推进。</text><rect x="735" y="840" width="670" height="120" rx="18" fill="#fff8e8" stroke="#c88d00" stroke-width="2"/><text x="775" y="885" class="h gold">当目标 &gt; 天花板：</text><text x="775" y="925" class="b">需要增加设备、人力、工装、工艺或布局资源。</text>
