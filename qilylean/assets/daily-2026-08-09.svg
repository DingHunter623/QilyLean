<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">天花板不是努力目标｜2026-08-09 今日简报</title>
  <desc id="desc">用 Ceiling、Benchmark、Target、Stretch Target 区分上限、标杆、目标和挑战目标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4b5a"/>
      <stop offset="1" stop-color="#177f87"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" rx="48" fill="url(#bg)"/>
  <rect x="72" y="72" width="936" height="936" rx="34" fill="#ffffff" opacity="0.96"/>
  <text x="112" y="150" fill="#177f87" font-size="30" font-weight="800" letter-spacing="3">QilyLean｜启力精益 · DAILY ENGINEERING BRIEF</text>
  <text x="112" y="245" fill="#0f4b5a" font-size="68" font-weight="900">“天花板”不是努力目标</text>
  <text x="112" y="310" fill="#526967" font-size="30">上限、标杆、目标、挑战目标必须分开</text>

  <line x1="150" y1="435" x2="930" y2="435" stroke="#caa15f" stroke-width="16" stroke-linecap="round"/>
  <text x="150" y="407" fill="#765416" font-size="26" font-weight="800">Ceiling｜天花板＝现阶段能力上限</text>

  <g font-family="sans-serif">
    <rect x="150" y="520" width="190" height="210" rx="18" fill="#edf7f6" stroke="#9ac9c7"/>
    <text x="245" y="575" text-anchor="middle" fill="#0f4b5a" font-size="24" font-weight="900">CURRENT</text>
    <text x="245" y="635" text-anchor="middle" fill="#182420" font-size="54" font-weight="900">80</text>
    <text x="245" y="686" text-anchor="middle" fill="#526967" font-size="22">当前基准</text>

    <rect x="360" y="480" width="190" height="250" rx="18" fill="#e8f3f4" stroke="#7db6ba"/>
    <text x="455" y="535" text-anchor="middle" fill="#0f4b5a" font-size="24" font-weight="900">TARGET</text>
    <text x="455" y="605" text-anchor="middle" fill="#182420" font-size="54" font-weight="900">90</text>
    <text x="455" y="656" text-anchor="middle" fill="#526967" font-size="22">阶段目标</text>

    <rect x="570" y="440" width="190" height="290" rx="18" fill="#fff8e8" stroke="#d8b66e"/>
    <text x="665" y="495" text-anchor="middle" fill="#765416" font-size="22" font-weight="900">STRETCH</text>
    <text x="665" y="570" text-anchor="middle" fill="#182420" font-size="54" font-weight="900">100</text>
    <text x="665" y="621" text-anchor="middle" fill="#526967" font-size="22">挑战目标</text>

    <rect x="780" y="400" width="150" height="330" rx="18" fill="#f2f4f4" stroke="#a9b9b8"/>
    <text x="855" y="455" text-anchor="middle" fill="#0f4b5a" font-size="20" font-weight="900">BENCHMARK</text>
    <text x="855" y="535" text-anchor="middle" fill="#182420" font-size="50" font-weight="900">110</text>
    <text x="855" y="586" text-anchor="middle" fill="#526967" font-size="21">标杆水平</text>
  </g>

  <path d="M150 805 H930" stroke="#0f4b5a" stroke-width="5" stroke-dasharray="14 12"/>
  <text x="150" y="858" fill="#0f4b5a" font-size="30" font-weight="900">约 120：现阶段天花板</text>
  <text x="150" y="905" fill="#526967" font-size="24">若要再突破，必须改变设备、工艺、布局或资源约束。</text>
  <text x="112" y="975" fill="#177f87" font-size="25" font-weight="800">2026-08-09｜职场术语与目标管理</text>
</svg>