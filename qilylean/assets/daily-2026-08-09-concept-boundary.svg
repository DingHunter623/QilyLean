<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="概念边界简图｜天花板、标杆、目标、挑战目标">
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#12313a}.title{font-size:58px;font-weight:900}.sub{font-size:25px;fill:#526967}.h{font-size:29px;font-weight:850}.b{font-size:22px}.s{font-size:18px;fill:#526967}.num{font-size:30px;font-weight:900}.white{fill:#fff}.teal{fill:#0f6f78}.green{fill:#1f653d}.gold{fill:#c88d00}</style>
<rect width="1440" height="1080" fill="#fff"/>
<text x="720" y="76" text-anchor="middle" class="title">概念边界简图｜天花板、标杆、目标、挑战目标</text>
<line x1="490" y1="111" x2="675" y2="111" stroke="#0f6f78" stroke-width="4"/><circle cx="720" cy="111" r="7" fill="#c88d00"/><line x1="765" y1="111" x2="950" y2="111" stroke="#0f6f78" stroke-width="4"/>
<text x="720" y="158" text-anchor="middle" class="sub">把上限、对标、目标和挑战分开，管理口径才不会混乱。</text>
<g transform="translate(35,220)"><rect width="325" height="690" rx="20" fill="#fff" stroke="#0f6f78" stroke-width="2"/><rect width="325" height="88" rx="20" fill="#0f6f78"/><rect y="70" width="325" height="18" fill="#0f6f78"/><circle cx="48" cy="44" r="29" fill="#fff"/><text x="48" y="54" text-anchor="middle" class="num" fill="#0f6f78">01</text><text x="92" y="54" class="h white">天花板 Ceiling</text><text x="162" y="255" text-anchor="middle" font-size="125" font-weight="900" fill="#0f6f78">▲</text><line x1="22" y1="330" x2="303" y2="330" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="350" width="76" height="48" rx="10" fill="#0f6f78"/><text x="60" y="382" text-anchor="middle" class="b white" font-weight="800">定义</text><text x="118" y="372" class="b">既定条件下</text><text x="118" y="404" class="b">可达到的上限</text><line x1="22" y1="440" x2="303" y2="440" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="466" width="76" height="76" rx="10" fill="#0f6f78"/><text x="60" y="498" text-anchor="middle" class="b white" font-weight="800">管理</text><text x="60" y="528" text-anchor="middle" class="b white" font-weight="800">意义</text><text x="118" y="487" class="b">要突破，通常需要改变</text><text x="118" y="521" class="b">资源、技术、流程</text><text x="118" y="555" class="b">或组织约束。</text></g><g transform="translate(382,220)"><rect width="325" height="690" rx="20" fill="#fff" stroke="#1f653d" stroke-width="2"/><rect width="325" height="88" rx="20" fill="#1f653d"/><rect y="70" width="325" height="18" fill="#1f653d"/><circle cx="48" cy="44" r="29" fill="#fff"/><text x="48" y="54" text-anchor="middle" class="num" fill="#1f653d">02</text><text x="92" y="54" class="h white">标杆 Benchmark</text><text x="162" y="255" text-anchor="middle" font-size="125" font-weight="900" fill="#1f653d">⚑</text><line x1="22" y1="330" x2="303" y2="330" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="350" width="76" height="48" rx="10" fill="#1f653d"/><text x="60" y="382" text-anchor="middle" class="b white" font-weight="800">定义</text><text x="118" y="372" class="b">外部或内部优秀</text><text x="118" y="404" class="b">参照水平</text><line x1="22" y1="440" x2="303" y2="440" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="466" width="76" height="76" rx="10" fill="#1f653d"/><text x="60" y="498" text-anchor="middle" class="b white" font-weight="800">管理</text><text x="60" y="528" text-anchor="middle" class="b white" font-weight="800">意义</text><text x="118" y="487" class="b">用于对标学习，</text><text x="118" y="521" class="b">不等于本期</text><text x="118" y="555" class="b">必达目标。</text></g><g transform="translate(729,220)"><rect width="325" height="690" rx="20" fill="#fff" stroke="#0f6f78" stroke-width="2"/><rect width="325" height="88" rx="20" fill="#0f6f78"/><rect y="70" width="325" height="18" fill="#0f6f78"/><circle cx="48" cy="44" r="29" fill="#fff"/><text x="48" y="54" text-anchor="middle" class="num" fill="#0f6f78">03</text><text x="92" y="54" class="h white">目标 Target</text><text x="162" y="255" text-anchor="middle" font-size="125" font-weight="900" fill="#0f6f78">◎</text><line x1="22" y1="330" x2="303" y2="330" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="350" width="76" height="48" rx="10" fill="#0f6f78"/><text x="60" y="382" text-anchor="middle" class="b white" font-weight="800">定义</text><text x="118" y="372" class="b">本期必须达成的</text><text x="118" y="404" class="b">结果值</text><line x1="22" y1="440" x2="303" y2="440" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="466" width="76" height="76" rx="10" fill="#0f6f78"/><text x="60" y="498" text-anchor="middle" class="b white" font-weight="800">管理</text><text x="60" y="528" text-anchor="middle" class="b white" font-weight="800">意义</text><text x="118" y="487" class="b">应满足 SMART，</text><text x="118" y="521" class="b">可检查、可追踪。</text></g><g transform="translate(1076,220)"><rect width="325" height="690" rx="20" fill="#fff" stroke="#c88d00" stroke-width="2"/><rect width="325" height="88" rx="20" fill="#c88d00"/><rect y="70" width="325" height="18" fill="#c88d00"/><circle cx="48" cy="44" r="29" fill="#fff"/><text x="48" y="54" text-anchor="middle" class="num" fill="#c88d00">04</text><text x="92" y="54" class="h white">挑战目标</text><text x="162" y="255" text-anchor="middle" font-size="125" font-weight="900" fill="#c88d00">↗</text><line x1="22" y1="330" x2="303" y2="330" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="350" width="76" height="48" rx="10" fill="#c88d00"/><text x="60" y="382" text-anchor="middle" class="b white" font-weight="800">定义</text><text x="118" y="372" class="b">通过改善努力争取的</text><text x="118" y="404" class="b">更高目标</text><line x1="22" y1="440" x2="303" y2="440" stroke="#d5e4e3" stroke-width="2"/><rect x="22" y="466" width="76" height="76" rx="10" fill="#c88d00"/><text x="60" y="498" text-anchor="middle" class="b white" font-weight="800">管理</text><text x="60" y="528" text-anchor="middle" class="b white" font-weight="800">意义</text><text x="118" y="487" class="b">通常高于常规目标，</text><text x="118" y="521" class="b">但不应被误说成</text><text x="118" y="555" class="b">天花板。</text></g><rect x="35" y="930" width="1370" height="70" rx="16" fill="#eef7f6" stroke="#0f6f78" stroke-width="2"/><text x="75" y="974" class="h teal">一句话：</text><text x="220" y="974" class="b">天花板是上限；标杆是参照；目标是必须达成；挑战目标是努力争取。</text>
<line x1="40" y1="1030" x2="520" y2="1030" stroke="#0f6f78" stroke-width="3"/><text x="720" y="1041" text-anchor="middle" font-size="26" font-weight="800">QilyLean｜启力精益</text><line x1="920" y1="1030" x2="1400" y2="1030" stroke="#0f6f78" stroke-width="3"/>
</svg>
