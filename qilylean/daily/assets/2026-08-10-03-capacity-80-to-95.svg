<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">装配线UPPH从80提升到95的正确改善路径</title><desc id="d">先识别瓶颈与损失，再平衡工位和Pilot验证，最后稳定达到UPPH 95并控制质量和在制品。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#0f4b5a;font-weight:800}.s{fill:#56706d}.box{fill:#fff;stroke:#b8d0cc;stroke-width:2}.accent{fill:#e9f6f4;stroke:#178b94;stroke-width:2}.gold{fill:#fff8e8;stroke:#caa15f;stroke-width:2}.line{stroke:#178b94;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.muted{stroke:#9bb7b2;stroke-width:2;fill:none}</style><rect width="1200" height="470" fill="#f7fbfa"/><text x="60" y="65" class="t" font-size="30">现场案例：不是“催快一点”，而是把损失结构做清楚</text><g transform="translate(70 120)"><rect class="box" x="0" y="40" width="250" height="210" rx="22"/><text class="t" x="125" y="88" text-anchor="middle" font-size="24">现状 UPPH 80</text><text class="s" x="125" y="128" text-anchor="middle" font-size="17">瓶颈工位 / 换型</text><text class="s" x="125" y="160" text-anchor="middle" font-size="17">缺料等待 / 返工</text><text class="s" x="125" y="192" text-anchor="middle" font-size="17">线平衡 / 人员配置</text><path class="line" d="M250 145h95"/><path class="line" d="M328 132l18 13-18 13"/><rect class="accent" x="345" y="0" width="360" height="290" rx="24"/><text class="t" x="525" y="54" text-anchor="middle" font-size="24">工程化改善</text><g class="s" font-size="17"><text x="390" y="105">① CT + 标工基线</text><text x="390" y="140">② 瓶颈与损失Pareto</text><text x="390" y="175">③ 工位平衡 / SMED / 供料</text><text x="390" y="210">④ 小范围Pilot</text><text x="390" y="245">⑤ FPY / WIP / OEE同步验证</text></g><path class="line" d="M705 145h95"/><path class="line" d="M783 132l18 13-18 13"/><rect class="gold" x="800" y="40" width="270" height="210" rx="22"/><text class="t" x="935" y="88" text-anchor="middle" font-size="24">稳定 UPPH 95</text><text class="s" x="935" y="130" text-anchor="middle" font-size="17">质量不下降</text><text class="s" x="935" y="162" text-anchor="middle" font-size="17">WIP不恶化</text><text class="s" x="935" y="194" text-anchor="middle" font-size="17">人力/设备不过载</text></g><text x="600" y="430" text-anchor="middle" class="s" font-size="18">真正的产能提升 = 吞吐提升，同时守住质量、在制品、资源与安全边界。</text></svg>
