<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">职能含金量六问检核</title><desc id="d">从问题定义、数据基线、方案边界、跨部门协同、结果验收和固化复制六方面进行证据型检核。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#0f4b5a;font-weight:800}.s{fill:#56706d}.box{fill:#fff;stroke:#b8d0cc;stroke-width:2}.accent{fill:#e9f6f4;stroke:#178b94;stroke-width:2}.gold{fill:#fff8e8;stroke:#caa15f;stroke-width:2}.line{stroke:#178b94;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.muted{stroke:#9bb7b2;stroke-width:2;fill:none}</style><rect width="1200" height="520" fill="#f7fbfa"/><text x="60" y="65" class="t" font-size="30">六问检核：不要问“忙不忙”，要问“证据在哪里”</text><g transform="translate(600 280)"><circle r="96" class="gold"/><text text-anchor="middle" class="t" font-size="28" y="-5">证据型</text><text text-anchor="middle" class="t" font-size="28" y="30">岗位价值</text><g font-size="17" text-anchor="middle"><g transform="translate(-340 -120)"><rect x="-120" y="-48" width="240" height="96" rx="18" class="box"/><text class="t" y="-5">① 定义问题</text><text class="s" y="25">不是只等派单</text></g><g transform="translate(0 -175)"><rect x="-120" y="-48" width="240" height="96" rx="18" class="box"/><text class="t" y="-5">② 数据基线</text><text class="s" y="25">不是凭感觉</text></g><g transform="translate(340 -120)"><rect x="-120" y="-48" width="240" height="96" rx="18" class="box"/><text class="t" y="-5">③ 方案边界</text><text class="s" y="25">不是喊口号</text></g><g transform="translate(-340 120)"><rect x="-120" y="-48" width="240" height="96" rx="18" class="box"/><text class="t" y="-5">④ 责任协同</text><text class="s" y="25">不是转发信息</text></g><g transform="translate(0 175)"><rect x="-120" y="-48" width="240" height="96" rx="18" class="accent"/><text class="t" y="-5">⑤ 结果验收</text><text class="s" y="25">数据 + 证据</text></g><g transform="translate(340 120)"><rect x="-120" y="-48" width="240" height="96" rx="18" class="accent"/><text class="t" y="-5">⑥ 固化复制</text><text class="s" y="25">标准 + 机制</text></g></g><path class="muted" d="M-245-83L-88-25M0-127V-96M245-83L88-25M-245 83L-88 25M0 127V96M245 83L88 25"/></g></svg>
