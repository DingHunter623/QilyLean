<svg xmlns="http://www.w3.org/2000/svg" width="720" height="574" viewBox="0 0 720 574" role="img" aria-labelledby="title desc"><title id="title">时间标准的双重保护</title><desc id="desc">客户端的质量要求和制造端的成本控制共同约束时间标准；检查内容变化后共同验证并更新工时、产能和人机配置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#178B94"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect width="720" height="574" rx="18" fill="#EEF7F5"/><text x="36" y="44" text-anchor="start" font-size="20" fill="#073C47" font-weight="800">时间标准的双重保护</text><path d="M36 62H684" stroke="#CAA15F" stroke-width="3"/><rect x="28" y="82" width="320" height="170" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="188" y="116" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">客户端｜质量保证</text><text x="188" y="150" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">必要操作完整</text><text x="188" y="180" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">自检确认到位</text><text x="188" y="210" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">质量风险受控</text><rect x="372" y="82" width="320" height="170" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="532" y="116" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">制造端｜成本控制</text><text x="532" y="150" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">作业方法合理</text><text x="532" y="180" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">无效动作减少</text><text x="532" y="210" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">人员负荷适当</text><path d="M188 254V280H292V296" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><path d="M532 254V280H428V296" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><rect x="100" y="304" width="520" height="86" rx="12" fill="#0F4B5A" stroke="#B8D6D2" stroke-width="2"/><text x="360" y="338" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="750">共同核定时间标准</text><text x="360" y="368" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">完整作业 + 必要质量确认</text><path d="M360 392V414" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><rect x="100" y="422" width="520" height="106" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="360" y="456" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">质量要求发生变化时</text><text x="360" y="486" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">工程 · 生产 · 品质共同验证</text><text x="360" y="514" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">更新工时 · 产能 · 人机配置</text><text x="360" y="554" text-anchor="middle" font-size="14" fill="#9E4A34" font-weight="700">省略必要检查所得产出，不作为标准产能</text></g></svg>