<svg xmlns="http://www.w3.org/2000/svg" width="720" height="532" viewBox="0 0 720 532" role="img" aria-labelledby="title desc"><title id="title">释放产能，怎样转化为经营回报</title><desc id="desc">教学推演：相同作业与质量条件下，十人产出由八人完成。两人的作业能力释放需要进一步安排与验证，不能直接算作工资节省。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#178B94"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect width="720" height="532" rx="18" fill="#EEF7F5"/><text x="36" y="44" text-anchor="start" font-size="20" fill="#073C47" font-weight="800">释放产能，怎样转化为经营回报</text><path d="M36 62H684" stroke="#CAA15F" stroke-width="3"/><rect x="60" y="82" width="600" height="96" rx="12" fill="#0F4B5A" stroke="#B8D6D2" stroke-width="2"/><text x="360" y="116" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="750">教学推演｜10人 → 8人</text><text x="360" y="148" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">相同产量 · 相同质量 · 可比工时</text><path d="M360 180V202" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="210" width="480" height="88" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="360" y="244" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">释放2人的作业能力</text><text x="360" y="274" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">先确认能力，再安排转化</text><path d="M360 300V322H188V338" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><path d="M360 322H532V338" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><rect x="28" y="346" width="320" height="124" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="188" y="380" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">费用变化</text><text x="188" y="412" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">减少加班或外协</text><text x="188" y="442" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">核实实际费用下降</text><rect x="372" y="346" width="320" height="124" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="532" y="380" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">能力应用</text><text x="532" y="412" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">承接订单或避免招聘</text><text x="532" y="442" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">分别验证贡献或依据</text><text x="360" y="496" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="700">未转化：报告产能释放，继续跟进</text><text x="360" y="520" text-anchor="middle" font-size="14" fill="#9E4A34" font-weight="700">不直接等同于两个人的工资节省</text></g></svg>