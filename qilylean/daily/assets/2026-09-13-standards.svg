<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466" role="img" aria-labelledby="title desc"><title id="title">两类标准化，共同保障稳定运行</title><desc id="desc">管理层以流程、时间管理和异常闭环支持现场；一线以作业顺序、标准作业时间与标准在制品运行，并反馈异常。</desc><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect width="720" height="466" rx="18" fill="#EEF7F5"/><text x="36" y="44" text-anchor="start" font-size="20" fill="#073C47" font-weight="800">两类标准化，共同保障稳定运行</text><path d="M36 62H684" stroke="#CAA15F" stroke-width="3"/><rect x="28" y="82" width="320" height="184" rx="12" fill="#0F4B5A" stroke="#B8D6D2" stroke-width="2"/><text x="188" y="116" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="750">管理层标准化工作</text><text x="188" y="150" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">业务流程与责任</text><text x="188" y="180" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">时间安排与频次</text><text x="188" y="210" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">检查与异常闭环</text><rect x="372" y="82" width="320" height="184" rx="12" fill="#0F4B5A" stroke="#B8D6D2" stroke-width="2"/><text x="532" y="116" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="750">一线标准化作业</text><text x="532" y="150" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">标准作业顺序</text><text x="532" y="180" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">标准作业时间</text><text x="532" y="210" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="500">标准在制品</text><path d="M186 268H190V298H278V307H283.5L276 318L268.5 307H274V302H186Z" fill="#178B94" data-qily-unified-arrow="v4"/><path d="M530 268H534V302H446V307H451.5L444 318L436.5 307H442V298H530Z" fill="#178B94" data-qily-unified-arrow="v4"/><text x="184" y="294" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="650">计划与资源</text><text x="536" y="294" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="650">执行与反馈</text><rect x="100" y="328" width="520" height="110" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="360" y="362" text-anchor="middle" font-size="18" fill="#0F4B5A" font-weight="750">稳定运行与持续改善</text><text x="360" y="394" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">质量可保证 · 过程可重复</text><text x="360" y="422" text-anchor="middle" font-size="14" fill="#0F4B5A" font-weight="500">问题可关闭 · 标准可更新</text></g></svg>