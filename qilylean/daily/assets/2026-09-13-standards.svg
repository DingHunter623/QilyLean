<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">两类标准化，共同保障稳定运行</title><desc id="desc">管理层以流程、时间管理和异常闭环支持现场；一线以作业顺序、时间与标准在制品运行，并反馈异常。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#178B94"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect width="720" height="700" rx="18" fill="#EEF7F5"/><text x="36" y="58" text-anchor="start" font-size="34" fill="#073C47" font-weight="800">两类标准化，共同保障稳定运行</text><path d="M36 84H684" stroke="#CAA15F" stroke-width="3"/><rect x="28" y="114" width="320" height="260" rx="12" fill="#0F4B5A" stroke="#B8D6D2" stroke-width="2"/><text x="188.0" y="160" text-anchor="middle" font-size="32" fill="#FFFFFF" font-weight="750">管理层标准化工作</text><text x="188.0" y="204" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="500">业务流程与责任</text><text x="188.0" y="246" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="500">时间安排与频次</text><text x="188.0" y="288" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="500">检查与异常闭环</text><rect x="372" y="114" width="320" height="260" rx="12" fill="#0F4B5A" stroke="#B8D6D2" stroke-width="2"/><text x="532.0" y="160" text-anchor="middle" font-size="32" fill="#FFFFFF" font-weight="750">一线标准化作业</text><text x="532.0" y="204" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="500">标准作业顺序</text><text x="532.0" y="246" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="500">时间要求</text><text x="532.0" y="288" text-anchor="middle" font-size="28" fill="#FFFFFF" font-weight="500">标准在制品</text><path d="M186 377V435H276V474" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><path d="M532 377V435H444V474" fill="none" stroke="#178B94" stroke-width="4" marker-end="url(#arrow)"/><text x="183" y="419" text-anchor="middle" font-size="26" fill="#0F4B5A" font-weight="650">计划与资源</text><text x="534" y="419" text-anchor="middle" font-size="26" fill="#0F4B5A" font-weight="650">执行与反馈</text><rect x="100" y="484" width="520" height="160" rx="12" fill="#FFFFFF" stroke="#B8D6D2" stroke-width="2"/><text x="360.0" y="530" text-anchor="middle" font-size="32" fill="#0F4B5A" font-weight="750">稳定运行与持续改善</text><text x="360.0" y="574" text-anchor="middle" font-size="28" fill="#0F4B5A" font-weight="500">质量可保证 · 过程可重复</text><text x="360.0" y="616" text-anchor="middle" font-size="28" fill="#0F4B5A" font-weight="500">问题可关闭 · 标准可更新</text></g></svg>