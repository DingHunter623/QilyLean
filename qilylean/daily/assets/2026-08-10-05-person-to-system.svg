<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">从个人经验到组织能力</title><desc id="d">将个人经验沉淀为标准、流程、数据规则和培训，最终形成组织可复制能力。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#0f4b5a;font-weight:800}.s{fill:#56706d}.box{fill:#fff;stroke:#b8d0cc;stroke-width:2}.accent{fill:#e9f6f4;stroke:#178b94;stroke-width:2}.gold{fill:#fff8e8;stroke:#caa15f;stroke-width:2}.line{stroke:#178b94;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.muted{stroke:#9bb7b2;stroke-width:2;fill:none}</style><rect width="1200" height="430" fill="#f7fbfa"/><text x="60" y="65" class="t" font-size="30">职能的最高级：把“能人能力”变成“组织机制”</text><g transform="translate(70 145)" font-size="17" text-anchor="middle"><rect class="box" x="0" y="0" width="180" height="150" rx="22"/><text class="t" x="90" y="58" font-size="23">个人经验</text><text class="s" x="90" y="92">只有少数人会</text><path class="line" d="M180 75h48"/><path class="line" d="M214 62l16 13-16 13"/><rect class="accent" x="230" y="0" width="180" height="150" rx="22"/><text class="t" x="320" y="58" font-size="23">标准</text><text class="s" x="320" y="92">SOP / OPL</text><path class="line" d="M410 75h48"/><path class="line" d="M444 62l16 13-16 13"/><rect class="accent" x="460" y="0" width="180" height="150" rx="22"/><text class="t" x="550" y="58" font-size="23">流程与数据</text><text class="s" x="550" y="92">规则 / 版本 / 稽核</text><path class="line" d="M640 75h48"/><path class="line" d="M674 62l16 13-16 13"/><rect class="accent" x="690" y="0" width="180" height="150" rx="22"/><text class="t" x="780" y="58" font-size="23">培训复制</text><text class="s" x="780" y="92">多数人做对</text><path class="line" d="M870 75h48"/><path class="line" d="M904 62l16 13-16 13"/><rect class="gold" x="920" y="0" width="190" height="150" rx="22"/><text class="t" x="1015" y="58" font-size="23">组织能力</text><text class="s" x="1015" y="92">稳定 / 可复制</text></g><text x="600" y="365" text-anchor="middle" class="s" font-size="18">“离不开我”是单点风险；“按机制也能稳定做对”才是能力沉淀。</text></svg>
