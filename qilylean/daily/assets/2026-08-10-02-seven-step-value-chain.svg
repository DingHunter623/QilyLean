<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">岗位价值七步闭环</title><desc id="d">问题识别、数据基线、方案设计、责任协同、Pilot验证、结果验收和机制固化。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.t{fill:#0f4b5a;font-weight:800}.s{fill:#56706d}.box{fill:#fff;stroke:#b8d0cc;stroke-width:2}.accent{fill:#e9f6f4;stroke:#178b94;stroke-width:2}.gold{fill:#fff8e8;stroke:#caa15f;stroke-width:2}.line{stroke:#178b94;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.muted{stroke:#9bb7b2;stroke-width:2;fill:none}</style><rect width="1200" height="430" fill="#f7fbfa"/><text x="60" y="66" class="t" font-size="30">高含金量职能：跑通七步价值闭环</text><path class="muted" d="M110 222H1090"/><g font-size="16" text-anchor="middle"><g transform="translate(120 215)"><circle r="48" class="accent"/><text class="t" y="-4">① 问题</text><text class="s" y="23">识别差距</text></g><g transform="translate(280 215)"><circle r="48" class="box"/><text class="t" y="-4">② 基线</text><text class="s" y="23">统一事实</text></g><g transform="translate(440 215)"><circle r="48" class="box"/><text class="t" y="-4">③ 方案</text><text class="s" y="23">路径边界</text></g><g transform="translate(600 215)"><circle r="48" class="box"/><text class="t" y="-4">④ 协同</text><text class="s" y="23">RACI资源</text></g><g transform="translate(760 215)"><circle r="48" class="accent"/><text class="t" y="-4">⑤ Pilot</text><text class="s" y="23">受控试点</text></g><g transform="translate(920 215)"><circle r="48" class="gold"/><text class="t" y="-4">⑥ 验收</text><text class="s" y="23">结果证据</text></g><g transform="translate(1080 215)"><circle r="48" class="gold"/><text class="t" y="-4">⑦ 固化</text><text class="s" y="23">标准复制</text></g></g><path class="line" d="M106 340h980"/><path class="line" d="M1070 327l18 13-18 13"/><text x="600" y="382" text-anchor="middle" class="s" font-size="18">忙碌不是价值；从问题到验收、再到可复制机制，才是完整交付。</text></svg>
